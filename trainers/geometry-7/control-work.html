<style>
:root {

  --violet-dark: #35247f;
  --violet-pale: #efedff;

  --green: #245834;
  --red: #9f342b;
  --shadow: 0 12px 38px #24224c0a;
  font-family: 'Atkinson Hyperlegible Next', 'Inter', system-ui, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); }
button, input, select { font: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 3px solid #7254f3; outline-offset: 3px; }
[hidden] { display: none !important; }
.visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
.shell { width: min(100% - 48px, 1168px); margin-inline: auto; }
.banner { background: #211c4e; color: var(--white); overflow: hidden; }
.banner .shell { min-height: 190px; padding-block: 31px 35px; position: relative; }
.brand, .eyebrow { font-size: .76rem; font-weight: 750; letter-spacing: .09em; text-transform: uppercase; }
.brand { margin: 0; color: var(--lime); }
.back-link { position: relative; z-index: 1; display: inline-block; margin-bottom: 12px; color: #e1dfff; font-size: .88rem; text-underline-offset: .2em; }
.back-link:hover { color: #fff; }
.banner h1 { position: relative; z-index: 1; font-size: clamp(1.9rem, 5vw, 3.5rem); line-height: 1.03; letter-spacing: -.045em; margin: 10px 0 12px; max-width: 820px; }
.banner p:last-of-type { position: relative; z-index: 1; margin: 0; font-size: .99rem; color: #e1dfff; }
.hero-lines { position: absolute; inset: -15% -1% -20% auto; width: min(34%, 380px); height: 135%; opacity: .62; pointer-events: none; }
.toolbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; min-height: 75px; padding-block: 12px; }
.mode { display: flex; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 12px; background: var(--white); }
.mode button, .switch button { border: 0; border-radius: 8px; background: transparent; color: var(--muted); padding: 9px 12px; font-weight: 700; min-height: 40px; }
.mode button[aria-pressed=true], .switch button[aria-pressed=true] { background: var(--violet-pale); color: var(--violet-dark); }
.total { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: .86rem; font-weight: 650; }
progress { appearance: none; width: 94px; height: 7px; border: 0; border-radius: 7px; overflow: hidden; background: #dedfeb; }
progress::-webkit-progress-bar { background: #dedfeb; }
progress::-webkit-progress-value { background: var(--violet); }
progress::-moz-progress-bar { background: var(--violet); }
.workspace { display: grid; grid-template-columns: 266px minmax(0, 1fr); gap: 22px; align-items: start; padding-bottom: 38px; }
nav, .card { background: var(--white); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); }
nav { padding: 16px 12px 12px; }
.nav-head { padding-inline: 9px; }
.nav-head h2 { font-size: 1rem; margin: 0 0 7px; }
.nav-list { list-style: none; margin: 0; padding: 0; }
.nav-list li + li { margin-top: 3px; }
.nav-list button { width: 100%; border: 1px solid transparent; background: transparent; color: var(--ink); border-radius: 9px; text-align: left; padding: 9px; min-height: 42px; display: flex; align-items: center; justify-content: space-between; gap: 6px; font-size: .86rem; line-height: 1.28; }
.nav-list button:hover, .mode button:hover, .switch button:hover { background: #f4f3fb; }
.nav-list button[aria-current=true] { background: var(--violet-pale); color: var(--violet-dark); border-color: #e0d9fc; font-weight: 750; }
.nav-count { font-size: .73rem; color: var(--muted); white-space: nowrap; }
.nav-count.complete { color: var(--green); }
.nav-mobile { display: none; }
.card { padding: clamp(16px, 3.4vw, 31px); min-width: 0; }
.card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; padding-bottom: 17px; margin-bottom: 16px; border-bottom: 1px solid var(--line); }
.eyebrow { margin: 0 0 6px; color: var(--violet); }
h2 { margin: 0; font-size: clamp(1.25rem, 3vw, 2rem); line-height: 1.12; letter-spacing: -.027em; }
.goal { margin: 7px 0 0; font-size: .89rem; color: var(--muted); line-height: 1.45; }
.steps { display: flex; gap: 5px; flex-shrink: 0; }
.steps button { width: 38px; height: 38px; border-radius: 9px; border: 1px solid var(--line); background: var(--white); color: var(--muted); font-weight: 720; }
.steps button[aria-current=true] { border-color: var(--violet); background: var(--violet); color: var(--white); }
.steps button.solved:not([aria-current=true]) { background: var(--lime); border-color: #d8eb9c; color: var(--green); }
.item + .item { border-top: 1px solid var(--line); margin-top: 19px; padding-top: 19px; }
.item h3 { font-size: 1rem; margin: 0 0 6px; }
.problem { display: grid; grid-template-columns: minmax(0, 1fr) minmax(175px, .86fr); grid-template-rows: min-content 1fr; align-items: start; gap: 13px 14px; }
.problem.without-diagram { grid-template-columns: 1fr; }
.prompt { line-height: 1.54; font-weight: 620; font-size: 1rem; margin: 0; }
.figure { grid-column: 2; grid-row: 1 / 3; margin: 0; min-width: 0; background: #f4f6fd; border: 1px solid #e0e4f2; border-radius: 13px; display: flex; justify-content: center; overflow: hidden; }
.figure svg { display: block; max-width: 100%; width: 100%; max-height: 216px; }
.answers { display: grid; gap: 10px; }
.field { display: grid; align-items: center; grid-template-columns: minmax(0, 1fr) minmax(78px, 120px); gap: 8px; }
.field.full { grid-template-columns: 1fr; gap: 4px; }
.field label { font-size: .89rem; line-height: 1.3; font-weight: 640; overflow-wrap: anywhere; }
.field input, .field select, .nav-mobile select { border: 1px solid #c6cada; border-radius: 8px; color: var(--ink); background: #fff; min-height: 41px; width: 100%; padding: 7px 9px; }
.field input { padding-right: 28px; }
.field select { font-size: .89rem; }
.input-wrap { position: relative; display: block; }
.unit { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: .8rem; pointer-events: none; }
.field [aria-invalid=true] { border-color: var(--red); background: #fff5f3; }
.field .is-correct { border-color: #70a780; background: #f3f9ef; }
.field :disabled { opacity: 1; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 18px; }
.btn { border-radius: 9px; border: 1px solid var(--line); background: var(--white); color: var(--violet-dark); padding: 9px 13px; min-height: 41px; font-weight: 730; font-size: .89rem; line-height: 1.25; }
.btn:hover { background: #f6f4ff; }
.btn.primary { background: var(--violet); color: #fff; border-color: var(--violet); }
.btn.primary:hover { background: var(--violet-dark); }
.btn.primary:disabled { opacity: .55; }
.actions .continue { margin-left: auto; }
.message { margin: 12px 0 0; padding: 9px 11px; font-size: .9rem; border-radius: 8px; background: #f6f4ff; color: var(--violet-dark); line-height: 1.45; }
.message:empty { display: none; }
.message.error { background: #fff0ed; color: #852b25; }
.message.success { background: #ecf6dd; color: var(--green); }
.explanation { margin-top: 12px; border-left: 3px solid #8468e9; background: #f7f5ff; padding: 10px 12px; border-radius: 0 8px 8px 0; line-height: 1.52; font-size: .91rem; }
.explanation h3 { font-size: .9rem; margin: 0 0 4px; }
.explanation p { margin: 0; }
.explanation ol { margin: 0; padding-left: 1.35em; }
.explanation li + li { margin-top: 4px; }
.check-area { max-width: 850px; margin-inline: auto; padding-bottom: 38px; }
.switch { display: flex; flex-wrap: wrap; gap: 5px; margin: 12px 0 19px; }
.switch button { border: 1px solid var(--line); }
.check-info { color: var(--muted); line-height: 1.55; }
.summary { padding: 12px 15px; background: var(--violet-pale); border-radius: 10px; color: var(--violet-dark); margin: 0 0 13px; font-weight: 730; }
.review-list { list-style: none; padding: 0; margin: 0; }
.review-list li { padding: 10px 0; border-bottom: 1px solid var(--line); line-height: 1.45; }
.review-list .status { color: var(--green); font-weight: 750; }
.review-list .status.error { color: var(--red); }
.review-list summary { cursor: pointer; font-weight: 700; }
.review-list p { margin: 5px 0; }
@media (max-width: 860px) {
  .workspace { grid-template-columns: 220px minmax(0, 1fr); gap: 14px; }
  .problem { grid-template-columns: minmax(0, 1fr) minmax(150px, .7fr); }
  .shell { width: min(100% - 30px, 1168px); }
}
@media (max-width: 680px) {
  .banner .shell { min-height: 0; padding-block: 20px 23px; }
  .workspace { grid-template-columns: 1fr; gap: 10px; }
  nav { padding: 9px 11px; border-radius: 12px; }
  .nav-head, .nav-list { display: none; }
  .nav-mobile { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 8px; }
  .nav-mobile label { font-size: .81rem; font-weight: 750; }
  .nav-mobile select { min-height: 36px; font-size: .85rem; }
  .problem { display: flex; flex-direction: column; gap: 9px; }
  .problem > * { width: 100%; }
  .problem .figure { order: 2; }
  .problem .answers { order: 3; }
  .prompt { margin: 0; }
  .figure svg { max-height: 166px; }
  .card-header { padding-bottom: 11px; margin-bottom: 11px; }
  .steps button { width: 32px; height: 32px; }
  .hero-lines { width: 37%; }
}
@media (max-width: 410px) {
  .shell { width: calc(100% - 20px); }
  .toolbar { align-items: flex-start; flex-direction: column; gap: 7px; min-height: 0; }
  .mode button, .switch button { padding-inline: 8px; font-size: .83rem; }
  .total { font-size: .77rem; }
  .card-header { flex-wrap: wrap; gap: 8px; }
  .figure svg { max-height: 150px; }
  .actions .continue { margin-left: 0; }
}
@media (prefers-reduced-motion: no-preference) {
  button { transition: background .14s, border-color .14s; }
}

<main class="shell">

      <button type="button" id="check-mode" aria-pressed="false">Самопроверка</button>

<script>
const TRAINERS = [
  {
    id: 'adjacent',
    title: 'Смежные углы',
    goal: 'Найти второй угол по первому.',
    source: 'Вариант 1, №1',
    items: [
      {
        prompt: 'Углы AOB и BOC смежные. Угол AOB равен 68°. Найди угол BOC.',
        diagram: { type: 'adjacent', labels: ['A', 'O', 'C', 'B'], angle: 68, showAngle: true },
        fields: [{ label: '∠BOC', answer: 112, unit: '°', feedback: 'Проверь, равна ли сумма двух углов 180°.' }],
        hint: 'Луч OB делит развёрнутый угол AOC на две части. Какова сумма этих частей?',
        solution: ['∠AOB + ∠BOC = 180°.', '∠BOC = 180° − 68° = 112°.']
      },
      {
        prompt: 'Углы POK и KOQ смежные. Угол POK равен 127°. Найди угол KOQ.',
        diagram: { type: 'adjacent', labels: ['P', 'O', 'Q', 'K'], angle: 127, showAngle: true },
        fields: [{ label: '∠KOQ', answer: 53, unit: '°', feedback: 'Первый угол тупой. Второй должен быть острым, а их сумма равна 180°.' }],
        hint: 'Вычти известный угол из развёрнутого угла.',
        solution: ['∠POK + ∠KOQ = 180°.', '∠KOQ = 180° − 127° = 53°.']
      },
      {
        prompt: 'Точки M, N и P лежат на одной прямой, N между M и P. Луч NK образует с лучом NM угол 90°. Найди угол KNP.',
        diagram: { type: 'adjacent', labels: ['M', 'N', 'P', 'K'], angle: 90, showAngle: true },
        fields: [{ label: '∠KNP', answer: 90, unit: '°', feedback: 'Лучи NM и NP дополняют друг друга до прямой. Весь угол MNP равен 180°.' }],
        hint: 'У углов MNK и KNP общая сторона NK, а две другие стороны лежат на одной прямой.',
        solution: ['Углы MNK и KNP смежные.', '∠KNP = 180° − 90° = 90°.']
      }
    ]
  },
  {
    id: 'opposite-rays',
    title: 'Как узнать смежные углы',
    goal: 'Увидеть общую сторону и два дополнительных луча.',
    source: 'Вариант 1, №1',
    items: [
      {
        prompt: 'Углы AOB и BOC смежные. Провели луч OD, дополнительный к OA. Как расположены лучи OC и OD? Какой угол, записанный с буквой D, смежный с ∠AOB?',
        diagram: { type: 'adjacent', labels: ['A', 'O', 'C', 'B'], angle: 68, coincident: 'D' },
        fields: [
          { label: 'Лучи OC и OD', answer: 'Совпадают', options: ['Совпадают', 'Дополняют друг друга до прямой', 'Перпендикулярны'], feedback: 'У луча OA только один дополнительный луч.' },
          { label: 'Угол, смежный с ∠AOB', answer: '∠BOD', options: ['∠AOD', '∠BOD', '∠COD'], feedback: 'У смежных углов AOB и BOD общая сторона OB.' }
        ],
        hint: 'Какой луч дополняет OA до прямой в первой паре смежных углов?',
        solution: ['У ∠AOB и ∠BOC общая сторона OB, поэтому OA и OC — дополнительные лучи.', 'Луч OD тоже дополнительный к OA. Следовательно, OD совпадает с OC.', '∠BOD — тот же угол, что и ∠BOC. Он смежный с ∠AOB.']
      },
      {
        prompt: 'На прямой PR точка T лежит между P и R. Из T проведён луч TK, который не лежит на этой прямой. Какой угол смежный с ∠PTK?',
        diagram: { type: 'adjacent', labels: ['P', 'T', 'R', 'K'], angle: 112 },
        fields: [{ label: 'Угол, смежный с ∠PTK', answer: '∠KTR', options: ['∠PTR', '∠KTP', '∠KTR'], feedback: 'Оставь общей сторону TK. Вместо TP возьми дополнительный к нему луч.' }],
        hint: 'Какой луч вместе с TP образует прямую PR?',
        solution: ['У второго угла должна остаться сторона TK.', 'Дополнительный к TP луч — TR. Получаем ∠KTR.']
      },
      {
        prompt: 'Лучи SM и SN дополнительные. Из точки S проведён луч SL, который не лежит на прямой MN. Назови общую сторону углов MSL и LSN и определи, смежные ли они.',
        diagram: { type: 'adjacent', labels: ['M', 'S', 'N', 'L'], angle: 44 },
        fields: [
          { label: 'Общая сторона', answer: 'SL', options: ['SM', 'SL', 'SN'], feedback: 'Какая сторона встречается в обозначениях обоих углов?' },
          { label: 'Эти углы смежные?', answer: 'Да', options: ['Да', 'Нет'], feedback: 'Две другие стороны, SM и SN, образуют прямую.' }
        ],
        hint: 'В записи ∠MSL буква S обозначает вершину, а лучи SM и SL — стороны угла.',
        solution: ['Общая сторона углов — SL.', 'Стороны SM и SN дополняют друг друга до прямой. Следовательно, ∠MSL и ∠LSN смежные.']
      }
    ]
  },
  {
    id: 'ratio',
    title: 'Один смежный угол в несколько раз больше другого',
    goal: 'Записать углы через одну неизвестную и использовать сумму 180°.',
    source: 'Вариант 2, №1',
    items: [
      {
        prompt: 'Углы MNK и KNP смежные. Угол KNP в 3 раза больше угла MNK. Найди оба угла.',
        diagram: { type: 'adjacent', labels: ['M', 'N', 'P', 'K'], angle: 45 },
        fields: [
          { label: '∠MNK', answer: 45, unit: '°', feedback: 'Раздели 180° на общее число одинаковых частей в двух углах.' },
          { label: '∠KNP', answer: 135, unit: '°', feedback: 'Во втором угле три части. В первом — ещё одна.' }
        ],
        hint: 'Обозначь меньший угол через x. Запиши больший угол через x и сложи оба выражения.',
        solution: ['Пусть ∠MNK = x. Тогда ∠KNP = 3x.', 'x + 3x = 180°, поэтому x = 45°.', 'Больший угол равен 3 · 45° = 135°.']
      },
      {
        prompt: 'Углы AOB и BOC смежные. Угол AOB в 2 раза больше угла BOC. Найди оба угла.',
        diagram: { type: 'adjacent', labels: ['A', 'O', 'C', 'B'], angle: 120 },
        fields: [
          { label: '∠AOB', answer: 120, unit: '°', feedback: 'Первый угол составляет две части из трёх.' },
          { label: '∠BOC', answer: 60, unit: '°', feedback: 'Второй угол меньше. Он составляет одну часть из трёх.' }
        ],
        hint: 'Дай меньшему углу одну часть. Сколько частей приходится на больший? Сколько частей всего?',
        solution: ['Пусть ∠BOC = x. Тогда ∠AOB = 2x.', '2x + x = 180°, поэтому x = 60°.', '∠BOC = 60°, ∠AOB = 120°.']
      },
      {
        prompt: 'Углы PTK и KTR смежные. Угол KTR в 4 раза больше угла PTK. Найди оба угла.',
        diagram: { type: 'adjacent', labels: ['P', 'T', 'R', 'K'], angle: 36 },
        fields: [
          { label: '∠PTK', answer: 36, unit: '°', feedback: 'Вместе углы составляют пять одинаковых частей.' },
          { label: '∠KTR', answer: 144, unit: '°', feedback: 'Умножь меньший угол на 4. Проверь сумму углов.' }
        ],
        hint: 'Если меньший угол — одна часть, то больший — четыре части. Какая сумма всех частей?',
        solution: ['Пусть ∠PTK = x. Тогда ∠KTR = 4x.', '5x = 180°, поэтому x = 36°.', '∠PTK = 36°, ∠KTR = 144°.']
      }
    ]
  },
  {
    id: 'sum',
    title: 'Углы при пересечении прямых по сумме',
    goal: 'Определить, когда два угла вертикальные, и найти остальные.',
    source: 'Вариант 1, №2 · Вариант 2, №3',
    items: [
      {
        prompt: 'Две прямые пересеклись. Сумма двух из четырёх образовавшихся углов равна 112°. Определи, какие это углы, и найди все четыре.',

<script>
const renderDiagram = (() => {
  const width = 340;
  const height = 184;
  const ink = '#233750';
  const muted = '#52677f';
  const blue = '#285aaf';
  const rust = '#a74724';
  const teal = '#19766d';

  function escapeSvg(value) {
    return String(value).replace(/[&<>"']/g, character => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&apos;'
    })[character]);
  }

  function coordinate(value) {
    return Number(value.toFixed(2));
  }

  function coordinates(point) {
    return point.map(coordinate).join(' ');
  }

  function pointAt(origin, direction, distance) {
    const radians = direction * Math.PI / 180;
    return [
      origin[0] + Math.cos(radians) * distance,
      origin[1] - Math.sin(radians) * distance
    ];
  }

  function bearing(origin, endpoint) {
    return Math.atan2(origin[1] - endpoint[1], endpoint[0] - origin[0]) * 180 / Math.PI;
  }

  function line(start, end, color = ink, dashed = false) {
    const dash = dashed ? ' stroke-dasharray="5 4"' : '';
    return '<path d="M ' + coordinates(start) + ' L ' + coordinates(end)
      + '" fill="none" stroke="' + color + '" stroke-width="2" stroke-linecap="round"' + dash + '/>';
  }

  function polyline(points, color, thickness = 1.6) {
    return '<polyline points="' + points.map(coordinates).join(' ')
      + '" fill="none" stroke="' + color + '" stroke-width="' + thickness + '" stroke-linejoin="round"/>';
  }

  function triangle(points, outline, fill) {
    return '<polygon points="' + points.map(coordinates).join(' ') + '" fill="' + fill
      + '" stroke="' + outline + '" stroke-width="2" stroke-linejoin="round"/>';
  }

  function dot(point, color = ink) {
    return '<circle cx="' + coordinate(point[0]) + '" cy="' + coordinate(point[1])
      + '" r="2.7" fill="' + color + '"/>';
  }

  function label(point, value, color = ink, size = 15) {
    return '<text x="' + coordinate(point[0]) + '" y="' + coordinate(point[1])
      + '" fill="' + color + '" stroke="#fcfdff" stroke-width="3.5" stroke-linejoin="round"'
      + ' paint-order="stroke" text-anchor="middle" dominant-baseline="central"'
      + ' font-family="system-ui, sans-serif" font-size="' + size + '" font-weight="650">'
      + escapeSvg(value) + '</text>';
  }

  function arc(origin, start, end, radius, color, fill) {
    const span = end - start;
    const from = pointAt(origin, start, radius);
    const to = pointAt(origin, end, radius);
    const sweep = span >= 0 ? 0 : 1;
    const large = Math.abs(span) > 180 ? 1 : 0;
    const curve = ' A ' + radius + ' ' + radius + ' 0 ' + large + ' ' + sweep + ' ' + coordinates(to);
    const sector = fill
      ? '<path d="M ' + coordinates(origin) + ' L ' + coordinates(from) + curve + ' Z" fill="' + fill + '"/>'
      : '';
    return sector + '<path d="M ' + coordinates(from) + curve
      + '" fill="none" stroke="' + color + '" stroke-width="2" stroke-linecap="round"/>';
  }

  function degreeLabel(point, amount, color) {
    return label(point, String(amount).replace('.', ',') + '°', color, 13);
  }

  function markAngle(vertex, start, end, radius, color) {
    const from = bearing(vertex, start);
    const to = bearing(vertex, end);
    const span = ((to - from + 540) % 360) - 180;
    return arc(vertex, from, from + span, radius, color);
  }

  function framedSvg(title, body) {
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + width + ' ' + height
      + '" width="' + width + '" height="' + height + '" role="img" aria-label="' + escapeSvg(title)
      + '"><title>' + escapeSvg(title) + '</title><rect width="' + width + '" height="' + height
      + '" rx="14" fill="#fcfdff"/>' + body + '</svg>';
  }

  function adjacent({ labels, angle, coincident, showAngle }) {
    const [leftName, centerName, rightName, topName] = labels;
    const center = [170, 128];
    const left = [46, 128];
    const right = [294, 128];
    const direction = 180 - angle;
    const top = pointAt(center, direction, 91);
    const arcRadius = 26;
    const angleMark = angle === 90
      ? polyline([[center[0] - 13, center[1]], [center[0] - 13, center[1] - 13],
        [center[0], center[1] - 13]], blue)
      : arc(center, direction, 180, arcRadius, blue, '#eaf1fd');
    const title = 'Лучи из точки ' + centerName + '. Точки ' + leftName + ', ' + centerName
      + ' и ' + rightName + ' лежат на одной прямой.' + (coincident
        ? ' Точки ' + rightName + ' и ' + coincident + ' лежат на одном луче из точки ' + centerName + '.'
        : '');
    return framedSvg(title,
      angleMark
      + line(left, right) + line(center, top, blue)
      + dot(left) + dot(right) + dot(center) + dot(top, blue)
      + label([left[0], left[1] + 20], leftName)
      + label([right[0], right[1] + 20], rightName)
      + label([center[0], center[1] + 20], centerName)
      + label(pointAt(center, direction, 108), topName, blue)
      + (coincident ? dot([right[0] - 33, right[1]]) + label([right[0] - 33, right[1] + 20], coincident) : '')
      + (showAngle ? degreeLabel(pointAt(center, 180 - angle / 2, 47), angle, blue) : '')

  function intersection({ labels = ['A', 'B', 'C', 'D', 'O'], angle, numbered, showAngle }) {
    const [aName, bName, cName, dName, centerName] = labels;
    const center = [170, 91];
    const start = 157;
    const direction = start - angle;
    const orderedDirections = [start, direction, start - 180, direction - 180];
    const endpoints = orderedDirections.map(degrees => {
      const rise = Math.abs(Math.sin(degrees * Math.PI / 180));
      const distance = Math.min(118, 63 / Math.max(rise, 0.01));
      return pointAt(center, degrees, distance);
    });
    const [a, c, b, d] = endpoints;
    const middle = [
      start - angle / 2,
      (direction + start - 180) / 2,
      start - 180 - angle / 2,
      (direction - 180 + start - 360) / 2
    ];
    const vertexNames = [aName, cName, bName, dName];
    const cornerLabels = numbered
      ? middle.map((degrees, index) => label(pointAt(center, degrees, 47), index + 1, muted)).join('')
      : endpoints.map((endpoint, index) =>
        label(pointAt(endpoint, orderedDirections[index], 15), vertexNames[index])).join('');
    const title = 'Две прямые пересекаются в точке ' + centerName + '.'
      + (numbered
        ? ' Углы пронумерованы по кругу от 1 до 4.'

    return framedSvg(title,
      (numbered ? '' : arc(center, direction, start, 25, blue, '#eaf1fd'))
      + line(a, b) + line(c, d) + dot(center)
      + (numbered ? '' : endpoints.map(endpoint => dot(endpoint)).join(''))
      + label([center[0] + 12, center[1] + 15], centerName)
      + cornerLabels
      + (showAngle ? degreeLabel(pointAt(center, middle[0], numbered ? 67 : 46), angle, blue) : '')

  function perpendicularMark(foot, vertex, point) {
    const along = bearing(foot, vertex);
    const across = bearing(foot, point);

    const h = pointAt(b, half, footDistance);

    const title = 'Точка K лежит на биссектрисе угла B величиной ' + angle + ' градусов.'

      + dot(b) + dot(k, blue)
      + label([b[0] - 16, b[1]], 'B')
      + label([k[0] + 15, k[1]], 'K', blue)

    const c = endpoint(cDirection);
    const d = endpoint(dDirection);
    const title = 'Лучи AB, AC и AD с общей вершиной A. Лучи AC и AD лежат по '
      + (sameSide ? 'одну сторону от прямой AB.' : 'разные стороны от прямой AB.');
    return framedSvg(title,
      arc(a, 0, dDirection, 60, rust, '#fcf0e8') + arc(a, 0, cDirection, 27, blue, '#eaf1fd')
      + line(a, b) + line(a, d, rust) + line(a, c, blue)
      + dot(a) + dot(b) + dot(c, blue) + dot(d, rust)
      + label([a[0] - 16, a[1] + 5], 'A')
      + label([b[0] + 14, b[1]], 'B')
      + label(pointAt(c, cDirection, 15), 'C', blue)
      + label(pointAt(d, dDirection, 15), 'D', rust)
      + (showAngle
        ? degreeLabel(pointAt(a, cDirection / 2, 42), firstAngle, blue)
          + degreeLabel(pointAt(a, dDirection / 2, 75), secondAngle, rust)
        : '')
    );
  }

  function sides({ labels }) {
    const first = [[41, 136], [87, 52], [141, 136]];
    const mirrorRotation = -21;
    const mirrorCenter = [254, 115];
    const sourceCenter = [91, 115];
    const rotated = first.map(point => {
      const mirrorPoint = [2 * sourceCenter[0] - point[0], point[1]];
      const distance = Math.hypot(mirrorPoint[0] - sourceCenter[0], mirrorPoint[1] - sourceCenter[1]);
      return pointAt(mirrorCenter, bearing(sourceCenter, mirrorPoint) + mirrorRotation, distance);
    });
    const firstLabels = [[27, 143], [87, 36], [153, 143]];
    const secondLabels = rotated.map(point => pointAt(point, bearing(mirrorCenter, point), 15));
    const title = 'Треугольники ' + labels.slice(0, 3).join('') + ' и ' + labels.slice(3).join('') + '.';
    return framedSvg(title,
      triangle(first, blue, '#eaf1fd') + triangle(rotated, teal, '#e8f5f2')
      + firstLabels.map((point, index) => label(point, labels[index], blue)).join('')
      + secondLabels.map((point, index) => label(point, labels[index + 3], teal)).join('')
    );
  }

  function tick(start, end, color) {
    const center = [(start[0] + end[0]) / 2, (start[1] + end[1]) / 2];
    const direction = bearing(start, end) + 90;
    return line(pointAt(center, direction, 6), pointAt(center, direction + 180, 6), color);
  }

  function proof({ equalSide = 'AO', equalAngle = 'C' }) {
    const o = [170, 91];
    const a = pointAt(o, 148, 119);
    const b = pointAt(o, -32, 119);
    const c = pointAt(o, 219, 91);
    const d = pointAt(o, 39, 91);
    const sides = equalSide === 'CO' ? 'CO и OD' : 'AO и BO';
    const angles = equalAngle === 'A' ? 'CAO и DBO' : 'ACO и BDO';
    const marksOnSides = equalSide === 'CO'
      ? tick(c, o, blue) + tick(o, d, blue)
      : tick(a, o, blue) + tick(o, b, blue);
    const marksOnAngles = equalAngle === 'A'
      ? markAngle(a, c, o, 18, rust) + markAngle(b, d, o, 18, rust)
      : markAngle(c, a, o, 18, rust) + markAngle(d, b, o, 18, rust);
    const title = 'Отрезки AB и CD пересекаются в точке O. Засечками отмечено равенство ' + sides
      + '. Дугами отмечены равные углы ' + angles + '.';
    return framedSvg(title,
      triangle([a, o, c], ink, '#eaf1fd') + triangle([b, o, d], ink, '#fcf0e8')
      + marksOnAngles + marksOnSides
      + [a, b, c, d, o].map(point => dot(point)).join('')
      + label(pointAt(a, 148, 15), 'A') + label(pointAt(b, -32, 15), 'B')
      + label(pointAt(c, 219, 15), 'C') + label(pointAt(d, 39, 15), 'D')
      + label([o[0], o[1] + 16], 'O')
    );
  }

  const diagrams = { adjacent, intersection, bisector, rays, sides, proof };

  return function renderDiagram(diagram) {
    return diagram && Object.hasOwn(diagrams, diagram.type) ? diagrams[diagram.type](diagram) : '';
  };
})();
</script>
<script>
'use strict';

const $ = (selector) => document.querySelector(selector);
const controls = {
  train: $('#train-mode'), check: $('#check-mode'), written: $('#written-mode'), training: $('#training'),
  writtenWork: $('#written-work'),
  selfCheck: $('#self-check'), skills: $('#skills'), skillSelect: $('#skill-select'),
  lesson: $('#lesson'), checkCard: $('#check-card'), total: $('#total'),
  totalText: $('#total-text'), progress: $('#total-progress')
};
const controlVariants = [
  [['adjacent', 'opposite-rays'], ['sum'], ['intersection'], ['bisector'], ['sides']],
  [['ratio'], ['difference'], ['sum-numbered'], ['rays'], ['proof']]
];
const trainerIndex = new Map(TRAINERS.map((trainer, index) => [trainer.id, index]));
const totalItems = TRAINERS.reduce((sum, trainer) => sum + trainer.items.length, 0);
const progressKey = 'geometry-angles-triangles-practice-2026-11-v1';
const solved = readProgress();
const practice = new Map();
const state = { skill: 0, item: 0, mode: 'training', variant: 0, check: null };
let writtenWork;

function readProgress() {
  try {
    const saved = JSON.parse(localStorage.getItem(progressKey));
    return new Set(Array.isArray(saved) ? saved.filter((key) => typeof key === 'string') : []);
  } catch {
    return new Set();
  }
}

function saveProgress() {
  try { localStorage.setItem(progressKey, JSON.stringify([...solved])); } catch { /* Browser storage can be disabled. */ }
}

const esc = (value) => String(value).replace(/[&<>"']/g, (character) => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
})[character]);

const keyFor = (trainer, index) => `${trainer.id}-${index}`;

function getPractice(key) {
  if (!practice.has(key)) practice.set(key, { values: [], attempts: 0, results: [], message: '', hint: false, solution: false, correct: false });
  return practice.get(key);
}

function renderNavigation() {
  const entries = TRAINERS.map((trainer, index) => {
    const count = trainer.items.filter((_, itemIndex) => solved.has(keyFor(trainer, itemIndex))).length;
    return { index, title: trainer.title, count, length: trainer.items.length };
  });
  const finished = entries.reduce((sum, entry) => sum + entry.count, 0);
  controls.totalText.textContent = `Решено ${finished} из ${totalItems}`;
  controls.progress.max = totalItems;
  controls.progress.value = finished;
  controls.skills.innerHTML = entries.map(({ index, title, count, length }) => `
    <li><button type="button" data-skill="${index}" ${index === state.skill ? 'aria-current="true"' : ''}>
      <span>${esc(title)}</span><span class="nav-count ${count === length ? 'complete' : ''}" aria-label="Решено ${count} из ${length}">${count}/${length}</span>
    </button></li>`).join('');
  controls.skillSelect.innerHTML = entries.map(({ index, title, count, length }) => `
    <option value="${index}">${esc(title)} · ${count}/${length}</option>`).join('');
  controls.skillSelect.value = state.skill;
}

function renderField(field, id, value = '', result, disabled) {
  const invalid = result === false ? 'aria-invalid="true"' : '';
  const correct = result === true ? 'class="is-correct"' : '';
  const lock = disabled ? 'disabled' : '';
  const input = field.options ? `
    <select id="${id}" name="${id}" ${invalid} ${correct} ${lock}>
      <option value="">Выбери ответ</option>
      ${field.options.map((option) => `<option value="${esc(option)}" ${value === option ? 'selected' : ''}>${esc(option)}</option>`).join('')}
    </select>` : `
    <span class="input-wrap"><input id="${id}" name="${id}" type="text" inputmode="${Number.isInteger(field.answer) ? 'numeric' : 'decimal'}" autocomplete="off"
      maxlength="30" value="${esc(value)}" ${invalid} ${correct} ${lock}>
      ${field.unit ? `<span class="unit">${esc(field.unit)}</span>` : ''}</span>`;
  const unitLabel = field.unit === '°' ? ', в градусах' : field.unit === 'см' ? ', в сантиметрах' : '';
  return `<div class="field ${field.options ? 'full' : ''}"><label for="${id}">${esc(field.label)}${unitLabel ? `<span class="visually-hidden">${unitLabel}</span>` : ''}</label>${input}</div>`;
}

function renderItem(item, prefix, data = {}, part = '') {
  return `<section class="item">${part ? `<h3>${esc(part)}</h3>` : ''}
    <div class="problem ${item.diagram ? '' : 'without-diagram'}">
      <p class="prompt">${esc(item.prompt)}</p>
      ${item.diagram ? `<figure class="figure">${renderDiagram(item.diagram)}</figure>` : ''}
      <div class="answers">${item.fields.map((field, index) => renderField(field, `${prefix}-${index}`, data.values?.[index], data.results?.[index], data.correct)).join('')}</div>
    </div>
  </section>`;
}

function renderExplanation(title, body, isList = false) {
  const content = isList ? `<ol>${body.map((step) => `<li>${esc(step)}</li>`).join('')}</ol>` : `<p>${esc(body)}</p>`;
  return `<div class="explanation"><h3>${esc(title)}</h3>${content}</div>`;
}

function focusHeading(selector, scroll = true) {
  const heading = $(selector);
  heading?.focus({ preventScroll: true });
  if (scroll && heading && heading.getBoundingClientRect().top < 0) heading.scrollIntoView({ block: 'start' });
}

function renderTraining() {
  renderNavigation();
  const trainer = TRAINERS[state.skill];
  const item = trainer.items[state.item];
  const record = getPractice(keyFor(trainer, state.item));
  const nextLabel = state.item + 1 < trainer.items.length ? 'Следующее упражнение' : state.skill + 1 < TRAINERS.length ? 'Следующий навык' : 'К самопроверке';
  controls.lesson.innerHTML = `
    <header class="card-header">
      <div><p class="eyebrow">${esc(trainer.source)}</p><h2 id="lesson-title" tabindex="-1">${esc(trainer.title)}</h2><p class="goal">${esc(trainer.goal)}</p></div>
      <div class="steps" role="group" aria-label="Упражнения навыка">${trainer.items.map((_, index) => {
        const done = solved.has(keyFor(trainer, index));
        return `<button type="button" data-item="${index}" class="${done ? 'solved' : ''}" aria-label="Упражнение ${index + 1}${done ? ', решено' : ''}" ${index === state.item ? 'aria-current="true"' : ''}>${index + 1}</button>`;
      }).join('')}</div>
    </header>
    <form id="practice-form" novalidate>
      ${renderItem(item, 'practice', record)}
      <div class="actions">
        <button class="btn primary" type="submit" ${record.correct ? 'disabled' : ''}>Проверить</button>
        <button class="btn" id="hint-button" type="button" aria-expanded="${record.hint}">${record.hint ? 'Скрыть подсказку' : 'Подсказка'}</button>
        <button class="btn" id="solution-button" type="button" aria-expanded="${record.solution}">${record.solution ? 'Скрыть решение' : 'Решение'}</button>
        <button class="btn continue" id="next-practice" type="button">${nextLabel} →</button>
      </div>
      <p id="practice-message" class="message ${record.correct ? 'success' : record.message ? 'error' : ''}" role="status" tabindex="-1">${esc(record.message)}</p>
      ${record.hint ? renderExplanation('Подсказка', item.hint) : ''}
      ${record.solution ? renderExplanation('Решение по шагам', item.solution, true) : ''}
    </form>`;
  const form = $('#practice-form');
  form.addEventListener('input', (event) => {
    record.values = readValues(form, 'practice', item.fields.length);
    const index = item.fields.findIndex((_, fieldIndex) => event.target.name === `practice-${fieldIndex}`);
    if (index >= 0) record.results[index] = undefined;
    event.target.removeAttribute('aria-invalid');
    event.target.classList.remove('is-correct');
  });
  form.addEventListener('submit', (event) => {
    event.preventDefault();
    if (record.correct) return;
    record.values = readValues(form, 'practice', item.fields.length);
    const empty = record.values.findIndex((value) => !value.trim());
    if (empty >= 0) {
      record.message = 'Заполни все поля, затем проверь ответ.';
    } else {
      record.attempts += 1;
      record.results = item.fields.map((field, index) => matches(field, record.values[index]));
      record.correct = record.results.every(Boolean);
      if (record.correct) {
        solved.add(keyFor(trainer, state.item));
        saveProgress();
        record.message = record.solution ? 'Теперь верно.' : 'Верно!';
      } else {
        const firstWrong = record.results.indexOf(false);
        if (record.attempts >= 2 && !record.hint) record.hint = true;
        record.message = item.fields[firstWrong].feedback || 'Проверь выделенный ответ и попробуй ещё раз.';
      }
    }
    renderTraining();
    focusHeading('#practice-message', false);
    if (empty >= 0) $(`#practice-${empty}`)?.focus();
  });
  for (const [buttonId, property] of [['hint-button', 'hint'], ['solution-button', 'solution']]) {
    $(`#${buttonId}`).addEventListener('click', () => {
      record[property] = !record[property];
      renderTraining();
      $(`#${buttonId}`).focus({ preventScroll: true });
    });
  }
  $('#next-practice').addEventListener('click', () => {
    if (state.item + 1 < trainer.items.length) changeSkill(state.skill, state.item + 1);
    else if (state.skill + 1 < TRAINERS.length) changeSkill(state.skill + 1);
    else setMode('check');
  });
}

function readValues(form, prefix, length) {
  return Array.from({ length }, (_, index) => form.elements.namedItem(`${prefix}-${index}`).value);
}

function matches(field, value) {
  if (field.options) return value === field.answer;
  if (typeof field.answer !== 'number') return value.trim().toLowerCase() === field.answer.toLowerCase();
  const numberText = value.trim().replace(/\s*(?:°|см|cm|град\.?)[\s.]*$/iu, '').replace(',', '.');
  if (!/^[+-]?\d+(?:\.\d+)?$/.test(numberText)) return false;
  return Math.abs(Number(numberText) - field.answer) < 1e-9;
}

function changeSkill(index, item) {
  state.skill = index;
  const trainer = TRAINERS[index];
  const nextUnsolved = trainer.items.findIndex((_, number) => !solved.has(keyFor(trainer, number)));
  state.item = item ?? Math.max(0, nextUnsolved);
  setMode('training');
}

function setMode(mode, focus = true) {
  state.mode = mode;
  const training = mode === 'training';
  const checking = mode === 'check';
  const writing = mode === 'written';
  document.body.classList.toggle('written-mode-active', writing);
  controls.train.setAttribute('aria-pressed', String(training));
  controls.check.setAttribute('aria-pressed', String(checking));
  controls.written.setAttribute('aria-pressed', String(writing));
  controls.training.hidden = !training;
  controls.selfCheck.hidden = !checking;
  controls.writtenWork.hidden = !writing;
  controls.total.hidden = !training;
  if (training) renderTraining();
  if (checking) renderCheck();
  if (writing) writtenWork.show();
  if (focus) focusHeading(training ? '#lesson-title' : checking ? '#check-title' : '#written-title');
}

function variantQuestions() {
  return controlVariants[state.variant].map((skills) => skills.map((id) => {
    const numbered = id === 'sum-numbered';
    const index = trainerIndex.get(numbered ? 'sum' : id);
    const trainer = TRAINERS[index];
    return { trainer, index, item: numbered ? trainer.check : CHECK_ITEMS[id] };
  }));
}

function renderCheck() {
  const questions = variantQuestions();
  const session = state.check;
  const renderTitle = (title, caption = '') => `<header class="card-header"><div>${caption ? `<p class="eyebrow">${esc(caption)}</p>` : ''}<h2 id="check-title" tabindex="-1">${esc(title)}</h2></div></header>`;
  if (!session) {
    controls.checkCard.innerHTML = `${renderTitle('Самопроверка')}
      <div class="switch" role="group" aria-label="Вариант контрольной">${controlVariants.map((_, index) => `<button type="button" data-variant="${index}" aria-pressed="${state.variant === index}">Вариант ${index + 1}</button>`).join('')}</div>
      <p class="check-info">Пять заданий. Ответы и разбор появятся в конце. До завершения можно возвращаться к предыдущим заданиям.</p>
      <button type="button" class="btn primary" id="start-check">Начать вариант ${state.variant + 1}</button>`;
    return;
  }
  if (session.finished) {
    const scores = questions.map((parts, questionIndex) => parts.map(({ item }, partIndex) => item.fields.every((field, fieldIndex) => matches(field, session.values[questionIndex]?.[partIndex]?.[fieldIndex] ?? ''))));
    const points = scores.filter((parts) => parts.every(Boolean)).length;
    controls.checkCard.innerHTML = `${renderTitle('Результат', `Вариант ${state.variant + 1}`)}
      <p class="summary">Полностью решено ${points} из ${questions.length}.</p>
      <ol class="review-list">${questions.map((parts, questionIndex) => `
        <li><details><summary>№${questionIndex + 1}. <span class="status ${scores[questionIndex].every(Boolean) ? '' : 'error'}">${scores[questionIndex].every(Boolean) ? 'Верно' : 'Нужен разбор'}</span></summary>
        ${parts.map(({ trainer, index, item }, partIndex) => `
          <p><strong>${esc(trainer.title)}</strong></p><p>${esc(item.prompt)}</p>
          ${item.fields.map((field, fieldIndex) => {
            const value = session.values[questionIndex]?.[partIndex]?.[fieldIndex] ?? '';
            const answer = typeof field.answer === 'number' ? String(field.answer).replace('.', ',') : field.answer;
            return `<p>${esc(field.label)}. Ответ ученика: ${esc(value.trim() || 'нет ответа')}. Верный ответ: ${esc(answer)}${field.unit === '°' ? '°' : field.unit ? ` ${esc(field.unit)}` : ''}.</p>`;
          }).join('')}
          ${renderExplanation('Решение по шагам', item.solution, true)}
          <div class="actions"><button type="button" class="btn" data-review="${index}">Тренировать навык</button></div>`).join('')}
        </details></li>`).join('')}</ol>
      <div class="actions"><button type="button" class="btn primary" id="restart-check">Выбрать вариант</button></div>`;
    return;
  }
  const questionIndex = session.question;
  const parts = questions[questionIndex];
  const answered = questions.filter((question, index) => question.every(({ item }, part) => item.fields.every((_, field) => session.values[index]?.[part]?.[field]?.trim()))).length;
  const last = questionIndex === questions.length - 1;
  controls.checkCard.innerHTML = `${renderTitle(`Задание ${questionIndex + 1} из ${questions.length}`, `Вариант ${state.variant + 1}`)}
    <form id="check-form" novalidate>
      ${parts.map(({ item }, index) => renderItem(item, `check-${index}`, { values: session.values[questionIndex]?.[index] }, parts.length > 1 ? ['а)', 'б)'][index] : '')).join('')}
      <div class="actions">
        ${questionIndex > 0 ? '<button type="button" class="btn" id="prev-question">← Назад</button>' : ''}
        <button type="submit" class="btn primary">${last ? 'Завершить вариант' : 'Дальше →'}</button>
      </div>
      <p id="check-message" class="message" role="status" ${session.confirm ? '' : 'hidden'}>${session.confirm ? `Заполнено заданий: ${answered} из ${questions.length}. Можно вернуться или завершить вариант.` : ''}</p>
    </form>`;
  const form = $('#check-form');
  const remember = () => {
    session.values[questionIndex] = parts.map(({ item }, part) => readValues(form, `check-${part}`, item.fields.length));
  };
  form.addEventListener('input', remember);
  form.addEventListener('submit', (event) => {
    event.preventDefault();
    remember();
    if (last) {
      const incomplete = questions.some((question, index) => question.some(({ item }, part) => item.fields.some((_, field) => !session.values[index]?.[part]?.[field]?.trim())));
      if (incomplete && !session.confirm) session.confirm = true;
      else session.finished = true;
    } else {
      session.question += 1;
    }
    renderCheck();
    if (session.confirm && !session.finished && last) $('#check-message')?.scrollIntoView({ block: 'nearest' });
    else focusHeading('#check-title');
  });
  $('#prev-question')?.addEventListener('click', () => {
    remember();
    session.question -= 1;
    session.confirm = false;
    renderCheck();
    focusHeading('#check-title');
  });
}

controls.train.addEventListener('click', () => setMode('training'));
controls.check.addEventListener('click', () => setMode('check'));
controls.skills.addEventListener('click', (event) => {
  const button = event.target.closest('[data-skill]');
  if (button) changeSkill(Number(button.dataset.skill));
});
controls.skillSelect.addEventListener('change', (event) => changeSkill(Number(event.target.value)));
controls.lesson.addEventListener('click', (event) => {
  const button = event.target.closest('[data-item]');
  if (button) changeSkill(state.skill, Number(button.dataset.item));
});
controls.checkCard.addEventListener('click', (event) => {
  const button = event.target.closest('button');
  if (!button) return;
  if (button.dataset.variant !== undefined) {
    state.variant = Number(button.dataset.variant);
    renderCheck();
    $(`[data-variant="${state.variant}"]`)?.focus();
  } else if (button.id === 'start-check') {
    state.check = { question: 0, values: [], confirm: false, finished: false };
    renderCheck();
    focusHeading('#check-title');
  } else if (button.id === 'restart-check') {
    state.check = null;
    renderCheck();
    focusHeading('#check-title');
  } else if (button.dataset.review !== undefined) {
    changeSkill(Number(button.dataset.review));
  }
});

setMode('training', false);

document.addEventListener('DOMContentLoaded', () => {
  if (!window.GeometryControlWork || !window.GeometryControlDrawing || !window.GeoMath) return;
  writtenWork = window.GeometryControlWork.mount(controls.writtenWork, TRAINERS, renderDiagram);
  controls.written.hidden = false;
  controls.written.addEventListener('click', () => setMode('written'));
  if (new URLSearchParams(location.search).get('mode') === 'written') setMode('written', false);
});
</script>
