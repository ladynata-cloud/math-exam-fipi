<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img"><title>Что я называю стройностью курса</title><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#2B57C4"/></marker></defs><rect width="1200" height="700" fill="#FCFCF9"/><text x="60" y="58" text-anchor="start" style="font-size:36px;font-weight:700;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="60" dy="0">Что я называю стройностью курса</tspan></text><text x="60" y="94" text-anchor="start" style="font-size:20px;font-weight:400;fill:#5A6B87;font-family:Arial,Segoe UI,sans-serif;"><tspan x="60" dy="0">Не одна шкала, а согласованность нескольких слоёв</tspan></text><circle cx="600" cy="370" r="105" fill="#DCE7FF" stroke="#2B57C4" stroke-width="4"/><text x="600" y="348" text-anchor="middle" style="font-size:28px;font-weight:700;fill:#2B57C4;font-family:Arial,Segoe UI,sans-serif;"><tspan x="600" dy="0">СТРОЙНОСТЬ</tspan></text><text x="600" y="384" text-anchor="middle" style="font-size:28px;font-weight:700;fill:#2B57C4;font-family:Arial,Segoe UI,sans-serif;"><tspan x="600" dy="0">КУРСА</tspan></text><line x1="600" y1="370" x2="170" y2="185" stroke="#D9DFE9" stroke-width="4"/><rect x="35" y="123" width="270" height="124" rx="18" fill="#FFFFFF" stroke="#D9DFE9" stroke-width="2"/><text x="170" y="170" text-anchor="middle" style="font-size:22px;font-weight:700;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="170" dy="0">Доказательная</tspan></text><text x="170" y="217" text-anchor="middle" style="font-size:16px;font-weight:400;fill:#5A6B87;font-family:Arial,Segoe UI,sans-serif;"><tspan x="170" dy="0">Что принято? Что доказано?</tspan></text><line x1="600" y1="370" x2="600" y2="165" stroke="#D9DFE9" stroke-width="4"/><rect x="465" y="103" width="270" height="124" rx="18" fill="#FFFFFF" stroke="#D9DFE9" stroke-width="2"/><text x="600" y="150" text-anchor="middle" style="font-size:22px;font-weight:700;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="600" dy="0">Понятийная</tspan></text><text x="600" y="197" text-anchor="middle" style="font-size:16px;font-weight:400;fill:#5A6B87;font-family:Arial,Segoe UI,sans-serif;"><tspan x="600" dy="0">Как возникает и уточняется</tspan><tspan x="600" dy="20">понятие?</tspan></text><line x1="600" y1="370" x2="1020" y2="190" stroke="#D9DFE9" stroke-width="4"/><rect x="885" y="128" width="270" height="124" rx="18" fill="#FFFFFF" stroke="#D9DFE9" stroke-width="2"/><text x="1020" y="175" text-anchor="middle" style="font-size:22px;font-weight:700;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="1020" dy="0">Последовательность</tspan></text><text x="1020" y="222" text-anchor="middle" style="font-size:16px;font-weight:400;fill:#5A6B87;font-family:Arial,Segoe UI,sans-serif;"><tspan x="1020" dy="0">Все ли предпосылки появились</tspan><tspan x="1020" dy="20">вовремя?</tspan></text><line x1="600" y1="370" x2="1060" y2="485" stroke="#D9DFE9" stroke-width="4"/><rect x="925" y="423" width="270" height="124" rx="18" fill="#FFFFFF" stroke="#D9DFE9" stroke-width="2"/><text x="1060" y="470" text-anchor="middle" style="font-size:22px;font-weight:700;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="1060" dy="0">Практическая</tspan></text><text x="1060" y="517" text-anchor="middle" style="font-size:16px;font-weight:400;fill:#5A6B87;font-family:Arial,Segoe UI,sans-serif;"><tspan x="1060" dy="0">Есть ли лестница к самостоятельной</tspan><tspan x="1060" dy="20">задаче?</tspan></text><line x1="600" y1="370" x2="795" y2="600" stroke="#D9DFE9" stroke-width="4"/><rect x="660" y="538" width="270" height="124" rx="18" fill="#FFFFFF" stroke="#D9DFE9" stroke-width="2"/><text x="795" y="585" text-anchor="middle" style="font-size:22px;font-weight:700;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="795" dy="0">Визуальная</tspan></text><text x="795" y="632" text-anchor="middle" style="font-size:16px;font-weight:400;fill:#5A6B87;font-family:Arial,Segoe UI,sans-serif;"><tspan x="795" dy="0">Чертёж объясняет или подменяет</tspan><tspan x="795" dy="20">вывод?</tspan></text><line x1="600" y1="370" x2="395" y2="600" stroke="#D9DFE9" stroke-width="4"/><rect x="260" y="538" width="270" height="124" rx="18" fill="#FFFFFF" stroke="#D9DFE9" stroke-width="2"/><text x="395" y="585" text-anchor="middle" style="font-size:22px;font-weight:700;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="395" dy="0">Вертикальная</tspan></text><text x="395" y="632" text-anchor="middle" style="font-size:16px;font-weight:400;fill:#5A6B87;font-family:Arial,Segoe UI,sans-serif;"><tspan x="395" dy="0">Связаны ли 5–6, 7, 8 и 9 классы?</tspan></text><line x1="600" y1="370" x2="130" y2="475" stroke="#D9DFE9" stroke-width="4"/><rect x="-5" y="413" width="270" height="124" rx="18" fill="#FFFFFF" stroke="#D9DFE9" stroke-width="2"/><text x="130" y="460" text-anchor="middle" style="font-size:22px;font-weight:700;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="130" dy="0">Учебная</tspan><tspan x="130" dy="25">самостоятельность</tspan></text><text x="130" y="507" text-anchor="middle" style="font-size:16px;font-weight:400;fill:#5A6B87;font-family:Arial,Segoe UI,sans-serif;"><tspan x="130" dy="0">Можно ли восстановить ход мысли</tspan><tspan x="130" dy="20">без учителя?</tspan></text><text x="1162" y="676" text-anchor="end" style="font-size:16px;font-weight:400;fill:#5A6B87;font-family:Arial,Segoe UI,sans-serif;"><tspan x="1162" dy="0">Схема: Н. М. Алябьева · MathExam</tspan></text></svg>