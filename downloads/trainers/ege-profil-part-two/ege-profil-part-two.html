      .replace(/[−–—]/g, '-').replace(/\s+/g, ' ')
      .replace(/\s*([;:,=(){}\[\]/])\s*/g, '$1');
  }

  function fraction(value) {
    const ratio = value.match(/^([+-]?\d+)\/([+-]?\d+)$/);
    if (ratio) {
      const denominator = BigInt(ratio[2]);
      return denominator ? [BigInt(ratio[1]), denominator] : null;
    }
    const decimal = value.match(/^([+-]?)(\d*)(?:[,.](\d*))?$/);
    if (!decimal || !(decimal[2] || decimal[3])) return null;
    const digits = decimal[3] || '';
    return [BigInt(decimal[1] + decimal[2] + digits), 10n ** BigInt(digits.length)];
  }

  function matches(input, expected) {
    const value = normalized(input);
    if (!value || value.length > 120) return false;
    const a = fraction(value);
    return expected.some(answer => {
      const target = normalized(answer);
      const b = fraction(target);
      return a && b ? a[0] * b[1] === b[0] * a[1] : value === target;
    });
  }

  function read(key) {
    const fallback = session.get(key) || { values: [], hinted: false, solved: false, mistakes: 0 };
    if (!canSave) return fallback;
    try {
      const raw = root.localStorage.getItem(storagePrefix + key);
      if (!raw) return fallback;
      const saved = JSON.parse(raw);
      if (saved && Array.isArray(saved.values) && saved.values.every(value => typeof value === 'string') &&
          typeof saved.hinted === 'boolean' && typeof saved.solved === 'boolean' &&
          Number.isSafeInteger(saved.mistakes) && saved.mistakes >= 0) return saved;
    } catch (_) {
      // A damaged entry can be replaced by the next attempt.
    }
    return fallback;
  }

  function update(key, change) {
    const state = read(key);
    if (state.solved) return state;
    Object.assign(state, change);
    session.set(key, state);
    if (canSave) {
      try {
        root.localStorage.setItem(storagePrefix + key, JSON.stringify(state));
      } catch (_) {
        canSave = false;
      }
    }
    return state;
  }

  function element(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text) node.textContent = text;
    return node;
  }

  function action(text, primary = false) {
    const button = element('button', 'profile-skill-button' + (primary ? ' profile-skill-button-primary' : ''), text);
    button.type = 'button';
    return button;
  }

  function keyFor(mapKey, challenge, index) {
    return `${mapKey}:${challenge.id || index}`;
  }

  function mapTitle(key, map) {
    return /^\d+$/.test(key) ? `№${key}${map.title ? ' · ' + map.title : ''}` : map.title;
  }

  function alphabetLinks(key, beforeLeave) {
    const catalog = root.ProfileAlphabetCatalog;
    const alphabets = catalog?.forNumber(key);
    if (!alphabets?.length) return null;
    const block = element('section', 'profile-skill-alphabets');
    block.append(element('h3', '', 'Вспомнить основы'));
    const back = root.location.pathname + root.location.search + root.location.hash;
    for (const alphabet of alphabets) {
      const group = element('div', 'profile-skill-alphabet-group');
      group.append(element('strong', '', alphabet.short));
      const list = element('ul');
      for (const [id, skill] of Object.entries(alphabet.skills)) {
        if (!skill.numbers.includes(Number(key))) continue;
        const link = element('a', '', skill.title);
        link.href = catalog.href(alphabet.id, id, key, back);
        link.setAttribute('data-profile-alphabet-link', '');
        if (beforeLeave) link.addEventListener('click', async event => {
          if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
          event.preventDefault();
          await beforeLeave();
          root.location.assign(link.href);
        });
        const row = element('li');
        row.append(link);
        list.append(row);
      }
      group.append(list);
      block.append(group);
    }
    return block;
  }

  function challengeForm(key, challenge, index, group, refresh) {
    const stateKey = keyFor(key, challenge, index);
    const state = read(stateKey);
    const card = element('article', 'profile-skill-challenge');
    card.setAttribute('data-profile-skill-challenge', '');
    card.append(element('h4', '', challenge.title), element('p', 'profile-skill-prompt', challenge.prompt));

    const form = element('form', 'profile-skill-form');
    const fields = challenge.fields || [{ label: 'Ответ', answers: challenge.answers }];
    const inputs = [];
    if (challenge.choices?.length) {
      const choices = element('fieldset', 'profile-skill-choices');
      choices.append(element('legend', '', 'Выберите ответ'));
      challenge.choices.forEach(choice => {
        const label = element('label', 'profile-skill-choice');
        const input = element('input');
        input.type = 'radio';
        input.name = `${group}-${index}`;
        input.value = choice;
        input.checked = state.values[0] === choice;
        input.setAttribute('data-profile-skill-answer', '');
        inputs.push(input);
        label.append(input, element('span', '', choice));
        choices.append(label);
      });
      form.append(choices);
    } else {
      fields.forEach((field, fieldIndex) => {
        const label = element('label', 'profile-skill-field', field.label || 'Ответ');
        const input = element('input');
        input.type = 'text';
        input.maxLength = 120;
        input.autocomplete = 'off';
        input.spellcheck = false;
        input.value = state.values[fieldIndex] || '';
        input.setAttribute('data-profile-skill-answer', '');
        inputs.push(input);
        label.append(input);
        form.append(label);
      });
    }

    function values() {
      return challenge.choices?.length ? [inputs.find(input => input.checked)?.value || ''] : inputs.map(input => input.value);
    }

    const submit = action('Проверить', true);
    submit.type = 'submit';
    form.append(submit);
    card.append(form);
    const hint = element('details', 'profile-skill-hint');
    hint.setAttribute('data-profile-skill-hint', '');
    hint.append(element('summary', '', 'Подсказка'), element('p', '', challenge.hint));
    const feedback = element('p', 'profile-skill-feedback');
    feedback.setAttribute('role', 'status');
    feedback.setAttribute('data-profile-skill-feedback', '');
    card.append(hint, feedback);

    function complete(record) {
      feedback.dataset.result = 'correct';
      feedback.textContent = (record.hinted ? 'Верно, с подсказкой. ' : 'Верно. ') + challenge.explanation;
      hint.hidden = true;
      submit.hidden = true;
      inputs.forEach(input => { input.disabled = true; input.removeAttribute('aria-invalid'); });
    }

    if (state.solved) complete(state);
    form.addEventListener('input', () => {
      inputs.forEach(input => input.removeAttribute('aria-invalid'));
      update(stateKey, { values: values() });
      refresh();
    });
    function recordHint() {
      update(stateKey, { hinted: true });
      refresh();
    }
    hint.querySelector('summary').addEventListener('click', () => { if (!hint.open) recordHint(); });
    hint.addEventListener('toggle', () => { if (hint.open) recordHint(); });
    form.addEventListener('submit', event => {
      event.preventDefault();
      const answers = values();
      if (answers.some(answer => !answer.trim())) {
        feedback.dataset.result = 'retry';
        feedback.textContent = challenge.choices?.length ? 'Выберите ответ.' : 'Заполните каждое поле.';
        const firstEmpty = answers.findIndex(answer => !answer.trim());
        inputs[firstEmpty]?.focus();
        return;
      }
      const results = fields.map((field, fieldIndex) => matches(answers[fieldIndex], field.answers));
      if (results.every(Boolean)) {
        complete(update(stateKey, { values: answers, solved: true, hinted: hint.open || read(stateKey).hinted }));
      } else {
        const mistakes = read(stateKey).mistakes + 1;
        const record = update(stateKey, { values: answers, mistakes });
        if (record.solved) complete(record);
        else {
          feedback.dataset.result = 'retry';
          feedback.textContent = `Пока не сходится. ${mistakes >= 2 ? 'Попробуйте подсказку.' : 'Сверьте ответ с условием.'}`;
          inputs.forEach((input, i) => input.setAttribute('aria-invalid', String(challenge.choices?.length || !results[i])));
        }
      }
      refresh();
    });
    return card;
  }

  function render(container, key, map, id, { lesson, beforeLeave }) {
    const layout = element('div', 'profile-skill-layout');
    const route = element('section', 'profile-skill-route');
    if (lesson?.skill) {
      route.append(element('h3', '', lesson.title), element('p', 'profile-skill-lesson-goal', lesson.skill));
    }
    route.append(element('h3', '', 'Что освоить'));
    const list = element('ol', 'profile-skill-steps');
    map.skills.forEach(skill => list.append(element('li', '', skill)));
    route.append(list);
    const alphabets = alphabetLinks(key, beforeLeave);
    if (alphabets) route.append(alphabets);

    const practice = element('section', 'profile-skill-practice');
    practice.append(element('h3', '', 'Творческие задания'));
    const summary = element('p', 'profile-skill-progress');
    summary.setAttribute('data-profile-skill-progress', '');
    practice.append(summary);
    function refresh() {
      const done = map.challenges.filter((challenge, index) => read(keyFor(key, challenge, index)).solved).length;
      summary.textContent = `Решено ${done} из ${map.challenges.length}${canSave ? '' : ' · до закрытия страницы'}`;
    }
    map.challenges.forEach((challenge, index) => practice.append(challengeForm(key, challenge, index, id, refresh)));
    refresh();
    layout.append(route, practice);
    container.replaceChildren(layout);
  }

  function mount(container, keys, options = {}) {
    const data = root.ProfileSkillMapData;
    if (!data || !container || root.self !== root.top || document.body.dataset.profileBoard) return null;
    const maps = [...new Set(keys.map(String))].map(key => [key, data.maps[key] || data.trainers[key]]).filter(([, map]) => map);
    if (!maps.length) return null;

    const id = 'profile-skill-dialog-' + (++nextDialogId);
    const entry = element('div', 'profile-skill-entry');
    const open = action('Карта навыков');
    open.setAttribute('data-profile-skill-trigger', '');
    open.setAttribute('aria-haspopup', 'dialog');
    open.setAttribute('aria-controls', id);
    const dialog = element('dialog', 'profile-skill-dialog');
    dialog.id = id;
    dialog.setAttribute('data-profile-skill-dialog', '');
    dialog.setAttribute('aria-labelledby', id + '-title');
    const heading = element('header', 'profile-skill-header');
    const title = element('h2', '', 'Карта навыков');
    title.id = id + '-title';
    const close = action('Вернуться');
    close.autofocus = true;
    heading.append(title, close);
    dialog.append(heading);

    const body = element('div', 'profile-skill-body');
    const select = element('select');
    let selected = maps[0];
    let lastPreferred;
    if (maps.length > 1) {
      select.setAttribute('data-profile-skill-select', '');
      for (const [key, map] of maps) {
        const option = element('option', '', mapTitle(key, map));
        option.value = key;
        select.append(option);
      }
      const label = element('label', 'profile-skill-picker', 'Выберите тему');
      label.append(select);
      dialog.append(label);
      select.addEventListener('change', () => {
        selected = maps.find(([key]) => key === select.value) || selected;
        render(body, ...selected, id, options);
      });
    } else {
      dialog.append(element('p', 'profile-skill-subtitle', mapTitle(...selected)));
    }
    dialog.append(body);
    entry.append(open, dialog);
    container.append(entry);

    function show() {
      const current = options.preferred?.();
      if (current && current !== lastPreferred) selected = maps.find(([key]) => key === String(current)) || selected;
      lastPreferred = current;
      select.value = selected[0];
      render(body, ...selected, id, options);
      if (typeof dialog.showModal === 'function') {
        if (!dialog.open) dialog.showModal();
      } else {
        dialog.setAttribute('open', '');
        close.focus();
      }
    }
    open.addEventListener('click', show);
    close.addEventListener('click', () => {
      if (typeof dialog.close === 'function') dialog.close();
      else { dialog.removeAttribute('open'); open.focus(); }
    });
    dialog.addEventListener('close', () => open.focus());
    if (!directOpenUsed && new URLSearchParams(root.location.search).get('skills') === '1') {
      directOpenUsed = true;
      // The course router focuses its heading immediately after rendering.
      root.setTimeout(() => { if (entry.isConnected) show(); }, 0);
    }
    return entry;
  }

  function optionByValue(spec, value) {
    return spec?.split(' ').find(pair => pair.split('=')[0] === value)?.split('=')[1];
  }

  function boot(script) {
    if (!script?.dataset.profileSkillMap || root.self !== root.top) return;
    const config = script.dataset;
    const keys = config.profileSkillMap.trim().split(/\s+/);
    let target = config.profileSkillTarget && document.querySelector(config.profileSkillTarget);
    if (!target) target = document.getElementById('profile-course-nav');
    if (!target) {
      const landmark = document.querySelector('h1, #pageTitle');
      if (!landmark) return;
      target = element('div', 'profile-skill-slot');
      landmark.after(target);
    }
    mount(target, keys, {
      preferred: () => optionByValue(config.profileSkillTopics, new URLSearchParams(root.location.search).get('topic')) ||
        optionByValue(config.profileSkillHashes, root.location.hash.slice(1))
    });
  }

  root.ProfileSkillMap = { mount, matches };
  if (typeof module !== 'undefined') module.exports = root.ProfileSkillMap;
  if (typeof document !== 'undefined') {
    const script = document.currentScript;
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => boot(script), { once: true });
    else boot(script);
  }
})(globalThis);

</script>
<script data-inline-source="/ege-profil/part-two/app.js">
(function(root){
'use strict';
const lessons=(root.ProfilePartTwoLessons||[]).slice().sort((a,b)=>a.exam-b.exam);
const titles={14:'Уравнения и отбор корней',15:'Стереометрия с доказательством',16:'Неравенства',17:'Моделирование и оптимизация',18:'Планиметрия с доказательством',19:'Задачи с параметром',20:'Числа и их свойства'};
const main=document.getElementById('main'),banner=document.getElementById('save-warning'),API=root.ProfilePartTwoState;
const byLesson=new Map(lessons.map(l=>[l.id,l])),byTask=new Map();
lessons.forEach(lesson=>lesson.tasks.forEach((task,index)=>byTask.set(task.id,{lesson,task,index})));
let storage;try{storage=root.localStorage;}catch(_){}
const store=API.create(storage,{locks:root.navigator?.locks,validate:(v,id)=>{const task=byTask.get(id)?.task;return !!task&&v.solvedSteps.length<=task.steps.length&&v.drafts.steps.length<=task.steps.length&&v.drafts.final.length<=task.final.length&&v.solutionSteps<=task.solution.length;},onWarning:text=>{banner.hidden=false;banner.textContent=text;}});
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const taskURL=(id,mode)=>'#task/'+encodeURIComponent(id)+'/'+mode;
const modeFor=index=>index>=3?'independent':'guided';
const modeLabels={guided:'С опорой по шагам',plan:'С коротким планом',independent:'Самостоятельно'};
const check=(answers,value)=>API.matches(answers,value,root.ProfileCheck);
const parameterGraphs={
 'param-modules':{
  preset:'plateau',title:'Горизонтальный участок',
  question:'Когда горизонталь пересекает две ветви, а когда совпадает с целым отрезком?'
 },
 'param-hole':{
  preset:'hole',title:'Выколотая точка',
  question:'Почему пересечение может исчезнуть при одном уровне горизонтали?'
 }
};
let routeVersion=0,active=null,labCleanup=null;
function graphURL(graph,target,help=''){
 const offline=root.MathExamTrainerOffline;
 const url=new URL(root.ProfileAlphabetCatalog.href('function-atlas','',19,target),offline?.origin||root.location.origin);
 url.searchParams.set('graph',graph.preset);
 if(help)url.searchParams.set('help',help);
 return offline?url.href:url.pathname+url.search+url.hash;
}
function parameterGraphRoutes(){
 const cards=Object.entries(parameterGraphs).map(([lessonId,graph])=>{
  const lesson=byLesson.get(lessonId);
  if(!lesson)return '';
  const available=lesson.tasks.slice(3).map(task=>({task,record:store.read(task.id)}))
   .filter(({record})=>!record.completed&&!record.helped);
  const draft=available.filter(({record})=>record.attemptCount||record.drafts.proof.trim()||record.drafts.final.some(value=>value.trim()))
   .sort((a,b)=>b.record.updatedAt-a.record.updatedAt)[0];
  const next=draft??available[0];
  const target=next?taskURL(next.task.id,'independent'):'#lesson/'+lessonId;
  const label=draft?'Продолжить условие':next?'Решить новое условие':'Открыть условия для повторения';
  const back=root.location.pathname+root.location.search+target;
  return `<article class="card"><h3>${graph.title}</h3><p>${graph.question}</p><div class="actions"><a class="button" href="${esc(graphURL(graph,back))}">Исследовать график</a><a class="button quiet" href="${target}">${label}</a></div></article>`;
 }).join('');
 return `<section id="parameter-graphs" class="panel" aria-labelledby="parameter-graphs-title"><h2 id="parameter-graphs-title">От графика к задаче №19</h2><div class="grid">${cards}</div></section>`;
}
function mountSkills(number,lesson){
 if(!root.ProfileSkillMap||root.self!==root.top)return;
 let target=main.querySelector('.modes');
 if(!target){
  target=document.createElement('div');main.querySelector('h1').after(target);
 }
 root.ProfileSkillMap.mount(target,[number],{
  lesson:lesson&&{title:lesson.title,skill:lesson.goal},
  beforeLeave:async()=>{if(active)await store.patch(active.item.task.id,r=>{if(!r.completed)r.helped=true;});await store.flush();}
 });
}
function correctedWithoutHelp(record){return record.independent&&record.attempts.find(a=>a.kind==='final')?.correct===false;}
function status(task,record){if(record.independent)return `<span class="tag ok">${correctedWithoutHelp(record)?'Исправлено без подсказки':'Ответы самостоятельно'}</span>`;if(record.completed)return '<span class="tag help">Ответы с опорой</span>';if(record.attemptCount||record.drafts.proof||record.drafts.openFinal?.trim()||record.drafts.final.some(Boolean)||record.solvedSteps.length)return '<span class="tag">Продолжить работу</span>';return '<span class="tag">Можно начать</span>';}
function stats(items){const out={total:0,completed:0,independent:0,helped:0,pending:0};items.forEach(l=>l.tasks.forEach(task=>{const r=store.read(task.id);out.total++;if(r.completed)out.completed++;if(r.independent)out.independent++;else if(r.completed)out.helped++;if(r.completed&&task.proof)out.pending++;}));return out;}
function badges(s){return `<div class="stats"><span class="tag">${s.total} условий</span><span class="tag ok">Самостоятельные ответы: ${s.independent}</span><span class="tag help">С опорой: ${s.helped}</span></div>`;}
function resume(items=lessons){let best=null;for(const lesson of items)for(let index=0;index<lesson.tasks.length;index++){const task=lesson.tasks[index],r=store.read(task.id);if(r.updatedAt&&!r.completed&&(!best||r.updatedAt>best.r.updatedAt))best={lesson,task,index,r};}return best;}
function home(){
 const s=stats(lessons),last=resume();
 main.innerHTML=`<p class="eyebrow">Профильный ЕГЭ · проект 2027</p><h1>Вторая часть: от метода до обоснования</h1><p class="lead">Все семь номеров №14–20. Выберите тему: три условия с опорой, затем три других условия для самостоятельной проверки. Сохраняются ответы, первая попытка и ваше обоснование.</p>${badges(s)}${last?`<a class="button" href="${taskURL(last.task.id,last.r.helped&&!last.r.drafts.openFinal?.trim()?'guided':modeFor(last.index))}">Продолжить: ${esc(last.lesson.title)}</a>`:''}<div class="grid">${Object.keys(titles).map(number=>{const group=lessons.filter(l=>l.exam===Number(number)),g=stats(group);return `<section class="card"><h2><span class="number">${number}</span>${titles[number]}</h2><p>${group.length} тем · ${g.total} условий</p><p class="caption">Самостоятельные ответы: ${g.independent}; с опорой: ${g.helped}.</p><a class="button" href="#exam/${number}">Открыть №${number}</a></section>`;}).join('')}</div><aside class="panel"><h2>Как оценивать результат</h2><p>Верный числовой ответ ещё не означает полное решение второй части. Запишите ход рассуждений и проверьте его по критериям. Доказательство остаётся на проверку преподавателю.</p><p>После подсказки условие отмечается как работа с опорой. Для новой самостоятельной проверки откройте другое условие.</p><a href="/ege-profil/start/#calm">Первая часть №1–13 и школьные основы →</a></aside>`;
}
function exam(number){
 const group=lessons.filter(l=>l.exam===number);if(!group.length)return missing();const s=stats(group),last=resume(group);
 main.innerHTML=`<a class="back" href="#map">← Все номера второй части</a><p class="eyebrow">Проект ЕГЭ 2027 · №${number}</p><h1>${titles[number]}</h1>${badges(s)}${number===20&&root.self===root.top?`<p><a class="button quiet" href="/trainers/ege-methods.html">Оценка плюс пример</a></p>`:''}${last?`<p><a class="button" href="${taskURL(last.task.id,last.r.helped&&!last.r.drafts.openFinal?.trim()?'guided':modeFor(last.index))}">Продолжить сохранённое условие</a></p>`:''}<div class="grid">${group.map((lesson,i)=>`<section class="card"><span class="eyebrow">Тема ${i+1} из ${group.length}</span><h2>${esc(lesson.title)}</h2><p>${esc(lesson.goal)}</p><p class="caption">${lesson.tasks.length} условий · ${stats([lesson]).independent} самостоятельных ответов</p><a class="button" href="#lesson/${lesson.id}">Начать или продолжить</a></section>`).join('')}</div><section class="panel"><h2>Проверка без подсказок</h2><p>Выберите по одному новому условию каждой темы. Сначала сами определите способ решения. После проверки вернитесь к темам, где понадобилась помощь.</p><div class="actions">${group.map(l=>{const unseen=l.tasks.slice(3).find(t=>{const r=store.read(t.id);return !r.completed&&!r.helped;})||l.tasks[3];return `<a class="button quiet" href="${taskURL(unseen.id,'independent')}">${esc(l.title)}</a>`;}).join('')}</div></section>`;
 mountSkills(number);
 const catalog=root.ProfileAlphabetCatalog;

   link.className='button quiet';
   link.href=catalog.href(topic.id,'',number,root.location.pathname+root.location.hash);
   link.textContent=topic.title;
   nav.append(link);
  }
