name: Rebuild the source-verified Atanasyan course through exercise 730
on:
  push:
    branches:
      - staging/atanasyan-exercises-through-730-bank-20261121
permissions:
  contents: write
jobs:
  reviewed-book-bank:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            stereo-course
            tools/stereo-textbook
            .stereo-transfer
          persist-credentials: false
      - name: Rebuild source, check the geometry, verify both digests and record the bank
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .stereo-transfer/verify.py
