function mathHtml(text){return String(text).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replace(/(\d+)\/(\d+)/g,'<span class="fraction"><span>$1</span><span>$2</span></span>')}
function setMathLabel(text,value){const match=String(value).match(/^([−-]?)(\d+)\/(\d+)$/);if(!match){text.textContent=value;return;}const x=Number(text.getAttribute('x')),y=Number(text.getAttribute('y'));text.setAttribute('font-size','22');const top=make('tspan',{x,y:y-5}),bar=make('tspan',{x,y:y+3}),bottom=make('tspan',{x,y:y+20});top.textContent=match[1]+match[2];bar.textContent='—';bottom.textContent=match[3];text.append(top,bar,bottom)}
const GUIDANCE={linear:'Перенеси слагаемые с x в одну сторону, числа — в другую. Если делишь на отрицательное число, поменяй знак неравенства.',quad:'Посмотри, где график находится выше и ниже оси x. Какие промежутки подходят к знаку неравенства?',graph:'Посмотри, какие промежутки отмечены на рисунке. Пустая точка исключает границу, закрашенная — включает.',special:'Квадрат любого числа неотрицателен. Может ли выражение оказаться меньше нуля? А равным нулю?',systems:'Каждое неравенство задаёт свой промежуток. Найди общую часть: там оба условия выполняются одновременно.'};
function renderTabs(){const box=$('tabs');box.replaceChildren();MODS.forEach(([m,n])=>{const b=document.createElement('button');b.type='button';b.className='tab '+(m===mod?'on':'');b.textContent=n;b.setAttribute('aria-pressed',String(m===mod));b.onclick=()=>{if(m===mod)return;saveCurrentState();mod=m;restoreState();renderAll()};box.appendChild(b)})}
function current(){return DATA[mod][idx[mod]%DATA[mod].length]}
function renderPanel(){
 const t=current(),p=$('modulePanel');p.replaceChildren();
 $('taskHeading').textContent=mod==='graph'?'Выбери неравенство':mod==='systems'?'Реши систему':mod==='special'?'Выбери верное условие':'Реши неравенство';
 $('taskText').innerHTML=mathHtml(mod==='special'?t.q:mod==='systems'?t.e.join('\n'):mod==='graph'?'Какому неравенству соответствует рисунок?':t.e);
 $('taskNote').textContent=mod==='quad'?'Выбери все подходящие промежутки.':mod==='systems'?'Выбери общую часть решений.':mod==='graph'?'Выбери один вариант ответа.':'Выбери один вариант ответа.';
 $('hintPanel').hidden=!hintOpen;$('hintToggle').setAttribute('aria-expanded',String(hintOpen));
 $('hintBox').textContent=GUIDANCE[mod];$('hintReference').innerHTML=mathHtml(mod==='quad'?'Нули: '+t.l1+' и '+t.l2+'. Для строгого неравенства границы не входят.':'');
 $('solutionText').hidden=!solution;$('solutionText').innerHTML=solution?mathHtml(t.hint):'';
 $('check').disabled=checked||solution;
 if(mod==='quad'){
  p.innerHTML='<div class="card"><div class="chipRow" id="chips" role="group" aria-label="Промежутки"></div><p class="small">Твой ответ: <span class="formula" id="ansPrev"></span></p></div>';
  renderChips(t);drawQuad(t);
 }else{
  p.innerHTML='<div class="card"><div class="choices" id="choices" role="group" aria-label="Варианты ответа"></div></div>';
  t.options.forEach((choice,i)=>{const button=document.createElement('button');button.type='button';button.className='choice '+(selectedChoice===choice?'on':'');button.innerHTML=mathHtml((i+1)+') '+choice);button.setAttribute('aria-pressed',String(selectedChoice===choice));button.disabled=checked||solution;button.onclick=()=>{selectedChoice=choice;setMsg('');renderAll()};$('choices').appendChild(button)});
  if(mod==='graph')drawGraphTask(t);else if(mod==='systems')drawSystem(t);else drawTextBoard(mod==='linear'?[t.e]:t.options,mod==='special'?'Вспомни: x² ≥ 0':'Начни с переноса слагаемых');
 }
 (mod==='graph'?$('givenBoard'):$('hintBoard')).appendChild($('board'));
}
function renderChips(t){const box=$('chips');box.replaceChildren();[0,1,2].forEach(i=>{const button=document.createElement('button');button.type='button';button.className='chip '+(selectedZones[i]?'on':'');button.innerHTML=mathHtml(zlab(i,t));button.setAttribute('aria-pressed',String(selectedZones[i]));button.disabled=checked||solution;button.onclick=()=>toggleZone(i);box.appendChild(button)});$('ansPrev').innerHTML=mathHtml(answerText(t))}
function toggleZone(i){if(checked||solution)return;selectedZones[i]=!selectedZones[i];setMsg('');renderAll()}
function resetState(){selectedChoice=null;selectedZones=[false,false,false];checked=false;solution=false;hintOpen=false;$('solutionDetails').open=false;setMsg('')}
function saveCurrentState(){sessionStates[mod+':'+idx[mod]]={selectedChoice,selectedZones:selectedZones.slice(),checked,solution,hintOpen,message:$('msg').innerHTML,messageClass:$('msg').className.replace(/^msg\s*/,''),solutionOpen:$('solutionDetails').open};}
function restoreState(){const saved=sessionStates[mod+':'+idx[mod]];if(!saved){resetState();return;}selectedChoice=saved.selectedChoice;selectedZones=saved.selectedZones.slice();checked=saved.checked;solution=saved.solution;hintOpen=saved.hintOpen;setMsg(saved.message,saved.messageClass);$('solutionDetails').open=saved.solutionOpen;}
function renderAll(){renderTabs();renderPanel();renderStats()}
function checkAnswer(){
 if(checked||solution)return;
 if(mod!=='quad'&&selectedChoice===null||mod==='quad'&&!selectedZones.some(Boolean)){setMsg('Сначала выбери ответ.','info');return;}
 const t=current(),ok=mod==='quad'?selectedZones.every((v,i)=>v===correctZones(t)[i]):selectedChoice===t.ans;
 checked=ok;rec(ok);setMsg(ok?'Верно!':'Пока не сходится. Можно изменить ответ или открыть подсказку.',ok?'ok':'err');renderAll();
}
function showSolution(){const t=current();solution=true;checked=true;hintOpen=true;if(mod==='quad'){selectedZones=correctZones(t).slice();setMsg('Ответ: '+mathHtml(answerText(t)),'warn')}else{selectedChoice=t.ans;setMsg('Ответ: '+mathHtml(t.ans),'warn')}renderAll();}
function toggleHint(){hintOpen=!hintOpen;renderAll()}
function startNewRound(){for(const key of Object.keys(sessionStates))delete sessionStates[key];for(const [key]of MODS)idx[key]=0;resetState();renderAll();$('settings').open=false;$('taskHeading').focus({preventScroll:true});$('taskHeading').scrollIntoView?.({block:'start',behavior:'auto'});}
function nextTask(){saveCurrentState();idx[mod]=(idx[mod]+1)%DATA[mod].length;restoreState();renderAll();$('taskHeading').scrollIntoView?.({block:'start',behavior:'auto'})}
renderAll();
</script>
</body>
</html>
