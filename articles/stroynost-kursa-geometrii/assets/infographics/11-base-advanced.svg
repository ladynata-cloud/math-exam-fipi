<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img"><title>Базовый и углублённый Мерзляк</title><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#2B57C4"/></marker></defs><rect width="1200" height="700" fill="#FCFCF9"/><text x="60" y="58" text-anchor="start" style="font-size:36px;font-weight:700;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="60" dy="0">Базовый и углублённый Мерзляк</tspan></text><text x="60" y="94" text-anchor="start" style="font-size:20px;font-weight:400;fill:#5A6B87;font-family:Arial,Segoe UI,sans-serif;"><tspan x="60" dy="0">Углубление — это не только «задачи потруднее»</tspan></text><rect x="90" y="170" width="430" height="390" rx="20" fill="#DCE7FF" stroke="#2B57C4" stroke-width="3"/><text x="305" y="225" text-anchor="middle" style="font-size:29px;font-weight:700;fill:#2B57C4;font-family:Arial,Segoe UI,sans-serif;"><tspan x="305" dy="0">Базовая линия</tspan></text><text x="135" y="285" text-anchor="start" style="font-size:19px;font-weight:400;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="135" dy="0">• обязательное ядро</tspan></text><text x="135" y="335" text-anchor="start" style="font-size:19px;font-weight:400;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="135" dy="0">• уровневая дифференциация</tspan></text><text x="135" y="385" text-anchor="start" style="font-size:19px;font-weight:400;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="135" dy="0">• ключевые задачи</tspan></text><text x="135" y="435" text-anchor="start" style="font-size:19px;font-weight:400;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="135" dy="0">• прикладные и проектные вставки</tspan></text><text x="135" y="485" text-anchor="start" style="font-size:19px;font-weight:400;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="135" dy="0">• координаты, векторы, движения</tspan></text><rect x="680" y="170" width="430" height="390" rx="20" fill="#E9E1FA" stroke="#6A4AB0" stroke-width="3"/><text x="895" y="225" text-anchor="middle" style="font-size:29px;font-weight:700;fill:#6A4AB0;font-family:Arial,Segoe UI,sans-serif;"><tspan x="895" dy="0">Углублённая линия</tspan></text><text x="725" y="285" text-anchor="start" style="font-size:19px;font-weight:400;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="725" dy="0">• леммы и следствия выделены явно</tspan></text><text x="725" y="335" text-anchor="start" style="font-size:19px;font-weight:400;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="725" dy="0">• длиннее цепочки зависимостей</tspan></text><text x="725" y="385" text-anchor="start" style="font-size:19px;font-weight:400;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="725" dy="0">• формула Чевы, Эйлера, инверсия</tspan></text><text x="725" y="435" text-anchor="start" style="font-size:19px;font-weight:400;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="725" dy="0">• больше задач на метод и конструкцию</tspan></text><text x="725" y="485" text-anchor="start" style="font-size:19px;font-weight:400;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="725" dy="0">• сильнее связь тем между классами</tspan></text><line x1="530" y1="365" x2="670" y2="365" stroke="#2B57C4" stroke-width="5" marker-end="url(#arrow)"/><text x="600" y="335" text-anchor="middle" style="font-size:18px;font-weight:700;fill:#2B57C4;font-family:Arial,Segoe UI,sans-serif;"><tspan x="600" dy="0">переход</tspan></text><text x="1162" y="676" text-anchor="end" style="font-size:16px;font-weight:400;fill:#5A6B87;font-family:Arial,Segoe UI,sans-serif;"><tspan x="1162" dy="0">Схема: Н. М. Алябьева · MathExam</tspan></text></svg>