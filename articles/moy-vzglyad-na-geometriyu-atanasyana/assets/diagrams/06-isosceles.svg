<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="title desc"><title id="title">Биссектриса создаёт два треугольника</title><desc id="desc">AB=AC дано, AD — биссектриса. Сторона AD общая; равенство BD=DC и прямые углы в исходных данных не отмечены.</desc><style>text{font-family:Arial,sans-serif;fill:#213f49;font-size:22px}.label{font-size:23px;font-style:italic}.small{font-size:18px;fill:#617579}.head{font-size:21px;font-weight:700}.line{fill:none;stroke:#213f49;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.teal{fill:none;stroke:#16746b;stroke-width:3;stroke-linecap:round}.red{fill:none;stroke:#bd654c;stroke-width:3;stroke-linecap:round}.gold{fill:none;stroke:#aa7623;stroke-width:3;stroke-linecap:round}.thin{fill:none;stroke:#617579;stroke-width:2}.dashed{stroke-dasharray:7 7}</style><rect width="900" height="460" rx="18" fill="#f5f6ef"/><text class="head" x="40" y="46">Только исходные условия</text><path d="M450 90 L220 340 H450 Z" fill="#d9e9df"/><path d="M450 90 L680 340 H450 Z" fill="#f3dfcf"/><path class="line" d="M450 90 L220 340 H680 Z"/><path class="red" d="M450 90 V340"/><circle cx="450" cy="90" r="4" fill="#213f49"/><text class="label" x="443" y="77">A</text><circle cx="220" cy="340" r="4" fill="#213f49"/><text class="label" x="213" y="370">B</text><circle cx="680" cy="340" r="4" fill="#213f49"/><text class="label" x="673" y="370">C</text><circle cx="450" cy="340" r="4" fill="#213f49"/><text class="label" x="443" y="370">D</text><path class="line" d="M340.2 219.7 L329.8 210.3"/><path class="line" d="M570.2 210.3 L559.8 219.7"/><path class="teal" d="M426.3 115.8 A35 35 0 0 0 450 125 M450 125 A35 35 0 0 0 473.7 115.8"/><text class="small" x="50" y="415">AB = AC · AD общая · ∠BAD = ∠DAC</text></svg>