<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title desc"><title id="title">Поворот не меняет угол</title><desc id="desc">На обоих рисунках угол ABC равен 60 градусам. Рисунок справа получен поворотом; вершина B остаётся средней буквой.</desc><style>text{font-family:Arial,sans-serif;fill:#213f49;font-size:22px}.label{font-size:23px;font-style:italic}.small{font-size:18px;fill:#617579}.head{font-size:21px;font-weight:700}.line{fill:none;stroke:#213f49;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.teal{fill:none;stroke:#16746b;stroke-width:3;stroke-linecap:round}.red{fill:none;stroke:#bd654c;stroke-width:3;stroke-linecap:round}.gold{fill:none;stroke:#aa7623;stroke-width:3;stroke-linecap:round}.thin{fill:none;stroke:#617579;stroke-width:2}.dashed{stroke-dasharray:7 7}</style><rect width="900" height="440" rx="18" fill="#f5f6ef"/><text class="head" x="42" y="45">Один угол в двух положениях</text><path class="line" d="M100 290 H345 M100 290 L222.5 77.8 M770 130 H525 M770 130 L647.5 342.2"/><path class="red" d="M145 290 A45 45 0 0 0 122.5 251 M725 130 A45 45 0 0 0 747.5 169"/><circle cx="100" cy="290" r="4" fill="#213f49"/><text class="label" x="93" y="321">B</text><circle cx="310" cy="290" r="4" fill="#213f49"/><text class="label" x="303" y="321">A</text><circle cx="200" cy="116.8" r="4" fill="#213f49"/><text class="label" x="193" y="103.8">C</text><circle cx="770" cy="130" r="4" fill="#213f49"/><text class="label" x="763" y="114">B</text><circle cx="560" cy="130" r="4" fill="#213f49"/><text class="label" x="553" y="114">A</text><circle cx="670" cy="303.2" r="4" fill="#213f49"/><text class="label" x="663" y="333.2">C</text><text x="45" y="392">∠ABC = ∠CBA</text><text class="small" x="495" y="392">Вершина B. Стороны BA и BC.</text></svg>