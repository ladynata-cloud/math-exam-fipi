<script>
/* =========================================================================
   БАНК ЗАДАЧ · ЗАДАНИЕ 2 ПРОФИЛЬНОГО ЕГЭ · ВЕКТОРЫ
   Прототипы — сборник И.В. Ященко «36 типовых вариантов», 2026.

   Файл самодостаточный: подключается один <script src="bank-t2-vectors.js">,
   глобальный объект YB2. Зависимостей нет.

   API:
     YB2.items                 — список типов [{id, name, src, gen}]
     YB2.make('v2')            — сгенерировать задачу указанного типа
     YB2.random()              — задача случайного типа
     YB2.srand(n)              — зафиксировать генератор (для тестов)

   Задача:
     { id, name, src,          — тип
       text,                   — условие (HTML)
       fig,                    — чертёж (строка SVG) или ''
       ans,                    — числовой ответ
       steps: [...],           — разбор по шагам (HTML)
       traps: [{v, msg}] }     — диагностика типичных неверных ответов

   Классы, которые нужно описать в CSS страницы:
     .fig            — сам <svg>
     .gd .ax         — клетка и оси
     .vc .vh         — линия вектора и наконечник (модификаторы .v0 .v1 .v2)
     .lb .sm .vt     — подписи
     .vv             — имя вектора в тексте (стрелка сверху через ::after)
   ========================================================================= */
var YB2 = (function () {
  "use strict";

  /* ------------------------------ случайность ------------------------------ */
  var _seed = 1;
  function srand(s) { _seed = (s >>> 0) || 1; }
  function rnd() {
    _seed ^= _seed << 13; _seed >>>= 0;
    _seed ^= _seed >> 17;
    _seed ^= _seed << 5; _seed >>>= 0;
    return _seed / 4294967296;
  }
  function ri(a, b) { return a + Math.floor(rnd() * (b - a + 1)); }
  function pick(a) { return a[Math.floor(rnd() * a.length)]; }

  /* -------------------------------- числа --------------------------------- */
  function round(x, n) { var k = Math.pow(10, n === undefined ? 6 : n); return Math.round(x * k) / k; }
  function nice(x, d) {                     // конечная десятичная дробь, ≤ d знаков
    d = d === undefined ? 3 : d;
    var k = Math.pow(10, d);
    return Math.abs(x * k - Math.round(x * k)) < 1e-7;
  }
  function num(x) {                         // 2.5 → «2,5»
    var v = round(x, 6);
    if (Object.is(v, -0)) v = 0;
    var s = String(v);
    if (s.indexOf('e') >= 0) s = v.toFixed(6).replace(/0+$/, '').replace(/\.$/, '');
    return s.replace('.', ',');
  }
  function isInt(x) { return Math.abs(x - Math.round(x)) < 1e-9; }

  /* ------------------------------- векторы -------------------------------- */
  function vlen(v) { return Math.hypot(v[0], v[1]); }
  function vdot(a, b) { return a[0] * b[0] + a[1] * b[1]; }
  function vcomb() {                        // vcomb(k1, a, k2, b, ...)
    var x = 0, y = 0, i;
    for (i = 0; i < arguments.length; i += 2) { x += arguments[i] * arguments[i + 1][0]; y += arguments[i] * arguments[i + 1][1]; }
    return [x, y];
  }
  function nz(a) { return a[0] !== 0 || a[1] !== 0; }
  function vstr(v) { return '(' + num(v[0]) + '; ' + num(v[1]) + ')'; }
  function vec(n) { return '<span class="vv">' + n + '</span>'; }
  function combTxt(pairs) {                 // [[3,'a'],[-2,'b']] → «3a − 2b»
    var s = '', i, k, n;

        text = 'Даны векторы ' + vec('a') + vstr(a) + ', ' + vec('b') + vstr(b) + ' и ' + vec('c') + '(<i>c</i>₀; ' + num(cc[1]) + '). Найдите <i>c</i>₀, если ' + vec('a') + '·(' + vec('b') + ' + ' + vec('c') + ') = 0.';
        st = [
          'Сложим внутри скобки: ' + vec('b') + ' + ' + vec('c') + ' = (' + num(b[0]) + ' + <i>c</i>₀; ' + num(b[1]) + ' + ' + num(cc[1]) + ') = (' + num(b[0]) + ' + <i>c</i>₀; ' + num(w[1]) + ').',
          'Скалярное произведение: ' + num(a[0]) + '·(' + num(b[0]) + ' + <i>c</i>₀) + (' + num(a[1]) + ')·(' + num(w[1]) + ') = 0.',
          num(a[0]) + '<i>c</i>₀ + ' + num(a[0] * b[0] + a[1] * w[1]) + ' = 0, откуда <i>c</i>₀ = <b>' + num(ans) + '</b>.',
          'Обрати внимание: раскрывать скобку до конца не обязательно — достаточно сложить ' + vec('b') + ' и ' + vec('c') + ' покоординатно.'
        ];
        tr = [
          { v: round(-ans, 6), msg: 'Знак при переносе слагаемого потерян.' },
          { v: round(-(a[1] * w[1]) / a[0], 6), msg: 'Забыто слагаемое с первой координатой вектора ' + vec('b') + '.' }
        ];
      }
      return { tid: 'v5', text: text, fig: '', ans: ans, steps: st, traps: tr };
    }
  };

  /* ============================== ТИП В6 ==============================
     Клетчатая бумага: скалярное произведение.
     Прототипы: варианты 3, 17, 18, 21, 22, 33, 34.                      */
  var V6 = {
    id: 'v6', line: 2, name: 'Клетчатая бумага: скалярное произведение',
    src: 'варианты 3, 17, 18, 21, 22, 33, 34',
    gen: function () {
      var three = rnd() < 0.35;
      var withK = !three && rnd() < 0.45;
      var a, b, c, k1 = 1, k2 = 1, ans, guard = 0;
      do {
        guard++;
        a = [ri(-6, 6), ri(-5, 5)];
        b = [ri(-6, 6), ri(-5, 5)];
        c = [ri(-5, 5), ri(-4, 4)];
        if (withK) { k1 = pick([1, 2, 2, 3]); k2 = pick([1, 2, 3]); if (k1 === 1 && k2 === 1) k2 = 2; }
        ans = three ? vdot(a, [b[0] + c[0], b[1] + c[1]]) : k1 * k2 * vdot(a, b);
      } while (guard < 3000 && !(nz(a) && nz(b) && (!three || nz(c)) && Math.abs(ans) >= 3 && Math.abs(ans) <= 160));

      var sl = slots(three ? 3 : 2);
      var items = [{ s: sl[0], v: a, name: 'a' }, { s: sl[1], v: b, name: 'b' }];
      if (three) items.push({ s: sl[2], v: c, name: 'c' });

      var q = three
        ? vec('a') + '·(' + vec('b') + ' + ' + vec('c') + ')'
        : 'векторов ' + (k1 === 1 ? '' : num(k1)) + vec('a') + ' и ' + (k2 === 1 ? '' : num(k2)) + vec('b');
      var lead = 'На координатной плоскости изображены векторы ' + vec('a') + ', ' + vec('b') + (three ? ' и ' + vec('c') : '') +
        ', координаты этих векторов — целые числа. Найдите скалярное произведение ' + q + '.';

      var st = ['Считаем координаты каждого вектора по клеткам, от начала стрелки к её концу: ' +
        vec('a') + vstr(a) + ', ' + vec('b') + vstr(b) + (three ? ', ' + vec('c') + vstr(c) : '') + '.'];
      if (three) {
        st.push(vec('b') + ' + ' + vec('c') + ' = ' + vstr([b[0] + c[0], b[1] + c[1]]) + '.');
        st.push(vec('a') + '·(' + vec('b') + ' + ' + vec('c') + ') = ' + a[0] + '·' + (b[0] + c[0]) + ' + (' + a[1] + ')·(' + (b[1] + c[1]) + ') = <b>' + ans + '</b>.');
      } else {
        st.push(vec('a') + '·' + vec('b') + ' = ' + a[0] + '·' + b[0] + ' + (' + a[1] + ')·(' + b[1] + ') = ' + vdot(a, b) + '.');
        st.push('Множители выносятся за скобку: ответ равен ' + num(k1 * k2) + '·' + vdot(a, b) + ' = <b>' + ans + '</b>.');
      }
      st.push('Важно: положение вектора на плоскости не влияет на его координаты — важна только разность «конец минус начало».');

      return {
        tid: 'v6', text: lead, fig: gridFig(items), ans: ans, steps: st,
        traps: [
          { v: vdot(a, b), msg: three ? 'Учтён только вектор ' + vec('b') + ': перед умножением сложи ' + vec('b') + ' и ' + vec('c') + '.' : 'Коэффициенты перед векторами не учтены.' },
          { v: -ans, msg: 'Знак противоположный: похоже, у одного из векторов перепутаны начало и конец стрелки.' },
          { v: three ? a[0] * (b[1] + c[1]) + a[1] * (b[0] + c[0]) : k1 * k2 * (a[0] * b[1] + a[1] * b[0]), msg: 'Перемножены разноимённые координаты: <i>x</i> с <i>x</i>, <i>y</i> с <i>y</i>.' }
        ]
      };
    }
  };

  /* ============================== ТИП В7 ==============================
     Клетчатая бумага: длина комбинации и косинус угла.
     Прототипы: варианты 4, 6, 10, 13, 14, 25, 26, 29, 30.               */
  var V7 = {
    id: 'v7', line: 2, name: 'Клетчатая бумага: длина и угол',
    src: 'варианты 4, 6, 10, 13, 14, 25, 26, 29, 30',
    gen: function () {
      var mode = pick(['len', 'len3', 'cos']);
      var a, b, c, k1, k2, ans, r, guard = 0;

      if (mode === 'cos') {
        var TR = [[3, 4], [4, 3], [6, 8], [8, 6], [5, 12], [12, 5], [3, 0], [0, 4], [6, 0], [0, 5], [4, 0]];
        do {
          guard++;
          a = TR[Math.floor(rnd() * TR.length)].slice();
          b = TR[Math.floor(rnd() * TR.length)].slice();
          if (rnd() < 0.5) a[0] = -a[0];
          if (rnd() < 0.5) a[1] = -a[1];
          if (rnd() < 0.5) b[0] = -b[0];
          if (rnd() < 0.5) b[1] = -b[1];
          ans = nz(a) && nz(b) ? round(vdot(a, b) / (vlen(a) * vlen(b)), 6) : 2;
        } while (guard < 4000 && !(Math.abs(ans) < 0.999 && Math.abs(ans) > 0.02 && nice(ans, 4) &&
          Math.abs(a[0]) <= 8 && Math.abs(a[1]) <= 6 && Math.abs(b[0]) <= 8 && Math.abs(b[1]) <= 6));
      } else if (mode === 'len') {
        do {
          guard++;
          k1 = pick([1, 2, 3, 4, 5, 6]); k2 = pick([1, 2, 3, 4, 5]);
          if (k1 === 1 && k2 === 1) k2 = 2;
          a = [ri(-5, 5), ri(-4, 4)];
          b = [ri(-5, 5), ri(-4, 4)];
          r = vcomb(k1, a, -k2, b);
          ans = round(vlen(r), 6);
        } while (guard < 5000 && !(nz(a) && nz(b) && isInt(ans) && ans >= 5 && ans <= 60 && r[0] !== 0 && r[1] !== 0));
      } else {
        do {
          guard++;
          a = [ri(-5, 5), ri(-4, 4)];
          b = [ri(-5, 5), ri(-4, 4)];
          c = [ri(-5, 5), ri(-4, 4)];
          r = vcomb(1, a, 1, b, 1, c);
          ans = round(vlen(r), 6);
        } while (guard < 5000 && !(nz(a) && nz(b) && nz(c) && isInt(ans) && ans >= 5 && ans <= 40 && r[0] !== 0 && r[1] !== 0));
      }

      var sl = slots(mode === 'len3' ? 3 : 2);
      var items = [{ s: sl[0], v: a, name: 'a' }, { s: sl[1], v: b, name: 'b' }];
      if (mode === 'len3') items.push({ s: sl[2], v: c, name: 'c' });

      var lead = 'На координатной плоскости изображены векторы ' + vec('a') + ', ' + vec('b') + (mode === 'len3' ? ' и ' + vec('c') : '') +
        ', координаты этих векторов — целые числа. ';
      var st, tr;

      if (mode === 'cos') {
        lead += 'Найдите cos α, где α — угол между векторами ' + vec('a') + ' и ' + vec('b') + '.';
        st = [
          'Снимаем координаты с рисунка: ' + vec('a') + vstr(a) + ', ' + vec('b') + vstr(b) + '.',
          vec('a') + '·' + vec('b') + ' = ' + a[0] + '·' + b[0] + ' + (' + a[1] + ')·(' + b[1] + ') = ' + vdot(a, b) + '.',
          '|' + vec('a') + '| = √' + (a[0] * a[0] + a[1] * a[1]) + ' = ' + num(round(vlen(a), 6)) +
            ', |' + vec('b') + '| = √' + (b[0] * b[0] + b[1] * b[1]) + ' = ' + num(round(vlen(b), 6)) + '.',
          'cos α = ' + vdot(a, b) + ' : ' + num(round(vlen(a) * vlen(b), 6)) + ' = <b>' + num(ans) + '</b>.'
        ];
        tr = [
          { v: round(vdot(a, b), 6), msg: 'Это скалярное произведение. Его ещё нужно поделить на произведение длин.' },
          { v: round(-ans, 6), msg: 'Знак другой: проверь направление стрелок, где начало и где конец каждого вектора.' }
        ];
      } else if (mode === 'len') {
        lead += 'Найдите длину вектора ' + combTxt([[k1, 'a'], [-k2, 'b']]) + '.';
        st = [
          'Снимаем координаты: ' + vec('a') + vstr(a) + ', ' + vec('b') + vstr(b) + '.',
          combTxt([[k1, 'a'], [-k2, 'b']]) + ' = ' + vstr(r) + '.',
          'Длина: √(' + (r[0] * r[0]) + ' + ' + (r[1] * r[1]) + ') = √' + (r[0] * r[0] + r[1] * r[1]) + ' = <b>' + num(ans) + '</b>.'
        ];
        tr = [
          { v: round(vlen(vcomb(k1, a, k2, b)), 6), msg: 'Знак перед вторым вектором потерян: там вычитание.' },
          { v: r[0] * r[0] + r[1] * r[1], msg: 'Это квадрат длины — осталось извлечь корень.' }
        ];
      } else {
        lead += 'Найдите длину вектора ' + vec('a') + ' + ' + vec('b') + ' + ' + vec('c') + '.';
        st = [
          'Снимаем координаты: ' + vec('a') + vstr(a) + ', ' + vec('b') + vstr(b) + ', ' + vec('c') + vstr(c) + '.',
          'Складываем покоординатно: ' + vstr(r) + '.',
          'Длина: √' + (r[0] * r[0] + r[1] * r[1]) + ' = <b>' + num(ans) + '</b>.'
        ];
        tr = [
          { v: r[0] * r[0] + r[1] * r[1], msg: 'Это квадрат длины — извлеки корень.' },
          { v: round(vlen(a) + vlen(b) + vlen(c), 6), msg: 'Длины не складываются: сначала складываем координаты, потом считаем длину.' }
        ];
      }
      return { tid: 'v7', text: lead, fig: gridFig(items), ans: ans, steps: st, traps: tr };
    }
  };

  /* ================================ РЕЕСТР ================================ */
  var ITEMS = [V1, V2, V3, V4, V5, V6, V7];
  var byId = {};
  ITEMS.forEach(function (t) { byId[t.id] = t; });

  function make(id) {
    var t = byId[id];
    if (!t) return null;
    var q = t.gen();
    q.id = id; q.name = t.name; q.line = 2; q.src = t.src;
    /* ловушка имеет смысл, только если она отличается от верного ответа
       и не дублирует другую ловушку: иначе диагностика соврёт ученику */
    var seen = [];
    q.traps = (q.traps || []).filter(function (tr) {
      if (!isFinite(tr.v)) return false;
      if (Math.abs(tr.v - q.ans) < 1e-9) return false;
      for (var i = 0; i < seen.length; i++) if (Math.abs(seen[i] - tr.v) < 1e-9) return false;
      seen.push(tr.v);
      return true;
    });
    return q;
  }
  function random() { return make(ITEMS[Math.floor(rnd() * ITEMS.length)].id); }

  return {
    items: ITEMS, byId: byId, make: make, random: random,
    srand: srand, num: num, CELL: CELL
  };
})();
if (typeof module !== 'undefined') module.exports = YB2;

</script>
<script>
/* ============================================================
   Векторы · задание 2 (Ященко-2026) — интерфейс поверх банка YB2.
   Режимы: Разбор (автопоказ), Тренировка (с диагностикой), Зачёт (7 задач).
   Прогресс и журнал ошибок — в едином ключе курса.
   ============================================================ */
'use strict';
if (typeof module !== 'undefined'){ Object.assign(global, { YB2: require('./bank-t2-vectors.js') }); }

const COURSE_KEY = 'mathExamCourseProgress.v1';
const TID = 'ege-t2-yashchenko';
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const PRAISE = ['Верно!', 'Точно!', 'Да, так!', 'Правильно!', 'Есть!'];
const SHORT = { v1: 'Длина', v2: 'Скалярное', v3: 'Косинус', v4: 'С коэффициентами', v5: 'Координата', v6: 'Клетка: a·b', v7: 'Клетка: длина и угол' };
const MODE_HELP = {
  learn: 'Разбор для доски: задача показана сразу с решением по шагам. «Ещё пример» — новая задача того же типа.',
  train: 'Решайте и проверяйте. При промахе тренажёр подскажет, откуда взялось именно ваше число, — а разбор можно открыть в любой момент.',
  exam: 'Семь задач — по одной каждого типа, в случайном порядке. Разбор откроется после финиша. Зачёт — 7 из 7.'
};
const TYPE_IDS = ['v1', 'v2', 'v3', 'v4', 'v5', 'v6', 'v7'];

/* ---------- хранение ---------- */
function readAll(){ try { return JSON.parse(localStorage.getItem(COURSE_KEY) || '{}'); } catch (e){ return {}; } }
function writeAll(all){ try { localStorage.setItem(COURSE_KEY, JSON.stringify(all)); } catch (e){} }
let stats = loadStats();
function loadStats(){
  const s = readAll()[TID] || {};
  return { types: s.types || {}, runs: s.runs || 0, best: s.best || 0, passed: !!s.passed, board: !!s.board };
}
function saveStats(){ const all = readAll(); all[TID] = stats; writeAll(all); }
function tstat(id){ return stats.types[id] || (stats.types[id] = { solved: 0, correct: 0, streak: 0, best: 0 }); }

/* журнал ошибок: тип закрывается тремя верными подряд */
function mlog(type, okFlag){
  const all = readAll();
  const mk = all.mistakes = all.mistakes || {};
  const e = mk[TID + '|' + type] = mk[TID + '|' + type] || { w: 0, r: 0 };
  if (okFlag){ if (e.w) e.r = (e.r || 0) + 1; }
  else { e.w = (e.w || 0) + 1; e.r = 0; e.lastWrong = Date.now(); }
  e.last = Date.now();
  writeAll(all);
}
function openTypes(){
  const mk = readAll().mistakes || {}, pre = TID + '|', res = [];
  for (const k in mk) if (k.indexOf(pre) === 0 && (mk[k].w || 0) > 0 && (mk[k].r || 0) < 3 && TYPE_IDS.includes(k.slice(pre.length))) res.push(k.slice(pre.length));
  return res;
}

/* ---------- состояние ---------- */
const state = {
  type: 'mix', mode: 'train', task: null,
  fails: 0, finished: false, counted: false, showSteps: false, fb: null,
  review: false, reviewEmpty: false,
  z: null            // зачёт: { plan:[], i, marks:[], tasks:[], answers:[], done }
};

document.addEventListener('profile-course-help-requested',()=>{
  if(state.mode==='exam'){
    const z=state.z;if(z&&!z.done){(z.assisted||(z.assisted=[]))[z.i]=true;}
  }else if(state.mode==='train'&&state.task&&!state.finished)state.courseHelpUsed=true;
});
function newTask(){
  state.courseHelpUsed=false;
  state.fails = 0; state.finished = false; state.counted = false; state.showSteps = false; state.fb = null;
  if (state.review){
    const open = openTypes();
    if (open.length){
      const ty = open[Math.floor(Math.random() * open.length)];
      state.task = YB2.make(ty);
    } else { state.review = false; state.reviewEmpty = true; state.task = makeByFilter(); }
  } else {
    state.task = makeByFilter();
  }
  render();
}
function makeByFilter(){ return state.type === 'mix' ? YB2.random() : YB2.make(state.type); }
function setType(t){ state.review = false; state.reviewEmpty = false; state.type = t; if (state.mode === 'exam') state.z = null; newTask(); }
function setMode(m){
  state.review = false; state.reviewEmpty = false; state.mode = m;
  if (m === 'exam'){ state.z = null; renderExamIntro(); return; }
  newTask();
}

/* ---------- разметка задачи ---------- */
function esc(s){ return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
function tagHtml(t){ return `<span class="tag">${esc(SHORT[t.id] || t.id)} <em>· прототип: ${esc(t.src)}</em></span>`; }
function figHtml(t){ return t.fig ? `<div class="figwrap">${t.fig}</div>` : ''; }
function stepsHtml(t){ return `<ol class="steps">${t.steps.map(s => `<li>${s}</li>`).join('')}</ol>`; }
function fbHtml(){ return state.fb ? `<div class="fb ${state.fb.type}" role="status">${state.fb.html}</div>` : ''; }

function renderTypes(){
  const host = $('#types');
  const chip = (id, label, dots) => `<button class="chip" data-type="${id}" aria-pressed="${state.type === id && !state.review}">${label}${dots}</button>`;
  let html = chip('mix', 'Все типы', '');
  for (const it of YB2.items){
    const s = tstat(it.id);
    const n = Math.min(3, s.streak >= 3 ? 3 : s.streak);
    const closed = s.best >= 3;
    const dots = `<span class="dots" title="серия верных с первой попытки">${[0, 1, 2].map(i => `<i class="${(closed ? 3 : n) > i ? 'on' : ''}"></i>`).join('')}</span>`;
    html += chip(it.id, esc(SHORT[it.id]), dots);
  }
  host.innerHTML = html;
}
function renderHelp(){
  const mh = $('#modeHelp');
  if (state.review){
    mh.innerHTML = `<b>Работа над ошибками:</b> задачи только из ваших открытых типов (${openTypes().length}). Тип закрывается тремя верными подряд. ` + MODE_HELP[state.mode];
  } else if (state.reviewEmpty){
    mh.innerHTML = '<b>Открытых ошибок нет</b> — отличная новость. Ниже обычный режим. ' + MODE_HELP[state.mode];
  } else mh.textContent = MODE_HELP[state.mode];
}

function renderTrainCard(){
  const t = state.task;
  const done = state.finished;
  const inputRow = done
    ? `<p class="ansline">Ответ: <b>${YB2.num(t.ans)}</b></p>${fbHtml()}`
    : `<div class="inrow"><span class="lab">Ответ:</span><input class="num" type="text" inputmode="text" autocomplete="off" placeholder="число" aria-label="Ответ"><button class="btn primary" data-action="check">Проверить</button></div>
       <p class="fieldnote">Можно с запятой (0,25) или с точкой; отрицательное — со знаком минус.</p>${fbHtml()}`;
  const stepsBlock = (state.mode === 'learn' || state.showSteps)
    ? `<p class="ansline" style="margin-top:14px">Решение:</p>${stepsHtml(t)}${state.mode === 'learn' ? `<p class="ansline">Ответ: <b>${YB2.num(t.ans)}</b></p>` : ''}`
    : '';
  const actions = state.mode === 'learn'
    ? `<div class="actions"><button class="btn primary" data-action="new">Ещё пример</button></div>`
    : `<div class="actions">
         ${done || state.fails >= 1 ? `<button class="btn ${state.showSteps ? '' : 'warm'}" data-action="steps">${state.showSteps ? 'Скрыть разбор' : 'Показать разбор'}</button>` : ''}
         <span class="spacer"></span><button class="btn" data-action="new">Новая задача</button>
       </div>`;
  $('#taskArea').innerHTML = `<article class="card">
    ${tagHtml(t)}
    <p class="q">${t.text}</p>
    ${figHtml(t)}
    ${state.mode === 'learn' ? '' : inputRow}
    ${stepsBlock}
    ${actions}
  </article>`;
  const inp = $('#taskArea input.num'); if (inp) inp.focus();
}

/* ---------- зачёт ---------- */
function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function startExam(){
  const plan = shuffle(TYPE_IDS.slice());
  state.z = { plan, i: 0, marks: [], tasks: plan.map(id => YB2.make(id)), answers: [], done: false };
  state.fb = null; state.fails = 0;
  renderExam();
}
function renderExamIntro(){
  renderTypes(); renderHelp();
  $('#taskArea').innerHTML = `<article class="card">
    <p class="q"><b>Зачёт:</b> семь задач подряд — по одной каждого типа, порядок случайный. Разбор и правильные ответы откроются после последней задачи. Результат записывается; зачёт сдан при 7 из 7.</p>

}
function renderExam(){

function renderExamResult(){
  const z = state.z;

/* ---------- проверка ---------- */
function answerRatio(raw){
  const value = String(raw ?? '').trim().replace(/−/g, '-').replace(/,/g, '.');
  if (value.length > 120) return null;
  const parts = value.split('/').map(part => part.trim());
  if (parts.length > 2 || parts.some(part => !/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(part))) return null;
  function decimal(part){
    const [whole, digits = ''] = part.replace(/^[+-]/, '').split('.');
    const numerator = BigInt(whole + digits) * (part.startsWith('-') ? -1n : 1n);
    return [numerator, 10n ** BigInt(digits.length)];
  }
  const [top, scale] = decimal(parts[0]);
  if (parts.length === 1) return [top, scale];
  const [bottom, divisorScale] = decimal(parts[1]);
  return bottom === 0n ? null : [top * divisorScale, scale * bottom];
}
function parseNum(str){
  const value = answerRatio(str);
  return value ? Number(value[0]) / Number(value[1]) : NaN;
}
function matchesAnswer(raw, expected){
  const value = answerRatio(raw);
  // Both generators display finite decimals with at most six places.
  const key = answerRatio(expected.toFixed(6));
  return !!(value && key && value[0] * key[1] === key[0] * value[1]);
}
const EPS = 1e-6;
function diagnose(x, t){
  const hit = (t.traps || []).find(tr => Math.abs(tr.v - x) < EPS);
  return hit ? hit.msg : null;
}
function checkTrain(){
  const t = state.task;
  const inp = $('#taskArea input.num');
  const x = parseNum(inp.value);
  inp.classList.remove('ok', 'bad');
  if (isNaN(x)){ inp.classList.add('bad'); state.fb = { type: 'hint', html: 'Введите число: с запятой (0,25), с точкой или обыкновенной дробью (1/4).' }; return renderTrainCard(); }
  const s = tstat(state.task.id);
  if (matchesAnswer(inp.value, t.ans)){
    state.finished = true;
    if (!state.counted){
      state.counted = true; s.solved++;
      if (state.fails === 0&&!state.courseHelpUsed){ s.correct++; s.streak++; s.best = Math.max(s.best, s.streak); }
      if(state.courseHelpUsed)s.streak=0;
      saveStats();
    }
    if (state.mode === 'train'&&!state.courseHelpUsed) mlog(t.id, true);
    state.fb = { type: 'ok', html: state.courseHelpUsed?'Верно с помощью. В самостоятельную серию этот ответ не входит.':`${PRAISE[Math.floor(Math.random() * PRAISE.length)]}${state.fails ? ' Со второй попытки, но верно.' : ''}` };
    return render();
  }
  state.fails++;
  if (!state.counted && state.fails === 1){ s.streak = 0; saveStats(); }
  if (state.mode === 'train') mlog(t.id, false);
  inp.classList.add('bad');
  const dg = diagnose(x, t);
  let html = dg || (Math.abs(x - t.ans) < 0.01 * Math.max(1, Math.abs(t.ans))
    ? 'Почти! Похоже на округление. Ответ — конечная десятичная дробь, запишите точно.'
    : 'Пока не так. Проверьте вычисления по координатам.');
  if (state.fails >= 2 && !dg) html += ' Откройте разбор и сверьтесь по шагам.';
  state.fb = { type: 'bad', html };
  renderTrainCard();
}
function examCheck(){
  const z = state.z, t = z.tasks[z.i];
  const inp = $('#taskArea input.num');
  const x = parseNum(inp.value);
  if (isNaN(x)){ state.fb = { type: 'hint', html: 'Введите число — иначе ответ не засчитается.' }; return renderExam(); }
  const mathematicallyCorrect = matchesAnswer(inp.value, t.ans);
  const okAns = mathematicallyCorrect&&!z.assisted?.[z.i];
  z.marks[z.i] = okAns; z.answers[z.i] = inp.value.trim();
  if(!z.assisted?.[z.i]||!mathematicallyCorrect)mlog(t.id, mathematicallyCorrect);
  const s = tstat(t.id); s.solved++; if (okAns){ s.correct++; } else { s.streak = 0; }
  state.fb = null;
  z.i++;
  if (z.i >= z.plan.length){
    z.done = true;
    const score = z.marks.filter(Boolean).length;
    stats.runs++; stats.best = Math.max(stats.best, score); if (score === 7) stats.passed = true;
  }
  saveStats();
  renderExam();
}

/* ---------- каркас ---------- */
function render(){
  renderTypes(); renderHelp();
  if (state.mode === 'exam') return renderExam();
  renderTrainCard();
}
function setBoard(on){
  document.documentElement.classList.toggle('board', on);
  const b = $('#boardBtn'); b.setAttribute('aria-pressed', String(on)); b.textContent = on ? 'Обычный вид' : 'Режим доски';
  stats.board = on; saveStats();
}
/* Зеркало не сохраняется: это настройка проектора, а не ученика. */
function setMirror(on){
  document.documentElement.classList.toggle('mirror', on);
  const b = $('#mirrorBtn'); b.setAttribute('aria-pressed', String(on)); b.textContent = on ? 'Убрать зеркало' : 'Зеркало';
}
function canFullscreen(){
  const r = document.documentElement;
  return !!(r.requestFullscreen || r.webkitRequestFullscreen);
}
function toggleFullscreen(){
  const r = document.documentElement;
  try{
    if (document.fullscreenElement || document.webkitFullscreenElement)
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else
      (r.requestFullscreen || r.webkitRequestFullscreen).call(r);
  }catch(e){ /* на доске без поддержки просто ничего не происходит */ }
}
function urlFlag(name){
  return new RegExp('(^|[?&])' + name + '=1(&|$)').test(location.search || '');
}
function init(){
  $('#types').addEventListener('click', e => { const c = e.target.closest('[data-type]'); if (c) setType(c.dataset.type); });
  $('#modeSeg').addEventListener('click', e => {
    const b = e.target.closest('[data-mode]'); if (!b) return;
    $$('#modeSeg [data-mode]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    setMode(b.dataset.mode);
  });
  $('#taskArea').addEventListener('click', e => {
    const btn = e.target.closest('[data-action]'); if (!btn) return;
    const act = btn.dataset.action;
    if (act === 'check') checkTrain();
    else if (act === 'new') newTask();
    else if (act === 'steps'){ state.showSteps = !state.showSteps; renderTrainCard(); }
    else if (act === 'exam-start') startExam();
    else if (act === 'exam-check') examCheck();
    else if (act === 'to-train'){ $$('#modeSeg [data-mode]').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.mode === 'train'))); setMode('train'); }
  });
  $('#taskArea').addEventListener('keydown', e => {
    if (e.key !== 'Enter' || !e.target.classList.contains('num')) return;
    if (state.mode === 'exam') examCheck(); else checkTrain();
  });
  $('#boardBtn').addEventListener('click', () => setBoard(!document.documentElement.classList.contains('board')));
  $('#mirrorBtn').addEventListener('click', () => setMirror(!document.documentElement.classList.contains('mirror')));
  if (canFullscreen()) $('#fsBtn').addEventListener('click', toggleFullscreen);
  else $('#fsBtn').remove();
  if (stats.board) setBoard(true);
  if (urlFlag('board')) setBoard(true);
  if (urlFlag('mirror')) setMirror(true);
  if (/(^|[?&])mode=review/.test(location.search || '')){ state.review = true; state.mode = 'train'; }
  newTask();
}
if (typeof document !== 'undefined') document.addEventListener('DOMContentLoaded', init);
if (typeof module !== 'undefined'){ module.exports = { parseNum, diagnose }; }

<script data-inline-source="/ege-profil/skill-map.js" data-profile-skill-map="vectors-yashchenko">
(function (root) {
  'use strict';

  const storagePrefix = 'mathexam.profile-skill-map.v1.';
  const session = new Map();
  let nextDialogId = 0;
  let directOpenUsed = false;
  let canSave = true;

  function normalized(value) {
    return String(value).normalize('NFKC').toLowerCase().trim()
      .replace(/[−–—]/g, '-').replace(/\s+/g, ' ')
      .replace(/\s*([;:,=(){}\[\]/])\s*/g, '$1');
  }

  function fraction(value) {
    const ratio = value.match(/^([+-]?\d+)\/([+-]?\d+)$/);
    if (ratio) {
      const denominator = BigInt(ratio[2]);
      return denominator ? [BigInt(ratio[1]), denominator] : null;
    }
    const decimal = value.match(/^([+-]?)(\d*)(?:[,.](\d*))?$/);
    if (!decimal || !(decimal[2] || decimal[3])) return null;
    const digits = decimal[3] || '';
    return [BigInt(decimal[1] + decimal[2] + digits), 10n ** BigInt(digits.length)];
  }

  function matches(input, expected) {
    const value = normalized(input);
    if (!value || value.length > 120) return false;
    const a = fraction(value);
    return expected.some(answer => {
      const target = normalized(answer);
      const b = fraction(target);
      return a && b ? a[0] * b[1] === b[0] * a[1] : value === target;
    });
  }

  function read(key) {
    const fallback = session.get(key) || { values: [], hinted: false, solved: false, mistakes: 0 };
    if (!canSave) return fallback;
    try {
      const raw = root.localStorage.getItem(storagePrefix + key);
      if (!raw) return fallback;
      const saved = JSON.parse(raw);
      if (saved && Array.isArray(saved.values) && saved.values.every(value => typeof value === 'string') &&
          typeof saved.hinted === 'boolean' && typeof saved.solved === 'boolean' &&
          Number.isSafeInteger(saved.mistakes) && saved.mistakes >= 0) return saved;
    } catch (_) {
      // A damaged entry can be replaced by the next attempt.
    }
    return fallback;
  }

  function update(key, change) {
    const state = read(key);
    if (state.solved) return state;
    Object.assign(state, change);
    session.set(key, state);
    if (canSave) {
      try {
        root.localStorage.setItem(storagePrefix + key, JSON.stringify(state));
      } catch (_) {
        canSave = false;
      }
    }
    return state;
  }

  function element(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text) node.textContent = text;
    return node;
  }

  function action(text, primary = false) {
    const button = element('button', 'profile-skill-button' + (primary ? ' profile-skill-button-primary' : ''), text);
    button.type = 'button';
    return button;
  }

  function keyFor(mapKey, challenge, index) {
    return `${mapKey}:${challenge.id || index}`;
  }

  function mapTitle(key, map) {
    if (!/^\d+$/.test(key)) return map.title;
    const registry = root.ProfileExamMap;
    const number = Number(key);
    const entry = number <= 13 ? registry?.fromLegacyStart(number) : registry?.fromLegacyPartTwo(number);
    if (!entry) return map.title;
    if (number === 9) return 'Производная и первообразная · №8; экстремумы · №12';
    return registry.label(entry) + (map.title ? ' · ' + map.title : '');
  }

  function alphabetLinks(key, beforeLeave) {
    const catalog = root.ProfileAlphabetCatalog;
    const alphabets = catalog?.forNumber(key);
    if (!alphabets?.length) return null;
    const block = element('section', 'profile-skill-alphabets');
    block.append(element('h3', '', 'Вспомнить основы'));
    const back = root.location.pathname + root.location.search + root.location.hash;
    for (const alphabet of alphabets) {
      const group = element('div', 'profile-skill-alphabet-group');
      group.append(element('strong', '', alphabet.short));
      const list = element('ul');
      for (const [id, skill] of Object.entries(alphabet.skills)) {
        if (!skill.numbers.includes(Number(key))) continue;
        const link = element('a', '', skill.title);
        link.href = catalog.href(alphabet.id, id, key, back);
        link.setAttribute('data-profile-alphabet-link', '');
        if (beforeLeave) link.addEventListener('click', async event => {
          if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
          event.preventDefault();
          await beforeLeave();
          root.location.assign(link.href);
        });
        const row = element('li');
        row.append(link);
        list.append(row);
      }
      group.append(list);
      block.append(group);
    }
    return block;
  }

  function challengeForm(key, challenge, index, group, refresh) {
    const stateKey = keyFor(key, challenge, index);
    const state = read(stateKey);
    const card = element('article', 'profile-skill-challenge');
    card.setAttribute('data-profile-skill-challenge', '');
    card.append(element('h4', '', challenge.title), element('p', 'profile-skill-prompt', challenge.prompt));

    const form = element('form', 'profile-skill-form');
    const fields = challenge.fields || [{ label: 'Ответ', answers: challenge.answers }];
    const inputs = [];
    if (challenge.choices?.length) {
      const choices = element('fieldset', 'profile-skill-choices');
      choices.append(element('legend', '', 'Выберите ответ'));
      challenge.choices.forEach(choice => {
        const label = element('label', 'profile-skill-choice');
        const input = element('input');
        input.type = 'radio';
        input.name = `${group}-${index}`;
        input.value = choice;
        input.checked = state.values[0] === choice;
        input.setAttribute('data-profile-skill-answer', '');
        inputs.push(input);
        label.append(input, element('span', '', choice));
        choices.append(label);
      });
      form.append(choices);
    } else {
      fields.forEach((field, fieldIndex) => {
        const label = element('label', 'profile-skill-field', field.label || 'Ответ');
        const input = element('input');
        input.type = 'text';
        input.maxLength = 120;
        input.autocomplete = 'off';
        input.spellcheck = false;
        input.value = state.values[fieldIndex] || '';
        input.setAttribute('data-profile-skill-answer', '');
        inputs.push(input);
        label.append(input);
        form.append(label);
      });
    }

    function values() {
      return challenge.choices?.length ? [inputs.find(input => input.checked)?.value || ''] : inputs.map(input => input.value);
    }

    const submit = action('Проверить', true);
    submit.type = 'submit';
    form.append(submit);
    card.append(form);
    const hint = element('details', 'profile-skill-hint');
    hint.setAttribute('data-profile-skill-hint', '');
    hint.append(element('summary', '', 'Подсказка'), element('p', '', challenge.hint));
    const feedback = element('p', 'profile-skill-feedback');
    feedback.setAttribute('role', 'status');
    feedback.setAttribute('data-profile-skill-feedback', '');
    card.append(hint, feedback);

    function complete(record) {
      feedback.dataset.result = 'correct';
      feedback.textContent = (record.hinted ? 'Верно, с подсказкой. ' : 'Верно. ') + challenge.explanation;
      hint.hidden = true;
      submit.hidden = true;
      inputs.forEach(input => { input.disabled = true; input.removeAttribute('aria-invalid'); });
    }

    if (state.solved) complete(state);
    form.addEventListener('input', () => {
      inputs.forEach(input => input.removeAttribute('aria-invalid'));
      update(stateKey, { values: values() });
      refresh();
    });
    function recordHint() {
      update(stateKey, { hinted: true });
      refresh();
    }
    hint.querySelector('summary').addEventListener('click', () => { if (!hint.open) recordHint(); });
    hint.addEventListener('toggle', () => { if (hint.open) recordHint(); });
    form.addEventListener('submit', event => {
      event.preventDefault();
      const answers = values();
      if (answers.some(answer => !answer.trim())) {
        feedback.dataset.result = 'retry';
        feedback.textContent = challenge.choices?.length ? 'Выберите ответ.' : 'Заполните каждое поле.';
        const firstEmpty = answers.findIndex(answer => !answer.trim());
        inputs[firstEmpty]?.focus();
        return;
      }
      const results = fields.map((field, fieldIndex) => matches(answers[fieldIndex], field.answers));
      if (results.every(Boolean)) {
        complete(update(stateKey, { values: answers, solved: true, hinted: hint.open || read(stateKey).hinted }));
      } else {
        const mistakes = read(stateKey).mistakes + 1;
        const record = update(stateKey, { values: answers, mistakes });
        if (record.solved) complete(record);
        else {
          feedback.dataset.result = 'retry';
          feedback.textContent = `Пока не сходится. ${mistakes >= 2 ? 'Попробуйте подсказку.' : 'Сверьте ответ с условием.'}`;
          inputs.forEach((input, i) => input.setAttribute('aria-invalid', String(challenge.choices?.length || !results[i])));
        }
      }
      refresh();
    });
    return card;
  }

  function render(container, key, map, id, { lesson, beforeLeave }) {
    const layout = element('div', 'profile-skill-layout');
    const route = element('section', 'profile-skill-route');
    if (lesson?.skill) {
      route.append(element('h3', '', lesson.title), element('p', 'profile-skill-lesson-goal', lesson.skill));
    }
    route.append(element('h3', '', 'Что освоить'));
    const list = element('ol', 'profile-skill-steps');
    map.skills.forEach(skill => list.append(element('li', '', skill)));
    route.append(list);
    const alphabets = alphabetLinks(key, beforeLeave);
    if (alphabets) route.append(alphabets);

    const practice = element('section', 'profile-skill-practice');
    practice.append(element('h3', '', 'Творческие задания'));
    const summary = element('p', 'profile-skill-progress');
    summary.setAttribute('data-profile-skill-progress', '');
    practice.append(summary);
    function refresh() {
      const done = map.challenges.filter((challenge, index) => read(keyFor(key, challenge, index)).solved).length;
      summary.textContent = `Решено ${done} из ${map.challenges.length}${canSave ? '' : ' · до закрытия страницы'}`;
    }
    map.challenges.forEach((challenge, index) => practice.append(challengeForm(key, challenge, index, id, refresh)));
    refresh();
    layout.append(route, practice);
    container.replaceChildren(layout);
  }

  function mountReady(container, keys, options = {}) {
    const data = root.ProfileSkillMapData;
    if (!data || !container || root.self !== root.top || document.body.dataset.profileBoard) return null;
    const maps = [...new Set(keys.map(String))].map(key => [key, data.maps[key] || data.trainers[key]]).filter(([, map]) => map);
    if (!maps.length) return null;

    const id = 'profile-skill-dialog-' + (++nextDialogId);
    const entry = element('div', 'profile-skill-entry');
    const open = action('Карта навыков');
    open.setAttribute('data-profile-skill-trigger', '');
    open.setAttribute('aria-haspopup', 'dialog');
    open.setAttribute('aria-controls', id);
    const dialog = element('dialog', 'profile-skill-dialog');
    dialog.id = id;
    dialog.setAttribute('data-profile-skill-dialog', '');
    dialog.setAttribute('aria-labelledby', id + '-title');
    const heading = element('header', 'profile-skill-header');
    const title = element('h2', '', 'Карта навыков');
    title.id = id + '-title';
    const close = action('Вернуться');
    close.autofocus = true;
    heading.append(title, close);
    dialog.append(heading);

    const body = element('div', 'profile-skill-body');
    const select = element('select');
    let selected = maps[0];
    let lastPreferred;
    if (maps.length > 1) {
      select.setAttribute('data-profile-skill-select', '');
      for (const [key, map] of maps) {
        const option = element('option', '', mapTitle(key, map));
        option.value = key;
        select.append(option);
      }
      const label = element('label', 'profile-skill-picker', 'Выберите тему');
      label.append(select);
      dialog.append(label);
      select.addEventListener('change', () => {
        selected = maps.find(([key]) => key === select.value) || selected;
        render(body, ...selected, id, options);
      });
    } else {
      dialog.append(element('p', 'profile-skill-subtitle', mapTitle(...selected)));
    }
    dialog.append(body);
    entry.append(open, dialog);
    container.append(entry);

    function show() {
      const current = options.preferred?.();
      if (current && current !== lastPreferred) selected = maps.find(([key]) => key === String(current)) || selected;
      lastPreferred = current;
      select.value = selected[0];
      render(body, ...selected, id, options);
      if (typeof dialog.showModal === 'function') {
        if (!dialog.open) dialog.showModal();
      } else {
        dialog.setAttribute('open', '');
        close.focus();
      }
    }
    open.addEventListener('click', show);
    close.addEventListener('click', () => {
      if (typeof dialog.close === 'function') dialog.close();
      else { dialog.removeAttribute('open'); open.focus(); }
    });
    dialog.addEventListener('close', () => open.focus());
    if (!directOpenUsed && new URLSearchParams(root.location.search).get('skills') === '1') {
      directOpenUsed = true;
      // The course router focuses its heading immediately after rendering.
      root.setTimeout(() => { if (entry.isConnected) show(); }, 0);
    }
    return entry;
  }

  function ensureExamMap() {
    if (root.ProfileExamMap) return Promise.resolve(root.ProfileExamMap);
    if (!root.ProfileExamMapReady) root.ProfileExamMapReady = new Promise(resolve => {
      // Course navigation and legacy HTML may already have requested this map.
      // Adopt that pending script instead of loading a second copy.
      let script = [...document.querySelectorAll('script[src]')].find(script =>
        new URL(script.src, location.href).pathname === '/ege-profil/exam-map.js');
      const existing = Boolean(script);
      if (!script) {
        script = document.createElement('script');
        script.src = '/ege-profil/exam-map.js?v=20261115-fipi-map';
        script.async = true;
      }
      const settled = () => resolve(root.ProfileExamMap || null);
      script.addEventListener('load', settled, {once: true});
      script.addEventListener('error', () => resolve(null), {once: true});
      if (!existing) document.head.append(script);
      // A supplied script's error can precede this consumer. Window load is the
      // terminal fallback, while a pending async script still has time to load.
      else if (document.readyState === 'complete') settled();
      else root.addEventListener('load', settled, {once: true});
    });
    return root.ProfileExamMapReady;
  }

  function mount(container, keys, options = {}) {
    if (!root.ProfileSkillMapData || !container || root.self !== root.top || document.body.dataset.profileBoard) return null;
    if (root.ProfileExamMap) return mountReady(container, keys, options);
    const slot = element('div', 'profile-skill-slot');
    container.append(slot);
    ensureExamMap().then(() => {
      // A route change can remove the waiting slot. Never mount in a stale screen.
      if (slot.isConnected) mountReady(slot, keys, options);
    });
    return slot;
  }

  function optionByValue(spec, value) {
    return spec?.split(' ').find(pair => pair.split('=')[0] === value)?.split('=')[1];
  }

  function boot(script) {
    if (!script?.dataset.profileSkillMap || root.self !== root.top) return;
    const config = script.dataset;
    const keys = config.profileSkillMap.trim().split(/\s+/);
    let target = config.profileSkillTarget && document.querySelector(config.profileSkillTarget);
    if (!target) target = document.getElementById('profile-course-nav');
    if (!target) {
      const landmark = document.querySelector('h1, #pageTitle');
      if (!landmark) return;
      target = element('div', 'profile-skill-slot');
      landmark.after(target);
    }
    mount(target, keys, {
      preferred: () => optionByValue(config.profileSkillTopics, new URLSearchParams(root.location.search).get('topic')) ||
        optionByValue(config.profileSkillHashes, root.location.hash.slice(1))
    });
  }

  root.ProfileSkillMap = { mount, matches };
  if (typeof module !== 'undefined') module.exports = root.ProfileSkillMap;
  if (typeof document !== 'undefined') {
    const script = document.currentScript;
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => boot(script), { once: true });
    else boot(script);
  }
})(globalThis);

</script>
</body>
</html>
