":"Ноль входит во вторую ветвь: y = 0² − 1 = −1. Точка (0; 2) первой ветви исключена, а точка (0; −1) принадлежит графику.","answer":-1,"visual":{"kind":"piecewise","xDomain":[-4,4],"yDomain":[-3,7],"segments":[{"from":-100,"to":0,"expression":"x+2","leftClosed":false,"rightClosed":false},{"from":0,"to":100,"expression":"x^2-1","leftClosed":true,"rightClosed":false}],"ariaLabel":"График y = x + 2 при x < 0 и y = x² − 1 при x ≥ 0. При x = 0 точка на высоте 2 пустая, а на высоте −1 закрашена."}},{"id":"n22-q-intersections","title":"Две точки на одной высоте","prompt":"Сколько общих точек имеют график y = |x² − 4| и прямая y = 0?","type":"number","skillId":"n22-intersections","hint":"Модуль равен нулю только тогда, когда выражение внутри него равно нулю.","explanation":"x² − 4 = 0 даёт x = −2 и x = 2. Это две различные точки: (−2; 0) и (2; 0).","answer":2,"visual":{"kind":"piecewise","xDomain":[-3,3],"yDomain":[-1,6],"segments":[{"from":-100,"to":100,"expression":"abs(x^2-4)","leftClosed":false,"rightClosed":false}],"ariaLabel":"График функции y = |x² − 4|. Он касается оси x при x = −2 и x = 2."}},{"id":"n22-x-hole","title":"Выколотая точка не мешает каждому пересечению","prompt":"Функция задана формулой y = (x² − 9)/(x + 3). Сколько общих точек имеет её график с прямой y = 0?","type":"number","skillId":"n22-domain","hint":"При x ≠ −3 функция равна x − 3. Проверь допустимость корня x − 3 = 0.","explanation":"x − 3 = 0 даёт x = 3; знаменатель равен 6 и не обращается в нуль. Значит, общая точка одна: (3; 0). Исключена другая точка — (−3; −6).","answer":1,"visual":{"kind":"piecewise","xDomain":[-5,5],"yDomain":[-9,3],"segments":[{"from":-100,"to":-3,"expression":"1*x+(-3)","leftClosed":false,"rightClosed":false},{"from":-3,"to":100,"expression":"1*x+(-3)","leftClosed":false,"rightClosed":false}],"ariaLabel":"Прямая y = 1x + (-3) с исключённой точкой при x = -3. Пустая точка не принадлежит графику."}},{"id":"n22-x-intersections","title":"Когда два корня сливаются","prompt":"Сколько общих точек имеют график y = |x² − 9| и прямая y = 9?","type":"number","skillId":"n22-intersections","hint":"Рассмотри x² − 9 = 9 и x² − 9 = −9. Одинаковые корни нельзя считать дважды.","explanation":"Первая ветвь даёт x = −√18 и x = √18. Вторая даёт x² = 0, то есть только x = 0. Всего три различные точки.","answer":3,"visual":{"kind":"piecewise","xDomain":[-5,5],"yDomain":[-1,12],"segments":[{"from":-100,"to":100,"expression":"abs(x^2-9)","leftClosed":false,"rightClosed":false},{"from":-100,"to":100,"expression":"9","leftClosed":false,"rightClosed":false}],"ariaLabel":"График y = |x² − 9| и прямая y = 9. На высоте 9 есть две внешние общие точки и одна при x = 0."}}],"creative":[{"id":"n22-c-hole-repair","title":"Исправь график после сокращения","prompt":"Для y = (x² − 1)/(x − 1) ученик нарисовал всю прямую y = x + 1. Выбери все верные исправления и выводы.","type":"multi","skillId":"n22-domain","hint":"Сокращение сохраняет значения там, где исходная дробь определена. Оно не добавляет запрещённый аргумент.","explanation":"Нужно убрать точку (1; 2). Поэтому с y = 2 нет общих точек, а с y = 0 остаётся одна точка (−1; 0). Область определения по-прежнему исключает x = 1.","options":[{"text":"График совпадает с y = x + 1, кроме точки (1; 2).","correct":true},{"text":"После сокращения допустимы все действительные x.","correct":false},{"text":"С прямой y = 2 общих точек нет.","correct":true},{"text":"С прямой y = 0 есть одна общая точка: (−1; 0).","correct":true},{"text":"Точку (1; 2) можно вернуть, потому что формула стала проще.","correct":false}],"visual":{"kind":"piecewise","xDomain":[-3,4],"yDomain":[-3,6],"segments":[{"from":-100,"to":1,"expression":"1*x+(1)","leftClosed":false,"rightClosed":false},{"from":1,"to":100,"expression":"1*x+(1)","leftClosed":false,"rightClosed":false}],"ariaLabel":"Прямая y = 1x + (1) с исключённой точкой при x = 1. Пустая точка не принадлежит графику."}},{"id":"n22-c-line","title":"Проведи прямую через две точки","prompt":"Изменяй k и b в формуле y = kx + b. Прямая должна пройти через точки (−1; 3) и (2; 0).","type":"graph","skillId":"n22-line","hint":"При увеличении x на 3 значение y уменьшается на 3. Затем подставь любую из точек.","explanation":"k = (0 − 3)/(2 − (−1)) = −1. Из 0 = −1 · 2 + b получаем b = 2. Искомая прямая: y = −x + 2.","k":-1,"b":2,"points":[[-1,3],[2,0]]},{"id":"n22-c-model","title":"Как обнаружить модуль?","prompt":"Функция задана одной из двух предложенных формул. Точки (−3; 5) и (3; 5) подходят обеим. Выбери значение x, получи значение y и определи формулу.","type":"experiment","skillId":"n22-model","hint":"Нужен аргумент, при котором x² − 4 отрицательно: тогда модуль меняет значение.","explanation":"При x = 0 формулы дают 4 и −4. Полученное значение 4 выбирает y = |x² − 4|. При x = −3, 2 и 3 результаты совпадают. Такая проверка различает только эти две предложенные формулы, а не определяет любую неизвестную функцию.","variable":"x","models":[{"id":"absolute","label":"y = |x² − 4|","expression":"abs(x^2-4)"},{"id":"quadratic","label":"y = x² − 4","expression":"x^2-4"}],"known":[{"x":-3,"y":5},{"x":3,"y":5}],"probeValues":[-3,0,2,3],"secretModelId":"absolute","requireDistinguishingProbe":true,"exampleSolution":{"probes":[0],"modelId":"absolute"}},{"id":"n22-c-parameter","title":"Закажи четыре пересечения","prompt":"Выбери положительное целое m, при котором y = |x² − 4| и y = m имеют четыре общие точки. Укажи два положительных корня: меньший a и больший b. Корни можно записывать через sqrt(число).","type":"build","skillId":"n22-intersections","hint":"Получаются x² = 4 − m и x² = 4 + m. Для четырёх различных корней обе правые части должны быть положительными.","explanation":"Подходит любое целое m от 1 до 3. Например, m = 3 даёт x = −√7, −1, 1, √7, поэтому a = 1, b = √7. При m = 4 внутренние корни сливаются в ноль и точек остаётся три.","fields":[{"name":"m","label":"Высота прямой m","min":1,"max":8,"integer":true,"initial":1},{"name":"a","label":"Меньший положительный корень a","min":0,"max":4,"initial":1},{"name":"b","label":"Больший положительный корень b","min":0,"max":4,"initial":2}],"conditions":[{"left":"m","op":"lt","right":"4"},{"left":"a","op":"gt","right":"0"},{"left":"b","op":"gt","right":"a"},{"left":"a*a","op":"eq","right":"4-m"},{"left":"b*b","op":"eq","right":"4+m"}],"exampleSolution":{"m":3,"a":1,"b":2.6457513110645907},"visual":{"kind":"piecewise","xDomain":[-4,4],"yDomain":[-1,12],"segments":[{"from":-100,"to":100,"expression":"abs(x^2-4)","leftClosed":false,"rightClosed":false},{"from":-100,"to":100,"expression":"m","leftClosed":false,"rightClosed":false}],"dynamic":{"kind":"formula","fields":["m"]},"ariaLabel":"График y = |x² − 4| и горизонтальная прямая y = m. Высота прямой изменяется при вводе m."}}],"overviewTaskIds":["n22-q-hole","n22-q-vertex","n22-q-boundary","n22-q-intersections"]},{"id":"n23","title":"№23 · Геометрия: найти нужную связь","goal":"Четыре входа в вычислительную геометрию: высота, подобие, хорда и касательная. Мастерские помогают выбрать дополнительный отрезок и связать две формулы. Полное решение требует указать, почему эти связи применимы.","assessment":"written-steps","writtenWorkNote":"Здесь проверяются отдельные учебные шаги. Полное решение с обоснованием запиши отдельно и проверь с преподавателем или по критериям задания.","sourceHref":"/trainers/oge-task23-geometry-calculations.html","skills":[{"id":"n23-height","label":"Находить высоту через две записи площади","requires":["n15-right","n15-area"],"evidence":"Вычисляет площадь прямоугольного треугольника по катетам и из неё находит высоту к гипотенузе."},{"id":"n23-similarity","label":"Находить отрезок по подобию треугольников","requires":["n15-conditions","n12-isolate"],"evidence":"Сопоставляет соответствующие стороны и использует один и тот же коэффициент подобия."},{"id":"n23-chord","label":"Связывать радиус, расстояние до хорды и её половину","requires":["n15-right","n16-radius"],"evidence":"Строит прямоугольный треугольник и удваивает найденную половину хорды."},{"id":"n23-tangent","label":"Находить касательную по радиусу и расстоянию до центра","requires":["n16-tangent","n15-right"],"evidence":"Использует прямой угол между радиусом и касательной и правильно выбирает гипотенузу."},{"id":"n23-conditions","label":"Проверять, достаточно ли условий для подобия","requires":["n19-conditions","n23-similarity"],"evidence":"Выбирает достаточное условие по двум углам и не заменяет его случайным равенством отрезков."},{"id":"n23-construct","label":"Согласовывать длины и площадь одной фигуры","requires":["n15-right","n15-area"],"evidence":"Подбирает катеты, одновременно выполняющие заданные гипотенузу и площадь."},{"id":"n23-written","label":"Обосновывать построение и вычисления","requires":["n23-height","n23-similarity","n23-chord","n23-tangent"],"evidence":"Числовые карточки подтверждают только проверяемый шаг. Самостоятельное решение должно назвать основания для подобия, прямого угла или формулы площади.","separateCheck":false,"relatedTasks":["n23-q-similarity","n23-c-area","n23-c-chord"]}],"quick":[{"id":"n23-q-height","title":"Одна площадь, две записи","prompt":"В прямоугольном треугольнике ABC угол C прямой, AC = 6 см, BC = 8 см. CH — высота к гипотенузе AB. Найди CH.","type":"number","skillId":"n23-height","hint":"Найди AB по теореме Пифагора, затем приравняй AC · BC / 2 и AB · CH / 2.","explanation":"AB = √(6² + 8²) = 10 см. Площадь равна 24 см². Из 10 · CH / 2 = 24 получаем CH = 4,8 см.","answer":4.8,"unit":"см","visual":{"kind":"polygon","points":[[0,0],[3.6,0],[10.0,0],[3.6,4.8]],"labels":["A","H","B","C"],"grid":false,"segments":[{"from":[3.6,4.8],"to":[3.6,0],"dashed":true}],"ariaLabel":"Прямоугольный треугольник ABC: угол C прямой, AC = 6, BC = 8. Точка H — основание высоты из C на гипотенузу AB."}},{"id":"n23-q-similarity","title":"Параллельный отрезок","prompt":"В треугольнике ABC точки D и E лежат соответственно на AB и AC, DE ∥ BC. Дано AD = 4 см, AB = 10 см, BC = 15 см. Найди DE.","type":"number","skillId":"n23-similarity","hint":"Треугольники ADE и ABC подобны по двум углам. Сопоставь DE с BC, а AD с AB.","explanation":"Коэффициент подобия малого треугольника к большому равен AD/AB = 4/10. Поэтому DE = 15 · 4/10 = 6 см.","answer":6,"unit":"см","visual":{"kind":"polygon","points":[[0,10],[0,6],[0,0],[15,0],[6,6]],"labels":["A","D","B","C","E"],"grid":false,"diagonals":[[1,4]],"ariaLabel":"Треугольник ABC. D лежит на AB, E на AC, DE параллелен BC. AD = 4, AB = 10, BC = 15."}},{"id":"n23-q-chord","title":"Сначала половина хорды","prompt":"Радиус окружности равен 13 см. Расстояние OM от центра O до хорды AB равно 5 см, OM ⟂ AB. Найди длину хорды AB.","type":"number","skillId":"n23-chord","hint":"Перпендикуляр из центра делит хорду пополам. В прямоугольном треугольнике OMA гипотенуза OA = 13.","explanation":"AM = √(13² − 5²) = √144 = 12 см. Хорда AB вдвое длиннее: 24 см.","answer":24,"unit":"см","visual":{"kind":"polygon","points":[[-12.0,5],[12.0,5],[0,5],[0,0]],"labels":["A","B","M","O"],"grid":false,"pointsOnly":true,"segments":[{"from":[-12.0,5],"to":[12.0,5]},{"from":[0,0],"to":[0,5],"dashed":true},{"from":[0,0],"to":[-12.0,5]}],"circles":[{"center":[0,0],"radius":13}],"bounds":{"xMin":-14,"xMax":14,"yMin":-14,"yMax":14},"ariaLabel":"Окружность радиуса 13; AB — хорда, OM = 5, OM перпендикулярен AB. M лежит на хорде."}},{"id":"n23-q-tangent","title":"Касательная образует прямой угол","prompt":"Из точки A к окружности с центром O проведена касательная AT. Дано OA = 13 см, OT = 5 см. Найди AT.","type":"number","skillId":"n23-tangent","hint":"Радиус OT перпендикулярен касательной AT. Гипотенуза треугольника OAT — это OA.","explanation":"AT² = OA² − OT² = 13² − 5² = 144, поэтому AT = 12 см.","answer":12,"unit":"см","visual":{"kind":"polygon","points":[[0,0],[13,0],[1.9230769230769231,4.615384615384615]],"labels":["O","A","T"],"grid":false,"pointsOnly":true,"segments":[{"from":[0,0],"to":[13,0]},{"from":[0,0],"to":[1.9230769230769231,4.615384615384615]},{"from":[13,0],"to":[1.9230769230769231,4.615384615384615]}],"circles":[{"center":[0,0],"radius":5}],"bounds":{"xMin":-6,"xMax":14,"yMin":-6,"yMax":6},"ariaLabel":"Точка A вне окружности. OA = 13, OT = 5, AT касается окружности в T; OT перпендикулярен AT."}},{"id":"n23-x-height","title":"Высота нового треугольника","prompt":"У прямоугольного треугольника ABC катеты AC = 9 см и BC = 12 см. Найди высоту CH к гипотенузе AB.","type":"number","skillId":"n23-height","hint":"Вычисли гипотенузу и используй равенство площадей через две пары «основание — высота».","explanation":"AB = 15 см, S = 9 · 12 / 2 = 54 см². Поэтому CH = 2 · 54/15 = 7,2 см.","answer":7.2,"unit":"см","visual":{"kind":"polygon","points":[[0,0],[5.4,0],[15.0,0],[5.4,7.2]],"labels":["A","H","B","C"],"grid":false,"segments":[{"from":[5.4,7.2],"to":[5.4,0],"dashed":true}],"ariaLabel":"Прямоугольный треугольник ABC: угол C прямой, AC = 9, BC = 12. Точка H — основание высоты из C на гипотенузу AB."}},{"id":"n23-x-chord","title":"Не забудь вторую половину","prompt":"Радиус окружности равен 17 см, расстояние от центра до хорды — 15 см. Найди длину хорды.","type":"number","skillId":"n23-chord","hint":"Из прямоугольного треугольника получи половину хорды и удвой её.","explanation":"Половина хорды равна √(17² − 15²) = √64 = 8 см. Вся хорда равна 16 см.","answer":16,"unit":"см","visual":{"kind":"polygon","points":[[-8.0,15],[8.0,15],[0,15],[0,0]],"labels":["A","B","M","O"],"grid":false,"pointsOnly":true,"segments":[{"from":[-8.0,15],"to":[8.0,15]},{"from":[0,0],"to":[0,15],"dashed":true},{"from":[0,0],"to":[-8.0,15]}],"circles":[{"center":[0,0],"radius":17}],"bounds":{"xMin":-18,"xMax":18,"yMin":-18,"yMax":18},"ariaLabel":"Окружность радиуса 17; AB — хорда, OM = 15, OM перпендикулярен AB. M лежит на хорде."}}],"creative":[{"id":"n23-c-area","title":"Согласуй две формулы площади","prompt":"У прямоугольного треугольника катеты AC = 5 см и BC = 12 см, гипотенуза AB = 13 см. Подбери площадь S и высоту h к гипотенузе так, чтобы обе формулы площади дали один результат.","type":"build","skillId":"n23-height","hint":"Сначала S = 5 · 12 / 2. Затем реши 13h/2 = S. Дробь можно вводить через /.","explanation":"S = 30 см². Из 13h = 60 следует h = 60/13 см. Здесь высота не обязана быть целым числом; округлять её до окончания решения не нужно.","fields":[{"name":"S","label":"Площадь S, см²","min":1,"max":100,"initial":20},{"name":"h","label":"Высота h, см","min":0.1,"max":20,"initial":5}],"conditions":[{"left":"2*S","op":"eq","right":"60"},{"left":"13*h","op":"eq","right":"2*S"}],"exampleSolution":{"S":30,"h":4.615384615384615},"visual":{"kind":"polygon","points":[[0,0],[1.9230769230769231,0],[13.0,0],[1.9230769230769231,4.615384615384615]],"labels":["A","H","B","C"],"grid":false,"segments":[{"from":[1.9230769230769231,4.615384615384615],"to":[1.9230769230769231,0],"dashed":true}],"ariaLabel":"Прямоугольный треугольник ABC: угол C прямой, AC = 5, BC = 12. Точка H — основание высоты из C на гипотенузу AB."}},{"id":"n23-c-chord","title":"Восстанови хорду целиком","prompt":"Радиус окружности равен 10 см, расстояние от центра до хорды — 8 см. Найди половину хорды a, затем всю хорду c. Проверь, что обе длины относятся к одному рисунку.","type":"build","skillId":"n23-chord","hint":"В прямоугольном треугольнике a² + 8² = 10². После этого c = 2a.","explanation":"a² = 100 − 64 = 36, значит a = 6 см. Полная хорда c = 12 см. Ответ 6 для всей хорды был бы вдвое меньше нужного.","fields":[{"name":"a","label":"Половина хорды a, см","min":0,"max":20,"initial":8},{"name":"c","label":"Вся хорда c, см","min":0,"max":40,"initial":16}],"conditions":[{"left":"a*a+64","op":"eq","right":"100"},{"left":"c","op":"eq","right":"2*a"}],"exampleSolution":{"a":6,"c":12},"visual":{"kind":"polygon","points":[[-6.0,8],[6.0,8],[0,8],[0,0]],"labels":["A","B","M","O"],"grid":false,"pointsOnly":true,"segments":[{"from":[-6.0,8],"to":[6.0,8]},{"from":[0,0],"to":[0,8],"dashed":true},{"from":[0,0],"to":[-6.0,8]}],"circles":[{"center":[0,0],"radius":10}],"bounds":{"xMin":-11,"xMax":11,"yMin":-11,"yMax":11},"ariaLabel":"Окружность радиуса 10; AB — хорда, OM = 8, OM перпендикулярен AB. M лежит на хорде."}},{"id":"n23-c-conditions","title":"Чего не хватает для подобия?","prompt":"В треугольнике ABC точки D и E лежат внутри сторон AB и AC. Какие дополнительные условия, каждое само по себе, гарантируют подобие треугольников ADE и ABC в указанном порядке? Выбери все подходящие.","type":"multi","skillId":"n23-conditions","hint":"Угол A уже общий. Для подобия достаточно ещё одной пары соответствующих равных углов. Равенство отдельных длин само по себе этого не гарантирует.","explanation":"DE ∥ BC даёт равные соответствующие углы. Равенство ∠ADE = ∠ABC вместе с общим углом A тоже достаточно. AD = AE или BD = CE не устанавливают нужные отношения сторон произвольного треугольника.","options":[{"text":"DE ∥ BC","correct":true},{"text":"∠ADE = ∠ABC","correct":true},{"text":"AD = AE","correct":false},{"text":"BD = CE","correct":false}]},{"id":"n23-c-triangle","title":"Собери треугольник по двум требованиям","prompt":"Подбери положительные целые катеты a и b прямоугольного треугольника: гипотенуза должна быть 10 см, а площадь — 24 см². Порядок катетов может быть любым.","type":"build","skillId":"n23-construct","hint":"Нужно одновременно a² + b² = 100 и ab/2 = 24. Одной верной формулы недостаточно.","explanation":"Подходят катеты 6 и 8 см в любом порядке: 36 + 64 = 100, а 6 · 8 / 2 = 24. Из ab = 48 и a² + b² = 100 получаем (a + b)² = 196 и a + b = 14, что оставляет именно эту пару.","fields":[{"name":"a","label":"Первый катет a, см","min":1,"max":10,"integer":true,"initial":5},{"name":"b","label":"Второй катет b, см","min":1,"max":10,"integer":true,"initial":5}],"conditions":[{"left":"a*a+b*b","op":"eq","right":"100"},{"left":"a*b","op":"eq","right":"48"}],"exampleSolution":{"a":6,"b":8}}],"overviewTaskIds":["n23-q-height","n23-q-similarity","n23-q-chord","n23-q-tangent"]},{"id":"n24","title":"№24 · Геометрические доказательства","goal":"Учимся видеть, что дано, какое утверждение надо обосновать и на какой факт опереться. Можно начать с четырёх коротких шагов, затем собрать рассуждение или проверить его контрпримером.","assessment":"written-steps","writtenWorkNote":"Выбор верного основания или порядок готовых шагов ещё не являются самостоятельным доказательством. После тренировки запиши доказательство целиком; его полноту нужно проверить отдельно.","sourceHref":"/trainers/oge-task24-proofs.html","skills":[{"id":"n24-given","label":"Переводить условие в точные равенства","requires":["n19-conditions"],"evidence":"Отличает определение биссектрисы от свойств медианы и не добавляет к условию незаданные равенства."},{"id":"n24-congruence","label":"Выбирать признак равенства треугольников","requires":["n19-triangle-facts","n15-conditions"],"evidence":"Указывает три нужные пары сторон или две стороны с углом между ними; связывает признак с конкретными треугольниками."},{"id":"n24-parallel","label":"Обосновывать равенство углов при параллельных прямых","requires":["n19-conditions"],"evidence":"Называет конкретные параллельные прямые и секущую и правильно сопоставляет углы."},{"id":"n24-similarity","label":"Проверять достаточные условия подобия","requires":["n23-similarity","n19-conditions"],"evidence":"Выбирает достаточное условие по двум углам или пропорциональным сторонам с углом между ними."},{"id":"n24-circle","label":"Выбирать нужную дугу для равенства вписанных углов","requires":["n16-arc-angle"],"evidence":"Проверяет, что вписанные углы опираются на одну дугу, и использует это как основание конкретного равенства."},{"id":"n24-counterexample","label":"Опровергать недостаточное условие конкретными фигурами","requires":["n19-counterexample"],"evidence":"Строит увеличенный треугольник, проверяет его размеры и использует сохранение углов при подобии; различает подобие и равенство."},{"id":"n24-written","label":"Самостоятельно записывать полное доказательство","requires":["n24-given","n24-congruence","n24-parallel","n24-similarity","n24-circle"],"evidence":"Готовые карточки проверяют распознавание оснований и отдельных связей. Самостоятельность, полнота и отсутствие пропусков оцениваются только по отдельному письменному доказательству.","separateCheck":false,"relatedTasks":["n24-c-proof-order","n24-c-reasons","n24-c-conditions"]}],"quick":[{"id":"n24-q-congruence","title":"Три пары для одного признака","prompt":"В треугольнике ABC дано AB = AC. Точка D — середина BC. По какому признаку можно обосновать равенство треугольников ABD и ACD, используя AB = AC, BD = DC и общую сторону AD?","type":"choice","skillId":"n24-congruence","hint":"Перечислены три пары равных сторон. Равенство углов пока доказывать не нужно.","explanation":"AB = AC по условию; BD = DC, потому что D — середина; AD — общая сторона. Следовательно, треугольники равны по трём сторонам. Здесь проверен выбор основания, а не самостоятельная запись всего доказательства.","options":[{"text":"По трём сторонам","correct":true},{"text":"По двум углам","correct":false},{"text":"Потому что медиана всегда является высотой","correct":false},{"text":"Только по одной общей стороне","correct":false}],"visual":{"kind":"polygon","points":[[0,4],[-3,0],[0,0],[3,0]],"labels":["A","B","D","C"],"grid":false,"diagonals":[[0,2]],"ariaLabel":"Равнобедренный треугольник ABC, AB = AC. D — середина основания BC. Проведена медиана AD."}},{"id":"n24-q-parallel","title":"Найди углы у нужных прямых","prompt":"ABCD — параллелограмм, проведена диагональ AC. Какое равенство следует непосредственно из AB ∥ CD при секущей AC?","type":"choice","skillId":"n24-parallel","hint":"Ищи углы, одна сторона которых лежит на AC, а другая — на AB или CD.","explanation":"∠BAC и ∠DCA — накрест лежащие углы при параллельных AB и CD и секущей AC. Поэтому они равны. В рисунке нельзя заменять это основание впечатлением от наклона сторон.","options":[{"text":"∠BAC = ∠DCA","correct":true},{"text":"∠BAC = ∠CAD","correct":false},{"text":"∠ABC = ∠BCD","correct":false},{"text":"∠BAC = ∠ABC","correct":false}],"visual":{"kind":"polygon","points":[[0,0],[6,0],[8,4],[2,4]],"labels":["A","B","C","D"],"grid":false,"diagonals":[[0,2]],"ariaLabel":"Параллелограмм ABCD с проведённой диагональю AC. Противоположные стороны параллельны."}},{"id":"n24-q-circle","title":"Одна дуга — равные углы","prompt":"Четыре различные точки A, B, C и D лежат на одной окружности; C и D находятся на одной дуге с концами A и B. Почему ∠ACB = ∠ADB?","type":"choice","skillId":"n24-circle","hint":"Проверь, на какую дугу AB, не содержащую вершину угла, опирается каждый угол.","explanation":"Оба вписанных угла опираются на одну и ту же дугу AB, не содержащую C и D. Поэтому они равны. Одного факта «все точки на окружности» без положения вершин на одной дуге для такого равенства недостаточно.","options":[{"text":"Это вписанные углы, опирающиеся на одну дугу AB.","correct":true},{"text":"Любые два вписанных угла одной окружности равны.","correct":false},{"text":"Любые четыре точки окружности образуют прямоугольник.","correct":false},{"text":"Углы равны, потому что хорды AC и AD всегда равны.","correct":false}],"visual":{"kind":"polygon","points":[[5,0],[0,5],[-5,0],[0,-5]],"labels":["A","B","C","D"],"grid":false,"pointsOnly":true,"segments":[{"from":[5,0],"to":[0,5]},{"from":[5,0],"to":[-5,0]},{"from":[-5,0],"to":[0,5]},{"from":[5,0],"to":[0,-5]},{"from":[0,-5],"to":[0,5]}],"circles":[{"center":[0,0],"radius":5}],"bounds":{"xMin":-6,"xMax":6,"yMin":-6,"yMax":6},"ariaLabel":"A, B, C и D лежат на одной окружности. C и D расположены на одной из двух дуг AB; углы ACB и ADB опираются на другую дугу AB."}},{"id":"n24-q-given","title":"Что означает слово «биссектриса»?","prompt":"В треугольнике ABC отрезок AD — биссектриса угла A, точка D лежит на BC. Какое равенство дано самим определением биссектрисы?","type":"choice","skillId":"n24-given","hint":"Биссектриса делит угол на два равных угла. Про длины частей противоположной стороны пока ничего не сказано.","explanation":"Из определения сразу следует ∠BAD = ∠DAC. Равенство BD = DC относится к медиане, а AD ⟂ BC — к высоте. В произвольном треугольнике эти три отрезка не обязаны совпадать.","options":[{"text":"∠BAD = ∠DAC","correct":true},{"text":"BD = DC","correct":false},{"text":"AD ⟂ BC","correct":false},{"text":"AB = AC","correct":false}]},{"id":"n24-x-congruence","title":"Та же идея в другом четырёхугольнике","prompt":"В четырёхугольнике ABCD даны AB = AD и CB = CD. Проведена диагональ AC. Как обосновать равенство ∠BAC = ∠CAD?","type":"choice","skillId":"n24-congruence","hint":"Рассмотри треугольники ABC и ADC. Их третья пара равных сторон — общая AC.","explanation":"Треугольники ABC и ADC равны по трём сторонам: AB = AD, BC = DC, AC общая. Поэтому их соответствующие углы BAC и CAD равны. Это проверка выбранного основания; развёрнутую запись сделай самостоятельно.","options":[{"text":"Треугольники ABC и ADC равны по трём сторонам; соответствующие углы равны.","correct":true},{"text":"AC — общая сторона, поэтому любые треугольники по разные стороны от неё равны.","correct":false},{"text":"У всех четырёхугольников диагонали делят углы пополам.","correct":false},{"text":"Равенства AB = AD достаточно без остальных условий.","correct":false}],"visual":{"kind":"polygon","points":[[0,4],[-3,0],[0,-2],[3,0]],"labels":["A","B","C","D"],"grid":false,"diagonals":[[0,2]],"ariaLabel":"Четырёхугольник ABCD: AB = AD и CB = CD. Проведена общая сторона двух треугольников AC."}},{"id":"n24-x-parallel","title":"Углы в трапеции","prompt":"В трапеции ABCD основания AD и BC параллельны. Проведена диагональ AC. Какое равенство следует из параллельности оснований при этой секущей?","type":"choice","skillId":"n24-parallel","hint":"Выбери углы между AC и каждым из двух оснований.","explanation":"∠CAD = ∠ACB как накрест лежащие углы при AD ∥ BC и секущей AC.","options":[{"text":"∠CAD = ∠ACB","correct":true},{"text":"∠CAD = ∠BAC","correct":false},{"text":"∠ABC = ∠BAD","correct":false},{"text":"∠CAD = ∠ADC","correct":false}],"visual":{"kind":"polygon","points":[[0,0],[2,4],[6,4],[10,0]],"labels":["A","B","C","D"],"grid":false,"diagonals":[[0,2]],"ariaLabel":"Трапеция ABCD, основания AD и BC параллельны. Проведена диагональ AC."}}],"creative":[{"id":"n24-c-proof-order","title":"Как медиана становится высотой","prompt":"Дано AB = AC, D — середина BC. Нужно доказать AD ⟂ BC. Собери предложенное рассуждение: сначала равенство треугольников, затем равенство углов, затем прямой угол.","type":"order","skillId":"n24-congruence","hint":"Каждый следующий вывод использует именно результат предыдущего. Общая сторона AD уже известна.","explanation":"Из BD = DC, AB = AC и общей AD следует равенство треугольников по трём сторонам. Их углы при D равны и в сумме дают 180°, значит каждый равен 90°. Это разбор готовой цепочки; после него запиши доказательство самостоятельно.","items":["Равные смежные углы имеют сумму 180°, поэтому каждый равен 90° и AD ⟂ BC.","Так как D — середина BC, получаем BD = DC.","Из равенства этих треугольников следует ∠BDA = ∠CDA.","Используем это равенство, AB = AC и общую сторону AD: треугольники ABD и ACD равны по трём сторонам."],"answer":["Так как D — середина BC, получаем BD = DC.","Используем это равенство, AB = AC и общую сторону AD: треугольники ABD и ACD равны по трём сторонам.","Из равенства этих треугольников следует ∠BDA = ∠CDA.","Равные смежные углы имеют сумму 180°, поэтому каждый равен 90° и AD ⟂ BC."],"visual":{"kind":"polygon","points":[[0,4],[-3,0],[0,0],[3,0]],"labels":["A","B","D","C"],"grid":false,"diagonals":[[0,2]],"ariaLabel":"Равнобедренный треугольник ABC, AB = AC. D — середина основания BC. Проведена медиана AD."}},{"id":"n24-c-reasons","title":"Верни каждому выводу его основание","prompt":"В параллелограмме ABCD проведена AC. В готовом рассуждении перепутались подписи. Сопоставь каждое утверждение с точным основанием.","type":"match","skillId":"n24-parallel","hint":"Для равенства треугольников BAC и DCA используются AB = CD, общая AC и углы между этими сторонами.","explanation":"Противоположные стороны параллелограмма равны, AC общая, а углы BAC и DCA равны как накрест лежащие. Это даёт равенство треугольников по двум сторонам и углу между ними. Следующее равенство углов — следствие равенства треугольников.","pairs":[{"left":"AB = CD","right":"Противоположные стороны параллелограмма равны."},{"left":"∠BAC = ∠DCA","right":"Накрест лежащие углы при AB ∥ CD и секущей AC."},{"left":"AC = CA","right":"Общая сторона."},{"left":"Треугольники BAC и DCA равны.","right":"По двум сторонам и углу между ними."},{"left":"∠BCA = ∠DAC","right":"Соответствующие углы равных треугольников."}],"visual":{"kind":"polygon","points":[[0,0],[6,0],[8,4],[2,4]],"labels":["A","B","C","D"],"grid":false,"diagonals":[[0,2]],"ariaLabel":"Параллелограмм ABCD с проведённой диагональю AC. Противоположные стороны параллельны."}},{"id":"n24-c-conditions","title":"Достаточно ли одного условия?","prompt":"D и E лежат внутри сторон AB и AC треугольника ABC. Угол A общий для треугольников ADE и ABC. Какие условия, каждое само по себе, гарантируют их подобие в указанном порядке? Выбери все достаточные.","type":"multi","skillId":"n24-similarity","hint":"Можно получить второй равный угол или пропорциональность двух сторон, заключающих общий угол.","explanation":"DE ∥ BC даёт подобие по двум углам. Равенство AD/AB = AE/AC вместе с общим углом A даёт подобие по двум пропорциональным сторонам и углу между ними. AD = AE или DE = BC/2 без остальных связей недостаточно.","options":[{"text":"DE ∥ BC","correct":true},{"text":"AD/AB = AE/AC","correct":true},{"text":"AD = AE","correct":false},{"text":"DE = BC/2","correct":false}]},{"id":"n24-c-counterexample","title":"Углы те же, треугольник другой","prompt":"Кто-то утверждает: «Если три угла треугольников равны, то треугольники равны». У первого треугольника стороны 3, 4 и 5. Увеличь все стороны в целое число k от 2 до 4 раз и укажи гипотенузу c и площадь S второго треугольника.","type":"build","skillId":"n24-counterexample","hint":"При изменении всех сторон в k раз углы сохраняются, а площадь изменяется в k² раз. Исходная площадь равна 6.","explanation":"Например, k = 2 даёт стороны 6, 8, 10 и площадь 24. Соответствующие углы равны, но длины отличаются, поэтому треугольники подобны, а не равны. Для опровержения общего утверждения достаточно одного такого примера.","fields":[{"name":"k","label":"Во сколько раз увеличить стороны","min":2,"max":4,"integer":true,"initial":2},{"name":"c","label":"Гипотенуза второго треугольника","min":1,"max":30,"initial":5},{"name":"S","label":"Площадь второго треугольника","min":1,"max":200,"initial":6}],"conditions":[{"left":"c","op":"eq","right":"5*k"},{"left":"S","op":"eq","right":"6*k*k"}],"exampleSolution":{"k":2,"c":10,"S":24}}],"overviewTaskIds":["n24-q-congruence","n24-q-parallel","n24-q-circle","n24-q-given"]},{"id":"n25","title":"№25 · Геометрия: соединить несколько идей","goal":"Начни с одного шага: биссектрисы, вписанной окружности, высоты трапеции или подобия. Дальше можно собрать фигуру по нескольким условиям и проверить связи. Эти упражнения готовят к развёрнутому решению, но не заменяют его.","assessment":"written-steps","writtenWorkNote":"Здесь проверяются отдельные учебные шаги. Полное решение с обоснованием запиши отдельно и проверь с преподавателем или по критериям задания.","sourceHref":"/trainers/oge-task25-geometry.html","skills":[{"id":"n25-construction","label":"Использовать высоты как вспомогательное построение","requires":["n17-trapezoid-area","n15-right"],"evidence":"В равнобедренной трапеции находит половину разности оснований, затем высоту и площадь."},{"id":"n25-bisector","label":"Связывать отрезки основания теоремой о биссектрисе","requires":["n23-similarity","n12-isolate"],"evidence":"Составляет отношение отрезков, согласованное с прилежащими сторонами, и использует сумму отрезков."},{"id":"n25-area","label":"Выбирать удобную запись площади","requires":["n15-area","n17-trapezoid-area"],"evidence":"В связанных заданиях отдельно проверяются площадь по основанию и высоте и связь площади с радиусом вписанной окружности.","relatedTasks":["n25-c-vertex","n25-c-incircle","n25-c-trapezoid"],"separateCheck":false},{"id":"n25-inradius","label":"Связывать площадь, полупериметр и вписанный радиус","requires":["n16-circle-polygons","n15-area"],"evidence":"Находит площадь и полупериметр и использует S = pr, не подменяя полупериметр периметром."},{"id":"n25-scale","label":"Различать изменения длин и площадей при подобии","requires":["n23-similarity","n18-scale"],"evidence":"Умножает длины и радиусы на k, а площади на k²."},{"id":"n25-combine","label":"Согласовывать несколько условий одной фигуры","requires":["n15-right","n25-area"],"evidence":"Подбирает координаты вершины, выполняющие два заданных расстояния, и вычисляет площадь той же фигуры."},{"id":"n25-written","label":"Обосновывать всю цепочку сложной геометрической задачи","requires":["n25-construction","n25-bisector","n25-inradius","n25-scale","n25-combine"],"evidence":"Конструкторы проверяют отдельные связи и вычисления. Полнота вспомогательного построения, обоснования и итогового решения оценивается по письменной работе.","separateCheck":false,"relatedTasks":["n25-c-trapezoid","n25-c-vertex","n25-c-incircle"]}],"quick":[{"id":"n25-q-bisector","title":"В каком отношении делится сторона?","prompt":"В треугольнике ABC AB = 13 см, AC = 15 см, BC = 14 см. AD — биссектриса угла A, D лежит на BC. Найди BD.","type":"number","skillId":"n25-bisector","hint":"По теореме о биссектрисе BD/DC = AB/AC = 13/15, а BD + DC = 14.","explanation":"Всего 13 + 15 = 28 долей. Одна доля равна 14/28 = 0,5 см, значит BD = 13 · 0,5 = 6,5 см. Отношение нельзя переворачивать, оставляя прежние названия отрезков.","answer":6.5,"unit":"см","visual":{"kind":"polygon","points":[[5,12],[0,0],[6.5,0],[14,0]],"labels":["A","B","D","C"],"grid":false,"diagonals":[[0,2]],"ariaLabel":"Треугольник ABC со сторонами AB = 13, AC = 15, BC = 14. AD — биссектриса; D лежит на BC."}},{"id":"n25-q-inradius","title":"Радиус через площадь","prompt":"В прямоугольный треугольник с катетами 5 и 12 см и гипотенузой 13 см вписана окружность. Найди её радиус.","type":"number","skillId":"n25-inradius","hint":"Найди площадь S и полупериметр p. Если соединить центр вписанной окружности с вершинами, получается S = pr.","explanation":"S = 5 · 12 / 2 = 30 см², p = (5 + 12 + 13)/2 = 15 см. Из S = pr следует r = 30/15 = 2 см.","answer":2,"unit":"см","visual":{"kind":"polygon","points":[[0,0],[12,0],[0,5]],"labels":["A","B","C"],"grid":false,"circles":[{"center":[2,2],"radius":2,"showCenter":true,"label":"O"}],"bounds":{"xMin":-1,"xMax":13,"yMin":-1,"yMax":7},"ariaLabel":"Прямоугольный треугольник с катетами 5 и 12, гипотенузой 13 и вписанной окружностью. Центр окружности O."}},{"id":"n25-q-height","title":"Высоты раскрывают трапецию","prompt":"Основания равнобедренной трапеции равны 8 и 18 см, боковые стороны — по 13 см. Найди высоту трапеции.","type":"number","skillId":"n25-construction","hint":"Две высоты от меньшего основания отсекают у большего основания равные отрезки длиной (18 − 8)/2.","explanation":"Каждый отрезок равен 5 см. В прямоугольном треугольнике с гипотенузой 13 высота равна √(13² − 5²) = 12 см.","answer":12,"unit":"см","visual":{"kind":"polygon","points":[[0,0],[5.0,12],[13.0,12],[18,0]],"labels":["A","B","C","D"],"grid":false,"segments":[{"from":[5.0,12],"to":[5.0,0],"dashed":true},{"from":[13.0,12],"to":[13.0,0],"dashed":true}],"ariaLabel":"Равнобедренная трапеция ABCD с основаниями AD = 18 и BC = 8. Показаны перпендикуляры из B и C к основанию AD."}},{"id":"n25-q-scale","title":"Площадь растёт иначе","prompt":"Соответствующие стороны двух подобных треугольников относятся как 3 : 2. Площадь меньшего треугольника равна 12 см². Найди площадь большего.","type":"number","skillId":"n25-scale","hint":"Отношение площадей равно квадрату отношения соответствующих сторон.","explanation":"Площади относятся как 3² : 2² = 9 : 4. Поэтому площадь большего треугольника равна 12 · 9/4 = 27 см².","answer":27,"unit":"см²"},{"id":"n25-x-trapezoid","title":"Площадь после построения высот","prompt":"Основания равнобедренной трапеции равны 10 и 20 см, боковые стороны — по 13 см. Найди площадь трапеции.","type":"number","skillId":"n25-construction","hint":"Половина разности оснований равна 5 см. Найди высоту по теореме Пифагора, затем площадь.","explanation":"Высота h = √(13² − 5²) = 12 см. Площадь S = (10 + 20) · 12/2 = 180 см².","answer":180,"unit":"см²","visual":{"kind":"polygon","points":[[0,0],[5.0,12],[15.0,12],[20,0]],"labels":["A","B","C","D"],"grid":false,"segments":[{"from":[5.0,12],"to":[5.0,0],"dashed":true},{"from":[15.0,12],"to":[15.0,0],"dashed":true}],"ariaLabel":"Равнобедренная трапеция ABCD с основаниями AD = 20 и BC = 10. Показаны перпендикуляры из B и C к основанию AD."}},{"id":"n25-x-inradius","title":"Радиус нового треугольника","prompt":"В прямоугольный треугольник с катетами 8 и 15 см и гипотенузой 17 см вписана окружность. Найди её радиус.","type":"number","skillId":"n25-inradius","hint":"Найди S и p отдельно, затем раздели S на p.","explanation":"S = 8 · 15/2 = 60 см², p = (8 + 15 + 17)/2 = 20 см. Радиус r = 60/20 = 3 см.","answer":3,"unit":"см","visual":{"kind":"polygon","points":[[0,0],[15,0],[0,8]],"labels":["A","B","C"],"grid":false,"circles":[{"center":[3,3],"radius":3,"showCenter":true,"label":"O"}],"bounds":{"xMin":-1,"xMax":16,"yMin":-1,"yMax":10},"ariaLabel":"Прямоугольный треугольник с катетами 8 и 15, гипотенузой 17 и вписанной окружностью с центром O."}}],"creative":[{"id":"n25-c-trapezoid","title":"Собери высоту и площадь","prompt":"У равнобедренной трапеции основания 6 и 16 см, боковые стороны по 13 см. После проведения двух высот у большего основания остаются два равных отрезка d. Найди d, высоту h и площадь S.","type":"build","skillId":"n25-construction","hint":"Сначала 2d + 6 = 16. Затем d² + h² = 13². Площадь должна соответствовать найденной высоте.","explanation":"d = 5 см, h = 12 см. Площадь S = (6 + 16) · 12/2 = 132 см². Каждая следующая величина связана с предыдущим построением.","fields":[{"name":"d","label":"Отрезок у основания d, см","min":0,"max":20,"initial":4},{"name":"h","label":"Высота h, см","min":0.1,"max":20,"initial":10},{"name":"S","label":"Площадь S, см²","min":1,"max":400,"initial":100}],"conditions":[{"left":"2*d+6","op":"eq","right":"16"},{"left":"d*d+h*h","op":"eq","right":"169"},{"left":"2*S","op":"eq","right":"22*h"}],"exampleSolution":{"d":5,"h":12,"S":132},"visual":{"kind":"polygon","points":[[0,0],[5.0,12],[11.0,12],[16,0]],"labels":["A","B","C","D"],"grid":false,"segments":[{"from":[5.0,12],"to":[5.0,0],"dashed":true},{"from":[11.0,12],"to":[11.0,0],"dashed":true}],"ariaLabel":"Равнобедренная трапеция ABCD с основаниями AD = 16 и BC = 6. Показаны перпендикуляры из B и C к основанию AD."}},{"id":"n25-c-incircle","title":"Три величины одной окружности","prompt":"У треугольника стороны 13, 14 и 15 см; высота к стороне 14 см равна 12 см. Подбери его площадь S, полупериметр p и радиус r вписанной окружности так, чтобы все три величины согласовались.","type":"build","skillId":"n25-inradius","hint":"Используй S = 14 · 12/2, p = (13 + 14 + 15)/2 и S = pr.","explanation":"S = 84 см², p = 21 см, r = 84/21 = 4 см. Для формулы S = pr нужен именно полупериметр; подстановка 42 вместо 21 даст неверный радиус.","fields":[{"name":"S","label":"Площадь S, см²","min":1,"max":200,"initial":60},{"name":"p","label":"Полупериметр p, см","min":1,"max":50,"initial":42},{"name":"r","label":"Радиус r, см","min":0.1,"max":10,"initial":2}],"conditions":[{"left":"2*S","op":"eq","right":"168"},{"left":"2*p","op":"eq","right":"42"},{"left":"p*r","op":"eq","right":"S"}],"exampleSolution":{"S":84,"p":21,"r":4},"visual":{"kind":"polygon","points":[[5,12],[0,0],[5,0],[14,0]],"labels":["A","B","H","C"],"grid":false,"segments":[{"from":[5,12],"to":[5,0],"dashed":true}],"circles":[{"center":[6,4],"radius":4,"showCenter":true,"label":"O"}],"bounds":{"xMin":-1,"xMax":15,"yMin":-1,"yMax":13},"ariaLabel":"Треугольник со сторонами AB = 13, BC = 14, AC = 15. AH — высота к BC. Показана вписанная окружность с центром O."}},{"id":"n25-c-vertex","title":"Поставь вершину на нужное место","prompt":"Зададим B(0; 0), C(14; 0), A(x; h), где h > 0. Подбери целые x и h так, чтобы AB = 13 и AC = 15. Затем укажи площадь S этого треугольника. Чертёж показывает твой текущий вариант.","type":"build","skillId":"n25-combine","hint":"По теореме Пифагора x² + h² = 169 и (x − 14)² + h² = 225. Вычитание уравнений убирает h².","explanation":"Из разности равенств получаем 196 − 28x = 56, откуда x = 5. Тогда h² = 169 − 25 = 144; при h > 0 имеем h = 12. Площадь S = 14 · 12/2 = 84.","fields":[{"name":"x","label":"Абсцисса вершины A","min":0,"max":14,"integer":true,"initial":7},{"name":"h","label":"Высота h","min":1,"max":15,"integer":true,"initial":8},{"name":"S","label":"Площадь S","min":1,"max":200,"integer":true,"initial":40}],"conditions":[{"left":"x*x+h*h","op":"eq","right":"169"},{"left":"(x-14)*(x-14)+h*h","op":"eq","right":"225"},{"left":"2*S","op":"eq","right":"14*h"}],"exampleSolution":{"x":5,"h":12,"S":84},"visual":{"kind":"polygon","points":[[7,8],[0,0],[14,0]],"labels":["A","B","C"],"grid":true,"bounds":{"xMin":-1,"xMax":15,"yMin":-1,"yMax":16},"dynamic":{"kind":"vertex","index":0,"x":"x","y":"h"},"ariaLabel":"Текущий треугольник A(x; h), B(0; 0), C(14; 0). Положение A изменяется при вводе x и h. Сторона клетки равна единичному отрезку."}},{"id":"n25-c-scale","title":"Увеличь фигуру без путаницы","prompt":"У треугольника со сторонами 3, 4 и 5 площадь равна 6, а радиус вписанной окружности — 1. Увеличь все стороны в целое число k от 2 до 4 раз. Укажи новую площадь S и новый радиус r.","type":"build","skillId":"n25-scale","hint":"Радиус — длина, поэтому меняется в k раз. Площадь меняется в k² раз.","explanation":"Например, при k = 3 площадь становится 6 · 3² = 54, а радиус   function width(el){return Math.max(220,Math.floor(el.getBoundingClientRect().width));}
  function plotFrame(el,options){
    var w=width(el),h=options.compact?235:270,L=42,R=w-18,T=20,B=h-30;
    var xmin=options.xMin,xmax=options.xMax,ymin=options.yMin,ymax=options.yMax;
    function X(x){return L+(x-xmin)/(xmax-xmin)*(R-L);}
    function Y(y){return B-(y-ymin)/(ymax-ymin)*(B-T);}
    function tickStep(span,count){
      var raw=span/count,scale=Math.pow(10,Math.floor(Math.log10(raw))),n=raw/scale;
      return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*scale;
    }
    function ticks(min,max,count){
      var step=tickStep(max-min,count),values=[],start=Math.ceil(min/step)*step;
      for(var n=start;n<=max+step*1e-8;n+=step)values.push(Math.abs(n)<step*1e-8?0:n);
      if(values.length>count){step*=2;values=[];for(var k=Math.ceil(min/step)*step;k<=max+step*1e-8;k+=step)values.push(Math.abs(k)<step*1e-8?0:k);}
      return values;

    xticks.forEach(function(x){body+=line(X(x),T,X(x),B)+text(X(x),B+19,fmt(x));});
    yticks.forEach(function(y){body+=line(L,Y(y),R,Y(y))+text(L-8,Y(y)+4,fmt(y),"end");});
    if(ymin<=0&&ymax>=0)body+=line(L,Y(0),R,Y(0),"var(--soft)",1.5);
    if(xmin<=0&&xmax>=0)body+=line(X(0),T,X(0),B,"var(--soft)",1.5);
    body+=text(R-1,B-7,"x","end")+text(L+8,T+6,"y","start");
    var clipId="plot-"+String(options.id||"figure").replace(/[^a-zA-Z0-9]/g,"");
    body+='<defs><clipPath id="'+clipId+'"><rect x="'+L+'" y="'+T+'" width="'+(R-L)+'" height="'+(B-T)+'"/></clipPath></defs>';
    return {w:w,h:h,L:L,R:R,T:T,B:B,xmin:xmin,xmax:xmax,ymin:ymin,ymax:ymax,X:X,Y:Y,body:body,clipId:clipId};
  }
  function markedPoints(frame,points){
    var body="",labels=[];
    (points||[]).forEach(function(p,index){
      var px=frame.X(p[0]),py=frame.Y(p[1]);
      if(px<frame.L||px>frame.R||py<frame.T||py>frame.B)return;
      var content=String.fromCharCode(65+index)+" ("+fmt(p[0])+"; "+fmt(p[1])+")",estimated=content.length*6.5;
      var anchor=px>frame.w*.55?"end":"start",x=px+(anchor==="end"?-9:9),y=py>frame.h/2?py-10:py+19;
      var left=anchor==="end"?x-estimated:x;
      if(left<4){x=4;anchor="start";left=4;}
      if(left+estimated>frame.w-4){x=frame.w-4;anchor="end";left=x-estimated;}
      for(var attempt=0;attempt<5;attempt++){
        var overlap=labels.some(function(r){return left<r.right&&left+estimated>r.left&&y-12<r.bottom&&y>r.top;});
        if(!overlap)break;
        y+=py>frame.h/2?-16:16;
      }
      y=Math.max(15,Math.min(frame.h-8,y));
      labels.push({left:left,right:left+estimated,top:y-12,bottom:y});
      body+='<circle cx="'+px+'" cy="'+py+'" r="5" fill="var(--neg)" stroke="var(--paper)" stroke-width="2"/>'+text(x,y,content,anchor);
    });
    return body;
  }

  function drawFunction(el,v){

    if(action==="skip-workshop"){
      if(run()&&t&&t.learningMode==="creative"){
        var skipped=run().skipped||(run().skipped=[]);
        if(!(progress[t.id]&&progress[t.id].successful>0)&&skipped.indexOf(t.id)<0)skipped.push(t.id);
        setIndex(index()+1);state.feedback=null;render();
      }
      return;
    }
    if(action==="prerequisite"){
      var targetTopic=topics.find(function(top){return top.skills.some(function(sk){return sk.id===b.dataset.skill;});});
      if(targetTopic){
        rememberContext();state.activeRun=null;state.topic=targetTopic.id;state.skill=b.dataset.skill;state.map=true;
        var chosen=targetTopic.creative.findIndex(function(q){return q.skillId===b.dataset.skill;});
        if(chosen>=0){state.mode="creative";state.creativeIndices[targetTopic.id]=chosen;}else state.mode="quick";
        state.feedback=null;render();
      }
      return;
    }
    if(action==="topic"){state.topic=b.dataset.topic;state.skill=null;state.map=false;state.activeRun=null;state.seriesPicker=false;}
    if(action==="mode"){state.mode=b.dataset.mode;state.activeRun=null;}
    if(action==="map"){state.map=!state.map;}
    if(action==="skill"){state.skill=b.dataset.skill;}
    if(action==="creative"||action==="open-creative"){if(run()||action==="open-creative")rememberContext();state.activeRun=null;state.mode="creative";state.creativeIndices[state.topic]=i;}
    if(action==="restart"){state.activeRun=null;state.indices[state.topic]=0;topic().quick.forEach(function(q){delete state.taskStates[q.id];});}
    if(action==="next"){
      if(!run()&&state.mode==="creative" && index()+1>=list().length)state.mode="quick";else setIndex(index()+1);
    }
    if(!s){state.feedback=null;render();return;}
    if(action==="hint"){s.hint=!s.hint;if(s.hint)noteHelp(t,false);}
    if(action==="solution"){s.revealed=!s.revealed;if(s.revealed)noteHelp(t,true);}
    if(["option","probe","model","up","down","sign","cancel","partition","ball"].indexOf(action)>=0){s.examFeedback=null;s.formatSucceeded=false;}
    if(action==="option"){
      if(t.type==="choice")s.selected=[i];
      else{s.selected=s.selected.indexOf(i)>=0?s.selected.filter(function(v){return v!==i;}):s.selected.concat([i]);}
    }
    if(action==="probe"&&t.type==="experiment"){
      var value=Number(b.dataset.value);
      if(t.probeValues.indexOf(value)>=0&&s.probes.indexOf(value)<0)s.probes.push(value);
    }
    if(action==="model"&&t.type==="experiment")s.modelId=b.dataset.value;
    if(action==="up"||action==="down"){var j=i+(action==="up"?-1:1);if(j>=0&&j<s.order.length){var v=s.order[i];s.order[i]=s.order[j];s.order[j]=v;}}
    if(action==="sign")s.sign=b.dataset.value;
    if(action==="cancel")s.cancel=Math.min(Math.abs(t.a),Math.abs(t.b),s.cancel+1);
    if(action==="partition")s.partition=Number(b.dataset.value);
    if(action==="ball")s.red=s.red.indexOf(i)>=0?s.red.filter(function(v){return v!==i;}):s.red.concat([i]);
    state.feedback=null;render();
  });
  root.addEventListener("input",function(e){
    var el=e.target,field=el.dataset.field,t=task();if(!field||!t)return;var s=ts(t);
    if(field==="exam-answer"){
      s.examAnswer=el.value;s.examFeedback=null;s.formatSucceeded=false;
      root.querySelectorAll(".format-feedback").forEach(function(n){n.remove();});saveSession();return;
    }
    if(s.examFeedback){s.examFeedback=null;s.formatSucceeded=false;root.querySelectorAll(".format-feedback").forEach(function(n){n.remove();});}
    clearAnswerFeedback();
    if(field==="answer")s.answer=el.value;
    if(field==="build")s.values[el.dataset.name]=el.value;
    if(field==="k"||field==="b"){
      s[field]=Number(el.value);
      var out=root.querySelector("#"+field+"-output");if(out)out.textContent=fmt(s[field]);
      var f=root.querySelector("#graph-formula");if(f)f.textContent=lineFormula(s.k,s.b);
    }
    if(field==="skew")s.skew=Number(el.value);
    if(["k","b","skew","answer","build"].indexOf(field)>=0)drawAll();
    saveSession();
  });
  root.addEventListener("change",function(e){
    var el=e.target,field=el.dataset.field;
    if(field==="topic"){state.topic=el.value;state.skill=null;state.map=false;state.feedback=null;state.activeRun=null;state.seriesPicker=false;render();}
    if(field==="match"&&task()){
      ts(task()).matches[el.dataset.index]=el.value;
      ts(task()).examFeedback=null;ts(task()).formatSucceeded=false;
      root.querySelectorAll(".format-feedback").forEach(function(n){n.remove();});
      clearAnswerFeedback();
      saveSession();
    }
  });
  root.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.tagName==="INPUT"&&e.target.type==="text"){e.preventDefault();if(e.target.dataset.field==="exam-answer")checkExamFormat();else check();}});
  root.addEventListener("toggle",function(e){if(e.target.matches(".teacher"))state.teacher=e.target.open;if(e.target.matches(".series-picker"))state.seriesPicker=e.target.open;if(e.target.matches(".exam-format")&&task()){ts(task()).examOpen=e.target.open;saveSession();}},true);
  var resize=new ResizeObserver(function(){drawAll();});resize.observe(root);
  window.OGESkillLab=Object.assign(api,{state:state,progress:progress,render:render,task:task,taskState:ts,data:data,series:series,openRoute:openRoute,openTask:openTask,openVariant:openVariant,returnContext:returnContext});
  restoreSession();
  applyLocation();
  window.addEventListener("popstate",function(){applyLocation();render();});
  render();
}());

</script>
</body>
</html>
