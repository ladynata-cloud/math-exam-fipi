name: Profile 2027 — learning start
on:
  pull_request:
    paths: ['ege-profil/start/**', 'ege-profil/trainers/**', 'ege-profil/atanasyan-10-11/**', 'stereo-course/**', 'tools/atanasyan-profile15*', 'ege-profil/learning/**', 'ege-profil/lesson/**', 'ege-profil/homework/**', 'ege-profil/trigonometry/**', 'ege-profil/index.html', 'tools/profile-*', 'tools/fixtures/profile-*', 'trainers/ege-profile/inequalities/**', 'trainers/ege-profile/log-inequalities/**', 'trainers/ege-profile-expressions.html', 'trainers/ege-profile-stereometry.html', 'trainers/board-bridge.js', 'trainers/board-picker.js', 'trainers/board-picker.css', 'trainers/board-workspace.js', 'trainers/board-writing.js', 'trainers/board-images.js', 'trainers/board-ink.js', 'trainers/board-layout.js', 'trainers/board-tools.css', 'trainers/board-picker-data.json', 'trainers/board-compat.json', 'trainers/trainer-board.html', 'board-server/**', 'tools/board-picker-smoke.cjs', 'tools/trainer-registry-client-cutover-smoke.cjs', '.github/workflows/profile-start.yml']
  push:
    branches: [main]
    paths: ['ege-profil/start/**', 'ege-profil/trainers/**', 'ege-profil/atanasyan-10-11/**', 'stereo-course/**', 'tools/atanasyan-profile15*', 'ege-profil/learning/**', 'ege-profil/lesson/**', 'ege-profil/homework/**', 'ege-profil/trigonometry/**', 'ege-profil/index.html', 'tools/profile-*', 'tools/fixtures/profile-*', 'trainers/ege-profile/inequalities/**', 'trainers/ege-profile/log-inequalities/**', 'trainers/ege-profile-expressions.html', 'trainers/ege-profile-stereometry.html', 'trainers/board-bridge.js', 'trainers/board-picker.js', 'trainers/board-picker.css', 'trainers/board-workspace.js', 'trainers/board-writing.js', 'trainers/board-images.js', 'trainers/board-ink.js', 'trainers/board-layout.js', 'trainers/board-tools.css', 'trainers/board-picker-data.json', 'trainers/board-compat.json', 'trainers/trainer-board.html', 'board-server/**', 'tools/board-picker-smoke.cjs', 'tools/trainer-registry-client-cutover-smoke.cjs', '.github/workflows/profile-start.yml']
permissions:
  contents: read
concurrency:
  group: profile-start-${{ github.ref }}
  cancel-in-progress: true
jobs:
  trainer-audit-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.62.1 jsdom@26.1.0
      - run: npx playwright install --with-deps chromium
      - name: Audited mathematics, links, honest progress and requested help
        run: node --test tools/profile-*repair*.test.cjs tools/profile-main-geometry-disclosure.test.cjs tools/profile-progress-report-dom.test.cjs
      - name: Main geometry, construction and graph controls at 320, 390 and 1280 pixels
        run: node tools/profile-main-geometry-disclosure.browser.cjs
      - name: Checkpoint recovery, saved diagnostic and complete read-only teacher report
        if: always()
        run: node tools/profile-progress-repair.browser.cjs
      - name: All additional geometry banks and constructions at three widths
        if: always()
        run: node tools/profile-legacy-geometry-repair.browser.cjs
      - name: Repaired finance, algebra and applied learner screens at three widths
        if: always()
        run: node tools/profile-legacy-learning-repair.browser.cjs
      - name: Financial tables, retained givens and requested references at three widths
        if: always()
        run: node tools/profile-legacy-applied-repair.browser.cjs
      - name: Preserve actual audit viewport evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: profile-trainer-repair-viewports
          path: |
            /tmp/profile-main-geometry-disclosure-shots
            /tmp/profile-progress-repair-shots
            /tmp/profile-legacy-geometry-shots
            /tmp/profile-legacy-learning-shots
            /tmp/profile-finance-layout-shots
          if-no-files-found: warn
          retention-days: 14
  math-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.62.1 jsdom@26.1.0
      - run: npx playwright install --with-deps chromium
      - name: Mathematics and state
        run: node tools/profile-route.test.cjs && node tools/profile-start.test.cjs && node tools/profile-geometry.test.cjs && node tools/profile-algebra.test.cjs && node tools/profile-stereo.test.cjs && node tools/profile-planimetry-models.test.cjs && node tools/profile-vector-models.test.cjs && node tools/profile-number-input.test.cjs && node tools/profile-input-ui.test.cjs
      - name: Real browser and board
        run: node tools/profile-route.browser.cjs && node tools/profile-start.browser.cjs && node tools/profile-first-three.browser.cjs && node tools/profile-triangle-explanation.browser.cjs && node tools/board-picker-smoke.cjs
      - name: Full first part and inequality mathematics
        run: node tools/profile-full-course.test.cjs && node --test tools/profile-probability.test.cjs tools/profile-equations.test.cjs tools/profile-functions.test.cjs tools/profile-applied.test.cjs tools/profile-finance.test.cjs && node tools/profile-part2-inequalities.test.cjs
      - name: Independent exact financial step answers
        run: python tools/profile-finance-exact-steps.py
      - name: Full first part and inequality learner journeys
        run: node tools/profile-full-course.browser.cjs && node tools/profile-part2-inequalities.browser.cjs
      - name: Financial models, earned values and independent practice
        run: node tools/profile-finance.browser.cjs
      - name: Worked solutions for every task and assisted learner journeys
        run: node --test tools/profile-step-solutions.test.cjs && node tools/profile-step-solutions.browser.cjs
      - name: Readable course labels and direct help links
        run: node tools/profile-readable-help.browser.cjs
      - name: Prerequisite mathematics and simulated learners
        run: node tools/profile-readiness-math.test.cjs && node tools/profile-readiness-plan.test.cjs && node tools/profile-algebra-final-step.test.cjs && node tools/profile-readiness.browser.cjs && node tools/profile-learner-robots.browser.cjs
      - name: Calm learning, honest support and mixed thirteen
        run: node --test tools/profile-calm-map.test.cjs tools/profile-calm-micro.test.cjs tools/profile-calm-state.test.cjs tools/profile-checkpoint.test.cjs tools/profile-independent-models.test.cjs && node tools/profile-calm-learners.browser.cjs && node tools/profile-exam-first.browser.cjs
      - name: Unified course and school-topic return
        run: node tools/profile-unified-course.browser.cjs
      - name: Atanasyan stereometry course
        run: node --test tools/atanasyan-profile15-a.test.cjs tools/atanasyan-profile15-b.test.cjs && node tools/atanasyan-profile15.test.cjs && node tools/atanasyan-profile15-model.test.cjs && node tools/atanasyan-profile15.browser.cjs
      - name: Existing profile regression
        run: npm --prefix ege-profil test
      - name: Preserve finance viewport evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: profile-finance-viewports
          path: /tmp/profile-finance-shots
          if-no-files-found: warn
          retention-days: 14
  expressions-board:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: board-server/package-lock.json
      - name: Install locked server and pinned browser tools
        run: |
          npm ci --prefix board-server --include=optional
          npm install --prefix "$RUNNER_TEMP/expressions-board-browser" --no-save --no-package-lock --ignore-scripts playwright@1.62.1 jsdom@26.1.0
          "$RUNNER_TEMP/expressions-board-browser/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/expressions-board-browser/node_modules" >> "$GITHUB_ENV"
      - name: Expressions adapter and picker contracts
        run: node --test tools/profile-expressions-board.test.cjs tools/profile-expressions-picker.test.cjs
      - name: Expressions teacher and observer synchronization
        run: node tools/profile-expressions-board.browser.cjs
  stereo-board:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: board-server/package-lock.json
      - name: Install locked server and pinned browser tools
        run: |
          npm ci --prefix board-server --include=optional
          npm install --prefix "$RUNNER_TEMP/stereo-board-browser" --no-save --no-package-lock --ignore-scripts playwright@1.62.1 jsdom@26.1.0
          "$RUNNER_TEMP/stereo-board-browser/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/stereo-board-browser/node_modules" >> "$GITHUB_ENV"
      - name: Stereometry adapter, model and picker contracts
        run: node --test tools/profile-stereo-board.test.cjs tools/profile-stereo-board-models.test.cjs tools/profile-stereo-picker.test.cjs
      - name: Stereometry teacher and observer synchronization
        run: node tools/profile-stereo-board.browser.cjs
