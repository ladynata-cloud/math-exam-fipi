name: Geometry experiment GIF instructions
on:
  push:
    branches: ['feat/geometry-experiment-gifs-20261116']
  pull_request:
    paths:
      - 'assets/geometry-experiment-gifs/**'
      - 'geometry-course/assets/**'
      - 'geometry-course/atlas/**'
      - 'geometry-pogorelov/assets/**'
      - 'geometry-pogorelov/atlas/**'
      - 'tools/geometry_experiment_guides.py'
      - 'tools/geometry-experiment-gifs*'
      - 'tools/build-geometry-experiment-gifs.py'
      - 'tools/geometry/build_site.py'
      - 'tools/pogorelov/build.py'
      - '.github/workflows/geometry-experiment-gifs.yml'
permissions:
  contents: read
jobs:
  experiment-instructions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GEOMETRY_GIFS_EVIDENCE: ${{ github.workspace }}/artifacts/geometry-experiment-gifs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --ignore-scripts jsdom@26.1.0 playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - name: Fetch the audited base and exact pending interface for testing only
        run: git fetch --depth=1 origin 1469ad50a8659f66c8613164009e7387a3a68f2b 99b3bfb9c231d5fd3b5cdda2c543231171a57618 64ce01049377b4289f46979c52f2c50daf84b92f
      - name: Validate the catalogue, recordings and existing geometry
        run: |
          node tools/geometry-experiment-gifs-catalog.cjs --check
          node tools/geometry/check.js
          node tools/pogorelov/check.cjs
          python3 tools/geometry-experiment-gifs-preservation.py --base 64ce01049377b4289f46979c52f2c50daf84b92f
          node --test tools/geometry/manual-construction.test.cjs tools/geometry/object-labels.test.cjs tools/geometry-experiment-gifs.test.cjs
          python3 tools/geometry/build_site.py --guides-only
          python3 tools/pogorelov/build.py --guides-only
          git diff --exit-code -- geometry-course/atlas geometry-pogorelov/atlas
          git diff --check
      - name: Check real lesson controls, mobile layout and offline help
        run: node tools/geometry-experiment-gifs.ui.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: geometry-experiment-gifs-evidence
          path: |
            artifacts/geometry-experiment-gifs/*.png
            artifacts/geometry-experiment-gifs/results.json
  capture-reviewed-clips:
    # Independent of the strict stale-media gate above. The intermediate branch
    # may fail that gate until these reviewed artifacts are imported and tested.
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/geometry-experiment-gifs-20261116'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        batch: [atanasyan, pogorelov, experiments]
    env:
      CAPTURE_BATCH: ${{ matrix.batch }}
      CAPTURE_ROOT: artifacts/geometry-gif-capture/${{ matrix.batch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.14.0'
      - name: Install the pinned recorder and encoder dependencies
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.62.1
          npx playwright install --with-deps chromium
          python3 -m venv "$RUNNER_TEMP/gif-encoder"
          "$RUNNER_TEMP/gif-encoder/bin/python" -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Verify the exact reviewed clip list, scenarios and source bytes
        id: reviewed
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess
          from pathlib import Path
          sha = lambda raw: hashlib.sha256(raw).hexdigest()
          plan = json.loads(Path('tools/geometry-experiment-gifs-capture-20261118.json').read_text())
          catalog_path = Path('assets/geometry-experiment-gifs/catalog.json')
          catalog = json.loads(catalog_path.read_text())['clips']
          old_media = json.loads(Path('assets/geometry-experiment-gifs/media.json').read_text())['clips']
          assert plan['schemaVersion'] == 1
          assert set(plan['batches']) == {'atanasyan', 'pogorelov', 'experiments'}
          all_ids = [clip for batch in plan['batches'].values() for clip in batch]
          assert len(all_ids) == len(set(all_ids)) and 1 <= len(all_ids) <= 63
          assert all(re.fullmatch(r'[a-z0-9-]+', clip) and clip in catalog for clip in all_ids)
          assert all(catalog[clip]['surface'] in ('manual', 'experiment') and not catalog[clip].get('sourceRef') for clip in all_ids)
          # JSON.stringify is the recorder authority for scenario bytes.
          script = "const c=require('./assets/geometry-experiment-gifs/catalog.json').clips; const h=require('node:crypto'); console.log(JSON.stringify(Object.fromEntries(Object.keys(c).map(id=>[id,h.createHash('sha256').update(JSON.stringify(c[id])).digest('hex')]))));"
          scenarios = json.loads(subprocess.check_output(['node', '-e', script]))
          sources = {}
          per_clip_sources = {}
          stale = []
          for clip, definition in catalog.items():
              if definition.get('sourceRef') or definition['surface'] == 'investigation':
                  continue
              course = definition['sourceCourse']
              assert course in ('geometry-course', 'geometry-pogorelov')
              files = [course + '/assets/course.css', course + '/assets/geometry.js']
              if definition['surface'] == 'manual':
                  files.append(course + '/assets/lab.js')
              else:
                  files.append(course + '/assets/experiments.js')
                  if course == 'geometry-pogorelov':
                      files.append(course + '/assets/extra-models.js')
              actual = {file: sha(Path(file).read_bytes()) for file in files}
              sources.update(actual)
              per_clip_sources[clip] = actual
              record = old_media.get(clip)
              if record is None or actual != record['sourceHashes'] or scenarios[clip] != record['scenarioSha256']:
                  stale.append(clip)
          assert sorted(all_ids) == sorted(stale), 'Only the exact reviewed missing-or-stale active clips may be captured'
          assert sources == plan['sourceHashes'], 'Runtime changed after capture review'
          assert {clip: scenarios[clip] for clip in all_ids} == plan['scenarioSha256']
          for file in ('tools/geometry-experiment-gifs.browser.cjs', 'tools/build-geometry-experiment-gifs.py'):
              assert sha(Path(file).read_bytes()) == plan['toolHashes'][file], 'Recorder or encoder changed after review'
          ids = plan['batches'][os.environ['CAPTURE_BATCH']]
          assert 1 <= len(ids) <= 30, 'Nonempty bounded batch required'
          output = Path(os.environ['CAPTURE_ROOT'])
          output.mkdir(parents=True, exist_ok=True)
          receipt = {'schemaVersion': 1, 'complete': False, 'head': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), 'tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(), 'batch': os.environ['CAPTURE_BATCH'], 'clips': ids, 'sourceHashes': sources, 'sourceHashesByClip': {clip: per_clip_sources[clip] for clip in ids}, 'scenarioSha256': {clip: scenarios[clip] for clip in ids}, 'toolHashes': plan['toolHashes'], 'catalogSha256': sha(catalog_path.read_bytes()), 'planSha256': sha(Path('tools/geometry-experiment-gifs-capture-20261118.json').read_bytes()), 'toolchain': {'node': subprocess.check_output(['node', '--version'], text=True).strip(), 'playwright': '1.62.1', 'pillow': '11.3.0', 'python': subprocess.check_output(['python3', '--version'], text=True).strip()}}
          (output / 'source-receipt.json').write_text(json.dumps(receipt, ensure_ascii=False, indent=2) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('clips=' + ','.join(ids) + '\n')
          PY
      - name: Record the reviewed existing controls in Chromium
        env:
          REVIEWED_CLIPS: ${{ steps.reviewed.outputs.clips }}
        run: node tools/geometry-experiment-gifs.browser.cjs --clips "$REVIEWED_CLIPS" --workers 2 --output "$CAPTURE_ROOT/recordings"
      - name: Encode actual captured frames without changing repository assets
        env:
          REVIEWED_CLIPS: ${{ steps.reviewed.outputs.clips }}
        run: |
          "$RUNNER_TEMP/gif-encoder/bin/python" tools/build-geometry-experiment-gifs.py "$CAPTURE_ROOT/recordings" --clips "$REVIEWED_CLIPS" --output "$CAPTURE_ROOT/encoded"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['CAPTURE_ROOT'])
          receipt = json.loads((root / 'source-receipt.json').read_text())
          media = json.loads((root / 'encoded/media.json').read_text())
          assert sorted(media['clips']) == sorted(receipt['clips'])
          for clip, row in media['clips'].items():
              assert row['scenarioSha256'] == receipt['scenarioSha256'][clip]
              assert row['sourceHashes'] == receipt['sourceHashesByClip'][clip]
              assert row['recorderSha256'] == receipt['toolHashes']['tools/geometry-experiment-gifs.browser.cjs']
              assert row['encoderSha256'] == receipt['toolHashes']['tools/build-geometry-experiment-gifs.py']
              assert row['recordingSha256'] == hashlib.sha256((root / 'recordings' / clip / 'recording.json').read_bytes()).hexdigest()
              assert all(hashlib.sha256((root / 'encoded' / file).read_bytes()).hexdigest() == value for file, value in row['sha256'].items())
          receipt['complete'] = True
          receipt['encodedMediaSha256'] = hashlib.sha256((root / 'encoded/media.json').read_bytes()).hexdigest()
          receipt['browserVersions'] = sorted({row['browser'] for row in media['clips'].values()})
          (root / 'source-receipt.json').write_text(json.dumps(receipt, ensure_ascii=False, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: geometry-gif-capture-${{ matrix.batch }}-${{ github.sha }}
          path: artifacts/geometry-gif-capture/${{ matrix.batch }}/
          if-no-files-found: warn
          retention-days: 7
