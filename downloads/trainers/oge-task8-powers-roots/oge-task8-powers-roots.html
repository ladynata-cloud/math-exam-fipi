(function standaloneTrainer(config) {

<title>Задание 8 ОГЭ — степени и корни</title>
<link rel="canonical" href="https://mathexam.space/trainers/oge-task8-powers-roots.html">
<style>
:root{
  --paper:#fefdf6; --cell:#dbe7f0; --marg:#e88a8a;
  --ink:#22324d; --pen:#1a3b8b; --green:#1e7a2e; --red:#c62828;
  --chip:#eef4fb; --chipbd:#b9cfe8; --gold:#b8860b;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; color:var(--ink);
  font:16px/1.55 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  background:var(--paper);
  background-image:
    linear-gradient(var(--cell) 1px, transparent 1px),
    linear-gradient(90deg, var(--cell) 1px, transparent 1px);
  background-size:24px 24px;
}
.hand{font-family:"Segoe Print","Comic Sans MS","Comic Neue",cursive}
header{
  position:sticky; top:0; z-index:30;
  background:rgba(254,253,246,.96); backdrop-filter:blur(3px);
  border-bottom:2px solid var(--marg);
  padding:10px 14px 0;
}
.htitle{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.htitle h1{margin:0;font-size:22px;color:var(--pen)}
.htitle .sub{color:#5b6b85;font-size:14px}
nav.tabs{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
nav.tabs button{
  border:2px solid var(--chipbd); border-bottom:none; background:var(--chip);
  padding:8px 14px; border-radius:10px 10px 0 0; cursor:pointer;
  font:inherit; font-weight:600; color:var(--pen);
}
nav.tabs button.on{background:#fff;border-color:var(--marg);color:var(--ink);box-shadow:0 2px 0 #fff}
main{max-width:1060px;margin:0 auto;padding:18px 14px 90px;position:relative}
main::before{content:"";position:fixed;top:0;bottom:0;left:calc(50% - 553px);width:2px;background:var(--marg);opacity:.55;pointer-events:none}
@media(max-width:1140px){main::before{left:10px}}
section.view{display:none}
section.view.on{display:block}
.card{
  background:#fff;border:1.5px solid var(--chipbd);border-radius:12px;
  padding:16px 18px;margin:14px 0;box-shadow:2px 3px 0 rgba(120,150,190,.15);
}
.card h2{margin:0 0 8px;color:var(--pen);font-size:20px}
.card h3{margin:14px 0 6px;color:var(--pen);font-size:17px}
.num{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;border-radius:50%;
  background:var(--pen);color:#fff;font-weight:700;margin-right:8px;font-size:15px;padding:0 6px}
.pill{display:inline-block;border:1.5px solid var(--chipbd);background:var(--chip);border-radius:999px;
  padding:3px 12px;margin:3px 4px 3px 0;font-size:14px;cursor:pointer;color:var(--pen);user-select:none}
.pill:hover{border-color:var(--pen)}
.pill.on{background:var(--pen);color:#fff;border-color:var(--pen)}
.pill.ghost{cursor:default}
.pill.ghost:hover{border-color:var(--chipbd)}
button.act{
  font:inherit;font-weight:600;border-radius:10px;padding:8px 16px;cursor:pointer;
  border:2px solid var(--pen);background:var(--pen);color:#fff;
}
button.act.sec{background:#fff;color:var(--pen)}
button.act.show{border-color:var(--gold);background:#fff;color:var(--gold)}
button.act:disabled{opacity:.45;cursor:default}
input.ans{
  font:inherit;font-size:18px;width:110px;padding:6px 10px;border:2px solid var(--chipbd);
  border-radius:8px;text-align:center;background:#fffef8;
}
input.ans:focus{outline:none;border-color:var(--pen)}
input.ans.ok{border-color:var(--green);background:#f0faf0}
input.ans.no{border-color:var(--red);background:#fdf2f2}
.fb{font-weight:600;margin-left:8px}
.fb.ok{color:var(--green)} .fb.no{color:var(--red)} .fb.shown{color:var(--gold)}
/* ---------- математика ---------- */
.m{white-space:nowrap;font-size:19px;font-family:Georgia,"Times New Roman",serif;font-style:italic}
.m b, .m .up{font-style:normal}
.m sup{font-size:.68em;font-style:normal}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 3px;line-height:1.15}
.fr>.fn{border-bottom:1.6px solid currentColor;padding:0 6px}
.fr>.fd{padding:0 6px}
.rt{display:inline-flex;align-items:stretch;vertical-align:middle;margin:0 2px;line-height:1}
.rt>.rsv{flex:none;width:.6em;align-self:stretch;display:block;overflow:visible}
.rt>.rsv path{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.rt>.ru{border-top:1.5px solid currentColor;padding:2.5px 5px 0 3px;min-height:1em;margin-left:-1px}
.big{font-size:22px}
.expr{margin:8px 0 12px}
.ok-ink{color:var(--green);font-weight:600}
.red-ink{color:var(--red);font-weight:600}
.gold-ink{color:var(--gold);font-weight:600}
/* ---------- справочник ---------- */
.refwrap{background:#fff;border:2px solid var(--ink);border-radius:6px;padding:20px 22px;margin:14px 0;position:relative}
.refwrap::before{content:"СПРАВОЧНЫЕ МАТЕРИАЛЫ · то, что пригодится в задании 8";display:block;text-align:center;
  font-weight:700;letter-spacing:.06em;color:var(--ink);margin-bottom:4px;font-size:15px}
.refrow{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:12px 6px;border-bottom:1px dashed var(--chipbd)}
.refrow:last-child{border-bottom:none}
.refrow .formula{flex:0 0 auto;min-width:210px}
.refrow .links{flex:1;min-width:230px}
.refrow .links .lbl{font-size:13px;color:#5b6b85;margin-right:6px}
.refhead{margin:16px 0 4px;font-weight:700;color:var(--pen);font-size:17px}
.refnote{font-size:13px;color:#5b6b85}
/* таблица квадратов */
table.sq{border-collapse:collapse;font-size:13.5px;margin-top:8px}
table.sq td,table.sq th{border:1px solid #9db4cc;padding:3px 6px;text-align:center;min-width:44px}
table.sq th{background:var(--chip);color:var(--pen)}
table.sq td{cursor:pointer;background:#fff}
table.sq td.hl{background:#ffe9a8;font-weight:700}
.sqtool{margin:10px 0}
/* ---------- учимся ---------- */
.tool{border:1.5px dashed var(--chipbd);border-radius:10px;padding:12px 14px;margin:10px 0;background:#fbfdff}
.tool .tl{font-size:13px;color:#5b6b85;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.ladder{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:19px}
.ladder .rung{border:1.5px solid var(--chipbd);border-radius:8px;padding:6px 10px;background:#fff}
.ladder .rung.now{border-color:var(--pen);box-shadow:0 0 0 2px #dfe9fb}
.crosslink{color:var(--pen);text-decoration:underline dotted;cursor:pointer}
.note{background:#fff8e6;border:1.5px solid #eedc9a;border-radius:10px;padding:10px 14px;margin:10px 0}
.seen-tbl{width:100%;border-collapse:collapse;margin:8px 0}
.seen-tbl td,.seen-tbl th{border:1px solid var(--chipbd);padding:7px 10px;text-align:left;vertical-align:top}
.seen-tbl th{background:var(--chip);color:var(--pen)}
.seen-tbl td:first-child{white-space:nowrap}
/* ---------- шаги ---------- */
.steps{margin-top:10px}
.step{border-left:4px solid var(--chipbd);padding:8px 12px;margin:8px 0;background:#fbfdff;border-radius:0 10px 10px 0}
.step.done{border-left-color:var(--green)}
.step.shown{border-left-color:var(--gold)}
.step .q{margin-bottom:6px}
.step .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.step .hint{margin-top:6px;color:#5b6b85;font-size:14.5px;display:none}
.step .hint.on{display:block}
.finline{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center}
.score{position:fixed;bottom:0;left:0;right:0;background:#fffdf2;border-top:2px solid var(--marg);
  padding:8px 14px;font-size:15px;display:flex;gap:18px;justify-content:center;flex-wrap:wrap;z-index:20}
.score b{color:var(--pen)}
/* ---------- марафон ---------- */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px;margin-top:12px}
.mtask{background:#fff;border:1.5px solid var(--chipbd);border-radius:12px;padding:12px 14px}
.mtask.ok{border-color:var(--green)} .mtask.shown{border-color:var(--gold)}
.mtask .mid{font-size:13px;color:#5b6b85;margin-bottom:4px;display:flex;justify-content:space-between;gap:6px}
.mtask .mrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.mtask .msteps{margin-top:8px}
.filters{display:flex;flex-wrap:wrap;gap:2px;margin-top:6px}
.hintbox{font-size:13px;color:#5b6b85;margin-top:4px}
.quiz-choice{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.quiz-choice button{font:inherit;border:2px solid var(--chipbd);border-radius:10px;background:#fff;
  padding:8px 12px;cursor:pointer;color:var(--pen);font-weight:600}
.quiz-choice button.pick-ok{border-color:var(--green);color:var(--green)}
.quiz-choice button.pick-no{border-color:var(--red);color:var(--red)}
a.jump{color:var(--pen)}
.small{font-size:14px;color:#5b6b85}
/* ---------- доступность (канон): кнопки и поля не ниже 44 px, видимый фокус ---------- */
nav.tabs button,button.act,.quiz-choice button,input.ans{min-height:44px}
button.pill{font:inherit;font-size:14px;min-height:44px}
button.crosslink{font:inherit;background:none;border:none;padding:0 2px;min-height:44px;color:var(--pen);text-decoration:underline dotted;cursor:pointer}
:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
.crumbs{display:inline-flex;align-items:center;min-height:44px;font-size:14.5px;font-weight:600;color:var(--pen);text-decoration:none}
.crumbs:hover{text-decoration:underline}
.ladder-note{font-size:14px;color:#5b6b85;margin:6px 0 2px}
/* ---------- работа над ошибками, зачёт ---------- */
.review-box{border:2px solid var(--gold);background:#fff8e6;border-radius:12px;padding:10px 14px;margin:14px 0}
.qprog{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 10px}
.qprog .qd{width:12px;height:12px;border-radius:50%;background:var(--cell)}
.qprog .qd.cur{background:var(--pen)} .qprog .qd.g{background:var(--green)} .qprog .qd.r{background:var(--red)}
.qscore{font-size:30px;font-weight:700;color:var(--pen)}
.qrow{border-top:1px dashed var(--chipbd);padding:9px 0}
.qrow .qdiag{font-size:14.5px;margin-top:3px}
@media print{
  nav.tabs,.crumbs,button,.score,.filters,.steps,.msteps,.fb,.ladder-note,.qprog,input{display:none !important}
  body{background:#fff}
  header{position:static}
  .card,.mtask{box-shadow:none;break-inside:avoid}
}
/* 360 px (канон): широкие таблицы и выражения прокручиваются в своей рамке, страница — нет */
table.sq,.seen-tbl{display:block;max-width:100%;overflow-x:auto}
.expr,.refrow .formula{max-width:100%;overflow-x:auto}

<script>
"use strict";

/* Presentation helpers only: nodes are moved, never cloned, so their handlers and progress survive. */
const OGEMinimal={
  group(root,nodes,label,cls){
    if(!root||typeof root.appendChild!=="function")return null;
    nodes=nodes.filter(Boolean);if(!nodes.length)return null;
    const details=document.createElement('details');details.className=cls||'minimal-options';
    const summary=document.createElement('summary');summary.textContent=label;details.appendChild(summary);
    nodes.forEach(node=>details.appendChild(node));root.appendChild(details);return details;
  },
  shell(root,selectors,title){
    if(!root||!document.body||!document.body.querySelector)return;
    const heading=document.querySelector('h1');if(heading)heading.textContent=title;
    const nodes=selectors.map(s=>document.querySelector(s)).filter(Boolean);
    this.group(root,nodes,'Темы, режимы и результаты','minimal-settings');
  },
  paginate(grid,selector){
    if(!grid||!grid.querySelectorAll)return;
    const cards=Array.from(grid.querySelectorAll(selector));if(!cards.length)return;
    const old=grid.nextElementSibling;if(old&&old.classList.contains('minimal-task-nav'))old.remove();
    const nav=document.createElement('div');nav.className='minimal-task-nav';
    const next=document.createElement('button');next.type='button';next.className='btn minimal-next';next.textContent='Другое задание →';nav.appendChild(next);
    const options=document.createElement('details');options.className='minimal-options';
    const summary=document.createElement('summary');summary.textContent='Выбрать задание';options.appendChild(summary);
    const label=document.createElement('label');label.textContent='Задание ';const select=document.createElement('select');select.setAttribute('aria-label','Выбрать задание');label.appendChild(select);options.appendChild(label);nav.appendChild(options);
    cards.forEach((card,i)=>{const option=document.createElement('option');option.value=String(i);option.textContent=String(i+1)+' из '+cards.length;select.appendChild(option);});
    let current=0;const activate=i=>{current=i;cards.forEach((card,j)=>{card.hidden=j!==i;});select.value=String(i);};
    select.onchange=()=>activate(Number(select.value));next.onclick=()=>activate((current+1)%cards.length);activate(0);grid.after(nav);
  }
};

"use strict";
/* ================= точная арифметика ================= */
function gcdB(a,b){a=a<0n?-a:a;b=b<0n?-b:b;while(b){const t=a%b;a=b;b=t}return a}
function Fr(n,d=1n){n=BigInt(n);d=BigInt(d);if(d<0n){n=-n;d=-d}const g=gcdB(n,d)||1n;return{n:n/g,d:d/g}}
const fadd=(a,b)=>Fr(a.n*b.d+b.n*a.d,a.d*b.d);
const fmul=(a,b)=>Fr(a.n*b.n,a.d*b.d);
const fdiv=(a,b)=>Fr(a.n*b.d,a.d*b.n);
const feq=(a,b)=>a.n===b.n&&a.d===b.d;
const fint=a=>a.d===1n;
function ipow(b,e){b=BigInt(b);e=BigInt(e);let r=1n;for(let i=0n;i<e;i++)r*=b;return r}
function fpow(f,e){e=Number(e);return e>=0?Fr(ipow(f.n,e),ipow(f.d,e)):Fr(ipow(f.d,-e),ipow(f.n,-e))}
function isqrtB(x){if(x<0n)return null;if(x<2n)return x;let r=BigInt(Math.floor(Math.sqrt(Number(x))));while(r*r>x)r--;while((r+1n)*(r+1n)<=x)r++;return r*r===x?r:null}
function fsqrt(f){const a=isqrtB(f.n),b=isqrtB(f.d);return(a===null||b===null)?null:Fr(a,b)}
function fmtFr(f){ // человеческая запись: целое, десятичная с запятой или a/b
  if(fint(f))return f.n.toString();
  let d=f.d,two=0,five=0;
  while(d%2n===0n){d/=2n;two++} while(d%5n===0n){d/=5n;five++}
  if(d===1n){const k=Math.max(two,five);const num=f.n*ipow(2n,k-two)*ipow(5n,k-five);
    let s=(num<0n?-num:num).toString().padStart(k+1,"0");
    s=s.slice(0,s.length-k)+","+s.slice(s.length-k);
    return (f.n<0n?"−":"")+s;}
  return f.n+"/"+f.d;
}
function parseAns(s){
  if(s==null)return null;
  s=String(s).trim().replace(/\s+/g,"").replace(",",".").replace("−","-");
  if(!s)return null;
  let m=s.match(/^(-?\d+)\/(\d+)$/); if(m)return Fr(m[1],m[2]);
  m=s.match(/^(-?)(\d+)\.(\d+)$/);
  if(m){const sign=m[1]==="-"?-1n:1n;const den=ipow(10n,m[3].length);
    return Fr(sign*(BigInt(m[2])*den+BigInt(m[3])),den);}
  m=s.match(/^-?\d+$/); if(m)return Fr(s);
  return null;
}
/* ================= отрисовка математики ================= */
const M=h=>`<span class="m">${h}</span>`;
const sup=e=>{const n=Number(e);if(!Number.isFinite(n))return `<sup>${e}</sup>`;return n===1?"":`<sup>${n<0?"−"+(-n):n}</sup>`};
const pw=(b,e)=>`${b}${sup(e)}`;
const fr=(a,b)=>`<span class="fr"><span class="fn">${a}</span><span class="fd">${b}</span></span>`;
const rt=x=>`<span class="rt"><svg class="rsv" viewBox="0 0 12 24" preserveAspectRatio="none" aria-hidden="true"><path d="M1 13 L4.6 22.6 L12 0"/></svg><span class="ru">${x}</span></span>`;
const par=x=>`<span class="up">(</span>${x}<span class="up">)</span>`;
const dot=" · ";
const numFr=f=>{ // этажная дробь для смешанного/обычного числа из Fr
  if(fint(f))return f.n.toString();
  const neg=f.n<0n, n=neg?-f.n:f.n;
  const w=n/f.d, r=n%f.d;
  const core=w>0n?`${w}${fr(r,f.d)}`:fr(r,f.d);
  return (neg?"−":"")+core;
};
function atVals(pairs){ // "при a = 2, b = 3" c этажными дробями
  return ` <span class="up" style="font-style:italic">при ${pairs.map(([k,v])=>`${k} = ${typeof v==="object"?numFr(v):v}`).join(", ")}</span>`;
}
/* ---- рендер каждого типа ---- */
const R={
 rootpow:p=>rt(pw(p.b,p.n)),
 rootmono:p=>rt(`${p.c}x${sup(p.p)}y${sup(p.q)}`)+atVals([["x",p.x],["y",p.y]]),
 rootfrac1:p=>fr(rt(pw(p.c1+"a",1).replace("a","a")+"") , "")&&fr(rt(`${p.c1}a${sup(p.p)}`)+dot+rt(`${p.c2}b${sup(p.q)}`), rt("ab"))+atVals([["a",p.a],["b",p.b]]),
 rootfrac2:p=>fr(rt(`${p.c1}a${sup(p.p)}`)+dot+rt(`${p.c2}b${sup(p.q)}`), rt(`a${sup(p.r)}b${sup(p.s)}`))+atVals([["a",p.a],["b",p.b]]),
 sq_over_d:p=>fr(par(`${p.k}${rt(p.m)}`)+"<sup>2</sup>", p.d),
 d_over_sq:p=>fr(p.d, par(`${p.k}${rt(p.m)}`)+"<sup>2</sup>"),
 rootmuldiv:p=>fr(rt(p.m)+dot+rt(p.n), rt(p.d)),
 rootprod3:p=>`${p.k1}${rt(p.m1)}${dot}${p.k2}${rt(p.m2)}${dot}${rt(p.m3)}`,
 rootprod2:p=>rt(`${p.m} · ${p.n}`)+dot+rt(p.k),
 diffsq_int:p=>par(rt(p.a)+" − "+p.b)+par(rt(p.a)+" + "+p.b),
 diffsq_root:p=>par(rt(p.a)+" − "+rt(p.b))+par(rt(p.a)+" + "+rt(p.b)),
 distrib:p=>par(rt(p.A)+(p.sign<0?" − ":" + ")+rt(p.B))+dot+rt(p.B),
 pow_mul_div:p=>fr(pw(p.b,p.p)+dot+pw(p.b,p.q), pw(p.b,p.r)),
 pow_pow_div:p=>fr(par(pw(p.b,p.p))+sup(p.q), pw(p.b,p.r)),
 pow_mul_pow:p=>pw(p.b,p.p)+dot+par(pw(p.b,p.q))+sup(p.r),
 pow_prodbase_div:p=>fr(pw(p.b1,p.p)+dot+pw(p.b2,p.q), pw(p.b1*p.b2,p.r)),
 prodbase_over:p=>fr(par(p.b1+" · "+p.b2)+sup(p.p), pw(p.b1,p.q)+dot+pw(p.b2,p.r)),
 sqsum:p=>p.sign>0
   ? par(rt(p.m)+" + "+p.k)+"<sup>2</sup> − "+(2*p.k)+rt(p.m)
   : par(rt(p.m)+" − "+p.k)+"<sup>2</sup> + "+(2*p.k)+rt(p.m),
 pow_over_num:p=>fr(pw(p.b,p.p), p.d),
 recip_pow:p=>fr(1,pw(p.b,p.p))+dot+fr(1,pw(p.b,p.q)),
 pow_var_div:p=>par(pw("a",p.pp))+sup(p.q)+" : "+pw("a",p.r)+atVals([["a",p.a]]),
 pow_ab:p=>fr(pw("a",p.pp)+dot+par(pw("b",p.q))+sup(p.r), par("a · b")+sup(p.s))+atVals([["a",p.a],["b",rt(p.a)]]),
 root_neg:p=>rt(p.negfirst? par("−a")+sup(p.pp)+dot+pw("a",p.q) : pw("a",p.pp)+dot+par("−a")+sup(p.q))+atVals([["a",p.a]]),
 root_frac_a:p=>rt(fr(`${p.c}a${sup(p.pp)}`, pw("a",p.q)))+atVals([["a",p.a]]),
 root_invc:p=>rt(fr(1,p.c)+" · "+`x${sup(p.pp)}y${sup(p.q)}`)+atVals([["x",p.x],["y",p.y]]),
 root_xy_frac:p=>rt(fr(`${p.c}x${sup(p.pp)}`, pw("y",p.q)))+atVals([["x",p.x],["y",p.y]]),
 fold_square:p=>{
   const A=Math.round(Math.sqrt(p.A)), B=Math.round(Math.sqrt(p.B));
   const t1=(A===1?"":A*A)+"a<sup>2</sup>", t3=(B===1?"":B*B)+"b<sup>2</sup>";
   const t2=(p.K<0?" − ":" + ")+Math.abs(p.K)+"ab";
   return rt(t1+t2+" + "+t3)+atVals([["a",Fr(p.an,p.ad)],["b",Fr(p.bn,p.bd)]]);
 },
 sci:p=>par(`${p.c} · ${pw(10,p.pp)}`)+sup(p.q)+dot+par(`${p.d} · ${pw(10,p.r)}`),
};
function renderTask(t){return M('<span class="big">'+R[t.type](t.p)+'</span>')}
/* rootfrac1 hack above is ugly — переопределим начисто */
R.rootfrac1=p=>fr(rt(`${p.c1}a${sup(p.p)}`)+dot+rt(`${p.c2}b${sup(p.q)}`), rt("ab"))+atVals([["a",p.a],["b",p.b]]);
</script>
<script>
"use strict";
/* ================= построители шагов =================
   Шаг: {q: html-вопрос, ins:[{lbl, val:Fr}], hint: html, show: html}
   Последний шаг — итоговый ответ задачи (одно поле).            */
const I=(val,lbl="")=>({lbl,val:(typeof val==="object"&&val.n!==undefined)?val:Fr(val)});
const S=(q,ins,hint,show,traps)=>({q,ins,hint,show,traps:(traps||[]).filter(Boolean)});   // false — ловушка к задаче не относится
const isq=x=>{const r=isqrtB(BigInt(x));return r===null?null:Number(r)};
/* ================= ловушки (спецификация 03D, решение D7) =================
   Ловушка ступени {i, v, m}: число в поле i, которое получается при типичной
   ошибке, и сообщение про эту ступень. Последняя ступень — итоговый ответ:
   её ловушки служат и Марафону, и зачёту. Значения — из параметров задачи,
   сравнение точное. */
const TP=(i,v,m)=>({i,v:(typeof v==="object"&&v.n!==undefined)?v:Fr(v),m});
const TM={
  addNotMul:"При умножении степеней с одинаковым основанием показатели складываются, а не перемножаются.",
  mulNotAdd:"Степень в степени: показатели перемножаются, а не складываются.",
  sub:"При делении степеней с одинаковым основанием показатели вычитаются: из показателя делимого вычти показатель делителя.",
  subNeg:"При делении степеней с одинаковым основанием показатели вычитаются: из показателя делимого вычти показатель делителя. Вычесть отрицательное — значит прибавить.",
  signLost:"Потерян минус у показателя: считай со знаком.",
  recip:"Знак показателя перепутан — получилось обратное число. Помни: a⁻ⁿ = 1/aⁿ.",
  baseTimesExp:"Степень — не произведение основания на показатель: aⁿ = a · a · … · a (n множителей).",
  basesAdd:"Основания разные — показатели складывать нельзя: aᵐ · bⁿ ≠ (ab)ᵐ⁺ⁿ. Посчитай степени по отдельности и перемножь.",
  recipSign:"1/aⁿ = a⁻ⁿ: когда степень переходит из знаменателя, знак показателя меняется.",
  cTimesQ:"cⁿ — это c, умноженное само на себя n раз, а не c · n.",
  commaWay:"Запятая сдвинута не в ту сторону: при отрицательном показателе десятки число уменьшается, при положительном — растёт.",
  bracketSign:(K)=>"Знак в скобке — как у среднего члена: "+(K<0?"минус":"плюс")+" перед ab даёт "+(K<0?"минус":"плюс")+" в скобке.",
  absNeeded:"Корень из квадрата — это модуль: √(x²) = |x|, ответ не бывает отрицательным.",
  rootOfSum:"Корень из суммы нельзя извлекать по слагаемым: √(x² + y²) ≠ x + y. Сначала сверни выражение под корнем в квадрат скобки.",
};
/* ловушка, совпавшая с верным числом поля, снимается (ошибочный путь даёт
   верное число — диагностировать нечего); две на одном числе поля дают одно
   сообщение «найди свою» (решения F1/Q2). trapDropped и trapMerged — сколько
   снято и сколько чисел пришлось объединить (гейт печатает доли) */
function cleanTraps(s){
  const out=[], n0=(s.traps||[]).length;
  (s.traps||[]).forEach(t=>{
    if(!s.ins[t.i]||feq(t.v,s.ins[t.i].val))return;
    const same=out.find(o=>o.i===t.i&&feq(o.v,t.v));
    if(same){ if(same.ms.indexOf(t.m)<0)same.ms.push(t.m); return; }
    out.push({i:t.i,v:t.v,ms:[t.m]});
  });
  s.traps=out.map(o=>({i:o.i,v:o.v,m:o.ms.length===1?o.ms[0]:o.ms.length===2
    ?"Такой ответ получается при одной из двух ошибок — найди свою: • "+o.ms.map(x=>x.replace(/\.$/,"")).join("; • ")+"."
    :"Такой ответ получается при нескольких разных ошибках — сверь по шагам каждое действие со степенями."}));
  s.trapMerged=out.filter(o=>o.ms.length>1).length;
  s.trapDropped=n0-out.reduce((k,o)=>k+o.ms.length,0);
  return s;
}
/* «вычесть отрицательное» — только когда вычитаемое и правда отрицательное */
const subM=x=>x<0?TM.subNeg:TM.sub;
/* ловушки итогового ответа задачи — ловушки последней ступени */
function finalTraps(t){ const st=buildSteps(t); return st[st.length-1].traps; }

function buildSteps(t){
  const p=t.p, ty=t.type, st=[];
  const V=(x)=>fmtFr(typeof x==="object"?x:Fr(x));
  switch(ty){
  case "rootpow":{
    if(p.n%2===0){
      const h=p.n/2, v=fpow(Fr(p.b),h);
      st.push(S(`Корень — это «степень пополам»: ${M(rt(pw(p.b,p.n))+" = "+pw(p.b,"?"))}. Какой будет показатель?`,
        [I(h,"показатель")],
        `Проверь себя: ${M(par(pw(p.b,h))+"<sup>2</sup>")} = ${M(pw(p.b,p.n))} — показатели при возведении перемножаются.`,
        `${M(rt(pw(p.b,p.n))+" = "+pw(p.b,h))} — показатель ${p.n} делим пополам: ${h}.`));
      st.push(S(`Осталось вычислить: ${M(pw(p.b,h))} = ?`,[I(v,"ответ")],
        `${M(pw(p.b,h))} — это ${p.b}, умноженное само на себя ${h} раз${h>4?"":""}.`,
        `${M(pw(p.b,h)+" = "+V(v))}.`));
    }else{
      const r=isq(p.b), n2=2*p.n, v=fpow(Fr(r),p.n);
      st.push(S(`Показатель ${p.n} — нечётный, пополам не делится. Но основание — полный квадрат! ${p.b} = ?<sup>2</sup>`,
        [I(r,"основание")],
        `Найди в таблице квадратов (вкладка «Справочник»): какое число в квадрате даёт ${p.b}?`,
        `${p.b} = ${M(pw(r,2))}, значит ${M(pw(p.b,p.n)+" = "+par(pw(r,2))+sup(p.n)+" = "+pw(r,n2))}.`));
      st.push(S(`Теперь под корнем ${M(pw(r,n2))}. Показатели при «степени в степени» перемножаются: 2 · ${p.n} = ${n2}. Извлекаем корень — показатель пополам: ${M(rt(pw(r,n2))+" = "+pw(r,"?"))}`,
        [I(p.n,"показатель")],
        `${n2} : 2 = ?`,
        `${M(rt(pw(r,n2))+" = "+pw(r,p.n))}.`));
      st.push(S(`Вычисли: ${M(pw(r,p.n))} = ?`,[I(v,"ответ")],
        `Перемножай по одному: ${r}, ${r*r}, …`,
        `${M(pw(r,p.n)+" = "+V(v))}.`));
    }
    break;}
  case "rootmono":{
    const r=isq(p.c), e1=p.p/2, e2=p.q/2;
    const v=fmul(Fr(r),fmul(fpow(Fr(p.x),e1),fpow(Fr(p.y),e2)));
    st.push(S(`Корень из произведения — произведение корней: извлекаем из каждого множителя отдельно. ${M(rt(p.c))} = ?`,
      [I(r,"")],`Таблица квадратов в помощь: ?² = ${p.c}.`,`${M(rt(p.c)+" = "+r)}.`));
    st.push(S(`У букв показатели делятся пополам: ${M(rt("x"+sup(p.p))+" = x<sup>?</sup>")} и ${M(rt("y"+sup(p.q))+" = y<sup>?</sup>")}`,
      [I(e1,"показатель x"),I(e2,"показатель y")],
      `√(x<sup>n</sup>) = x<sup>n/2</sup> при x ≥ 0.`,
      `Получилось ${M(r+"x"+sup(e1)+"y"+sup(e2))}.`));
    st.push(S(`Подставь x = ${p.x}, y = ${p.y}: ${M(r+" · "+pw(p.x,e1)+" · "+pw(p.y,e2))} = ?`,
      [I(v,"ответ")],
      `Считай по очереди: ${M(pw(p.x,e1))} = ${V(fpow(Fr(p.x),e1))}, ${M(pw(p.y,e2))} = ${V(fpow(Fr(p.y),e2))}, потом перемножь всё.`,
      `${V(v)}.`));
    break;}
  case "rootfrac1": case "rootfrac2":{
    const r0=ty==="rootfrac1"?1:p.r, s0=ty==="rootfrac1"?1:p.s;
    const ea=p.p-r0, eb=p.q-s0, c=p.c1*p.c2, rc=isq(c);
    const v=fmul(Fr(rc),fmul(fpow(Fr(p.a),ea/2),fpow(Fr(p.b),eb/2)));
    st.push(S(`Загони всё под один корень: ${M(rt(`${p.c1}·${p.c2}·`+fr("a"+sup(p.p)+"b"+sup(p.q),"a"+sup(r0)+"b"+sup(s0))))}. При делении показатели вычитаются. Показатель a = ? Показатель b = ?`,
      [I(ea,"a"),I(eb,"b")],
      `a: ${p.p} − ${r0}; b: ${p.q} − ${s0}.`,
      `Под корнем: ${M(`${c}·a${sup(ea)}b${sup(eb)}`)}.`));
    st.push(S(`Число под корнем: ${p.c1} · ${p.c2} = ${c}. ${M(rt(c))} = ?`,
      [I(rc,"")],`?² = ${c} — смотри таблицу квадратов.`,`${M(rt(c)+" = "+rc)}.`));
    st.push(S(`Извлеки корень (показатели пополам) и подставь a = ${p.a}, b = ${p.b}: ${M(rc+(ea?" · "+pw(p.a,ea/2):"")+(eb?" · "+pw(p.b,eb/2):""))} = ?`,
      [I(v,"ответ")],
      `${ea?`${M(pw(p.a,ea/2))} = ${V(fpow(Fr(p.a),ea/2))}. `:""}${eb?`${M(pw(p.b,eb/2))} = ${V(fpow(Fr(p.b),eb/2))}.`:""}`,
      `${V(v)}.`));
    break;}
  case "sq_over_d": case "d_over_sq":{
    const sq=p.k*p.k*p.m;
    const v=ty==="sq_over_d"?Fr(sq,p.d):Fr(p.d,sq);
    st.push(S(`Квадрат убирает корень: ${M(par(p.k+rt(p.m))+"<sup>2</sup> = "+pw(p.k,2)+" · "+par(rt(p.m))+"<sup>2</sup>")} = ${p.k*p.k} · ${p.m} = ?`,
      [I(sq,"")],
      `${M(par(rt(p.m))+"<sup>2</sup>")} = ${p.m} — корень и квадрат взаимно уничтожаются.`,
      `${M(par(p.k+rt(p.m))+"<sup>2</sup>")} = ${sq}.`));
    st.push(S(`Осталась обычная дробь: ${M(ty==="sq_over_d"?fr(sq,p.d):fr(p.d,sq))} = ? ${fint(v)?"":"(запиши десятичной дробью, как в бланке ОГЭ: например 0,5)"}`,
      [I(v,"ответ")],
      `Сократи дробь на общий делитель.`,
      `${V(v)}.`));
    break;}
  case "rootmuldiv":{
    const u=(p.m*p.n)/p.d, v=isq(u);
    st.push(S(`Всё под один корень: ${M(rt(fr(p.m+" · "+p.n,p.d)))}. Сократи и посчитай число под корнем: ${M(fr(p.m+" · "+p.n,p.d))} = ?`,
      [I(u,"")],
      `Не перемножай в лоб! Сначала сократи: например, ${p.d} раскладывается на множители, которые есть в ${p.m} и ${p.n}.`,
      `${M(fr(p.m+" · "+p.n,p.d)+" = "+u)}.`));
    st.push(S(`${M(rt(u))} = ?`,[I(v,"ответ")],`?² = ${u}.`,`${V(Fr(v))}.`));
    break;}
  case "rootprod3":{
    const k=p.k1*p.k2, P=p.m1*p.m2*p.m3, r=isq(P), v=k*r;
    st.push(S(`Числа перед корнями перемножаются отдельно: ${p.k1} · ${p.k2} = ?`,[I(k,"")],
      `Множители можно переставлять: ${M(p.k1+" · "+p.k2+" · "+rt(p.m1)+" · "+rt(p.m2)+" · "+rt(p.m3))}.`,
      `Перед корнем: ${k}.`));
    st.push(S(`Корни — под один корень: ${p.m1} · ${p.m2} · ${p.m3} = ?`,[I(P,"")],
      `Перемножай постепенно: ${p.m1} · ${p.m2} = ${p.m1*p.m2}, потом на ${p.m3}.`,
      `Под корнем: ${P}.`));
    st.push(S(`${M(rt(P))} = ?`,[I(r,"")],`Подбери: ?² = ${P}.`,`${M(rt(P))} = ${r}.`));
    st.push(S(`Итог: ${k} · ${r} = ?`,[I(v,"ответ")],``,`${V(Fr(v))}.`));
    break;}
  case "rootprod2":{

<script>
"use strict";
/* ================= Контракт прогресса курса ОГЭ =================
   docs/OGE_PROGRESS_CONTRACT.md, разделы 3–5: ядро записи, журнал ошибок,
   режим повтора. Тела функций — как в контракте; обёрнуты в CP, чтобы не
   столкнуться с именами тренажёра. Пишется только своя ветка all[TID] и
   свои записи журнала, после свежего чтения ключа — две вкладки не
   затирают друг друга. В ?selftest=1 ничего не пишется. Тип журнала —
   группа задачи (GROUPS[].k). Своего старого ключа не было — миграции нет. */
const TID="oge-t8-stepeni";
const TYPE_IDS=["rootdeg","letters","sqroot","prod","dsq","sqsum","fold","pow1","pow2","sci"];
const QUIZ_TOTAL=10;   // размер зачёта: по задаче из каждой группы
const PASS_AT=8;       // зачёт сдан при 8 из 10
const CP=(function(){
  var KEY="mathExamCourseProgress.v1";
  var RO=/[?&]selftest=1/.test(location.search||"");
  function isObj(o){ return !!o && typeof o === "object" && !Array.isArray(o); }
  function num(v){ return (typeof v === "number" && isFinite(v) && v > 0) ? Math.floor(v) : 0; }
  function readAll(){
    if (window.OgeCourseSharedMode) return {};
    try { var o = JSON.parse(localStorage.getItem(KEY) || "{}"); return isObj(o) ? o : {}; }
    catch (e) { return {}; }
  }
  /* меняет только свою ветку: читает ключ заново прямо перед записью */
  function saveRec(fn){
    if (RO || window.OgeCourseSharedMode) return;
    try {
      var all = readAll();
      var rec = isObj(all[TID]) ? all[TID] : {};
      if (!isObj(rec.solvedByType)) rec.solvedByType = {};
      rec.v = 1;
      fn(rec);
      rec.updatedAt = Date.now();
      all[TID] = rec;
      localStorage.setItem(KEY, JSON.stringify(all));
    } catch (e) {}
  }
  function solvedOne(type){ saveRec(function(rec){ rec.solvedByType[type] = num(rec.solvedByType[type]) + 1; }); }
  function finishQuiz(score, total){
    saveRec(function(rec){
      rec.runs = num(rec.runs) + 1;
      rec.total = total;
      if (score > num(rec.best)) rec.best = score;
      if (score >= PASS_AT) rec.passed = true;
    });
  }
  /* журнал: промах открывает тип, три верных подряд закрывают;
     верный ответ по типу без промахов записи не заводит */
  function mlog(type, ok){
    if (RO || window.OgeCourseSharedMode) return;
    try {
      var all = readAll();
      var key = TID + "|" + type;
      if (ok && !(isObj(all.mistakes) && isObj(all.mistakes[key]))) return;
      if (!isObj(all.mistakes)) all.mistakes = {};
      var e = isObj(all.mistakes[key]) ? all.mistakes[key] : (all.mistakes[key] = { w:0, r:0 });
      if (ok) { if (num(e.w)) e.r = num(e.r) + 1; }
      else { e.w = num(e.w) + 1; e.r = 0; e.lastWrong = Date.now(); }
      e.last = Date.now();
      localStorage.setItem(KEY, JSON.stringify(all));
    } catch (err) {}
  }
  /* режим повтора: только открытые типы этого тренажёра */
  function openTypes(){
    var mk = readAll().mistakes, pre = TID + "|", res = [];
    if (!isObj(mk)) return res;
    for (var k in mk) if (Object.prototype.hasOwnProperty.call(mk, k) && k.indexOf(pre) === 0){
      var t = k.slice(pre.length), e = mk[k];
      if (isObj(e) && num(e.w) > 0 && num(e.r) < 3 && TYPE_IDS.indexOf(t) >= 0) res.push(t);
    }
    return res;
  }
  var REVIEW = !window.OgeCourseSharedMode && /[?&]mode=review(&|$)/.test(location.search || "");
  return { RO:RO, REVIEW:REVIEW, isObj:isObj, num:num, readAll:readAll, saveRec:saveRec,
    solvedOne:solvedOne, finishQuiz:finishQuiz, mlog:mlog, openTypes:openTypes };
})();

const score={solved:0,hints:0,shown:0};
function updScore(){
  document.getElementById("scorebar").innerHTML=
   `<span>решено задач: <b>${score.solved}</b></span>
    <span>подсказок: <b>${score.hints}</b></span>

/* ================= движок шагов =================
   mountSteps(container, steps, {onSolved(clean, usedHint), onMiss, onShow, onHint, note})
   Счёт «решено» ведёт вызывающий код (решение D4): одна задача — один счёт,
   повторное открытие лестницы его не накручивает. Промах — только на
   прочитанные числа; пустое поле промахом не считается (решение D1). */
function mountSteps(box, steps, opts={}){
  box.innerHTML="";
  let idx=0, usedShow=false, usedHint=false;
  if(opts.note){ // решение D3: правило сказано до первого нажатия
    const n=document.createElement("p");n.className="ladder-note";
    n.textContent="Подсказки ничего не отнимают. «Показать шаг» открывает результат ступени — после этого задача в счёт решённых не пойдёт (промахом это не считается). Ответ задачи — на последней ступени.";
    box.appendChild(n);
  }
  const wrap=document.createElement("div");wrap.className="steps";box.appendChild(wrap);
  function renderStep(){
    const s=steps[idx];
    const div=document.createElement("div");div.className="step";
    const inputs=s.ins.map((inp,i)=>`
      <label style="display:inline-flex;align-items:center;gap:5px">${inp.lbl?`<span class="small">${inp.lbl}:</span>`:""}
      <input class="ans" data-i="${i}" inputmode="text" autocomplete="off"></label>`).join(" ");
    div.innerHTML=`<div class="q">${s.q}</div>
      <div class="row">${inputs}
        <button class="act ck">Проверить</button>
        ${s.hint?`<button class="act sec hb">Подсказка</button>`:""}
        <button class="act show sb">Показать шаг</button>
        <span class="fb" aria-live="polite"></span></div>
      ${s.hint?`<div class="hint">${s.hint}</div>`:""}`;
    wrap.appendChild(div);
    const fb=div.querySelector(".fb");
    const ins=[...div.querySelectorAll("input.ans")];
    if(ins[0])ins[0].focus({preventScroll:true});
    function finish(shown){
      div.classList.add(shown?"shown":"done");
      div.querySelectorAll("button").forEach(b=>b.disabled=true);
      ins.forEach(x=>x.disabled=true);
      idx++;
      if(idx<steps.length){renderStep();}
      else{
        const fin=document.createElement("div");
        fin.className="step "+(usedShow?"shown":"done");
        fin.innerHTML=usedShow
          ?`<span class="gold-ink">Задача разобрана с показом — в «решено» не идёт. Возьми похожую и реши её без показа!</span>`
          :`<span class="ok-ink">✓ Задача решена${usedHint?" (с подсказкой)":""} — молодец!</span>`;
        wrap.appendChild(fin);
        if(opts.onSolved)opts.onSolved(!usedShow,usedHint);
      }
    }
    div.querySelector(".ck").onclick=()=>{
      const vals=ins.map(inp=>parseAns(inp.value));
      if(vals.some(v=>!v)){ // не промах: число не прочитано
        fb.textContent="Впиши число в каждое поле: целое, десятичную дробь (0,5) или обыкновенную (1/4).";fb.className="fb no";return;}
      let allOk=true, trap="";
      vals.forEach((v,i)=>{
        const ok=feq(v,s.ins[i].val);
        ins[i].classList.toggle("ok",ok);ins[i].classList.toggle("no",!ok);
        if(!ok){allOk=false; if(!trap){const t=(s.traps||[]).find(t=>t.i===i&&feq(t.v,v)); if(t)trap=t.m;}}
      });
      if(allOk){fb.textContent="верно ✓";fb.className="fb ok";finish(false);}
      else{fb.textContent=trap||("Пока не сходится — перепроверь вычисление"+(s.hint?" или открой «Подсказку»":"")+".");fb.className="fb no";
        if(opts.onMiss)opts.onMiss();}
    };
    const hb=div.querySelector(".hb");
    if(hb)hb.onclick=()=>{div.querySelector(".hint").classList.add("on");
      if(!usedHint){usedHint=true;score.hints++;updScore();}
      if(opts.onHint)opts.onHint();};
    div.querySelector(".sb").onclick=()=>{
      ins.forEach((inp,i)=>{inp.value=fmtFr(s.ins[i].val);inp.classList.add("ok");});
      fb.textContent="— шаг показан";fb.className="fb shown";
      if(s.show){const d2=document.createElement("div");d2.className="hint on";d2.innerHTML=s.show;div.appendChild(d2);}
      usedShow=true;score.shown++;updScore();
      if(opts.onShow)opts.onShow();
      finish(true);
    };
    ins.forEach(inp=>inp.addEventListener("keydown",e=>{if(e.key==="Enter")div.querySelector(".ck").click();}));
  }
  renderStep();
}

function chipsFor(gkeys){
  return gkeys.map(k=>{const g=grpByK[k];
    return `<button type="button" class="pill" onclick="gotoMarathon('${k}')" title="открыть эти задачи в марафоне">${g.nums} · ${g.name}</button>`;
  }).join("");
}
function refRow(formulaHtml, learnAnchor, gkeys, note=""){
  return `<div class="refrow">
    <div class="formula">${M('<span class="big">'+formulaHtml+'</span>')}${note?`<div class="refnote">${note}</div>`:""}</div>
    <div class="links">
      <span class="lbl">разобраться:</span><button type="button" class="pill" onclick="gotoLearn('${learnAnchor}')">📖 объяснение</button>
      <span class="lbl">где встречается:</span>${chipsFor(gkeys)}
    </div></div>`;
}
function buildRef(){
  const v=document.getElementById("view-ref");
  let sq="";
  {// таблица квадратов
    let head=`<tr><th></th>`;for(let u=0;u<10;u++)head+=`<th>${u}</th>`;head+="</tr>";
    let rows="";
    for(let d=1;d<=9;d++){
      rows+=`<tr><th>${d}</th>`;
      for(let u=0;u<10;u++){const n=d*10+u;rows+=`<td data-n="${n}" onclick="sqCell(${n})">${n*n}</td>`;}
      rows+="</tr>";
    }
    sq=`<table class="sq"><tr><th rowspan="2">Десятки</th><th colspan="10">Единицы</th></tr>${head}${rows}</table>`;
  }
  v.innerHTML=`
  <div class="card">
    <h2>Как устроен этот лист</h2>
    <p>Это — те строчки из официального справочного материала ОГЭ, которые кормят <b>задание 8</b>. Такой же лист будет лежать перед тобой на экзамене. Рядом с каждой формулой — кнопки: <span class="pill ghost">📖 объяснение</span> ведёт к понятному разбору, а кнопки с номерами открывают в марафоне именно те задачи, где формула работает.</p>
  </div>
  <div class="refwrap">
    <div class="refhead">Свойства арифметического квадратного корня</div>
    ${refRow(rt("ab")+" = "+rt("a")+" · "+rt("b"),"p4",["prod","letters","sqroot"],"при a ≥ 0, b ≥ 0")}
    ${refRow(rt(fr("a","b"))+" = "+fr(rt("a"),rt("b")),"p4",["prod","letters"],"при a ≥ 0, b > 0")}
    ${refRow(par(rt("a"))+"<sup>2</sup> = a","p5",["sqroot","dsq","sqsum"],"при a ≥ 0; этой строчки нет на листе — но это само определение корня")}
    <div class="refhead">Свойства степени (a > 0, b > 0)</div>
    ${refRow("a<sup>−n</sup> = "+fr(1,"a<sup>n</sup>"),"p1",["pow1"])}
    ${refRow("a<sup>n</sup> · a<sup>m</sup> = a<sup>n+m</sup>","p2",["pow1"])}
    ${refRow(fr("a<sup>n</sup>","a<sup>m</sup>")+" = a<sup>n−m</sup>","p2",["pow1","pow2"])}
    ${refRow(par("a<sup>n</sup>")+"<sup>m</sup> = a<sup>nm</sup>","p2",["pow1","sci"])}
    ${refRow(par("ab")+"<sup>n</sup> = a<sup>n</sup>b<sup>n</sup>","p2",["pow2","sci"])}
    ${refRow(par(fr("a","b"))+"<sup>n</sup> = "+fr("a<sup>n</sup>","b<sup>n</sup>"),"p2",["pow1"])}
    <div class="refhead">Формулы сокращённого умножения</div>
    ${refRow(par("a + b")+"<sup>2</sup> = a<sup>2</sup> + 2ab + b<sup>2</sup>","p5",["sqsum","fold"])}
    ${refRow(par("a − b")+"<sup>2</sup> = a<sup>2</sup> − 2ab + b<sup>2</sup>","p5",["sqsum","fold"])}
    ${refRow("a<sup>2</sup> − b<sup>2</sup> = "+par("a − b")+par("a + b"),"p5",["dsq"])}
    <div class="refhead">Таблица квадратов двузначных чисел</div>
    <div class="sqtool">
      Твой лучший друг на экзамене. Проверь: введи число — найдём его в таблице и узнаем корень.
      <div style="margin:6px 0"><input class="ans" id="sqFind" style="width:130px" placeholder="напр. 2116">
      <button class="act" onclick="sqSearch()">Найти корень</button> <span class="fb" id="sqFb"></span></div>
      ${sq}
      <div class="hintbox">Клик по клетке подсветит её: строка — десятки, столбец — единицы. Например, 46² = 2116, значит ${M(rt(2116)+" = 46")}.</div>
    </div>
  </div>
  <div class="card">
    <h3>С чего начать</h3>
    <p>Если тема новая — иди во вкладку <button type="button" class="crosslink" onclick="showView('learn')">📖 Учимся</button>: там всё по пунктам и с тренажёрчиками. Если хочешь набить руку — <button type="button" class="crosslink" onclick="showView('step')">🪜 Пошагово</button> генерирует задачи бесконечно и проверяет каждый шаг. Готов к бою — <button type="button" class="crosslink" onclick="showView('mar')">🏃 Марафон</button>: 160 задач для подготовки к ОГЭ 2027.</p>
  </div>`;
}
window.sqCell=function(n){
  document.querySelectorAll("table.sq td").forEach(td=>td.classList.toggle("hl",+td.dataset.n===n));
  const fb=document.getElementById("sqFb");
  fb.textContent=`${n}² = ${n*n}, значит √${n*n} = ${n}`;fb.className="fb ok";
};
window.sqSearch=function(){
  const fb=document.getElementById("sqFb");
  const x=parseAns(document.getElementById("sqFind").value);
  document.querySelectorAll("table.sq td.hl").forEach(td=>td.classList.remove("hl"));
  if(!x){fb.textContent="введи целое неотрицательное число";fb.className="fb no";return;}
  if(x.d===0n){fb.textContent="На ноль делить нельзя: такая запись не задаёт число.";fb.className="fb no";return;}
  if(x.n<0n){fb.textContent="В действительных числах корень из отрицательного числа не определён: квадрат любого действительного числа неотрицателен.";fb.className="fb no";return;}
  if(!fint(x)){fb.textContent="Поиск по таблице принимает целые неотрицательные числа. Корни из положительных дробей тоже существуют.";fb.className="fb no";return;}
  const r=isqrtB(x.n);
  if(r!==null&&r>=10n&&r<=99n){sqCell(Number(r));}
  else if(r!==null){fb.textContent=`√${x.n} = ${r} (это вне таблицы, но точный квадрат)`;fb.className="fb ok";
    document.querySelectorAll("table.sq td.hl").forEach(td=>td.classList.remove("hl"));}
  else{fb.textContent=`${x.n} — не точный квадрат, в таблице его нет`;fb.className="fb no";
    document.querySelectorAll("table.sq td.hl").forEach(td=>td.classList.remove("hl"));}
};

<script>
"use strict";

function buildLearn(){
  const v=document.getElementById("view-learn");
  v.innerHTML=`
  <div class="card" id="p1">
    <h2><span class="num">1</span>Степень. И что значит «минус» в показателе</h2>
    <p>${M("a<sup>n</sup>")} — это a, умноженное само на себя n раз: ${M("2<sup>4</sup> = 2 · 2 · 2 · 2 = 16")}.</p>
    <p>А теперь фокус. Спустись по лесенке степеней и следи, что происходит с числом:</p>
    <div class="tool"><div class="tl">лесенка степеней · каждый шаг вниз — деление на основание</div>
      <div class="ladder" id="ladder"></div>
      <div style="margin-top:8px">

        <button type="button" class="pill" onclick="ladderBase(2)">2</button><button type="button" class="pill" onclick="ladderBase(3)">3</button><button type="button" class="pill" onclick="ladderBase(5)">5</button>

      <div class="hintbox" id="ladderNote"></div>
    </div>
    <p>Вот и весь секрет: <b>отрицательная степень — это «перевернуть»</b>: ${M("a<sup>−n</sup> = "+fr(1,"a<sup>n</sup>"))}. И наоборот: ${M(fr(1,"a<sup>−n</sup>")+" = a<sup>n</sup>")} — минус выпрыгивает из знаменателя, меняя знак. Это спасает в задачах <button type="button" class="crosslink" onclick="gotoMarathon('pow1')">№15–17 и 23</button>.</p>

  <div class="card" id="p2">

    <div class="tool"><div class="tl">разворачивалка · правило превращается в честное умножение</div>
      <div class="quiz-choice" id="ruleBtns"></div>
      <div id="ruleShow" style="min-height:60px"></div>
    </div>
    <p>Рабочая тройка для задания 8:</p>
    <table class="seen-tbl">
      <tr><th>что делаешь</th><th>что с показателями</th><th>пример</th></tr>
      <tr><td>умножаешь степени</td><td>складываются</td><td>${M("2<sup>−7</sup> · 2<sup>17</sup> = 2<sup>10</sup>")}</td></tr>
      <tr><td>делишь степени</td><td>вычитаются</td><td>${M(fr("2<sup>10</sup>","2<sup>8</sup>")+" = 2<sup>2</sup> = 4")}</td></tr>
      <tr><td>степень в степени</td><td>перемножаются</td><td>${M(par("2<sup>3</sup>")+"<sup>−7</sup> = 2<sup>−21</sup>")}</td></tr>
    </table>
    <p>И ещё одно, для задач с <button type="button" class="crosslink" onclick="gotoMarathon('pow2')">двумя основаниями (№18–19)</button>: ${M(par("ab")+"<sup>n</sup> = a<sup>n</sup>b<sup>n</sup>")} — показатель раздаётся каждому множителю. Увидел ${M("44<sup>8</sup>")} под дробью, где сверху четвёрки и одиннадцатые? Разбей: ${M("44<sup>8</sup> = 4<sup>8</sup> · 11<sup>8</sup>")} — и сокращай.</p>
  </div>

  <div class="card" id="p3">
    <h2><span class="num">3</span>Корень из степени: показатель — пополам</h2>
    <p>${M(rt("a<sup>n</sup>")+" = a<sup>n/2</sup>")} (при a ≥ 0 и натуральном n). Почему? Потому что квадрат и корень — взаимно обратные: ${M(par("a<sup>3</sup>")+"<sup>2</sup> = a<sup>6</sup>")}, значит ${M(rt("a<sup>6</sup>")+" = a<sup>3</sup>")}.</p>
    <p class="note">Если знак буквы неизвестен, помни: ${M(rt("x<sup>2</sup>")+" = |x|")}. Например, ${M(rt("(−3)<sup>2</sup>")+" = "+rt(9)+" = 3")}, а не −3. Условие a ≥ 0 позволяет обойтись без модуля.</p>
    <div class="tool"><div class="tl">проверь идею · введи показатель — увидишь результат</div>
      ${M(rt("5<sup>n</sup>"))} где n = <input class="ans" id="halfIn" style="width:70px" value="6">
      <button class="act" onclick="halfGo()">извлечь корень</button>
      <div class="hintbox" id="halfOut"></div>
    </div>
    <h3>Случай 1: показатель чётный</h3>
    <p>Просто дели пополам: ${M(rt("4<sup>6</sup>")+" = 4<sup>3</sup> = 64")}. Это задачи <button type="button" class="crosslink" onclick="gotoMarathon('rootdeg')">№1</button>.</p>
    <h3>Случай 2: показатель нечётный</h3>
    <p>Пополам не делится… но посмотри на <b>основание</b>: в задачах №2 нашего банка оно является полным квадратом. ${M(rt("4<sup>3</sup>"))}: замени 4 = 2², получится ${M(rt(par("2<sup>2</sup>")+"<sup>3</sup>")+" = "+rt("2<sup>6</sup>")+" = 2<sup>3</sup> = 8")}. Это задачи <button type="button" class="crosslink" onclick="gotoMarathon('rootdeg')">№2</button>.</p>
    <h3>Случай 3: под корнем буквы</h3>
    <p>То же правило работает с каждой буквой отдельно: ${M(rt("49x<sup>8</sup>y<sup>4</sup>")+" = 7x<sup>4</sup>y<sup>2</sup>")} — корень из числа по таблице квадратов, показатели букв пополам. Потом подставляй значения. Это <button type="button" class="crosslink" onclick="gotoMarathon('letters')">№3–5 и 26–29</button>.</p>
    <div class="note">Если встретил ${M(par("−a")+"<sup>4</sup>")} — чётная степень съедает минус: ${M(par("−a")+"<sup>4</sup> = a<sup>4</sup>")}. Задачи №26 только этим и пугают.</div>
  </div>

  <div class="card" id="p4">
    <h2><span class="num">4</span>Корни: под один корень и обратно</h2>
    <p>Главное свойство: ${M(rt("a")+" · "+rt("b")+" = "+rt("ab"))} при a ≥ 0 и b ≥ 0. Работает в обе стороны. Для дроби ${M(fr(rt("a"),rt("b"))+" = "+rt(fr("a","b")))} при a ≥ 0 и b &gt; 0.</p>
    <div class="note"><b>Почему нужны условия?</b> В действительных числах квадрат не бывает отрицательным, поэтому ${M(rt("−1"))} не определён. Хотя ${M(rt("(−1) · (−1)")+" = 1")}, выражение ${M(rt("−1")+" · "+rt("−1"))} не имеет значения. Сначала проверь каждый корень, затем объединяй.</div>
    <p><b>А если ноль?</b> ${M(rt(0)+" · "+rt(4)+" = 0")} и ${M(fr(rt(0),rt(4))+" = 0")} допустимы. Но ${M(fr(rt(4),rt(0)))} и ${M(fr(rt(0),rt(0)))} не определены: ${M(rt(0)+" = 0")}, а на ноль делить нельзя. Поэтому в знаменателе нужно b &gt; 0.</p>
    <p><b>Зачем:</b> по отдельности ${M(rt(21))} и ${M(rt(14))} — страшные бесконечные дроби. А вместе: ${M(fr(rt(21)+" · "+rt(14),rt(6))+" = "+rt(fr("21 · 14","6"))+" = "+rt(49)+" = 7")}. Некрасивое стало красивым.</p>
    <div class="tool"><div class="tl">объединялка · два корня — под один</div>

      <div class="hintbox" id="unOut" aria-live="polite"></div>
    </div>
    <p><b>Совет из практики:</b> не перемножай числа в лоб. Сначала сократи с знаменателем, раскладывая на множители: ${M(fr("21 · 14","6"))} = ${M(fr("3 · 7 · 2 · 7","2 · 3"))} = 49. Оба пути дают одно и то же — иди тем, который видишь.</p>
    <p>Так решаются <button type="button" class="crosslink" onclick="gotoMarathon('prod')">№8–10, 13–14</button>.</p>
  </div>

  <div class="card" id="p5">
    <h2><span class="num">5</span>Формулы сокращённого умножения + корни</h2>

  </div>

  <div class="card" id="p6">

      <tr><td>${M(rt("…")+" · "+rt("…"))}, дробь из корней</td><td>всё под один корень, сократить</td><td><button type="button" class="crosslink" onclick="gotoLearn('p4')">п. 4</button></td></tr>
      <tr><td>скобки-близнецы (… − …)(… + …)</td><td>разность квадратов</td><td><button type="button" class="crosslink" onclick="gotoLearn('p5')">п. 5</button></td></tr>
      <tr><td>${M(par("… ± …")+"<sup>2</sup>")} и рядом ещё корень</td><td>раскрыть квадрат — корни сократятся</td><td><button type="button" class="crosslink" onclick="gotoLearn('p5')">п. 5</button></td></tr>
      <tr><td>под корнем a² + …ab + …b²</td><td>свернуть в квадрат, взять модуль</td><td><button type="button" class="crosslink" onclick="gotoLearn('p5')">п. 5</button></td></tr>
      <tr><td>степени с одинаковым основанием</td><td>плюс / минус / умножить показатели</td><td><button type="button" class="crosslink" onclick="gotoLearn('p2')">п. 2</button></td></tr>
      <tr><td>${M("44<sup>8</sup>")}, ${M("63<sup>4</sup>")} — составное основание</td><td>разбить: (ab)ⁿ = aⁿbⁿ</td><td><button type="button" class="crosslink" onclick="gotoLearn('p2')">п. 2</button></td></tr>
      <tr><td>${M("(8 · 10<sup>2</sup>)<sup>2</sup> · …")}</td><td>числа отдельно, десятки отдельно</td><td><button type="button" class="crosslink" onclick="gotoLearn('p2')">п. 2</button></td></tr>
    </table>
  </div>

  <div class="card" id="p7">
    <h2><span class="num">7</span>Квиз: определи приём → реши</h2>

    <div class="tool" id="quizBox"></div>
    <button class="act" onclick="quizNew()">Новая задача</button>
  </div>`;
  ladderBase(2);ruleBtnsInit();fsuNext();quizNew();

let LB=2,LE=3;
window.ladderBase=function(b){LB=b;LE=3;ladderDraw();};
window.ladderMove=function(d){LE=Math.max(-3,Math.min(4,LE+d));ladderDraw();};
function ladderDraw(){
  const box=document.getElementById("ladder");let h="";
  for(let e=4;e>=-3;e--){
    const val=e>=0?fmtFr(fpow(Fr(LB),e)):fr(1,fmtFr(fpow(Fr(LB),-e)));

<script>
"use strict";
/* ================= генераторы для «Пошагово» ================= */
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[ri(0,a.length-1)];
const NONSQ=[2,3,5,6,7,10,11,13,14,15,17,19,21,22,23,26,29,31,33,37,41,43,47];
function maxE(b){return b<3?6:b<4?5:b<6?4:b<10?3:2;}
const GEN={
 pow_mul_div(){const b=pick([2,3,5,7,11]),e=ri(2,maxE(b)),p=-ri(2,9),r=ri(4,12);
   return{type:"pow_mul_div",p:{b,p,q:e+r-p,r}};},
 pow_pow_div(){const b=pick([2,3,5,7,11]),e=ri(2,maxE(b)),pp=ri(2,8),q=-ri(2,5);
   return{type:"pow_pow_div",p:{b,p:pp,q,r:pp*q-e}};},
 pow_mul_pow(){const b=pick([2,3,5,7,11]),e=ri(1,maxE(b)),q=ri(2,7),r=ri(2,4);
   return{type:"pow_mul_pow",p:{b,p:e-q*r,q,r}};},
 pow_over_num(){const b=pick([2,3,4,5]),e=ri(1,maxE(b)),q=ri(2,b===2?6:b===3?4:3);
   return{type:"pow_over_num",p:{b,p:q+e,d:Number(ipow(BigInt(b),q))}};},
 recip_pow(){const b=pick([2,3,5,7]),e=ri(1,maxE(b)),p=-ri(6,14);
   return{type:"recip_pow",p:{b,p,q:-p-e}};},
 pow_var_div(){const a=pick([3,4,5]),e=ri(2,maxE(a)),pp=ri(2,7),q=-ri(2,5);
   return{type:"pow_var_div",p:{pp,q,r:pp*q-e,a}};},
 pow_prodbase_div(){
   for(;;){const [b1,b2]=pick([[4,11],[2,11],[7,10],[3,10],[7,9],[2,7],[3,5],[5,6],[2,13]]);
     const r=ri(4,9),e1=ri(0,2),e2=ri(0,2);

     return{type:"pow_prodbase_div",p:{b1,p:r+e1,b2,q:r+e2,r}};}},
 prodbase_over(){
   for(;;){const [b1,b2]=pick([[3,4],[2,6],[2,10],[2,5],[3,6],[3,7],[2,7]]);
     const pp=ri(4,8),e1=ri(0,2),e2=ri(0,2);

 pow_ab(){const a=pick([3,5,6]),r=pick([2,3]),q=ri(5,9),s=q*r,extra=ri(2,maxE(a));
   return{type:"pow_ab",p:{pp:s+extra,q,r,s,a}};},
 rootmuldiv(){const a=ri(2,9);let x=pick([2,3,5,6,7]),y=pick([2,3,5,7]);
   if(x===y)y=y===7?5:y+1;
   return{type:"rootmuldiv",p:{m:a*x,n:a*y,d:x*y}};},
 rootprod3(){const k1=ri(2,7),k2=ri(2,6),u=pick([2,3,5,6,7,10,11,13,15]),v=pick([2,3]);
   return u===v?GEN.rootprod3():{type:"rootprod3",p:{k1,m1:u,k2,m2:v,m3:u*v}};},
 rootprod2(){const s=pick([2,3,5,7,11]),t=pick([2,5]),a=ri(2,3);

 distrib(){const B=pick([2,3,5]),c=ri(2,5);
   return{type:"distrib",p:{A:B*c*c,B,sign:pick([-1,1])}};},
 sq_over_d(){const k=ri(2,4),m=pick([2,3,5,10]),sq=k*k*m;
   if(Math.random()<0.5){const mult=pick([2,4,5,10]);return{type:"sq_over_d",p:{k,m,d:sq*mult}};}

 d_over_sq(){const k=ri(2,4),m=pick([2,3,5,10]),mult=ri(2,12);

 diffsq_int(){for(;;){const a=ri(5,90),b=ri(2,8);

 diffsq_root(){const a=pick(NONSQ.filter(x=>x>4)),b=pick(NONSQ.filter(x=>x<a));
   return{type:"diffsq_root",p:{a,b}};},
 sqsum(){return{type:"sqsum",p:{m:pick(NONSQ.filter(x=>x<31)),k:ri(2,9),sign:pick([-1,1])}};},
 rootpow(){
   if(Math.random()<0.5){const b=ri(2,9),n=pick(b<4?[4,6,8]:[4,6]);
     if(Math.pow(b,n/2)>100000)return GEN.rootpow();

 rootmono(){for(;;){const c=pick([4,9,16,25,36,49]),pp=pick([2,4]),q=pick([2,4,6]),x=ri(2,7),y=ri(2,7);

 root_frac_a(){const c=pick([4,9,16,25]),a=pick([2,3,5]),diff=a>3?pick([2,4]):pick([2,4,6]),q=ri(6,12);

 root_xy_frac(){for(;;){const c=pick([4,9,16,25,36]),pp=pick([2,4]),q=pick([2,4]),x=ri(2,12),y=ri(2,5);

 root_neg(){for(;;){const a=ri(2,5),pp=pick([2,4,6]),q=pick([2,4,6]);

 fold_square(){

};

function selftest8(){

      if(!s.ins.length)errs.push(sj+": нет полей");

        ASTK.traps((s.traps||[]).filter(t=>t.i===i),sj,errs,v=>feq(v,inp.val),feq,fmtFr);
      });
      (s.traps||[]).forEach(t=>{ if(!s.ins[t.i])errs.push(sj+": ловушка для несуществующего поля"); ASTK.text(t.m,sj+" ловушка",errs); });
    });
    if(st[st.length-1].ins.length!==1)errs.push(tag+": последняя ступень — не одно поле ответа");
  };

    const tag="банк "+t.id;
    if(!typeGroup[t.type]){ errs.push(tag+": вид без группы"); return; }
    let st; try{ st=buildSteps(t); }catch(e){ errs.push(tag+": "+e.message); return; }
    if(!feq(st[st.length-1].ins[0].val,Fr(t.ans[0],t.ans[1])))errs.push(tag+": ответ банка ≠ последней ступени");
    chkSteps(st,tag); ASTK.text(renderTask(t),tag,errs);
  });

    for(let i=0;i<60;i++){
      const tag=ty+"#"+i; let t, st;
      try{ t=GEN[ty](); st=buildSteps(t); }catch(e){ errs.push(tag+": "+e.message); break; }
      if(t.type!==ty||!typeGroup[t.type])errs.push(tag+": вид "+t.type);
      chkSteps(st,tag); ASTK.text(renderTask(t),tag,errs);
    }

  if(JSON.stringify(GROUPS.map(g=>g.k))!==JSON.stringify(TYPE_IDS))errs.push("TYPE_IDS не совпадают с группами");
  TYPE_IDS.forEach(k=>{ if(!grpByK[k]||!genTypesOf(k).length)errs.push(k+": у группы нет генератора (повтор, зачёт)"); });

/* Общие проверки режима ?selftest=1 тренажёров алгебры курса ОГЭ (задача

   алгебры, где он есть; копии сверяет гейт tools/oge-algebra-contract.test.mjs.
   Каждая проверка дописывает ошибки в массив errs; прогресс ученика не трогается. */
const ASTK={
  /* чертёж: нет NaN/undefined/Infinity, все точки внутри viewBox (допуск tol) */
  svg:function(svg,tag,errs,tol){
    if(tol==null)tol=0.5;
    if(typeof svg!=='string'||svg.indexOf('<svg')<0){errs.push(tag+': нет чертежа');return;}
    if(/NaN|undefined|Infinity/.test(svg))errs.push(tag+': в чертеже NaN/undefined/Infinity');
    const vb=/viewBox="\s*(-?[\d.]+)[\s,]+(-?[\d.]+)[\s,]+(-?[\d.]+)[\s,]+(-?[\d.]+)\s*"/.exec(svg);
    if(!vb){errs.push(tag+': у чертежа нет viewBox');return;}
    const X0=+vb[1]-tol,Y0=+vb[2]-tol,X1=+vb[1]+(+vb[3])+tol,Y1=+vb[2]+(+vb[4])+tol;
    let out=0,first='';
    const at=function(x,y,what){if(!(x>=X0&&x<=X1&&y>=Y0&&y<=Y1)){out++;if(!first)first=what+' ('+Math.round(x)+'; '+Math.round(y)+')';}};
    const num=function(a,n){const m=new RegExp('\\s'+n+'="(-?[\\d.]+(?:e-?\\d+)?)"').exec(a);return m?+m[1]:null;};
    const re=/<(\w+)(\s[^>]*)?>/g;let m;
    while((m=re.exec(svg))){
      const el=m[1],a=m[2]||'';
      if(el==='svg')continue;
      [['x','y'],['x1','y1'],['x2','y2'],['cx','cy']].forEach(function(p){const x=num(a,p[0]),y=num(a,p[1]);if(x!=null&&y!=null)at(x,y,el);});
      if(el==='rect'){const x=num(a,'x')||0,y=num(a,'y')||0,w=num(a,'width'),h=num(a,'height');if(w!=null&&h!=null)at(x+w,y+h,'rect');}
      if(el==='circle'){const x=num(a,'cx'),y=num(a,'cy'),r=num(a,'r');if(x!=null&&y!=null&&r!=null){at(x-r,y,'circle');at(x+r,y,'circle');at(x,y-r,'circle');at(x,y+r,'circle');}}
      const pts=/\spoints="([^"]*)"/.exec(a);
      if(pts){const v=pts[1].trim().split(/[\s,]+/).map(Number);for(let i=0;i+1<v.length;i+=2)at(v[i],v[i+1],el);}
      const d=/\sd="([^"]*)"/.exec(a);
      if(d){/* конечные точки команд пути; относительные — от текущей точки */
        const tok=d[1].match(/[MLHVCSQTAZmlhvcsqtaz]|-?(?:\d+\.?\d*|\.\d+)(?:e-?\d+)?/g)||[];
        const need={M:2,L:2,H:1,V:1,C:6,S:4,Q:4,T:2,A:7,Z:0};
        let cx=0,cy=0,cmd='',i=0;
        while(i<tok.length){
          if(/[a-z]/i.test(tok[i])){cmd=tok[i++];if(/z/i.test(cmd))continue;}
          const n=need[cmd.toUpperCase()],rel=cmd!==cmd.toUpperCase();
          if(!n||i+n>tok.length)break;
          const v=tok.slice(i,i+n).map(Number);i+=n;
          const U=cmd.toUpperCase();
          if(U==='H'){cx=rel?cx+v[0]:v[0];}
          else if(U==='V'){cy=rel?cy+v[0]:v[0];}
          else{const ex=v[n-2],ey=v[n-1];cx=rel?cx+ex:ex;cy=rel?cy+ey:ey;}
          at(cx,cy,'path');
          if(U==='M')cmd=rel?'l':'L';
        }
      }
    }
    if(out)errs.push(tag+': за рамкой viewBox '+out+' точек, первая — '+first);
  },
  /* текст задачи, вариантов и сообщений: нет null, undefined, NaN, Infinity */
  text:function(html,tag,errs){
    const t=String(html).replace(/<[^>]*>/g,' ');
    const m=/\bnull\b|\bundefined\b|\bNaN\b|Infinity|\[object /.exec(t);
    if(m)errs.push(tag+': в тексте «'+m[0].trim()+'»');
  },
  /* ловушки {v, m}: ни одна не принимается как ответ, разные сообщения не ловят
     одно значение; same — равенство значений, show — запись значения в отчёте */
  traps:function(list,tag,errs,isAns,same,show){
    same=same||function(a,b){return a===b;};
    show=show||function(v){return String(v);};
    (list||[]).forEach(function(t,i){
      if(!t||!t.m)errs.push(tag+': ловушка без сообщения');
      if(isAns(t.v))errs.push(tag+': ловушка '+show(t.v)+' совпадает с ответом');

        if(u.m!==t.m&&same(t.v,u.v))errs.push(tag+': две ловушки ловят одно значение '+show(t.v));}
    });
  },
  /* итог в консоль: маркер <ИМЯ>_SELFTEST_OK или _FAIL с числом ошибок */
  done:function(name,errs){
    if(typeof console==='undefined')return;
    if(!errs.length){console.log(name+'_SELFTEST_OK');return;}
    console.log(name+'_SELFTEST_FAIL '+errs.length);
    errs.slice(0,30).forEach(function(e){console.log('  '+e);});
  }
};

Object.assign(extraTopics,{
 segment_lengths:{title:'Середина отрезка и сложение длин',explanation:'Если C лежит на отрезке AB, то AB = AC + CB. Середина делит отрезок на две равные части. Перед сложением или вычитанием длин проверь порядок точек.',passages:[{bookId:'atanasyan2010',section:'п. 6, середина отрезка',printedPage:'11',url:atanPdf+'#page=13'},{bookId:'atanasyan2010',section:'п. 7, длина отрезка',printedPage:'13–14',url:atanPdf+'#page=15'},{bookId:'merzlyak7_2015',section:'§ 2, основное свойство длины и середина отрезка',url:'https://my-uchebnik.ru/book/geometry/5/geometry-00000035.htm#:~:text=Серединой%20отрезка'}]},
 angle_measure:{title:'Сложение и вычитание углов',explanation:'Если луч проходит внутри угла, градусная мера целого угла равна сумме двух частей. Чтобы вычесть часть, сначала укажи, какой луч лежит внутри и какой угол является целым.',passages:[{bookId:'atanasyan2010',section:'п. 9, градусная мера угла',printedPage:'18–19',url:atanPdf+'#page=20'},{bookId:'merzlyak7_2015',section:'§ 3, луч, угол и измерение углов',printedPage:'20',url:'https://pdf3.my-uchebnik.com/pdf/geometry/00000035.pdf#page=21'}]},
 sine_law:{title:'Теорема синусов и длина хорды',explanation:'Стороне a против угла A соответствует равенство a = 2R·sin A. R — радиус окружности, описанной именно около этого треугольника. Для хорды выбери вписанный угол, опирающийся на неё.',passages:[{bookId:'atanasyan2010',section:'п. 97, теорема и замечание о 2R',printedPage:'256–257',url:atanPdf+'#page=258'},{bookId:'merzlyak9_2022',section:'§ 3, лемма о хорде и теорема 3.1 — текст издания',url:merzOriginal+'#:~:text=Теорема%203.1'}]},
 cosine_law:{title:'Теорема косинусов',explanation:'Для стороны a напротив угла A: a² = b² + c² − 2bc·cos A. Проверь, что b и c — стороны, образующие именно угол A.',passages:[{bookId:'atanasyan2010',section:'п. 98',printedPage:'257–258',url:atanPdf+'#page=259'},{bookId:'merzlyak9_2022',section:'§ 2, теорема 2.1 — текст издания',printedPage:'11',url:merzOriginal+'#:~:text=Теорема%202.1'}]},
 trig_sum_identity:{title:'Откуда берётся косинус суммы или разности?',explanation:'Авторский вывод через скалярное произведение. Возьми единичные векторы u = (cos α, sin α), v = (cos β, sin β). Их произведение по углу равно cos(α − β), а по координатам — cos α·cos β + sin α·sin β. Для суммы замени v на (cos β, −sin β): получишь знак минус. Ссылки ниже содержат основания этого вывода.',derived:true,passages:[{bookId:'atanasyan2010',section:'пп. 102–103, скалярное произведение и координаты',printedPage:'264–267',url:atanPdf+'#page=266'},{bookId:'merzlyak9_2022',section:'§ 16, определение и теорема 16.2 — текст издания',url:merzOriginal+'#:~:text=Теорема%2016.2'}]},
 trig_reduction:{title:'Как преобразовать тригонометрическое выражение?',explanation:'Для острого угла sin² α + cos² α = 1 следует из теоремы Пифагора после деления на квадрат гипотенузы. Для произвольного угла это равенство координат единичной окружности. Отражение точки относительно осей объясняет знаки: sin(x − 90°) = −cos x; cos(360° − x) = cos x.',derived:true,passages:[{bookId:'atanasyan2010',section:'пп. 93–94, тригонометрические функции и формулы приведения',printedPage:'252–254',url:atanPdf+'#page=254'},{bookId:'merzlyak9_2022',section:'§ 1, синус, косинус и тангенс угла от 0° до 180° — текст издания',url:merzOriginal}]},
 inscribed_angle_converse:{title:'Когда равенство углов доказывает принадлежность окружности?',explanation:'Точки A и D находятся с одной стороны прямой BC. Если ∠BAC = ∠BDC, то A, B, C, D лежат на одной окружности. Это обратный признак, а не прямое свойство вписанного угла. Его можно вывести, построив окружность через A, B, C и используя теорему о внешнем угле: точка с тем же углом в данной полуплоскости не может лежать внутри или вне этой окружности. Ниже — теоремы, на которых основан этот вывод.',derived:true,parents:['inscribed_angles','circumcircle','triangle_exterior']},

 median_length:{title:'Как получить формулу длины медианы?',explanation:'Пусть AM — медиана, BM = CM = a/2, AB = c, AC = b. Запиши теорему косинусов для ABM и ACM. Углы при M смежные, поэтому слагаемые с косинусами при сложении сократятся: b² + c² = 2AM² + a²/2. Вырази AM².',derived:true,parents:['triangle_parts','cosine_law','adjacent_vertical']},
 bisector_length:{title:'Как обосновать длину биссектрисы?',explanation:'Пусть BE — биссектриса в ABC. Отношение AE:EC = AB:BC получается из отношения площадей ABE и CBE: используй общую высоту к AC и формулу площади через синус угла. Затем запиши теорему косинусов в ABE и CBE и исключи косинусы смежных углов при E. Получится BE² = AB·BC − AE·EC.',derived:true,parents:['angle_bisector','triangle_area','triangle_sine_area','cosine_law']},
 heron_formula:{title:'Формула Герона',explanation:'Обозначь полупериметр p = (a + b + c)/2. Формула S² = p(p − a)(p − b)(p − c) получается из S = ab·sin C/2 и теоремы косинусов: замени sin² C на 1 − cos² C, затем разложи разность квадратов. Это авторская схема вывода из указанных теорем.',derived:true,parents:['triangle_sine_area','cosine_law','trig_reduction']},
 incircle_area:{title:'Площадь через вписанную и вневписанную окружность',explanation:'Для инцентра разбей треугольник на три с общей высотой r к его сторонам: S = r(a + b + c)/2 = rp. Для центра вневписанной окружности против стороны a складывай две площади и вычитай третью: S = rₐ(b + c − a)/2 = rₐ(p − a). Ниже — свойства касательной и формула площади, которые обосновывают вывод.',derived:true,parents:['incircle','tangent','triangle_area']}
});

  }
  const boolState=v=>typeof v==='boolean';
  const stringState=(v,max)=>typeof v==='string'&&v.length<=max&&!/[<>\u0000-\u0008\u000b\u000c\u000e-\u001f]/.test(v);
  const rangeLimits={7:[[-4,4,.25],[-4,4,.25]],8:[[1,4,1],[1,4,1]],10:[],12:[],14:[[1,7,1],[1,4,1],[1,3,1]],20:[[-5,5,1],[-3,3,1]]};
  const selectValues={7:[null],8:['product','power','square'],10:['ten','dice'],12:[null],14:['ap','gp'],20:[null]};
  function sharedCards(scope){return scope?[scope]:Array.from(d.querySelectorAll(routes[number][0]));}
  function controls(card,build=false){
    const lab=card.querySelector('.oca-exploration');
    if(build&&lab)labBuilders.get(lab)?.();
    const ref=card.querySelector('.oca-reference'),work=card.querySelector('.oca-work');
    return {lab,labDetails:lab?Array.from(lab.querySelectorAll('details')):[],ranges:lab?Array.from(lab.querySelectorAll('input[type=range]')):[],
      select:lab?.querySelector('select')||null,marks:lab?Array.from(lab.querySelectorAll('.oca-outcomes button')):[],
      choices:lab?.querySelector('.oca-choices')||null,referenceDetails:ref?Array.from(ref.querySelectorAll('details')):[],
      zoom:ref?Array.from(ref.querySelectorAll('.ocr-zoom')):[],work,textarea:work?.querySelector('textarea')||null,
      checks:work?Array.from(work.querySelectorAll('input[type=checkbox]')):[],fields:work?Array.from(work.querySelectorAll('.oca-table-scroll input')):[],
      workDetails:work?Array.from(work.querySelectorAll(':scope > details:not([hidden])')):[]};
  }
  function getState(scope){
    const list=sharedCards(scope);if(list.length>16)throw new TypeError('Too many shared algebra cards');
    return {version:1,task:number,cards:list.map(card=>{
      enhanceCard(card);const c=controls(card,true);
      return {lab:c.lab?{select:c.select?.value||null,ranges:c.ranges.map(x=>Number(x.value)),
        marks:c.marks.flatMap((x,i)=>x.getAttribute('aria-pressed')==='true'?[i]:[]),
        choice:c.choices?.hasAttribute('data-oca-choice')?Number(c.choices.dataset.ocaChoice):null,details:c.labDetails.map(x=>x.open)}:null,
        reference:{details:c.referenceDetails.map(x=>x.open),zoom:c.zoom.map(x=>x.getAttribute('aria-pressed')==='true')},
        work:c.work?{text:c.textarea.value,checks:c.checks.map(x=>x.checked),fields:c.fields.map(x=>x.value),details:c.workDetails.map(x=>x.open)}:null};
    })};
  }
  function validateState(state,scope){
    const fail=()=>{throw new TypeError('Invalid algebra workspace state');};
    if(!exactState(state,['version','task','cards'])||state.version!==1||state.task!==number||!arrayState(state.cards,16,card=>{
      if(!exactState(card,['lab','reference','work'])||!exactState(card.reference,['details','zoom'])||!arrayState(card.reference.details,40,boolState)||!arrayState(card.reference.zoom,20,boolState))return false;
      if(card.lab!==null){
        const v=card.lab,limits=rangeLimits[number];
        if(!limits||!exactState(v,['select','ranges','marks','choice','details'])||!selectValues[number].includes(v.select)||!arrayState(v.ranges,3,(x,i)=>typeof x==='number'&&Number.isFinite(x)&&!!limits[i]&&x>=limits[i][0]&&x<=limits[i][1]&&Math.abs((x-limits[i][0])/limits[i][2]-Math.round((x-limits[i][0])/limits[i][2]))<1e-8)||v.ranges.length!==limits.length||!arrayState(v.details,8,boolState)||!arrayState(v.marks,36,(x,i)=>Number.isInteger(x)&&x>=0&&x<(v.select==='dice'?36:10)&&(i===0||x>v.marks[i-1]))||!(v.choice===null||number===12&&Number.isInteger(v.choice)&&v.choice>=0&&v.choice<12))return false;
        if(number!==10&&v.marks.length||number!==12&&v.choice!==null)return false;
      }
      if(card.work!==null){const w=card.work;if(number<20||!exactState(w,['text','checks','fields','details'])||!stringState(w.text,6000)||!arrayState(w.checks,3,boolState)||w.checks.length!==3||!arrayState(w.fields,9,x=>stringState(x,200))||w.fields.length!==(number===21?9:0)||!arrayState(w.details,4,boolState))return false;}
      return true;
    }))fail();
    if(scope){
      const list=sharedCards(scope);if(list.length!==state.cards.length)fail();
      list.forEach((card,i)=>{const v=state.cards[i],c=controls(card);
        if(!!c.lab!==(v.lab!==null)||!!c.work!==(v.work!==null)||c.referenceDetails.length!==v.reference.details.length||c.zoom.length!==v.reference.zoom.length)fail();
        if(c.lab&&(c.ranges.length!==v.lab.ranges.length||c.labDetails.length!==v.lab.details.length||(v.lab.choice!==null&&(!c.choices||v.lab.choice>=c.choices.children.length))))fail();
        if(c.work&&(c.workDetails.length!==v.work.details.length||c.checks.length!==v.work.checks.length||c.fields.length!==v.work.fields.length))fail();
      });
    }
    return true;
  }
  function applyState(state,scope){
    validateState(state);const list=sharedCards(scope);
    if(list.length!==state.cards.length)throw new TypeError('Algebra workspace does not match this task');
    list.forEach(card=>{enhanceCard(card);controls(card,true);});
    // Validate the entire destination before changing its first control.
    list.forEach((card,i)=>validateState({version:1,task:number,cards:[state.cards[i]]},card));
    list.forEach((card,i)=>{
      const v=state.cards[i];let c=controls(card);
      if(v.lab){
        if(c.select&&c.select.value!==v.lab.select){c.select.value=v.lab.select;c.select.dispatchEvent(new Event('change',{bubbles:true}));}
        c=controls(card);
        c.ranges.forEach((x,j)=>{x.value=String(v.lab.ranges[j]);x.dispatchEvent(new Event('input',{bubbles:true}));});
        c.marks.forEach((x,j)=>{if((x.getAttribute('aria-pressed')==='true')!==v.lab.marks.includes(j))x.click();});
        if(v.lab.choice!==null)c.choices.children[v.lab.choice].click();
        else if(c.choices){delete c.choices.dataset.ocaChoice;const feedback=c.choices.nextElementSibling;if(feedback?.classList.contains('oca-observation'))feedback.textContent='';}
        c.labDetails.forEach((x,j)=>{x.open=v.lab.details[j];});
      }
      c.referenceDetails.forEach((x,j)=>{x.open=v.reference.details[j];});
      c.zoom.forEach((x,j)=>{if((x.getAttribute('aria-pressed')==='true')!==v.reference.zoom[j])x.click();});
      if(v.work){
        c.textarea.value=v.work.text;c.textarea.dispatchEvent(new Event('input',{bubbles:true}));
        c.checks.forEach((x,j)=>{x.checked=v.work.checks[j];x.dispatchEvent(new Event('change',{bubbles:true}));});
        c.fields.forEach((x,j)=>{x.value=v.work.fields[j];x.dispatchEvent(new Event('input',{bubbles:true}));});
        c.workDetails.forEach((x,j)=>{x.open=v.work.details[j];});
      }
    });
  }
  window.OgeCourseAlgebraShared={enhanceCard,scan,getState,validateState,applyState};
  function schedule(){if(scheduled)return;scheduled=true;setTimeout(scan,0);}
  const observer=new MutationObserver(schedule);observer.observe(d.body,{childList:true,subtree:true,attributes:true,attributeFilter:['class','hidden']});scan();
  d.documentElement.dataset.ogeAlgebraExperience='ready';
})();

</script>
