name: Build the reviewed geometry archive through the regular-polygon constructions in chapter XIII
on:
  push:
    branches: ['work/atanasyan-1189-complete-offline-20261121']
    paths: ['.github/workflows/atanasyan-1189-complete-offline-once.yml']
permissions:
  contents: write
jobs:
  verify-and-create-feature-branch:
    if: github.repository == 'ladynata-cloud/math-exam-fipi' && github.ref == 'refs/heads/work/atanasyan-1189-complete-offline-20261121'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SOURCE_SHA: 2519fbded5a1a4fa7d32e27eef7494320cd225b6
      SOURCE_TREE: 28e1d596ee552614eb05b28cbac7409c00453882
      SOURCE_BRANCH: integration/atanasyan-1189-school-stage-source-20261121
      TARGET_BRANCH: integration/atanasyan-1189-school-stage-offline-20261121
      ZIP_PATH: downloads/trainers/geometry-course/geometry-course-package.zip
      PREVIOUS_BLOB: 9ee32d7479f83ff14ce3ddf4926805bcb22590cd
      EXPECTED_BLOB: 56846cc710c8d5f1ee95870528a6ecebb0815bf8
      EXPECTED_TREE: 7faad240c5d061de46d50651c11934b91881090a
      PATCH_PATH: .github/atanasyan-offline-build/verified-1189.zip.patch
      PATCH_BLOB: 00c351ec28d4110d3091eed16f4ad07a34c796b1
    steps:
      - name: Check out the dedicated builder and its direct source parent
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/atanasyan-1189-complete-offline-once.yml
            /.github/atanasyan-offline-build/verified-1189.zip.patch
            /geometry-course/
            /scripts/
            /assets/assistant/page-rollout.json
            /assets/assistant/home-link.js
            /assets/download-panel.css
            /assets/geometry-step-views.js
            /assets/site.css
            /ege-baza/return-to-course.js
            /learning/atanasyan-first-steps/
            /learning/ichenskaya-grade7-works/app.js
            /tools/public-navigator-preservation.cjs
            /tools/geometry-textbook/
            /content-drafts/atanasyan-grade8-area-842-844/
            /downloads/trainers-manifest.json
            /downloads/trainers/geometry-course/
      - name: Verify the source, every unpacked member, the binary and the clean result tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "${GITHUB_SHA}^")" = "$SOURCE_SHA"
          test "$(git rev-parse "${SOURCE_SHA}^{tree}")" = "$SOURCE_TREE"
          test "$(git hash-object "$PATCH_PATH")" = "$PATCH_BLOB"
          cp "$PATCH_PATH" "$RUNNER_TEMP/reviewed-geometry.patch"
          git switch --detach "$SOURCE_SHA"
          test "$(git ls-remote --exit-code --heads origin "refs/heads/$SOURCE_BRANCH" | cut -f1)" = "$SOURCE_SHA"
          test -z "$(git ls-remote --heads origin "refs/heads/$TARGET_BRANCH")"
          test "$(git hash-object "$ZIP_PATH")" = "$PREVIOUS_BLOB"
          for book_unit in upper_semicircle trigonometric_signs trigonometric_rays slope_and_reflection triangle_relations triangle_sine_area solve_triangle oblique_triangle_cases triangle_section_applications field_trigonometry scalar_product scalar_coordinates scalar_geometry trigonometry_review triangle_review vector_product_review additional_triangle_area additional_solve_triangles additional_scalar_vectors chapter_twelve_finale regular_polygon_definition regular_polygon_angles regular_polygon_centers regular_polygon_tables polygon_circle_applications regular_polygon_areas regular_polygon_constructions; do
            python3 "tools/geometry-textbook/${book_unit}.py" --check
          done
          for check in upper_semicircle trigonometric_rays triangle_sine_area triangle_section_applications field_trigonometry scalar_product scalar_coordinates scalar_geometry trigonometry_review triangle_review vector_product_review additional_triangle_area additional_solve_triangles additional_scalar_vectors chapter_twelve_finale regular_polygon_definition regular_polygon_angles regular_polygon_centers regular_polygon_tables polygon_circle_applications regular_polygon_areas regular_polygon_constructions; do
            python3 "tools/geometry-textbook/check_${check}.py"
          done
          node scripts/build-trainer-downloads.mjs --only=geometry-course --downloads-only
          mv "$ZIP_PATH" "$RUNNER_TEMP/rebuilt.zip"
          git restore -- "$ZIP_PATH"
          git apply --binary "$RUNNER_TEMP/reviewed-geometry.patch"
          test "$(git hash-object "$ZIP_PATH")" = "$EXPECTED_BLOB"
          test "$(wc -c < "$ZIP_PATH")" = "15684861"
          test "$(sha256sum "$ZIP_PATH" | cut -d' ' -f1)" = "6694d43b6700187e03f9af7e5c9d06dfa772a56746aea1741c3bf3304edb4053"
          python3 - "$RUNNER_TEMP/rebuilt.zip" "$ZIP_PATH" <<'PY'
          from pathlib import PurePosixPath
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as built, zipfile.ZipFile(sys.argv[2]) as reviewed:
              assert built.testzip() is None and reviewed.testzip() is None
              names = built.namelist()
              assert names == reviewed.namelist() and len(names) == len(set(names)) == 358
              assert 'Доступно карточек в задачнике: 2115.' in reviewed.read('README.txt').decode()
              for name in names:
                  assert not PurePosixPath(name).is_absolute() and '..' not in PurePosixPath(name).parts
                  assert built.read(name) == reviewed.read(name), name
                  before, after = built.getinfo(name), reviewed.getinfo(name)
                  assert (before.date_time, before.compress_type, before.external_attr) == (after.date_time, after.compress_type, after.external_attr), name
          PY
          test "$(git diff --name-only)" = "$ZIP_PATH"
          git add -- "$ZIP_PATH"
          test "$(git diff --cached --name-only)" = "$ZIP_PATH"
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Собрать автономный задачник с полными задачами и вопросами главы XII и §1 главы XIII по №1189'
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          git push --force-with-lease="refs/heads/${TARGET_BRANCH}:" origin "HEAD:refs/heads/${TARGET_BRANCH}"
          test "$(git ls-remote --exit-code --heads origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$(git rev-parse HEAD)"
          echo "Verified $SOURCE_SHA -> $(git rev-parse HEAD), $EXPECTED_TREE, $EXPECTED_BLOB" >> "$GITHUB_STEP_SUMMARY"
