<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img"><title>Лестница обучения доказательству</title><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#2B57C4"/></marker></defs><rect width="1200" height="760" fill="#FCFCF9"/><text x="60" y="58" text-anchor="start" style="font-size:36px;font-weight:700;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="60" dy="0">Лестница обучения доказательству</tspan></text><text x="60" y="94" text-anchor="start" style="font-size:20px;font-weight:400;fill:#5A6B87;font-family:Arial,Segoe UI,sans-serif;"><tspan x="60" dy="0">Готовый текст — только первая ступень</tspan></text><rect x="90" y="570" width="230" height="105" rx="14" fill="#DCE7FF" stroke="#D9DFE9" stroke-width="2"/><text x="108" y="606" text-anchor="start" style="font-size:20px;font-weight:700;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="108" dy="0">1. Узнать</tspan></text><text x="108" y="637" text-anchor="start" style="font-size:15px;font-weight:400;fill:#5A6B87;font-family:Arial,Segoe UI,sans-serif;"><tspan x="108" dy="0">понять условие и</tspan><tspan x="108" dy="19">заключение</tspan></text><rect x="240" y="500" width="230" height="105" rx="14" fill="#DDEFE5" stroke="#D9DFE9" stroke-width="2"/><text x="258" y="536" text-anchor="start" style="font-size:20px;font-weight:700;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="258" dy="0">2. Проследить</tspan></text><text x="258" y="567" text-anchor="start" style="font-size:15px;font-weight:400;fill:#5A6B87;font-family:Arial,Segoe UI,sans-serif;"><tspan x="258" dy="0">назвать основание</tspan><tspan x="258" dy="19">каждого шага</tspan></text><rect x="390" y="430" width="230" height="105" rx="14" fill="#F7E9C7" stroke="#D9DFE9" stroke-width="2"/><text x="408" y="466" text-anchor="start" style="font-size:20px;font-weight:700;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="408" dy="0">3. Восстановить</tspan></text><text x="408" y="497" text-anchor="start" style="font-size:15px;font-weight:400;fill:#5A6B87;font-family:Arial,Segoe UI,sans-serif;"><tspan x="408" dy="0">дописать пропущенный</tspan><tspan x="408" dy="19">переход</tspan></text><rect x="540" y="360" width="230" height="105" rx="14" fill="#E9E1FA" stroke="#D9DFE9" stroke-width="2"/><text x="558" y="396" text-anchor="start" style="font-size:20px;font-weight:700;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="558" dy="0">4. Выбрать</tspan></text><text x="558" y="427" text-anchor="start" style="font-size:15px;font-weight:400;fill:#5A6B87;font-family:Arial,Segoe UI,sans-serif;"><tspan x="558" dy="0">найти подходящую</tspan><tspan x="558" dy="19">теорему или приём</tspan></text><rect x="690" y="290" width="230" height="105" rx="14" fill="#F1DFE0" stroke="#D9DFE9" stroke-width="2"/><text x="708" y="326" text-anchor="start" style="font-size:20px;font-weight:700;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="708" dy="0">5. Построить</tspan></text><text x="708" y="357" text-anchor="start" style="font-size:15px;font-weight:400;fill:#5A6B87;font-family:Arial,Segoe UI,sans-serif;"><tspan x="708" dy="0">самостоятельно собрать</tspan><tspan x="708" dy="19">доказательство</tspan></text><rect x="840" y="220" width="230" height="105" rx="14" fill="#E5EEF0" stroke="#D9DFE9" stroke-width="2"/><text x="858" y="256" text-anchor="start" style="font-size:20px;font-weight:700;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="858" dy="0">6. Перенести</tspan></text><text x="858" y="287" text-anchor="start" style="font-size:15px;font-weight:400;fill:#5A6B87;font-family:Arial,Segoe UI,sans-serif;"><tspan x="858" dy="0">узнать идею в новой</tspan><tspan x="858" dy="19">конфигурации</tspan></text><line x1="100" y1="650" x2="1080" y2="165" stroke="#2B57C4" stroke-width="5" marker-end="url(#arrow)"/><text x="1162" y="736" text-anchor="e