name: PreOGE arithmetic route quality
on:
  pull_request:
    paths:
      - 'trainers/arifmetika.html'
      - 'trainers/oge-basics/arithmetic-route*'
      - 'trainers/oge-basics/index.html'
      - 'trainers/oge-basics/multiplication-division/division-guided*'
      - 'trainers/oge-basics/multiplication-division/decimal-shift*'
      - 'trainers/oge-basics/multiplication-division/multiplication-refresh*'
      - 'trainers/oge-basics/multiplication-division/long-division-from-simple-to-decimals.html'
      - 'tools/preoge-arithmetic*'
      - 'tools/arithmetic-course.test.cjs'
      - 'tools/arithmetic-route-entry.dom.cjs'
      - 'tools/division-guided-continuation.dom.cjs'
      - 'tools/decimal-divisor-entry*'
      - 'tools/arithmetic-url-contract*'
      - 'trainers/oge-basics/multiplication-division/decimal-divisor-shift.html'
      - 'tools/decimal-shift*'
      - '.github/workflows/preoge-arithmetic-quality.yml'
  push:
    branches: [main]
    paths:
      - 'trainers/arifmetika.html'
      - 'trainers/oge-basics/arithmetic-route*'
      - 'trainers/oge-basics/multiplication-division/decimal-shift*'
      - 'trainers/oge-basics/multiplication-division/multiplication-refresh*'
      - 'tools/decimal-shift*'
      - '.github/workflows/preoge-arithmetic-quality.yml'
permissions:
  contents: read
jobs:
  arithmetic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - name: Install isolated test dependencies
        run: |
          mkdir -p /tmp/preoge-quality
          npm install --prefix /tmp/preoge-quality --no-audit --no-fund playwright@1.62.1 jsdom@26.1.0
          node /tmp/preoge-quality/node_modules/playwright/cli.js install --with-deps chromium
      - name: Contracts and arithmetic
        env:
          NODE_PATH: /tmp/preoge-quality/node_modules
        run: |
          node tools/preoge-arithmetic.test.cjs
          node tools/arithmetic-route-entry.dom.cjs
          node tools/decimal-divisor-entry.dom.cjs
          node tools/arithmetic-url-contract.test.cjs
          node tools/arithmetic-course.test.cjs
          node tools/division-guided.test.cjs
          node tools/division-guided-continuation.dom.cjs
          node tools/decimal-shift.test.cjs
          node tools/learning-remediation-bank.cjs --check
          git diff --check
      - name: Fictional learner scenarios
        env:
          NODE_PATH: /tmp/preoge-quality/node_modules
          PREOGE_SCREENSHOTS: arithmetic-browser-results
        run: |
          node tools/preoge-arithmetic.browser.cjs
          node tools/division-guided.browser.cjs
          node tools/division-notebook.browser.cjs
          node tools/decimal-shift.browser.cjs
      - name: Arithmetic entry screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arithmetic-entry-${{ github.run_id }}
          path: arithmetic-browser-results/
          retention-days: 7
          if-no-files-found: ignore
