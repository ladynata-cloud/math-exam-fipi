<body>
<div class="app">
  <div class="head">
    <div>
      <div class="title">📝 Мини-зачёт: второй признак</div>

    </div>

  </div>

  <div class="body" id="bodyArea">
    <div class="topic" id="topic"></div>
    <div class="q" id="qtext"></div>
    <img class="q-diagram" id="qdiagram" width="320" height="130" alt="" hidden>
    <div class="opts" id="opts"></div>
    <div class="msg" id="msg"></div>

  </div>

    <div class="verdict" id="verdict"></div>
    <div class="skills" id="skills"></div>
    <button class="opt" style="max-width:240px;margin:0 auto;text-align:center" onclick="restart()">Пройти зачёт ещё раз</button>
  </div>

    <button onclick="restart()">↺ Сначала</button>
    <button class="next" id="nextBtn" onclick="nextQ()">Дальше →</button>
  </div>

<script>
const SK='mathExamCourseProgress.v1', TID='ch2-p3-t5-quiz';
function lS(){try{const d=JSON.parse(localStorage.getItem(SK)||'{}');return d[TID]||{runs:0,best:0,events:[]}}catch{return{runs:0,best:0,events:[]}}}
function sS(s){try{const d=JSON.parse(localStorage.getItem(SK)||'{}');d[TID]=s;localStorage.setItem(SK,JSON.stringify(d))}catch{}}
function log(ev,extra){try{const s=lS();s.events=(s.events||[]);s.events.push({t:Date.now(),q:qi+1,e:ev,...(extra||{})});if(s.events.length>300)s.events=s.events.slice(-300);sS(s)}catch{}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

const QS=[
 {topic:'Формулировка', q:'Выберите <b>точную</b> формулировку второго признака равенства треугольников.',
  opts:[
   {t:'Если сторона и два прилежащих к ней угла одного треугольника соответственно равны стороне и двум прилежащим углам другого — треугольники равны.',ok:true},
   {t:'Если сторона и какие-нибудь два угла одного треугольника равны стороне и двум углам другого — треугольники равны.',ok:false,why:'углы должны быть именно <b>прилежащими</b> к стороне, а не любыми.'},
   {t:'Если два угла одного треугольника равны двум углам другого — треугольники равны.',ok:false,why:'без равной стороны это лишь подобие, а не равенство.'}]},
 {topic:'Словарь', q:'Дана сторона AB треугольника ABC. Какие углы к ней <b>прилежат</b>?',
  opts:[
   {t:'∠A и ∠B',ok:true},
   {t:'∠A и ∠C',ok:false,why:'∠C не прилежит к AB: его вершина C не является концом стороны AB.'},
   {t:'только ∠C',ok:false,why:'∠C как раз противолежит AB. Прилежат те углы, чьи вершины — концы стороны.'}]},
 {topic:'Доказательство', q:'В доказательстве второго признака — почему вершина C определяется <b>однозначно</b>?',
  opts:[
   {t:'Два луча — из A и из B — пересекаются ровно в одной точке.',ok:true},
   {t:'Потому что сторона AC равна A₁C₁.',ok:false,why:'равенство AC не дано — это рассуждение от первого признака.'},
   {t:'Потому что измерили третий угол.',ok:false,why:'в признаке ничего не измеряют; C ловится пересечением лучей.'}]},
 {topic:'Контрпример', q:'Достаточно ли двух сторон и угла, лежащего <b>против</b> одной из них, для равенства треугольников?',
  opts:[
   {t:'Нет: вершина может встать двумя разными способами.',ok:true},
   {t:'Да, это и есть второй признак.',ok:false,why:'второй признак — про сторону и два угла ПРИ ней, а не сторона-сторона-угол против.'},
   {t:'Да, всегда.',ok:false,why:'существуют два разных треугольника с такими данными (это видели в словаре §3).'}]},
 {topic:'Соответствие', q:'△ABC = △NMK по второму признаку. Какая сторона равна <b>NK</b>?',
  opts:[
   {t:'AC',ok:true},
   {t:'AB',ok:false,why:'AB соответствует NM (A↔N, B↔M).'},
   {t:'BC',ok:false,why:'BC соответствует MK (B↔M, C↔K). А NK ↔ AC.'}]},
 {topic:'Различение', q:'На чертеже отмечены <b>две стороны и угол между ними</b>. Каким признаком пользуемся?',
  diagram:'sas', diagramAlt:'У треугольников ABC и NMK засечки обозначают AB = NM и AC = NK. Дуги обозначают равные углы при A и N.',
  opts:[
   {t:'Первым признаком',ok:true},
   {t:'Вторым признаком',ok:false,why:'второй — это сторона и два угла при ней, а здесь две стороны и угол между.'},
   {t:'Данных не хватает',ok:false,why:'данных достаточно: две стороны и угол между ними — это первый признак.'}]},
 {topic:'Различение', q:'На чертеже отмечены <b>сторона и два прилежащих к ней угла</b>. Каким признаком пользуемся?',
  diagram:'asa', diagramAlt:'У треугольников ABC и NMK засечки обозначают AB = NM. Дуги обозначают равные углы при A и N, двойные дуги — при B и M.',
  opts:[
   {t:'Вторым признаком',ok:true},
   {t:'Первым признаком',ok:false,why:'первый — это две стороны и угол между ними, а здесь сторона и два угла.'},
   {t:'Данных не хватает',ok:false,why:'данных достаточно: сторона и два прилежащих угла — это второй признак.'}]},
 {topic:'Применение', q:'У △ABD и △CBD общая сторона BD; при ней ∠ABD=∠CBD и ∠ADB=∠CDB. Чем равны треугольники?',
  opts:[
   {t:'Равны по второму признаку.',ok:true},
   {t:'Равны по первому признаку.',ok:false,why:'отмечены сторона BD и два угла при ней — это второй признак, не первый.'},
   {t:'Доказать нельзя.',ok:false,why:'общая сторона BD плюс два прилежащих к ней угла — этого достаточно для второго признака.'}]}
];

let order=[], qi=0, answered=false, tries=0;
const results=[];

function el(id){return document.getElementById(id);}
function curQ(){return QS[order[qi]];}

function render(){
  answered=false;tries=0;
  const q=curQ();
  el('topic').textContent=q.topic;
  el('qtext').innerHTML=q.q;
  const diagram=el('qdiagram');
  diagram.hidden=!q.diagram;
  diagram.alt=q.diagramAlt||'';
  if(q.diagram) diagram.src='../assets/quiz-congruence-'+q.diagram+'.svg';
  else diagram.removeAttribute('src');
  el('msg').className='msg';el('msg').innerHTML='';
  el('nextBtn').style.display='none';
  el('pf').style.width=Math.round(qi/QS.length*100)+'%';
  const opts=el('opts');opts.innerHTML='';
  shuffle(q.opts).forEach(o=>{
    const b=document.createElement('button');
    b.className='opt';b.innerHTML=o.t;
    b.onclick=()=>pick(o,b);
    opts.appendChild(b);
  });
  renderDots();
  log('q_start',{topic:q.topic});
}
function renderDots(){
  const d=el('dots');d.innerHTML='';
  for(let i=0;i<QS.length;i++){const e=document.createElement('div');e.className='qd'+(results[i]?' '+results[i]:'');d.appendChild(e);}
}
function pick(o,btn){
  if(answered)return;
  if(o.ok){
    answered=true;
    btn.classList.add('ok');
    [...el('opts').children].forEach(b=>{if(b!==btn)b.classList.add('dead');});
    results[order[qi]]=tries===0?'g':(tries===1?'y':'r');
    log('answer_ok',{tries});
    el('msg').className='msg show ok';
    el('msg').innerHTML='Верно!';
    el('nextBtn').style.display='inline-block';
    el('nextBtn').textContent= qi===QS.length-1?'Итоги →':'Дальше →';
    renderDots();
  }else{
    tries++;
    btn.classList.add('shake','dead');setTimeout(()=>btn.classList.remove('shake'),450);
    log('answer_wrong',{tries});
    el('msg').className='msg show err';
    el('msg').innerHTML='Не так: '+o.why+' Попробуйте ещё раз.';
  }
}
function nextQ(){ if(qi<QS.length-1){qi++;render();} else finish(); }

function finish(){
  el('bodyArea').style.display='none';
  el('bar').style.display='none';
  el('fin').style.display='block';
  const g=results.filter(r=>r==='g').length;
  el('finScore').textContent=g+' / '+QS.length;
  const fd=el('finDots');fd.innerHTML='';
  results.forEach(r=>{const e=document.createElement('div');e.className='fd '+(r||'r');fd.appendChild(e);});
  const v=el('verdict');
  if(g===QS.length){v.className='verdict good';v.textContent='Отличный результат — весь параграф усвоен на отлично!';}
  else if(g>=QS.length-2){v.className='verdict good';v.textContent='Хороший результат. Пара мест требует повторения — смотрите ниже.';}
  else{v.className='verdict mid';v.textContent='Зачёт пройден, но есть пробелы. Стоит вернуться к темам ниже и пройти зачёт ещё раз.';}
  // разбивка по темам
  const byTopic={};
  order.forEach((qidx,pos)=>{const t=QS[qidx].topic;if(!byTopic[t])byTopic[t]=[0,0];byTopic[t][1]++;if(results[qidx]==='g')byTopic[t][0]++;});
  const hints={Формулировка:'тренажёр 2 (доказательство)',Словарь:'тренажёр 0 (прилежащие и противолежащие)',Доказательство:'тренажёр 2',Контрпример:'тренажёр 0, акт 3',Соответствие:'тренажёр 4',Различение:'тренажёр 3',Применение:'тренажёр 4'};
  const sb=el('skills');sb.innerHTML='';
  Object.keys(byTopic).forEach(t=>{const [o,tot]=byTopic[t];
    const e=document.createElement('div');e.className='skill';
    e.innerHTML='<b>'+t+'</b>: '+o+' из '+tot+(o<tot?' — повторите '+hints[t]:' ✓');
    sb.appendChild(e);});
  const s=lS();s.runs=(s.runs||0)+1;s.passed=true;s.best=Math.max(s.best||0,g);sS(s);
  log('finish',{score:g});
}
function restart(){
  order=shuffle(QS.map((_,i)=>i));qi=0;results.length=0;
  el('fin').style.display='none';
  el('bodyArea').style.display='block';
  el('bar').style.display='flex';
  render();
}
log('start');
restart();
</script>

<script>
/* Personal notebook for retained Atanasyan trainers. No legacy progress writes. */
(function (win, doc) {
  'use strict';
  if (win.Geometry7Native || new URLSearchParams(win.location.search).get('g7-board') === '1') return;
  const config = JSON.parse(doc.getElementById('atanasyan-notebook-config').textContent);
  const key = 'mathExamGeometryNotebook.v1.' + config.id;
  const fields = ['prediction', 'reflection', 'next'];
  const short = (value, max) => typeof value === 'string' ? value.slice(0, max) : '';
  const validTime = n => Number.isFinite(n) && n >= 0 ? n : 0;
  const clean = data => ({version: 1, updated: validTime(data?.updated),
    prediction: short(data?.prediction, 4000), reflection: short(data?.reflection, 4000), next: short(data?.next, 1000),
    events: Array.isArray(data?.events) ? data.events.slice(-80).filter(e => e && typeof e.type === 'string').map(e => ({type:short(e.type,40),at:validTime(e.at),task:short(e.task,40)})) : [],
    checkpoints: Array.isArray(data?.checkpoints) ? data.checkpoints.slice(-20).filter(c => c && validTime(c.at)).map(c => ({at:validTime(c.at),due:validTime(c.due),days:c.days===7?7:1,summary:short(c.summary,4000)})) : []});
  let state = clean(null), savedVersion = 0, unavailable = false, conflict = false;
  const recovered = [];
  function read() {
    const raw = win.localStorage.getItem(key);
    if (!raw) return clean(null);
    const parsed = JSON.parse(raw);
    if (!parsed || parsed.version !== 1 || typeof parsed !== 'object') throw Error('Unrecognized notebook');
    return clean(parsed);
  }
  try { state = read(); savedVersion = state.updated; } catch (_) { unavailable = true; }
  const style = doc.createElement('style');
  style.textContent = '#atanasyan-notebook{max-width:980px;margin:16px auto;padding:12px 16px;border:1px solid #bccac6;border-radius:12px;background:#f8fbfa;color:#203c35;font:15px/1.5 system-ui;text-align:left;box-sizing:border-box}#atanasyan-notebook *{box-sizing:border-box}#atanasyan-notebook summary{cursor:pointer;font-weight:700}#atanasyan-notebook label{display:block;margin-top:12px;font-weight:600}#atanasyan-notebook textarea{display:block;width:100%;min-height:76px;margin-top:6px;padding:8px;font:inherit;border:1px solid #b3c5bf;border-radius:6px;background:#fff;color:#16362a;resize:vertical}#atanasyan-notebook p{margin:8px 0}#atanasyan-notebook button,#atanasyan-notebook select{font:inherit;white-space:normal;margin:6px 6px 0 0;padding:7px 10px;border:1px solid #78978c;border-radius:6px;background:#fff;color:#173e30}#atanasyan-notebook a{color:#165b46;text-decoration:underline;overflow-wrap:anywhere}#atanasyan-notebook .an-note{font-size:13px;color:#48665c}#atanasyan-notebook [role=status]{font-size:13px}#atanasyan-notebook li{margin:4px 0}#atanasyan-notebook .an-warning{color:#8b301c}';
  doc.head.append(style);

    const panel=doc.createElement('details');panel.id='atanasyan-active-practice';panel.innerHTML='<summary>Проверить понимание · новая задача</summary><div data-practice-body></div><div data-practice-recovery></div><p data-practice-status role="status" class="ap-small"></p><button type="button" data-practice-export>Скачать попытки</button><button type="button" data-practice-latest hidden>Открыть свежую работу</button>';
    const notebook=doc.getElementById('atanasyan-notebook');doc.body.insertBefore(panel,notebook||null);const body=panel.querySelector('[data-practice-body]'),status=panel.querySelector('[data-practice-status]');
    const toolbar=doc.querySelector('.bar');if(toolbar){toolbar.style.flexWrap='wrap';const open=doc.createElement('button');open.id='atanasyan-active-practice-open';open.type='button';open.textContent='Проверить понимание';open.setAttribute('aria-controls',panel.id);open.addEventListener('click',()=>{panel.open=true;panel.scrollIntoView({block:'start'});body.querySelector('h2')?.focus({preventScroll:true});});toolbar.append(open);}
    function flagConflict(){conflict=true;status.className='ap-small ap-warning';status.textContent='В другой вкладке уже есть более свежая работа. Эта попытка приостановлена, её можно скачать. При открытии свежей работы прежний ответ останется ниже.';body.querySelectorAll('button,input,select').forEach(el=>el.disabled=true);panel.querySelector('[data-practice-latest]').hidden=false;}
    function save(){
      if(conflict)return false;
      if(!unavailable){try{if(win.localStorage.getItem(storageKey)!==raw){flagConflict();return false;}state.updated=Date.now();const next=JSON.stringify(state);win.localStorage.setItem(storageKey,next);raw=next;}catch(_){unavailable=true;}}
      status.className='ap-small';status.textContent=unavailable?'Сохранение браузера недоступно. Работа остаётся в этой вкладке: скачай попытки перед закрытием.':'Попытка сохранена в этом браузере.';return true;
    }
    const esc=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function focusTask(){panel.scrollIntoView({block:'start'});body.querySelector('h2')?.focus({preventScroll:true});}
    function render(){
      const record=select(state,task),index=tasks.indexOf(task),unseen=nextUnseen(state,tasks),hintReady=record.errors>=2||record.completed;
      const form=task.answer.kind==='choice'?'<fieldset><legend>Твой ответ</legend>'+task.answer.options.map(option=>'<label><input type="radio" name="ap-choice" value="'+esc(option.value)+'"'+(record.draft===option.value?' checked':'')+'>'+esc(option.label)+'</label>').join('')+'</fieldset>':'<label for="ap-answer">Твой ответ'+(task.answer.unit?' ('+esc(task.answer.unit)+')':'')+'</label><input id="ap-answer" type="text" autocomplete="off" maxlength="300" value="'+esc(record.draft)+'"><p class="ap-small">Можно записать число, десятичную дробь с запятой или дробь: 3/4.</p>';
      body.innerHTML='<h2 tabindex="-1">'+esc(config.topic)+'</h2><p class="ap-small">Вариант '+(index+1)+' из '+tasks.length+(record.repeated?' · знакомое условие':'')+'</p><p class="ap-problem">'+esc(task.prompt)+'</p>'+(task.figure?'<div class="ap-figure">'+task.figure+'</div>':'')+'<form data-practice-form>'+form+'<button type="submit" class="ap-primary"'+(record.completed?' disabled':'')+'>Проверить ответ</button></form><p class="ap-feedback" data-kind="'+esc(record.feedbackKind)+'" data-practice-feedback role="status">'+esc(record.feedback)+'</p><div><button type="button" data-practice-hint'+(!hintReady?' disabled':'')+'>Подсказка</button><button type="button" data-practice-solution'+(!hintReady?' disabled':'')+'>Разобрать решение</button></div>'+(!hintReady?'<p class="ap-small">Сначала попробуй сам. После двух ошибок можно открыть подсказку; пустой ответ и ошибка записи попыткой не считаются.</p>':'')+(record.hint?'<div class="ap-help"><strong>Подсказка</strong><p>'+esc(task.hint)+'</p></div>':'')+(record.solution?'<div class="ap-help"><strong>Разбор</strong><p>'+esc(task.solution)+'</p></div>':'')+'<p><button type="button" data-practice-next class="ap-primary"'+(!unseen?' disabled':'')+'>Новый вариант без подсказки</button>'+(record.completed?'<button type="button" data-practice-repeat>Повторить это условие</button>':'')+'</p>'+(!unseen?'<p class="ap-small">Все варианты уже открыты. Можно продолжить сохранённую работу или повторить знакомое условие. Повтор не добавляет новый самостоятельный успех.</p>':'')+'<label>Продолжить вариант <select data-practice-select>'+tasks.map((t,i)=>{const r=state.records[fingerprint(t)],label=!r?'не открыт':r.outcome==='independent'?'самостоятельно':r.outcome==='assisted'?'с опорой':r.outcome==='corrected'?'исправлено':r.outcome==='repeated'?'повтор':r.completed?'завершён':'в работе';return '<option value="'+esc(t.id)+'"'+(t.id===task.id?' selected':'')+'>'+String(i+1)+' · '+label+'</option>';}).join('')+'</select></label><p class="ap-small">Новых самостоятельных вариантов: '+state.credits.length+'. Верный ответ после ошибки, с помощью и знакомый повтор учитываются отдельно. Эти задачи проверяют указанный навык; письменное доказательство проверяет учитель.</p><details><summary>Мои попытки в этом условии</summary><ol>'+record.history.map(event=>'<li>'+esc(({wrong:'Ошибка',hint:'Открыта подсказка',solution:'Открыт разбор',independent:'Самостоятельный ответ',corrected:'Ответ исправлен',assisted:'Ответ с опорой',repeated:'Знакомый повтор'})[event.type]||event.type)+(event.answer?' · '+esc(event.answer):'')+(event.feedback?' — '+esc(event.feedback):'')+'</li>').join('')+'</ol></details>';
      if(record.completed)body.querySelectorAll('input').forEach(el=>el.disabled=true);
      body.querySelector('[data-practice-form]').addEventListener('submit',event=>{event.preventDefault();if(conflict)return;const input=task.answer.kind==='choice'?body.querySelector('input[name="ap-choice"]:checked')?.value||'':body.querySelector('#ap-answer').value;submit(state,task,input);if(save())render();});
      body.querySelectorAll('input').forEach(input=>input.addEventListener('input',()=>{if(conflict)return;record.draft=task.answer.kind==='choice'?body.querySelector('input[name="ap-choice"]:checked')?.value||'':body.querySelector('#ap-answer').value;save();}));
      for(const kind of ['hint','solution'])body.querySelector('[data-practice-'+kind+']').addEventListener('click',()=>{if(conflict)return;if(help(state,task,kind)&&save())render();});
      body.querySelector('[data-practice-next]').addEventListener('click',()=>{if(conflict)return;const next=nextUnseen(state,tasks);if(!next)return;task=next;select(state,task);if(save()){render();focusTask();}});
      body.querySelector('[data-practice-repeat]')?.addEventListener('click',()=>{if(conflict)return;if(repeat(state,task)&&save()){render();focusTask();}});
      body.querySelector('[data-practice-select]').addEventListener('change',event=>{if(conflict)return;task=tasks.find(t=>t.id===event.target.value)||task;select(state,task);if(save()){render();focusTask();}});
      if(conflict)flagConflict();
    }
    panel.querySelector('[data-practice-export]').addEventListener('click',()=>{const blob=new win.Blob([JSON.stringify({trainer:config.id,topic:config.topic,...state,recovered},null,2)],{type:'application/json'}),url=win.URL.createObjectURL(blob),a=doc.createElement('a');a.href=url;a.download=config.id+'-practice.json';a.click();win.setTimeout(()=>win.URL.revokeObjectURL(url),1000);});
    panel.querySelector('[data-practice-latest]').addEventListener('click',()=>{try{
      const latestRaw=win.localStorage.getItem(storageKey),latest=readState(latestRaw),old=copy(state);recovered.push(old);
      const details=doc.createElement('details');details.open=true;const summary=doc.createElement('summary');summary.textContent='Прежняя попытка из этой вкладки';details.append(summary);const p=doc.createElement('p');p.textContent=task.prompt;details.append(p);const area=doc.createElement('textarea');area.readOnly=true;area.value=state.records[state.active]?.draft||'';details.append(area);panel.querySelector('[data-practice-recovery]').append(details);
      raw=latestRaw;state=latest;task=tasks.find(t=>fingerprint(t)===state.active)||tasks[0];select(state,task);conflict=false;panel.querySelector('[data-practice-latest]').hidden=true;render();status.className='ap-small';status.textContent='Открыта свежая работа. Прежняя попытка сохранена ниже и включена в скачиваемый файл до закрытия вкладки.';
    }catch(_){status.textContent='Свежую запись прочитать не удалось. Скачай попытку этой вкладки.';}});
    win.addEventListener('storage',event=>{if(event.key===storageKey&&!unavailable&&!conflict){try{if(win.localStorage.getItem(storageKey)!==raw)flagConflict();}catch(_){flagConflict();}}});
    render();if(openedChanged||unavailable)save();else status.textContent='Продолжена сохранённая попытка.';return {state:()=>copy(state),panel,key:storageKey};
  }
  const api={fingerprint,parseNumber,interpret,freshRecord,freshState,readState,select,submit,help,repeat,nextUnseen,mount};
  if(typeof module!=='undefined'&&module.exports)module.exports=api;
  root.AtanasyanActivePractice=api;
  if(root.document){const config=root.document.getElementById('atanasyan-active-practice-config');if(config)mount(root,root.document,JSON.parse(config.textContent));}
})(typeof window!=='undefined'?window:globalThis);
</script>
<!-- atanasyan-active-practice:end -->
</body>
