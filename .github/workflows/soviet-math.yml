name: Soviet math — content, practice and video
on:
  pull_request:
    paths:
      - 'soviet-math/**'
      - 'tools/soviet-math*'
      - '.github/workflows/soviet-math.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  soviet-math:
    runs-on: ubuntu-latest
    # Includes one complete 90–150 second worker render in addition to the catalog.
    timeout-minutes: 20
    env:
      NODE_PATH: ${{ github.workspace }}/video-worker/node_modules
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: video-worker/package-lock.json
      - name: Install locked browser and media checks
        run: |
          npm --prefix video-worker ci
          video-worker/node_modules/.bin/playwright install --with-deps chromium
          if ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Exact arithmetic and unchanged division core
        run: |
          node tools/soviet-math-content.test.cjs
          node tools/soviet-math-extension.test.cjs
          node tools/soviet-math-motion.test.cjs
          node tools/division-guided.test.cjs
          node tools/soviet-math-render.cjs --check
          git diff --check
      - name: Practice, persistence, mobile and reduced motion
        env:
          SOVIET_SCREENSHOTS: ${{ runner.temp }}/soviet-math-evidence/course
        run: node tools/soviet-math.browser.cjs
      - name: Shared studio and authenticated export recovery
        env:
          SOVIET_STUDIO_SCREENSHOTS: ${{ runner.temp }}/soviet-math-evidence/studio
        run: node tools/soviet-math-studio.browser.cjs
      - name: Real local worker queue and MP4 render
        # Chromium's documented SUID helper keeps sandboxing enabled on Ubuntu
        # runners that restrict unprivileged user namespaces with AppArmor.
        # https://chromium.googlesource.com/chromium/src/+/main/docs/security/apparmor-userns-restrictions.md
        env:
          CHROME_DEVEL_SANDBOX: /opt/google/chrome/chrome-sandbox
        run: |
          test -f "$CHROME_DEVEL_SANDBOX"
          test -x "$CHROME_DEVEL_SANDBOX"
          test "$(stat -c '%u:%g:%a' -- "$CHROME_DEVEL_SANDBOX")" = '0:0:4755'
          node tools/soviet-math-worker-check.mjs --output "${{ runner.temp }}/soviet-math-evidence/worker"
      - name: All stored MP4s decode, seek and play
        env:
          SOVIET_VIDEO_REQUIRE_CODEC: '1'
        run: |
          export PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH="$(command -v google-chrome)"
          node tools/soviet-math-video.browser.cjs
          echo SOVIET_MATH_OK
      - name: Save visual and local-render evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: soviet-math-evidence
          path: ${{ runner.temp }}/soviet-math-evidence
          if-no-files-found: warn
          retention-days: 7
