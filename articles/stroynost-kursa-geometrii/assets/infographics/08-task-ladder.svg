<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img"><title>Лестница задач после теории</title><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#2B57C4"/></marker></defs><rect width="1200" height="760" fill="#FCFCF9"/><text x="60" y="58" text-anchor="start" style="font-size:36px;font-weight:700;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="60" dy="0">Лестница задач после теории</tspan></text><text x="60" y="94" text-anchor="start" style="font-size:20px;font-weight:400;fill:#5A6B87;font-family:Arial,Segoe UI,sans-serif;"><tspan x="60" dy="0">Не число упражнений, а размер перехода между ними</tspan></text><rect x="75" y="565" width="205" height="105" rx="14" fill="#DCE7FF" stroke="#D9DFE9" stroke-width="2"/><text x="93" y="603" text-anchor="start" style="font-size:20px;font-weight:700;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="93" dy="0">Узнать</tspan></text><text x="93" y="635" text-anchor="start" style="font-size:15px;font-weight:400;fill:#5A6B87;font-family:Arial,Segoe UI,sans-serif;"><tspan x="93" dy="0">назвать факт</tspan></text><rect x="250" y="500" width="205" height="105" rx="14" fill="#DDEFE5" stroke="#D9DFE9" stroke-width="2"/><text x="268" y="538" text-anchor="start" style="font-size:20px;font-weight:700;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="268" dy="0">Подставить</tspan></text><text x="268" y="570" text-anchor="start" style="font-size:15px;font-weight:400;fill:#5A6B87;font-family:Arial,Segoe UI,sans-serif;"><tspan x="268" dy="0">прямое применение</tspan></text><rect x="425" y="435" width="205" height="105" rx="14" fill="#F7E9C7" stroke="#D9DFE9" stroke-width="2"/><text x="443" y="473" text-anchor="start" style="font-size:20px;font-weight:700;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="443" dy="0">Выбрать</tspan></text><text x="443" y="505" text-anchor="start" style="font-size:15px;font-weight:400;fill:#5A6B87;font-family:Arial,Segoe UI,sans-serif;"><tspan x="443" dy="0">найти нужную теорему</tspan></text><rect x="600" y="370" width="205" height="105" rx="14" fill="#E9E1FA" stroke="#D9DFE9" stroke-width="2"/><text x="618" y="408" text-anchor="start" style="font-size:20px;font-weight:700;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="618" dy="0">Соединить</tspan></text><text x="618" y="440" text-anchor="start" style="font-size:15px;font-weight:400;fill:#5A6B87;font-family:Arial,Segoe UI,sans-serif;"><tspan x="618" dy="0">использовать 2–3</tspan><tspan x="618" dy="19">факта</tspan></text><rect x="775" y="305" width="205" height="105" rx="14" fill="#F1DFE0" stroke="#D9DFE9" stroke-width="2"/><text x="793" y="343" text-anchor="start" style="font-size:20px;font-weight:700;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="793" dy="0">Доказать</tspan></text><text x="793" y="375" text-anchor="start" style="font-size:15px;font-weight:400;fill:#5A6B87;font-family:Arial,Segoe UI,sans-serif;"><tspan x="793" dy="0">собрать цепочку</tspan></text><rect x="950" y="240" width="205" height="105" rx="14" fill="#E5EEF0" stroke="#D9DFE9" stroke-width="2"/><text x="968" y="278" text-anchor="start" style="font-size:20px;font-weight:700;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="968" dy="0">Исследовать</tspan></text><text x="968" y="310" text-anchor="start" style="font-size:15px;font-weight:400;fill:#5A6B87;font-family:Arial,Segoe UI,sans-serif;"><tspan x="968" dy="0">случаи, контрпример,</tspan><tspan x="968" dy="19">перенос</tspan></text><text x="600" y="165" text-anchor="middle" style="font-size:25px;font-weight:700;fill:#C24A4A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="600" dy="0">Дефект лестницы</tspan></text><text x="600" y="205" text-anchor="middle" style="font-size:20px;font-weight:400;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="600" dy="0">когда после образца сразу появляется задача, требующая новой идеи</tspan></text><text x="1162" y="736" text-anchor="end" style="font-size:16px;font-weight:400;fill:#5A6B87;font-family:Arial,Segoe UI,sans-serif;"><tspan x="1162" dy="0">Схема: Н. М. Алябьева · MathExam</tspan></text></svg>