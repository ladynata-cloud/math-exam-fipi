(function standaloneTrainer(config) {
  'use strict';
  const source = new URL(config.source);

  function link(href) {
    if (!href || href.startsWith('#') || /^(?:mailto:|tel:|data:|blob:)/i.test(href)) return href;

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ОГЭ №14. Прогрессии: формулы и здравый смысл</title>
<link rel="canonical" href="https://mathexam.space/trainers/oge-task14-progressions.html">
<style>
:root{
  --paper:#fbfaf3; --grid:#e4edf6; --card:#ffffff;
  --ink:#26364a; --muted:#68727f; --line:#d9dee8;
  --pen:#2456a6; --penbg:#eaf1fb; --pen2:#7a4dbf; --pen2bg:#f2ecfb;
  --ok:#2e7d4f; --okbg:#e9f5ee; --okline:#bfe0cc;
  --peek:#a8731d; --peekbg:#fdf4e0; --peekline:#ecd9ad;
  --warn:#9a5b12;
  --btn:#2456a6; --btnText:#fff;
  --r:14px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; color:var(--ink);
  font:16px/1.55 "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif;
  background:var(--paper);
  background-image:
    repeating-linear-gradient(0deg, transparent, transparent 23px, var(--grid) 23px, var(--grid) 24px),
    repeating-linear-gradient(90deg, transparent, transparent 23px, var(--grid) 23px, var(--grid) 24px);
}
.wrap{max-width:880px;margin:0 auto;padding:14px 12px 80px}
header.top{padding:10px 4px 2px}
h1{font-size:22px;line-height:1.25;margin:0 0 4px;color:var(--pen)}
.subtitle{color:var(--muted);font-size:14px;margin:0 0 10px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 10px;position:sticky;top:0;background:linear-gradient(var(--paper) 85%,transparent);z-index:30}
.tab{flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);border-radius:999px;
  padding:9px 16px;font-size:15px;font-weight:600;color:var(--ink);cursor:pointer}
.tab.active{background:var(--pen);border-color:var(--pen);color:#fff}
.page{display:none}
.page.active{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px 16px 14px;margin:0 0 14px;box-shadow:0 1px 2px rgba(38,54,74,.05)}
.card h2{font-size:18px;margin:0 0 8px;color:var(--pen)}
.card h3{font-size:16px;margin:14px 0 6px}
p{margin:8px 0}
.muted{color:var(--muted)}
.small{font-size:13.5px}
b.num{white-space:nowrap}
/* точки-пункты теории */
.tpoint{border-left:4px solid var(--penbg);padding-left:12px;margin:18px 0}
.tpoint .pn{display:inline-block;background:var(--pen);color:#fff;border-radius:8px;
  font-weight:700;font-size:14px;padding:2px 9px;margin-right:8px}
.tpoint h3{display:inline;font-size:17px;color:var(--pen)}
.xref{color:var(--pen);text-decoration:underline dotted;cursor:pointer;white-space:nowrap}
/* формулы */
.formula{font-family:Georgia,"Times New Roman",serif;font-size:20px;background:#f7f9fd;
  border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:inline-block;margin:6px 8px 6px 0}
.formula i{font-style:italic}
.formula sub{font-size:12px}
.formula sup{font-size:13px}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 3px}
.frac>.fn{padding:0 6px;border-bottom:1.6px solid currentColor;line-height:1.25}
.frac>.fd{padding:0 6px;line-height:1.25}
.human{background:var(--okbg);border:1px solid var(--okline);border-radius:10px;padding:8px 12px;margin:6px 0;font-size:15px}
/* лента шагов */
.tape{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:10px 0;font-size:16px}
.tape .cell{background:#fff;border:1.6px solid var(--pen);color:var(--ink);border-radius:10px;
  padding:6px 10px;min-width:44px;text-align:center;font-weight:600}
.tape .cell .idx{display:block;font-size:11px;font-weight:400;color:var(--muted)}
.tape .cell.hl{background:var(--penbg)}
.tape .cell.gp{border-color:var(--pen2)}
.tape .cell.gp.hl{background:var(--pen2bg)}
.tape .arr{color:var(--pen);font-weight:700;font-size:14px;padding:0 1px;white-space:nowrap}
.tape .arr.gp{color:var(--pen2)}
.tape .dots{color:var(--muted);font-weight:700;padding:0 4px}
/* задания */
.task-text{font-size:16.5px}
.task-chip{display:inline-block;background:var(--penbg);color:var(--pen);border-radius:8px;
  font-size:12.5px;font-weight:700;padding:3px 9px;margin-bottom:8px}
.task-chip.gp{background:var(--pen2bg);color:var(--pen2)}
.svgbox{margin:10px 0;text-align:center}
.svgbox svg{max-width:100%;height:auto}
/* ввод ответа */
.ansrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:12px 0 4px}
.ansfield input{font-size:19px;padding:9px 10px;border:1.8px solid var(--line);border-radius:10px;
  width:130px;text-align:center;color:var(--ink);background:#fff}
.ansfield input:focus{outline:2px solid var(--pen);border-color:var(--pen)}
.ansfield.wide input{width:min(420px,100%)}
.fracIn{display:inline-flex;flex-direction:column;align-items:center;gap:0}
.fracIn input{width:96px;font-size:18px;text-align:center;padding:6px 8px;border:1.8px solid var(--line);border-radius:9px;background:#fff}
.fracIn .bar{width:112px;height:0;border-bottom:2.4px solid var(--ink);margin:5px 0}
.unit{font-size:15px;color:var(--muted)}
.togglefrac{border:1.5px dashed var(--line);background:#fff;color:var(--muted);border-radius:9px;
  font-size:12.5px;padding:7px 10px;cursor:pointer}
/* кнопки */
button.btn{border:0;background:var(--btn);color:var(--btnText);border-radius:11px;
  font-size:15.5px;font-weight:600;padding:11px 18px;cursor:pointer;touch-action:manipulation}
button.btn:active{transform:translateY(1px)}
button.ghost{background:#fff;color:var(--pen);border:1.6px solid var(--pen)}
button.peekbtn{background:#fff;color:var(--peek);border:1.6px solid var(--peekline)}
button.soft{background:var(--penbg);color:var(--pen)}
button.mini{font-size:14px;padding:8px 13px;border-radius:10px}
button.choice{background:#fff;border:1.6px solid var(--line);color:var(--ink);border-radius:11px;
  font-size:15px;padding:10px 14px;cursor:pointer;margin:4px 6px 4px 0}
button.choice.sel-ok{border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:700}
button.choice.sel-no{border-color:var(--peekline);background:var(--peekbg);color:var(--peek)}
button:disabled{opacity:.45;cursor:default}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
/* обратная связь */
.fb{border-radius:10px;padding:9px 13px;margin:10px 0 2px;font-size:15px;display:none}
.fb.ok{display:block;background:var(--okbg);border:1px solid var(--okline);color:var(--ok);font-weight:600}
.fb.try{display:block;background:var(--peekbg);border:1px solid var(--peekline);color:var(--warn)}
.fb.info{display:block;background:var(--penbg);border:1px solid #c6d7f0;color:var(--pen)}
/* шаги */
.step{border:1.6px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0;background:#fff}
.step.active{border-color:var(--pen);box-shadow:0 0 0 3px var(--penbg)}
.step.done{border-color:var(--okline);background:var(--okbg)}
.step.peeked{border-color:var(--peekline);background:var(--peekbg)}
.step .yourmove{display:inline-block;background:var(--pen);color:#fff;border-radius:7px;font-size:11.5px;
  font-weight:700;padding:2px 8px;margin-bottom:6px}
.step .stq{font-size:15.5px;margin-bottom:8px}
.step .stgot{font-weight:700;font-size:16px}
.step .peeknote{color:var(--peek);font-size:13.5px;margin-top:6px}
/* сравнение двух способов */
.ways{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.way{border:1.4px solid var(--line);border-radius:12px;padding:12px}
.way h4{margin:0 0 6px;font-size:15px}
.way.wf h4{color:var(--pen)} .way.wt h4{color:var(--ok)}
@media(max-width:640px){.ways{grid-template-columns:1fr}}
.cmp-line{border-top:1px dashed var(--line);padding:7px 0}
.cmp-line:first-child{border-top:0}
.cmp-q{font-size:13.5px;color:var(--muted);line-height:1.4}
.cmp-a{font-size:16px;font-weight:700;margin-top:2px;color:var(--ink)}
/* двойная запись Гаусса */
.gauss{display:grid;gap:5px 4px;margin:12px 0;text-align:center;font-size:14px}
.gcell{border:1.5px solid var(--line);border-radius:8px;padding:6px 2px;min-height:32px;background:#fff}
.gcell.fwd{border-color:var(--pen);color:var(--pen)}
.gcell.rev{border-color:var(--pen2);color:var(--pen2)}
.gcell.sum{border-color:var(--okline);background:var(--okbg);color:var(--ok);font-weight:700;border-top-width:2.4px}
.gcell.gcol{box-shadow:0 0 0 2.5px var(--pen);font-weight:700}
/* цена метода */
.price{font-size:13.5px;color:var(--muted);margin-top:4px}
/* выбор случая */
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin:10px 0}
.casebtn{text-align:left;border:1.6px solid var(--line);border-radius:12px;background:#fff;
  padding:12px 13px;font-size:15px;cursor:pointer;color:var(--ink)}
.casebtn.sel{border-color:var(--pen);background:var(--penbg)}
.casebtn .cc{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.grouplbl{font-weight:700;color:var(--pen);margin:12px 0 4px}
.grouplbl.gp{color:var(--pen2)}
/* марафон */
.mstats{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.stat{background:#fff;border:1.4px solid var(--line);border-radius:10px;padding:7px 12px;font-size:14px}
.stat b{color:var(--pen)}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.fchip{border:1.4px solid var(--line);background:#fff;border-radius:999px;font-size:13px;
  padding:6px 12px;cursor:pointer;color:var(--ink)}
.fchip.on{background:var(--pen);border-color:var(--pen);color:#fff}
.selfcheck{font-size:12.5px;color:var(--muted);text-align:center;margin-top:22px}
.selfcheck b{color:var(--ok)}
details.spoil{border:1.4px dashed var(--line);border-radius:10px;padding:8px 12px;margin:8px 0;background:#fff}
details.spoil summary{cursor:pointer;color:var(--pen);font-weight:600;font-size:14.5px}
hr.thin{border:0;border-top:1px solid var(--line);margin:14px 0}
.footer-note{color:var(--muted);font-size:13px;margin-top:8px}
/* доступность (курс ОГЭ, задача 03D): кнопки и поля не ниже 44 px, видимый фокус */
.tab,button.btn,button.choice,.fchip,.togglefrac,.casebtn,.ansfield input,.fracIn input{min-height:44px}
details.spoil summary{padding:10px 0;line-height:24px}
:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
.ansfield input:focus-visible,.fracIn input:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
.crumbs{display:inline-flex;align-items:center;min-height:44px;font-size:14.5px;color:var(--pen);text-decoration:none}
.crumbs:hover{text-decoration:underline}
@media print{
  body{background-image:none}
  .crumbs,.tabs,.btnrow,.fb,.filters,.mstats,.togglefrac,.selfcheck{display:none !important}
  .card{box-shadow:none}
}

<script>

/* Presentation helpers only: nodes are moved, never cloned, so their handlers and progress survive. */
const OGEMinimal={
  group(root,nodes,label,cls){
    if(!root||typeof root.appendChild!=="function")return null;
    nodes=nodes.filter(Boolean);if(!nodes.length)return null;
    const details=document.createElement('details');details.className=cls||'minimal-options';
    const summary=document.createElement('summary');summary.textContent=label;details.appendChild(summary);
    nodes.forEach(node=>details.appendChild(node));root.appendChild(details);return details;
  },
  shell(root,selectors,title){
    if(!root||!document.body||!document.body.querySelector)return;
    const heading=document.querySelector('h1');if(heading)heading.textContent=title;
    const nodes=selectors.map(s=>document.querySelector(s)).filter(Boolean);
    this.group(root,nodes,'Темы, режимы и результаты','minimal-settings');
  },
  paginate(grid,selector){
    if(!grid||!grid.querySelectorAll)return;
    const cards=Array.from(grid.querySelectorAll(selector));if(!cards.length)return;
    const old=grid.nextElementSibling;if(old&&old.classList.contains('minimal-task-nav'))old.remove();
    const nav=document.createElement('div');nav.className='minimal-task-nav';

/* ===== контракт прогресса курса ОГЭ ===== */
const TID="oge-t14-progressii";
const TYPE_IDS=["AP-VAL","AP-SUM","AP-2PT","AP-SUM2DAY","GP-VAL","GP-COMPL","THRESH","PIC","TAXI"];
const OLD_KEY="oge14_progress_v1";   // прежний ключ тренажёра: переносится один раз (§6 контракта), не удаляется
const QUIZ_TOTAL=10;   // размер зачёта
const PASS_AT=8;       // зачёт сдан при 8 из 10
/* контракт прогресса курса ОГЭ (docs/OGE_PROGRESS_CONTRACT.md): ядро, журнал, повтор;
   миграция своего старого ключа (§6), сброс только своей ветки, поле ext для панели тренажёра */
const CP=(function(){
  var KEY="mathExamCourseProgress.v1";
  var RO=/[?&]selftest=1/.test(location.search||"");
  function isObj(o){ return !!o && typeof o === "object" && !Array.isArray(o); }
  function num(v){ return (typeof v === "number" && isFinite(v) && v > 0) ? Math.floor(v) : 0; }
  function readAll(){
    if (window.OgeCourseSharedMode) return {};
    try { var o = JSON.parse(localStorage.getItem(KEY) || "{}"); return isObj(o) ? o : {}; }
    catch (e) { return {}; }
  }
  /* меняет только свою ветку: читает ключ заново прямо перед записью */
  function saveRec(fn){
    if (RO || window.OgeCourseSharedMode) return;
    try {
      var all = readAll();
      var rec = isObj(all[TID]) ? all[TID] : {};
      if (!isObj(rec.solvedByType)) rec.solvedByType = {};
      rec.v = 1;
      fn(rec);
      rec.updatedAt = Date.now();
      all[TID] = rec;
      localStorage.setItem(KEY, JSON.stringify(all));
    } catch (e) {}
  }
  function solvedOne(type){ saveRec(function(rec){ rec.solvedByType[type] = num(rec.solvedByType[type]) + 1; }); }
  function finishQuiz(score, total){
    saveRec(function(rec){
      rec.runs = num(rec.runs) + 1;
      rec.total = total;
      if (score > num(rec.best)) rec.best = score;
      if (score >= PASS_AT) rec.passed = true;
    });
  }
  /* журнал: промах открывает тип, три верных подряд закрывают;
     верный ответ по типу без промахов записи не заводит */
  function mlog(type, ok){
    if (RO || window.OgeCourseSharedMode) return;
    try {
      var all = readAll();
      var key = TID + "|" + type;
      if (ok && !(isObj(all.mistakes) && isObj(all.mistakes[key]))) return;
      if (!isObj(all.mistakes)) all.mistakes = {};
      var e = isObj(all.mistakes[key]) ? all.mistakes[key] : (all.mistakes[key] = { w:0, r:0 });
      if (ok) { if (num(e.w)) e.r = num(e.r) + 1; }
      else { e.w = num(e.w) + 1; e.r = 0; e.lastWrong = Date.now(); }
      e.last = Date.now();
      localStorage.setItem(KEY, JSON.stringify(all));
    } catch (err) {}
  }
  /* режим повтора: только открытые типы этого тренажёра */
  function openTypes(){
    var mk = readAll().mistakes, pre = TID + "|", res = [];
    if (!isObj(mk)) return res;
    for (var k in mk) if (Object.prototype.hasOwnProperty.call(mk, k) && k.indexOf(pre) === 0){
      var t = k.slice(pre.length), e = mk[k];
      if (isObj(e) && num(e.w) > 0 && num(e.r) < 3 && TYPE_IDS.indexOf(t) >= 0) res.push(t);
    }
    return res;
  }
  /* §6: старый ключ читается один раз; переносится сопоставимое с ядром; ставится
     migratedFrom; старый ключ не удаляется и не переписывается */
  function migrate(fn){
    if (RO || window.OgeCourseSharedMode) return;
    try {
      var raw = localStorage.getItem(OLD_KEY);
      if (raw === null) return;
      var cur = readAll()[TID];
      if (isObj(cur) && typeof cur.migratedFrom === "string") return;
      var old = null;
      try { old = JSON.parse(raw); } catch (e) {}
      saveRec(function(rec){
        if (isObj(old)) { try { fn(old, rec); } catch (e) {} }
        rec.migratedFrom = OLD_KEY;
      });
    } catch (e) {}
  }
  /* «Сбросить прогресс»: своя ветка и свои записи журнала (по префиксу TID|);
     отметка миграции остаётся — иначе старый ключ перенёсся бы снова */
  function resetOwn(){
    if (RO || window.OgeCourseSharedMode) return;
    try {
      var all = readAll(), rec = all[TID];
      if (isObj(rec) && typeof rec.migratedFrom === "string") all[TID] = { v:1, solvedByType:{}, migratedFrom:rec.migratedFrom, updatedAt:Date.now() };
      else delete all[TID];
      if (isObj(all.mistakes)) for (var k in all.mistakes)
        if (Object.prototype.hasOwnProperty.call(all.mistakes, k) && k.indexOf(TID + "|") === 0) delete all.mistakes[k];
      localStorage.setItem(KEY, JSON.stringify(all));
    } catch (e) {}
  }
  /* своя статистика панели тренажёра — поле ext ветки (адаптер курса его не читает) */
  function ext(){ var r = readAll()[TID]; return isObj(r) && isObj(r.ext) ? r.ext : {}; }
  function saveExt(fn){ saveRec(function(rec){ if (!isObj(rec.ext)) rec.ext = {}; fn(rec.ext); }); }
  var REVIEW = !window.OgeCourseSharedMode && /[?&]mode=review(&|$)/.test(location.search || "");
  return { RO:RO, REVIEW:REVIEW, KEY:KEY, isObj:isObj, num:num, readAll:readAll, saveRec:saveRec,
    solvedOne:solvedOne, finishQuiz:finishQuiz, mlog:mlog, openTypes:openTypes,
    migrate:migrate, resetOwn:resetOwn, ext:ext, saveExt:saveExt };
})();

"use strict";
const T14 = {};

/* ---------- Дроби на BigInt ---------- */

}
const Fr = {
  of:F,
  add:(a,b)=>F(a.n*b.d + b.n*a.d, a.d*b.d),
  sub:(a,b)=>F(a.n*b.d - b.n*a.d, a.d*b.d),
  mul:(a,b)=>F(a.n*b.n, a.d*b.d),
  div:(a,b)=>F(a.n*b.d, a.d*b.n),
  neg:(a)=>F(-a.n, a.d),
  abs:(a)=>F(a.n<0n?-a.n:a.n, a.d),
  eq:(a,b)=>a.n===b.n && a.d===b.d,
  cmp:(a,b)=>{ const l=a.n*b.d, r=b.n*a.d; return l<r?-1:(l>r?1:0); },
  isInt:(a)=>a.d===1n,
  int:(a)=>{ if(a.d!==1n) throw new Error("не целое"); return a.n; },
  pow:(a,k)=>{ let r=F(1n); for(let i=0;i<k;i++) r=Fr.mul(r,a); return r; }
};
T14.F=F; T14.Fr=Fr;

/* ---------- Случайные числа (детерминируемые по seed) ---------- */
function rng(seed){
  let a = seed>>>0;
  return function(){
    a|=0; a=a+0x6D2B79F5|0;
    let t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}
const ri=(r,a,b)=>a+Math.floor(r()*(b-a+1));
const pick=(r,arr)=>arr[Math.floor(r()*arr.length)];
T14.rng=rng; T14.ri=ri; T14.pick=pick;

/* ---------- Форматирование чисел (запятая, разряды) ---------- */
function groupInt(s){
  const neg = s.startsWith("-");
  let x = neg? s.slice(1): s;
  if(x.length>4){
    let out="";
    while(x.length>3){ out="\u202F"+x.slice(-3)+out; x=x.slice(0,-3); }
    x=x+out;
  }
  return (neg?"\u2212":"")+x;
}
/* конечная десятичная запись или null */
function decParts(f){
  let d=f.d, a=0n, b=0n;
  while(d%2n===0n){ d/=2n; a++; }
  while(d%5n===0n){ d/=5n; b++; }
  if(d!==1n) return null;
  const k = a>b?a:b;
  const scale = 10n**k;
  let v = f.n*scale/f.d;
  const neg = v<0n; if(neg) v=-v;
  let s=v.toString();
  const kk=Number(k);
  while(s.length<=kk) s="0"+s;
  let ip=s.slice(0, s.length-kk), fp= kk? s.slice(s.length-kk):"";
  fp=fp.replace(/0+$/,"");
  return { neg, ip, fp };
}
function fmtN(f){
  if(typeof f==="number") f=F(f);
  if(typeof f==="bigint") f=F(f);
  const p=decParts(f);
  if(p){
    const sign=p.neg?"\u2212":"";
    return sign+groupInt(p.ip).replace("\u2212","")+(p.fp? ","+p.fp : "");
  }
  /* этажная дробь (в ответах не встречается, но пусть будет) */
  return fracHTML(f.n.toString(), f.d.toString());
}
function fracHTML(top,bot){
  return '<span class="frac"><span class="fn">'+top+'</span><span class="fd">'+bot+'</span></span>';
}
T14.fmtN=fmtN; T14.fracHTML=fracHTML; T14.decParts=decParts;

/* ---------- Разбор введённого ответа ---------- */
function parseDec(str){
  if(str==null) return null;
  let s=String(str).replace(/[\s\u00A0\u202F]/g,"").replace(/[,]/g,".").replace(/[\u2212\u2013\u2014]/g,"-");
  if(!s) return null;
  const m=s.match(/^(-?)(\d+)(?:\.(\d*))?$/) || s.match(/^(-?)()\.(\d+)$/);
  if(!m) return null;
  const sign=m[1]==="-"?-1n:1n;
  const ip=m[2]||"0", fp=(m[3]||"").replace(/0+$/,"") || "";
  const den=10n**BigInt(fp.length);
  const num=BigInt(ip+ (fp||"")) ;
  return F(sign*num, den);
}
/* дробный ввод: числитель/знаменатель */
function parseFracPair(topStr, botStr){
  const t=parseDec(topStr), b=parseDec(botStr);
  if(!t||!b) return null;
  if(b.n===0n) return null;
  try{ return Fr.div(t,b); }catch(e){ return null; }
}

const N = (x)=>nb(fmtN(typeof x==="object"?x:F(x)));

/* ---------- Лента шагов (HTML) ---------- */
/* cells: [{idx, val, hl}], arrows: строка над переходами, gp: фиолетовый стиль */
function tapeHTML(cells, arrow, opt){

/* ---------- SVG для задач с рисунком ---------- */
const SVG_INK="#2456a6", SVG_FILL="#eaf1fb", SVG_DOT="#7a4dbf";
function svgTables(m){

function svgLogs(rows){

  const R=13, gap=3, step=2*R+gap;
  const w=rows*step+30, h=rows*step*0.9+30;
  let s='<svg viewBox="0 0 '+w+' '+h+'" width="'+Math.min(w,300)+'" role="img" aria-label="кладка брёвен">';
  for(let row=0; row<rows; row++){

function svgSnake(k){
  /* спираль со звеньями 1,1,2,2,…,k,k; клетка u px */
  const u=17;
  let x=0,y=0, dir=0; /* 0:→ 1:↑ 2:← 3:↓ */
  const pts=[[0,0]];
  const lens=[];
  for(let L=1; L<=k; L++){ lens.push(L,L); }
  let minx=0,maxx=0,miny=0,maxy=0;
  for(const L of lens){
    if(dir===0) x+=L; else if(dir===1) y-=L; else if(dir===2) x-=L; else y+=L;
    pts.push([x,y]);
    minx=Math.min(minx,x); maxx=Math.max(maxx,x);
    miny=Math.min(miny,y); maxy=Math.max(maxy,y);
    dir=(dir+1)%4;
  }

  const w=(maxx-minx)*u+pad*2, h=(maxy-miny)*u+pad*2;
  const gx=(v)=>pad+(v-minx)*u, gy=(v)=>pad+(v-miny)*u;
  let s='<svg viewBox="0 0 '+w+' '+h+'" width="'+Math.min(w,300)+'" role="img" aria-label="змейка">';
  /* клетчатый фон */
  for(let i=0;i<= (maxx-minx); i++) s+='<line x1="'+(pad+i*u)+'" y1="'+pad+'" x2="'+(pad+i*u)+'" y2="'+(h-pad)+'" stroke="#e4edf6" stroke-width="1"/>';
  for(let j=0;j<= (maxy-miny); j++) s+='<line x1="'+pad+'" y1="'+(pad+j*u)+'" x2="'+(w-pad)+'" y2="'+(pad+j*u)+'" stroke="#e4edf6" stroke-width="1"/>';
  let path="M "+gx(pts[0][0])+" "+gy(pts[0][1]);

  s+='</svg>';
  return s;
}

function mkDistract(list, ans){
  const out=[]; const seen=new Map([[key(ans),null]]);
  out.lost=0;

        ": каждую минуту его температура уменьшалась на "+N(d)+"&nbsp;°C. Начальная температура вещества была "+

      unit="°C";
    } else if(sub==="clock"){
      const a1=ri(r,3,8), d=ri(r,2,4), t=ri(r,5,9), H=ri(r,7,11);
      facts={sub, a1:F(a1), d:F(d), n:t, base:1, noun:"час", nounPr:"часе"};
      text="В "+H+":00 часы начали спешить. За первый час они ушли вперёд на "+N(a1)+" "+W.minWord(a1)+
        ", и за каждый следующий час уходят вперёд на "+N(d)+" "+W.minWord(d)+" больше, чем за предыдущий. На сколько минут часы уйдут вперёд за "+
        t+"-й час после начала?";
      unit="минут";
    } else if(sub==="sun"){
      const a1=ri(r,10,18), d=ri(r,3,6), t=ri(r,5,9);
      facts={sub, a1:F(a1), d:F(d), n:t, base:1, noun:"день", nounPr:"дне"};
      text="Виктор начинает курс солнечных ванн с "+N(a1)+" "+W.minWord(a1)+" в первый день и каждый следующий день увеличивает время процедуры на "+
        N(d)+" "+W.minWord(d)+". Сколько минут будет длиться процедура в "+t+"-й день?";
      unit="минут";
    } else {
      const dv=pick(r,[F(1,2),F(3,2),F(2),F(5,2),F(3)]), t=ri(r,4,9);
      facts={sub, a1:F(0), d:dv, n:t, base:0, noun:"минута", nounPr:"минуте"};
      text="При проведении химической реакции каждую минуту в растворе образуется "+N(dv)+
        "&nbsp;г осадка. В начальный момент осадка в растворе не было. Найдите массу осадка (в граммах) через "+
        N(t)+" "+W.minWord(t)+" после начала реакции.";
      unit="г";
    }
    const trans = facts.base===1? facts.n-1 : facts.n;
    facts.trans=trans;
    const ans=Fr.add(facts.a1, Fr.mul(facts.d, F(trans)));
    const distract=mkDistract([
      { v:Fr.add(facts.a1, Fr.mul(facts.d, F(trans+1))),
        hint: facts.base===1
          ? "Похоже, получился один лишний переход. Первый "+facts.noun+" уже дан, поэтому от 1-го до "+facts.n+"-го всего "+trans+" переход"+((trans%10>=2&&trans%10<=4&&(trans%100<10||trans%100>20))?"а":(trans%10===1&&trans%100!==11?"":"ов"))+"."
          : "Похоже, получился один лишний переход. Пересчитай, сколько минут прошло от начального момента." },
      { v:Fr.add(facts.a1, Fr.mul(facts.d, F(trans-1))),
        hint: facts.base===1
          ? "Похоже, переходов получилось на один меньше. От 1-го до "+facts.n+"-го шага их "+trans+"."
          : "Здесь отсчёт идёт от начального момента, поэтому переходов ровно столько, сколько минут прошло: "+trans+"." },
      facts.d.n<0n ? { v:Fr.sub(facts.a1, Fr.mul(facts.d, F(trans))),
        hint:"Температура уменьшалась, значит на каждом шаге число не прибавляется, а вычитается." } : null
    ], ans);
    return { code:"AP-VAL", seed, chip, gp:false, text, svg:null, unit, ans, distract,
      hint1:"Каждый шаг меняется на одно и то же. Сначала пойми, сколько переходов, потом умножь прибавку на их число.",
      facts, methods: GENS["AP-VAL"].methods };
  },
  sim(t){
    let v=t.facts.a1;
    for(let i=0;i<t.facts.trans;i++) v=Fr.add(v,t.facts.d);
    return v;
  }
};

GENS["AP-SUM"] = {
  code:"AP-SUM", group:"ap", title:"Сумма первых n шагов",
  desc:"камень, детали, штрафы, ряды",
  methods:["gauss","table","formula"],
  price:"Метод Гаусса: записать сумму дважды и увидеть одинаковые столбики — понятно, почему делим на 2. Таблица: выписать все шаги и сложить по порядку — надёжно, но при большом n долго. Формула: самая короткая запись того же самого.",
  gen(seed){

      const aN=Fr.add(F(a1),Fr.mul(dv,F(n-1)));

      const distract=mkDistract([
        { v:aN, hint:"Это штраф только за последний промах. А спрашивают все штрафные очки за "+n+" промахов." },
        { v:Fr.mul(F(a1),F(n)), hint:"Штрафы растут: каждый следующий на 0,5 больше. Выпиши их или сложи парами." },

      return { code:"AP-SUM", seed, chip:"АП: сумма", gp:false, text, svg:null, unit:"очков", ans, distract,
        hint1:"«Сколько всего» значит сумма. Выпиши штрафы или сложи парами «первый + последний» (метод Гаусса).",
        facts, methods:GENS["AP-SUM"].methods };
    } else if(sub==="rings"){
      /* ни один из R рядов стеллажа не пустой: a1 > d·(R − 1) (решение D47) */
      let R;
      do{ a1=ri(r,20,35); d=ri(r,2,5); n=ri(r,5,8); R=n+ri(r,1,4); }while(a1<=d*(R-1));

      unit="книг";
      // здесь d отрицательная в смысле «меньше», но сумма первых n снизу вверх: a1, a1-d, ...
      const facts={sub, a1:F(a1), d:F(-d), n};
      const aN=a1-d*(n-1);
      const S=(2*a1-d*(n-1))*n/2;

        { v:F(aN), hint:"Это только "+n+"-й ряд. А спрашивают все книги в первых "+n+" рядах вместе." },
        { v:F(a1*n), hint:"Ряды разные: в каждом выше на "+d+" меньше. Сложи их или используй формулу суммы." },
        { v:F((a1+aN)*n), hint:"Пара «первый + последний» посчитана верно, но нужно разделить на 2." }
      ], ans);
      return { code:"AP-SUM", seed, chip:"АП: сумма", gp:false, text, svg:null, unit, ans, distract,
        hint1:"«Сколько всего» значит сумма. Выпиши ряды или сложи парами «первый + последний» (метод Гаусса).",
        facts, methods:GENS["AP-SUM"].methods };
    } else {
      a1=ri(r,12,30); d=ri(r,3,8); n=ri(r,5,8);
      text="В первый день мастер изготовил "+N(a1)+" "+W.plur(a1,["деталь","детали","деталей"])+", а в каждый следующий день изготавливал на "+
        N(d)+" "+W.plur(d,["деталь","детали","деталей"])+" больше, чем в предыдущий. Сколько всего деталей мастер изготовил за первые "+N(n)+" дней?";
      unit="деталей";
    }
    const facts={sub, a1:F(a1), d:F(d), n};
    const aN=a1+d*(n-1);
    const S=(2*a1+d*(n-1))*n/2;
    const ans=F(S);
    const distract=mkDistract([
      { v:F(aN), hint:"Это значение только последнего шага. А спрашивают всё вместе, за "+n+" шагов сразу: сложи их." },
      { v:F(a1*n), hint:"Шаги не одинаковые: каждый следующий больше предыдущего. Выпиши их или используй формулу суммы." },
      { v:F((a1+aN)*n), hint:"Хороший ход с парой «первый + последний», но в конце нужно разделить на 2." }
    ], ans);
    return { code:"AP-SUM", seed, chip:"АП: сумма", gp:false, text, svg:null, unit, ans, distract,
      hint1:"«Сколько всего» значит сумма. Выпиши шаги или сложи парами «первый + последний» (метод Гаусса).",
      facts, methods:GENS["AP-SUM"].methods };
  },
  sim(t){
    let v=t.facts.a1, s=F(0);
    for(let i=0;i<t.facts.n;i++){ s=Fr.add(s,v); v=Fr.add(v,t.facts.d); }
    return s;
  }
};

      text="В течение "+N(Nd)+" банковских дней акции компании дорожали каждый день на одну и ту же сумму. В "+k+"-й день акция стоила "+
        N(ak)+" рублей, а в "+m+"-й день "+N(am)+" рублей. Сколько стоила акция в последний, "+p+"-й день этого периода?";
      unit="рублей";
    } else if(sub==="people"){
      const y0=2008+ri(r,0,7); k=y0; m=y0+ri(r,5,9); p=k+ri(r,2,m-k-1);
      const d=ri(r,60,420)*5; ak=ri(r,30,90)*1000+ri(r,0,9)*100; am=ak+d*(m-k);
      noun="год";
      text="К концу "+k+" года в городе проживало "+N(ak)+" человек. Каждый год число жителей увеличивалось на одну и ту же величину. К концу "+
        m+" года в городе проживало "+N(am)+" человек. Сколько человек проживало в городе к концу "+p+" года?";
      unit="человек";
    } else {
      const H=ri(r,7,11); const t1=ri(r,6,10); const d=ri(r,2,5);

      facts={sub, k,m,p, ak:F(ak), am:F(am), H, noun};
      text="В "+H+":00 часы сломались, и с этого момента каждый час они дополнительно отстают на одно и то же число минут. В "+
        (H+t1)+":00 того же дня часы отставали на "+N(am)+" "+W.minWord(am)+". На сколько минут будут отставать часы через "+
        N(p)+" "+W.hourWord(p)+" после поломки?";
      unit="минут";
      const dts=(am)/(t1);
      const ans=F(dts*p);
      const distract=mkDistract([
        { v:F(dts*(p-1)), hint:"Отставание копится с самого момента поломки: за "+p+" "+W.hourWord(p)+" набежит "+p+" одинаковых прибавок." },
        { v:F(am*p,t1+1), hint:"Прибавку за час найди делением: "+fmtN(F(am))+" минут раздели на число прошедших часов — с "+H+":00 до "+(H+t1)+":00 их "+t1+", а не "+(t1+1)+"." }
      ], ans);
      return { code:"AP-2PT", seed, chip, gp:false, text, svg:null, unit, ans, distract,
        hint1:"Узнай, на сколько минут часы отстают за один час, а потом умножь на нужное число часов.", facts, methods:["formula"] };
    }
    facts={sub, k,m,p, ak:F(ak), am:F(am), noun};
    const d=(am-ak)/(m-k);
    const ans=F(ak+d*(p-k));
    const distract=mkDistract([
      { v: (am-ak)%(m-k+1)===0 ? F(ak+ (am-ak)/(m-k+1)*(p-k)) : null,
        hint:"Дели изменение на число переходов между известными шагами, а их "+(m-k)+", а не "+(m-k+1)+"." },
      { v:F(ak+d*(p-k+1)), hint:"Проверь число переходов до нужного шага: от "+k+"-го до "+p+"-го их "+(p-k)+"." },
      { v:F(am), hint:"Это значение на "+m+"-м шаге, а спрашивают про "+p+"-й." }
    ].filter(x=>x&&x.v), ans);
    return { code:"AP-2PT", seed, chip, gp:false, text, svg:null, unit, ans, distract,
      hint1:"Сначала найди прибавку за один переход: раздели изменение на число переходов между известными шагами.",
      facts, methods:["formula"] };
  },
  sim(t){
    const f=t.facts;
    if(f.sub==="press"){
      let P=f.P1, h=f.h1;
      while(Fr.cmp(h,f.h2)<0){ h=Fr.add(h,f.s); P=Fr.sub(P,F(1)); }
      return P;
    }
    const d=Fr.div(Fr.sub(f.am,f.ak), F(f.m-f.k));
    let v=f.ak;
    for(let i=f.k;i<f.p;i++) v=Fr.add(v,d);
    /* контроль: значение в точке m совпадает с данным */
    let vm=f.ak; for(let i=f.k;i<f.m;i++) vm=Fr.add(vm,d);
    if(!Fr.eq(vm,f.am)) throw new Error("AP-2PT: несостыковка точек");
    return v;
  }
};

  sim(t){

      return F(f.n);

      hint1:"Длины звеньев: 1, 1, 2, 2, …, "+K+", "+K+". Сначала сложи 1 + 2 + … + "+K+" методом Гаусса, потом удвой.",
      facts, methods:["formula"] };
  },
  sim(t){
    const f=t.facts;
    if(f.sub==="tables"){ let seats=4; for(let i=2;i<=f.n;i++) seats+=2; return F(seats); }
    if(f.sub==="logs"){ let s=0; for(let i=1;i<=f.base;i++) s+=i; return F(s); }
    let s=0; for(let L=1;L<=f.K;L++) s+=2*L; return F(s);
  }
};

GENS["TAXI"] = {

  gen(seed){

    const C0=100+ri(r,2,12)*10+9;
    const S2=p*M;
    let Tv=pick(r,[40,45,60,75,90]);
    while(Tv<=K+M+5) Tv=pick(r,[45,60,75,90]);
    const facts={sub,K,p,M,C0:F(C0),S2:F(S2),T:Tv};
    const veh= sub==="taxi" ? "поездки на такси" : "поездки на самокате";
    const start= sub==="taxi" ? "Подача машины и первые" : "Разблокировка самоката и первые";
    const text=start+" "+N(K)+" "+W.minWordN(K)+" поездки вместе стоят "+N(C0)+
      " рублей, а каждая следующая минута стоит одинаково. Известно, что минуты с "+(K+1)+"-й по "+(K+M)+
      "-ю (включительно) стоили "+N(S2)+" рублей. Найдите стоимость "+veh+" длительностью "+N(Tv)+" "+W.minWord(Tv)+".";
    const ans=F(C0+(Tv-K)*p);
    const distract=mkDistract([
      { v:F(C0+Tv*p), hint:"Первые "+K+" "+W.minWord(K)+" уже оплачены стартовой суммой, второй раз их оплачивать не нужно." },
      { v:F((Tv-K)*p), hint:"Не забудь прибавить стартовую сумму: она тоже часть стоимости." }
    ], ans);
    return { code:"TAXI", seed, chip:"Старт + минуты", gp:false, text, svg:null, unit:"рублей", ans, distract,
      hint1:"Сначала найди цену одной минуты: "+fmtN(F(S2))+" рублей раздели на "+M+" минут.", facts, methods:["formula"] };
  },
  sim(t){
    const f=t.facts;
    let total=f.C0;
    for(let minute=f.K+1; minute<=f.T; minute++) total=Fr.add(total,F(f.p));
    /* контроль второй суммы */

    if(!Fr.eq(chk,f.S2)) throw new Error("taxi: вторая сумма");
    return total;
  }
};

T.GENS=GENS;
/* число v стоит в тексте отдельным числом (разрядные пробелы не мешают) */
function hasNum14(text,v){
  const plain=h=>String(h).replace(/<[^>]*>/g," ").replace(/(\d)[   ](?=\d{3})/g,"$1").replace(/−/g,"-");
  const f=plain(fmtN(v)).trim();
  return new RegExp("(^|[^\\d,])"+f.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"(?![\\d]|,\\d)").test(plain(text));
}
T.hasNum=hasNum14;
/* ориентир или ловушка называет число, равное ответу, которого нет в условии (решение D20) */
function answerLeaks14(t){
  if(hasNum14(t.text,t.ans)) return false;
  return [t.hint1].concat(t.distract.map(d=>d.hint)).some(h=>hasNum14(h,t.ans));
}
/* задача без совпавших ловушек и без «утечки» ответа (D20): перевыбор по производному зерну, не больше 20 попыток;
   дальше совпавшая ловушка снимается, задача остаётся (решение D46) */
T.makeTask=function(code,seed){
  let t=null;
  for(let i=0;i<20;i++){
    const sd=i===0?seed:((Math.imul(seed|0,-1640531535)+i*40503)>>>0)%1000000000+1;
    t=GENS[code].gen(sd);
    if(!t.distract.lost && !answerLeaks14(t)) return t;
  }
  return t;
};
T.randomTask=function(codes, seed){
  const r=rng(seed);
  const pool=[];
  (codes && codes.length? codes : Object.keys(GENS)).forEach(c=>{
    const w=T.GEN_WEIGHTS[c]||1;
    for(let i=0;i<w;i++) pool.push(c);
  });
  const code=pool[Math.floor(r()*pool.length)];
  return T.makeTask(code, ri(r,1,1e9));
};

/* ===== ОГЭ №14: пошаговые решения и разбор двумя способами ===== */
"use strict";
(function(T){
const {F, Fr, fmtN, N, fracHTML, tapeHTML} = T;

const plusStr=(d)=> (Fr.cmp(d,F(0))>=0? "+"+fmtN(d) : "\u2212"+fmtN(Fr.abs(d)));
const mulStr=(q)=> "×"+fmtN(q);
const divStr=(q)=> "÷"+fmtN(q);

function st(q, a, hint, revealNote, extra){
  const s={ q, a, hint, reveal:(revealNote||"")+" Получается "+nb(fmtN(a))+".", };
  if(extra) Object.assign(s, extra);
  return s;
}
const nb=T.nb;

/* Лента для табличного метода: заполнено до idx, следующий знак вопроса */
function tapeProgress(vals, labels, opShort, upto, gp){
  const cells=[];
  for(let i=0;i<vals.length;i++){
    if(i<upto) cells.push({idx:labels[i], val:fmtN(vals[i]), hl:i===upto-1});
    else if(i===upto){ cells.push({idx:labels[i], val:"?", hl:true}); break; }
  }
  return tapeHTML(cells, opShort, {gp});
}

/* Двойная запись Гаусса. opt:
   sumRow  — рисовать ли нижнюю строку столбиков (по умолчанию да, заполненную);
   hlCol   — индекс столбика для подсветки (по умолчанию нет) */
function gaussVisual(vals, opt){
  opt=opt||{};
  const sumRow = opt.sumRow!==false;
  const hl = (opt.hlCol!=null) ? opt.hlCol : -1;
  const n=vals.length;
  const rev=[...vals].reverse();
  const pair=Fr.add(vals[0], vals[n-1]);
  /* длинный ряд — первые три пары, «…», последние две, как в записи 1 + 2 + … + K (решение D48) */
  const cols = n>16 ? [0,1,2,-1,n-2,n-1] : vals.map((_,i)=>i);
  const cell=(cls,i,v)=> i<0 ? '<span class="gcell">…</span>' : '<span class="gcell '+cls+(i===hl?' gcol':'')+'">'+fmtN(v)+'</span>';
  let h='<div class="gauss" style="grid-template-columns:repeat('+cols.length+',1fr)">';
  cols.forEach(i=>{ h+=cell('fwd',i,vals[i]); });
  cols.forEach(i=>{ h+=cell('rev',i,rev[i]); });
  if(sumRow) cols.forEach(i=>{ h+=cell('sum',i,pair); });
  h+='</div>';
  return h;
}
/* Строка последовательного сложения: "21 + 17 + 13 + … = 56" */
function runSumStr(vals){
  return vals.map(v=>fmtN(v)).join(" + ");
}

/* ---------- Построители шагов ---------- */
function buildSteps(task, method){
  const f=task.facts, c=task.code;
  const steps=[];
  const gp=task.gp;

  if(c==="AP-VAL"){

      const labels=[]; for(let i=0;i<=trans;i++) labels.push(f.base===1? (i+1)+"-й "+f.noun : (i)+" мин");
      for(let i=1;i<=trans;i++){
        steps.push(st(
          "Заполни ленту: какое значение на шаге «"+labels[i]+"»?"+tapeProgress(vals,labels,plusStr(d),i,gp),
          vals[i],
          "К предыдущему значению "+nb(fmtN(vals[i-1]))+" прибавь "+nb(plusStr(d))+".",
          "К "+fmtN(vals[i-1])+" прибавляем "+plusStr(d)+"."
        ));
      }
    } else {
      steps.push(st("На сколько меняется значение за один переход? Укажи со знаком: если уменьшается, пиши со знаком минус.",
        d, "Смотри на слова «на … больше» или «на … меньше»: это и есть прибавка за один переход.",
        "Каждый шаг значение меняется на "+plusStr(d)+"."));

        f.base===1
          ? "Сколько переходов от 1-го до "+n+"-го шага?"

        F(trans),

        f.base===1? "От 1-го до "+n+"-го шага переходов n \u2212 1." : "От 0 до "+n+" минут переходов ровно "+n+"."));
      steps.push(st("На сколько всего изменится значение за все переходы?",
        Fr.mul(d,F(trans)),

  else if(c==="AP-SUM"){

    if(method==="table"){
      const vals=[a1]; for(let i=1;i<n;i++) vals.push(Fr.add(vals[i-1],d));
      const labels=vals.map((_,i)=>(i+1)+"-й");

      }

        task.ans, "Складывай слева направо: "+runSumStr(vals)+".",
        "Сумма всех слагаемых."));
    } else if(method==="gauss"){

        pair, "Сложи выделенные числа: верхнее "+fmtN(a1)+" и нижнее "+fmtN(aN)+".",

        gaussVisual(vals, {sumRow:true}),

      steps.push(st("Обе строки вместе — это удвоенная сумма, 2S. Чему она равна: столбик × число столбиков?",

      steps.push(st("Каждый шаг посчитан дважды, поэтому раздели на 2. Это и есть ответ.",

  else if(c==="AP-2PT"){
    if(f.sub==="press"){

      const mName= f.sub==="clock" ? "второго известного момента" : (f.sub==="people"? "конца "+f.m+" года" : f.m+"-го дня");

  else if(c==="GP-VAL"){

        "Число прямо названо в условии.", "Число делений."));
      steps.push(st("Во сколько раз выросло число инфузорий за все деления?", Fr.pow(F(2),f.k),
        "Каждое деление удваивает: 2 умножается само на себя "+f.k+" раз"+(f.k>=5?"":"а")+".", "Общий множитель 2 в степени "+f.k+"."));
      steps.push(st("Ответ: сколько инфузорий было сначала?", task.ans,
        "Иди назад: раздели "+fmtN(f.m0)+" на "+fmtN(Fr.pow(F(2),f.k))+".", "Назад делим на общий множитель."));
    } else if(method==="table"){
      const vals=[f.m0]; for(let i=1;i<=f.k;i++) vals.push(down? Fr.div(vals[i-1],q): Fr.mul(vals[i-1],q));
      const labels=[]; for(let i=0;i<=f.k;i++) labels.push(info.perN(i));
      for(let i=1;i<=f.k;i++){
        const where = info.thru ? "после "+info.perN(i) : "через "+info.perN(i);
        steps.push(st("Заполни ленту: "+info.val+" "+where+"?"+
          tapeProgress(vals,labels, down? divStr(q):mulStr(q), i, true),
          vals[i],
          (down? "Раздели ":"Умножь ")+fmtN(vals[i-1])+" на "+fmtN(q)+".",
          "Ещё один "+(info.thru?"фильтр":"период")+": "+(down? "делим":"умножаем")+" на "+fmtN(q)+"."));
      }
    } else {
      const periodQ = info.thru
        ? "Сколько фильтров проходит свет?"
        : "Сколько полных периодов по "+f.P+" минут в "+f.T+" минутах?";
      const periodHint = info.thru ? "Число фильтров прямо названо в условии." : "Раздели "+f.T+" на "+f.P+".";
      steps.push(st(periodQ, F(f.k), periodHint, info.thru?"Число фильтров.":"Число периодов."));
      steps.push(st("Во сколько раз "+(down?"уменьшится":"вырастет")+" "+info.val+" за все "+(info.thru?"фильтры":"периоды")+"?", Fr.pow(q,f.k),
        "Множитель "+fmtN(q)+" повторяется "+f.k+" раз"+(f.k>=5?"":"а")+".", "Общий множитель: "+fmtN(q)+" в степени "+f.k+"."));
      const finalQ = info.thru ? "Ответ: "+info.val+" после всех фильтров?" : "Ответ: "+info.val+" через "+f.T+" минут?";
      steps.push(st(finalQ, task.ans,
        (down? "Раздели ":"Умножь ")+fmtN(f.m0)+" на "+fmtN(Fr.pow(q,f.k))+".",
        (down? "Делим":"Умножаем")+" начальное значение на общий множитель."));
    }
  }

  else if(c==="GP-COMPL"){
    const A = f.styleB===false ? "реагента" : "изотопа А";
    const B = f.styleB===false ? "осадка" : "изотопа Б";
    const Bverb = f.styleB===false ? "перешло в осадок" : "образовалось изотопа Б";
    const restNote = f.styleB===false ? "Остаток реагента." : "Остаток А.";
    const minusNote = f.styleB===false ? "Начальное количество минус остаток." : "Начальная масса минус остаток А.";
    if(method==="table"){
      const vals=[f.m0]; for(let i=1;i<=f.k;i++) vals.push(Fr.div(vals[i-1],F(2)));
      const labels=[]; for(let i=0;i<=f.k;i++) labels.push((i*f.P)+" мин");
      for(let i=1;i<=f.k;i++){
        steps.push(st("Сколько "+A+" останется через "+(i*f.P)+" минут?"+
          tapeProgress(vals,labels,divStr(F(2)),i,true),
          vals[i], "Раздели "+fmtN(vals[i-1])+" пополам.", "Половина предыдущего."));
      }
      steps.push(st("Ответ: сколько "+Bverb+"? Всё, что «ушло», перешло в другую часть.",
        task.ans, "Из начального "+fmtN(f.m0)+" вычти остаток "+fmtN(f.rest)+".", minusNote));
    } else {
      steps.push(st("Сколько полных периодов по "+f.P+" минут в "+f.T+" минутах?", F(f.k),
        "Раздели "+f.T+" на "+f.P+".", "Число периодов."));
      steps.push(st("Сколько "+A+" останется после всех делений пополам?", f.rest,
        "Раздели "+fmtN(f.m0)+" пополам "+f.k+" раз"+(f.k>=5?"":"а")+" подряд.", restNote));
      steps.push(st("Ответ: сколько "+Bverb+"?", task.ans,
        "Из "+fmtN(f.m0)+" вычти остаток "+fmtN(f.rest)+". Спрашивают про то, что перешло, а не про остаток!",
        minusNote));
    }
  }

  else if(c==="THRESH"){
    if(f.sub==="bounce"){
      const labels=f.seq.map((_,i)=>"после "+(i+1)+"-го");
      for(let i=1;i<f.seq.length;i++){
        steps.push(st("Высота после "+(i+1)+"-го отскока?"+
          tapeProgress(f.seq,labels,divStr(f.q),i,true),
          f.seq[i], "Раздели "+fmtN(f.seq[i-1])+" на "+fmtN(f.q)+".", "Делим предыдущую высоту."));
      }
      steps.push({ q:"Высота "+nb(fmtN(f.seq[f.seq.length-1]))+" см уже меньше порога "+nb(fmtN(f.L))+" см?",
        choice:{ options:[{t:"Да, впервые меньше",ok:true},{t:"Нет, ещё не меньше",ok:false}],
          why:"Сравниваем: "+fmtN(f.seq[f.seq.length-1])+" &lt; "+fmtN(f.L)+", а предыдущая высота "+fmtN(f.seq[f.seq.length-2])+" ещё не была меньше порога." } });
      steps.push(st("Ответ: после какого по счёту отскока высота впервые стала меньше "+fmtN(f.L)+" см?",
        task.ans, "Возьми номер первой высоты в ленте, которая меньше порога.",
        "Берём первый подходящий шаг, а не предыдущий."));
    } else {
      steps.push({ q:"Что нужно сравнивать с порогом "+nb(fmtN(f.X))+" очков?",
        choice:{ options:[{t:"Сумму всех начисленных очков",ok:true},{t:"Очки за последнюю минуту",ok:false}],
          why:"Игрок копит очки, поэтому с порогом сравнивается сумма: 2, потом 2 + 4, потом 2 + 4 + 8 и так далее." } });
      steps.push({ build:{ adds:f.adds, sums:f.sums, X:f.X },
        q:"Построй таблицу по минутам кнопкой «Добавить минуту», пока сумма впервые не станет не меньше "+nb(fmtN(f.X))+" очков." });
      steps.push(st("Ответ: через сколько минут сумма впервые стала не меньше "+fmtN(f.X)+" очков?",
        task.ans, "Смотри на последнюю строку таблицы: её номер и есть ответ.",
        "Берём первую минуту, когда условие уже выполнилось."));
    }
  }

  else if(c==="PIC"){
    if(f.sub==="tables"){
      steps.push(st("Сравни первые случаи: 4, 6, 8 мест. Сколько мест добавляет каждый новый столик?", F(2),
        "Вычти соседние: 6 \u2212 4.", "Одинаковая прибавка."));
      steps.push(st("Сколько переходов от 1 столика до "+f.n+" столиков?", F(f.n-1),
        "Первый столик уже есть: добавляем остальные.", "Переходов n \u2212 1."));
      steps.push(st("На сколько мест больше станет за все добавления?", F(2*(f.n-1)),
        "Умножь 2 на "+(f.n-1)+".", "Общая прибавка мест."));
      steps.push(st("Ответ: сколько человек сядет за стол из "+f.n+" столиков?", task.ans,
        "К 4 местам первого столика прибавь общую прибавку.", "Старт 4 плюс прибавка."));
    } else if(f.sub==="logs"){
      const rows=[]; for(let i=1;i<=f.base;i++) rows.push(F(i));
      steps.push(st("Сколько рядов в кладке?", F(f.base),
        "Ряды идут от 1 бревна наверху до "+f.base+" внизу: рядов столько, сколько брёвен в нижнем ряду.", "Число рядов."));
      steps.push(st("Значит нужно сложить 1 + 2 + … + "+f.base+". Метод Гаусса: запишем эту сумму дважды, наоборот. Сложи первый столбик (выделен): 1 + "+f.base+"?"+
        gaussVisual(rows, {sumRow:false, hlCol:0}),
        F(f.base+1), "Сложи выделенные числа: 1 и "+f.base+".", "Столбик равен 1 + "+f.base+"."));
      steps.push(st("Все столбики одинаковые (нижняя строка). Удвоенная сумма — это столбик × число столбиков?"+
        gaussVisual(rows, {sumRow:true}),
        F((f.base+1)*f.base), "Умножь "+(f.base+1)+" на "+f.base+".", "2S = "+(f.base+1)+" · "+f.base+"."));
      steps.push(st("Разделим на 2 — вот сколько всего брёвен.", task.ans,
        "Дели "+fmtN(F((f.base+1)*f.base))+" пополам.", "Сумма посчитана дважды, делим на 2."));
    } else {
      const lens=[]; for(let i=1;i<=f.K;i++) lens.push(F(i));
      steps.push(st("Разные длины идут 1, 2, …, "+f.K+". Сложим их методом Гаусса: запишем дважды, наоборот. Сложи первый столбик (выделен): 1 + "+f.K+"?"+
        gaussVisual(lens, {sumRow:false, hlCol:0}),
        F(f.K+1), "Сложи выделенные числа: 1 и "+f.K+".", "Столбик равен 1 + "+f.K+"."));
      steps.push(st("Все столбики одинаковые (нижняя строка). Удвоенная сумма разных длин — столбик × их количество?"+
        gaussVisual(lens, {sumRow:true}),
        F(f.K*(f.K+1)), "Умножь "+(f.K+1)+" на "+f.K+".", "2S = "+(f.K+1)+" · "+f.K+"."));
      steps.push(st("Раздели на 2: это сумма 1 + 2 + … + "+f.K+".", F(f.K*(f.K+1)/2),
        "Дели "+fmtN(F(f.K*(f.K+1)))+" пополам.", "Сумма разных длин."));
      steps.push(st("В змейке каждая длина встречается два раза. Удвой сумму — это ответ.", task.ans,
        "Умножь "+fmtN(F(f.K*(f.K+1)/2))+" на 2.", "Каждое звено идёт парой."));
    }
  }

  else if(c==="TAXI"){
    steps.push(st("Сколько стоит одна минута после стартовых?", F(f.p),
      "Раздели "+fmtN(f.S2)+" рублей на "+f.M+" минут.", "Цена минуты."));
    steps.push(st("Сколько минут поездки не покрыто стартовой суммой?", F(f.T-f.K),
      "Стартовая сумма уже оплатила первые "+f.K+" "+T.words.minWord(f.K)+": вычти их из "+f.T+".", "Минуты сверх старта."));
    steps.push(st("Сколько стоят эти минуты?", F((f.T-f.K)*f.p),
      "Умножь "+(f.T-f.K)+" минут на цену минуты.", "Оплата поминутной части."));
    steps.push(st("Ответ: полная стоимость поездки?", task.ans,
      "Прибавь стартовую сумму "+fmtN(f.C0)+".", "Старт плюс поминутная часть."));
  }

  return steps;
}

/* ---------- Разбор двумя способами ---------- */
function fx(s){ return '<span class="formula">'+s+'</span>'; }
function sub_(v){ return '<i>'+v+'</i>'; }
const AN='<i>a</i><sub><i>n</i></sub>', A1='<i>a</i><sub>1</sub>', BN='<i>b</i><sub><i>n</i></sub>', B1='<i>b</i><sub>1</sub>', SN='<i>S</i><sub><i>n</i></sub>';

function shortTape(vals, labels, arrow, gp, maxCells){
  maxCells=maxCells||5;
  const cells=[];
  if(vals.length<=maxCells){
    vals.forEach((v,i)=>cells.push({idx:labels[i], val:fmtN(v), hl:i===vals.length-1}));
  } else {
    for(let i=0;i<3;i++) cells.push({idx:labels[i], val:fmtN(vals[i])});
    cells.push({dots:true});
    cells.push({idx:labels[vals.length-1], val:fmtN(vals[vals.length-1]), hl:true});
  }
  return tapeHTML(cells, arrow, {gp});
}

function ways(task){
  const f=task.facts, c=task.code;
  let wf="", wt="";
  const ansS=nb(fmtN(task.ans))+(task.unit? " "+task.unit:"");

  if(c==="AP-VAL"){
    const trans=f.trans;
    const vals=[f.a1]; for(let i=1;i<=trans;i++) vals.push(Fr.add(vals[i-1],f.d));
    const labels=vals.map((_,i)=> f.base===1? (i+1)+"-й" : i+" мин");
    wt=shortTape(vals,labels,plusStr(f.d),false)+"<p>Каждый шаг одна и та же прибавка "+nb(plusStr(f.d))+". Доходим до нужного шага: "+ansS+".</p>";
    wf="<p>"+fx(AN+" = "+A1+" + <i>d</i>(<i>n</i> \u2212 1)")+"</p><p>Переходов: "+nb(String(trans))+
      ". Подставляем: "+nb(fmtN(f.a1))+" + "+nb(fmtN(f.d))+" · "+nb(String(trans))+" = "+ansS+".</p>"+
      (f.base===0? "<p class='small muted'>Здесь отсчёт от нулевой минуты, поэтому переходов ровно "+trans+".</p>":"");
  }
  else if(c==="AP-SUM"){
    const vals=[f.a1]; for(let i=1;i<f.n;i++) vals.push(Fr.add(vals[i-1],f.d));
    const aN=vals[vals.length-1];
    const pair=Fr.add(f.a1,aN), twoS=Fr.mul(pair,F(f.n));
    wt=gaussVisual(vals, {sumRow:true})+
      "<p>Метод Гаусса: записали сумму дважды, все столбики по "+nb(fmtN(pair))+". Удвоенная сумма "+nb(fmtN(pair))+" · "+nb(String(f.n))+" = "+nb(fmtN(twoS))+", делим на 2: "+ansS+".</p>";
    wf="<p>"+fx(SN+" = "+fracHTML("("+A1+" + "+AN+") · <i>n</i>","2"))+"</p><p>Последний член: "+nb(fmtN(aN))+
      ". Сумма: ("+nb(fmtN(f.a1))+" + "+nb(fmtN(aN))+") · "+nb(String(f.n))+" ÷ 2 = "+ansS+".</p>";
  }
  else if(c==="AP-2PT"){
    if(f.sub==="press"){
      wt="<p>Каждые "+nb(fmtN(f.s))+" м давление падает на 1 мм. Отрезков подъёма: "+nb(String(f.k))+". Значит давление ниже на "+nb(String(f.k))+" мм: "+ansS+".</p>";
      wf="<p>Та же лесенка формулой: "+fx("<i>P</i> = <i>P</i><sub>1</sub> \u2212 "+fracHTML("\u0394<i>h</i>", fmtN(f.s)))+" = "+nb(fmtN(f.P1))+" \u2212 "+nb(String(f.k))+" = "+ansS+".</p>";
    } else {
      const span=f.m-f.k, d=Fr.div(Fr.sub(f.am,f.ak),F(span));
      wt="<p>Между известными точками "+nb(String(span))+" переходов и изменение "+nb(fmtN(Fr.sub(f.am,f.ak)))+
        ". Значит за один переход "+nb(plusStr(d))+". Шагаем дальше до цели: "+ansS+".</p>";
      wf="<p>"+fx("<i>d</i> = "+fracHTML("<i>a</i><sub><i>m</i></sub> \u2212 <i>a</i><sub><i>k</i></sub>","<i>m</i> \u2212 <i>k</i>"))+
        " = "+nb(fmtN(d))+", затем "+fx(AN+" = "+A1+" + <i>d</i>(<i>n</i> \u2212 1)")+" от известной точки: "+nb(fmtN(f.ak))+" + "+nb(fmtN(d))+" · "+nb(String(f.p-f.k))+" = "+ansS+".</p>";
    }
  }
  else if(c==="AP-SUM2DAY"){
    if(f.sub==="snail"){
      wt="<p>Пары «первый + последний», «второй + предпоследний» и так далее одинаковые: по "+nb(fmtN(f.Fs))+" м. Пар: половина числа дней. Значит дней 2 · "+nb(fmtN(f.S))+" ÷ "+nb(fmtN(f.Fs))+" = "+ansS+".</p>";
      wf="<p>"+fx(SN+" = "+fracHTML("("+A1+" + "+AN+") · <i>n</i>","2"))+" ⇒ "+fx("<i>n</i> = "+fracHTML("2"+sub_("S"),fmtN(f.Fs)))+" = "+ansS+".</p>";
    } else {
      const pairSum=Fr.div(Fr.mul(F(2),f.S),F(f.Nd));
      wt="<p>Средняя пара «первый + последний» = 2 · сумма ÷ дни = "+nb(fmtN(pairSum))+". Отсюда последний день, дневная прибавка "+nb(fmtN(f.d))+" и шагаем к "+f.k+"-му дню: "+ansS+".</p>";
      wf="<p>Из "+fx(SN+" = "+fracHTML("("+A1+" + "+AN+") · <i>n</i>","2"))+" находим "+AN+" = "+nb(fmtN(Fr.sub(pairSum,f.a1)))+
        ", затем <i>d</i> = "+nb(fmtN(f.d))+" и "+fx("<i>a</i><sub>"+f.k+"</sub> = "+A1+" + <i>d</i> · "+(f.k-1))+" = "+ansS+".</p>";
    }
  }
  else if(c==="GP-VAL"){
    const up = (f.sub==="grow" || f.sub==="dough");
    const down=!up;
    const vals=[f.m0]; for(let i=1;i<=f.k;i++) vals.push(down? Fr.div(vals[i-1],f.q):Fr.mul(vals[i-1],f.q));
    const labels= f.sub==="back"? vals.map((_,i)=>i===0?"стало":("\u2212"+i+" дел."))
      : f.sub==="filter"? vals.map((_,i)=>i===0?"вход":(i+" ф."))
      : vals.map((_,i)=>(i*(f.P||1))+" мин");
    const unitWord = f.sub==="filter"? "фильтру" : "периоду";
    wt=shortTape(vals,labels,(down?divStr(f.q):mulStr(f.q)),true,7)+
      "<p>По одному "+unitWord+" за раз: "+(down?"делим":"умножаем")+" на "+nb(fmtN(f.q))+". Итог "+ansS+".</p>";
    const countWord = f.sub==="filter"? "Фильтров" : "Периодов";
    wf="<p>"+fx(BN+" = "+B1+" · <i>q</i><sup><i>n</i> \u2212 1</sup>")+"</p><p>"+countWord+": "+nb(String(f.k))+
      ", общий множитель "+nb(fmtN(Fr.pow(f.q,f.k)))+". "+(down?"Делим":"Умножаем")+" "+nb(fmtN(f.m0))+": получаем "+ansS+".</p>";
  }
  else if(c==="GP-COMPL"){
    const A = f.styleB===false ? "реагента" : "А";
    const moved = f.styleB===false ? "перешло в осадок" : "стало Б";
    const vals=[f.m0]; for(let i=1;i<=f.k;i++) vals.push(Fr.div(vals[i-1],F(2)));
    wt=shortTape(vals,vals.map((_,i)=>(i*f.P)+" мин"),divStr(F(2)),true,7)+
      "<p>Осталось "+A+": "+nb(fmtN(f.rest))+" мг. Всё «ушедшее» "+moved+": "+nb(fmtN(f.m0))+" \u2212 "+nb(fmtN(f.rest))+" = "+ansS+".</p>";
    wf="<p>Остаток: "+fx(B1+" · "+fracHTML("1","2<sup>"+f.k+"</sup>"))+" = "+nb(fmtN(f.rest))+" мг. Что перешло: начальное количество минус остаток, то есть "+ansS+".</p>";
  }
  else if(c==="THRESH"){
    if(f.sub==="bounce"){
      wt=shortTape(f.seq,f.seq.map((_,i)=>"после "+(i+1)+"-го"),divStr(f.q),true,7)+
        "<p>Первая высота меньше "+nb(fmtN(f.L))+" см появляется на шаге "+ansS+". Берём именно первый подходящий шаг.</p>";
      wf="<p>Формула тут не короче таблицы: высоты "+fx("<i>h</i><sub><i>n</i></sub> = "+fmtN(f.h1)+" · "+fracHTML("1",fmtN(f.q)+"<sup><i>n</i> \u2212 1</sup>"))+", и всё равно проверяем номера по очереди до первого, где "+
        "<i>h</i><sub><i>n</i></sub> &lt; "+fmtN(f.L)+". Ответ "+ansS+".</p>";
    } else {
      const rows=Math.min(f.sums.length,4);
      let mini="<div class='small'>";
      for(let i=0;i<rows;i++) mini+= (i+1)+"-я мин: +"+fmtN(f.adds[i])+", всего "+fmtN(f.sums[i])+"<br>";
      mini+="…<br>"+f.sums.length+"-я мин: +"+fmtN(f.adds[f.sums.length-1])+", всего "+nb(fmtN(f.sums[f.sums.length-1]))+"</div>";
      wt=mini+"<p>Первая минута, когда сумма не меньше "+nb(fmtN(f.X))+": "+ansS+".</p>";
      wf="<p>Сумма удвоений 2 + 4 + … + 2<sup><i>n</i></sup> = "+fx("2<sup><i>n</i>+1</sup> \u2212 2")+". Подбираем первую степень, дающую не меньше "+nb(fmtN(f.X))+": получается "+ansS+". Таблица обычно надёжнее.</p>";
    }
  }
  else if(c==="PIC"){
    if(f.sub==="tables"){

/* Пункт 4: множитель -> геометрическая */
function renderL4(seed){
  const el=document.getElementById("L4"); if(!el) return;
  const r=T.rng(seed||(4000+Math.floor(Math.random()*1e6)));

  const ansVal=vals[k];
  learnState.l4={ans:ansVal, revealed:false, down, q};
  const cells=[];
  for(let i=0;i<=k;i++){
    if(i<k) cells.push({idx:(i*7)+" мин",val:fmtN(F(vals[i])), hl:i===k-1});
    else cells.push({idx:(i*7)+" мин",val:"?", hl:true});
  }

function newRec(task){ return { task, missed:false, shown:false, done:false }; }

    if(ok){

      if(moved) return;
      const v=ans.read();
      if(v===null){ fb.className="fb try"; fb.textContent="Впиши число."; return; }
      if(Fr.eq(v,s.a)){ moved=true; advance(i); return; }
      recMiss(ctx.rec);
      fb.className="fb try";
      if(Fr.eq(Fr.abs(v),Fr.abs(s.a))) fb.textContent="Почти! У числа не тот знак — поправь и нажми «Проверить».";
      else fb.innerHTML=s.hint;
    };
    div.querySelector("#"+id+"-sh").onclick=()=>{
      if(moved) return; moved=true;
      s._peeked=true; local.shown=true; ctx.rec.shown=true;
      ans.fill(s.a); ans.lock();
      fb.className="fb info"; fb.innerHTML=s.reveal;
      if(window.OgeCourseSharedMode)advance(i);else setTimeout(()=>advance(i),50);
    };
    ans.focus();
  }
  draw();
}

/* ================= ЗАЧЁТ (решения D15, D51): 10 задач, одна попытка ================= */
function buildQuiz14(){
  const codes=T.GEN_CODES.concat(["AP-VAL"]);
  for(let i=codes.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const x=codes[i]; codes[i]=codes[j]; codes[j]=x; }
  return codes.map(c=>T.makeTask(c, Math.floor(Math.random()*1e9)+1));
}
function renderQuiz(el){
  el.innerHTML=`<div class="card"><h2>Зачёт: ${QUIZ_TOTAL} задач</h2>
    <p>По одной задаче каждого из девяти типов и ещё одна — «значение на n-м шаге», самая частая форма задания 14. Одна попытка на задачу, без подсказок и разбора — как на экзамене. Зачёт сдан при ${PASS_AT} верных из ${QUIZ_TOTAL}.</p>
    <div class="btnrow"><button class="btn" type="button" id="q-start">Начать зачёт</button></div></div><div id="q-box"></div>`;
  el.querySelector("#q-start").onclick=()=>{ userActed=true; runQuiz(el); };
}
function runQuiz(el){
  const quiz=T.buildQuiz(), res=[];
  let idx=0;
  el.innerHTML='<div id="q-box"></div>';
  const box=el.querySelector("#q-box");
  function show(){
    if(idx>=quiz.length) return finishQuiz14(el,quiz,res);
    const t=quiz[idx];
    box.innerHTML=`<div class="card"><div class="small muted">Задача ${idx+1} из ${quiz.length}</div>
      <p class="task-text">${t.text}</p>${t.svg?`<div class="svgbox">${t.svg}</div>`:""}
      ${answerInput("q")}
      <div class="btnrow"><button class="btn" type="button" id="q-ok">Ответить</button><button class="ghost btn" type="button" id="q-next" style="display:none">${idx+1<quiz.length?"Дальше →":"Итоги →"}</button></div>
      <div class="fb" aria-live="polite" id="q-fb"></div></div>`;
    const ans=mountAnswer("q", t.unit), fb=box.querySelector("#q-fb"), bNext=box.querySelector("#q-next");
    let answered=false, moved=false;
    function answer(){
      if(answered) return;   // двойное касание — один ответ
      const v=ans.read();
      if(v===null){ fb.className="fb try"; fb.textContent="Впиши ответ — попытка не потрачена."; return; }
      answered=true;
      const ok=Fr.eq(v,t.ans), d=ok?null:t.distract.find(x=>Fr.eq(x.v,v));
      res.push({t,v,ok,diag:d?d.hint:""});
      CP.mlog(t.code,ok);
      ans.lock(); box.querySelector("#q-ok").disabled=true;
      fb.className="fb "+(ok?"ok":"try"); fb.textContent=ok?"Верно.":"Неверно.";
      bNext.style.display=""; focusEl(bNext);
    }
    box.querySelector("#q-ok").onclick=answer;
    box.querySelectorAll("input").forEach(i=>i.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); if(answered) bNext.click(); else answer(); } }));
    bNext.onclick=()=>{ if(!answered||moved) return; moved=true; idx++; show(); };
    ans.focus();
  }
  show();
}
function finishQuiz14(el,quiz,res){
  const score=res.filter(r=>r.ok).length;
  CP.finishQuiz(score,QUIZ_TOTAL);   // passed — только при PASS_AT из QUIZ_TOTAL и не снимается
  el.innerHTML=`<div class="card" aria-live="polite"><h2>${score} / ${QUIZ_TOTAL}</h2><p>${score>=PASS_AT
      ?"Зачёт сдан: "+score+" из "+QUIZ_TOTAL+" (нужно "+PASS_AT+")."

/* Общие проверки режима ?selftest=1 тренажёров алгебры курса ОГЭ (задача
   OGE_COURSE_03D_ALGEBRA). Блок побайтно одинаков во всех тренажёрах
   алгебры, где он есть; копии сверяет гейт tools/oge-algebra-contract.test.mjs.
   Каждая проверка дописывает ошибки в массив errs; прогресс ученика не трогается. */
const ASTK={
  /* чертёж: нет NaN/undefined/Infinity, все точки внутри viewBox (допуск tol) */
  svg:function(svg,tag,errs,tol){
    if(tol==null)tol=0.5;
    if(typeof svg!=='string'||svg.indexOf('<svg')<0){errs.push(tag+': нет чертежа');return;}
    if(/NaN|undefined|Infinity/.test(svg))errs.push(tag+': в чертеже NaN/undefined/Infinity');
    const vb=/viewBox="\s*(-?[\d.]+)[\s,]+(-?[\d.]+)[\s,]+(-?[\d.]+)[\s,]+(-?[\d.]+)\s*"/.exec(svg);
    if(!vb){errs.push(tag+': у чертежа нет viewBox');return;}
    const X0=+vb[1]-tol,Y0=+vb[2]-tol,X1=+vb[1]+(+vb[3])+tol,Y1=+vb[2]+(+vb[4])+tol;
    let out=0,first='';
    const at=function(x,y,what){if(!(x>=X0&&x<=X1&&y>=Y0&&y<=Y1)){out++;if(!first)first=what+' ('+Math.round(x)+'; '+Math.round(y)+')';}};
    const num=function(a,n){const m=new RegExp('\\s'+n+'="(-?[\\d.]+(?:e-?\\d+)?)"').exec(a);return m?+m[1]:null;};
    const re=/<(\w+)(\s[^>]*)?>/g;let m;
    while((m=re.exec(svg))){
      const el=m[1],a=m[2]||'';
      if(el==='svg')continue;
      [['x','y'],['x1','y1'],['x2','y2'],['cx','cy']].forEach(function(p){const x=num(a,p[0]),y=num(a,p[1]);if(x!=null&&y!=null)at(x,y,el);});
      if(el==='rect'){const x=num(a,'x')||0,y=num(a,'y')||0,w=num(a,'width'),h=num(a,'height');if(w!=null&&h!=null)at(x+w,y+h,'rect');}
      if(el==='circle'){const x=num(a,'cx'),y=num(a,'cy'),r=num(a,'r');if(x!=null&&y!=null&&r!=null){at(x-r,y,'circle');at(x+r,y,'circle');at(x,y-r,'circle');at(x,y+r,'circle');}}
      const pts=/\spoints="([^"]*)"/.exec(a);
      if(pts){const v=pts[1].trim().split(/[\s,]+/).map(Number);for(let i=0;i+1<v.length;i+=2)at(v[i],v[i+1],el);}
      const d=/\sd="([^"]*)"/.exec(a);
      if(d){/* конечные точки команд пути; относительные — от текущей точки */
        const tok=d[1].match(/[MLHVCSQTAZmlhvcsqtaz]|-?(?:\d+\.?\d*|\.\d+)(?:e-?\d+)?/g)||[];
        const need={M:2,L:2,H:1,V:1,C:6,S:4,Q:4,T:2,A:7,Z:0};
        let cx=0,cy=0,cmd='',i=0;
        while(i<tok.length){
          if(/[a-z]/i.test(tok[i])){cmd=tok[i++];if(/z/i.test(cmd))continue;}
          const n=need[cmd.toUpperCase()],rel=cmd!==cmd.toUpperCase();
          if(!n||i+n>tok.length)break;
          const v=tok.slice(i,i+n).map(Number);i+=n;
          const U=cmd.toUpperCase();
          if(U==='H'){cx=rel?cx+v[0]:v[0];}
          else if(U==='V'){cy=rel?cy+v[0]:v[0];}
          else{const ex=v[n-2],ey=v[n-1];cx=rel?cx+ex:ex;cy=rel?cy+ey:ey;}
          at(cx,cy,'path');
          if(U==='M')cmd=rel?'l':'L';
        }
      }
    }
    if(out)errs.push(tag+': за рамкой viewBox '+out+' точек, первая — '+first);
  },
  /* текст задачи, вариантов и сообщений: нет null, undefined, NaN, Infinity */
  text:function(html,tag,errs){
    const t=String(html).replace(/<[^>]*>/g,' ');
    const m=/\bnull\b|\bundefined\b|\bNaN\b|Infinity|\[object /.exec(t);
    if(m)errs.push(tag+': в тексте «'+m[0].trim()+'»');
  },
  /* ловушки {v, m}: ни одна не принимается как ответ, разные сообщения не ловят
     одно значение; same — равенство значений, show — запись значения в отчёте */
  traps:function(list,tag,errs,isAns,same,show){
    same=same||function(a,b){return a===b;};
    show=show||function(v){return String(v);};
    (list||[]).forEach(function(t,i){
      if(!t||!t.m)errs.push(tag+': ловушка без сообщения');
      if(isAns(t.v))errs.push(tag+': ловушка '+show(t.v)+' совпадает с ответом');
      for(let j=i+1;j<list.length;j++){const u=list[j];
        if(u.m!==t.m&&same(t.v,u.v))errs.push(tag+': две ловушки ловят одно значение '+show(t.v));}
    });
  },
  /* итог в консоль: маркер <ИМЯ>_SELFTEST_OK или _FAIL с числом ошибок */
  done:function(name,errs){
    if(typeof console==='undefined')return;
    if(!errs.length){console.log(name+'_SELFTEST_OK');return;}
    console.log(name+'_SELFTEST_FAIL '+errs.length);
    errs.slice(0,30).forEach(function(e){console.log('  '+e);});
  }
};

/* ?selftest=1: генераторы, ловушки, лестницы, рисунки, зачёт; ничего не пишет (CP.RO) */
function selftest14(){
  const T=T14, errs=[];
  const plain=h=>String(h).replace(/<[^>]*>/g,' ').replace(/(\d)[   ](?=\d{3})/g,'$1').replace(/−/g,'-');
  const hasNum=(text,v)=>{
    const f=plain(T.fmtN(v)).trim();
    return new RegExp('(^|[^\\d,])'+f.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?![\\d]|,\\d)').test(plain(text));
  };
  T.GEN_CODES.forEach(code=>{
    let full=0;
    for(let s=1;s<=200;s++){
      const t=T.makeTask(code, s*7919+13), tag=code+' #'+s;
      try{ if(!T.Fr.eq(T.GENS[code].sim(t), t.ans)) errs.push(tag+': пересчёт шагами не сходится'); }
      catch(e){ errs.push(tag+': '+e.message); }
      if(!T.decParts(t.ans)) errs.push(tag+': ответ не конечная десятичная дробь');
      ASTK.text(t.text,tag+' условие',errs); ASTK.text(t.hint1,tag+' ориентир',errs);
      t.distract.forEach(d=>ASTK.text(d.hint,tag+' ловушка',errs));
      if(t.svg) ASTK.svg(t.svg,tag+' рисунок',errs);
      /* ловушки: не ответ, разные сообщения не ловят одно значение; снятых после перевыбора нет */
      ASTK.traps(t.distract.map(d=>({v:d.v,m:d.hint})),tag,errs,v=>T.Fr.eq(v,t.ans),T.Fr.eq,v=>v.n+'/'+v.d);
      if(!t.distract.lost) full++;
      /* лестница любого способа кончается ответом */
      t.methods.forEach(m=>{
        const st=T.buildSteps(t,m).filter(x=>x.a!==undefined&&!x.choice&&!x.build);
        if(!st.length||!T.Fr.eq(st[st.length-1].a,t.ans)) errs.push(tag+': лестница «'+m+'» кончается не ответом');
        T.buildSteps(t,m).forEach(x=>ASTK.text(x.q+' '+(x.hint||''),tag+' ступень',errs));
      });
      /* ориентир и ловушки не называют ответ, если это не число из условия (D20) */
      if(!hasNum(t.text,t.ans)) [t.hint1].concat(t.distract.map(d=>d.hint)).forEach(h=>{ if(hasNum(h,t.ans)) errs.push(tag+': сообщение называет ответ'); });
      const w=T.ways(t); ASTK.text(w.f,tag+' формула',errs); ASTK.text(w.t,tag+' таблица',errs);
    }
    if(full<200*0.95) errs.push(code+': задач без снятых ловушек только '+full+' из 200');
  });
  const q=T.buildQuiz().map(t=>t.code).sort().join(',');
  if(q!==T.GEN_CODES.concat(['AP-VAL']).sort().join(',')) errs.push('зачёт: состав '+q);
  ASTK.done('OGE14',errs);
  return errs;
}

  const noteKey='mathexam.oge.algebra-notes.v1';

      for(let r=0;r<3;r++){const row=node('tr');for(let c=0;c<3;c++){const td=node('td'),input=node('input');input.type='text';input.maxLength=200;input.setAttribute('aria-label',['Величина или участник','Известное значение и единица','Выражение через неизвестное'][c]+', строка '+(r+1));input.value=saved.fields?.[r*3+c]||'';fields.push(input);td.append(input);row.append(td);}t.append(row);}scroll.append(t);table.append(scroll);close(table);}
    function save(){if(shared){const clean=(v,max)=>v.replace(/</g,'＜').replace(/>/g,'＞').replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g,'').slice(0,max);textarea.value=clean(textarea.value,6000);fields.forEach(x=>{x.value=clean(x.value,200);});}Object.assign(memory,readNotes());memory[storageId]={question,questionKey:key,text:textarea.value,checks:checks.map(x=>x.checked),fields:fields.map(x=>x.value),updated:Date.now(),number};if(shared){status.textContent='Запись видна участникам этой комнаты. Личный зачёт не изменяется.';return;}try{localStorage.setItem(noteKey,JSON.stringify(memory));status.textContent='Запись сохранена.';}catch(_){status.textContent='Запись сохранена на этой странице. Хранилище браузера сейчас недоступно.';}}

    const archive=details(box,'Мои записи к другим задачам');archive.addEventListener('toggle',()=>{if(!archive.open)return;Object.assign(memory,readNotes());archive.querySelectorAll('.oca-saved-entry').forEach(n=>n.remove());const entries=Object.values(memory).filter(x=>x&&x.number===number&&typeof x.question==='string'&&x.questionKey!==key&&(typeof x.text==='string'&&x.text||Array.isArray(x.fields)&&x.fields.some(Boolean))).sort((a,b)=>b.updated-a.updated);if(!entries.length)archive.append(node('p','Пока других записей нет.','oca-saved-entry'));for(const entry of entries){const item=node('details',undefined,'oca-saved-entry');item.append(node('summary',entry.question.slice(0,100)+(entry.question.length>100?'…':'')),node('p',entry.question),node('pre',entry.text||'(Заполнена таблица)'));if(Array.isArray(entry.fields)&&entry.fields.some(Boolean)){const p=node('p');p.textContent=entry.fields.filter(Boolean).join(' · ');item.append(p);}archive.append(item);}});

  function statementOf(card){let s=card.querySelector(routes[number][1]);if(s)return s;return [...card.children].find(n=>!n.classList.contains('oca-owned')&&!n.matches('details,button,.minimal-hint'))||card.firstElementChild;}

      const panel=helpPanel(card);if(panel){syncHelp(card,panel);addLab(panel);addReference(panel);if(!panel.querySelector(':scope > .oca-return')&&number!==7&&number!==14){const back=action('Вернуться к заданию',()=>{const toggle=card.querySelector('[aria-controls="'+panel.id+'"]')||card.querySelector('.bs,button.minimal-hint');if(toggle&&toggle.tagName==='BUTTON'){toggle.click();toggle.focus();}else{panel.hidden=true;}});back.classList.add('oca-return');panel.append(back);}}

  function scan(){
    scheduled=false;

    if(number>=20)d.querySelectorAll('.minimal-proof-note').forEach(n=>{const text='Проверяется ответ. Развёрнутое решение можно записать выше или в тетради.';if(n.textContent!==text)n.textContent=text;});
  }
// Bounded semantic state of the optional laboratories and notebook. Native

  function exactState(value,keys){

  const rangeLimits={7:[[-4,4,.25],[-4,4,.25]],8:[[1,4,1],[1,4,1]],10:[],12:[],14:[[1,7,1],[1,4,1],[1,3,1]],20:[[-5,5,1],[-3,3,1]]};
  const selectValues={7:[null],8:['product','power','square'],10:['ten','dice'],12:[null],14:['ap','gp'],20:[null]};
