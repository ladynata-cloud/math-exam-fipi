name: Verify the five-course assembly and build the geometry archive through the complete chapter XIV review
on:
  push:
    branches: ['work/school-six-geometry-review14-20261122']
    paths: ['.github/workflows/atanasyan-review14-six-package-verified.yml']
permissions:
  contents: write
jobs:
  verify-and-create-feature-branch:
    if: github.repository == 'ladynata-cloud/math-exam-fipi' && github.ref == 'refs/heads/work/school-six-geometry-review14-20261122'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SOURCE_SHA: b811085c66a498b6cd41a56a350b9f230d0bdf43
      SOURCE_TREE: 4738b636c4eb540a6bc3fe467e637b80b5f4e0c3
      SOURCE_BRANCH: integration/school-e2b8-review14-1157-source-20261122
      TARGET_BRANCH: integration/school-e2b8-review14-1157-offline-20261122
      ZIP_PATH: downloads/trainers/geometry-course/geometry-course-package.zip
      PREVIOUS_BLOB: 92d60501e2a871f93ce0913fdd1a36ff6e6de4ab
      EXPECTED_BLOB: 381575166c97aa0a9e601eb1ad37e6eb60bb026a
      EXPECTED_TREE: 0c040a4cc1881d67ae42c40f03df964ad935cca4
      PATCH_FOLDER: .github/atanasyan-offline-build/geometry-review14
      PATCH_BLOB: 8a374a6b2052d2cc401590e21a528fef67a4c076
    steps:
      - name: Check out the dedicated builder and its direct source parent
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/atanasyan-review14-six-package-verified.yml
            /.github/atanasyan-offline-build/geometry-review14/
            /geometry-course/
            /scripts/
            /assets/assistant/page-rollout.json
            /assets/assistant/home-link.js
            /assets/download-panel.css
            /assets/geometry-step-views.js
            /assets/site.css
            /ege-baza/return-to-course.js
            /learning/atanasyan-first-steps/
            /learning/ichenskaya-grade7-works/app.js
            /tools/public-navigator-preservation.cjs
            /tools/geometry-textbook/
            /content-drafts/atanasyan-grade8-area-842-844/
            /downloads/trainers-manifest.json
            /downloads/trainers/geometry-course/
      - name: Verify the source, every unpacked member, the binary and the clean result tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "${GITHUB_SHA}^")" = "$SOURCE_SHA"
          test "$(git rev-parse "${SOURCE_SHA}^{tree}")" = "$SOURCE_TREE"
          cat "$PATCH_FOLDER"/part-* > "$RUNNER_TEMP/reviewed-geometry.patch"
          test "$(git hash-object "$RUNNER_TEMP/reviewed-geometry.patch")" = "$PATCH_BLOB"
          git switch --detach "$SOURCE_SHA"
          test "$(git ls-remote --exit-code --heads origin "refs/heads/$SOURCE_BRANCH" | cut -f1)" = "$SOURCE_SHA"
          test -z "$(git ls-remote --heads origin "refs/heads/$TARGET_BRANCH")"
          test "$(git hash-object "$ZIP_PATH")" = "$PREVIOUS_BLOB"
          for book_unit in congruence_motion_review plane_map_review symmetry_motion_review; do
            python3 "tools/geometry-textbook/${book_unit}.py" --check
          done
          for check in congruence_motion_review plane_map_review symmetry_motion_review; do
            python3 "tools/geometry-textbook/check_${check}.py"
          done
          node scripts/build-trainer-downloads.mjs --only=geometry-course --downloads-only
          # The repository-wide export date does not belong to the single-book change.
          python3 - <<'PYCODE'
          import json, subprocess
          path = 'downloads/trainers-manifest.json'
          before = json.loads(subprocess.check_output(['git','show','HEAD:'+path]))
          with open(path, encoding='utf-8') as stream:
              after = json.load(stream)
          before.pop('updated'); after.pop('updated')
          assert before == after
          PYCODE
          git restore -- downloads/trainers-manifest.json
          mv "$ZIP_PATH" "$RUNNER_TEMP/rebuilt.zip"
          git restore -- "$ZIP_PATH"
          git apply --binary "$RUNNER_TEMP/reviewed-geometry.patch"
          test "$(git hash-object "$ZIP_PATH")" = "$EXPECTED_BLOB"
          test "$(wc -c < "$ZIP_PATH")" = "19377191"
          test "$(sha256sum "$ZIP_PATH" | cut -d' ' -f1)" = "cb3b5129e86d64f384cf65ca8c53e4db81fc9958c1a645dd15580915cee61327"
          python3 - "$RUNNER_TEMP/rebuilt.zip" "$ZIP_PATH" <<'PY'
          from pathlib import PurePosixPath
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as built, zipfile.ZipFile(sys.argv[2]) as reviewed:
              assert built.testzip() is None and reviewed.testzip() is None
              names = built.namelist()
              assert names == reviewed.namelist() and len(names) == len(set(names)) == 399
              assert 'Доступно карточек в задачнике: 2357.' in reviewed.read('README.txt').decode()
              for name in names:
                  assert not PurePosixPath(name).is_absolute() and '..' not in PurePosixPath(name).parts
                  assert built.read(name) == reviewed.read(name), name
                  before, after = built.getinfo(name), reviewed.getinfo(name)
                  assert (before.date_time, before.compress_type, before.external_attr) == (after.date_time, after.compress_type, after.external_attr), name
          PY
          test "$(git diff --name-only)" = "$ZIP_PATH"
          git add -- "$ZIP_PATH"
          test "$(git diff --cached --name-only)" = "$ZIP_PATH"
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Собрать 2357 карточек автономного задачника с движениями с самооценкой главы XIV и сохранить рабочие курсы'
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          git push --force-with-lease="refs/heads/${TARGET_BRANCH}:" origin "HEAD:refs/heads/${TARGET_BRANCH}"
          test "$(git ls-remote --exit-code --heads origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$(git rev-parse HEAD)"
          echo "Verified $SOURCE_SHA -> $(git rev-parse HEAD), $EXPECTED_TREE, $EXPECTED_BLOB" >> "$GITHUB_STEP_SUMMARY"
