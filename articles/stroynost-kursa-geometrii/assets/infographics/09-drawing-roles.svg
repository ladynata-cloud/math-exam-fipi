<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img"><title>Что делает чертёж в доказательстве</title><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#2B57C4"/></marker></defs><rect width="1200" height="700" fill="#FCFCF9"/><text x="60" y="58" text-anchor="start" style="font-size:36px;font-weight:700;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="60" dy="0">Что делает чертёж в доказательстве</tspan></text><text x="60" y="94" text-anchor="start" style="font-size:20px;font-weight:400;fill:#5A6B87;font-family:Arial,Segoe UI,sans-serif;"><tspan x="60" dy="0">Хороший рисунок помогает думать — и не выдаёт себя за аргумент</tspan></text><rect x="80" y="150" width="470" height="430" rx="20" fill="#DDEFE5" stroke="#2E7D4F" stroke-width="3"/><text x="315" y="205" text-anchor="middle" style="font-size:29px;font-weight:700;fill:#2E7D4F;font-family:Arial,Segoe UI,sans-serif;"><tspan x="315" dy="0">Чертёж помогает</tspan></text><circle cx="130" cy="257" r="10" fill="#2E7D4F" stroke="#2E7D4F" stroke-width="2"/><text x="160" y="265" text-anchor="start" style="font-size:20px;font-weight:400;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="160" dy="0">выделить данные</tspan></text><circle cx="130" cy="315" r="10" fill="#2E7D4F" stroke="#2E7D4F" stroke-width="2"/><text x="160" y="323" text-anchor="start" style="font-size:20px;font-weight:400;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="160" dy="0">увидеть взаимное положение</tspan></text><circle cx="130" cy="373" r="10" fill="#2E7D4F" stroke="#2E7D4F" stroke-width="2"/><text x="160" y="381" text-anchor="start" style="font-size:20px;font-weight:400;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="160" dy="0">найти вспомогательную линию</tspan></text><circle cx="130" cy="431" r="10" fill="#2E7D4F" stroke="#2E7D4F" stroke-width="2"/><text x="160" y="439" text-anchor="start" style="font-size:20px;font-weight:400;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="160" dy="0">удержать обозначения</tspan></text><circle cx="130" cy="489" r="10" fill="#2E7D4F" stroke="#2E7D4F" stroke-width="2"/><text x="160" y="497" text-anchor="start" style="font-size:20px;font-weight:400;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="160" dy="0">проверить, все ли случаи рассмотрены</tspan></text><rect x="650" y="150" width="470" height="430" rx="20" fill="#F1DFE0" stroke="#C24A4A" stroke-width="3"/><text x="885" y="205" text-anchor="middle" style="font-size:29px;font-weight:700;fill:#C24A4A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="885" dy="0">Чертёж подменяет</tspan></text><circle cx="700" cy="257" r="10" fill="#C24A4A" stroke="#C24A4A" stroke-width="2"/><text x="730" y="265" text-anchor="start" style="font-size:20px;font-weight:400;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="730" dy="0">«видно, что равны»</tspan></text><circle cx="700" cy="315" r="10" fill="#C24A4A" stroke="#C24A4A" stroke-width="2"/><text x="730" y="323" text-anchor="start" style="font-size:20px;font-weight:400;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="730" dy="0">частный случай выдаётся за общий</tspan></text><circle cx="700" cy="373" r="10" fill="#C24A4A" stroke="#C24A4A" stroke-width="2"/><text x="730" y="381" text-anchor="start" style="font-size:20px;font-weight:400;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="730" dy="0">выпуклость молча предполагается</tspan></text><circle cx="700" cy="431" r="10" fill="#C24A4A" stroke="#C24A4A" stroke-width="2"/><text x="730" y="439" text-anchor="start" style="font-size:20px;font-weight:400;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="730" dy="0">точка считается внутренней по рисунку</tspan></text><circle cx="700" cy="489" r="10" fill="#C24A4A" stroke="#C24A4A" stroke-width="2"/><text x="730" y="497" text-anchor="start" style="font-size:20px;font-weight:400;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="730" dy="0">масштаб создаёт ложную очевидность</tspan></text><text x="1162" y="676" text-anchor="end" style="font-size:16px;font-weight:400;fill:#5A6B87;font-family:Arial,Segoe UI,sans-serif;"><tspan x="1162" dy="0">Схема: Н. М. Алябьева · MathExam</tspan></text></svg>