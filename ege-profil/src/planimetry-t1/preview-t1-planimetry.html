<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Банк задания 1 · планиметрия — образцы</title>
<style>
  :root{
    --paper:#FAFAF4;
    --ink:#1E3A9F;
    --text:#26304a;
    --muted:#7a8299;
    --line:#e2e2d6;
    --curve:#C77B48;
    --dot:#7A4A1E;
    --ok:#0f8a59;
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--paper); color:var(--text);
       font:16px/1.55 -apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:900px; margin:0 auto; padding:28px 20px 64px}
  h1{font-size:26px; color:var(--ink); margin:0 0 6px; letter-spacing:-.01em}
  .sub{color:var(--muted); margin:0 0 26px; font-size:15px}
  .card{background:#fff; border:1px solid var(--line); border-radius:12px;
        padding:18px 20px; margin-bottom:16px}
  .tag{display:inline-block; font-size:12px; font-weight:600; letter-spacing:.06em;
       text-transform:uppercase; color:var(--ink); background:#eef1fb;
       border-radius:99px; padding:4px 11px; margin-bottom:10px}
  .tag em{font-style:normal; color:var(--muted); font-weight:500; text-transform:none; letter-spacing:0}
  .q{margin:0 0 12px}
  .figwrap{margin:12px 0; padding:10px; border:1px solid var(--line);
           border-radius:9px; display:inline-block; background:#fff}
  .ans{color:var(--ok); font-weight:700}
  .steps{margin:10px 0 0; padding-left:20px; color:#3d4560}
  .steps li{margin:5px 0}
  .traps{margin:12px 0 0; font-size:14px; color:var(--muted);
         border-top:1px dashed var(--line); padding-top:10px}
  .traps b{color:var(--dot); font-weight:600}
  button{font:inherit; font-weight:600; color:#fff; background:var(--ink); border:0;
         border-radius:9px; padding:10px 18px; cursor:pointer; margin-bottom:22px}

  /* --- чертёж --- */
  svg.fig{display:block; max-width:100%; height:auto}
  .shape{fill:rgba(30,58,159,.05); stroke:var(--ink); stroke-width:1.7; stroke-linejoin:round}
  .shape2{fill:none; stroke:var(--ink); stroke-width:1.7; stroke-linejoin:round}
  .sg{stroke:var(--ink); stroke-width:1.5; fill:none}
  .sg2{stroke:var(--curve); stroke-width:2; fill:none}
  .aux{stroke:var(--muted); stroke-width:1.2; stroke-dasharray:5 4; fill:none}
  .tk{stroke:var(--dot); stroke-width:1.6}
  .ar{stroke:var(--dot); stroke-width:1.4}
  .nd{fill:var(--ink)}
  .nd2{fill:var(--muted)}
  .lb{font:italic 600 14px "Segoe UI",sans-serif; fill:var(--text)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Задание 1 · планиметрия</h1>
  <p class="sub">По одному образцу каждого из девятнадцати типов. Прототипы — сборник Ященко, 36 вариантов, 2026.</p>
  <button id="again">Пересобрать задачи</button>
  <div id="host"></div>
</div>

<script src="bank-t1-planimetry.js"></script>
<script>
(function(){
  var host = document.getElementById('host');
  function render(){
    host.innerHTML = '';
    YB1.items.forEach(function(item){
      var q = YB1.make(item.id);
      var el = document.createElement('div');
      el.className = 'card';
      el.innerHTML =
        '<div class="tag">' + item.id + ' · ' + item.name + ' <em>(' + item.src + ')</em></div>' +
        '<p class="q">' + q.text + '</p>' +
        (q.fig ? '<div class="figwrap">' + q.fig + '</div>' : '') +
        '<p>Ответ: <span class="ans">' + YB1.num(q.ans) + '</span></p>' +
        '<ol class="steps">' + q.steps.map(function(s){ return '<li>' + s + '</li>'; }).join('') + '</ol>' +
        '<div class="traps">Диагностика неверных ответов: ' +
          q.traps.map(function(t){ return '<b>' + YB1.num(t.v) + '</b> — ' + t.msg; }).join(' ') +
        '</div>';
      host.appendChild(el);
    });
  }
  YB1.srand(Date.now() % 100000);
  render();
  document.getElementById('again').addEventListener('click', function(){
    YB1.srand((Date.now() * 7 + 13) % 1000000);
    render();
  });
})();
</script>
</body>
</html>
