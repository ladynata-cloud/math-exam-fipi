name: Lesson workspace v1 — private preparation and classroom continuity

on:
  pull_request:
    paths:
      - 'learning/**'
      - 'board-server/**'
      - 'ege-baza/path/**'
      - 'trainers/learning-bridge.js'
      - 'tools/lesson-workspace-v1/**'
      - 'tools/learning-cabinet.browser.cjs'
      - 'tools/learning-course-navigation.browser.cjs'
      - '.github/workflows/lesson-workspace-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lesson-workspace-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lesson-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: board-server/package-lock.json
      - name: Install locked backend dependencies
        run: npm --prefix board-server ci --include=optional
      - name: Install pinned browser and DOM tools
        run: |
          npm install --prefix "$RUNNER_TEMP/lesson-workspace-tools" --no-save --no-package-lock --ignore-scripts playwright@1.62.1 jsdom@26.1.0
          "$RUNNER_TEMP/lesson-workspace-tools/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/lesson-workspace-tools/node_modules" >> "$GITHUB_ENV"
      - name: Contracts, DOM, real pair browser and existing classroom regressions
        env:
          LESSON_WORKSPACE_ARTIFACTS: ${{ runner.temp }}/lesson-workspace-evidence
          LEARNING_BROWSER_ARTIFACTS: ${{ runner.temp }}/lesson-workspace-evidence/existing-classroom
        run: node tools/lesson-workspace-v1/gate.cjs
      - name: Synthetic browser and layout evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lesson-workspace-v1-evidence
          path: ${{ runner.temp }}/lesson-workspace-evidence/
          if-no-files-found: warn
          retention-days: 14
