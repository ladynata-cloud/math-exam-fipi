<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><title>От наглядной геометрии к доказательной</title><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#2B57C4"/></marker></defs><rect width="1200" height="720" fill="#FCFCF9"/><text x="60" y="58" text-anchor="start" style="font-size:36px;font-weight:700;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="60" dy="0">От наглядной геометрии к доказательной</tspan></text><text x="60" y="94" text-anchor="start" style="font-size:20px;font-weight:400;fill:#5A6B87;font-family:Arial,Segoe UI,sans-serif;"><tspan x="60" dy="0">Линия, которую важно не обрывать на границе 6 и 7 класса</tspan></text><rect x="45" y="145" width="190" height="165" rx="16" fill="#DCE7FF" stroke="#D9DFE9" stroke-width="2"/><text x="140" y="180" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="140" dy="0">5 класс</tspan></text><text x="140" y="220" text-anchor="middle" style="font-size:18px;font-weight:600;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="140" dy="0">Рисовать,</tspan></text><text x="140" y="247" text-anchor="middle" style="font-size:18px;font-weight:600;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="140" dy="0">измерять,</tspan></text><text x="140" y="274" text-anchor="middle" style="font-size:18px;font-weight:600;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="140" dy="0">называть</tspan></text><line x1="238" y1="228" x2="270" y2="228" stroke="#2B57C4" stroke-width="4" marker-end="url(#arrow)"/><rect x="275" y="145" width="190" height="165" rx="16" fill="#DDEFE5" stroke="#D9DFE9" stroke-width="2"/><text x="370" y="180" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="370" dy="0">6 класс</tspan></text><text x="370" y="220" text-anchor="middle" style="font-size:18px;font-weight:600;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="370" dy="0">Наблюдать,</tspan></text><text x="370" y="247" text-anchor="middle" style="font-size:18px;font-weight:600;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="370" dy="0">перегибать,</tspan></text><text x="370" y="274" text-anchor="middle" style="font-size:18px;font-weight:600;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="370" dy="0">предполагать</tspan></text><line x1="468" y1="228" x2="500" y2="228" stroke="#2B57C4" stroke-width="4" marker-end="url(#arrow)"/><rect x="505" y="145" width="190" height="165" rx="16" fill="#F7E9C7" stroke="#D9DFE9" stroke-width="2"/><text x="600" y="180" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="600" dy="0">7 класс</tspan></text><text x="600" y="220" text-anchor="middle" style="font-size:18px;font-weight:600;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="600" dy="0">Определять,</tspan></text><text x="600" y="247" text-anchor="middle" style="font-size:18px;font-weight:600;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="600" dy="0">доказывать,</tspan></text><text x="600" y="274" text-anchor="middle" style="font-size:18px;font-weight:600;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="600" dy="0">обосновывать</tspan></text><line x1="698" y1="228" x2="730" y2="228" stroke="#2B57C4" stroke-width="4" marker-end="url(#arrow)"/><rect x="735" y="145" width="190" height="165" rx="16" fill="#E9E1FA" stroke="#D9DFE9" stroke-width="2"/><text x="830" y="180" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="830" dy="0">8 класс</tspan></text><text x="830" y="220" text-anchor="middle" style="font-size:18px;font-weight:600;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="830" dy="0">Строить</tspan></text><text x="830" y="247" text-anchor="middle" style="font-size:18px;font-weight:600;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="830" dy="0">системы признаков</tspan></text><line x1="928" y1="228" x2="960" y2="228" stroke="#2B57C4" stroke-width="4" marker-end="url(#arrow)"/><rect x="965" y="145" width="190" height="165" rx="16" fill="#F1DFE0" stroke="#D9DFE9" stroke-width="2"/><text x="1060" y="180" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="1060" dy="0">9 класс</tspan></text><text x="1060" y="220" text-anchor="middle" style="font-size:18px;font-weight:600;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="1060" dy="0">Сравнивать</tspan></text><text x="1060" y="247" text-anchor="middle" style="font-size:18px;font-weight:600;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="1060" dy="0">методы</tspan></text><rect x="160" y="355" width="880" height="92" rx="16" fill="#FFFFFF" stroke="#C24A4A" stroke-width="3"/><text x="600" y="391" text-anchor="middle" style="font-size:23px;font-weight:700;fill:#C24A4A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="600" dy="0">Главная проверка преемственности</tspan></text><text x="600" y="424" text-anchor="middle" style="font-size:19px;font-weight:400;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="600" dy="0">меняется ли статус знания: «увидели» → «предположили» → «доказали»</tspan></text><line x1="100" y1="575" x2="1110" y2="575" stroke="#22304A" stroke-width="3" marker-end="url(#arrow)"/><circle cx="140" cy="540" r="42" fill="#FFFFFF" stroke="#2B57C4" stroke-width="3"/><text x="140" y="547" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#2B57C4;font-family:Arial,Segoe UI,sans-serif;"><tspan x="140" dy="0">опыт</tspan></text><line x1="140" y1="575" x2="140" y2="590" stroke="#22304A" stroke-width="2"/><text x="140" y="625" text-anchor="middle" style="f