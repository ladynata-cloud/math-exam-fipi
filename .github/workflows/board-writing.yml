name: Individual board — writing tools
on:
  pull_request:
    paths:
      - 'trainers/trainer-board.html'
      - 'trainers/board-ink.js'
      - 'trainers/board-images.js'
      - 'trainers/board-writing.js'
      - 'trainers/board-layout.js'
      - 'trainers/board-tools.css'
      - 'trainers/board-workspace.js'
      - 'trainers/board-picker.js'
      - 'trainers/board-picker.css'
      - 'trainers/board-bridge.js'
      - 'board-server/**'
      - 'tools/board-writing.browser.cjs'
      - 'tools/board-room-error.test.cjs'
      - 'tools/trainer-registry-client-cutover-smoke.cjs'
      - 'tools/board-ink.test.cjs'
      - 'tools/board-images.test.cjs'
      - 'tools/board-picker-smoke.cjs'
      - '.github/workflows/board-writing.yml'
  push:
    branches: [main]
    paths:
      - 'trainers/trainer-board.html'
      - 'trainers/board-ink.js'
      - 'trainers/board-images.js'
      - 'trainers/board-writing.js'
      - 'trainers/board-layout.js'
      - 'trainers/board-tools.css'
      - 'trainers/board-workspace.js'
      - 'trainers/board-picker.js'
      - 'trainers/board-picker.css'
      - 'trainers/board-bridge.js'
      - 'board-server/**'
      - 'tools/board-writing.browser.cjs'
      - 'tools/board-room-error.test.cjs'
      - 'tools/trainer-registry-client-cutover-smoke.cjs'
      - 'tools/board-ink.test.cjs'
      - 'tools/board-images.test.cjs'
      - 'tools/board-picker-smoke.cjs'
      - '.github/workflows/board-writing.yml'
permissions:
  contents: read
concurrency:
  group: board-writing-${{ github.ref }}
  cancel-in-progress: true
jobs:
  writing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Fetch immutable legacy-host fixture for registry regression
        run: git fetch --no-tags --depth=1 origin e9097137b6cd66d80962cadcef336255db28e9b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: board-server/package-lock.json
      - name: Install locked server and pinned test tools
        run: |
          npm ci --prefix board-server --include=optional
          npm install --prefix "$RUNNER_TEMP/board-writing-browser" --no-save --no-package-lock --ignore-scripts playwright@1.62.1 jsdom@26.1.0
          "$RUNNER_TEMP/board-writing-browser/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/board-writing-browser/node_modules" >> "$GITHUB_ENV"
      - name: Coordinates, compatible shapes and bounded image imports
        run: node --test tools/board-ink.test.cjs tools/board-images.test.cjs
      - name: Terminal room rejection and local recovery
        run: node --test tools/board-room-error.test.cjs
      - name: Individual writing and real local collaboration
        env:
          BOARD_WRITING_ARTIFACTS: ${{ runner.temp }}/board-writing-artifacts
        run: node tools/board-writing.browser.cjs
      - name: Existing picker, layout and drawing-persistence regression
        run: node tools/board-picker-smoke.cjs
      - name: Registry arrival and reconnection preserve session boundaries
        run: |
          B2_SMOKE_SECTION=arrival node tools/trainer-registry-client-cutover-smoke.cjs
          B2_SMOKE_SECTION=reconnect node tools/trainer-registry-client-cutover-smoke.cjs
      - name: Save local acceptance screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: individual-board-writing
          path: ${{ runner.temp }}/board-writing-artifacts
          if-no-files-found: ignore
          retention-days: 7
