name: Vilenkin 5 full course and shared board
on:
  pull_request:
    paths:
      - 'school/**'
      - 'courses/vilenkin-5/**'
      - 'courses/vilenkin-5-part-1/**'
      - 'trainers/vilenkin5.html'
      - 'trainers/board-compat.json'
      - 'trainers/board-picker.js'
      - 'tools/vilenkin5-quality*'
      - 'tools/vilenkin5-media.test.cjs'
      - 'tools/vilenkin5-board-picker.test.cjs'
      - 'tools/build-vilenkin5-animations.py'
      - 'tools/public-page-script.cjs'
      - '.github/workflows/vilenkin5-course-quality.yml'
  push:
    branches: [main]
    paths:
      - 'school/**'
      - 'courses/vilenkin-5/**'
      - 'courses/vilenkin-5-part-1/**'
      - 'trainers/vilenkin5.html'
      - 'trainers/board-compat.json'
      - 'trainers/board-picker.js'
      - 'tools/vilenkin5-quality*'
      - 'tools/vilenkin5-media.test.cjs'
      - 'tools/vilenkin5-board-picker.test.cjs'
      - 'tools/build-vilenkin5-animations.py'
      - '.github/workflows/vilenkin5-course-quality.yml'
permissions:
  contents: read
jobs:
  mathematics-and-state:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax, mathematics and preserved old work
        run: |
          node --check school/app.js
          node --check school/vilenkin5-quality.js
          node --check school/vilenkin5-quality-models.js
          node --check school/vilenkin5-media.js
          node --check school/vilenkin5-board.js
          node tools/vilenkin5-board-picker.test.cjs
          node tools/textbook-vilenkin5.test.cjs
          node tools/textbook-vilenkin-full.test.cjs
          node tools/workshop-state.test.cjs
          node --test tools/workshop-vilenkin-resume.test.cjs
      - name: Exact animation assets
        run: |
          python3 -m pip install Pillow==13.0.0
          python3 tools/build-vilenkin5-animations.py --check
      - name: Independent DOM and board contracts
        run: |
          npm install --prefix "$RUNNER_TEMP/vilenkin5-qa" --no-audit --no-fund jsdom@26.1.0
          export NODE_PATH="$RUNNER_TEMP/vilenkin5-qa/node_modules"
          node tools/vilenkin5-quality.test.cjs
          node --test school/test-vilenkin5-board.cjs
          node tools/vilenkin5-media.test.cjs
          git diff --check
  real-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Chromium and locked board server
        run: |
          npm --prefix board-server ci --include=optional
          npm install --prefix "$RUNNER_TEMP/vilenkin5-browser" --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/vilenkin5-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Full course, saved work, GIF and responsive layouts
        env:
          NODE_PATH: ${{ runner.temp }}/vilenkin5-browser/node_modules
          V5_QUALITY_SHOTS: artifacts/vilenkin5-quality
        run: node tools/vilenkin5-quality.browser.cjs
      - name: Unchanged shared-school course regression
        env:
          NODE_PATH: ${{ runner.temp }}/vilenkin5-browser/node_modules
        run: node tools/makarychev7-start.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vilenkin5-course-visuals
          path: artifacts/vilenkin5-quality
          if-no-files-found: error
          retention-days: 14
  shared-board:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Chromium and locked board server
        run: |
          npm --prefix board-server ci --include=optional
          npm install --prefix "$RUNNER_TEMP/vilenkin5-browser" --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/vilenkin5-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Real participants, control handoff and handwriting
        env:
          NODE_PATH: ${{ runner.temp }}/vilenkin5-browser/node_modules
          VILENKIN5_BOARD_SHOTS: artifacts/vilenkin5-board
        run: node school/test-vilenkin5-board.browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vilenkin5-board-visuals
          path: artifacts/vilenkin5-board
          if-no-files-found: error
          retention-days: 14
