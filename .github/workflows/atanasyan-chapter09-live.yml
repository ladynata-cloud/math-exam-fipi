name: Atanasyan IX — source-bound public release smoke
on:
  pull_request:
    paths:
      - 'geometry-course/textbook/**'
      - 'tools/geometry-textbook/chapter09-live.browser.cjs'
      - 'tools/geometry-textbook/caption_expectations.cjs'
      - '.github/workflows/atanasyan-chapter09-live.yml'
  push:
    branches: [main]
    paths:
      - 'geometry-course/textbook/**'
      - 'tools/geometry-textbook/chapter09-live.browser.cjs'
      - 'tools/geometry-textbook/caption_expectations.cjs'
      - '.github/workflows/atanasyan-chapter09-live.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-release-smoke:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - name: Verify exact bytes and isolated browser journeys
        env:
          ATANASYAN_IX_MODE: ${{ github.event_name == 'pull_request' && 'local' || 'https' }}
          ATANASYAN_IX_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          ATANASYAN_IX_ARTIFACTS: artifacts/atanasyan-chapter09-live
        run: node tools/geometry-textbook/chapter09-live.browser.cjs
      - name: Preserve smoke evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atanasyan-chapter09-live
          path: artifacts/atanasyan-chapter09-live/
          retention-days: 14
          if-no-files-found: error
