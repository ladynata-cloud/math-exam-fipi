name: Search entry geometry learning and retained work

on:
  pull_request:
    paths:
      - 'index.html'
      - 'geometry-course/textbook/index.html'
      - 'geometry-course/board/learning-support.js'
      - 'geometry-course/trainers/ch4-p1-t2-proof-angle-sum.html'
      - 'geometry-course/trainers/ch2-p3-t2-proof-asa.html'
      - 'geometry-course/assets/search-entry-proof.*'
      - 'geometry-pogorelov/assets/lesson.js'
      - 'geometry-pogorelov/atlas/pogorelov-base-8-58.html'
      - 'tools/search-entry*'
      - 'tools/fixtures/search-entry-proof-legacy.json'
      - 'tools/geometry-textbook/search*'
      - 'tools/geometry-textbook/layout_amendment.py'
      - 'tools/pogorelov/build.py'
      - '.github/workflows/search-entry-geometry.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search-entries:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - name: Install isolated browser and DOM dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/search-entry-qa" --no-save --no-package-lock --ignore-scripts playwright@1.62.1 jsdom@26.1.0
          "$RUNNER_TEMP/search-entry-qa/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/search-entry-qa/node_modules" >> "$GITHUB_ENV"
      - name: Mathematics, independent work and exact historical identities
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          node --test tools/search-entry-proof.test.cjs
          python3 tools/geometry-textbook/layout-amendment.test.py
          python3 tools/geometry-textbook/search-entry-amendment.test.py
          python3 tools/geometry-textbook/build_course.py --check
          node tools/geometry-textbook/check_course.cjs --require-reviewed
          node tools/geometry-textbook/runtime_check.cjs
          node tools/pogorelov/check.cjs
          python3 tools/pogorelov/build.py
          git diff --exit-code -- geometry-pogorelov
          git diff --check
      - name: Public entrances, old recordings and retained drafts
        env:
          SEARCH_ENTRY_ARTIFACTS: ${{ runner.temp }}/search-entry-evidence
          SEARCH_ENTRY_PROOF_OUTPUT: ${{ runner.temp }}/search-entry-evidence/proofs
          GEOMETRY_ENTRY_ARTIFACTS: ${{ runner.temp }}/search-entry-evidence/textbook-entry
        run: |
          node tools/search-entry-proof.browser.cjs
          node tools/geometry-textbook/search-entry.browser.cjs
          node tools/search-entry-geometry.browser.cjs
          node tools/pogorelov/browser.cjs
      - name: First viewport regression across the complete workbook
        env:
          GEOMETRY_VIEWPORT_ARTIFACTS: ${{ runner.temp }}/search-entry-evidence/workbook
        run: node tools/geometry-textbook/first-viewport.browser.cjs
      - name: Browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: search-entry-geometry-evidence
          path: ${{ runner.temp }}/search-entry-evidence/
          if-no-files-found: warn
          retention-days: 7
