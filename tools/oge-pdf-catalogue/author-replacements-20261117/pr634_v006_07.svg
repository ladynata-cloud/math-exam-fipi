<svg xmlns="http://www.w3.org/2000/svg" width="570" height="105" viewBox="0 0 570 105" role="img" aria-label="Координатная прямая, подписаны 9, 10 и 11. Между первыми двумя отметками слева направо стоят точки A и B, между второй и третьей — C и D. A и C левее середины своего единичного отрезка, B и D правее." font-family="DejaVu Sans, sans-serif" fill="#17191b"><title>Координатная прямая, подписаны 9, 10 и 11. Между первыми двумя отметками слева направо стоят точки A и B, между второй и третьей — C и D. A и C левее середины своего единичного отрезка, B и D правее.</title><rect width="570" height="105" fill="white"/><line x1="28.000" y1="53.000" x2="528.000" y2="53.000" stroke="#17191b" stroke-width="2"/><polygon points="541,53 526,48 526,58"/><line x1="78.000" y1="44.000" x2="78.000" y2="62.000" stroke="#17191b" stroke-width="2"/><text x="78" y="86" font-size="24" text-anchor="middle">9</text><line x1="279.000" y1="44.000" x2="279.000" y2="62.000" stroke="#17191b" stroke-width="2"/><text x="279" y="86" font-size="24" text-anchor="middle">10</text><line x1="480.000" y1="44.000" x2="480.000" y2="62.000" stroke="#17191b" stroke-width="2"/><text x="480" y="86" font-size="24" text-anchor="middle">11</text><circle cx="116.190000" cy="53" r="5.4" data-point="A"/><text x="116.19" y="35" font-size="24" text-anchor="middle" font-weight="700">A</text><circle cx="228.105663" cy="53" r="5.4" data-point="B"/><text x="228.106" y="35" font-size="24" text-anchor="middle" font-weight="700">B</text><circle cx="347.340000" cy="53" r="5.4" data-point="C"/><text x="347.34" y="35" font-size="24" text-anchor="middle" font-weight="700">C</text><circle cx="433.770000" cy="53" r="5.4" data-point="D"/><text x="433.77" y="35" font-size="24" text-anchor="middle" font-weight="700">D</text></svg>