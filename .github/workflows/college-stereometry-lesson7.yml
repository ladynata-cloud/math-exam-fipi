name: College stereometry lesson 7

on:
  pull_request:
    paths:
      - 'trainers/college-stereometry/**'
      - 'downloads/trainers/college-stereometry-lesson-7/**'
      - 'tools/college-stereometry-lesson7.test.cjs'
      - '.github/workflows/college-stereometry-lesson7.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lesson7:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Answer checks, section state and student package
        run: node --test tools/college-stereometry-lesson7.test.cjs
      - name: Retained pyramid lesson
        run: node tools/college-stereometry-pyramids.test.cjs
      - name: Patch whitespace
        run: git diff --check
