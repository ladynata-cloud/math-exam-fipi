permissions:
  contents: read
jobs:
  practice:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.62.1 && npx playwright install --with-deps chromium
      - run: python3 content-drafts/atanasyan-grade8-area-842-844/verify_areas.py && python3 tools/geometry-textbook/build_area_lessons.py --check && python3 tools/geometry-textbook/build_area_similarity.py --check && python3 tools/geometry-textbook/check_area_supplement.py && python3 tools/geometry-textbook/check_area_similarity.py && python3 tools/geometry-textbook/build_midpoint_lessons.py --check && python3 tools/geometry-textbook/check_midpoint_lessons.py
      - run: python3 tools/geometry-textbook/build_circle_lessons.py --check && python3 tools/geometry-textbook/check_circle_lessons.py
      - run: python3 tools/geometry-textbook/build_grade9_vectors.py --check && python3 tools/geometry-textbook/check_grade9_vectors.py
      - run: python3 tools/geometry-textbook/build_vector_conclusions.py --check && python3 tools/geometry-textbook/check_vector_conclusions.py
      - run: python3 tools/geometry-textbook/build_vector_sums.py --check && python3 tools/geometry-textbook/check_vector_sums.py
      - run: python3 tools/geometry-textbook/vector_sum_problems.py --check && python3 tools/geometry-textbook/check_vector_sum_problems.py
      - run: python3 tools/geometry-textbook/vector_identities.py --check && python3 tools/geometry-textbook/check_vector_identities.py
      - run: python3 tools/geometry-textbook/vector_scaling.py --check && python3 tools/geometry-textbook/check_vector_scaling.py
      - run: python3 tools/geometry-textbook/scalar_problems.py --check && python3 tools/geometry-textbook/check_scalar_problems.py
      - run: python3 tools/geometry-textbook/vector_midpoint_proofs.py --check && python3 tools/geometry-textbook/check_vector_midpoint_proofs.py
      - run: python3 tools/geometry-textbook/vector_applications.py --check && python3 tools/geometry-textbook/check_vector_applications.py
      - run: python3 tools/geometry-textbook/vector_length_problems.py --check && python3 tools/geometry-textbook/check_vector_length_problems.py
      - run: python3 tools/geometry-textbook/vector_extra_problems.py --check && python3 tools/geometry-textbook/check_vector_extra_problems.py
      - run: python3 tools/geometry-textbook/vector_chapter_review.py --check && python3 tools/geometry-textbook/check_vector_chapter_review.py
      - run: python3 tools/geometry-textbook/coordinate_coefficients.py --check && python3 tools/geometry-textbook/check_coordinate_coefficients.py
      - run: python3 tools/geometry-textbook/coordinate_relations.py --check && python3 tools/geometry-textbook/check_coordinate_relations.py
      - run: python3 tools/geometry-textbook/coordinate_grid.py --check && python3 tools/geometry-textbook/check_coordinate_grid.py
      - run: python3 tools/geometry-textbook/coordinate_actions.py --check && python3 tools/geometry-textbook/check_coordinate_actions.py
      - run: python3 tools/geometry-textbook/coordinate_positions.py --check && python3 tools/geometry-textbook/check_coordinate_positions.py
      - run: python3 tools/geometry-textbook/coordinate_tables.py --check && python3 tools/geometry-textbook/check_coordinate_tables.py
      - run: python3 tools/geometry-textbook/coordinate_distances.py --check && python3 tools/geometry-textbook/check_coordinate_distances.py
      - run: python3 tools/geometry-textbook/coordinate_figures.py --check && python3 tools/geometry-textbook/check_coordinate_figures.py
      - run: python3 tools/geometry-textbook/coordinate_couriers.py --check && python3 tools/geometry-textbook/check_coordinate_couriers.py
      - run: python3 tools/geometry-textbook/coordinate_proof_method.py --check && python3 tools/geometry-textbook/check_coordinate_proof_method.py
      - run: python3 tools/geometry-textbook/coordinate_curves.py --check && python3 tools/geometry-textbook/check_coordinate_curves.py
      - run: python3 tools/geometry-textbook/circle_intersections.py --check && python3 tools/geometry-textbook/check_circle_intersections.py
      - run: python3 tools/geometry-textbook/circle_equations.py --check && python3 tools/geometry-textbook/check_circle_equations.py
      - run: python3 tools/geometry-textbook/coordinate_lines.py --check && python3 tools/geometry-textbook/check_coordinate_lines.py
      - run: python3 tools/geometry-textbook/circle_line_positions.py --check && python3 tools/geometry-textbook/check_circle_line_positions.py
      - run: python3 tools/geometry-textbook/trigonometric_signs.py --check && python3 tools/geometry-textbook/trigonometric_rays.py --check && python3 tools/geometry-textbook/slope_and_reflection.py --check && python3 tools/geometry-textbook/check_trigonometric_rays.py
      - run: python3 tools/geometry-textbook/scalar_product.py --check && python3 tools/geometry-textbook/check_scalar_product.py
      - run: python3 tools/geometry-textbook/field_trigonometry.py --check && python3 tools/geometry-textbook/check_field_trigonometry.py
      - run: python3 tools/geometry-textbook/solve_triangle.py --check && python3 tools/geometry-textbook/oblique_triangle_cases.py --check && python3 tools/geometry-textbook/triangle_section_applications.py --check && python3 tools/geometry-textbook/check_triangle_section_applications.py
      - run: python3 tools/geometry-textbook/triangle_sine_area.py --check && python3 tools/geometry-textbook/triangle_relations.py --check && python3 tools/geometry-textbook/check_triangle_sine_area.py
      - run: python3 tools/geometry-textbook/upper_semicircle.py --check && python3 tools/geometry-textbook/check_upper_semicircle.py
      - run: python3 tools/geometry-textbook/coordinate_additional_curves.py --check && python3 tools/geometry-textbook/coordinate_additional_applications.py --check && python3 tools/geometry-textbook/check_coordinate_additional_curves.py
      - run: python3 tools/geometry-textbook/coordinate_additional_figures.py --check && python3 tools/geometry-textbook/check_coordinate_additional_figures.py
      - run: python3 tools/geometry-textbook/coordinate_additional_vectors.py --check && python3 tools/geometry-textbook/check_coordinate_additional_vectors.py
      - run: python3 tools/geometry-textbook/coordinate_chapter_review.py --check && python3 tools/geometry-textbook/check_coordinate_chapter_review.py
      - run: python3 tools/geometry-textbook/coordinate_loci.py --check && python3 tools/geometry-textbook/check_coordinate_loci.py
      - run: node tools/geometry-textbook/area-lessons.browser.cjs
        env:
          AREA_SCREENSHOTS: artifacts/numbered-area-lessons
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: numbered-area-lessons
          path: artifacts/numbered-area-lessons
