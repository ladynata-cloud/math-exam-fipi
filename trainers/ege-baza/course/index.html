const SKILLS=[
{id:'decimal',title:'Числа без путаницы',desc:'Доли, десятичная запись и точные вычисления.',goal:'Переводить простую дробь в десятичную и выполнять действия с десятичными числами.',exam:'Вычисления и практические расчёты',lesson:['В записи 0,35 три десятых и пять сотых: это 35 сотых. Ноль в конце дробной части значения не меняет: 0,7 = 0,70.','При сложении и вычитании сопоставляем одинаковые разряды: 0,70 − 0,26 = 0,44.','Обыкновенная дробь обозначает деление: 3/4 = 3 : 4 = 0,75. Умножить на 0,5 — взять половину числа.'],link:'../../decimal-cash-trainer.html',linkTitle:'Потренировать разряды',model:'grid'},
{id:'division',title:'Деление с запятой',desc:'Одинаково меняем оба числа и сохраняем частное.',goal:'Делить на десятичную дробь и проверять частное умножением.',exam:'Вычисления, цена единицы, количество',lesson:['Частное не изменится, если делимое и делитель умножить на одно и то же ненулевое число.','Чтобы делитель стал натуральным, умножаем оба числа на 10, 100 или 1000: 6,3 : 0,3 = 63 : 3 = 21.','Проверьте результат обратным действием: 21 · 0,3 = 6,3. Если умножить только делитель, получится другое частное.'],link:'../../oge-basics/multiplication-division/decimal-divisor-shift.html',linkTitle:'Деление уголком по шагам',model:'shift'},
{id:'rounding',title:'Количество и единицы',desc:'Когда округлять вверх, когда вниз и как переводить единицы.',goal:'Выбирать округление по смыслу и переводить единицы массы, длины и объёма.',exam:'Покупки, измерения и практическая геометрия',lesson:['Сначала приведите величины к одинаковым единицам: 1 м = 100 см; 1 кг = 1000 г; 1 л = 1000 мл.','Если нужно купить целые упаковки и материала должно хватить, округляйте частное вверх. Для 17 м при 2,5 м в упаковке нужны 7 упаковок.','Если бюджет ограничен, число целых покупок округляем вниз: на 500 рублей по 72 рубля можно купить 6 предметов. Проверьте стоимость следующего.'],link:'../../rounding-stepwise.html',linkTitle:'Вспомнить округление чисел',model:'packs'},
{id:'percent',title:'Часть и целое',desc:'Находим процент, число по проценту и долю в процентах.',goal:'Различать три вопроса: найти часть, восстановить целое и найти процент.',exam:'Проценты, доли, практические задачи',lesson:['100% — всё выбранное целое. Чтобы найти 20% от 350, вычисляем 350 · 20 : 100 = 70.','Если 45 — это 15% целого, сначала найдём 1%: 45 : 15 = 3. Тогда 100% равны 300.','Чтобы узнать, сколько процентов составляет 18 от 60, вычисляем 18 : 60 · 100 = 30%. Сначала решите, что в задаче принято за целое.'],link:'../../oge-basics/percentages/percent-choose-question.html',linkTitle:'Научиться выбирать действие',model:'percent'},
{id:'change',title:'Цена меняется',desc:'Скидки, повышение и возвращение к прежней цене.',goal:'Вычислять новую цену, восстанавливать старую и учитывать последовательные изменения.',exam:'Изменение величин в процентах',lesson:['После скидки 15% остаётся 85% цены. Было 1200 рублей, стало 1200 · 0,85 = 1020 рублей.','Если после скидки 20% цена стала 720 рублей, то 720 — это 80% прежней цены: 720 : 0,8 = 900.','При нескольких изменениях база процента меняется. Повышение на 10% и снижение на 10% дают 1000 · 1,1 · 0,9 = 990 рублей.'],link:'../../oge-basics/percentages/percent-change.html',linkTitle:'Больше задач об изменении величин',model:'change'},
{id:'choice',title:'Выбираем с расчётом',desc:'Сравниваем полные расходы и собираем решение из нескольких шагов.',goal:'Учитывать количество, цену единицы и дополнительные расходы.',exam:'Выгодное предложение и практические задачи',lesson:['Сравнивайте одинаковое количество товара. Цена одного предмета ещё не определяет стоимость всей покупки.','Для каждого предложения отдельно найдите стоимость товара и прибавьте доставку. Только потом сравните суммы.','Перед вычислениями запишите план. После решения проверьте, что ответили именно на вопрос: цена, сдача, количество или общий расход.'],link:'../../oge-basics/percentages/percent-final-checkpoint.html',linkTitle:'Смешанная практика по процентам',model:'choice'}
];

bank('rounding','practice',[
['Для работы нужно 17 м шнура. Он продаётся упаковками по 2,5 м. Какое наименьшее число упаковок нужно купить?',7,'упаковок','Шнура должно хватить. Сравните длину в 6 и в 7 упаковках.','17 : 2,5 = 6,8. Покупаем 7 упаковок: в них 17,5 м.'],
['Тетрадь стоит 72 рубля. Сколько тетрадей можно купить на 500 рублей?',6,'тетрадей','Проверьте, хватает ли денег на 6 и на 7 тетрадей.','6 · 72 = 432, а 7 · 72 = 504 > 500. Можно купить 6 тетрадей.'],

const KEY='mathexam.ege-baza.foundation.v1';
const DAY=24*60*60*1000;
const PHASES={diagnostic:'Входная диагностика',checkpoint:'Итоговая проверка',repeat:'Повторная проверка'};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>String(Math.round(n*1e8)/1e8).replace('.',',');
const list=(phase,skill)=>TASKS.filter(t=>t.phase===phase&&(!skill||t.skill===skill));
const blank=()=>({v:1,practice:{},runs:{}});
function parseNumber(raw){const s=String(raw).trim().replace(/,/g,'.').replace(/^−/,'-');return /^[+-]?(?:\d+(?:\.\d+)?|\.\d+)$/.test(s)&&Number.isFinite(Number(s))?Number(s):null;}
function right(t,raw){const n=parseNumber(raw);return n!==null&&Math.abs(n-t.answer)<1e-8;}
function validState(raw){
 const out=blank();if(!raw||raw.v!==1)return out;
 for(const t of list('practice')){const r=raw.practice?.[t.id];if(!r||typeof r!=='object')continue;
  const tries=Number.isInteger(r.tries)&&r.tries>=0?Math.min(r.tries,100000):0;
  const answer=typeof r.answer==='string'?r.answer.slice(0,120):'';
  out.practice[t.id]={tries,hints:r.hints===true,solution:r.solution===true,answer,done:r.done===true&&tries>0&&right(t,answer)};
 }
 for(const phase of Object.keys(PHASES)){const r=raw.runs?.[phase];if(!r||typeof r!=='object')continue;
  const answers={};let contiguous=true;
  for(const t of list(phase)){const v=r.answers?.[t.id];if(contiguous&&(v===null||(typeof v==='string'&&parseNumber(v)!==null)))answers[t.id]=v===null?null:v.slice(0,120);else contiguous=false;}
  const complete=Object.keys(answers).length===list(phase).length;
  out.runs[phase]={answers,helped:r.helped===true,finishedAt:complete&&Number.isFinite(r.finishedAt)&&r.finishedAt>0?r.finishedAt:null};
 }
 return out;
}
let canSave=true,storageNotice='';
function warn(text){storageNotice=text;$('storage-warning').textContent=text;$('storage-warning').hidden=!text;}
function load(){try{const text=localStorage.getItem(KEY);if(!text)return blank();const raw=JSON.parse(text);if(!raw||raw.v!==1){warn('Сохранение этого модуля не удалось прочитать. Показан новый маршрут; данные других тренажёров не затронуты.');return blank();}return validState(raw);}catch(e){warn('Сохранение недоступно или повреждено. Можно заниматься и скачать отчёт, но прогресс может не пережить закрытие страницы.');return blank();}}
let state=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){canSave=false;warn('Браузер не разрешил сохранение. Перед закрытием страницы скачайте отчёт в разделе «Мой прогресс».');}}
function practiceRec(t){return state.practice[t.id]||(state.practice[t.id]={tries:0,hints:false,solution:false,done:false,answer:''});}
function independent(r){return !!r?.done&&r.tries===1&&!r.hints&&!r.solution;}
function result(phase,skill){const run=state.runs[phase];const ts=list(phase,skill);return {finished:!!run?.finishedAt,total:ts.length,correct:ts.filter(t=>run&&Object.hasOwn(run.answers,t.id)&&right(t,run.answers[t.id])).length,helped:!!run?.helped};}
function skillState(s){
 const p=list('practice',s.id),solo=p.filter(t=>independent(state.practice[t.id])).length,done=p.filter(t=>state.practice[t.id]?.done).length;
 const c=result('checkpoint',s.id),r=result('repeat',s.id),d=result('diagnostic',s.id);
 const level=r.finished&&r.correct===r.total&&!r.helped?4:c.finished&&c.correct===c.total&&!c.helped?3:solo>=3?2:done?1:0;
 return {solo,done,level,label:['Начать знакомство','Тренируюсь','Решаю самостоятельно','Проверка пройдена','Подтверждено повторением'][level],d,c,r};
}
function recommended(){return SKILLS.find(s=>{const st=skillState(s);return st.level<3&&(!st.d.finished||st.d.correct<st.d.total);})||SKILLS.find(s=>skillState(s).level<3)||null;}

 $('main').innerHTML=`<div class="task-top"><div><span class="eyebrow">Самостоятельная практика</span><h2>${esc(s.title)}</h2></div>${btn('К объяснению','learn-'+id,'secondary small')}</div><div class="mini-nav" aria-label="Задания навыка">${tasks.map((q,j)=>`<button class="${i===j?'active':''} ${state.practice[q.id]?.done?'done':''}" data-action="practice-${id}-${j}" aria-label="Задание ${j+1}${state.practice[q.id]?.done?', решено':''}" ${i===j?'aria-current="step"':''}>${j+1}</button>`).join('')}</div>
 <section class="panel"><span class="eyebrow">Задача ${i+1} из ${tasks.length}</span><p class="prompt">${esc(t.text)}</p>${r.done?`<div class="feedback"><b>${independent(r)?'Верно с первого раза — самостоятельно':r.hints||r.solution?'Верно — с поддержкой':'Верно после исправления'}</b><p>Ответ: ${fmt(t.answer)} ${esc(t.unit)}.</p><p>${esc(t.solution)}</p></div><div class="actions">${i<3?btn('Следующая задача','practice-'+id+'-'+(i+1)):btn('К карте навыков','map')}${btn('К проверкам','checks','secondary')}</div>`:`<form id="answer-form"><label for="answer">Ваш ответ ${t.unit?'('+esc(t.unit)+')':''}</label><p class="small muted" id="answer-format">Одно число без единиц. Можно использовать запятую или точку.</p><div class="answer-row"><input id="answer" inputmode="decimal" autocomplete="off" aria-describedby="answer-format feedback" value="${esc(r.answer)}"><button class="btn" type="submit">Проверить</button></div></form><div id="feedback" role="status" class="feedback" ${r.hints||r.solution?'':'hidden'}>${r.solution?esc(t.solution):r.hints?esc(t.hint):''}</div><div class="actions">${btn('Подсказка','hint','secondary small')}${btn('Разобрать решение','solution','secondary small')}</div><p class="small muted" style="margin-top:14px">Помощь доступна всегда. После подсказки задача учитывается как решённая с поддержкой.</p>`}</section>`;
 if(!r.done){$('answer-form').addEventListener('submit',e=>{e.preventDefault();const input=$('answer').value;if(parseNumber(input)===null){feedback('Введите одно число, например 0,75. Пустой ответ и выражения не засчитываются.','bad');return;}r.answer=input.trim();r.tries++;r.done=right(t,input);save();if(r.done){renderPractice(id,i);$('main').focus();}else feedback('Пока не совпало. Проверьте действие и вычисление. Можно воспользоваться подсказкой.','bad');});$('main').querySelector('[data-action="hint"]').onclick=()=>{r.hints=true;save();feedback(t.hint,'tip');};$('main').querySelector('[data-action="solution"]').onclick=()=>{r.solution=true;save();feedback(t.solution,'tip');};}
}
function feedback(message,kind=''){const f=$('feedback');f.hidden=false;f.className='feedback '+kind;f.textContent=message;}
function repeatAvailable(){const at=state.runs.checkpoint?.finishedAt;return !!at&&Date.now()>=at+DAY;}
function renderChecks(){const ready=repeatAvailable();const unlock=state.runs.checkpoint?.finishedAt;const labels={diagnostic:'Определить, что уже получается. 12 заданий, без оценки за курс.',checkpoint:'Проверить шесть навыков на другом наборе из 12 заданий.',repeat:unlock?`Новые 12 заданий для проверки сохранения навыков. Доступно с ${new Date(unlock+DAY).toLocaleString('ru-RU')}.`:'Откроется через 24 часа после завершения итоговой проверки.'};
 $('main').innerHTML=`<span class="eyebrow">Самостоятельность и повторение</span><h1>Проверить себя</h1><p class="muted" style="margin-top:18px">Решайте на бумаге, записывайте только ответ. Разбор появится после завершения всей работы.</p><div class="cards" style="margin-top:24px">${Object.entries(PHASES).map(([phase,title],i)=>{const r=state.runs[phase],res=result(phase);return `<section class="card"><span class="num">0${i+1}</span><h3>${title}</h3><p>${labels[phase]}</p>${res.finished?`<p><b>Результат: ${res.correct} из ${res.total}</b>${res.helped?' · с обращением к обучению':''}</p>`:''}<div class="actions">${btn(res.finished?'Посмотреть разбор':r?'Продолжить':'Начать','start-'+phase,'',phase==='repeat'&&!ready&&!res.finished?'disabled':'')}</div></section>`;}).join('')}</div><section class="panel" style="margin-top:24px"><h3>Честная проверка</h3><p>У каждой проверки свой фиксированный набор. Повторное открытие показывает ваш результат, а не выдаёт знакомые задачи за новую попытку. Пропущенные задания учитываются как нерешённые.</p><p>Если во время проверки открыть урок или практику этого модуля, результат будет отмечен как учебный, с обращением к объяснениям.</p></section>`;
}
function startRun(phase){if(!PHASES[phase])return;if(phase==='repeat'&&!repeatAvailable())return route('#checks');if(state.runs[phase]?.finishedAt)return route('#results-'+phase);if(!state.runs[phase]){state.runs[phase]={answers:{},finishedAt:null,helped:false};save();}route('#test-'+phase);}
function renderTest(phase){const run=state.runs[phase];if(!run||!PHASES[phase])return route('#checks');if(run.finishedAt)return route('#results-'+phase);if(phase==='repeat'&&!repeatAvailable())return route('#checks');const ts=list(phase);const index=ts.findIndex(t=>!Object.hasOwn(run.answers,t.id));if(index<0){run.finishedAt=Date.now();save();return route('#results-'+phase);}const t=ts[index];
 $('main').innerHTML=`<span class="eyebrow">${PHASES[phase]}</span><div class="task-top"><h2>Задание ${index+1} из ${ts.length}</h2><span class="tag">Разбор после завершения</span></div><div class="progress" role="progressbar" aria-label="Выполнено заданий" aria-valuenow="${index}" aria-valuemin="0" aria-valuemax="${ts.length}"><span style="width:${index/ts.length*100}%"></span></div>${run.helped?'<p class="notice">Вы обращались к урокам или практике во время этой проверки. Она будет отмечена как учебная.</p>':''}<section class="panel"><p class="prompt">${esc(t.text)}</p><form id="answer-form"><label for="answer">Ответ ${t.unit?'('+esc(t.unit)+')':''}</label><p class="small muted" id="answer-format">Число с запятой или точкой, без единиц измерения.</p><div class="answer-row"><input id="answer" inputmode="decimal" autocomplete="off" aria-describedby="answer-format feedback"><button class="btn" type="submit">${index===ts.length-1?'Завершить проверку':'Сохранить и дальше'}</button></div></form><div id="feedback" class="feedback" role="status" hidden></div><div class="actions">${btn('Пока не знаю','skip','secondary small')}</div><p class="small muted" style="margin-top:14px">Ответ сохраняется сразу. После перехода к следующему заданию изменить его нельзя.</p></section>`;
 function submit(value){run.answers[t.id]=value;if(Object.keys(run.answers).length===ts.length)run.finishedAt=Date.now();save();render();}
 $('answer-form').addEventListener('submit',e=>{e.preventDefault();const val=$('answer').value;if(parseNumber(val)===null)return feedback('Запишите число или нажмите «Пока не знаю».','bad');submit(val.trim());});$('main').querySelector('[data-action="skip"]').onclick=()=>submit(null);
}
function renderResults(phase){const run=state.runs[phase];if(!PHASES[phase]||!run?.finishedAt)return route('#checks');const res=result(phase),rec=recommended();
 $('main').innerHTML=`<span class="eyebrow">${PHASES[phase]} · Результат</span><section class="panel"><div class="medal" aria-hidden="true">${res.correct===res.total?'✓':'↗'}</div><h2>${res.correct===res.total?'Все задания решены верно':'Теперь понятно, что повторить'}</h2><p class="score">${res.correct} <span class="muted">/ ${res.total}</span></p><p>${run.helped?'Проверка выполнена с обращением к обучению. Она не повышает отметку самостоятельности.':phase==='diagnostic'?'Это стартовый срез. Навыки подтвердятся на итоговой проверке.':'Результат проверки без подсказок внутри модуля.'}</p><div class="summary-list">${SKILLS.map(s=>{const r=result(phase,s.id);return `<div class="summary-row"><span>${esc(s.title)}</span><span><b>${r.correct}/2</b> · <a href="#learn-${s.id}">Повторить</a></span></div>`;}).join('')}</div><div class="actions">${btn('К моему маршруту','map')}${btn('Скачать отчёт','download','secondary')}${rec?btn('Открыть '+rec.title,'learn-'+rec.id,'secondary'):''}</div></section><div class="section-head"><h2>Разбор заданий</h2></div><div class="result-list">${list(phase).map((t,i)=>{const val=run.answers[t.id],ok=right(t,val);return `<article class="result-item ${ok?'good':'bad'}"><span class="eyebrow">Задание ${i+1} · ${ok?'Верно':'Повторить'}</span><p>${esc(t.text)}</p><p class="small">Ваш ответ: <b>${val===null?'пропущено':esc(val)}</b>. Верный ответ: <b>${fmt(t.answer)} ${esc(t.unit)}</b>.</p><p>${esc(t.solution)}</p></article>`;}).join('')}</div>`;
}
function report(){const out=['MathExam · Базовый ЕГЭ','Модуль 1: Числа, деньги и проценты','Сформировано: '+new Date().toLocaleString('ru-RU'),'Прогресс одного браузера; автоматической отправки преподавателю нет.',''];
 for(const s of SKILLS){const st=skillState(s);out.push(s.title+': '+st.label,`  Практика: ${st.done}/4 решено, ${st.solo}/4 с первого раза без помощи.`);}
 for(const [phase,name] of Object.entries(PHASES)){const r=result(phase),run=state.runs[phase];out.push('',name+': '+(r.finished?`${r.correct}/${r.total}, ${new Date(run.finishedAt).toLocaleString('ru-RU')}${r.helped?', с обращением к обучению':''}`:run?`не завершена, ответов ${Object.keys(run.answers).length}/${r.total}`:'ещё не начата'));if(r.finished)for(const s of SKILLS){const x=result(phase,s.id);out.push('  '+s.title+': '+x.correct+'/2');}}
 const weak=SKILLS.filter(s=>skillState(s).level<3);out.push('','Для дальнейшей работы: '+(weak.length?weak.map(s=>s.title).join('; '):'повторная проверка на сохранение навыков.'));return out.join('\n');
}
function downloadReport(){const url=URL.createObjectURL(new Blob([report()],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='mathexam-baza-module-1-report.txt';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function renderReport(){const confirmed=SKILLS.filter(s=>skillState(s).level>=3).length;$('main').innerHTML=`<span class="eyebrow">Что уже получается</span><h1>Мой прогресс</h1><div class="two"><section class="panel"><h3>Подтверждено навыков: ${confirmed} из 6</h3><p>Отметка за модуль отражает только эти шесть навыков и не является прогнозом оценки за весь ЕГЭ.</p><label class="sr" for="report-text">Отчёт преподавателю</label><textarea class="report" id="report-text" readonly>${esc(report())}</textarea><div class="actions">${btn('Скачать отчёт','download')}${btn('Выделить текст','select-report','secondary')}</div></section><aside class="stack"><section class="panel"><h3>Сохранение</h3><p>Результаты доступны в этом браузере на этом устройстве. Для передачи преподавателю скачайте отчёт или скопируйте текст.</p></section><section class="panel"><h3>Начать модуль заново</h3><p>Удалится только прогресс этого модуля. Сначала можно сохранить отчёт.</p><div class="actions"><button class="danger" data-action="reset-ask">Сбросить мой прогресс</button></div><div id="reset-confirm" hidden><p>Удалить диагностику, практику и проверки этого модуля?</p><div class="actions"><button class="danger" data-action="reset-confirm">Да, удалить</button>${btn('Отмена','reset-cancel','secondary')}</div></div></section></aside></div>`;}
function renderTeacher(){$('main').innerHTML=`<span class="eyebrow">Первый модуль курса · Мини-группа</span><h1>Преподавателю</h1><div class="two"><section class="panel"><h3>Рабочая последовательность</h3><ol><li>Дайте входную диагностику. В отчёте видны шесть направлений, но два вопроса по навыку — ориентир, а не полный диагноз.</li><li>Выберите общую тему для группы. Вычислительные пробелы назначайте для короткой самостоятельной работы.</li><li>На занятии обсудите интерактивную модель. Попросите ученика предсказать изменение до движения ползунка.</li><li>После практики проведите итоговую проверку. Используются задания, которых нет в тренировочном наборе.</li><li>Не раньше чем через сутки предложите повторную проверку на отдельном наборе. Уточните причины ошибок по записи решения.</li></ol><p>Отчёт ученик передаёт сам. Здесь нет общего журнала группы или автоматической отправки результатов.</p></section><aside class="panel"><h3>Объём первой версии</h3><p>60 авторских заданий: 12 входных, 24 тренировочных, 12 итоговых и 12 для повторения. Наборы фиксированы.</p><p>Содержание рассчитано на восстановление части математической базы. Остальные разделы базового ЕГЭ ещё предстоит включить в курс.</p><p><a href="../">Существующий тренажёр по всем 21 заданиям ЕГЭ</a></p></aside></div><section class="panel" style="margin-top:20px"><h3>Связи навыков</h3><div class="table-wrap"><table><thead><tr><th>Навык</th><th>Результат</th><th>Применение</th></tr></thead><tbody>${SKILLS.map(s=>`<tr><td><a href="#learn-${s.id}">${esc(s.title)}</a></td><td>${esc(s.goal)}</td><td>${esc(s.exam)}</td></tr>`).join('')}</tbody></table></div></section>`;}
function render(){const parts=(location.hash.slice(1)||'map').split('-'),page=parts[0];document.querySelectorAll('[data-page]').forEach(b=>{const active=b.dataset.page===(['test','results'].includes(page)?'checks':['learn','practice'].includes(page)?'map':page);if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
 if(page==='learn')renderLearn(parts[1]);else if(page==='practice')renderPractice(parts[1],Number(parts[2]));else if(page==='test')renderTest(parts[1]);else if(page==='results')renderResults(parts[1]);else if(page==='checks')renderChecks();else if(page==='report')renderReport();else if(page==='teacher')renderTeacher();else renderMap();
 $('main').focus({preventScroll:true});
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action],[data-page]');if(!b||b.disabled)return;if(b.dataset.page)return route('#'+b.dataset.page);const action=b.dataset.action;if(['hint','solution','skip'].includes(action))return;if(action==='download')return downloadReport();if(action==='scroll-skills')return $('skills')?.scrollIntoView({behavior:'smooth'});if(action==='select-report'){const t=$('report-text');t.focus();t.select();return;}if(action==='reset-ask'){$('reset-confirm').hidden=false;return;}if(action==='reset-cancel'){$('reset-confirm').hidden=true;return;}if(action==='reset-confirm'){try{localStorage.removeItem(KEY);}catch(e){warn('Не удалось удалить сохранение в браузере. Текущая работа начата заново; проверьте настройки хранения.');}state=blank();route('#map');return;}if(action.startsWith('start-'))return startRun(action.slice(6));route('#'+action);});
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0);});
window.addEventListener('storage',e=>{if(e.key===KEY){state=load();render();warn('Прогресс обновлён из другой вкладки. Продолжайте с показанного задания.');}});
window.MathExamFoundation={KEY,SKILLS,TASKS,parseNumber,right,validState,skillState,result,repeatAvailable,report};
render();
</script>
