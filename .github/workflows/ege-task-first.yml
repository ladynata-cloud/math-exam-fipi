name: EGE 2027 — task-first courses
on:
  pull_request:
    paths: ['ege-profil/start/**', 'ege-profil/index.html', 'ege-baza/**', 'tools/profile-task-first*', 'tools/ege-baza-task-first*', 'tools/ege-baza-concrete-hints*', 'tools/ege-baza-journey*', 'tools/ege-baza-exam-map*', 'tools/ege-baza-learning-cycle*', 'tools/ege-baza-model-discovery*', 'tools/ege-course-entry*', '.github/workflows/ege-task-first.yml']
permissions:
  contents: read
jobs:
  task-first:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.62.1 jsdom@26.1.0
      - run: npx playwright install --with-deps chromium
      - name: Profile task instructions and retained contracts
        run: node --test tools/profile-task-first.test.cjs tools/profile-fraction-display.test.cjs tools/profile-calm-map.test.cjs tools/profile-calm-state.test.cjs tools/profile-step-solutions.test.cjs tools/profile-input-ui.test.cjs tools/profile-independent-models.test.cjs
      - name: Basic EGE all families and legacy state
        run: |
          node --test tools/ege-baza-concrete-hints.test.cjs
          node tools/ege-baza-task-first.test.cjs
      - name: Basic EGE help, independent practice and mathematical experiments
        run: |
          node tools/ege-baza-learning-cycle.test.cjs
          node tools/ege-baza-model-discovery.test.cjs
      - name: Basic EGE complete learning cycles in a real browser
        env:
          EGE_CYCLE_SHOTS: artifacts/base-cycle
          EGE_DISCOVERY_SHOTS: artifacts/base-discovery
        run: |
          node tools/ege-baza-learning-cycle.browser.cjs
          node tools/ege-baza-model-discovery.browser.cjs
      - name: Basic EGE 21 exam positions, learning lines and preserved progress
        run: |
          node --test tools/ege-baza-journey.test.cjs tools/ege-baza-exam-map.test.cjs
          node tools/ege-baza-journey.dom.cjs
      - name: Basic EGE learning route on narrow and desktop screens
        env:
          EGE_JOURNEY_SHOTS: artifacts/base-journey
        run: node tools/ege-baza-journey.browser.cjs
      - name: Profile simulated learners
        env:
          PROFILE_TASK_FIRST_SHOTS: artifacts/profile-task-first
        run: node tools/profile-task-first.browser.cjs
      - name: Base simulated learners
        env:
          EGE_TASK_FIRST_SHOTS: artifacts/base-task-first
        run: node tools/ege-baza-task-first.browser.cjs
      - name: Both course entrances
        env:
          EGE_ENTRY_SHOTS: artifacts/course-entries
        run: node tools/ege-course-entry.browser.cjs
      - name: Keep actual browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ege-task-first-visuals
          path: artifacts/
          retention-days: 7
          if-no-files-found: warn
