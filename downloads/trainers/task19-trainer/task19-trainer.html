:root{color-scheme:light;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#202622;background:#fafafa;font-synthesis:none;line-height:1.55;--green:#176c52;--line:#dedfdb;--muted:#626962}
*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
header{background:#151916;color:#fff;padding:22px 20px}
.page-width{max-width:820px;margin:auto}
header h1{font-size:20px;line-height:1.35;margin:0;font-weight:650}
header p{font-size:14px;color:#dce1db;margin:4px 0 0}
main{padding:30px 20px 52px}
.exercise{padding:30px;border:1px solid var(--line);border-radius:16px;background:#fff}
.topic-label{font-size:14px;color:var(--muted);margin:0 0 18px}
.statement{font-size:clamp(23px,3.3vw,29px);line-height:1.5;letter-spacing:-.015em;font-weight:550;margin:0 0 24px;overflow-wrap:anywhere}
button,select,input{font:inherit}
button{min-height:48px;border:1px solid #cbd0ca;border-radius:10px;padding:11px 19px;background:#fff;color:inherit;cursor:pointer;line-height:1.4;touch-action:manipulation}
button:hover{background:#f2f5f1;border-color:#859788}
button:disabled{cursor:default;opacity:.6}
button:focus-visible,a:focus-visible,summary:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #b68013;outline-offset:4px}
.hint-toggle{background:#f1f5f1;border-color:#d6dfd6;font-size:17px}
.hint-panel{margin-top:22px;padding:20px 0 0;border-top:1px solid #e8ebe6}
.hint-prompt{font-size:18px;line-height:1.6;margin:0 0 16px}
.visual-host{min-width:0;overflow-wrap:anywhere}
.visual-host svg{display:block;width:100%;height:auto;max-height:410px;background:#fafcf9;border:1px solid #e0e6dd;border-radius:12px}
.visual-host svg text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.visual-host label{display:block;font-size:16px;line-height:1.5}
.visual-host input[type=range]{width:100%;min-width:0;min-height:38px;accent-color:var(--green);touch-action:auto}
.visual-host output{font-variant-numeric:tabular-nums}
.visual-controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px 24px;margin-top:16px}
.visual-control{min-width:0}
.visual-readout{font-size:17px;line-height:1.7;margin:14px 0 0;font-variant-numeric:tabular-nums}
.t19-model-controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:14px 24px;margin-top:18px}
.t19-model-control{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:12px;align-items:center;min-width:0}
.t19-model-control input{grid-column:1/-1}
.t19-model-control output{font-size:17px;color:var(--green);font-weight:600}
.t19-model-readout{font-size:17px;line-height:1.75;margin:15px 0 0;padding-left:22px;font-variant-numeric:tabular-nums}
.answer-actions{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:28px;max-width:410px}
.answer-actions button{font-size:19px;font-weight:600}
.answer-actions .yes{border-color:#48866a;color:#16563d}
.answer-actions .no{border-color:#ac817b;color:#783b34}
.answer-actions button[aria-pressed=true]{outline:2px solid currentColor;outline-offset:2px}
.answer-panel{margin-top:24px;border-left:4px solid var(--green);padding:4px 0 4px 18px}
.answer-panel[data-correct=false]{border-color:#ad7041}
.answer-panel h3{font-size:20px;margin:0 0 8px}
.answer-panel p{font-size:18px;line-height:1.65;margin:0;white-space:pre-line}
.next-row{margin-top:25px}
.next-row button{color:var(--green);border-color:#d3ded5}
.next-row button.ready{background:var(--green);border-color:var(--green);color:white}
.next-row button.ready:hover{background:#12533f}
.practice-settings{margin:22px 0 0;color:var(--muted)}
.practice-settings summary{cursor:pointer;width:fit-content;padding:9px 0;min-height:44px}
.settings-content{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;margin-top:8px;color:#28352c}
.settings-content label{display:block;margin-bottom:12px}
.settings-content select{display:block;max-width:100%;width:100%;min-height:46px;border:1px solid #b8c3b7;background:#fff;border-radius:8px;padding:9px;margin-top:6px}
.settings-content input[type=checkbox]{width:19px;height:19px;vertical-align:middle;margin:0 7px 3px 0;accent-color:var(--green)}
.settings-content p{margin:14px 0 0;font-size:14px}
.settings-content a{color:var(--green);text-underline-offset:3px}
.storage-note{font-size:13px;color:var(--muted);line-height:1.6}
.empty-note{font-size:18px;line-height:1.6;padding:20px 0}
noscript p{max-width:760px;margin:30px auto;padding:20px}

      body+=text(280,315,p.compare?'C и D — вне выделенной дуги':'C — вне выделенной дуги',INK);
    } else if(model==='similarity') {
      const k=p.scale,u=21,origin1=[80,280],origin2=[275,280],triangle=(o,f)=>[[o[0],o[1]],[o[0]+3*u*f,o[1]],[o[0],o[1]-4*u*f]];
      const a=triangle(origin1,1),b=triangle(origin2,k);
      // Both triangles use the same units per pixel: area visibly scales by k squared.
      body=poly(a)+poly(b)+text(115,325,'Исходный')+text(365,325,'Подобный');
      body+=text((a[0][0]+a[1][0])/2,303,'3',BLUE)+text(a[0][0]-22,(a[0][1]+a[2][1])/2,'4',BLUE)+text((a[1][0]+a[2][0])/2+18,(a[1][1]+a[2][1])/2,'5',BLUE);
      body+=text((b[0][0]+b[1][0])/2,303,fmt(3*k),BLUE)+text(b[0][0]-22,(b[0][1]+b[2][1])/2,fmt(4*k),BLUE)+text((b[1][0]+b[2][0])/2+18,(b[1][1]+b[2][1])/2,fmt(5*k),BLUE);
      readout=[`Стороны увеличены в ${fmt(k)} раза`,`Периметры: ${fmt(M.perimeter)} и ${fmt(M.scaledPerimeter)}`,`Площади: ${fmt(M.area)} и ${fmt(M.scaledArea)}`];
    }
    return {svg:svg(caption,body),readout,sample:s};
  }

  let mountIndex=0;
  function mount(host,hint) {
    if(!host||!hint)throw new Error('A hint host and data are required');
    host.replaceChildren();
    if(!hint.model) {
      if(!hint.svg)throw new Error('Visual hint is missing a model or drawing');
      const figure=host.ownerDocument.createElement('div');figure.className='t19-model-figure';figure.innerHTML=hint.svg;host.appendChild(figure);
      return ()=>host.replaceChildren();
    }
    let params=valuesFor(hint.model,hint.params),active=true;
    const doc=host.ownerDocument,figure=doc.createElement('div'),readout=doc.createElement('ul'),controls=doc.createElement('div');
    figure.className='t19-model-figure';readout.className='t19-model-readout';readout.setAttribute('aria-live','polite');controls.className='t19-model-controls';
    host.append(figure,readout,controls);
    const inputs=[],listeners=[],id=++mountIndex;
    function draw() {
      const result=render(hint.model,params);params=result.sample.values;figure.innerHTML=result.svg;readout.replaceChildren();
      result.readout.forEach(s=>{const li=doc.createElement('li');li.textContent=s;readout.append(li);});
      const bounds=controlsFor(hint.model,params);
      inputs.forEach(({input,output,key})=>{const bound=bounds.find(c=>c.key===key);if(!bound)return;input.min=bound.min;input.max=bound.max;input.value=params[key];output.textContent=fmt(params[key])+bound.unit;});
    }
    controlsFor(hint.model,params).forEach(c=>{
      const wrap=doc.createElement('div'),label=doc.createElement('label'),input=doc.createElement('input'),output=doc.createElement('output');
      wrap.className='t19-model-control';input.type='range';input.id=`t19-model-${id}-${c.key}`;input.min=c.min;input.max=c.max;input.step=c.step;input.value=c.value;
      label.htmlFor=input.id;label.textContent=c.label;output.htmlFor=input.id;
      const onInput=()=>{if(active){params[c.key]=Number(input.value);draw();}};input.addEventListener('input',onInput);listeners.push([input,onInput]);
      wrap.append(label,output,input);controls.append(wrap);inputs.push({input,output,key:c.key});
    });
    draw();
    return ()=>{active=false;listeners.forEach(([input,listener])=>input.removeEventListener('input',listener));host.replaceChildren();};
  }
  return {mount,sample,render,controlsFor,modelNames:Object.keys(defs)};
});

</script>
<script data-inline-source="/trainers/task19-visual-app.js">
/* One statement, optional visual help, then a reasoned answer. No network or account. */
(function () {
  'use strict';
  const cards = window.Task19Data && window.Task19Data.cards;
  const el = id => document.getElementById(id);
  const key = 'mathExam.task19.visualHints.v1';
  if (!Array.isArray(cards) || !cards.length || !window.Task19Visuals) {
    el('statement').textContent = 'Не удалось загрузить задания. Обнови страницу.';
    el('hintToggle').disabled = el('btnTrue').disabled = el('btnFalse').disabled = true;
    return;
  }
  const byId = new Map();
  cards.forEach(c => { byId.set(c.id, c); (c.aliases || []).forEach(id => byId.set(id, c)); });
  const topics = [...new Set(cards.map(c => c.theme))];
  let state = { version: 1, topic: '', review: false, records: {}, current: null };
  let mounted = false, cleanup = null, storageWorks = true;
  const integer = value => Number.isFinite(value) ? Math.max(0, Math.min(1000000, Math.floor(value))) : 0;
  function readJSON(storageKey) {
    let raw;
    try { raw = localStorage.getItem(storageKey); }
    catch (_) { storageWorks = false; return null; }
    try { return raw ? JSON.parse(raw) : null; }
    catch (_) { return null; }
  }
  function canonicalRecord(id, record) {
    const card = byId.get(id);
    if (!card || !record || typeof record !== 'object') return;
    const attempts = integer(record.attempts);
    state.records[card.id] = { attempts, correct: Math.min(attempts, integer(record.correct)), needsReview: record.needsReview === true };
  }
  function restore() {
    const saved = readJSON(key);
    if (saved && saved.version === 1 && saved.records && typeof saved.records === 'object' && !Array.isArray(saved.records)) {
      Object.entries(saved.records).forEach(([id, r]) => canonicalRecord(id, r));
      state.topic = topics.includes(saved.topic) ? saved.topic : '';
      state.review = saved.review === true;
      if (saved.current && byId.has(saved.current.id)) {
        state.current = { id: byId.get(saved.current.id).id, answer: typeof saved.current.answer === 'boolean' ? saved.current.answer : null, hintOpen: saved.current.hintOpen === true };
      }
      return;
    }
    // Read-only import: the previous trainers' storage is never changed or deleted.
    const previous = readJSON('task19_trainer_v1');
    if (previous && previous.progress && typeof previous.progress === 'object') {
      Object.entries(previous.progress).forEach(([id, p]) => {
        if (p && typeof p === 'object') canonicalRecord(id, { attempts: p.seen, correct: p.correct, needsReview: integer(p.seen) > 0 && p.box === 1 });
      });
    }
    const oldErrors = readJSON('geometryStatements.errors.v2');
    if (Array.isArray(oldErrors)) oldErrors.forEach(error => {
      const card = error && byId.get(error.statementId);
      if (!card) return;
      if (!state.records[card.id]) state.records[card.id] = { attempts: 0, correct: 0, needsReview: true };
      state.records[card.id].needsReview = true;
    });
  }
  function save() {
    try { localStorage.setItem(key, JSON.stringify(state)); }
    catch (_) { storageWorks = false; }
    el('storageNote').textContent = storageWorks
      ? 'Результаты сохраняются в этом браузере. В прогресс учебного кабинета они не входят.'
      : 'Браузер не разрешает сохранять результаты. Тренироваться можно; после закрытия страницы новые результаты не сохранятся.';
  }
  function filtered() {
    return cards.filter(c => (!state.topic || c.theme === state.topic) && (!state.review || state.records[c.id]?.needsReview));
  }
  function pickNext() {
    const available = filtered();
    if (!available.length) return null;
    let candidates = available.filter(c => c.id !== state.current?.id);
    if (!candidates.length) candidates = available;
    const unseen = candidates.filter(c => !state.records[c.id]?.attempts);
    if (unseen.length) candidates = unseen;
    return candidates[Math.floor(Math.random() * candidates.length)];
  }
  function updateProgress() {
    const records = Object.values(state.records);
    const answered = records.reduce((n, r) => n + r.attempts, 0);
    const correct = records.reduce((n, r) => n + r.correct, 0);
    const mistakes = records.filter(r => r.needsReview).length;
    el('progressText').textContent = `Ответов: ${answered}. Верных: ${correct}. Повторить: ${mistakes}.`;
    el('topicCount').textContent = `Утверждений в выбранной теме: ${cards.filter(c => !state.topic || c.theme === state.topic).length}.`;
  }
  function closePreviousModel() {
    if (typeof cleanup === 'function') cleanup();
    cleanup = null; mounted = false;
    el('visualHost').replaceChildren();
  }
  function showHint(open) {
    if (!state.current) return;
    const card = byId.get(state.current.id);
    if (open && !mounted) {
      el('hintPrompt').textContent = card.hint.prompt;
      cleanup = window.Task19Visuals.mount(el('visualHost'), card.hint);
      mounted = true;
    }
    state.current.hintOpen = open;
    el('hintPanel').hidden = !open;
    el('hintToggle').setAttribute('aria-expanded', String(open));
    el('hintToggle').textContent = open ? 'Скрыть подсказку' : 'Хочешь подсказку?';
    save();
  }
  function showAnswer() {
    const card = byId.get(state.current.id);
    const answer = state.current.answer;
    const correct = answer === card.truth;
    el('answerPanel').hidden = false;
    el('answerPanel').dataset.correct = String(correct);
    el('resultTitle').textContent = correct ? 'Да, ты прав.' : 'Давай разберёмся.';
    el('answerExplanation').textContent = `${card.truth ? 'Утверждение верное.' : 'Утверждение неверное.'} ${card.explanation}`;
    el('btnTrue').disabled = el('btnFalse').disabled = true;
    el('btnTrue').setAttribute('aria-pressed', String(answer));
    el('btnFalse').setAttribute('aria-pressed', String(!answer));
    el('nextCard').textContent = 'Следующее утверждение →';
    el('nextCard').classList.add('ready');
  }
  function render(moveFocus) {
    closePreviousModel();
    el('answerPanel').hidden = true;
    el('resultTitle').textContent = el('answerExplanation').textContent = '';
    el('hintPanel').hidden = true;
    el('hintPrompt').textContent = '';
    el('hintToggle').textContent = 'Хочешь подсказку?';
    el('hintToggle').setAttribute('aria-expanded', 'false');
    el('btnTrue').disabled = el('btnFalse').disabled = false;
    el('btnTrue').setAttribute('aria-pressed', 'false');
    el('btnFalse').setAttribute('aria-pressed', 'false');
    el('nextCard').classList.remove('ready');
    el('nextCard').textContent = 'Другое утверждение →';
    el('topicSelect').value = state.topic;
    el('reviewOnly').checked = state.review;
    if (!state.current) {
      el('topicLabel').textContent = state.topic || 'Все темы';
      el('statement').textContent = 'В выбранной теме нет ошибок для повторения.';
      el('hintToggle').hidden = el('answerActions').hidden = true;
      el('nextCard').textContent = 'Продолжить обычную тренировку →';
    } else {
      const card = byId.get(state.current.id);
      el('topicLabel').textContent = card.theme;
      el('statement').textContent = card.text;
      el('hintToggle').hidden = el('answerActions').hidden = false;
      if (state.current.hintOpen) showHint(true);
      if (typeof state.current.answer === 'boolean') showAnswer();
    }
    updateProgress(); save();
    if (moveFocus) el('statement').focus({ preventScroll: false });
  }
  function setCard(card) {
    state.current = card ? { id: card.id, answer: null, hintOpen: false } : null;
    render(true);
  }
  function answer(value) {
    if (!state.current || typeof state.current.answer === 'boolean') return;
    const card = byId.get(state.current.id);
    const record = state.records[card.id] || { attempts: 0, correct: 0, needsReview: false };
    record.attempts++;
    if (value === card.truth) record.correct++;
    record.needsReview = value !== card.truth;
    state.records[card.id] = record;
    state.current.answer = value;
    showAnswer(); updateProgress(); save();
  }
  restore();
  topics.forEach(topic => { const opt = document.createElement('option'); opt.value = topic; opt.textContent = topic; el('topicSelect').append(opt); });
  const requested = new URLSearchParams(location.search).get('card');
  if (requested && byId.has(requested)) {
    const card = byId.get(requested);
    if (state.current?.id !== card.id) state.current = { id: card.id, answer: null, hintOpen: false };
    state.topic = ''; state.review = false;
  }
  if (state.current && state.topic && byId.get(state.current.id).theme !== state.topic) state.current = null;
  if (!state.current) {
    const first = !state.review && !state.topic && !Object.keys(state.records).length ? byId.get('prev-056') : pickNext();
    state.current = first ? { id: first.id, answer: null, hintOpen: false } : null;
  }
  el('hintToggle').addEventListener('click', () => { if (state.current) showHint(!state.current.hintOpen); });
  el('btnTrue').addEventListener('click', () => answer(true));
  el('btnFalse').addEventListener('click', () => answer(false));
  el('nextCard').addEventListener('click', () => { if (!state.current) state.review = false; setCard(pickNext()); });
  el('topicSelect').addEventListener('change', () => { state.topic = el('topicSelect').value; setCard(pickNext()); });
  el('reviewOnly').addEventListener('change', () => { state.review = el('reviewOnly').checked; setCard(pickNext()); });
  document.addEventListener('keydown', event => {
    if (event.ctrlKey || event.altKey || event.metaKey || event.repeat || /INPUT|TEXTAREA|SELECT|BUTTON/.test(event.target?.tagName || '') || event.target?.isContentEditable) return;
    if (event.code === 'KeyJ' || event.code === 'KeyN') { event.preventDefault(); answer(event.code === 'KeyJ'); }
  });
  render(false);
})();

</script>
