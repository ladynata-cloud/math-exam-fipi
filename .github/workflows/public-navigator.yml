name: Public navigator visibility
on:
  pull_request:
    paths:
      - 'assets/assistant/**'
      - 'tools/public-navigator*'
      - 'tools/public_navigator*'
      - '.github/workflows/public-navigator.yml'
      - '**/*.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-navigator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Navigation regression and syntax
        run: |
          node --check assets/assistant/navigator-data.js
          node --check assets/assistant/navigator-widget.js
          node --test tools/public-navigator-preservation.test.cjs
          node tools/public-navigator-regression.cjs assets/assistant/navigator-data.js "$RUNNER_TEMP/navigator-regressions.json"
          git diff --check
      - name: Actual pages on desktop, mobile and landscape
        run: |
          npm install --prefix "$RUNNER_TEMP/navigator-qa" --no-save --no-package-lock --ignore-scripts playwright@1.62.1
          "$RUNNER_TEMP/navigator-qa/node_modules/.bin/playwright" install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/navigator-qa/node_modules" ARTIFACT_DIR="$RUNNER_TEMP/public-navigator-qa" NAV_LOCAL_SERVER=1 NAV_SHARD_COUNT=4 NAV_SHARD_INDEX=${{ matrix.shard }} node tools/public-navigator.browser.cjs
      - name: Browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-navigator-qa-${{ matrix.shard }}
          path: ${{ runner.temp }}/public-navigator-qa
          if-no-files-found: error
