name: Learner robots audit
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'tools/learner-robots/**'
      - '.github/workflows/learner-robots-audit.yml'
permissions:
  contents: read
jobs:
  fictional-learners:
    if: github.head_ref == 'test/learner-robots-weekly-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser tools outside project dependencies
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          npm install --prefix "$RUNNER_TEMP/learner-tools" --ignore-scripts --no-audit --no-fund playwright@1.55.0
          echo "NODE_PATH=$RUNNER_TEMP/learner-tools/node_modules" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_CORE_PATH=$RUNNER_TEMP/learner-tools/node_modules/playwright-core" >> "$GITHUB_ENV"
          python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print("PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH="+p.chromium.executable_path); p.stop()' >> "$GITHUB_ENV"
      - name: Read-only current-main and stale-PR reconciliation
        run: |
          mkdir -p robot-evidence
          git rev-parse HEAD > robot-evidence/audit-head.txt
          git ls-remote origin refs/heads/main > robot-evidence/remote-main.txt
          git fetch origin main refs/pull/126/head refs/pull/129/head refs/pull/146/head
          for pair in '126 9d17170801415d326d7e18667e823c853990d855' '129 c747035d887c2c28476ebdc7d8dfe8767f3b2d5c' '146 2069d21d96943602a03844ffb52f83d50b4700c9'; do
            set -- $pair
            git merge-tree --write-tree origin/main "$2" > "robot-evidence/virtual-merge-$1.txt" || echo 'Conflict: recorded, no branch changed.'
            git diff --name-only "$(git merge-base origin/main "$2")" origin/main > "robot-evidence/main-drift-$1.txt"
          done
          git worktree add --detach "$RUNNER_TEMP/learner-candidate" 2069d21d96943602a03844ffb52f83d50b4700c9
          echo "ROBOT_CANDIDATE=$RUNNER_TEMP/learner-candidate" >> "$GITHUB_ENV"
      - name: Run new fictional learners and independent arithmetic
        run: python tools/learner-robots/learner_robots.py --root . --candidate "$ROBOT_CANDIDATE" --out robot-evidence/journeys
      - name: Rerun candidate exact-head mathematics
        if: always()
        run: |
          set -o pipefail
          cd "$ROBOT_CANDIDATE"
          node tools/oge-task15-triangles.test.mjs 2>&1 | tee "$GITHUB_WORKSPACE/robot-evidence/candidate-math.txt"
      - name: Rerun candidate existing browser gate
        if: always()
        run: |
          set -o pipefail
          cd "$ROBOT_CANDIDATE"
          node tools/oge-task15-triangles.browser.mjs 2>&1 | tee "$GITHUB_WORKSPACE/robot-evidence/candidate-browser.txt"
      - name: Preserve evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learner-robot-evidence
          path: robot-evidence/
          retention-days: 7
