<script>
const SK='mathExamCourseProgress.v1', TID='ch2-p3-t5-quiz';
function lS(){try{const d=JSON.parse(localStorage.getItem(SK)||'{}');return d[TID]||{runs:0,best:0,events:[]}}catch{return{runs:0,best:0,events:[]}}}
function sS(s){try{const d=JSON.parse(localStorage.getItem(SK)||'{}');d[TID]=s;localStorage.setItem(SK,JSON.stringify(d))}catch{}}
function log(ev,extra){try{const s=lS();s.events=(s.events||[]);s.events.push({t:Date.now(),q:qi+1,e:ev,...(extra||{})});if(s.events.length>300)s.events=s.events.slice(-300);sS(s)}catch{}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

const QS=[
 {topic:'Формулировка', q:'Выберите <b>точную</b> формулировку второго признака равенства треугольников.',
  opts:[
   {t:'Если сторона и два прилежащих к ней угла одного треугольника соответственно равны стороне и двум прилежащим углам другого — треугольники равны.',ok:true},
   {t:'Если сторона и какие-нибудь два угла одного треугольника равны стороне и двум углам другого — треугольники равны.',ok:false,why:'углы должны быть именно <b>прилежащими</b> к стороне, а не любыми.'},
   {t:'Если два угла одного треугольника равны двум углам другого — треугольники равны.',ok:false,why:'без равной стороны это лишь подобие, а не равенство.'}]},
 {topic:'Словарь', q:'Дана сторона AB треугольника ABC. Какие углы к ней <b>прилежат</b>?',
  opts:[
   {t:'∠A и ∠B',ok:true},
   {t:'∠A и ∠C',ok:false,why:'∠C не прилежит к AB: его вершина C не является концом стороны AB.'},
   {t:'только ∠C',ok:false,why:'∠C как раз противолежит AB. Прилежат те углы, чьи вершины — концы стороны.'}]},
 {topic:'Доказательство', q:'В доказательстве второго признака — почему вершина C определяется <b>однозначно</b>?',
  opts:[
   {t:'Два луча — из A и из B — пересекаются ровно в одной точке.',ok:true},
   {t:'Потому что сторона AC равна A₁C₁.',ok:false,why:'равенство AC не дано — это рассуждение от первого признака.'},
   {t:'Потому что измерили третий угол.',ok:false,why:'в признаке ничего не измеряют; C ловится пересечением лучей.'}]},
 {topic:'Контрпример', q:'Достаточно ли двух сторон и угла, лежащего <b>против</b> одной из них, для равенства треугольников?',
  opts:[
   {t:'Нет: вершина может встать двумя разными способами.',ok:true},
   {t:'Да, это и есть второй признак.',ok:false,why:'второй признак — про сторону и два угла ПРИ ней, а не сторона-сторона-угол против.'},
   {t:'Да, всегда.',ok:false,why:'существуют два разных треугольника с такими данными (это видели в словаре §3).'}]},
 {topic:'Соответствие', q:'△ABC = △NMK по второму признаку. Какая сторона равна <b>NK</b>?',
  opts:[
   {t:'AC',ok:true},
   {t:'AB',ok:false,why:'AB соответствует NM (A↔N, B↔M).'},
   {t:'BC',ok:false,why:'BC соответствует MK (B↔M, C↔K). А NK ↔ AC.'}]},
 {topic:'Различение', q:'На чертеже отмечены <b>две стороны и угол между ними</b>. Каким признаком пользуемся?',
  opts:[
   {t:'Первым признаком',ok:true},
   {t:'Вторым признаком',ok:false,why:'второй — это сторона и два угла при ней, а здесь две стороны и угол между.'},
   {t:'Данных не хватает',ok:false,why:'данных достаточно: две стороны и угол между ними — это первый признак.'}]},
 {topic:'Различение', q:'На чертеже отмечены <b>сторона и два прилежащих к ней угла</b>. Каким признаком пользуемся?',
  opts:[
   {t:'Вторым признаком',ok:true},
   {t:'Первым признаком',ok:false,why:'первый — это две стороны и угол между ними, а здесь сторона и два угла.'},
   {t:'Данных не хватает',ok:false,why:'данных достаточно: сторона и два прилежащих угла — это второй признак.'}]},
 {topic:'Применение', q:'У △ABD и △CBD общая сторона BD; при ней ∠ABD=∠CBD и ∠ADB=∠CDB. Чем равны треугольники?',
  opts:[
   {t:'Равны по второму признаку.',ok:true},
   {t:'Равны по первому признаку.',ok:false,why:'отмечены сторона BD и два угла при ней — это второй признак, не первый.'},
   {t:'Доказать нельзя.',ok:false,why:'общая сторона BD плюс два прилежащих к ней угла — этого достаточно для второго признака.'}]}
];

let order=[], qi=0, answered=false, tries=0;
const results=[];

function el(id){return document.getElementById(id);}
function curQ(){return QS[order[qi]];}

function render(){
  answered=false;tries=0;
  const q=curQ();
  el('topic').textContent=q.topic;
  el('qtext').innerHTML=q.q;
  el('msg').className='msg';el('msg').innerHTML='';
  el('nextBtn').style.display='none';
  el('pf').style.width=Math.round(qi/QS.length*100)+'%';
  const opts=el('opts');opts.innerHTML='';
  shuffle(q.opts).forEach(o=>{
    const b=document.createElement('button');
    b.className='opt';b.innerHTML=o.t;
    b.onclick=()=>pick(o,b);
    opts.appendChild(b);
  });
  renderDots();
  log('q_start',{topic:q.topic});
}
function renderDots(){
  const d=el('dots');d.innerHTML='';
  for(let i=0;i<QS.length;i++){const e=document.createElement('div');e.className='qd'+(results[i]?' '+results[i]:'');d.appendChild(e);}
}
function pick(o,btn){
  if(answered)return;
  if(o.ok){
    answered=true;
    btn.classList.add('ok');
    [...el('opts').children].forEach(b=>{if(b!==btn)b.classList.add('dead');});
    results[order[qi]]=tries===0?'g':(tries===1?'y':'r');
    log('answer_ok',{tries});
    el('msg').className='msg show ok';
    el('msg').innerHTML='Верно!';
    el('nextBtn').style.display='inline-block';
    el('nextBtn').textContent= qi===QS.length-1?'Итоги →':'Дальше →';
    renderDots();
  }else{
    tries++;
    btn.classList.add('shake','dead');setTimeout(()=>btn.classList.remove('shake'),450);
    log('answer_wrong',{tries});
    el('msg').className='msg show err';
    el('msg').innerHTML='Не так: '+o.why+' Попробуйте ещё раз.';
  }
}
function nextQ(){ if(qi<QS.length-1){qi++;render();} else finish(); }

function finish(){
  el('bodyArea').style.display='none';
  el('bar').style.display='none';
  el('fin').style.display='block';
  const g=results.filter(r=>r==='g').length;
  el('finScore').textContent=g+' / '+QS.length;
  const fd=el('finDots');fd.innerHTML='';
  results.forEach(r=>{const e=document.createElement('div');e.className='fd '+(r||'r');fd.appendChild(e);});
  const v=el('verdict');
  if(g===QS.length){v.className='verdict good';v.textContent='Отличный результат — весь параграф усвоен на отлично!';}
  else if(g>=QS.length-2){v.className='verdict good';v.textContent='Хороший результат. Пара мест требует повторения — смотрите ниже.';}
  else{v.className='verdict mid';v.textContent='Зачёт пройден, но есть пробелы. Стоит вернуться к темам ниже и пройти зачёт ещё раз.';}
  // разбивка по темам
  const byTopic={};
  order.forEach((qidx,pos)=>{const t=QS[qidx].topic;if(!byTopic[t])byTopic[t]=[0,0];byTopic[t][1]++;if(results[qidx]==='g')byTopic[t][0]++;});
  const hints={Формулировка:'тренажёр 2 (доказательство)',Словарь:'тренажёр 0 (прилежащие и противолежащие)',Доказательство:'тренажёр 2',Контрпример:'тренажёр 0, акт 3',Соответствие:'тренажёр 4',Различение:'тренажёр 3',Применение:'тренажёр 4'};
  const sb=el('skills');sb.innerHTML='';
  Object.keys(byTopic).forEach(t=>{const [o,tot]=byTopic[t];
    const e=document.createElement('div');e.className='skill';
    e.innerHTML='<b>'+t+'</b>: '+o+' из '+tot+(o<tot?' — повторите '+hints[t]:' ✓');
    sb.appendChild(e);});
  const s=lS();s.runs=(s.runs||0)+1;s.passed=true;s.best=Math.max(s.best||0,g);sS(s);
  log('finish',{score:g});
}
function restart(){
  order=shuffle(QS.map((_,i)=>i));qi=0;results.length=0;
  el('fin').style.display='none';
  el('bodyArea').style.display='block';
  el('bar').style.display='flex';
  render();
}
log('start');
restart();
</script>

  panel.querySelector('[data-prompt]').textContent = config.prompt;
  panel.querySelector('[data-practice]').setAttribute('href', '../atlas/' + config.unit + '.html');
  const status = panel.querySelector('[data-status]');
  function warn(message) { status.textContent = message; status.className = 'an-warning'; }
  function flagConflict() {
    conflict = true;
    warn('В другой вкладке появилась более свежая запись. Эта тетрадь приостановлена. Скачай свои записи перед открытием свежей версии.');
    fields.forEach(field => { panel.querySelector('[data-note="'+field+'"]').readOnly = true; });
    panel.querySelector('[data-checkpoint]').disabled = true;
    panel.querySelector('[data-latest]').hidden = false;
  }
  function save() {
    if (conflict) return false;
    if (!unavailable) {
      try {
        if (read().updated !== savedVersion) { flagConflict(); return false; }
        state.updated = Math.max(Date.now(), savedVersion + 1);
        win.localStorage.setItem(key, JSON.stringify(state)); savedVersion = state.updated;
      } catch (_) { unavailable = true; }
    }
    if (unavailable) warn('Сохранение браузера недоступно. Записи доступны в этой вкладке: скачай тетрадь перед закрытием.');
    else { status.className=''; status.textContent='Записи сохранены в этом браузере.'; }
    return true;
  }
  const labels = {hint:'Открыта подсказка',solution:'Открыто решение',reveal:'Открыто объяснение',finish:'Завершён цикл тренажёра',solved:'Завершён шаг',answer_ok:'Верный ответ',answer_wrong:'Ошибка в ответе',quiz_ok:'Верный ответ в зачёте',quiz_wrong:'Ошибка в зачёте',opt_ok:'Верный выбор',opt_wrong:'Ошибка выбора',tap_wrong:'Ошибка выбора объекта',distractor:'Выбрано отвлекающее утверждение',step_wrong:'Ошибка шага',step_reject:'Переход пока не обоснован',choice_bad:'Ошибка выбора',choice_ok:'Верный выбор',num_ok:'Верный числовой ответ',task_start:'Открыто задание',start:'Начат тренажёр',reset:'Повтор текущего шага',restart:'Начат повтор',answer:'Ответ проверен',proof_done:'Собрано доказательство с опорой'};
  function renderJournal() {
    const help=state.events.filter(e=>['hint','solution','reveal'].includes(e.type)).length;
    const errors=state.events.filter(e=>/wrong|reject|bad|distractor/.test(e.type)).length;
    panel.querySelector('[data-journal]').textContent='В последних '+state.events.length+' сохранённых событиях: помощь — '+help+', ошибки — '+errors+'.';
    const list=panel.querySelector('[data-events]'); list.replaceChildren();
    for (const event of state.events.slice(-8)) { const li=doc.createElement('li'); li.textContent=(labels[event.type] || 'Событие: '+event.type)+(event.task?' · этап '+event.task:'');list.append(li); }
    if (!list.children.length) { const li=doc.createElement('li');li.textContent='Пока нет событий. Старые результаты не пересчитываются.';list.append(li); }
    const last=state.checkpoints.at(-1);
    panel.querySelector('[data-review]').textContent=last?'Повторить '+new Date(last.due).toLocaleDateString('ru-RU')+' · по твоей отметке от '+new Date(last.at).toLocaleDateString('ru-RU')+'.':'';
  }
  function populate() { for(const field of fields) panel.querySelector('[data-note="'+field+'"]').value=state[field];renderJournal(); }
  for (const field of fields) panel.querySelector('[data-note="'+field+'"]').addEventListener('input',e=>{state[field]=e.target.value.slice(0,field==='next'?1000:4000);save();});
  panel.querySelector('[data-checkpoint]').addEventListener('click',()=>{
    if(conflict)return;
    if(!state.prediction.trim()&&!state.reflection.trim()&&!state.next.trim()){warn('Сначала запиши свой ответ, вывод или следующий шаг.');return;}
    const days=Number(panel.querySelector('[data-days]').value)===7?7:1,now=Date.now(),due=new Date(now);due.setDate(due.getDate()+days);
    state.checkpoints.push({at:now,due:due.getTime(),days,summary:state.reflection||state.next||state.prediction});state.checkpoints=state.checkpoints.slice(-20);save();renderJournal();
  });
  panel.querySelector('[data-export]').addEventListener('click',()=>{
    const blob=new win.Blob([JSON.stringify({trainer:config.id,...state,recovered},null,2)],{type:'application/json'}),url=win.URL.createObjectURL(blob),a=doc.createElement('a');a.href=url;a.download=config.id+'-notebook.json';a.click();win.setTimeout(()=>win.URL.revokeObjectURL(url),1000);
  });
  panel.querySelector('[data-latest]').addEventListener('click',()=>{
    try { const current=read();
      const snapshot=clean(state);recovered.push(snapshot);
      const recovery=panel.querySelector('[data-recovery]');recovery.hidden=false;
      const group=doc.createElement('div');
      for(const field of fields){if(!snapshot[field])continue;const label=doc.createElement('label');label.textContent=({prediction:'Прежний прогноз',reflection:'Прежнее рассуждение',next:'Прежний следующий шаг'})[field];const area=doc.createElement('textarea');area.readOnly=true;area.value=snapshot[field];label.append(area);group.append(label);}
      recovery.querySelector('[data-recovery-notes]').append(group);
      state=current;savedVersion=current.updated;conflict=false;fields.forEach(field=>panel.querySelector('[data-note="'+field+'"]').readOnly=false);panel.querySelector('[data-checkpoint]').disabled=false;panel.querySelector('[data-latest]').hidden=true;populate();status.className='';status.textContent='Открыта свежая запись. Прежние записи доступны ниже и включены в скачиваемую тетрадь до закрытия вкладки.';} catch(_){warn('Свежую запись прочитать не удалось. Скачай записи этой вкладки.');}
  });
  function capture(type, extra) {
    if(conflict||!Object.hasOwn(labels,type))return;
    let detail=extra||{};
    try {const record=typeof win.lS==='function'?win.lS():null;const recent=record?.events?.at(-1);if(recent?.e===type)detail=recent;}catch(_){}
    let eventType=type;
    if(type==='answer'&&typeof detail.correct==='boolean')eventType=detail.correct?'answer_ok':'answer_wrong';
    const step=detail.task??detail.step??detail.q;
    state.events.push({type:eventType,at:Date.now(),task:['string','number'].includes(typeof step)?String(step).slice(0,40):''});state.events=state.events.slice(-80);save();renderJournal();
  }
  for (const name of ['log','logE']) {
    const original=win[name];if(typeof original!=='function')continue;
    win[name]=function(type,extra){const result=original.apply(this,arguments);capture(type,extra);return result;};
  }
  win.addEventListener('storage',event=>{if(event.key!==key||unavailable||conflict)return;try{if(read().updated!==savedVersion)flagConflict();}catch(_){flagConflict();}});
  populate();if(unavailable)warn('Сохранённую тетрадь прочитать не удалось. Она не перезаписана; новые записи доступны для скачивания в этой вкладке.');
})(window,document);
</script>
<!-- atanasyan-personal-notebook:end -->
</body>
</html>
