name: Atanasyan vector pairs — mobile layout

on:
  pull_request:
    paths:
      - 'stereo-course/textbook/**'
      - 'stereo-course/assets/**'
      - 'tools/stereo-textbook/**'
      - '.github/workflows/atanasyan-vector-pairs-layout.yml'
  push:
    # Also validate the exact PR head while its main merge is conflicted.
    branches: ['release/school-six-1189-681-1087-20261122']
    paths:
      - 'stereo-course/textbook/**'
      - 'stereo-course/assets/**'
      - 'tools/stereo-textbook/**'
      - '.github/workflows/atanasyan-vector-pairs-layout.yml'

permissions:
  contents: read

jobs:
  vector-pairs-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - name: Preserve vector mathematics and historical migration checks
        run: |
          git rev-parse HEAD
          node tools/stereo-textbook/vector-pairs.test.cjs
          node tools/stereo-textbook/harmonization-input-migration.test.cjs
      - name: Fit the full model and retain work at 320, 390 and 1280 px
        env:
          TEXTBOOK_PRACTICE_GROUP: vectorPairs
          INSCRIBED_SOLIDS_ARTIFACTS: artifacts/vector-pairs-layout
        run: node tools/stereo-textbook/inscribed-solids.browser.cjs
      - name: Preserve all fifteen phone and desktop screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atanasyan-vector-pairs-layout
          path: artifacts/vector-pairs-layout/
          retention-days: 7
          if-no-files-found: error
