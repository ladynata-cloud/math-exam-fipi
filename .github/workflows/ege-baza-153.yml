name: EGE base — PR153 reconciliation
on:
  pull_request:
    paths: ['ege-baza/**', 'trainers/ege-baza/**', 'tools/ege-baza-153*', 'tools/ege-baza-practice.browser.cjs', '.github/workflows/ege-baza-153.yml']
  push:
    branches: [main]
    paths: ['ege-baza/**', 'trainers/ege-baza/**', 'tools/ege-baza-153*', 'tools/ege-baza-practice.browser.cjs', '.github/workflows/ege-baza-153.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Pinned browser and DOM tools
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.62.1 jsdom@26.1.0
          npx playwright install --with-deps chromium
      - name: Mathematics, old tasks, references and saved work
        run: |
          node tools/ege-baza-153.test.cjs
          node tools/ege-baza-practice.test.cjs
          node tools/ege-release/math.cjs
          node tools/ege-baza-2027-gate.mjs
          node tools/ege-baza-practice.dom.cjs
          node tools/ege-baza-task-first.test.cjs
          node --test tools/ege-baza-reference.test.cjs
          node tools/ege-baza-reference-legacy.test.cjs
          git diff --check
      - name: Browser models, mobile layouts and learning flows
        env:
          EGE_153_SHOTS: artifacts/ege-153
          EGE_TASK_FIRST_SHOTS: artifacts/ege-task-first
        run: |
          node tools/ege-baza-153.browser.cjs
          node tools/ege-baza-task-first.browser.cjs
          node tools/ege-baza-practice.browser.cjs
          node tools/ege-baza-reasoning.browser.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ege-153-evidence
          path: artifacts/
          retention-days: 14
