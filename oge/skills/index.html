":"Сопоставляет доли одного и того же целого и выбирает одинаковые единицы для их сложения."},{"id":"base-check","label":"Проверяю обратным действием","requires":["base-products","base-division"],"evidence":"Выбирает проверку, которая действительно восстанавливает исходное число."},{"id":"base-round-tens","label":"Округляю до десятков","requires":["base-place"],"evidence":"Определяет десятки и цифру единиц, округляет целое число, в том числе с переносом через 9.","supportLinks":[{"label":"Округление до десятков по шагам","href":"/trainers/rounding-stepwise.html?place=1&from=division","newTab":true}]},{"id":"base-round-hundreds","label":"Округляю до сотен","requires":["base-place"],"evidence":"При округлении до сотен смотрит на десятки, учитывает границу с цифрой 5 и записывает нули в младших разрядах.","supportLinks":[{"label":"Округление до сотен по шагам","href":"/trainers/rounding-stepwise.html?place=2&from=division","newTab":true}]},{"id":"base-round-thousands","label":"Округляю до тысяч","requires":["base-place"],"evidence":"При округлении до тысяч смотрит на сотни; сохраняет правильный разряд результата при переносе.","supportLinks":[{"label":"Округление до тысяч по шагам","href":"/trainers/rounding-stepwise.html?place=3&from=division","newTab":true}]},{"id":"base-quotient-digit","label":"Подбираю цифру частного","requires":["base-division"],"evidence":"Выбирает наибольшую цифру от 0 до 9, произведение которой на делитель не превышает неполного делимого.","supportLinks":[{"label":"Подбор цифры по готовым кратным","href":"/trainers/oge-basics/multiplication-division/long-division-quotient-digit.html","newTab":true}]},{"id":"base-quotient-check","label":"Проверяю произведение и остаток","requires":["base-quotient-digit"],"evidence":"Проверяет цифру по исходным числам: произведение не превышает неполного делимого, остаток неотрицателен и меньше делителя.","supportLinks":[{"label":"Подбор, умножение и проверка остатка","href":"/trainers/oge-basics/multiplication-division/long-division-quotient-digit.html","newTab":true}]},{"id":"base-quotient-estimate","label":"Исправляю цифру после прикидки","requires":["base-round-tens","base-quotient-check"],"evidence":"Использует округление только для пробной цифры; точной проверкой исправляет слишком большую или слишком маленькую цифру и не записывает 10 на месте одной цифры.","supportLinks":[{"label":"Прикидка и точная проверка по шагам","href":"/trainers/oge-basics/multiplication-division/quotient-estimate.html","newTab":true}]}],"quick":[{"id":"base-q-place","title":"Десятые и сотые","prompt":"Вычисли: 0,6 + 0,08.","type":"number","skillId":"base-place","answer":0.68,"hint":"Запиши шесть десятых как шестьдесят сотых.","explanation":"0,6 = 0,60. Получаем 60 сотых + 8 сотых = 68 сотых, то есть 0,68."},{"id":"base-q-groups","title":"Семь групп","prompt":"В каждой из 7 одинаковых групп по 8 элементов. Сколько элементов всего?","type":"number","skillId":"base-products","answer":56,"hint":"Можно взять пять групп и ещё две: 5 × 8 + 2 × 8.","explanation":"7 × 8 = 56. Проверка: 56 ÷ 7 = 8 элементов в группе."},{"id":"base-q-division","title":"Разложи поровну","prompt":"84 карточки разложили поровну в 6 стопок. Сколько карточек в одной стопке?","type":"number","skillId":"base-division","answer":14,"hint":"Сначала положи по 10 карточек. Сколько ещё нужно распределить?","explanation":"По 10 карточек в 6 стопок — это 60. Оставшиеся 24 дают ещё по 4. В каждой стопке 14 карточек; 14 × 6 = 84."},{"id":"base-q-sign","title":"Встречные изменения","prompt":"Какое равенство верно?","type":"choice","skillId":"base-sign","options":[{"text":"−7 + 3 = −4","correct":true},{"text":"−7 + 3 = −10","correct":false},{"text":"−7 + 3 = 4","correct":false}],"hint":"Три положительные единицы компенсируют три из семи отрицательных.","explanation":"После компенсации трёх пар остаются четыре отрицательные единицы: −7 + 3 = −4. Сумма модулей здесь не подходит: знаки разные."},{"id":"exp-base-division-round-entry","title":"До ближайшего десятка","prompt":"Округли 147 до десятков.","type":"number","skillId":"base-round-tens","answer":150,"hint":"Найди цифру десятков и посмотри на цифру справа.","explanation":"В единицах стоит 7. Увеличиваем число десятков на один и заменяем единицы нулём: 147 ≈ 150.","learningMode":"quick"},{"id":"exp-base-division-round-exit","title":"Когда десятки переходят в сотни","prompt":"Округли 995 до десятков.","type":"number","skillId":"base-round-tens","answer":1000,"hint":"Единиц пять. Подумай, что произойдёт при увеличении девяти десятков на один.","explanation":"995 находится посередине между 990 и 1000. По правилу округления увеличиваем число десятков: 995 ≈ 1000.","learningMode":"quick"},{"id":"exp-base-division-hundreds","title":"Смотрим на десятки","prompt":"Округли 1450 до сотен.","type":"number","skillId":"base-round-hundreds","answer":1500,"hint":"При округлении до сотен решение зависит от цифры десятков.","explanation":"В разряде десятков стоит 5. Увеличиваем число сотен на один; десятки и единицы заменяем нулями: 1450 ≈ 1500.","learningMode":"quick"},{"id":"exp-base-division-thousands","title":"Переход к десятку тысяч","prompt":"Округли 9500 до тысяч.","type":"number","skillId":"base-round-thousands","answer":10000,"hint":"Сотен пять. Увеличь число тысяч на один и проверь перенос.","explanation":"9500 находится посередине между 9000 и 10 000. Увеличение девяти тысяч на одну тысячу даёт 10 000.","learningMode":"quick"},{"id":"exp-base-division-digit-entry","title":"Сколько полных групп поместится","prompt":"Неполное делимое равно 47, делитель — 6. Какую цифру нужно записать в частном?","type":"choice","skillId":"base-quotient-digit","options":[{"text":"6","correct":false},{"text":"7","correct":true},{"text":"8","correct":false},{"text":"9","correct":false}],"hint":"Сравни произведение выбранной цифры и 6 с числом 47. Проверь и следующую цифру.","explanation":"6 × 7 = 42 ≤ 47, а 6 × 8 = 48 > 47. Цифра частного — 7; остаток 47 − 42 = 5 меньше 6.","learningMode":"quick"},{"id":"exp-base-division-digit-exit","title":"Наибольшая подходящая цифра","prompt":"Неполное делимое равно 83, делитель — 9. Выбери цифру частного.","type":"choice","skillId":"base-quotient-digit","options":[{"text":"7","correct":false},{"text":"8","correct":false},{"text":"9","correct":true},{"text":"0","correct":false}],"hint":"Нужна наибольшая цифра, произведение которой на 9 не больше 83.","explanation":"9 × 9 = 81, остаток равен 2 и меньше делителя 9. Поэтому выбираем цифру 9.","learningMode":"quick"},{"id":"exp-base-division-estimate-entry","title":"Прикидка дала слишком много","prompt":"Для неполного делимого 266 и делителя 33 прикидка дала 270 : 30 = 9. Какую цифру запишем после проверки по исходным числам?","type":"choice","skillId":"base-quotient-estimate","options":[{"text":"9","correct":false},{"text":"8","correct":true},{"text":"7","correct":false},{"text":"6","correct":false}],"hint":"Умножь 33 на пробную цифру. Если произведение больше 266, уменьши цифру и проверь снова.","explanation":"33 × 9 = 297 > 266, поэтому 9 не подходит. 33 × 8 = 264, остаток 2 меньше 33. Записываем 8.","learningMode":"quick"},{"id":"exp-base-division-estimate-exit","title":"Прикидка дала слишком мало","prompt":"Для неполного делимого 244 и делителя 27 прикидка дала 240 : 30 = 8. Какую цифру нужно записать после точной проверки?","type":"choice","skillId":"base-quotient-estimate","options":[{"text":"7","correct":false},{"text":"8","correct":false},{"text":"9","correct":true},{"text":"0","correct":false}],"hint":"Если после вычитания произведения остаток не меньше делителя, поместится ещё одна полная группа.","explanation":"27 × 8 = 216, остаток 28 ещё не меньше 27. Увеличиваем цифру: 27 × 9 = 243, остаток 1 меньше 27. Верная цифра — 9.","learningMode":"quick"}],"creative":[{"id":"base-c-battle","title":"Битва модулей","prompt":"У отрицательной стороны 8 единиц, у положительной — 5. Убери встречные пары и найди сумму −8 + 5. Кто остаётся и сколько?","type":"battle","skillId":"base-sign","a":-8,"b":5,"hint":"Одна единица +1 вместе с одной единицей −1 даёт ноль.","explanation":"Пять встречных пар дают ноль. Остаются три отрицательные единицы, поэтому −8 + 5 = −3. Такая компенсация объясняет сложение разных знаков; для одинаковых знаков нужна другая модель."},{"id":"base-c-exchange","title":"Размен без потерь","prompt":"Представь 3,20 единицами, десятыми и сотыми так, чтобы затем можно было убрать 0,47 без нового размена. Сохрани величину 3,20; подготовь не меньше 4 десятых и 7 сотых.","type":"build","skillId":"base-place","fields":[{"name":"u","label":"Единицы","min":0,"max":3,"step":1,"initial":3},{"name":"t","label":"Десятые","min":0,"max":32,"step":1,"initial":2},{"name":"h","label":"Сотые","min":0,"max":320,"step":1,"initial":0}],"constants":{},"conditions":[{"left":"100*u+10*t+h","op":"eq","right":"320"},{"left":"t","op":"gte","right":"4"},{"left":"h","op":"gte","right":"7"}],"exampleSolution":{"u":2,"t":11,"h":10},"hint":"Одну единицу можно разменять на 10 десятых, одну десятую — на 10 сотых. Величина от размена не меняется.","explanation":"Подойдёт, например, 2 единицы, 11 десятых и 10 сотых: 2 + 1,1 + 0,10 = 3,20. Убираем 4 десятых и 7 сотых: остаются 2 единицы, 7 десятых и 3 сотых, то есть 2,73. Другие размены с той же величиной тоже допустимы."},{"id":"base-c-common-unit","title":"Одна мерка","prompt":"Сложи 1/2 и 1/3 одного и того же целого. Подбери одинаковые маленькие доли и собери результат.","type":"fraction","skillId":"base-unit","numeratorA":1,"denominatorA":2,"numeratorB":1,"denominatorB":3,"hint":"Раздели целое на столько равных частей, чтобы и половина, и треть состояли из целого числа таких частей.","explanation":"Общая мерка — одна шестая. 1/2 = 3/6, 1/3 = 2/6, поэтому сумма равна 5/6. Обе исходные дроби относятся к одному и тому же целому."},{"id":"base-c-packages","title":"Частное по частям","prompt":"Упакуй 557 деталей в полные коробки по 23. Укажи число полных коробок и остаток; в остатке не должно хватать деталей на ещё одну коробку.","type":"build","skillId":"base-division","fields":[{"name":"q","label":"Полных коробок","min":0,"max":30,"step":1,"initial":20},{"name":"r","label":"Деталей осталось","min":0,"max":100,"step":1,"initial":0}],"constants":{},"conditions":[{"left":"23*q+r","op":"eq","right":"557"},{"left":"r","op":"lt","right":"23"}],"exampleSolution":{"q":24,"r":5},"hint":"20 коробок заберут 460 деталей. Посмотри, сколько полных коробок получится из оставшихся 97.","explanation":"23 × 20 = 460, ещё 4 коробки — это 92 детали. Получается 24 полные коробки и 5 деталей: 23 × 24 + 5 = 557. Остаток 5 меньше 23."},{"id":"base-c-mirror","title":"Зеркало нуля","prompt":"Отметь число, противоположное −5. Оно должно находиться на таком же расстоянии от нуля с другой стороны.","type":"numberline","skillId":"base-sign","min":-6,"max":6,"answer":5,"hint":"Два противоположных числа в сумме дают ноль.","explanation":"Число 5 противоположно −5: −5 + 5 = 0. Оба числа находятся на расстоянии 5 от нуля."},{"id":"base-c-reverse-check","title":"Проверка без пересчёта","prompt":"Соедини каждый результат с его проверкой обратным действием.","type":"match","skillId":"base-check","pairs":[{"left":"84 ÷ 6 = 14","right":"14 × 6 = 84"},{"left":"53 ÷ 7 = 7, остаток 4","right":"7 × 7 + 4 = 53"},{"left":"3,20 − 0,47 = 2,73","right":"2,73 + 0,47 = 3,20"}],"hint":"Проверка должна восстановить исходное число. При делении с остатком не забудь вернуть и остаток.","explanation":"Частное проверяем умножением; при наличии остатка прибавляем его. Разность проверяем сложением с вычитаемым. Все три проверки восстанавливают исходную величину."},{"id":"exp-base-division-round-workshop","title":"Поймай ошибку в правиле","prompt":"Автор написал: «Любое целое число от 241 до 249 при округлении до десятков даёт 240». Найди в этом промежутке число, которое опровергает его правило.","type":"build","skillId":"base-round-tens","fields":[{"name":"n","label":"Число, на котором правило не работает","min":241,"max":249,"integer":true,"step":1,"initial":""}],"constants":{},"conditions":[{"left":"n","op":"gte","right":"245"}],"exampleSolution":{"n":245},"alternativeSolutions":[{"n":246},{"n":249}],"hint":"Граница между соседними десятками проходит посередине. С какой цифры единиц начинаем увеличивать число десятков?","explanation":"241–244 округляются до 240, а 245–249 — до 250. Поэтому подойдёт любое целое число от 245 до 249: правило автора неверно.","learningMode":"creative"},{"id":"exp-base-division-digit-workshop","title":"Две проверки для одной цифры","prompt":"Лена для неполного делимого 184 и делителя 26 предлагает цифру 6, а Миша — 7. Выбери цифру и собери точную проверку. Произведение выбранной цифры не должно превышать 184; следующей цифры — должно быть больше 184.","type":"build","skillId":"base-quotient-check","fields":[{"name":"q","label":"Цифра частного","min":0,"max":9,"integer":true,"step":1,"initial":""},{"name":"product","label":"26 × выбранная цифра","min":0,"max":234,"integer":true,"step":1,"initial":""},{"name":"r","label":"Остаток после вычитания","min":0,"max":184,"integer":true,"step":1,"initial":""},{"name":"next","label":"26 × следующая цифра","min":26,"max":260,"integer":true,"step":1,"initial":""}],"constants":{},"conditions":[{"left":"product","op":"eq","right":"26*q"},{"left":"r","op":"eq","right":"184-product"},{"left":"r","op":"lt","right":"26"},{"left":"next","op":"eq","right":"26*(q+1)"},{"left":"next","op":"gt","right":"184"}],"exampleSolution":{"q":7,"product":182,"r":2,"next":208},"hint":"Посчитай произведение для пробной цифры и остаток. Остаток должен быть меньше 26. Затем проверь следующую цифру.","explanation":"Подходит 7: 26 × 7 = 182, 184 − 182 = 2 < 26; 26 × 8 = 208 > 184. Если взять 6, остаток получится 28, а в нём ещё помещается одна группа по 26.","learningMode":"creative"},{"id":"exp-base-division-estimate-workshop","title":"Три пробные цифры","prompt":"После округления получились три пробные цифры. Соедини каждый случай с правильным решением после умножения исходного делителя на выбранную цифру.","type":"match","skillId":"base-quotient-estimate","pairs":[{"left":"266 : 33. Прикидка дала 9.","right":"Уменьшить до 8: 33 × 8 = 264, а 33 × 9 = 297."},{"left":"184 : 26. Прикидка дала 6.","right":"Увеличить до 7: 26 × 7 = 182, а 26 × 8 = 208."},{"left":"296 : 31. Прикидка дала 10.","right":"Записать 9: 31 × 9 = 279, а 31 × 10 = 310."}],"hint":"Одна цифра частного — от 0 до 9. Проверяй каждую пробу по исходным числам; прикидка может ошибаться в обе стороны.","explanation":"Первая проба завышена, вторая занижена. В третьем случае 10 не является одной цифрой и даёт слишком большое произведение. Точные проверки дают соответственно 8, 7 и 9; остатки 2, 2 и 17 меньше своих делителей.","learningMode":"creative"},{"id":"exp-base-division-round-neighbors","title":"Соседи после округления","prompt":"Подбери два соседних целых числа. Меньшее при округлении до сотен должно дать 2500, а большее при округлении до тысяч — 3000. Большее число должно быть ровно на 1 больше меньшего. Подходит несколько ответов.","type":"build","skillId":"base-round-thousands","fields":[{"name":"a","label":"Меньшее число: округляем до сотен","min":0,"max":9999,"integer":true,"step":1,"initial":""},{"name":"b","label":"Большее число: округляем до тысяч","min":0,"max":9999,"integer":true,"step":1,"initial":""}],"constants":{},"conditions":[{"left":"b","op":"eq","right":"a+1"},{"left":"a","op":"gte","right":"2450"},{"left":"a","op":"lt","right":"2550"},{"left":"b","op":"gte","right":"2500"},{"left":"b","op":"lt","right":"3500"}],"exampleSolution":{"a":2499,"b":2500},"alternativeSolutions":[{"a":2500,"b":2501},{"a":2549,"b":2550}],"hint":"Найди границы целых чисел, которые при округлении дают 2500 сотнями и 3000 тысячами. Потом выбери соседнюю пару.","explanation":"До сотен в 2500 округляются целые числа 2450–2549. До тысяч в 3000 — числа 2500–3499. Поэтому можно взять 2499 и 2500, 2500 и 2501 или другую пару: меньшее число может быть любым целым от 2499 до 2549.","learningMode":"creative"}],"extensions":["Маршрут разрядов: размен целых и десятичных чисел → письменные действия → оценка правдоподобия результата.","Маршрут деления: равные группы → таблица кратных → частное по частям → деление уголком → остаток и обратная проверка.","Маршрут знаков: прямая → противоположное число → одинаковые и разные знаки → вычитание как сложение с противоположным → буквенные выражения.","Маршрут долей: одно целое → равные части → дробь как число → общая мерка → переход к заданиям №6 и №7.","Вернуться к короткому заданию после паузы и решить без обязательной картинки. Отдельно отметить, какая помощь ещё нужна."],"overviewTaskIds":["base-q-place","base-q-groups","base-q-division","base-q-sign"]},{"id":"n1","title":"№1. Практические задачи","goal":"В заданиях №1–5 вопросы зависят от сюжета. Здесь — чтение таблиц, обозначений и планов. Начни с четырёх коротких примеров; карту и мастерские можно открыть по желанию.","sourceHref":"/trainers/oge-1-5-trainers/practice-1-5-map.html","sourceLinksTitle":"Сюжеты №1–5","sourceLinks":[{"label":"Дороги по клеткам","href":"/trainers/oge-1-5-trainers/practice-1-5-roads-grid.html"},{"label":"Схема дорог","href":"/trainers/oge-1-5-trainers/practice-1-5-roads-schema.html"},{"label":"Шины","href":"/trainers/oge-1-5-trainers/practice-1-5-tires.html"},{"label":"Печки","href":"/trainers/oge-1-5-trainers/practice-1-5-stoves.html"},{"label":"Участки","href":"/trainers/oge-1-5-trainers/practice-1-5-land-plots.html"},{"label":"Квартиры","href":"/trainers/oge-1-5-trainers/practice-1-5-apartments.html"},{"label":"Тарифы","href":"/trainers/oge-1-5-trainers/practice-1-5-tariffs.html"},{"label":"Листы","href":"/trainers/oge-1-5-trainers/practice-1-5-paper-sheets.html"}],"skills":[{"id":"n1-table","label":"Находить нужную строку и столбец","requires":[],"evidence":"Выбирает данные указанного тарифа и отличает минуты от рублей."},{"id":"n1-marking","label":"Находить ширину шины по маркировке","requires":[],"evidence":"Находит ширину шины в миллиметрах по стандартной записи маркировки."},{"id":"n1-plan","label":"Находить помещение на плане","requires":[],"evidence":"Сопоставляет положение помещения на плане с его описанием."},{"id":"n1-road-signs","label":"Читать обозначения на схеме дорог","requires":[],"evidence":"Выбирает маршрут из дорог нужного вида по условным обозначениям."},{"id":"n1-quantity-units","label":"Различать величину и её единицу","requires":[],"evidence":"Сопоставляет длину, площадь, объём и время с подходящими единицами."},{"id":"n1-needed-data","label":"Выбирать данные для ответа","requires":["n1-plan"],"evidence":"Отделяет размеры и ширину ворот, нужные для длины ограждения, от лишних сведений."}],"quick":[{"id":"n1-q-tariff-table","title":"Найди нужную строку","prompt":"Сколько минут включено в тариф «Поездки»?","type":"number","skillId":"n1-table","contextId":"tariffs","hint":"Сначала выбери строку «Поездки», затем столбец с минутами.","explanation":"В строке «Поездки» указано 450 минут. Число 530 относится к абонентской плате.","answer":450,"unit":"мин","table":{"headers":["Тариф","Минуты","Плата, руб."],"rows":[["Спокойный",300,390],["Поездки",450,530]]}},{"id":"n1-q-tire-width","title":"Три числа на шине","prompt":"На шине написано 195/60 R15. Какова её ширина в миллиметрах?","type":"number","skillId":"n1-marking","contextId":"tires","hint":"Первое число — ширина в миллиметрах; второе — высота профиля в процентах от ширины.","explanation":"Ширина равна 195 мм. Число 60 означает 60% от ширины, а 15 — диаметр обода в дюймах.","answer":195,"unit":"мм"},{"id":"n1-q-apartment-plan","title":"Где кухня?","prompt":"Кухня находится в правом верхнем углу изображённого плана. Каким номером она обозначена?","type":"number","skillId":"n1-plan","contextId":"apartments","hint":"Рассматривай стороны именно так, как показано на плане: сначала найди верхний ряд, затем правое помещение.","explanation":"В правом верхнем углу расположено помещение 2.","answer":2,"unit":"","visual":{"kind":"polygon","points":[[2,4.5],[6,4.5],[2,1.5],[6,1.5]],"labels":["1","2","3","4"],"pointsOnly":true,"polygons":[{"points":[[0,3],[4,3],[4,6],[0,6]]},{"points":[[4,3],[8,3],[8,6],[4,6]]},{"points":[[0,0],[4,0],[4,3],[0,3]]},{"points":[[4,0],[8,0],[8,3],[4,3]]}],"bounds":{"xMin":-1,"xMax":9,"yMin":-1,"yMax":7},"ariaLabel":"Четыре помещения: 1 слева сверху, 2 справа сверху, 3 слева снизу, 4 справа снизу."}},{"id":"n1-q-road-signs","title":"Доехать по шоссе","prompt":"На схеме сплошными линиями показано шоссе, пунктиром — тропа. Какой из предложенных маршрутов из A в C проходит только по шоссе?","type":"choice","skillId":"n1-road-signs","contextId":"roads-schema","hint":"Проверь вид каждой дороги на маршруте. Одного участка тропы уже достаточно, чтобы маршрут не подошёл.","explanation":"Маршрут A–B–C состоит из двух сплошных участков. В маршрутах A–C и A–B–A–C есть тропа AC.","visual":{"kind":"polygon","points":[[0,0],[0,3],[4,3]],"labels":["A","B","C"],"segments":[{"from":[0,0],"to":[0,3],"label":"3 км","dashed":false},{"from":[0,3],"to":[4,3],"label":"4 км","dashed":false},{"from":[0,0],"to":[4,3],"label":"5 км","dashed":true}],"pointsOnly":true,"ariaLabel":"A слева внизу, B слева вверху, C справа вверху. AB и BC — сплошные линии, AC — пунктир."},"options":[{"text":"A–B–C","correct":true},{"text":"A–C","correct":false},{"text":"A–B–A–C","correct":false}]}],"creative":[{"id":"n1-c-units","title":"Верни единицы","prompt":"У четырёх величин пропали единицы. Подбери подходящую единицу к каждой строке.","type":"match","skillId":"n1-quantity-units","contextId":"stoves","hint":"Длина описывает одну протяжённость, площадь — поверхность, объём — пространство внутри тела.","explanation":"Ширину шины удобно указывать в миллиметрах, площадь кухни — в квадратных метрах, объём парной — в кубических метрах, время — в минутах.","pairs":[{"left":"Ширина шины","right":"мм"},{"left":"Площадь кухни","right":"м²"},{"left":"Объём парной","right":"м³"},{"left":"Время в пути","right":"мин"}]},{"id":"n1-c-needed-data","title":"Что действительно нужно?","prompt":"Нужно найти длину ограждения прямоугольного участка за вычетом ворот. Отметь все данные, необходимые для этого расчёта.","type":"multi","skillId":"n1-needed-data","contextId":"land-plots","hint":"Сначала представь ограду по всему периметру, затем исключи проём для ворот. Цвет и стоимость не меняют длину.","explanation":"Нужны длина, ширина участка и ширина ворот: 2·(18+12)−3 = 57 м. Цена пригодилась бы для стоимости, а цвет для этого расчёта не нужен.","options":[{"text":"Длина участка — 18 м.","correct":true},{"text":"Ширина участка — 12 м.","correct":true},{"text":"Ширина ворот — 3 м.","correct":true},{"text":"Цвет ограды — зелёный.","correct":false},{"text":"Цена одного метра ограды — 500 руб.","correct":false}]},{"id":"n1-c-missing-row","title":"Восстанови строку тарифа","prompt":"За месяц использовали 260 минут. Абонентская плата — 300 руб., каждая минута сверх пакета стоит 3 руб. В счёте — 420 руб.; других начислений нет. Восстанови число минут сверх пакета и число минут в пакете.","type":"build","skillId":"n1-table","contextId":"tariffs","hint":"Сначала отдели доплату от абонентской платы. Затем узнай, за сколько минут она начислена.","explanation":"Доплата равна 420−300 = 120 руб., значит, сверх пакета использовано 120:3 = 40 минут. В пакет входило 260−40 = 220 минут.","fields":[{"name":"extra","label":"Минут сверх пакета","min":0,"max":260,"initial":0,"integer":true,"step":1},{"name":"included","label":"Минут в пакете","min":0,"max":260,"initial":0,"integer":true,"step":1}],"constants":{},"conditions":[{"left":"300+3*extra","op":"eq","right":"420"},{"left":"extra+included","op":"eq","right":"260"}],"exampleSolution":{"extra":40,"included":220}}],"extensions":["По желанию реши один полный сюжет: те же сведения понадобятся в нескольких вопросах.","Объясни, какие данные ты использовал и какие не понадобились."],"overviewTaskIds":["n1-q-tariff-table","n1-q-tire-width","n1-q-apartment-plan","n1-q-road-signs"]},{"id":"n2","title":"№2. Практические задачи","goal":"В заданиях №1–5 вопросы зависят от сюжета. Здесь — масштаб, единицы длины, площади и объёма. Начни с четырёх коротких примеров; карту и мастерские можно открыть по желанию.","sourceHref":"/trainers/oge-1-5-trainers/practice-1-5-map.html","sourceLinksTitle":"Сюжеты №1–5","sourceLinks":[{"label":"Дороги по клеткам","href":"/trainers/oge-1-5-trainers/practice-1-5-roads-grid.html"},{"label":"Схема дорог","href":"/trainers/oge-1-5-trainers/practice-1-5-roads-schema.html"},{"label":"Шины","href":"/trainers/oge-1-5-trainers/practice-1-5-tires.html"},{"label":"Печки","href":"/trainers/oge-1-5-trainers/practice-1-5-stoves.html"},{"label":"Участки","href":"/trainers/oge-1-5-trainers/practice-1-5-land-plots.html"},{"label":"Квартиры","href":"/trainers/oge-1-5-trainers/practice-1-5-apartments.html"},{"label":"Тарифы","href":"/trainers/oge-1-5-trainers/practice-1-5-tariffs.html"},{"label":"Листы","href":"/trainers/oge-1-5-trainers/practice-1-5-paper-sheets.html"}],"skills":[{"id":"n2-scale","label":"Переводить длину с плана в действительность","requires":["n1-plan"],"evidence":"Использует размер клетки или масштаб и сохраняет единицы при переходе к реальной длине."},{"id":"n2-length-units","label":"Переводить единицы длины","requires":["base-place"],"evidence":"Переводит дюймы в миллиметры по заданному соотношению."},{"id":"n2-area-units","label":"Переводить единицы площади","requires":["n1-quantity-units"],"evidence":"Учитывает, что один квадратный метр содержит 10 000 квадратных сантиметров."},{"id":"n2-volume-units","label":"Переводить единицы объёма","requires":["n1-quantity-units"],"evidence":"Учитывает три измерения при переходе от кубических сантиметров к кубическим метрам."},{"id":"n2-unit-power","label":"Различать перевод длины, площади и объёма","requires":["n2-length-units"],"evidence":"Выбирает множители 100, 10 000 или 1 000 000 при переводе метров в сантиметры."},{"id":"n2-rounding","label":"Округлять результат в нужных единицах","requires":["base-place"],"evidence":"Сначала переводит площадь в заданные единицы, затем округляет до указанного разряда."}],"quick":[{"id":"n2-q-grid-scale","title":"Клетки превращаются в километры","prompt":"Длина прямого участка дороги на плане равна 6 сторонам клетки. Одна сторона клетки соответствует 150 м. Найди длину дороги в километрах.","type":"number","skillId":"n2-scale","contextId":"roads-grid","hint":"Сначала найди метры. Для перехода к километрам раздели их число на 1000.","explanation":"6·150 = 900 м; 900:1000 = 0,9 км.","answer":0.9,"unit":"км","visual":{"kind":"polygon","points":[[0,0],[6,0]],"labels":["A","B"],"segments":[{"from":[0,0],"to":[6,0],"label":"6 клеток","dashed":false}],"pointsOnly":true,"grid":true,"bounds":{"xMin":-1,"xMax":7,"yMin":-1,"yMax":2},"ariaLabel":"Отрезок AB занимает шесть сторон клетки."}},{"id":"n2-q-tire-inch","title":"Дюймы и миллиметры","prompt":"Диаметр обода — 16 дюймов. Один дюйм равен 25,4 мм. Найди диаметр обода в миллиметрах.","type":"number","skillId":"n2-length-units","contextId":"tires","hint":"Каждому из 16 дюймов соответствует 25,4 мм.","explanation":"16·25,4 = 406,4 мм. Здесь вычисляется диаметр обода, а не наружный диаметр колеса.","answer":406.4,"unit":"мм"},{"id":"n2-q-apartment-area","title":"Площадь в других единицах","prompt":"Площадь небольшого участка пола равна 25 000 см². Вырази эту площадь в квадратных метрах.","type":"number","skillId":"n2-area-units","contextId":"apartments","hint":"Квадрат 1 м на 1 м — это квадрат 100 см на 100 см. Сколько в нём квадратных сантиметров?","explanation":"1 м² = 10 000 см², поэтому 25 000:10 000 = 2,5 м². Деление на 100 переводило бы длину, а не площадь.","answer":2.5,"unit":"м²"},{"id":"n2-q-stove-volume","title":"Не потеряй третье измерение","prompt":"Объём парной равен 24 000 000 см³. Вырази его в кубических метрах.","type":"number","skillId":"n2-volume-units","contextId":"stoves","hint":"В кубе с ребром 1 м по 100 сантиметров вдоль каждого из трёх направлений.","explanation":"1 м³ = 100·100·100 = 1 000 000 см³. Получаем 24 000 000:1 000 000 = 24 м³.","answer":24,"unit":"м³"}],"creative":[{"id":"n2-c-scale-plan","title":"Перерисуй план","prompt":"На плане масштаба 1:200 прямоугольный участок имеет стороны 3 см и 2 см. Его перерисовывают в масштабе 1:50. Найди стороны нового рисунка в сантиметрах и действительную площадь участка в квадратных метрах.","type":"build","skillId":"n2-scale","contextId":"land-plots","hint":"В действительности стороны равны 3·200 см и 2·200 см. На новом плане каждый сантиметр изображает 50 см.","explanation":"Реальные размеры — 600 см и 400 см, то есть 6 м и 4 м. Новый рисунок: 600:50 = 12 см и 400:50 = 8 см. Действительная площадь не меняется: 6·4 = 24 м².","fields":[{"name":"a","label":"Вместо 3 см на старом плане: длина в см","min":0,"max":30,"initial":0},{"name":"b","label":"Вместо 2 см на старом плане: длина в см","min":0,"max":30,"initial":0},{"name":"area","label":"Действительная площадь, м²","min":0,"max":100,"initial":0}],"constants":{},"conditions":[{"left":"a","op":"eq","right":"3*200/50"},{"left":"b","op":"eq","right":"2*200/50"},{"left":"area","op":"eq","right":"(3*200/100)*(2*200/100)"}],"exampleSolution":{"a":12,"b":8,"area":24}},{"id":"n2-c-unit-power","title":"Одинаковое число, разные величины","prompt":"В записях размеров помещения везде встретилось число 0,6. Подбери равную величину в сантиметрах, квадратных сантиметрах или кубических сантиметрах.","type":"match","skillId":"n2-unit-power","contextId":"stoves","hint":"При переводе длины множитель 100 используется один раз, площади — два раза, объёма — три.","explanation":"0,6 м = 60 см; 0,6 м² = 6000 см²; 0,6 м³ = 600 000 см³. Числовой множитель зависит от того, сколько измерений входит в величину.","pairs":[{"left":"0,6 м","right":"60 см"},{"left":"0,6 м²","right":"6000 см²"},{"left":"0,6 м³","right":"600 000 см³"}]},{"id":"n2-c-paper-rounding","title":"Точно, затем округлённо","prompt":"Прямоугольный лист имеет размеры 210 мм на 297 мм. Запиши его точную площадь в квадратных метрах, затем округли её до тысячных квадратного метра.","type":"build","skillId":"n2-rounding","contextId":"paper-sheets","hint":"Площадь в мм² раздели на 1 000 000. При округлении до тысячных посмотри на четвёртую цифру после запятой.","explanation":"210·297 = 62 370 мм² = 0,06237 м². Четвёртая цифра после запятой — 3, поэтому до тысячных получаем 0,062 м². Округление выполняется после перевода в нужные единицы.","fields":[{"name":"exact","label":"Точная площадь, м²","min":0,"max":1,"initial":0},{"name":"rounded","label":"До тысячных, м²","min":0,"max":1,"initial":0}],"constants":{},"conditions":[{"left":"exact","op":"eq","right":"210*297/1000000"},{"left":"rounded","op":"eq","right":"62/1000"}],"exampleSolution":{"exact":0.06237,"rounded":0.062}}],"extensions":["Сравни рисунки одного участка в двух масштабах: реальные размеры остаются теми же.","Отдельно различай округление числа и покупку целого количества упаковок: для покупки нужно, чтобы материала хватило."],"overviewTaskIds":["n2-q-grid-scale","n2-q-tire-inch","n2-q-apartment-area","n2-q-stove-volume"]},{"id":"n3","title":"№3. Практические задачи","goal":"В заданиях №1–5 вопросы зависят от сюжета. Здесь — длины маршрутов, время в пути, площади и объёмы. Начни с четырёх коротких примеров; карту и мастерские можно открыть по желанию.","sourceHref":"/trainers/oge-1-5-trainers/practice-1-5-map.html","sourceLinksTitle":"Сюжеты №1–5","sourceLinks":[{"label":"Дороги по клеткам","href":"/trainers/oge-1-5-trainers/practice-1-5-roads-grid.html"},{"label":"Схема дорог","href":"/trainers/oge-1-5-trainers/practice-1-5-roads-schema.html"},{"label":"Шины","href":"/trainers/oge-1-5-trainers/practice-1-5-tires.html"},{"label":"Печки","href":"/trainers/oge-1-5-trainers/practice-1-5-stoves.html"},{"label":"Участки","href":"/trainers/oge-1-5-trainers/practice-1-5-land-plots.html"},{"label":"Квартиры","href":"/trainers/oge-1-5-trainers/practice-1-5-apartments.html"},{"label":"Тарифы","href":"/trainers/oge-1-5-trainers/practice-1-5-tariffs.html"},{"label":"Листы","href":"/trainers/oge-1-5-trainers/practice-1-5-paper-sheets.html"}],"skills":[{"id":"n3-pythagoras","label":"Находить прямое расстояние по двум перпендикулярным направлениям","requires":["n2-scale"],"evidence":"Применяет теорему Пифагора и отличает прямое расстояние от суммы двух участков."},{"id":"n3-route-length","label":"Складывать длины участков маршрута","requires":["n2-length-units"],"evidence":"Находит длину дороги через промежуточный пункт и сравнивает её с прямой дорогой."},{"id":"n3-route-time","label":"Складывать время движения по участкам","requires":["n3-route-length"],"evidence":"Вычисляет время каждого участка при его скорости и переводит сумму в минуты."},{"id":"n3-area-difference","label":"Находить площадь оставшейся части","requires":["n2-area-units"],"evidence":"Вычитает площадь постройки из площади участка при явно указанном расположении."},{"id":"n3-volume","label":"Находить объём прямоугольного помещения","requires":["n2-volume-units"],"evidence":"Перемножает три размера помещения, выраженные в метрах."},{"id":"n3-area-perimeter","label":"Различать площадь и периметр","requires":["n3-area-difference"],"evidence":"Строит прямоугольники с одинаковым периметром и разными площадями."}],"quick":[{"id":"n3-q-grid-diagonal","title":"Напрямую через план","prompt":"Пункты A и B смещены друг относительно друга на 3 клетки по горизонтали и на 4 клетки по вертикали. Сторона клетки соответствует 1 км. Найди длину прямой дороги AB в километрах.","type":"number","skillId":"n3-pythagoras","contextId":"roads-grid","hint":"Горизонтальный и вертикальный отрезки — катеты прямоугольного треугольника. Прямая дорога — его гипотенуза.","explanation":"AB² = 3²+4² = 25, поэтому AB = 5 км. Число 7 км было бы длиной пути по двум катетам.","answer":5,"unit":"км","visual":{"kind":"polygon","points":[[0,0],[3,0],[3,4]],"labels":["A","H","B"],"segments":[{"from":[0,0],"to":[3,0],"label":"3 клетки","dashed":true},{"from":[3,0],"to":[3,4],"label":"4 клетки","dashed":true},{"from":[0,0],"to":[3,4],"label":"AB","dashed":false}],"pointsOnly":true,"grid":true,"ariaLabel":"Прямоугольный треугольник AHB: AH — три клетки по горизонтали, HB — четыре по вертикали."}},{"id":"n3-q-road-time","title":"Один маршрут, две скорости","prompt":"Из A в C едут через B. Участок AB длиной 6 км проезжают со скоростью 30 км/ч, участок BC длиной 8 км — со скоростью 40 км/ч. Остановок нет. Сколько минут занимает весь путь?","type":"number","skillId":"n3-route-time","contextId":"roads-schema","hint":"Время каждого участка равно длине, делённой на скорость. Сначала сложи часы, затем переведи в минуты.","explanation":"6:30 = 0,2 часа и 8:40 = 0,2 часа. Всего 0,4 часа, или 0,4·60 = 24 минуты.","answer":24,"unit":"мин"},{"id":"n3-q-plot-grass","title":"Что осталось под газон?","prompt":"Прямоугольный участок имеет размеры 20 м на 15 м. Внутри него стоит дом с прямоугольным основанием 8 м на 6 м. Всю оставшуюся часть участка занимает газон. Найди площадь газона.","type":"number","skillId":"n3-area-difference","contextId":"land-plots","hint":"Из площади всего участка вычти площадь основания дома. Других объектов по условию нет.","explanation":"20·15−8·6 = 300−48 = 252 м².","answer":252,"unit":"м²","visual":{"kind":"polygon","points":[[0,0],[20,0],[20,15],[0,15]],"labels":["A","B","C","D"],"segments":[{"from":[0,0],"to":[20,0],"label":"20 м","dashed":false},{"from":[20,0],"to":[20,15],"label":"15 м","dashed":false}],"polygons":[{"points":[[2,2],[10,2],[10,8],[2,8]]}],"ariaLabel":"Участок 20 на 15 метров. Внутри него прямоугольное основание дома 8 на 6 метров."}},{"id":"n3-q-stove-room","title":"Какой объём отапливать?","prompt":"Парная имеет форму прямоугольного параллелепипеда: длина 3 м, ширина 2,5 м, высота 2,4 м. Найди её объём.","type":"number","skillId":"n3-volume","contextId":"stoves","hint":"Сначала можно найти площадь пола, затем умножить её на высоту.","explanation":"3·2,5 = 7,5 м²; 7,5·2,4 = 18 м³. Площадь пола и объём помещения — разные величины.","answer":18,"unit":"м³"}],"creative":[{"id":"n3-c-road-comparison","title":"Самый короткий или самый быстрый?","prompt":"Дороги AB и BC перпендикулярны; их длины — 6 км и 8 км. Есть также прямая дорога AC. По AC едут со скоростью 20 км/ч, по AB — 30 км/ч, по BC — 40 км/ч. Остановок нет. Найди длину и время для обоих маршрутов из A в C.","type":"build","skillId":"n3-route-length","contextId":"roads-schema","hint":"Для прямой дороги используй теорему Пифагора. Для пути через B сложи отдельно длины и отдельно время участков.","explanation":"AC = √(6²+8²) = 10 км; через B — 6+8 = 14 км. Прямой путь занимает 10:20·60 = 30 минут; путь через B — (6:30+8:40)·60 = 24 минуты. Более длинный маршрут здесь быстрее на 6 минут.","visual":{"kind":"polygon","points":[[0,0],[0,6],[8,6]],"labels":["A","B","C"],"segments":[{"from":[0,0],"to":[0,6],"label":"6 км","dashed":false},{"from":[0,6],"to":[8,6],"label":"8 км","dashed":false},{"from":[0,0],"to":[8,6],"label":"AC","dashed":true}],"pointsOnly":true,"ariaLabel":"Перпендикулярные дороги AB длиной 6 км и BC длиной 8 км. Прямая дорога AC соединяет их концы."},"fields":[{"name":"direct","label":"Прямая дорога, км","min":0,"max":30,"initial":0},{"name":"via","label":"Через B, км","min":0,"max":30,"initial":0},{"name":"directTime","label":"Напрямую, мин","min":0,"max":100,"initial":0},{"name":"viaTime","label":"Через B, мин","min":0,"max":100,"initial":0}],"constants":{},"conditions":[{"left":"direct^2","op":"eq","right":"6^2+8^2"},{"left":"via","op":"eq","right":"6+8"},{"left":"directTime","op":"eq","right":"direct/20*60"},{"left":"viaTime","op":"eq","right":"(6/30+8/40)*60"}],"exampleSolution":{"direct":10,"via":14,"directTime":30,"viaTime":24}},{"id":"n3-c-same-perimeter","title":"Та же ограда, другой участок","prompt":"Прямоугольный участок имеет стороны 6 м и 4 м. Подбери другой прямоугольник с целыми сторонами от 1 до 9 м: периметр должен остаться тем же, а площадь стать меньше. Подойдёт любой такой прямоугольник.","type":"build","skillId":"n3-area-perimeter","contextId":"land-plots","hint":"У исходного участка периметр 20 м, значит, сумма новых сторон должна быть равна 10 м. Затем проверь произведение сторон.","explanation":"Например, 3 м и 7 м: периметр 2·(3+7) = 20 м, а площадь 21 м² меньше исходных 24 м². Подойдут также 1 и 9, 2 и 8 и те же пары в обратном порядке. Одинаковый периметр не определяет площадь.","fields":[{"name":"a","label":"Первая сторона, м","min":1,"max":9,"initial":1,"integer":true,"step":1},{"name":"b","label":"Вторая сторона, м","min":1,"max":9,"initial":1,"integer":true,"step":1}],"constants":{},"conditions":[{"left":"2*(a+b)","op":"eq","right":"20"},{"left":"a*b","op":"lt","right":"24"}],"exampleSolution":{"a":3,"b":7}},{"id":"n3-c-choose-formula","title":"Какой расчёт отвечает вопросу?","prompt":"Подбери выражение к каждому вопросу. Все длины даны в метрах; сарай целиком находится внутри участка.","type":"match","skillId":"n3-area-difference","contextId":"land-plots","hint":"Длину ограды считай по границе, газон — по площади, пространство внутри парной — по объёму.","explanation":"Для ограды нужен периметр за вычетом ворот; для газона — разность площадей; для объёма — произведение трёх размеров. Выражение выбирают по искомой величине.","pairs":[{"left":"Ограда участка 18×12 м без ворот шириной 3 м","right":"2·(18+12)−3"},{"left":"Газон участка 18×12 м без сарая 4×3 м","right":"18·12−4·3"},{"left":"Объём парной 3×2×2,4 м","right":"3·2·2,4"}]}],"extensions":["Сравни маршруты сначала по длине, затем по времени: ответы могут различаться.","Построй два собственных прямоугольника с одним периметром и объясни, что происходит с площадью."],"overviewTaskIds":["n3-q-grid-diagonal","n3-q-road-time","n3-q-plot-grass","n3-q-stove-room"]},{"id":"n4","title":"№4. Практические задачи","goal":"В заданиях №1–5 вопросы зависят от сюжета. Здесь — расчёты стоимости и процентов в разных сюжетах. Начни с четырёх коротких примеров; карту и мастерские можно открыть по желанию.","sourceHref":"/trainers/oge-1-5-trainers/practice-1-5-map.html","sourceLinksTitle":"Сюжеты №1–5","sourceLinks":[{"label":"Дороги по клеткам","href":"/trainers/oge-1-5-trainers/practice-1-5-roads-grid.html"},{"label":"Схема дорог","href":"/trainers/oge-1-5-trainers/practice-1-5-roads-schema.html"},{"label":"Шины","href":"/trainers/oge-1-5-trainers/practice-1-5-tires.html"},{"label":"Печки","href":"/trainers/oge-1-5-trainers/practice-1-5-stoves.html"},{"label":"Участки","href":"/trainers/oge-1-5-trainers/practice-1-5-land-plots.html"},{"label":"Квартиры","href":"/trainers/oge-1-5-trainers/practice-1-5-apartments.html"},{"label":"Тарифы","href":"/trainers/oge-1-5-trainers/practice-1-5-tariffs.html"},{"label":"Листы","href":"/trainers/oge-1-5-trainers/practice-1-5-paper-sheets.html"}],"skills":[{"id":"n4-allowance","label":"Считать доплату только за превышение пакета","requires":["n1-table"],"evidence":"Отделяет включённые минуты от оплачиваемых сверх пакета."},{"id":"n4-total-cost","label":"Учитывать все названные расходы","requires":["base-place"],"evidence":"Складывает стоимость покупки, доставки и установки без пропусков и повторного счёта."},{"id":"n4-percent-base","label":"Находить процент изменения от исходной величины","requires":["base-unit"],"evidence":"Делит изменение на первоначальное значение, а не на новое."},{"id":"n4-discount","label":"Находить цену после скидки","requires":["n4-percent-base"],"evidence":"Уменьшает цену на указанный процент от исходной цены."},{"id":"n4-successive-percent","label":"Проверять последовательные изменения в процентах","requires":["n4-discount"],"evidence":"Учитывает, что после первого изменения следующий процент относится к новой величине."},{"id":"n4-original-price","label":"Восстанавливать цену до скидки","requires":["n4-discount"],"evidence":"Находит исходную цену по оставшейся доле и проверяет скидку обратным расчётом."}],"quick":[{"id":"n4-q-tariff-bill","title":"Сколько начислят?","prompt":"Абонентская плата — 420 руб. В неё входят 300 минут. Сверх пакета каждая минута стоит 2,5 руб. За месяц использовано 348 минут; других начислений нет. Найди итоговую плату.","type":"number","skillId":"n4-allowance","contextId":"tariffs","hint":"Доплата относится только к минутам после первых 300.","explanation":"Сверх пакета 348−300 = 48 минут. Доплата 48·2,5 = 120 руб. Всего 420+120 = 540 руб.","answer":540,"unit":"руб."},{"id":"n4-q-stove-total","title":"Цена в объявлении и полная стоимость","prompt":"Печь стоит 28 000 руб., её доставка — 1200 руб., установка — 3500 руб. Все три услуги оплачиваются отдельно, других расходов нет. Найди полную стоимость покупки с доставкой и установкой.","type":"number","skillId":"n4-total-cost","contextId":"stoves","hint":"Сложи все три указанные суммы, каждую ровно один раз.","explanation":"28 000+1200+3500 = 32 700 руб. Одна только цена печи не включает доставку и установку.","answer":32700,"unit":"руб."},{"id":"n4-q-tire-percent","title":"Как изменился диаметр?","prompt":"Наружный диаметр прежнего колеса — 600 мм, нового — 630 мм. На сколько процентов новый диаметр больше прежнего?","type":"number","skillId":"n4-percent-base","contextId":"tires","hint":"Найди прибавку и сравни её с прежним диаметром 600 мм.","explanation":"Прибавка равна 30 мм. От первоначальных 600 мм это 30:600·100 = 5%.","answer":5,"unit":"%"},{"id":"n4-q-paper-discount","title":"Пачка со скидкой","prompt":"До скидки пачка бумаги стоила 800 руб. Скидка составляет 15% от этой цены. Сколько стоит пачка после скидки?","type":"number","skillId":"n4-discount","contextId":"paper-sheets","hint":"Можно вычесть 15% от 800 руб. или сразу найти оставшиеся 85%.","explanation":"Скидка равна 800·0,15 = 120 руб. Новая цена — 800−120 = 680 руб.","answer":680,"unit":"руб."}],"creative":[{"id":"n4-c-bill-order","title":"Собери расчёт счёта","prompt":"В тариф входят 200 минут за 380 руб. Каждая минута сверх пакета стоит 2 руб. Использовано 260 минут, других начислений нет. Расставь шаги данного способа расчёта от первого к последнему.","type":"order","skillId":"n4-allowance","contextId":"tariffs","hint":"Сначала нужно понять, сколько минут оплачивается отдельно, затем рассчитать эту доплату и итог.","explanation":"Сверх пакета 60 минут; доплата 120 руб.; итог 500 руб. Проверка разложения суммы помогает не начислить плату за включённые минуты повторно.","items":["Прибавить абонентскую плату: 380+120 = 500 руб.","Найти минуты сверх пакета: 260−200 = 60 мин.","Проверить итог: 500 = 380+120 руб.","Рассчитать доплату: 60·2 = 120 руб."],"answer":["Найти минуты сверх пакета: 260−200 = 60 мин.","Рассчитать доплату: 60·2 = 120 руб.","Прибавить абонентскую плату: 380+120 = 500 руб.","Проверить итог: 500 = 380+120 руб."]},{"id":"n4-c-successive-percent","title":"Скидка исчезла?","prompt":"Пачка бумаги стоила 1000 руб. Сначала цену уменьшили на 20%, затем новую цену увеличили на 20%. Отметь все верные утверждения.","type":"multi","skillId":"n4-successive-percent","contextId":"paper-sheets","hint":"Вторые 20% считают уже от цены после скидки, а не от первоначальных 1000 руб.","explanation":"После скидки цена равна 800 руб. Затем прибавляют 20% от 800, то есть 160 руб. Получается 960 руб. Это на 40 руб., или на 4% первоначальной цены, меньше 1000 руб.","options":[{"text":"После скидки пачка стоила 800 руб.","correct":true},{"text":"После повышения пачка стоит 960 руб.","correct":true},{"text":"Итоговая цена на 4% меньше первоначальной.","correct":true},{"text":"Две операции вернули цену к 1000 руб.","correct":false},{"text":"При повышении прибавили 200 руб.","correct":false}]},{"id":"n4-c-original-price","title":"Восстанови ценник","prompt":"После скидки 10% пачка бумаги стоит 900 руб. Восстанови цену до скидки и размер скидки в рублях.","type":"build","skillId":"n4-original-price","contextId":"paper-sheets","hint":"После скидки осталось 90% первоначальной цены. Число 900 — это не вся цена, а девять десятых.","explanation":"900:0,9 = 1000 руб. — первоначальная цена. Скидка равна 1000−900 = 100 руб. Проверка: 10% от 1000 руб. действительно равны 100 руб.","fields":[{"name":"before","label":"Цена до скидки, руб.","min":0,"max":2000,"initial":0},{"name":"saving","label":"Скидка, руб.","min":0,"max":1000,"initial":0}],"constants":{},"conditions":[{"left":"before*0.9","op":"eq","right":"900"},{"left":"saving","op":"eq","right":"before-900"}],"exampleSolution":{"before":1000,"saving":100}}],"extensions":["Составь собственный счёт с абонентской платой и доплатой, затем восстанови расход по итоговой сумме.","Проверь на числах, почему одинаковые проценты повышения и снижения не всегда возвращают исходную величину."],"overviewTaskIds":["n4-q-tariff-bill","n4-q-stove-total","n4-q-tire-percent","n4-q-paper-discount"]},{"id":"n5","title":"№5. Практические задачи","goal":"В заданиях №1–5 вопросы зависят от сюжета. Здесь — выбор подходящего варианта и проверка ограничений. Начни с четырёх коротких примеров; карту и мастерские можно открыть по желанию.","sourceHref":"/trainers/oge-1-5-trainers/practice-1-5-map.html","sourceLinksTitle":"Сюжеты №1–5","sourceLinks":[{"label":"Дороги по клеткам","href":"/trainers/oge-1-5-trainers/practice-1-5-roads-grid.html"},{"label":"Схема дорог","href":"/trainers/oge-1-5-trainers/practice-1-5-roads-schema.html"},{"label":"Шины","href":"/trainers/oge-1-5-trainers/practice-1-5-tires.html"},{"label":"Печки","href":"/trainers/oge-1-5-trainers/practice-1-5-stoves.html"},{"label":"Участки","href":"/trainers/oge-1-5-trainers/practice-1-5-land-plots.html"},{"label":"Квартиры","href":"/trainers/oge-1-5-trainers/practice-1-5-apartments.html"},{"label":"Тарифы","href":"/trainers/oge-1-5-trainers/practice-1-5-tariffs.html"},{"label":"Листы","href":"/trainers/oge-1-5-trainers/practice-1-5-paper-sheets.html"}],"skills":[{"id":"n5-whole-packages","label":"Покупать достаточное целое количество упаковок","requires":["base-division"],"evidence":"Проверяет, что материала хватит, и не принимает обычное округление частного за ответ."},{"id":"n5-range","label":"Проверять включённые границы допустимого диапазона","requires":["n1-table"],"evidence":"Определяет подходящие модели по объёму и учитывает обе включённые границы диапазона."},{"id":"n5-compare-tariffs","label":"Сравнивать тарифы при заданном расходе","requires":["n4-allowance"],"evidence":"Рассчитывает полную плату по каждому тарифу для одного и того же количества минут."},{"id":"n5-paper-cutting","label":"Считать листы после разрезания","requires":["base-division"],"evidence":"Находит число малых листов в большом и достаточное целое количество больших листов."},{"id":"n5-budget","label":"Подбирать покупку по площади и бюджету","requires":["n5-whole-packages","n4-total-cost"],"evidence":"Проверяет одновременно достаточность материала и ограничение стоимости."},{"id":"n5-check-choice","label":"Проверять выбор при изменении условий","requires":["n5-compare-tariffs"],"evidence":"Проверяет утверждения о тарифах для указанного расхода и допустимость расписания по общему времени."}],"quick":[{"id":"n5-q-plot-packs","title":"Материала должно хватить","prompt":"Для дорожки на участке нужно 17,5 м² плитки. В одной упаковке — 1,2 м². Продаются только целые упаковки. Какое наименьшее количество упаковок нужно купить? Запас на подрезку уже учтён в площади 17,5 м².","type":"number","skillId":"n5-whole-packages","contextId":"land-plots","hint":"Проверь две соседние целые покупки: сколько площади дадут 14 и 15 упаковок?","explanation":"14 упаковок дают 16,8 м² — мало. 15 упаковок дают 18 м² — достаточно. Поэтому минимальное количество равно 15.","answer":15,"unit":"уп."},{"id":"n5-q-stove-range","title":"Подойдёт ли на границе?","prompt":"Объём парной — 20 м³. Для каждой печи указан допустимый объём; обе границы включены. Выбери самую дешёвую подходящую печь. Дополнительных расходов нет.","type":"choice","skillId":"n5-range","contextId":"stoves","hint":"Проверь сначала, входит ли 20 в диапазон каждой модели. Потом сравни цены только подходящих моделей.","explanation":"Печь А не подходит. Печь Б подходит на верхней границе, печь В — на нижней. Из подходящих дешевле Б: 25 000 руб.","table":{"headers":["Печь","Объём, м³","Цена, руб."],"rows":[["А","10–16",21000],["Б","16–20",25000],["В","20–28",28000]]},"options":[{"text":"Печь А","correct":false},{"text":"Печь Б","correct":true},{"text":"Печь В","correct":false}]},{"id":"n5-q-tariff-choice","title":"Сравни при одном расходе","prompt":"За месяц использовано 340 минут. В таблице указаны плата за пакет, включённые минуты и цена каждой минуты сверх пакета. Других начислений нет. Какова наименьшая месячная плата среди трёх тарифов?","type":"number","skillId":"n5-compare-tariffs","contextId":"tariffs","hint":"Для каждого тарифа отдельно проверь, превышены ли включённые минуты. Затем сравни полные суммы.","explanation":"Тариф А: 400+(340−250)·3 = 670 руб. Тариф Б: 550 руб., превышения нет. Тариф В: 650 руб., превышения нет. Минимум — 550 руб.","answer":550,"unit":"руб.","table":{"headers":["Тариф","Пакет","Сверх пакета"],"rows":[["А","400 руб.; 250 мин","3 руб./мин"],["Б","550 руб.; 400 мин","2 руб./мин"],["В","650 руб.; 500 мин","1 руб./мин"]]}},{"id":"n5-q-paper-cutting","title":"Сколько больших листов?","prompt":"Из прямоугольного листа 420×594 мм без потерь вырезают листы 210×297 мм. Их стороны располагают параллельно сторонам большого листа. Нужно получить 70 маленьких листов. Какое наименьшее количество больших листов понадобится?","type":"number","skillId":"n5-paper-cutting","contextId":"paper-sheets","hint":"Определи, сколько малых листов помещается вдоль каждой стороны. Затем проверь целое количество больших листов.","explanation":"Вдоль сторон помещается 420:210 = 2 и 594:297 = 2 листа, всего 4. Из 17 больших получится 68 листов — мало; из 18 получится 72. Нужно 18 больших листов.","answer":18,"unit":"листов"}],"creative":[{"id":"n5-c-pack-budget","title":"Собери покупку","prompt":"Для пола нужно не менее 6 м² плитки. Малая упаковка покрывает 1 м² и стоит 700 руб.; большая покрывает 2,5 м² и стоит 1600 руб. Подбери целое количество упаковок каждого вида, чтобы материала хватило, а стоимость не превысила 4000 руб. Других расходов нет.","type":"build","skillId":"n5-budget","contextId":"apartments","hint":"Одна проверка отвечает за площадь, другая — за деньги. Попробуй начать с двух больших упаковок и восполнить недостающую площадь.","explanation":"Подходят 1 малая и 2 большие упаковки: площадь 1+2·2,5 = 6 м², стоимость 700+2·1600 = 3900 руб. Три большие стоят 4800 руб., а шесть малых — 4200 руб.; оба варианта превышают бюджет.","fields":[{"name":"small","label":"Малых упаковок","min":0,"max":8,"initial":0,"integer":true,"step":1},{"name":"large","label":"Больших упаковок","min":0,"max":4,"initial":0,"integer":true,"step":1}],"constants":{},"conditions":[{"left":"small+2.5*large","op":"gte","right":"6"},{"left":"700*small+1600*large","op":"lte","right":"4000"}],"exampleSolution":{"small":1,"large":2}},{"id":"n5-c-tariff-claims","title":"Проверь совет о тарифе","prompt":"Тариф А: 400 руб. за 200 минут, далее 3 руб./мин. Тариф Б: 520 руб. за 300 минут, далее 2 руб./мин. Минуты считаются целыми; других начислений нет. Отметь все верные утверждения.","type":"multi","skillId":"n5-check-choice","contextId":"tariffs","hint":"Для каждого утверждения подставь его расход. Сравнение только абонентских плат не учитывает превышение пакета.","explanation":"При 180 минутах: А — 400 руб., Б — 520 руб. При 240: А — 520 руб., Б — 520 руб. При 300: А — 700 руб., Б — 520 руб. Поэтому выбор зависит от расхода, и Б не всегда дешевле.","options":[{"text":"При 180 минутах тариф А дешевле.","correct":true},{"text":"При 240 минутах плата одинакова.","correct":true},{"text":"При 300 минутах тариф Б дешевле.","correct":true},{"text":"Тариф Б дешевле при любом расходе.","correct":false}]},{"id":"n5-c-road-schedule","title":"Успеть с остановкой","prompt":"Из A нужно пройти через B в C: AB = 3 км, BC = 4 км. Скорость движения постоянна и равна 6 км/ч. Выйти можно не раньше 9:00, прибыть нужно не позже 10:30. Подбери время выхода и остановку в B длительностью от 10 до 20 минут. Указывай целые минуты; подойдёт любой допустимый план.","type":"build","skillId":"n5-check-choice","contextId":"roads-schema","hint":"Само движение займёт (3+4):6 часа. Переведи это время в минуты и сравни с 90 минутами от 9:00 до 10:30.","explanation":"Движение занимает 70 минут. На задержку выхода и остановку вместе остаётся не более 20 минут. Например, выйти через 5 минут после 9:00 и остановиться на 15 минут: 5+70+15 = 90, прибытие в 10:30. Можно прибыть и раньше.","visual":{"kind":"polygon","points":[[0,0],[0,3],[4,3]],"labels":["A","B","C"],"segments":[{"from":[0,0],"to":[0,3],"label":"3 км","dashed":false},{"from":[0,3],"to":[4,3],"label":"4 км","dashed":false},{"from":[0,0],"to":[4,3],"label":"5 км","dashed":true}],"pointsOnly":true,"ariaLabel":"A слева внизу, B слева вверху, C справа вверху. AB и BC — сплошные линии, AC — пунктир."},"fields":[{"name":"departure","label":"Через сколько минут после 9:00 выйти","min":0,"max":20,"initial":20,"integer":true,"step":1},{"name":"rest","label":"Остановка в B, мин","min":10,"max":20,"initial":20,"integer":true,"step":1}],"constants":{},"conditions":[{"left":"departure+rest+(3+4)/6*60","op":"lte","right":"90"}],"exampleSolution":{"departure":5,"rest":15}}],"extensions":["Проверь выбранный вариант ещё раз по каждому ограничению: количество, размер, время и стоимость.","Составь условия, при которых выгодный сейчас тариф перестанет быть самым дешёвым."],"overviewTaskIds":["n5-q-plot-packs","n5-q-stove-range","n5-q-tariff-choice","n5-q-paper-cutting"]},{"id":"n6","title":"№6 · Числа и вычисления","goal":"Вычислять с дробями и десятичными числами, сохраняя смысл единиц и проверяя величину ответа. Здесь представлен короткий набор подтипов, а не полная подготовка к №6.","sourceHref":"/trainers/oge-task6-fractions.html","skills":[{"id":"n6-common","label":"Складываю одинаковые доли","requires":["base-unit"],"evidence":"Выбирает общий знаменатель и объясняет, какую общую единицу он задаёт."},{"id":"n6-decimal","label":"Вычисляю с десятичными числами","requires":["base-place"],"evidence":"Выполняет действие и проверяет положение запятой оценкой результата."},{"id":"n6-muldiv","label":"Умножаю и делю дроби","requires":["base-products","base-division","base-unit"],"evidence":"Получает верный результат и связывает деление положительных величин с количеством мерок."},{"id":"n6-actions","label":"Сохраняю порядок действий","requires":["base-sign","n6-decimal"],"evidence":"Разделяет вычисление на допустимые шаги и сохраняет знаки промежуточных результатов."},{"id":"n6-estimate","label":"Оцениваю до вычисления","requires":["base-unit","base-check"],"evidence":"Сравнивает результат с 0, 1/2 или 1, используя величины исходных чисел и смысл операции."},{"id":"n6-structure","label":"Использую структуру вычисления","requires":["base-products","n6-decimal"],"evidence":"Замечает общий множитель и дополняющие части, преобразует сумму произведений и объясняет, какие данные можно не вычислять отдельно."}],"quick":[{"id":"n6-q-subtract","title":"Вычитание дробей","prompt":"Вычисли: 3/4 − 5/8. Можно ввести дробь или десятичное число.","type":"number","skillId":"n6-common","answer":0.125,"hint":"Представь три четверти в восьмых долях.","explanation":"3/4 = 6/8, поэтому 6/8 − 5/8 = 1/8 = 0,125."},{"id":"n6-q-decimal","title":"Деление десятичных","prompt":"Вычисли: 0,6 ÷ 0,15.","type":"number","skillId":"n6-decimal","answer":4,"hint":"Сколько раз по 15 сотых помещается в 60 сотых?","explanation":"0,6 ÷ 0,15 = 60 ÷ 15 = 4. Проверка: 4 × 0,15 = 0,6."},{"id":"n6-q-actions","title":"Действия и знак","prompt":"Вычисли: (−2,5) × 4 + 3.","type":"number","skillId":"n6-actions","answer":-7,"hint":"Сначала выполни умножение, затем прибавь три.","explanation":"(−2,5) × 4 = −10. Затем −10 + 3 = −7."},{"id":"n6-q-fraction-division","title":"Деление дробей","prompt":"Чему равно 5/6 ÷ 10/9?","type":"choice","skillId":"n6-muldiv","options":[{"text":"3/4","correct":true},{"text":"4/3","correct":false},{"text":"25/27","correct":false},{"text":"1/3","correct":false}],"hint":"Для проверки умножь предполагаемое частное на 10/9: должно получиться 5/6.","explanation":"5/6 ÷ 10/9 = 5/6 × 9/10 = 45/60 = 3/4. Проверка: 3/4 × 10/9 = 5/6."},{"id":"exp-n6-errors-entry","title":"Сложение разных долей","prompt":"Вычисли: 5/3 + 1/2.","type":"number","skillId":"n6-common","hint":"Нужны доли одного размера. Какой знаменатель подойдёт обеим дробям?","explanation":"5/3 = 10/6, 1/2 = 3/6. Сумма равна 13/6.","originAtlasId":"6.1","answer":2.1666666666666665,"learningMode":"quick"},{"id":"exp-n6-errors-exit","title":"Та же проверка, другие дроби","prompt":"Вычисли: 5/2 + 2/5.","type":"number","skillId":"n6-common","hint":"Приведи обе дроби к одинаковому знаменателю. Проверь, больше ли сумма каждой положительной части.","explanation":"5/2 + 2/5 = 25/10 + 4/10 = 29/10 = 2,9.","originAtlasId":"6.1","answer":2.9,"learningMode":"quick"},{"id":"exp-n6-structure-entry","title":"Две части одной сотни","prompt":"Вычисли: 0,4 × 37 + 0,4 × 63.","type":"number","skillId":"n6-structure","hint":"Какой множитель одинаков в обоих произведениях?","explanation":"0,4 × (37 + 63) = 0,4 × 100 = 40.","originAtlasId":"6.2","answer":40,"learningMode":"quick"},{"id":"exp-n6-structure-exit","title":"Удобная группировка","prompt":"Вычисли: 1,75 × 48 + 1,75 × 52.","type":"number","skillId":"n6-structure","hint":"Можно сначала сложить количества одинаковых частей.","explanation":"1,75 × (48 + 52) = 1,75 × 100 = 175.","originAtlasId":"6.2","answer":175,"learningMode":"quick"}],"creative":[{"id":"n6-c-common-measure","title":"Доли на одной шкале","prompt":"Сложи 2/3 и 1/4 одного целого. Выбери общую мерку и собери обе доли вместе.","type":"fraction","skillId":"n6-common","nu решение"],"rows":[["А","3/2 + 2/3 → (3 + 2)/(2 + 3) = 5/5 = 1"],["Б","3/2 + 2/3 → (3 × 2)/(2 × 3) = 6/6 = 1"]]},"options":[{"text":"У А ошибка в переходе к сумме числителей и сумме знаменателей.","correct":true},{"text":"У Б ошибка: вместо суммы он вычислил произведение.","correct":true},{"text":"Совпадение ответов доказывает, что оба способа допустимы.","correct":false},{"text":"У А неверно только последнее действие: 5/5 не равно 1.","correct":false},{"text":"Верная сумма равна 13/6.","correct":true},{"text":"В решении Б ошибка только в вычислении 3 × 2.","correct":false}],"learningMode":"creative"},{"id":"exp-n6-structure-workshop","title":"Вычисли без лишних действий","prompt":"В выражении □ × 0,25 + (400 − □) × 0,25 оба квадрата скрывают одно и то же целое число от 0 до 400. Собери короткое вычисление: общий множитель × сумма двух частей = результат. Скрытое число открывать не нужно.","type":"build","skillId":"n6-structure","hint":"Подумай, что получится, если сложить скрытое число и дополнение к 400.","explanation":"Общий множитель — 0,25. Сумма частей: □ + (400 − □) = 400. Поэтому результат при любом разрешённом скрытом числе равен 0,25 × 400 = 100. Отдельные значения двух частей не нужны.","originAtlasId":"6.2","fields":[{"name":"factor","label":"Общий множитель","initial":""},{"name":"whole","label":"Сумма двух частей","initial":""},{"name":"result","label":"Результат","initial":""}],"constants":{},"conditions":[{"left":"factor","op":"eq","right":"0.25"},{"left":"whole","op":"eq","right":"400"},{"left":"result","op":"eq","right":"factor*whole"}],"exampleSolution":{"factor":0.25,"whole":400,"result":100},"learningMode":"creative"}],"extensions":["Дробь как часть, число и частное: узнать одну величину на полоске, прямой и в записи.","Смешанные числа, сокращение и общий знаменатель: сравнить несколько правильных путей вычисления.","Деление на дробь: исследовать положительные делители меньше и больше 1; объяснить изменение величины результата.","Десятичные числа
