name: Equations course — resume and saved work
on:
  pull_request:
    paths: ['equations/**', 'tools/equations/**', '.github/workflows/equations-resume.yml']
  push:
    branches: [main]
    paths: ['equations/**', 'tools/equations/**', '.github/workflows/equations-resume.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  equations-resume:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - name: Install pinned test tools
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.62.1 jsdom@26.1.0
          npx playwright install --with-deps chromium
      - name: Mathematics and saved-work regressions
        run: |
          node tools/equations/check.cjs
          node tools/equations/regression.cjs
          node --test tools/equations/resume.test.cjs
          node --check equations/app.js
          git diff --check
      - name: Existing fifteen lessons and new resume journeys in Chromium
        run: |
          node tools/equations/browser.cjs
          node tools/equations/resume.browser.cjs
      - name: Verify exact public app and live continuation after publication
        if: github.event_name == 'push'
        run: node tools/equations/resume.browser.cjs --production
      - name: Keep actual browser screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: equations-resume-ui
          path: artifacts/equations-resume
          retention-days: 14
          if-no-files-found: warn
