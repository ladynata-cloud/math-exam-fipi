name: Makarychev 8 course quality
on:
  pull_request:
    paths:
      - 'school/makarychev8/**'
      - 'school/peterson6/math.js'
      - '.github/workflows/makarychev8-quality.yml'
  push:
    branches: [main]
    paths:
      - 'school/makarychev8/**'
      - 'school/peterson6/math.js'
permissions:
  contents: read
jobs:
  course:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent textbook mathematics
        run: |
          python -m pip install sympy==1.14.0
          python school/makarychev8/test-exercises-1-24.py
      - name: Build, syntax and mathematical contracts
        run: |
          node school/makarychev8/build.cjs
          git diff --exit-code -- school/makarychev8/data.js
          node --check school/makarychev8/app.js
          node --check school/makarychev8/check.js
          node --check school/makarychev8/models.js
          node school/makarychev8/test-course.cjs
          node school/makarychev8/test-models.cjs
          node school/makarychev8/test-state.cjs
          git diff --check
      - name: Isolated DOM and browser dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/makarychev-qa" --no-audit --no-fund --ignore-scripts jsdom@26.1.0 playwright@1.62.1
          node "$RUNNER_TEMP/makarychev-qa/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Every worked solution and saved-work journey
        run: |
          NODE_PATH="$RUNNER_TEMP/makarychev-qa/node_modules" node school/makarychev8/test-ui.cjs
          NODE_PATH="$RUNNER_TEMP/makarychev-qa/node_modules" node school/makarychev8/test-import.cjs
      - name: Chromium source exercises and responsive layout
        run: NODE_PATH="$RUNNER_TEMP/makarychev-qa/node_modules" node school/makarychev8/test-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: makarychev8-browser
          path: artifacts/makarychev8/
          if-no-files-found: ignore
