<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title desc"><title id="title">Равные фигуры в зеркальном расположении</title><desc id="desc">Треугольники ABC и DEF зеркально симметричны, при совмещении соответствуют A и D, B и E, C и F.</desc><style>text{font-family:Arial,sans-serif;fill:#213f49;font-size:22px}.label{font-size:23px;font-style:italic}.small{font-size:18px;fill:#617579}.head{font-size:21px;font-weight:700}.line{fill:none;stroke:#213f49;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.teal{fill:none;stroke:#16746b;stroke-width:3;stroke-linecap:round}.red{fill:none;stroke:#bd654c;stroke-width:3;stroke-linecap:round}.gold{fill:none;stroke:#aa7623;stroke-width:3;stroke-linecap:round}.thin{fill:none;stroke:#617579;stroke-width:2}.dashed{stroke-dasharray:7 7}</style><rect width="900" height="440" rx="18" fill="#f5f6ef"/><text class="head" x="42" y="45">Одна форма, другое положение</text><path d="M100 285 L280 285 L155 80 Z" fill="#d5e9e2" stroke="#213f49" stroke-width="3"/><path d="M770 285 L590 285 L715 80 Z" fill="#f1ddcd" stroke="#213f49" stroke-width="3"/><circle cx="100" cy="285" r="4" fill="#213f49"/><text class="label" x="93" y="315">A</text><circle cx="280" cy="285" r="4" fill="#213f49"/><text class="label" x="273" y="315">B</text><circle cx="155" cy="80" r="4" fill="#213f49"/><text class="label" x="148" y="68">C</text><circle cx="770" cy="285" r="4" fill="#213f49"/><text class="label" x="763" y="315">D</text><circle cx="590" cy="285" r="4" fill="#213f49"/><text class="label" x="583" y="315">E</text><circle cx="715" cy="80" r="4" fill="#213f49"/><text class="label" x="708" y="68">F</text><path class="thin dashed" d="M435 65 V305"/><text class="small" x="390" y="345">отражение</text><text x="80" y="390">A ↔ D</text><text x="355" y="390">B ↔ E</text><text x="650" y="390">C ↔ F</text></svg>