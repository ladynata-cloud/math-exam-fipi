<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Симметрия — редакторский просмотр</title>
<link rel="stylesheet" href="../../../stereo-course/assets/task-scenes.css">
<style>body{font:20px/1.6 system-ui;background:#f6f8f5;color:#20362c;margin:0}main{max-width:1000px;margin:auto;padding:24px}select,button{font:inherit;max-width:100%;padding:12px;border:1px solid #b8cdbf;border-radius:12px;background:white}button{background:#24734f;color:white;cursor:pointer}header{font-size:16px;border-left:4px solid #d5ab43;padding:12px;background:#fff9e9}#model{height:auto;padding:16px;box-sizing:border-box;background:white;border:1px solid #dce6de;border-radius:20px;margin:24px 0}article,details{background:white;padding:20px;margin:20px 0;border-radius:14px}summary{cursor:pointer}h1{font-size:30px;line-height:1.25}h2{font-size:24px}p{margin:14px 0}.note{font-size:16px}#steps article{border-left:4px solid #34835f}textarea{box-sizing:border-box;width:100%;min-height:110px;font:inherit;padding:12px}label{display:block;margin:14px 0}#problem:focus{outline:none}@media(max-width:600px){main{padding:16px}body{font-size:18px}#model{padding:8px}}</style>
<main><header>Редакторский просмотр. 15 карточек ещё проходят проверку и не включены в опубликованный курс. Записи здесь не сохраняются.</header>
<p><label for="lesson">Карточка</label><select id="lesson"></select></p><section id="problem" tabindex="-1"><h1 id="title"></h1><p id="condition"></p><div id="model" class="task-scene"></div><p id="goal"></p><p id="caption" class="note"></p><div id="help"></div><label for="work">Черновик ответа</label><textarea id="work"></textarea><div id="steps"></div><button id="next">Открыть следующий шаг</button></section></main>
<script src="../../../stereo-course/assets/math-text.js"></script><script src="../../../stereo-course/assets/task-scene-viewer.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);let cards=[],current,mount,index=0;
function text(node,s){node.replaceChildren();StereoMath.appendText(node,s);}
function element(tag,s){const n=document.createElement(tag);text(n,s);return n;}
function open(i){current=cards[i];index=0;mount?.destroy();text($('title'),current.title);text($('condition'),current.statement.text);text($('goal'),current.statement.goal);text($('caption'),current.visualization.caption);$('work').value='';$('steps').replaceChildren();$('help').replaceChildren();$('next').disabled=false;$('next').textContent='Открыть следующий шаг';
mount=TaskSceneViewer.mount($('model'),current.visualization.model);
for(const h of current.help){const d=document.createElement('details');d.append(element('summary',h.question),element('p',h.text));d.addEventListener('toggle',()=>{if(d.open&&h.view)mount.setView(h.view);});$('help').append(d);}
}
$('next').onclick=()=>{const s=current.steps[index++],a=document.createElement('article');a.dataset.step=s.id;a.append(element('h2',s.title),element('p',s.prompt),element('p',s.explanation));const d=document.createElement('details');d.append(element('summary','Почему этот переход верен?'));s.justifications.forEach(j=>d.append(element('p',j.text)));a.append(d);$('steps').append(a);mount.setView(s.view||'neutral');if(index===current.steps.length){$('next').disabled=true;$('next').textContent='Все шаги открыты';}};
$('lesson').onchange=()=>open(Number($('lesson').value));
fetch('manifest.json').then(r=>r.json()).then(m=>Promise.all(m.cards.map(id=>fetch(id+'.json').then(r=>r.json())))).then(data=>{cards=data;cards.forEach((c,i)=>{const o=element('option',c.title);o.value=i;$('lesson').append(o);});open(0);window.symmetryPreview={cards,open,get mount(){return mount;}};}).catch(e=>{text($('title'),'Не удалось загрузить карточки');console.error(e);});
</script></html>
