name: Peterson cabinet and on-demand helper

on:
  pull_request:
    paths:
      - 'learning/**'
      - 'school/peterson6/**'
      - 'trainers/peterson-assistant.*'
      - 'trainers/peterson6.html'
      - 'trainers/maxim-peterson6/**'
      - 'tools/*peterson*'
      - '.github/workflows/peterson-cabinet-helper.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  helper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - name: Install test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/peterson-helper" --no-save --no-package-lock --ignore-scripts playwright@1.62.1 jsdom@26.1.0
          "$RUNNER_TEMP/peterson-helper/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/peterson-helper/node_modules" >> "$GITHUB_ENV"
      - name: Course and cabinet regressions
        run: |
          node --check learning/app.js
          node --check trainers/peterson-assistant.js
          node --test tools/peterson-assistant.test.cjs tools/learning-peterson-pair.dom.cjs tools/learning-peterson-plan.dom.cjs
          node tools/maxim-peterson6.test.cjs
          node school/peterson6/test-state.cjs
          node school/peterson6/test-ui.cjs
          git diff --check
      - name: Desktop, mobile and sandboxed cabinet journeys
        env:
          PETERSON_HELP_ARTIFACT_DIR: artifacts/peterson-helper/direct
          PETERSON_PAIR_ARTIFACT_DIR: artifacts/peterson-helper/cabinet
        run: |
          node tools/peterson-assistant.browser.cjs
          node tools/learning-peterson-pair.browser.cjs
      - name: Keep visual evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: peterson-cabinet-helper-screenshots
          path: artifacts/peterson-helper
          if-no-files-found: ignore
          retention-days: 7
