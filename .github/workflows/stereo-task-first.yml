name: Stereometry — task first and faithful figures
on:
  pull_request:
    paths: ['stereo-course/**', 'tools/stereo/**', 'tools/fixtures/stereo-scenes.html', '.github/workflows/stereo-task-first.yml']
permissions:
  contents: read
jobs:
  math-state-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.62.1 jsdom@26.1.0
      - run: npx playwright install --with-deps chromium
      - name: Reproducible standalone build
        run: |
          node tools/stereo/sync_canvas_visibility.cjs --check
          python3 tools/stereo/build_site.py
          git diff --exit-code -- stereo-course/index.html
      - name: Retained mathematics and state
        run: |
          node tools/stereo/check.js
          node tools/stereo/regression-check.js
          node tools/stereo/math-text.test.cjs
          node tools/stereo/stale-state.test.cjs
          node tools/stereo/task-first.test.cjs
          node tools/stereo/task-first.integration.test.cjs
          node tools/stereo/proof-choice-fractions.test.cjs
      - name: Numeric and proof figure invariants
        run: |
          node tools/stereo/canvas-visibility.test.cjs
          node tools/stereo/task-scenes-math.test.cjs
          node tools/stereo/task-scenes.dom.test.cjs
          node tools/stereo/task-scene-expansion.test.cjs
          node tools/stereo/task-proof-scenes.test.cjs
          node tools/stereo/task-proof-scenes.dom.test.cjs
      - name: Retained learner journey
        run: node tools/stereo/browser-check.js
      - name: Actual task-first lessons and two-tab recovery
        env:
          STEREO_ARTIFACTS: artifacts/stereo-lessons
        run: node tools/stereo/task-first.browser.cjs
      - name: All figure families and proof steps
        if: ${{ !cancelled() }}
        env:
          GEOMETRY_SCENE_SHOTS: artifacts/stereo-figures
        run: node tools/stereo/task-scenes.browser.cjs
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stereo-task-first-visuals
          path: artifacts/
          retention-days: 7
          if-no-files-found: warn
      - run: git diff --check
