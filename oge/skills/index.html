.","type":"multi","skillId":"n15-conditions","options":[{"text":"Углы при B и C равны.","correct":true},{"text":"Угол A обязательно равен 60°.","correct":false},{"text":"Медиана из A к BC является высотой.","correct":true},{"text":"Все три стороны обязательно равны.","correct":false},{"text":"Треугольник обязательно остроугольный.","correct":false}],"visual":{"kind":"polygon","points":[[-3,0],[3,0],[0,4]],"labels":["B","C","A"],"grid":false},"hint":"Вспомни свойства равнобедренного треугольника с основанием BC. Равнобедренный треугольник может иметь разные углы при вершине A.","explanation":"Из AB = AC следуют равенство углов при B и C и совпадение медианы, высоты и биссектрисы, проведённых из A. Значение угла A и равенство третьей стороны не заданы."},{"id":"exp-n15-area-entry","title":"Часть площади треугольника","prompt":"Площадь ABC равна 60 см². Точка D лежит на BC, BD : DC = 2 : 3. Найди площадь ABD.","type":"number","skillId":"n15-area-ratio","hint":"Высота из A к прямой BC общая для двух частей. На сколько равных долей делится вся площадь?","explanation":"Отношение площадей ABD и ACD равно 2 : 3. Всего 5 долей, одна доля — 60 ÷ 5 = 12 см². Площадь ABD: 2 · 12 = 24 см².","answer":24,"unit":"см²","visual":{"kind":"polygon","points":[[3,12],[0,0],[4,0],[10,0]],"labels":["A","B","D","C"],"grid":false,"diagonals":[[0,2]],"label":"Треугольник ABC разделён отрезком AD. D лежит на BC, BD : DC = 2 : 3."},"originAtlasId":"15.1"},{"id":"exp-n15-area-exit","title":"Площадь второй части","prompt":"Площадь ABC равна 75 см². Точка D лежит на BC, BD : DC = 3 : 2. Найди площадь ACD.","type":"number","skillId":"n15-area-ratio","hint":"Нужна часть при основании DC. Сколько долей из общего числа ей соответствует?","explanation":"Общая площадь делится на 5 долей. Площадь ACD равна 2/5 от 75, то есть 30 см².","answer":30,"unit":"см²","visual":{"kind":"polygon","points":[[4,15],[0,0],[6,0],[10,0]],"labels":["A","B","D","C"],"grid":false,"diagonals":[[0,2]],"label":"Треугольник ABC с D на BC. BD : DC = 3 : 2."},"originAtlasId":"15.1"},{"id":"exp-n15-right-entry","title":"Где находится прямой угол?","prompt":"В треугольнике ABC даны AB = 13 см, BC = 5 см, CA = 12 см. В какой вершине находится прямой угол?","type":"choice","skillId":"n15-right","hint":"Найди наибольшую сторону. Проверь равенство квадратов, затем выбери противоположную вершину.","explanation":"5² + 12² = 25 + 144 = 169 = 13². По обратной теореме Пифагора треугольник прямоугольный. Наибольшая сторона AB лежит напротив вершины C.","options":[{"text":"A","correct":false},{"text":"B","correct":false},{"text":"C","correct":true},{"text":"Прямого угла нет.","correct":false}],"visual":{"kind":"polygon","points":[[12,0],[0,5],[0,0]],"labels":["A","B","C"],"grid":false,"label":"Треугольник ABC: AB = 13, BC = 5, CA = 12. Отметки прямого угла нет."},"originAtlasId":"15.2"},{"id":"exp-n15-right-exit","title":"Угол по трём сторонам","prompt":"В треугольнике ABC даны AB = 25 см, BC = 7 см, CA = 24 см. Найди угол C.","type":"number","skillId":"n15-right","hint":"Угол C лежит напротив AB. Сравни квадрат AB с суммой квадратов двух других сторон.","explanation":"7² + 24² = 49 + 576 = 625 = 25². Значит, угол напротив AB, то есть угол C, равен 90°.","answer":90,"unit":"°","visual":{"kind":"polygon","points":[[24,0],[0,7],[0,0]],"labels":["A","B","C"],"grid":false,"label":"Треугольник ABC: AB = 25, BC = 7, CA = 24."},"originAtlasId":"15.2"}],"creative":[{"id":"n15-c-triangle-gate","title":"Треугольник держится или распрямился?","prompt":"Две стороны равны 5 см и 8 см. Подбери длину третьей стороны x, чтобы получился невырожденный треугольник. Затем проверь, что происходит на границах допустимого диапазона.","type":"triangleGate","skillId":"n15-sides","sideA":5,"sideB":8,"hint":"Третья сторона должна быть меньше суммы двух других и больше разности большей и меньшей сторон. Равенство не подходит.","explanation":"Подходит любое x, для которого 3 < x < 13. Например, x = 7. При x = 3 или x = 13 стороны укладываются на одну прямую: площадь равна нулю."},{"id":"n15-c-perimeter-counterexample","title":"Сломай неверное обобщение","prompt":"Кто-то утверждает: «Если периметр треугольника равен 24 см, все его стороны равны». Подбери целые положительные длины a, b и c: периметр должен остаться 24 см, треугольник должен существовать и не должен быть равносторонним.","type":"build","skillId":"n15-sides","fields":[{"name":"a","label":"Сторона a, см","min":1,"max":20,"step":1,"initial":8},{"name":"b","label":"Сторона b, см","min":1,"max":20,"step":1,"initial":8},{"name":"c","label":"Сторона c, см","min":1,"max":20,"step":1,"initial":8}],"constants":{"p":24},"conditions":[{"left":"a+b+c","op":"eq","right":"p"},{"left":"a+b","op":"gt","right":"c"},{"left":"a+c","op":"gt","right":"b"},{"left":"b+c","op":"gt","right":"a"},{"left":"abs(a-b)+abs(b-c)","op":"gt","right":"0"}],"exampleSolution":{"a":6,"b":8,"c":10},"hint":"Начни с 8, 8 и 8. Измени две стороны так, чтобы их сумма сохранилась, и обязательно проверь неравенства треугольника.","explanation":"Например, стороны 6, 8 и 10 дают периметр 24, удовлетворяют всем трём строгим неравенствам треугольника и не равны между собой. Одного такого примера достаточно, чтобы опровергнуть утверждение."},{"id":"n15-c-outside-height","title":"Высота вышла за пределы треугольника","prompt":"В треугольнике ABC основание AB = 6 см. Точка D лежит на продолжении AB за точку A, CD перпендикулярна прямой AB, CD = 4 см, AC = 5 см. Выбери площадь треугольника ABC.","type":"choice","skillId":"n15-area","options":[{"text":"12 см²","correct":true},{"text":"15 см²","correct":false},{"text":"24 см²","correct":false},{"text":"30 см²","correct":false}],"visual":{"kind":"polygon","points":[[0,0],[6,0],[-3,4]],"labels":["A","B","C"],"grid":true},"hint":"Высота к AB перпендикулярна прямой AB. Она может находиться вне самого треугольника; наклонная сторона AC её не заменяет.","explanation":"Высота к основанию AB — отрезок CD длиной 4 см. Поэтому S = 6 · 4 / 2 = 12 см². Длина наклонной стороны AC в этой формуле не используется."},{"id":"exp-n15-area-creative","title":"Площади треугольников с общей высотой","prompt":"Площадь ABC равна 48 см², D лежит на BC, BD : DC = 1 : 3. Распредели всю площадь между ABD и ACD. Проверь одновременно отношение частей и их сумму.","type":"build","skillId":"n15-area-ratio","hint":"У треугольников ABD и ACD одна высота. Во сколько раз различаются их основания?","explanation":"Площади относятся как основания: S(ABD) : S(ACD) = 1 : 3. Четыре равные доли составляют 48 см². Поэтому S(ABD) = 12 см² и S(ACD) = 36 см². Проверка: 12 + 36 = 48.","fields":[{"name":"p","label":"Площадь ABD, см²","initial":"","min":0,"max":48},{"name":"q","label":"Площадь ACD, см²","initial":"","min":0,"max":48}],"constants":{},"conditions":[{"left":"p","op":"gt","right":"0"},{"left":"q","op":"gt","right":"0"},{"left":"p+q","op":"eq","right":"48"},{"left":"q","op":"eq","right":"3*p"}],"exampleSolution":{"p":12,"q":36},"visual":{"kind":"polygon","points":[[3,8],[0,0],[3,0],[12,0]],"labels":["A","B","D","C"],"grid":false,"diagonals":[[0,2]],"label":"Треугольник ABC разделён отрезком AD. BD : DC = 1 : 3; высота к прямой BC общая."},"originAtlasId":"15.1"},{"id":"exp-n15-right-creative","title":"Обратная теорема Пифагора","prompt":"Две стороны треугольника равны 6 и 8. Сначала подбери наибольшую сторону c, чтобы треугольник был прямоугольным. Затем замени только её целым числом d от 9 до 13 так, чтобы треугольник существовал, но прямого угла уже не было. Подойдёт любое допустимое d.","type":"build","skillId":"n15-right","hint":"Для c проверь сумму квадратов 6 и 8. Для d отдельно проверь существование треугольника и равенство квадратов.","explanation":"6² + 8² = 100, поэтому c = 10. Например, d = 11: 6 + 8 > 11, но 6² + 8² ≠ 11². Также подходят d = 9, 12 или 13. Значение d = 10 не подходит, поскольку сохраняет прямой угол.","fields":[{"name":"c","label":"Наибольшая сторона c","initial":"","min":8,"max":14,"integer":true,"step":1},{"name":"d","label":"Другая наибольшая сторона d","initial":"","min":9,"max":13,"integer":true,"step":1}],"constants":{},"conditions":[{"left":"c","op":"gt","right":"8"},{"left":"c","op":"lt","right":"14"},{"left":"c*c","op":"eq","right":"100"},{"left":"d","op":"gt","right":"8"},{"left":"d","op":"lt","right":"14"},{"left":"abs(d*d-100)","op":"gt","right":"0"}],"exampleSolution":{"c":10,"d":11},"originAtlasId":"15.2"}],"extensions":["Исследовать, какие стороны и углы действительно определяют треугольник.","Связать площадь с медианами и сравнивать площади без полного вычисления.","Перейти к подобию и задачам с несколькими связанными треугольниками."],"overviewTaskIds":["n15-q-angle","n15-q-pythagoras","n15-q-area-match","n15-q-isosceles"]},{"id":"n16","title":"№16 · Окружность","goal":"Проверить несколько базовых связей между радиусами, углами, касательной и вписанными фигурами. Это выборочная практика, а не полный набор задач №16.","sourceHref":"/trainers/oge-task16-circle.html","skills":[{"id":"n16-radius","label":"Связывать радиус и диаметр","requires":[],"evidence":"Различает радиус и диаметр и использует отношение d = 2r."},{"id":"n16-arc-angle","label":"Выбирать дугу для вписанного угла","requires":[],"evidence":"Находит дугу, не содержащую вершину вписанного угла, и делит её градусную меру пополам."},{"id":"n16-diameter-angle","label":"Узнавать прямой угол, опирающийся на диаметр","requires":["n16-arc-angle"],"evidence":"При заданном диаметре и третьей точке окружности получает прямой угол, не предполагая равенство катетов."},{"id":"n16-tangent","label":"Использовать перпендикулярность радиуса и касательной","requires":["n16-radius"],"evidence":"Выделяет прямоугольный треугольник с радиусом в точку касания и применяет теорему Пифагора."},{"id":"n16-cyclic","label":"Проверять углы вписанного четырёхугольника","requires":[],"evidence":"Использует сумму противоположных углов 180° и различает вписанный четырёхугольник и прямоугольник."},{"id":"n16-circle-polygons","label":"Связывать окружность с вписанными и описанными фигурами","requires":["n16-radius","n17-properties","n15-right"],"evidence":"Различает сторону и диагональ квадрата при двух положениях окружности и находит площадь по подходящей связи."},{"id":"n16-center-chords","label":"Находить центр по равноудалённости от точек","requires":["n16-radius","n18-coordinates"],"evidence":"Использует равные расстояния от центра до точек окружности или серединный перпендикуляр к хорде; проверяет найденный центр и радиус."},{"id":"n16-equal-tangents","label":"Использовать равные отрезки касательных","requires":["n16-tangent"],"evidence":"Объединяет равные отрезки касательных из одной вершины и восстанавливает их длины по сторонам треугольника."}],"quick":[{"id":"n16-q-cyclic-angle","title":"Угол напротив","prompt":"Четырёхугольник ABCD вписан в окружность; вершины перечислены по порядку. Угол A равен 73°. Найди угол C.","type":"number","skillId":"n16-cyclic","answer":107,"unit":"°","hint":"Углы A и C противоположные. У вписанного четырёхугольника их сумма равна 180°.","explanation":"Угол C равен 180 − 73 = 107°. Складывать до 180° здесь нужно противоположные, а не любые соседние углы."},{"id":"n16-q-central-inscribed","title":"Одна дуга — два угла","prompt":"O — центр окружности. Центральный угол AOB, опирающийся на меньшую дугу AB, равен 116°. Точка C лежит на большей дуге AB. Найди угол ACB.","type":"choice","skillId":"n16-arc-angle","options":[{"text":"58°","correct":true},{"text":"116°","correct":false},{"text":"64°","correct":false},{"text":"232°","correct":false}],"hint":"Вершина C находится на большей дуге. Угол ACB опирается на другую, меньшую дугу AB.","explanation":"Градусная мера меньшей дуги AB равна 116°. Вписанный угол ACB составляет её половину: 116 / 2 = 58°."},{"id":"n16-q-radius-match","title":"Проверь масштаб окружности","prompt":"Сопоставь данные с искомыми длинами. Все длины указаны в сантиметрах.","type":"match","skillId":"n16-radius","pairs":[{"left":"Диаметр 18; найти радиус","right":"9 см"},{"left":"Радиус 7; найти диаметр","right":"14 см"},{"left":"Диаметр 5; найти радиус","right":"2,5 см"}],"hint":"Диаметр состоит из двух радиусов.","explanation":"Получаем радиус 18 / 2 = 9, диаметр 2 · 7 = 14 и радиус 5 / 2 = 2,5 см."},{"id":"n16-q-diameter-facts","title":"Диаметр даёт прямой угол, но что ещё?","prompt":"O — центр окружности, AB — диаметр, C — точка окружности, отличная от A и B. Выбери все утверждения, которые обязательно верны.","type":"multi","skillId":"n16-diameter-angle","options":[{"text":"Угол ACB равен 90°.","correct":true},{"text":"OA = OB.","correct":true},{"text":"AC = BC.","correct":false},{"text":"Угол CAB обязательно равен 45°.","correct":false},{"text":"AB = 2 · OC.","correct":true}],"hint":"Диаметр задаёт полуокружность. Все радиусы одной окружности равны, но положение C может быть разным.","explanation":"Угол, опирающийся на диаметр, прямой. OA, OB и OC — равные радиусы, а AB — два радиуса. Равенство AC и BC и угол 45° не гарантированы."},{"id":"exp-n16-center-entry","title":"Центр и середина хорды","prompt":"Окружность проходит через A(0; 0) и B(6; 0). Её центр O лежит на прямой y = 4. Найди абсциссу центра O.","type":"number","skillId":"n16-center-chords","hint":"Центр равноудалён от концов хорды AB. На какой вертикальной прямой лежат такие точки?","explanation":"Середина AB имеет абсциссу 3. Серединный перпендикуляр к горизонтальной хорде — прямая x = 3. Поэтому абсцисса O равна 3.","answer":3,"visual":{"kind":"polygon","points":[[0,0],[6,0]],"labels":["A","B"],"grid":true,"pointsOnly":true,"segments":[{"from":[0,0],"to":[6,0]},{"from":[-1,4],"to":[7,4],"dashed":true,"label":"y = 4"}],"bounds":{"xMin":-1,"xMax":7,"yMin":-1,"yMax":6},"label":"Точки A(0; 0) и B(6; 0), хорда AB и прямая y = 4. Центр не отмечен."},"originAtlasId":"16.1","depth":"extension"},{"id":"exp-n16-center-exit","title":"Ордината центра окружности","prompt":"Окружность проходит через A(−2; 1), B(6; 1) и C(−2; 5). Найди ординату её центра.","type":"number","skillId":"n16-center-chords","hint":"Центр лежит на серединных перпендикулярах к горизонтальной AB и вертикальной AC.","explanation":"Серединный перпендикуляр к AB — прямая x = 2. Середина вертикальной AC имеет ординату (1 + 5)/2 = 3, поэтому второй серединный перпендикуляр — y = 3. Центр O(2; 3), его ордината равна 3.","answer":3,"visual":{"kind":"polygon","points":[[-2,1],[6,1],[-2,5]],"labels":["A","B","C"],"grid":true,"pointsOnly":true,"segments":[{"from":[-2,1],"to":[6,1]},{"from":[-2,1],"to":[-2,5]}],"bounds":{"xMin":-3,"xMax":7,"yMin":-1,"yMax":6},"label":"Точки A(−2; 1), B(6; 1), C(−2; 5). Центр не показан."},"originAtlasId":"16.1","depth":"extension"},{"id":"exp-n16-tangents-entry","title":"Отрезок от вершины до касания","prompt":"Окружность вписана в треугольник ABC: AB = 6 см, AC = 10 см, BC = 8 см. Она касается AB в F. Найди AF.","type":"number","skillId":"n16-equal-tangents","hint":"Обозначь равные отрезки касательных из A, B и C тремя буквами. Как из них складываются стороны?","explanation":"Пусть отрезки из A, B и C равны x, y и z. Тогда x + y = 6, x + z = 10, y + z = 8. Сложив первые два равенства и вычтя третье, получаем 2x = 8. Поэтому AF = 4 см.","answer":4,"unit":"см","visual":{"kind":"polygon","points":[[0,6],[0,2],[0,0],[2,0],[8,0],[3.2,3.6]],"labels":["A","F","B","D","C","E"],"grid":false,"circles":[{"center":[2,2],"radius":2}],"bounds":{"xMin":-1,"xMax":9,"yMin":-1,"yMax":7},"label":"Треугольник ABC со сторонами 6, 10, 8 и вписанной окружностью. F, D, E — точки касания с AB, BC, AC."},"originAtlasId":"16.2"},{"id":"exp-n16-tangents-exit","title":"Другая вершина, те же равенства","prompt":"Окружность вписана в ABC: AB = 10 см, AC = 17 см, BC = 21 см. Она касается AB в F. Найди BF.","type":"number","skillId":"n16-equal-tangents","hint":"Для BF нужны отрезки касательных из B. Удвоенная их длина равна AB + BC − AC.","explanation":"2 · BF = AB + BC − AC = 10 + 21 − 17 = 14. Следовательно, BF = 7 см.","answer":7,"unit":"см","visual":{"kind":"polygon","points":[[6,8],[4.2,5.6],[0,0],[7,0],[21,0],[8.647058823529411,6.588235294117647]],"labels":["A","F","B","D","C","E"],"grid":false,"circles":[{"center":[7,3.5],"radius":3.5}],"bounds":{"xMin":-1,"xMax":22,"yMin":-1,"yMax":9},"label":"Треугольник ABC: AB = 10, AC = 17, BC = 21. F, D, E — точки касания вписанной окружности."},"originAtlasId":"16.2"}],"creative":[{"id":"n16-c-tangent-machine","title":"Собери треугольник у касательной","prompt":"Из точки P проведена касательная PT к окружности с центром O. OT = 5 см, OP = 13 см. Подбери положительную длину PT = x так, чтобы выполнялась теорема Пифагора для треугольника OTP.","type":"build","skillId":"n16-tangent","fields":[{"name":"x","label":"Длина отрезка касательной PT, см","min":1,"max":15,"step":1,"initial":10}],"constants":{"r":5,"d":13},"conditions":[{"left":"x","op":"gt","right":"0"},{"left":"x^2+r^2","op":"eq","right":"d^2"}],"exampleSolution":{"x":12},"hint":"Радиус OT перпендикулярен касательной PT. Поэтому OP — гипотенуза, а не катет.","explanation":"Треугольник OTP прямоугольный при T. PT² = 13² − 5² = 169 − 25 = 144, поэтому PT = 12 см."},{"id":"n16-c-move-vertex","title":"Переставь вершину на другую дугу","prompt":"Меньшая дуга AB имеет градусную меру 120°. Точку C переставили с большей дуги AB на меньшую; C не совпадает с A или B. Чему теперь равен угол ACB?","type":"choice","skillId":"n16-arc-angle","options":[{"text":"60°","correct":false},{"text":"120°","correct":true},{"text":"240°","correct":false},{"text":"180°","correct":false}],"hint":"Угол ACB опирается на дугу AB, которая не содержит его вершину C. После перемещения это уже другая дуга.","explanation":"Теперь вершина C находится на меньшей дуге. Угол опирается на большую дугу градусной меры 360 − 120 = 240° и равен 240 / 2 = 120°."},{"id":"n16-c-not-rectangle","title":"Вписанный — ещё не прямоугольник","prompt":"Подбери углы A, B, C и D выпуклого вписанного четырёхугольника, который не является прямоугольником. Вершины идут по порядку, каждый угол должен быть между 0° и 180°. Противоположные углы должны давать в сумме 180°.","type":"build","skillId":"n16-cyclic","fields":[{"name":"a","label":"Угол A, °","min":1,"max":179,"step":1,"initial":90},{"name":"b","label":"Угол B, °","min":1,"max":179,"step":1,"initial":90},{"name":"c","label":"Угол C, °","min":1,"max":179,"step":1,"initial":90},{"name":"d","label":"Угол D, °","min":1,"max":179,"step":1,"initial":90}],"constants":{},"conditions":[{"left":"a","op":"gt","right":"0"},{"left":"a","op":"lt","right":"180"},{"left":"b","op":"gt","right":"0"},{"left":"b","op":"lt","right":"180"},{"left":"c","op":"gt","right":"0"},{"left":"c","op":"lt","right":"180"},{"left":"d","op":"gt","right":"0"},{"left":"d","op":"lt","right":"180"},{"left":"a+c","op":"eq","right":"180"},{"left":"b+d","op":"eq","right":"180"},{"left":"abs(a-90)+abs(b-90)+abs(c-90)+abs(d-90)","op":"gt","right":"0"}],"exampleSolution":{"a":80,"b":100,"c":100,"d":80},"hint":"Можно уменьшить угол A и настолько же увеличить противоположный угол C. Сохрани сумму второй пары и проверь, остались ли все углы прямыми.","explanation":"Например, углы 80°, 100°, 100° и 80° подходят: обе пары противоположных углов дают 180°, но не все углы равны 90°. Поэтому вписанный четырёхугольник не обязан быть прямоугольником."},{"id":"exp-n16-center-creative","title":"Восстанови центр окружности","prompt":"Точки A(0; 0), B(6; 0) и C(0; 8) лежат на одной окружности. Подбери координаты центра O и радиус r, чтобы окружность прошла через все три точки. Рисунок меняется по введённым координатам и радиусу.","type":"build","skillId":"n16-center-chords","hint":"Центр лежит на серединном перпендикуляре к каждой хорде. Начни с горизонтальной AB и вертикальной AC.","explanation":"Серединный перпендикуляр к AB: x = 3. К AC: y = 4. Значит, O(3; 4). Расстояния OA, OB и OC равны √(3² + 4²) = 5. Поэтому r = 5.","fields":[{"name":"ox","label":"Абсцисса центра O","initial":1,"min":1,"max":5},{"name":"oy","label":"Ордината центра O","initial":2,"min":2,"max":6},{"name":"r","label":"Радиус r","initial":3,"min":3,"max":6}],"constants":{},"conditions":[{"left":"ox*ox+oy*oy","op":"eq","right":"r*r"},{"left":"(ox-6)^2+oy*oy","op":"eq","right":"r*r"},{"left":"ox*ox+(oy-8)^2","op":"eq","right":"r*r"}],"exampleSolution":{"ox":3,"oy":4,"r":5},"visual":{"kind":"polygon","points":[[0,0],[6,0],[0,8]],"labels":["A","B","C"],"grid":true,"pointsOnly":true,"segments":[{"from":[0,0],"to":[6,0]},{"from":[0,0],"to":[0,8]}],"bounds":{"xMin":-5,"xMax":11,"yMin":-4,"yMax":12},"dynamic":{"kind":"circumcircle","x":"ox","y":"oy","r":"r","fields":["ox","oy","r"]},"label":"Три заданные точки A(0; 0), B(6; 0), C(0; 8) и окружность с введёнными центром и радиусом. Подходящий центр заранее не указан."},"originAtlasId":"16.1","depth":"extension"},{"id":"exp-n16-tangents-creative","title":"Равные отрезки касательных","prompt":"Окружность вписана в ABC, AB = 13, AC = 15, BC = 14. Точки касания: F на AB, E на AC, D на BC. Восстанови длины трёх пар: AF = AE = x, BF = BD = y, CE = CD = z.","type":"build","skillId":"n16-equal-tangents","hint":"Запиши длину каждой стороны как сумму двух отрезков. Каждая неизвестная входит в две стороны.","explanation":"Получаем x + y = 13, x + z = 15, y + z = 14. Из первых двух равенств после вычитания третьего: 2x = 14, x = 7. Затем y = 6, z = 8. Проверка: 7 + 6 = 13; 7 + 8 = 15; 6 + 8 = 14.","fields":[{"name":"x","label":"AF = AE","initial":"","min":0,"max":15},{"name":"y","label":"BF = BD","initial":"","min":0,"max":15},{"name":"z","label":"CE = CD","initial":"","min":0,"max":15}],"constants":{},"conditions":[{"left":"x","op":"gt","right":"0"},{"left":"y","op":"gt","right":"0"},{"left":"z","op":"gt","right":"0"},{"left":"x+y","op":"eq","right":"13"},{"left":"x+z","op":"eq","right":"15"},{"left":"y+z","op":"eq","right":"14"}],"exampleSolution":{"x":7,"y":6,"z":8},"visual":{"kind":"polygon","points":[[5,12],[2.3076923076923075,5.538461538461538],[0,0],[6,0],[14,0],[9.2,6.4]],"labels":["A","F","B","D","C","E"],"grid":false,"circles":[{"center":[6,4],"radius":4}],"bounds":{"xMin":-1,"xMax":15,"yMin":-1,"yMax":13},"label":"Треугольник ABC со сторонами AB = 13, AC = 15, BC = 14. Окружность касается сторон в F, E, D. Числа искомых отрезков на рисунке не показаны."},"originAtlasId":"16.2"}],"extensions":["Исследовать касательные из одной точки и равенство их отрезков.","Разобрать углы между хордами, касательными и секущими с точными условиями каждой теоремы.","Связать вписанные углы с подобием треугольников."],"overviewTaskIds":["n16-q-cyclic-angle","n16-q-central-inscribed","n16-q-radius-match","n16-q-diameter-facts"]},{"id":"n17","title":"№17 · Четырёхугольники","goal":"Потренировать выбор высоты, несколько формул площади и обязательные свойства фигур. Маршрут показывает часть темы №17.","sourceHref":"/trainers/oge-task17-quadrilaterals.html","skills":[{"id":"n17-properties","label":"Различать свойства параллелограмма и его частных случаев","requires":[],"evidence":"Проверяет, какие свойства верны для любого параллелограмма, а какие требуют прямоугольника, ромба или квадрата."},{"id":"n17-height","label":"Выбирать перпендикулярную высоту","requires":[],"evidence":"Отличает расстояние между параллельными прямыми от длины наклонной боковой стороны."},{"id":"n17-parallelogram-area","label":"Считать площадь параллелограмма и замечать её сохранение","requires":["n17-height"],"evidence":"Использует основание и высоту к нему и проверяет, что наклон при неизменных основании и высоте не меняет площадь."},{"id":"n17-rhombus-area","label":"Связывать площадь ромба с его диагоналями","requires":[],"evidence":"Выбирает половину произведения диагоналей ромба, не распространяя формулу на произвольный четырёхугольник."},{"id":"n17-trapezoid-area","label":"Считать площадь трапеции по основаниям и высоте","requires":["n17-height"],"evidence":"Берёт полусумму параллельных оснований и умножает её на расстояние между ними."},{"id":"n17-midline","label":"Использовать среднюю линию трапеции и её отрезки","requires":[],"evidence":"Соотносит отрезки средней линии, отсечённые диагональю, с половинами оснований; решает прямой и обратный вопрос."},{"id":"n17-diagonal-midpoint","label":"Восстанавливать вершину по серединам диагоналей","requires":["n17-properties","n18-coordinates"],"evidence":"Использует общую середину диагоналей параллелограмма и учитывает указанный последовательный порядок вершин."}],"quick":[{"id":"n17-q-parallelogram-area","title":"Площадь по основанию и высоте","prompt":"Основание параллелограмма равно 12 см, высота, проведённая к этому основанию, равна 5 см. Найди площадь.","type":"number","skillId":"n17-parallelogram-area","answer":60,"unit":"см²","visual":{"kind":"polygon","points":[[0,0],[12,0],[15,5],[3,5]],"labels":["A","B","C","D"],"grid":false},"hint":"Для параллелограмма перемножают основание и высоту к нему. Делить пополам не нужно.","explanation":"Площадь равна 12 · 5 = 60 см²."},{"id":"n17-q-trapezoid-area","title":"Два основания","prompt":"Основания трапеции равны 6 см и 14 см, высота равна 5 см. Найди площадь.","type":"choice","skillId":"n17-trapezoid-area","options":[{"text":"20 см²","correct":false},{"text":"50 см²","correct":true},{"text":"70 см²","correct":false},{"text":"100 см²","correct":false}],"hint":"Сначала найди среднее арифметическое двух оснований, затем умножь его на высоту.","explanation":"S = (6 + 14) · 5 / 2 = 50 см²."},{"id":"n17-q-formula-match","title":"Выбери формулу для данных","prompt":"Сопоставь фигуру и заданные величины с подходящей формулой площади. Высота h проведена к указанному основанию или между указанными основаниями.","type":"match","skillId":"n17-rhombus-area","pairs":[{"left":"Параллелограмм: основание a и высота h","right":"a · h"},{"left":"Ромб: диагонали d₁ и d₂","right":"d₁ · d₂ / 2"},{"left":"Трапеция: основания a и b, высота h","right":"(a + b) · h / 2"}],"hint":"У ромба диагонали перпендикулярны. У трапеции в формуле участвуют оба параллельных основания.","explanation":"Для параллелограмма S = a · h; для ромба S = d₁ · d₂ / 2; для трапеции S = (a + b) · h / 2. Условия о виде фигуры существенны."},{"id":"n17-q-necessary-properties","title":"Любой параллелограмм?","prompt":"Выбери все свойства, которые верны для любого невырожденного параллелограмма.","type":"multi","skillId":"n17-properties","options":[{"text":"Противоположные стороны попарно параллельны.","correct":true},{"text":"Диагонали делятся точкой пересечения пополам.","correct":true},{"text":"Диагонали обязательно перпендикулярны.","correct":false},{"text":"Все углы обязательно прямые.","correct":false},{"text":"Противоположные углы равны.","correct":true},{"text":"Все стороны обязательно равны.","correct":false}],"hint":"Проверь, не подменяешь ли ты произвольный параллелограмм его особым случаем — прямоугольником, ромбом или квадратом.","explanation":"У любого параллелограмма противоположные стороны параллельны, противоположные углы равны, а диагонали делятся пополам. Прямые углы, равенство всех сторон и перпендикулярность диагоналей требуют дополнительных условий."},{"id":"exp-n17-vertex-entry","title":"Неизвестная абсцисса","prompt":"A(0; 0), B(4; 1), C(5; 4) — последовательные вершины параллелограмма ABCD. Найди абсциссу D.","type":"number","skillId":"n17-diagonal-midpoint","hint":"Середины диагоналей AC и BD совпадают. Сравни суммы абсцисс их концов.","explanation":"xA + xC = xB + xD. Поэтому xD = 0 + 5 − 4 = 1. Указанный порядок A, B, C определяет, какие вершины противоположны.","answer":1,"visual":{"kind":"polygon","points":[[0,0],[4,1],[5,4]],"labels":["A","B","C"],"grid":true,"pointsOnly":true,"segments":[{"from":[0,0],"to":[4,1]},{"from":[4,1],"to":[5,4]},{"from":[0,0],"to":[5,4],"dashed":true}],"bounds":{"xMin":-1,"xMax":6,"yMin":-1,"yMax":5},"label":"Три последовательные вершины A(0; 0), B(4; 1), C(5; 4). Четвёртая вершина не показана."},"originAtlasId":"17.1","depth":"extension"},{"id":"exp-n17-vertex-exit","title":"Неизвестная ордината","prompt":"A(−3; 2), B(1; −1), C(6; 4) — последовательные вершины параллелограмма ABCD. Найди ординату D.","type":"number","skillId":"n17-diagonal-midpoint","hint":"Используй равенство сумм ординат концов двух диагоналей.","explanation":"yA + yC = yB + yD. Поэтому yD = 2 + 4 − (−1) = 7.","answer":7,"visual":{"kind":"polygon","points":[[-3,2],[1,-1],[6,4]],"labels":["A","B","C"],"grid":true,"pointsOnly":true,"segments":[{"from":[-3,2],"to":[1,-1]},{"from":[1,-1],"to":[6,4]}],"bounds":{"xMin":-4,"xMax":7,"yMin":-2,"yMax":8},"label":"Три последовательные вершины A(−3; 2), B(1; −1), C(6; 4). D не показана."},"originAtlasId":"17.1","depth":"extension"},{"id":"exp-n17-trapezoid-entry","title":"Площадь трапеции","prompt":"Основания трапеции равны 5 и 11 см, высота равна 4 см. Найди площадь.","type":"number","skillId":"n17-trapezoid-area","hint":"Площадь равна произведению высоты на полусумму оснований.","explanation":"S = (5 + 11) · 4 / 2 = 32 см².","answer":32,"unit":"см²","visual":{"kind":"polygon","points":[[0,0],[11,0],[8,4],[3,4]],"labels":["A","B","C","D"],"grid":false,"segments":[{"from":[3,0],"to":[3,4],"dashed":true,"label":"h = 4"}],"label":"Трапеция ABCD с основаниями AB = 11, CD = 5 и высотой 4."},"originAtlasId":"17.2"},{"id":"exp-n17-trapezoid-exit","title":"Площадь другой трапеции","prompt":"Основания трапеции равны 7 и 13 см, высота равна 4 см. Найди её площадь.","type":"number","skillId":"n17-trapezoid-area","hint":"Вспомни основание параллелограмма, который можно составить из двух одинаковых копий.","explanation":"S = (7 + 13) · 4 / 2 = 40 см².","answer":40,"unit":"см²","visual":{"kind":"polygon","points":[[0,0],[13,0],[10,4],[3,4]],"labels":["A","B","C","D"],"grid":false,"segments":[{"from":[3,0],"to":[3,4],"dashed":true,"label":"h = 4"}],"label":"Трапеция с основаниями 13 и 7 и высотой 4."},"originAtlasId":"17.2"}],"creative":[{"id":"n17-c-tilt-area","title":"Наклони фигуру, сохрани площадь","prompt":"Основание параллелограмма равно 8, высота к нему равна 5. Измени наклон, не меняя основание и высоту. Затем введи площадь и проверь, зависит ли она от наклона.","type":"tiltArea","skillId":"n17-parallelogram-area","base":8,"height":5,"hint":"Формула использует высоту — перпендикулярное расстояние между параллельными сторонами. Наклонная сторона может изменяться.","explanation":"При любом показанном наклоне S = 8 · 5 = 40 квадратных единиц. Сохраняются основание и высота, поэтому сохраняется площадь."},{"id":"n17-c-diagonals-counterexample","title":"Диагонали не обязаны быть равны","prompt":"Построй контрпример к утверждению «У любого параллелограмма диагонали равны». Задаются вершины A(0; 0), B(a; 0), D(s; h), C(a + s; h), где a > 0 и h > 0. Меняй a, h и сдвиг s так, чтобы квадраты длин AC и BD стали разными.","type":"build","skillId":"n17-properties","fields":[{"name":"a","label":"Основание a","min":2,"max":8,"step":1,"initial":4},{"name":"h","label":"Высота h","min":2,"max":8,"step":1,"initial":3},{"name":"s","label":"Сдвиг верхнего основания s","min":-5,"max":5,"step":1,"initial":0}],"constants":{},"conditions":[{"left":"a","op":"gt","right":"0"},{"left":"h","op":"gt","right":"0"},{"left":"abs((a+s)^2+h^2-((a-s)^2+h^2))","op":"gt","right":"0"}],"exampleSolution":{"a":4,"h":3,"s":2},"hint":"При s = 0 получается прямоугольник. Сдвинь верхнее основание и сравни (a + s)² + h² с (a − s)² + h².","explanation":"При a = 4, h = 3, s = 2 получаем AC² = 6² + 3² = 45 и BD² = 2² + 3² = 13. Диагонали не равны, хотя фигура остаётся параллелограммом.","visual":{"kind":"polygon","points":[[0,0],[4,0],[4,3],[0,3]],"labels":["A","B","C","D"],"grid":true,"diagonals":[[0,2],[1,3]],"bounds":{"xMin":-6,"xMax":14,"yMin":-1,"yMax":9},"dynamic":{"kind":"parallelogram","a":"a","h":"h","shift":"s"},"label":"Параллелограмм с двумя диагоналями. Чертёж меняется вместе с введёнными размерами."}},{"id":"n17-c-side-not-height","title":"Наклонная сторона пытается стать высотой","prompt":"В трапеции ABCD основания AB и CD параллельны, AB = 8 см, CD "correct":false},{"text":"5 см","correct":true},{"text":"4 см","correct":false},{"text":"3 см","correct":false}],"visual":{"kind":"polygon","points":[[1,1],[4,1],[4,5]],"labels":["A","C","B"],"grid":true},"hint":"Горизонтальное изменение равно 3, вертикальное — 4. Они образуют катеты, а отрезок AB — гипотенузу.","explanation":"AB² = 3² + 4² = 25, значит AB = 5 см. Сумма 3 + 4 = 7 — длина пути по двум катетам, а не прямого отрезка."},{"id":"n18-q-displacement-match","title":"Узнай длину по двум изменениям","prompt":"Сторона клетки равна 1. Сопоставь горизонтальное и вертикальное изменения с длиной прямого отрезка между начальной и конечной точками.","type":"match","skillId":"n18-coordinates","pairs":[{"left":"3 клетки вправо и 4 вверх","right":"Длина 5"},{"left":"5 клеток вправо и 12 вверх","right":"Длина 13"},{"left":"8 клеток вправо и 6 вверх","right":"Длина 10"}],"hint":"Два изменения — катеты прямоугольного треугольника. Квадрат искомой длины равен сумме их квадратов.","explanation":"3² + 4² = 25, 5² + 12² = 169, 8² + 6² = 100. Длины равны соответственно 5, 13 и 10."},{"id":"n18-q-cell-scale","title":"Одна клетка — два сантиметра","prompt":"Сторона каждой клетки равна 2 см. В клеточных координатах вершины прямоугольника: A(0; 0), B(3; 0), C(3; 2), D(0; 2). Выбери все верные утверждения.","type":"multi","skillId":"n18-scale","options":[{"text":"AB = 3 см.","correct":false},{"text":"AB = 6 см.","correct":true},{"text":"BC = 4 см.","correct":true},{"text":"Площадь равна 6 см².","correct":false},{"text":"Площадь равна 24 см².","correct":true}],"visual":{"kind":"polygon","points":[[0,0],[3,0],[3,2],[0,2]],"labels":["A","B","C","D"],"grid":true},"hint":"Переведи обе длины из клеток в сантиметры. Одна квадратная клетка имеет площадь 2 · 2 см².","explanation":"Стороны равны 3 · 2 = 6 см и 2 · 2 = 4 см. Площадь равна 6 · 4 = 24 см²; шесть клеток — это шесть участков по 4 см²."},{"id":"exp-n18-complement-entry","title":"Площадь наклонного треугольника","prompt":"На сетке с единичной клеткой даны A(0; 0), B(4; 1), C(1; 3). Найди площадь ABC.","type":"number","skillId":"n18-area","hint":"Можно достроить фигуру до прямоугольника и вычесть внешние прямоугольные треугольники.","explanation":"Прямоугольник 4 × 3 имеет площадь 12. Снаружи ABC остаются треугольники площадей 2, 3 и 1,5. Поэтому S = 12 − 2 − 3 − 1,5 = 5,5.","answer":5.5,"unit":"кв. ед.","visual":{"kind":"polygon","points":[[0,0],[4,1],[1,3]],"labels":["A","B","C"],"grid":true,"bounds":{"xMin":-1,"xMax":5,"yMin":-1,"yMax":4},"label":"Треугольник с вершинами A(0; 0), B(4; 1), C(1; 3) на единичной сетке."},"originAtlasId":"18.1"},{"id":"exp-n18-complement-exit","title":"Площадь без готового разбиения","prompt":"На единичной сетке даны A(−1; 0), B(4; 1), C(2; 5). Найди площадь ABC.","type":"number","skillId":"n18-area","hint":"Прямоугольник вокруг треугольника имеет ширину 5 и высоту 5. Вычти только внешние части.","explanation":"Площадь прямоугольника — 25. Внешние треугольники имеют площади 5 · 1 / 2 = 2,5; 2 · 4 / 2 = 4; 3 · 5 / 2 = 7,5. Поэтому S = 25 − 14 = 11.","answer":11,"unit":"кв. ед.","visual":{"kind":"polygon","points":[[-1,0],[4,1],[2,5]],"labels":["A","B","C"],"grid":true,"bounds":{"xMin":-2,"xMax":5,"yMin":-1,"yMax":6},"label":"Треугольник A(−1; 0), B(4; 1), C(2; 5) на единичной сетке; вспомогательные части не проведены."},"originAtlasId":"18.1"},{"id":"exp-n18-distance-entry","title":"Длина отрезка на сетке","prompt":"На единичной сетке даны A(−2; 1) и B(1; 5). Найди длину отрезка AB.","type":"number","skillId":"n18-length","hint":"Горизонтальное изменение равно 3, вертикальное — 4. Отрезок AB является гипотенузой соответствующего прямоугольного треугольника.","explanation":"AB = √(3² + 4²) = 5. Сумма 3 + 4 описывает другой путь, состоящий из двух перпендикулярных участков.","answer":5,"unit":"ед.","visual":{"kind":"polygon","points":[[-2,1],[1,5]],"labels":["A","B"],"grid":true,"bounds":{"xMin":-3,"xMax":2,"yMin":0,"yMax":6},"label":"Отрезок между A(−2; 1) и B(1; 5) на единичной сетке."},"originAtlasId":"18.2"},{"id":"exp-n18-distance-exit","title":"Длина другого отрезка","prompt":"На единичной сетке даны A(1; −2) и B(7; 6). Найди длину отрезка AB.","type":"number","skillId":"n18-length","hint":"Вычти координаты концов отдельно по каждой оси. Нужна длина отрезка, а не сумма перемещений.","explanation":"Горизонтальное изменение равно 6, вертикальное — 8. AB = √(6² + 8²) = 10.","answer":10,"unit":"ед.","visual":{"kind":"polygon","points":[[1,-2],[7,6]],"labels":["A","B"],"grid":true,"bounds":{"xMin":0,"xMax":8,"yMin":-3,"yMax":7},"label":"Отрезок A(1; −2), B(7; 6) на единичной сетке."},"originAtlasId":"18.2"}],"creative":[{"id":"n18-c-area-perimeter-counterexample","title":"Больше внутри — меньше по краю","prompt":"У прямоугольника A стороны 2 и 8: площадь 16, периметр 20. Подбери целые положительные стороны a и b прямоугольника B так, чтобы его площадь была больше 16, а периметр — меньше 20.","type":"build","skillId":"n18-area-perimeter","fields":[{"name":"a","label":"Сторона a","min":1,"max":12,"step":1,"initial":2},{"name":"b","label":"Сторона b","min":1,"max":12,"step":1,"initial":8}],"constants":{"oldArea":16,"oldPerimeter":20},"conditions":[{"left":"a","op":"gt","right":"0"},{"left":"b","op":"gt","right":"0"},{"left":"a*b","op":"gt","right":"oldArea"},{"left":"2*(a+b)","op":"lt","right":"oldPerimeter"}],"exampleSolution":{"a":4,"b":5},"hint":"Попробуй сделать вытянутый прямоугольник более компактным. Проверяй произведение сторон и удвоенную сумму отдельно.","explanation":"Например, стороны 4 и 5 дают площадь 20 > 16 и периметр 18 < 20. Поэтому большая площадь сама по себе не означает большего периметра.","visual":{"kind":"rectangles","reference":[2,8],"dynamic":{"kind":"rectangle","a":"a","b":"b"},"maxSide":12,"label":"Два прямоугольника в одном масштабе. A остаётся неизменным; стороны B меняются по введённым значениям."}},{"id":"n18-c-move-apex","title":"Перенеси вершину, сохрани площадь","prompt":"В начале дан треугольник A(0; 0), B(6; 0), C(2; 4), его площадь равна 12. Подбери новую вершину C(x; y) выше прямой AB: площадь должна остаться 12, а x не должен равняться 2. Координаты измеряются в единицах сетки. Изменение координат сразу меняет чертёж.","type":"build","skillId":"n18-area","fields":[{"name":"x","label":"Новая координата x","min":-4,"max":10,"step":1,"initial":2},{"name":"y","label":"Новая координата y","min":1,"max":8,"step":1,"initial":4}],"constants":{"base":6,"area":12},"conditions":[{"left":"y","op":"gt","right":"0"},{"left":"base*y/2","op":"eq","right":"area"},{"left":"abs(x-2)","op":"gt","right":"0"}],"exampleSolution":{"x":8,"y":4},"visual":{"kind":"polygon","points":[[0,0],[6,0],[2,4]],"labels":["A","B","C"],"grid":true,"bounds":{"xMin":-5,"xMax":11,"yMin":-1,"yMax":9},"dynamic":{"kind":"vertex","index":2,"x":"x","y":"y"},"label":"Треугольник с неподвижным основанием AB. Вершина C перемещается по введённым координатам; масштаб сетки сохраняется."},"hint":"При горизонтальном основании высоту определяет координата y. Координата x меняет наклон сторон, но не высоту.","explanation":"Например, C(8; 4) подходит: основание по-прежнему равно 6, высота — 4, площадь — 12. Вершина может оказаться за вертикалью через конец основания, и площадь всё равно сохранится."},{"id":"n18-c-scale-debug","title":"Пять — чего именно?","prompt":"Сторона клетки равна 2 см. Отрезок соединяет точки A(0; 0) и B(3; 4) в клеточных координатах. Ученик вычислил 3² + 4² = 25 и ответил «5 см». Где ошибка?","type":"choice","skillId":"n18-scale","options":[{"text":"Вычислено 5 клеточных единиц; длина отрезка равна 10 см.","correct":true},{"text":"Нужно сложить 3 и 4: длина равна 14 см.","correct":false},{"text":"Ошибки нет: длина равна 5 см при любом размере клетки.","correct":false},{"text":"По этим данным длину отрезка найти нельзя.","correct":false}],"visual":{"kind":"polygon","points":[[0,0],[3,0],[3,4]],"labels":["A","C","B"],"grid":true},"hint":"Теорема Пифагора применена к числам клеток. После вычисления нужно учесть, сколько сантиметров в одной клеточной единице.","explanation":"Вычисление даёт длину 5 в клеточных единицах. Одна такая единица равна 2 см, поэтому длина отрезка — 10 см."},{"id":"exp-n18-complement-creative","title":"Найди площадь дополнением","prompt":"Даны A(1; 1), B(6; 2), C(3; 5). Внешний прямоугольник ограничен x = 1, x = 6, y = 1, y = 5. Найди площади трёх внешних прямоугольных треугольников, затем площадь ABC.","type":"build","skillId":"n18-area","hint":"У каждого внешнего треугольника катеты идут по линиям сетки. Не забудь делить произведение катетов пополам.","explanation":"Площадь прямоугольника: 5 · 4 = 20. Нижняя часть: 5 · 1 / 2 = 2,5; правая верхняя: 3 · 3 / 2 = 4,5; левая верхняя: 2 · 4 / 2 = 4. Площадь ABC: 20 − 2,5 − 4,5 − 4 = 9.","fields":[{"name":"bottom","label":"Нижняя внешняя часть","initial":"","min":0,"max":20},{"name":"right","label":"Правая верхняя часть","initial":"","min":0,"max":20},{"name":"left","label":"Левая верхняя часть","initial":"","min":0,"max":20},{"name":"area","label":"Площадь ABC","initial":"","min":0,"max":20}],"constants":{},"conditions":[{"left":"bottom","op":"eq","right":"5*1/2"},{"left":"right","op":"eq","right":"3*3/2"},{"left":"left","op":"eq","right":"2*4/2"},{"left":"bottom+right+left+area","op":"eq","right":"20"}],"exampleSolution":{"bottom":2.5,"right":4.5,"left":4,"area":9},"visual":{"kind":"polygon","points":[[1,1],[6,2],[3,5]],"labels":["A","B","C"],"grid":true,"segments":[{"from":[1,1],"to":[6,1],"dashed":true},{"from":[6,1],"to":[6,5],"dashed":true},{"from":[6,5],"to":[1,5],"dashed":true},{"from":[1,5],"to":[1,1],"dashed":true}],"bounds":{"xMin":0,"xMax":7,"yMin":0,"yMax":6},"label":"Треугольник A(1; 1), B(6; 2), C(3; 5) и окружающий прямоугольник от x = 1 до 6 и от y = 1 до 5. Единичная сетка."},"originAtlasId":"18.1"},{"id":"exp-n18-distance-creative","title":"Длина отрезка и путь по линиям сетки","prompt":"A(0; 0), B(3; 4). Выбери точку P так, чтобы путь A → P → B состоял из одного горизонтального и одного вертикального отрезка. Затем найди отдельно длину отрезка AB и длину этого пути. Подходящих точек P две.","type":"build","skillId":"n18-length","hint":"У горизонтального отрезка совпадают ординаты концов, у вертикального — абсциссы. Для AB используй теорему Пифагора.","explanation":"Подходят P(0; 4) или P(3; 0). В обоих случаях путь имеет длину 3 + 4 = 7, а AB = √(3² + 4²) = 5. Другие кратчайшие пути по сетке возможны с большим числом поворотов; здесь требуется ровно один поворот.","fields":[{"name":"px","label":"Абсцисса P","initial":1,"min":0,"max":3,"integer":true,"step":1},{"name":"py","label":"Ордината P","initial":2,"min":0,"max":4,"integer":true,"step":1},{"name":"direct","label":"Длина отрезка AB","initial":"","min":0,"max":10},{"name":"path","label":"Длина пути A → P → B","initial":"","min":0,"max":10}],"constants":{},"conditions":[{"left":"px*py","op":"eq","right":"0"},{"left":"(3-px)*(4-py)","op":"eq","right":"0"},{"left":"direct","op":"gt","right":"0"},{"left":"direct*direct","op":"eq","right":"25"},{"left":"path","op":"eq","right":"abs(px)+abs(py)+abs(3-px)+abs(4-py)"}],"exampleSolution":{"px":0,"py":4,"direct":5,"path":7},"visual":{"kind":"polygon","points":[[0,0],[1,2],[3,4]],"labels":["A","P","B"],"grid":true,"bounds":{"xMin":-1,"xMax":5,"yMin":-1,"yMax":5},"dynamic":{"kind":"vertex","index":1,"x":"px","y":"py","fields":["px","py"]},"label":"Отрезки AP, PB и AB. A(0; 0), B(3; 4), P задаётся учеником. Единичная сетка."},"originAtlasId":"18.2"}],"extensions":["Находить площади составных фигур через достраивание и вычитание.","Сравнивать несколько разбиений одной фигуры и проверять совпадение результата.","Исследовать, как масштаб меняет длины, периметры и площади."],"overviewTaskIds":["n18-q-triangle-area","n18-q-diagonal","n18-q-displacement-match","n18-q-cell-scale"]},{"id":"n19","title":"№19 · Геометрические утверждения","goal":"Потренировать чтение условий, проверку общих утверждений и поиск контрпримеров. Несколько примеров не означают знания всех утверждений №19.","sourceHref":"/trainers/task19-trainer.html","skills":[{"id":"n19-triangle-facts","label":"Проверять основные утверждения о треугольниках","requires":[],"evidence":"Различает свойства любого треугольника и свойства его специальных видов."},{"id":"n19-quad-classes","label":"Различать определения и классы четырёхугольников","requires":[],"evidence":"Понимает включение прямоугольников и ромбов в класс параллелограммов, не обращая автоматически каждое утверждение."},{"id":"n19-circle-facts","label":"Проверять условия утверждений об окружности","requires":[],"evidence":"Учитывает слова «диаметр», «вписанный», «точка касания» и не переносит свойства на более общий случай."},{"id":"n19-counterexample","label":"Опровергать общее утверждение одним подходящим примером","requires":[],"evidence":"Строит или выбирает пример, который удовлетворяет предпосылке утверждения и нарушает его вывод."},{"id":"n19-conditions","label":"Обосновывать вывод данными условия, а не видом рисунка","requires":[],"evidence":"Выбирает только гарантированный вывод и называет, какого условия не хватает для более сильного утверждения."},{"id":"n19-similarity-conditions","label":"Проверять достаточные условия подобия","requires":["n19-triangle-facts","n19-conditions"],"evidence":"Отличает достаточный признак подобия от совпадения одного угла или одного размера; учитывает соответствие вершин."}],"quick":[{"id":"n19-q-triangle-statements","title":"Верно для каждого треугольника","prompt":"Выбери все утверждения, верные для любого невырожденного треугольника на плоскости.","type":"multi","skillId":"n19-triangle-facts","options":[{"text":"Сумма внутренних углов равна 180°.","correct":true},{"text":"Каждая сторона меньше суммы двух других сторон.","correct":true},{"text":"Любая медиана является биссектрисой.","correct":false},{"text":"Внешний угол равен сумме двух внутренних углов, не смежных с ним.","correct":true},{"text":"Хотя бы один угол обязательно прямой.","correct":false}],"hint":"Для слова «любой» недостаточно подходящего примера. Проверь, не требуется ли равнобедренный или прямоугольный треугольник.","explanation":"Общими являются сумма углов 180°, строгие неравенства сторон и теорема о внешнем угле. Медиана не обязана быть биссектрисой, а треугольник не обязан иметь прямой угол."},{"id":"n19-q-class-inclusion","title":"Кто входит в чей класс?","prompt":"Какое из утверждений верно?","type":"choice","skillId":"n19-quad-classes","options":[{"text":"Любой ромб является квадратом.","correct":false},{"text":"Любой прямоугольник является параллелограммом.","correct":true},{"text":"Любой параллелограмм является прямоугольником.","correct":false},{"text":"Любой равнобедренный треугольник является равносторонним.","correct":false}],"hint":"Специальный вид фигуры обладает свойствами более общего класса. Обратный переход может потребовать дополнительных условий.","explanation":"У прямоугольника противоположные стороны попарно параллельны, поэтому он является параллелограммом. Остальные утверждения неверно превращают частный случай в обязательное свойство всего класса."},{"id":"n19-q-definitions","title":"Определение без лишних ограничений","prompt":"Сопоставь названия фигур с их определениями. Определение должно задавать весь названный класс, а не только отдельный его частный случай.","type":"match","skillId":"n19-quad-classes","pairs":[{"left":"Параллелограмм","right":"Четырёхугольник с попарно параллельными противоположными сторонами"},{"left":"Прямоугольник","right":"Четырёхугольник, у которого все углы прямые"},{"left":"Ромб","right":"Четырёхугольник, у которого все стороны равны"},{"left":"Квадрат","right":"Прямоугольник, у которого все стороны равны"}],"hint":"Квадрат обладает свойствами и прямоугольника, и ромба. Но определения прямоугольника и ромба должны включать также фигуры, не являющиеся квадратами.","explanation":"Эти определения сохраняют включение классов: квадрат — одновременно прямоугольник и ромб, а каждый прямоугольник и каждый ромб — параллелограмм."},{"id":"n19-q-circle-statements","title":"Условия имеют значение","prompt":"Выбери все верные утверждения об окружности.","type":"multi","skillId":"n19-circle-facts","options":[{"text":"Диаметр проходит через центр окружности.","correct":true},{"text":"Любая хорда вдвое длиннее радиуса.","correct":false},{"text":"Вписанный угол, опирающийся на диаметр, прямой.","correct":true},{"text":"Касательная перпендикулярна радиусу, проведённому в точку касания.","correct":true},{"text":"Любая хорда является диаметром.","correct":false}],"hint":"Диаметр — особая хорда. В утверждении о касательной существенны слова «в точку касания».","explanation":"Верны утверждения о прохождении диаметра через центр, о прямом вписанном угле на диаметре и о перпендикулярности касательной соответствующему радиусу. Произвольная хорда не обязана быть диаметром."},{"id":"exp-n19-condition-entry","title":"Одного угла достаточно?","prompt":"В треугольниках ABC и DEF известно только ∠A = ∠D = 40°. Какой вывод верен?","type":"choice","skillId":"n19-similarity-conditions","hint":"Угол при вершине можно сохранить, меняя отношение прилежащих сторон.","explanation":"Одного равенства углов недостаточно. Например, при одном угле 40° отношения двух прилежащих сторон могут быть 2 : 3 и 2 : 4; при указанном соответствии такие треугольники не подобны.","options":[{"text":"Треугольники обязательно равны.","correct":false},{"text":"Треугольники обязательно подобны.","correct":false},{"text":"По этому условию подобие установить нельзя.","correct":true},{"text":"Периметры обязательно равны.","correct":false}],"originAtlasId":"19.1"},{"id":"exp-n19-condition-exit","title":"Утверждения о подобии","prompt":"Выбери все верные утверждения. Речь идёт о невырожденных треугольниках.","type":"multi","skillId":"n19-similarity-conditions","hint":"Вспомни признаки подобия. Одинаковое название вида треугольника или одинаковый периметр не фиксируют его форму.","explanation":"Верны признаки по двум парам равных углов и по двум пропорциональным сторонам с равными углами между ними. Равнобедренные треугольники могут иметь разные углы при вершине. Равные периметры также не определяют форму.","options":[{"text":"Если две пары соответствующих углов равны, треугольники подобны.","correct":true},{"text":"Любые два равнобедренных треугольника подобны.","correct":false},{"text":"Если две пары соответствующих сторон пропорциональны и углы между ними равны, треугольники подобны.","correct":true},{"text":"Если периметры равны, треугольники подобны.","correct":false}],"originAtlasId":"19.1"},{"id":"exp-n19-converse-entry","title":"Равные хорды одной окружности","prompt":"В одной окружности хорды AB и CD равны. Как связаны соответствующие им меньшие центральные углы? Рассматриваем углы больше 0° и не больше 180°.","type":"choice","skillId":"n19-circle-facts","hint":"Сравни треугольники, составленные хордой и двумя радиусами.","explanation":"Если равные хорды являются диаметрами, оба угла равны 180°. В остальных случаях треугольники OAB и OCD имеют по две стороны, равные радиусу одной окружности, и равные третьи стороны — хорды. Они равны по трём сторонам, поэтому центральные углы равны.","options":[{"text":"Эти углы равны.","correct":true},{"text":"Их сумма обязательно равна 180°.","correct":false},{"text":"Один угол обязательно вдвое больше другого.","correct":false},{"text":"По этим данным сравнить углы нельзя.","correct":false}],"originAtlasId":"19.2"},{"id":"exp-n19-converse-exit","title":"Сохрани условия теоремы","prompt":"Выбери все верные утверждения о хордах и соответствующих меньших центральных углах.","type":"multi","skillId":"n19-circle-facts","hint":"Проверь, относятся ли хорды к одной окружности или к окружностям одинакового радиуса.","explanation":"Верны утверждения для равных окружностей и для одной окружности. Равные углы при разных радиусах могут давать разные хорды. Равные хорды также могут встречаться у окружностей разных радиусов.","options":[{"text":"В равных окружностях равным хордам соответствуют равные меньшие центральные углы.","correct":true},{"text":"В любых окружностях равным меньшим центральным углам соответствуют равные хорды.","correct":false},{"text":"Хорды одной окружности, соответствующие равным меньшим центральным углам, равны.","correct":true},{"text":"Если хорды двух окружностей равны, радиусы этих окружностей обязательно равны.","correct":false}],"originAtlasId":"19.2"}],"creative":[{"id":"n19-c-counterexample-choice","title":"Выбери настоящий контрпример","prompt":"Нужно опровергнуть утверждение: «Любой параллелограмм с равными диагоналями является квадратом». Какая фигура служит контрпримером?","type":"choice","skillId":"n19-counterexample","options":[{"text":"Квадрат со стороной 3.","correct":false},{"text":"Прямоугольник со сторонами 2 и 5.","correct":true},{"text":"Треугольник со сторонами 3, 4 и 5.","correct":false},{"text":"Ромб с углом 60°.","correct":false}],"hint":"Контрпример должен одновременно быть параллелограммом, иметь равные диагонали и не быть квадратом.","explanation":"Прямоугольник со сторонами 2 и 5 — параллелограмм с равными диагоналями, но его стороны не все равны. Он удовлетворяет предпосылке и нарушает вывод. Треугольник не подходит по классу, а ромб с углом 60° не имеет равных диагоналей."},{"id":"n19-c-angle-counterexamples","title":"Одного достаточно, но найди все","prompt":"Утверждение: «У каждого треугольника хотя бы два угла равны». Выбери все наборы углов, которые задают треугольник и опровергают это утверждение.","type":"multi","skillId":"n19-counterexample","options":[{"text":"50°, 60°, 70°","correct":true},{"text":"40°, 40°, 100°","correct":false},{"text":"30°, 60°, 90°","correct":true},{"text":"60°, 60°, 60°","correct":false},{"text":"20°, 70°, 90°","correct":true}],"hint":"Проверь две вещи: положительные углы должны давать 180°, а равных углов среди них быть не должно.","explanation":"Все предложенные наборы дают 180°. Контрпримеры — наборы 50°, 60°, 70°; 30°, 60°, 90°; 20°, 70°, 90°: в каждом все углы различны. Наборы с двумя или тремя равными углами утверждение не опровергают."},{"id":"n19-c-picture-vs-condition","title":"Рисунок не добавляет условия","prompt":"Рисунок иллюстрирует условие AB = AC в треугольнике ABC. Числовые значения углов не заданы. Ученик решил, что угол A равен 60°, потому что треугольник похож на равносторонний. Какой вывод действительно гарантирован условием?","type":"choice","skillId":"n19-conditions","options":[{"text":"Угол A равен 60°.","correct":false},{"text":"Углы при B и C равны; точное значение угла A не определено.","correct":true},{"text":"Угол A равен 90°.","correct":false},{"text":"BC = AB.","correct":false}],"visual":{"kind":"polygon","points":[[-3,0],[3,0],[0,4]],"labels":["B","C","A"],"grid":false},"hint":"В условии равны только две стороны. Для равностороннего треугольника понадобилось бы равенство третьей стороны или другое достаточное условие.","explanation":"Треугольник равнобедренный с основанием BC, поэтому углы при B и C равны. Ни значение 60°, ни прямой угол, ни равенство третьей стороны из AB = AC не следуют."},{"id":"exp-n19-condition-creative","title":"Добавь недостающее условие","prompt":"Известно ∠A = ∠D = 40°. Рассматриваем соответствие A ↔ D, B ↔ E, C ↔ F. Какие отдельные дополнительные условия гарантируют подобие ABC и DEF? Отметь все достаточные добавления. Каждый вариант добавляется сам по себе.","type":"multi","skillId":"n19-similarity-conditions","hint":"Проверь каждый вариант по признакам подобия. Для признака по двум сторонам нужен угол именно между ними.","explanation":"Достаточно равенства ∠B = ∠E: работает признак по двум углам. Достаточно и AB : DE = AC : DF: стороны, заключающие уже равные углы A и D, пропорциональны. Одного равенства AB = DE или равных периметров недостаточно.","options":[{"text":"∠B = ∠E.","correct":true},{"text":"AB : DE = AC : DF.","correct":true},{"text":"AB = DE.","correct":false},{"text":"Периметры треугольников равны.","correct":false}],"originAtlasId":"19.1"},{"id":"exp-n19-converse-creative","title":"Проверь обратное утверждение","prompt":"Сопоставь каждое утверждение с «Верно» или «Неверно». Все утверждения должны выполняться для любых фигур, отвечающих их условиям. Рассматриваем меньшие центральные углы больше 0° и не больше 180°. На рисунке радиусы равны 2 и 5, оба центральных угла равны 60°.","type":"match","skillId":"n19-circle-facts","hint":"Сначала сохрани условие «в одной окружности» при изменении направления вывода. Затем подумай, что меняется при разных радиусах.","explanation":"В одной окружности равенство хорд и равенство соответствующих меньших центральных углов следуют друг из друга. Для разных окружностей это неверно без условия о радиусах. При углах 60° и радиусах 2 и 5 хорды равны 2 и 5. В обратную сторону: хорда длины 2 соответствует углу 60° при радиусе 2 и углу 90° при радиусе √2.","matchOptions":["Верно","Неверно"],"pairs":[{"left":"В одной окружности: равные хорды ⇒ равные меньшие центральные углы.","right":"Верно"},{"left":"В одной окружности: равные меньшие центральные углы ⇒ равные хорды.","right":"Верно"},{"left":"В разных окружностях: равные меньшие центральные углы ⇒ равные хорды.","right":"Неверно"},{"left":"В разных окружностях: равные хорды ⇒ равные меньшие центральные углы.","right":"Неверно"}],"visual":{"kind":"polygon","points":[[0,0],[1.7320508075688772,-1],[1.7320508075688772,1],[9,0],[13.330127018922193,-2.5],[13.330127018922193,2.5]],"labels":["O","A","B","P","C","D"],"grid":false,"pointsOnly":true,"circles":[{"center":[0,0],"radius":2},{"center":[9,0],"radius":5}],"segments":[{"from":[0,0],"to":[1.7320508075688772,-1]},{"from":[0,0],"to":[1.7320508075688772,1]},{"from":[1.7320508075688772,-1],"to":[1.7320508075688772,1]},{"from":[9,0],"to":[13.330127018922193,-2.5]},{"from":[9,0],"to":[13.330127018922193,2.5]},{"from":[13.330127018922193,-2.5],"to":[13.330127018922193,2.5]}],"bounds":{"xMin":-3,"xMax":15,"yMin":-6,"yMax":6},"label":"Две окружности с центрами O и P, радиусами 2 и 5. Центральные углы AOB и CPD равны 60°. Изображены соответствующие хорды AB и CD."},"originAtlasId":"19.2"}],"extensions":["Различать утверждение, обратное утверждение и контрпример.","Объяснять, какие дополнительные условия делают неверное утверждение верным.","Сравнивать доказательство общего утверждения с проверкой нескольких частных примеров."],"overviewTaskIds":["n19-q-triangle-statements","n19-q-class-inclusion","n19-q-definitions","n19-q-circle-statements"]},{"id":"n20","title":"№20 · Уравнения, неравенства и преобразования","goal":"Четыре коротких задания помогают выбрать, с чего начать: ограничения, корни, знаки или система. Мастерские раскрывают отдельные приёмы; полные решения второй части требуют письменного обоснования.","assessment":"written-steps","writtenWorkNote":"Здесь проверяются отдельные учебные шаги. Полное решение с обоснованием запиши отдельно и проверь с преподавателем или по критериям задания.","sourceHref":"/trainers/oge-task20-equations.html","skills":[{"id":"n20-domain","label":"Сохранять ограничения при сокращении дроби","requires":["n9-domain"],"evidence":"Находит допустимый корень дробного уравнения и не возвращает исключённое значение после сокращения."},{"id":"n20-factors","label":"Находить все корни разложением на множители","requires":["n9-quadratic"],"evidence":"Перебирает нули каждого множителя и сохраняет нулевой корень."},{"id":"n20-equivalence","label":"Проверять, не потеряны ли решения при преобразовании","requires":["n9-equality","n20-factors"],"evidence":"Приводит конкретный корень, потерянный при делении обеих частей на выражение, равное нулю."},{"id":"n20-signs","label":"Учитывать знаки и границы в неравенстве","requires":["n13-boundaries","n13-scale"],"evidence":"Выбирает верный промежуток и различает нуль числителя и запрещённый нуль знаменателя."},{"id":"n20-system","label":"Проверять обе строки системы","requires":["n9-root"],"evidence":"Выбирает все упорядоченные пары, одновременно удовлетворяющие сумме и произведению."},{"id":"n20-construct","label":"Составлять квадратный многочлен по корням","requires":["n20-factors"],"evidence":"Подбирает коэффициенты и проверяет подстановкой оба заданных корня."},{"id":"n20-written","label":"Записывать полное решение с проверкой ограничений","requires":["n20-domain","n20-factors","n20-signs","n20-system"],"evidence":"Связанные карточки проверяют только части решения. Полнота рассуждений и оформление проверяются по отдельной письменной работе.","separateCheck":false,"relatedTasks":["n20-q-domain","n20-q-system","n20-x-domain","n20-x-factors"]}],"quick":[{"id":"n20-q-domain","title":"Какой корень разрешён?","prompt":"Реши уравнение (x² − 9)/(x − 3) = 0. Введи его корень.","type":"number","skillId":"n20-domain","hint":"Дробь равна нулю, когда числитель равен нулю, а знаменатель не равен нулю.","explanation":"Числитель обращается в нуль при x = −3 и x = 3. Значение x = 3 запрещено знаменателем. Единственный корень: x = −3.","answer":-3},{"id":"n20-q-factors","title":"Ни одного потерянного корня","prompt":"Выбери все корни уравнения x(x − 4) = 0.","type":"multi","skillId":"n20-factors","hint":"Произведение равно нулю, если хотя бы один множитель равен нулю.","explanation":"Первый множитель даёт x = 0, второй — x = 4. Делить исходное уравнение на x без отдельной проверки нуля нельзя.","options":[{"text":"0","correct":true},{"text":"4","correct":true},{"text":"−4","correct":false},{"text":"1","correct":false}]},{"id":"n20-q-signs","title":"Где произведение неположительно?","prompt":"Выбери множество решений неравенства (x − 1)(x + 3) ≤ 0.","type":"choice","skillId":"n20-signs","hint":"Отметь −3 и 1. Между ними множители имеют разные знаки; на границах произведение равно нулю.","explanation":"При −3 < x < 1 произведение отрицательно. Обе границы подходят нестрогому неравенству, поэтому ответ: [−3; 1].","options":[{"text":"[−3; 1]","correct":true},{"text":"(-∞; −3] ∪ [1; +∞)","correct":false},{"text":"(−3; 1)","correct":false},{"text":"[−1; 3]","correct":false}]},{"id":"n20-q-system","title":"Две строки — одна проверка","prompt":"Реши систему x + y = 7, xy = 12. Выбери все подходящие упорядоченные пары (x; y).","type":"multi","skillId":"n20-system","hint":"Из первой строки вырази y = 7 − x и подставь во вторую. После этого проверь обе координаты.","explanation":"Получаем x(7 − x) = 12, то есть (x − 3)(x − 4) = 0. При x = 3 имеем y = 4, при x = 4 — y = 3. Порядок координат различает две пары.","options":[{"text":"(3; 4)","correct":true},{"text":"(4; 3)","correct":true},{"text":"(−3; −4)","correct":false},{"text":"(0; 7)","correct":false}]},{"id":"n20-x-domain","title":"Ограничение в новом уравнении","prompt":"Реши уравнение (x² − 25)/(x − 5) = 0. Введи допустимый корень.","type":"number","skillId":"n20-domain","hint":"Проверь оба нуля числителя в знаменателе.","explanation":"Кандидаты: −5 и 5. Знаменатель исключает 5, поэтому корень равен −5.","answer":-5},{"id":"n20-x-factors","title":"Три множителя — все корни","prompt":"Выбери все корни уравнения x(x + 2)(x − 5) = 0.","type":"multi","skillId":"n20-factors","hint":"Приравняй к нулю каждый из трёх множителей.","explanation":"Из x = 0, x + 2 = 0 и x − 5 = 0 получаем соответственно 0, −2 и 5. Каждый из них зануляет исходное произведение.","options":[{"text":"−2","correct":true},{"text":"0","correct":true},{"text":"5","correct":true},{"text":"2","correct":false},{"text":"−5","correct":false}]}],"creative":[{"id":"n20-c-polynomial","title":"Закажи два корня","prompt":"Составь многочлен x² + px + q, корнями которого будут −2 и 3. Подбери целые коэффициенты p и q.","type":"build","skillId":"n20-construct","hint":"Подставь каждый заданный корень или раскрой скобки в (x + 2)(x − 3).","explanation":"(x + 2)(x − 3) = x² − x − 6. Поэтому p = −1, q = −6. Оба заданных корня −2 и 3 зануляют полученный многочлен; у квадратного многочлена больше двух различных корней быть не может.","fields":[{"name":"p","label":"Коэффициент p","min":-10,"max":10,"integer":true,"initial":0},{"name":"q","label":"Свободный член q","min":-10,"max":10,"integer":true,"initial":0}],"conditions":[{"left":"4-2*p+q","op":"eq","right":"0"},{"left":"9+3*p+q","op":"eq","right":"0"}],"exampleSolution":{"p":-1,"q":-6}},{"id":"n20-c-lost-zero","title":"Верни потерянный корень","prompt":"Ученик разделил обе части x(x − 4) = 0 на x и оставил только x = 4. Найди корень исходного уравнения, который он потерял.","type":"counterexample","skillId":"n20-equivalence","hint":"Проверь значение, при котором деление на x невозможно.","explanation":"При x = 0 исходное произведение равно нулю, но равенство x − 4 = 0 неверно. Деление на x допустимо только при x ≠ 0; случай x = 0 нужно рассмотреть отдельно.","left":"x-4","right":"0","field":"x","exampleCounterexample":0,"counterexampleWhen":[{"left":"x*(x-4)","op":"eq","right":"0"},{"left":"x","op":"eq","right":"0"}],"criterionExplanation":"Искомое значение удовлетворяет исходному уравнению и исключается при делении на x."},{"id":"n20-c-domain-order","title":"Собери решение без запрещённого значения","prompt":"Решаем (x² − 16)/(x − 4) = 0. Собери именно предложенную цепочку: ограничение → сокращение с этим ограничением → корень → его проверка.","type":"order","skillId":"n20-domain","hint":"Каждый следующий вывод опирается на результат предыдущей карточки.","explanation":"Сначала x ≠ 4. Затем (x − 4)(x + 4)/(x − 4) = x + 4, поэтому x = −4. Этот корень не нарушает ограничение. Здесь проверен порядок готовых шагов; полное решение запиши самостоятельно.","items":["Из полученного уравнения x + 4 = 0 находим x = −4.","Знаменатель требует x ≠ 4.","Проверяем найденное значение: −4 ≠ 4. Ответ: x = −4.","С учётом этого ограничения сокращаем множитель x − 4 и получаем x + 4 = 0."],"answer":["Знаменатель требует x ≠ 4.","С учётом этого ограничения сокращаем множитель x − 4 и получаем x + 4 = 0.","Из полученного уравнения x + 4 = 0 находим x = −4.","Проверяем найденное значение: −4 ≠ 4. Ответ: x = −4."]},{"id":"n20-c-boundaries","title":"Одна граница меняет ответ","prompt":"Сопоставь неравенства с их решениями. Обрати внимание на знаменатель, строгий знак и отрицательный множитель.","type":"match","skillId":"n20-signs","hint":"Нуль знаменателя всегда исключён. Квадрат положителен всюду, кроме своего нуля. При делении на отрицательное число знак меняется.","explanation":"Для произведения обе границы включены. Для дроби x = −3 запрещён. Из −2x > 6 следует x < −3. Неравенство (x − 1)² > 0 выполняется при всех x, кроме 1.","pairs":[{"left":"(x − 1)(x + 3) ≤ 0","right":"[−3; 1]"},{"left":"(x − 1)/(x + 3) ≤ 0","right":"(−3; 1]"},{"left":"−2x > 6","right":"x < −3"},{"left":"(x − 1)² > 0","right":"x ≠ 1"}]}],"overviewTaskIds":["n20-q-domain","n20-q-factors","n20-q-signs","n20-q-system"]},{"id":"n21","title":"№21 · Текстовые задачи","goal":"Начни с выбора уравнения, совместной работы, смеси или допустимых значений. В мастерских можно самому собрать условия и проверить смысл ответа. Это учебные шаги перед полным письменным решением.","assessment":"written-steps","writtenWorkNote":"Здесь проверяются отдельные учебные шаги. Полное решение с обоснованием запиши отдельно и проверь с преподавателем или по критериям задания.","sourceHref":"/trainers/oge-task21-word-problems.html","skills":[{"id":"n21-data","label":"Связывать расстояние, скорость и время","requires":["n12-symbols","n12-substitute"],"evidence":"По условию различает скорость, время и их разность; выбирает подходящую запись уравнения."},{"id":"n21-equation","label":"Составлять и проверять модель текстовой задачи","requires":["n21-data","n9-root"],"evidence":"Подбирает значения, которые одновременно выполняют связь скоростей и разность времён."},{"id":"n21-work","label":"Складывать производительности","requires":["n6-muldiv","n12-substitute"],"evidence":"Заменяет время отдельной работы долей работы за час и находит время совместного выполнения."},{"id":"n21-mixture","label":"Сохранять количество вещества при смешивании","requires":["n6-decimal","n12-substitute"],"evidence":"Считает массу вещества в каждой части, складывает её и делит на общую массу смеси."},{"id":"n21-context","label":"Отбирать допустимые значения по смыслу","requires":["n12-constraints"],"evidence":"Учитывает положительное время и положительную скорость движения против течения."},{"id":"n21-average","label":"Находить среднюю скорость через весь путь и всё время","requires":["n21-data"],"evidence":"Различает среднее арифметическое скоростей и отношение суммарного пути к суммарному времени."},{"id":"n21-written","label":"Обосновывать выбор переменной, уравнения и ответа","requires":["n21-equation","n21-context"],"evidence":"Карточки отдельно проверяют модель и расчёты. Самостоятельное письменное решение должно объяснять ограничения и ответ на вопрос задачи.","separateCheck":false,"relatedTasks":["n21-c-speeds","n21-c-average","n21-x-movement"]}],"quick":[{"id":"n21-q-movement","title":"Кто потратил больше времени?","prompt":"Два велосипедиста проехали по 60 км. Второй ехал на 5 км/ч быстрее и потратил на 1 час меньше. Пусть x > 0 — скорость первого в км/ч. Выбери уравнение.","type":"choice","skillId":"n21-data","hint":"Время равно расстоянию, делённому на скорость. У более медленного велосипедиста время больше.","explanation":"Первый потратил 60/x часов, второй — 60/(x + 5). Разность первого и второго времени равна 1: 60/x − 60/(x + 5) = 1.","options":[{"text":"60/x − 60/(x + 5) = 1","correct":true},{"text":"60/(x + 5) − 60/x = 1","correct":false},{"text":"60/x + 60/(x + 5) = 1","correct":false},{"text":"60/(x − 5) − 60/x = 1","correct":false}]},{"id":"n21-q-work","title":"Две трубы работают вместе","prompt":"Первая труба наполняет пустой бассейн за 4 часа, вторая — за 6 часов. Обе трубы работают с постоянной производительностью, слива нет. За сколько часов они наполнят бассейн вместе?","type":"number","skillId":"n21-work","hint":"За час трубы наполняют 1/4 и 1/6 бассейна. Сложи эти доли.","explanation":"За час заполняется 1/4 + 1/6 = 5/12 бассейна. Весь бассейн заполнится за 1 ÷ (5/12) = 12/5 = 2,4 часа.","answer":2.4,"unit":"ч"},{"id":"n21-q-mixture","title":"Проценты после смешивания","prompt":"Смешали 2 кг раствора с массовой долей соли 10% и 3 кг раствора с массовой долей соли 20%. Потерь вещества нет. Найди массовую долю соли в смеси в процентах.","type":"number","skillId":"n21-mixture","hint":"Сначала найди массу соли, а затем раздели её на общую массу раствора.","explanation":"Соли 2 · 0,10 + 3 · 0,20 = 0,8 кг. Масса смеси 5 кг. Массовая доля: 0,8/5 = 0,16, то есть 16%. Среднее двух процентов без учёта масс здесь не подходит.","answer":16,"unit":"%"},{"id":"n21-q-context","title":"Может ли катер идти против течения?","prompt":"Скорость течения равна 2 км/ч. Катер прошёл 18 км против течения за конечное положительное время. Через v обозначена собственная скорость катера в км/ч. Какое неравенство точно описывает все допустимые значения v?","type":"choice","skillId":"n21-context","hint":"Скорость катера против течения равна v − 2 и должна быть положительной.","explanation":"Из v − 2 > 0 следует v > 2. Значение v = 2 не подходит: тогда катер не продвигается против течения.","options":[{"text":"v > 2","correct":true},{"text":"v ≥ 2","correct":false},{"text":"Только v > 0","correct":false},{"text":"0 < v < 2","correct":false}]},{"id":"n21-x-movement","title":"Новая дистанция — та же связь","prompt":"Два велосипедиста проехали по 84 км. Второй ехал на 7 км/ч быстрее первого и потратил на 1 час меньше. Пусть x > 0 — скорость первого. Выбери уравнение.","type":"choice","skillId":"n21-data","hint":"Запиши время каждого отдельно, затем вычти меньшее время из большего.","explanation":"Времена равны 84/x и 84/(x + 7). Поэтому 84/x − 84/(x + 7) = 1. Например, положительное решение x = 21 даёт времена 4 и 3 часа.","options":[{"text":"84/x − 84/(x + 7) = 1","correct":true},{"text":"84/(x + 7) − 84/x = 1","correct":false},{"text":"84/x + 84/(x + 7) = 1","correct":false},{"text":"84/(x − 7) − 84/x = 1","correct":false}]},{"id":"n21-x-mixture","title":"Проверь другую смесь","prompt":"Смешали 4 кг раствора с массовой долей соли 5% и 6 кг раствора с массовой долей соли 20%. Потерь вещества нет. Найди массовую долю соли в смеси в процентах.","type":"number","skillId":"n21-mixture","hint":"Соли будет 4 · 0,05 + 6 · 0,20 кг. Не забудь разделить на всю массу.","explanation":"Масса соли 0,2 + 1,2 = 1,4 кг, масса смеси 10 кг. Получаем 1,4/10 = 0,14, то есть 14%.","answer":14,"unit":"%"}],"creative":[{"id":"n21-c-table","title":"Верни величины на свои места","prompt":"Оба велосипедиста проезжают по 60 км. Скорость первого — x км/ч, второго — на 5 км/ч больше, x > 0. Заполни мысленную таблицу: сопоставь величину и выражение.","type":"match","skillId":"n21-data","hint":"Скорость измеряется в км/ч, время — в часах. Более медленный участник тратит больше времени.","explanation":"Скорость второго x + 5. Времена равны 60/x и 60/(x + 5). Разность времени первого и второго записываем 60/x − 60/(x + 5).","pairs":[{"left":"Скорость второго, км/ч","right":"x + 5"},{"left":"Время первого, ч","right":"60/x"},{"left":"Время второго, ч","right":"60/(x + 5)"},{"left":"На сколько часов дольше ехал первый","right":"60/x − 60/(x + 5)"}]},{"id":"n21-c-speeds","title":"Собери поездку с заданной разницей","prompt":"Подбери целые скорости двух велосипедистов. Каждый проезжает 60 км; второй едет на 5 км/ч быстрее и тратит на поездку на 1 час меньше. Проверь обе связи одновременно.","type":"build","skillId":"n21-equation","hint":"Одного условия «на 5 быстрее» недостаточно. Времена 60/v₁ и 60/v₂ тоже должны отличаться на 1.","explanation":"Подходят 15 и 20 км/ч: разность скоростей 5, времена 4 и 3 часа. Из 60/v₁ − 60/(v₁ + 5) = 1 получается v₁² + 5v₁ − 300 = 0. Корень −20 не подходит по смыслу, остаётся 15.","fields":[{"name":"slow","label":"Скорость первого, км/ч","min":5,"max":30,"integer":true,"initial":10},{"name":"fast","label":"Скорость второго, км/ч","min":5,"max":35,"integer":true,"initial":15}],"conditions":[{"left":"fast-slow","op":"eq","right":"5"},{"left":"60/slow-60/fast","op":"eq","right":"1"}],"exampleSolution":{"slow":15,"fast":20}},{"id":"n21-c-mixture","title":"Составь смесь по заказу","prompt":"Нужно получить 10 кг раствора с массовой долей соли 19%. Есть растворы 10% и 25%. Подбери, сколько килограммов каждого раствора взять; потерь вещества нет.","type":"build","skillId":"n21-mixture","hint":"Проверь две суммы: общую массу и массу соли. В 10 кг готовой смеси должно быть 1,9 кг соли.","explanation":"Берём 4 кг раствора 10% и 6 кг раствора 25%. Общая масса 10 кг; соли 0,4 + 1,5 = 1,9 кг. Доля 1,9/10 равна 19%.","fields":[{"name":"low","label":"Масса раствора 10%, кг","min":0,"max":10,"initial":5},{"name":"high","label":"Масса раствора 25%, кг","min":0,"max":10,"initial":5}],"conditions":[{"left":"low+high","op":"eq","right":"10"},{"left":"10*low+25*high","op":"eq","right":"190"}],"exampleSolution":{"low":4,"high":6}},{"id":"n21-c-average","title":"Поймай ошибку в средней скорости","prompt":"Автомобиль проехал первые 60 км со скоростью 30 км/ч, следующие 60 км — со скоростью 60 км/ч. Ученик получил среднюю скорость 45 км/ч. Заполни времена участков и найди настоящую среднюю скорость.","type":"build","skillId":"n21-average","hint":"Участки равны по расстоянию, но различаются по времени. Раздели весь путь на всё время.","explanation":"Первый участок занял 2 часа, второй — 1 час. Средняя скорость 120/(2 + 1) = 40 км/ч. Число 45 — среднее арифметическое скоростей; для этих равных расстояний оно не является средней скоростью поездки.","fields":[{"name":"t1","label":"Время первого участка, ч","min":0.1,"max":10,"initial":1},{"name":"t2","label":"Время второго участка, ч","min":0.1,"max":10,"initial":1},{"name":"v","label":"Средняя скорость, км/ч","min":1,"max":100,"initial":45}],"conditions":[{"left":"30*t1","op":"eq","right":"60"},{"left":"60*t2","op":"eq","right":"60"},{"left":"v*(t1+t2)","op":"eq","right":"120"}],"exampleSolution":{"t1":2,"t2":1,"v":40}}],"overviewTaskIds":["n21-q-movement","n21-q-work","n21-q-mixture","n21-q-context"]},{"id":"n22","title":"№22 · Графики и число общих точек","goal":"Короткий вход: ограничение области определения, вершина параболы, граница ветвей и число пересечений. Мастерские помогают изменять параметры и замечать исключения; полный график с обоснованием строится отдельно.","assessment":"written-steps","writtenWorkNote":"Здесь проверяются значения, отдельные свойства графика и выбранные случаи. Полное решение запиши отдельно: самостоятельно построй график, отметь ограничения и обоснуй все значения параметра.","sourceHref":"/trainers/oge-task22-functions-graphs.html","skills":[{"id":"n22-domain","label":"Сохранять исключённые точки графика","requires":["n9-domain","n11-coordinates"],"evidence":"После сокращения дроби исключает запрещённый аргумент и учитывает его при подсчёте общих точек."},{"id":"n22-vertex","label":"Находить вершину и наименьшее значение параболы","requires":["n11-quadratic"],"evidence":"Читает координаты вершины по записи квадрата и проверяет направление ветвей."},{"id":"n22-pieces","label":"Выбирать формулу на границе промежутков","requires":["n11-coordinates","n13-boundaries"],"evidence":"По строгому и нестрогому условиям выбирает нужную ветвь и различает пустую и закрашенную точки."},{"id":"n22-intersections","label":"Разбирать число пересечений по значениям параметра","requires":["n22-vertex","n8-absolute"],"evidence":"Разделяет уравнение с модулем на случаи и не считает совпавшие корни дважды."},{"id":"n22-line","label":"Строить прямую через заданные точки","requires":["n11-linear"],"evidence":"Подбирает k и b, проверяя обе координаты каждой из двух точек."},{"id":"n22-model","label":"Выбирать значение аргумента, различающее две формулы","requires":["n11-coordinates","n8-absolute"],"evidence":"Находит проверку, в которой две заранее заданные формулы дают разные значения, и не обобщает её на произвольную функцию."},{"id":"n22-written","label":"Обосновывать построение графика и все случаи","requires":["n22-domain","n22-pieces","n22-intersections"],"evidence":"В карточках проверяются отдельные значения и случаи. Полнота графика и перебор всех параметров требуют отдельного письменного решения.","separateCheck":false,"relatedTasks":["n22-c-parameter","n22-x-hole","n22-x-intersections"]}],"quick":[{"id":"n22-q-hole","title":"Одна точка исчезла","prompt":"Функция задана формулой y = (x² − 4)/(x − 2). Сколько общих точек имеет её график с прямой y = 4?","type":"number","skillId":"n22-domain","hint":"При x ≠ 2 дробь равна x + 2. Проверь, при каком x прямая y = x + 2 достигает значения 4.","explanation":"Равенство x + 2 = 4 даёт x = 2, но этот аргумент исключён исходным знаменателем. Точка (2; 4) выколота, поэтому общих точек нет.","answer":0,"visual":{"kind":"piecewise","xDomain":[-4,5],"yDomain":[-3,8],"segments":[{"from":-100,"to":2,"expression":"1*x+(2)","leftClosed":false,"rightClosed":false},{"from":2,"to":100,"expression":"1*x+(2)","leftClosed":false,"rightClosed":false}],"ariaLabel":"Прямая y = 1x + (2) с исключённой точкой при x = 2. Пустая точка не принадлежит графику."}},{"id":"n22-q-vertex","title":"Ниже уже не получится","prompt":"Найди наименьшее значение функции y = (x − 1)² − 4.","type":"number","skillId":"n22-vertex","hint":"Квадрат неотрицателен и равен нулю при x = 1.","explanation":"(x − 1)² ≥ 0, значит y ≥ −4. Значение −4 достигается при x = 1; вершина параболы — (1; −4).","answer":-4,"visual":{"kind":"function","family":"quadratic","a":1,"b":-2,"c":-3,"xMin":-3,"xMax":5,"yMin":-5,"yMax":6,"points":[[1,-4]],"ariaLabel":"Парабола y = (x − 1)² − 4, ветви направлены вверх. Отмечена вершина (1; −4)."}},{"id":"n22-q-boundary","title":"Кому достался ноль?","prompt":"Функция задана так: y = x + 2 при x < 0; y = x² − 1 при x ≥ 0. Найди значение функции при x = 0.","type":"number","skillId":"n22-pieces","hint":"Посмотри, какая из двух формул включает равенство x = 0.","explanation
