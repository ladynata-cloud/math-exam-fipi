name: Board fleet — real paired acceptance
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'trainers/**'
      - 'board-server/**'
      - 'tools/board-fleet*'
      - '.github/workflows/board-fleet-acceptance.yml'
permissions:
  contents: read
concurrency:
  group: board-fleet-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fleet:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - name: Planner regression tests and candidate selection
        id: plan
        run: |
          node --check tools/board-fleet-audit.cjs
          node --test tools/board-fleet-plan.test.cjs tools/board-fleet-summary.test.cjs
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            mode="--base $(git rev-parse HEAD^1)"
          else
            mode="--all"
          fi
          echo "FLEET_ARGS=$mode --index ${{ matrix.shard }} --total 6" >> "$GITHUB_ENV"
          count=$(node tools/board-fleet-audit.cjs $mode --index ${{ matrix.shard }} --total 6 --plan)
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - name: Install locked local server and pinned Chromium
        if: steps.plan.outputs.count != '0'
        run: |
          npm ci --prefix board-server --include=optional --no-audit --no-fund
          npm install --prefix "$RUNNER_TEMP/board-fleet" --no-save --no-package-lock --ignore-scripts playwright@1.62.1
          echo "NODE_PATH=$RUNNER_TEMP/board-fleet/node_modules" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/board-fleet/node_modules/.bin/playwright" install --with-deps chromium
      - name: Audit registered mirrors with two real local clients
        env:
          BOARD_FLEET_REPORT_DIR: artifacts/board-fleet
        run: node tools/board-fleet-audit.cjs $FLEET_ARGS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: board-fleet-shard-${{ matrix.shard }}
          path: artifacts/board-fleet
          if-no-files-found: warn
          retention-days: 14
  summary:
    if: always()
    needs: fleet
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: board-fleet-shard-*
          merge-multiple: true
          path: artifacts/board-fleet
      - name: Verify exact candidate and complete coverage
        env:
          BOARD_FLEET_REPORT_DIR: artifacts/board-fleet
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            node tools/board-fleet-summary.cjs --base "$(git rev-parse HEAD^1)" --total 6
          else
            node tools/board-fleet-summary.cjs --all --total 6
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: board-fleet-summary
          path: artifacts/board-fleet/fleet-summary.json
          if-no-files-found: warn
          retention-days: 14
