name: Linear equations — free steps

on:
  pull_request:
    paths:
      - 'trainers/simple-equations-stepwise.html'
      - 'downloads/trainers/simple-equations-stepwise/**'
      - 'tools/equations/**'
      - '.github/workflows/equation-free-steps.yml'
  push:
    branches: [main]
    paths:
      - 'trainers/simple-equations-stepwise.html'
      - 'downloads/trainers/simple-equations-stepwise/**'
      - 'tools/equations/**'
      - '.github/workflows/equation-free-steps.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  free-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Exact mathematics and persistence model
        run: |
          node tools/equations/math.test.cjs
          node tools/equations/dom.test.cjs
      - name: Install pinned browser test dependency
        run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.62.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser layouts, restoration, embedded frame and offline copy
        run: node tools/equations/browser.test.cjs
      - name: Published free-step learning journey
        if: github.event_name == 'push'
        run: node tools/equations/browser.test.cjs --production
      - name: Browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: equation-free-steps-browser
          path: artifacts/equation-free-steps/
          if-no-files-found: warn
          retention-days: 14
