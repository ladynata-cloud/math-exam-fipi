<template id="inscribed-angle-cases">
<section aria-label="Положения центра окружности"><h3>Где находится центр относительно угла?</h3><p>A, B и C — три разные точки окружности. Вершина вписанного угла — C. Найди дугу AB, на которой нет C. Она выделена толстой линией.</p>
<details data-inscribed-case="diameter"><summary>Центр лежит на стороне CB</summary>
<figure style="margin:0.6em 0"><svg viewBox="0 0 244 202" width="244" style="max-width:100%;height:auto;display:block;margin-inline:auto" role="img" aria-label="CB — диаметр, O между C и B. Радиусы OA и OC образуют равнобедренный треугольник." xmlns="http://www.w3.org/2000/svg">
<g fill="none" stroke="#284957" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
<circle cx="122" cy="99" r="73"/>
<path d="M 58.78 62.50 L 122.00 99.00" stroke-dasharray="5 4"/>
<path d="M 58.78 62.50 L 122.00 172.00 L 122.00 26.00" />
<path d="M 58.78 62.50 A 73 73 0 0 1 122.00 26.00" stroke="#a14612" stroke-width="4"/>
</g>
<path d="M 115.50 160.74 A 13 13 0 0 1 122.00 159.00" fill="none" stroke="#2f7182" stroke-width="2"/>
<g fill="#203b47" font-family="sans-serif" font-size="14" text-anchor="middle">
<circle data-point="A" cx="58.78" cy="62.50" r="3"/>
<text x="47.52" y="60.00">A</text>
<circle data-point="B" cx="122.00" cy="26.00" r="3"/>
<text x="122.00" y="17.00">B</text>
<circle data-point="C" cx="122.00" cy="172.00" r="3"/>
<text x="122.00" y="189.00">C</text>
<circle data-point="O" cx="122" cy="99" r="3"/>
<text x="134" y="103">O</text>
</g></svg><figcaption>Жирная дуга AB не содержит C. Соедини A с центром O.</figcaption></figure>
<ol><li>В треугольнике AOC радиусы OA и OC равны. Поэтому ∠OAC = ∠ACO = ∠ACB.</li><li>Луч OB продолжает сторону CO за точку O. Внешний угол AOB равен сумме двух внутренних углов треугольника AOC, значит ∠AOB = 2∠ACB.</li><li>Мера дуги AB равна ∠AOB. Если дуга AB равна 60°, то ∠ACB равен 30°. Если центр лежит на стороне CA, поменяй обозначения A и B.</li></ol></details>
<details data-inscribed-case="inside"><summary>Центр внутри угла ACB</summary>
<figure style="margin:0.6em 0"><svg viewBox="0 0 244 202" width="244" style="max-width:100%;height:auto;display:block;margin-inline:auto" role="img" aria-label="Диаметр CD проходит внутри угла ACB. Большая дуга AB через D выделена." xmlns="http://www.w3.org/2000/svg">
<g fill="none" stroke="#284957" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
<circle cx="122" cy="99" r="73"/>
<path d="M 122.00 172.00 L 122.00 26.00" stroke-dasharray="5 4"/>
<path d="M 58.78 135.50 L 122.00 172.00 L 193.89 111.68" />
<path d="M 58.78 135.50 A 73 73 0 1 1 193.89 111.68" stroke="#a14612" stroke-width="4"/>
</g>
<path d="M 110.74 165.50 A 13 13 0 0 1 131.96 163.64" fill="none" stroke="#2f7182" stroke-width="2"/>
<g fill="#203b47" font-family="sans-serif" font-size="14" text-anchor="middle">
<circle data-point="A" cx="58.78" cy="135.50" r="3"/>
<text x="47.52" y="146.00">A</text>
<circle data-point="B" cx="193.89" cy="111.68" r="3"/>
<text x="206.69" y="117.93">B</text>
<circle data-point="C" cx="122.00" cy="172.00" r="3"/>
<text x="122.00" y="189.00">C</text>
<circle data-point="D" cx="122.00" cy="26.00" r="3"/>
<text x="122.00" y="17.00">D</text>
<circle data-point="O" cx="122" cy="99" r="3"/>
<text x="134" y="103">O</text>
</g></svg><figcaption>Проведи диаметр CD. Луч CD делит угол ACB, а D делит выделенную дугу AB на две части.</figcaption></figure>
<ol><li>У углов ACD и DCB одна сторона лежит на диаметре. Из первого случая ∠ACD равен половине дуги AD без C, а ∠DCB равен половине дуги DB без C.</li><li>Сложи углы. Получится ∠ACB = (дуга AD + дуга DB) / 2. Обе дуги вместе составляют дугу AB без C.</li><li>На схеме дуги равны 120° и 100°. Искомый угол равен 60° + 50° = 110°. Здесь нужна большая дуга AB (220°).</li></ol></details>
<details data-inscribed-case="outside"><summary>Центр вне угла ACB</summary>
<figure style="margin:0.6em 0"><svg viewBox="0 0 244 202" width="244" style="max-width:100%;height:auto;display:block;margin-inline:auto" role="img" aria-label="Лучи CA и CB лежат с одной стороны диаметра CD. Луч CB находится между CA и CD." xmlns="http://www.w3.org/2000/svg">
<g fill="none" stroke="#284957" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
<circle cx="122" cy="99" r="73"/>
<path d="M 122.00 172.00 L 122.00 26.00" stroke-dasharray="5 4"/>
<path d="M 58.78 135.50 L 122.00 172.00 L 75.08 43.08" />
<path d="M 58.78 135.50 A 73 73 0 0 1 75.08 43.08" stroke="#a14612" stroke-width="4"/>
</g>
<path d="M 110.74 165.50 A 13 13 0 0 1 117.55 159.78" fill="none" stroke="#2f7182" stroke-width="2"/>
<g fill="#203b47" font-family="sans-serif" font-size="14" text-anchor="middle">
<circle data-point="A" cx="58.78" cy="135.50" r="3"/>
<text x="47.52" y="146.00">A</text>
<circle data-point="B" cx="75.08" cy="43.08" r="3"/>
<text x="66.72" y="37.12">B</text>
<circle data-point="C" cx="122.00" cy="172.00" r="3"/>
<text x="122.00" y="189.00">C</text>
<circle data-point="D" cx="122.00" cy="26.00" r="3"/>
<text x="122.00" y="17.00">D</text>
<circle data-point="O" cx="122" cy="99" r="3"/>
<text x="134" y="103">O</text>
</g></svg><figcaption>Проведи диаметр CD. Луч CB делит угол ACD. На дуге от D до A сначала встречается B.</figcaption></figure>
<ol><li>По первому случаю ∠ACD равен половине дуги AD без C, а ∠BCD равен половине дуги BD без C.</li><li>Вычти меньший угол из большего. Получится ∠ACB = (дуга AD − дуга BD) / 2. Осталась дуга AB без C.</li><li>На схеме дуги AD и BD равны 120° и 40°. Искомый угол равен 60° − 20° = 40°. При другом порядке лучей можно поменять обозначения A и B.</li></ol></details>
</section></template>
