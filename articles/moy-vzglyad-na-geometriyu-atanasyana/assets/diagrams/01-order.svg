<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" role="img" aria-labelledby="title desc"><title id="title">Положение точки меняет сумму</title><desc id="desc">Два случая с AB=4 и BC=3. В первом B между A и C, AC=7; во втором C между A и B, AC=1.</desc><style>text{font-family:Arial,sans-serif;fill:#213f49;font-size:22px}.label{font-size:23px;font-style:italic}.small{font-size:18px;fill:#617579}.head{font-size:21px;font-weight:700}.line{fill:none;stroke:#213f49;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.teal{fill:none;stroke:#16746b;stroke-width:3;stroke-linecap:round}.red{fill:none;stroke:#bd654c;stroke-width:3;stroke-linecap:round}.gold{fill:none;stroke:#aa7623;stroke-width:3;stroke-linecap:round}.thin{fill:none;stroke:#617579;stroke-width:2}.dashed{stroke-dasharray:7 7}</style><rect width="900" height="370" rx="18" fill="#f5f6ef"/><text class="head" x="45" y="48">B между A и C</text><text class="head" x="480" y="48">C между A и B</text><path class="line" d="M55 150 H405 M495 150 H775"/><path class="teal" d="M55 142 H255 M495 142 H775"/><path class="red" d="M255 157 H405 M565 157 H775"/><circle cx="55" cy="150" r="4" fill="#213f49"/><text class="label" x="48" y="180">A</text><circle cx="255" cy="150" r="4" fill="#213f49"/><text class="label" x="248" y="180">B</text><circle cx="405" cy="150" r="4" fill="#213f49"/><text class="label" x="398" y="180">C</text><circle cx="495" cy="150" r="4" fill="#213f49"/><text class="label" x="488" y="180">A</text><circle cx="565" cy="150" r="4" fill="#213f49"/><text class="label" x="558" y="180">C</text><circle cx="775" cy="150" r="4" fill="#213f49"/><text class="label" x="768" y="180">B</text><text x="145" y="125">4</text><text x="325" y="205">3</text><text x="625" y="125">4</text><text x="663" y="205">3</text><text x="75" y="270">AC = AB + BC = 7</text><text x="500" y="270">AC = AB − BC = 1</text><text class="small" x="45" y="330">Сначала читаем положение точек. Затем выбираем действие.</text></svg>