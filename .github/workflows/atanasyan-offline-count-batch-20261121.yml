name: Independently rebuild five reviewed Atanasyan school archives
on:
  push:
    branches: ['work/atanasyan-five-offline-counts-20261121']
    paths: ['.github/workflows/atanasyan-offline-count-batch-20261121.yml']
permissions:
  contents: write
jobs:
  verify-five-archives:
    if: github.repository == 'ladynata-cloud/math-exam-fipi' && github.ref == 'refs/heads/work/atanasyan-five-offline-counts-20261121'
    runs-on: ubuntu-latest
    timeout-minutes: 27
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out the isolated verification branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/atanasyan-offline-batch-20261121/
            /.github/workflows/atanasyan-offline-count-batch-20261121.yml
            /geometry-course/
            /scripts/
            /tools/public-navigator*
            /tools/atanasyan-harmonization/
            /assets/
            /learning/
            /ege-baza/return-to-course.js
            /downloads/trainers-manifest.json
            /downloads/trainers/geometry-course/
      - name: Rebuild every archive and verify every file before saving five new feature branches
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '2d97f75c2fd3ad6845c65ef0b4762d4d30fd0ffc'
          mkdir -p "$RUNNER_TEMP/verified-atanasyan-batch"
          cp -a .github/atanasyan-offline-batch-20261121/. "$RUNNER_TEMP/verified-atanasyan-batch/"
          python3 "$RUNNER_TEMP/verified-atanasyan-batch/build_verified.py" "$RUNNER_TEMP/verified-atanasyan-batch"
