name: Makarychev 8 course quality
on:
  pull_request:
    paths:
      - 'school/makarychev8/**'
      - 'school/peterson6/math.js'
      - '.github/workflows/makarychev8-quality.yml'
  push:
    branches: [main]
    paths:
      - 'school/makarychev8/**'
      - 'school/peterson6/math.js'
permissions:
  contents: read
jobs:
  worked-solutions:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        partition: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Solve every assigned task and restore its saved steps
        env:
          M8_UI_SHARD_INDEX: ${{ matrix.partition }}
          M8_UI_SHARD_COUNT: ${{ strategy.job-total }}
        run: |
          npm install --prefix "$RUNNER_TEMP/makarychev-dom" --no-audit --no-fund --ignore-scripts jsdom@26.1.0
          NODE_PATH="$RUNNER_TEMP/makarychev-dom/node_modules" node --max-old-space-size=1024 school/makarychev8/test-ui.cjs
  course:
    runs-on: ubuntu-latest
    # Includes the new chapter and every earlier worked solution.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
