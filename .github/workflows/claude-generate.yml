name: PR375 independent release review
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Audit label only; reviewed code is fixed in the script"
        required: false
        default: "PR375 exact-head release review"
        type: string
      output_path:
        description: "Compatibility input; output is always an artifact"
        required: false
        default: "artifacts/pr375-review"
        type: string
permissions:
  contents: read
concurrency:
  group: pr375-independent-review-${{ github.ref }}
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Review exact public source once
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 tools/assistant-release-review.py
      - name: Preserve review provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr375-independent-review
          path: artifacts/pr375-review/
          if-no-files-found: error
          retention-days: 30
