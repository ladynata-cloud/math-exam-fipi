<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img"><title>Как меняется смысл равенства фигур</title><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#2B57C4"/></marker></defs><rect width="1200" height="700" fill="#FCFCF9"/><text x="60" y="58" text-anchor="start" style="font-size:36px;font-weight:700;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="60" dy="0">Как меняется смысл равенства фигур</tspan></text><text x="60" y="94" text-anchor="start" style="font-size:20px;font-weight:400;fill:#5A6B87;font-family:Arial,Segoe UI,sans-serif;"><tspan x="60" dy="0">От действия с бумажной моделью к преобразованию плоскости</tspan></text><rect x="70" y="190" width="235" height="245" rx="20" fill="#DDEFE5" stroke="#D9DFE9" stroke-width="2"/><circle cx="187" cy="245" r="34" fill="#FFFFFF" stroke="#2B57C4" stroke-width="3"/><text x="187" y="255" text-anchor="middle" style="font-size:24px;font-weight:700;fill:#2B57C4;font-family:Arial,Segoe UI,sans-serif;"><tspan x="187" dy="0">1</tspan></text><text x="187" y="315" text-anchor="middle" style="font-size:22px;font-weight:700;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="187" dy="0">Совместить руками</tspan></text><text x="187" y="380" text-anchor="middle" style="font-size:17px;font-weight:400;fill:#5A6B87;font-family:Arial,Segoe UI,sans-serif;"><tspan x="187" dy="0">калька, вырезание,</tspan><tspan x="187" dy="22">перегибание</tspan></text><line x1="308" y1="310" x2="345" y2="310" stroke="#2B57C4" stroke-width="4" marker-end="url(#arrow)"/><rect x="355" y="190" width="235" height="245" rx="20" fill="#DCE7FF" stroke="#D9DFE9" stroke-width="2"/><circle cx="472" cy="245" r="34" fill="#FFFFFF" stroke="#2B57C4" stroke-width="3"/><text x="472" y="255" text-anchor="middle" style="font-size:24px;font-weight:700;fill:#2B57C4;font-family:Arial,Segoe UI,sans-serif;"><tspan x="472" dy="0">2</tspan></text><text x="472" y="315" text-anchor="middle" style="font-size:22px;font-weight:700;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="472" dy="0">Назвать равными</tspan></text><text x="472" y="380" text-anchor="middle" style="font-size:17px;font-weight:400;fill:#5A6B87;font-family:Arial,Segoe UI,sans-serif;"><tspan x="472" dy="0">совпали при наложении</tspan></text><line x1="593" y1="310" x2="630" y2="310" stroke="#2B57C4" stroke-width="4" marker-end="url(#arrow)"/><rect x="640" y="190" width="235" height="245" rx="20" fill="#F7E9C7" stroke="#D9DFE9" stroke-width="2"/><circle cx="757" cy="245" r="34" fill="#FFFFFF" stroke="#2B57C4" stroke-width="3"/><text x="757" y="255" text-anchor="middle" style="font-size:24px;font-weight:700;fill:#2B57C4;font-family:Arial,Segoe UI,sans-serif;"><tspan x="757" dy="0">3</tspan></text><text x="757" y="315" text-anchor="middle" style="font-size:22px;font-weight:700;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="757" dy="0">Выделить свойства</tspan></text><text x="757" y="380" text-anchor="middle" style="font-size:17px;font-weight:400;fill:#5A6B87;font-family:Arial,Segoe UI,sans-serif;"><tspan x="757" dy="0">сохраняются длины,</tspan><tspan x="757" dy="22">углы, порядок точек</tspan></text><line x1="878" y1="310" x2="915" y2="310" stroke="#2B57C4" stroke-width="4" marker-end="url(#arrow)"/><rect x="925" y="190" width="235" height="245" rx="20" fill="#E9E1FA" stroke="#D9DFE9" stroke-width="2"/><circle cx="1042" cy="245" r="34" fill="#FFFFFF" stroke="#2B57C4" stroke-width="3"/><text x="1042" y="255" text-anchor="middle" style="font-size:24px;font-weight:700;fill:#2B57C4;font-family:Arial,Segoe UI,sans-serif;"><tspan x="1042" dy="0">4</tspan></text><text x="1042" y="315" text-anchor="middle" style="font-size:22px;font-weight:700;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="1042" dy="0">Определить через</tspan><tspan x="1042" dy="26">движение</tspan></text><text x="1042" y="380" text-anchor="middle" style="font-size:17px;font-weight:400;fill:#5A6B87;font-family:Arial,Segoe UI,sans-serif;"><tspan x="1042" dy="0">существует движение,</tspan><tspan x="1042" dy="22">переводящее одну</tspan><tspan x="1042" dy="22">фигуру в другую</tspan></text><rect x="200" y="500" width="800" height="95" rx="16" fill="#FFFFFF" stroke="#C24A4A" stroke-width="3"/><text x="600" y="538" text-anchor="middle" style="font-size:23px;font-weight:700;fill:#C24A4A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="600" dy="0">Логический долг допустим, если он назван и погашен</tspan></text><text x="600" y="572" text-anchor="middle" style="font-size:18px;font-weight:400;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="600" dy="0">опасно не позднее уточнение, а незаметная смена основания</tspan></text><text x="1162" y="676" text-anchor="end" style="font-size:16px;font-weight:400;fill:#5A6B87;font-family:Arial,Segoe UI,sans-serif;"><tspan x="1162" dy="0">Схема: Н. М. Алябьева · MathExam</tspan></text></svg>