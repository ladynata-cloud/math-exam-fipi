<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc"><title id="title">Три разных отрезка</title><desc id="desc">Из вершины A проведены медиана AM к середине BC, биссектриса AD и высота AH. Их основания H, D и M различны.</desc><style>text{font-family:Arial,sans-serif;fill:#213f49;font-size:22px}.label{font-size:23px;font-style:italic}.small{font-size:18px;fill:#617579}.head{font-size:21px;font-weight:700}.line{fill:none;stroke:#213f49;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.teal{fill:none;stroke:#16746b;stroke-width:3;stroke-linecap:round}.red{fill:none;stroke:#bd654c;stroke-width:3;stroke-linecap:round}.gold{fill:none;stroke:#aa7623;stroke-width:3;stroke-linecap:round}.thin{fill:none;stroke:#617579;stroke-width:2}.dashed{stroke-dasharray:7 7}</style><rect width="900" height="500" rx="18" fill="#f5f6ef"/><text class="head" x="42" y="45">В разностороннем треугольнике условия различаются</text><path class="line" d="M250 95 L90 350 L770 350 Z"/><path class="teal" d="M250 95 L430.0 350"/><path class="red" d="M250 95 L322.57 350"/><path class="gold" d="M250 95 L250 350"/><path class="gold" d="M250 331 H269 V350"/><circle cx="250" cy="95" r="4" fill="#213f49"/><text class="label" x="243" y="83">A</text><circle cx="90" cy="350" r="4" fill="#213f49"/><text class="label" x="83" y="380">B</text><circle cx="770" cy="350" r="4" fill="#213f49"/><text class="label" x="763" y="380">C</text><circle cx="430.0" cy="350" r="4" fill="#213f49"/><text class="label" x="423.0" y="380">M</text><circle cx="322.5691905250585" cy="350" r="4" fill="#213f49"/><text class="label" x="315.5691905250585" y="380">D</text><circle cx="250" cy="350" r="4" fill="#213f49"/><text class="label" x="243" y="380">H</text><path class="teal" d="M260.0 343.0 L260.0 357.0"/><path class="teal" d="M600.0 343.0 L600.0 357.0"/><text x="45" y="423" style="fill:#16746b">AM — медиана</text><text x="325" y="423" style="fill:#bd654c">AD — биссектриса</text><text x="670" y="423" style="fill:#aa7623">AH — высота</text><text class="small" x="45" y="462">BM = MC</text><text class="small" x="325" y="462">∠BAD = ∠DAC</text><text class="small" x="670" y="462">AH ⟂ BC</text></svg>