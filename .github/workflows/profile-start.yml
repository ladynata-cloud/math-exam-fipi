name: Profile 2027 — learning start
on:
  pull_request:
    paths: ['ege-profil/start/**', 'ege-profil/atanasyan-10-11/**', 'stereo-course/**', 'tools/atanasyan-profile15*', 'ege-profil/learning/**', 'ege-profil/lesson/**', 'ege-profil/homework/**', 'ege-profil/trigonometry/**', 'ege-profil/index.html', 'tools/profile-*', 'trainers/ege-profile/inequalities/**', 'trainers/ege-profile/log-inequalities/guided-lesson.js', 'trainers/board-picker-data.json', '.github/workflows/profile-start.yml']
  push:
    branches: [main]
    paths: ['ege-profil/start/**', 'ege-profil/atanasyan-10-11/**', 'stereo-course/**', 'tools/atanasyan-profile15*', 'ege-profil/learning/**', 'ege-profil/lesson/**', 'ege-profil/homework/**', 'ege-profil/trigonometry/**', 'ege-profil/index.html', 'tools/profile-*', 'trainers/ege-profile/inequalities/**', 'trainers/ege-profile/log-inequalities/guided-lesson.js', '.github/workflows/profile-start.yml']
permissions:
  contents: read
concurrency:
  group: profile-start-${{ github.ref }}
  cancel-in-progress: true
jobs:
  math-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.62.1 jsdom@26.1.0
      - run: npx playwright install --with-deps chromium
      - name: Mathematics and state
        run: node tools/profile-route.test.cjs && node tools/profile-start.test.cjs && node tools/profile-geometry.test.cjs && node tools/profile-algebra.test.cjs && node tools/profile-stereo.test.cjs && node tools/profile-planimetry-models.test.cjs && node tools/profile-vector-models.test.cjs && node tools/profile-number-input.test.cjs && node tools/profile-input-ui.test.cjs
      - name: Real browser and board
        run: node tools/profile-route.browser.cjs && node tools/profile-start.browser.cjs && node tools/profile-first-three.browser.cjs && node tools/board-picker-smoke.cjs
      - name: Full first part and inequality mathematics
        run: node tools/profile-full-course.test.cjs && node --test tools/profile-probability.test.cjs tools/profile-equations.test.cjs tools/profile-functions.test.cjs tools/profile-applied.test.cjs && node tools/profile-part2-inequalities.test.cjs
      - name: Full first part and inequality learner journeys
        run: node tools/profile-full-course.browser.cjs && node tools/profile-part2-inequalities.browser.cjs
      - name: Atanasyan stereometry course
        run: node --test tools/atanasyan-profile15-a.test.cjs tools/atanasyan-profile15-b.test.cjs && node tools/atanasyan-profile15.test.cjs && node tools/atanasyan-profile15-model.test.cjs && node tools/atanasyan-profile15.browser.cjs
      - name: Existing profile regression
        run: npm --prefix ege-profil test
