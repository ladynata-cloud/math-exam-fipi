<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img"><title>Дедуктивный договор учебника</title><rect width="1200" height="700" fill="#FCFCF9"/><text x="60" y="58" text-anchor="start" style="font-size:36px;font-weight:700;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="60" dy="0">Дедуктивный договор учебника</tspan></text><text x="60" y="94" text-anchor="start" style="font-size:20px;font-weight:400;fill:#5A6B87;font-family:Arial,Segoe UI,sans-serif;"><tspan x="60" dy="0">Какую роль играет каждая строка доказательства?</tspan></text><rect x="90" y="215" width="170" height="190" rx="18" fill="#DDEFE5" stroke="#D9DFE9" stroke-width="2"/><text x="175" y="265" text-anchor="middle" style="font-size:23px;font-weight:700;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="175" dy="0">Наблюдение</tspan></text><text x="175" y="330" text-anchor="middle" style="font-size:17px;font-weight:400;fill:#5A6B87;font-family:Arial,Segoe UI,sans-serif;"><tspan x="175" dy="0">подсказывает идею</tspan></text><rect x="320" y="215" width="170" height="190" rx="18" fill="#DCE7FF" stroke="#D9DFE9" stroke-width="2"/><text x="405" y="265" text-anchor="middle" style="font-size:23px;font-weight:700;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="405" dy="0">Определение</tspan></text><text x="405" y="330" text-anchor="middle" style="font-size:17px;font-weight:400;fill:#5A6B87;font-family:Arial,Segoe UI,sans-serif;"><tspan x="405" dy="0">задаёт смысл слова</tspan></text><rect x="550" y="215" width="170" height="190" rx="18" fill="#F7E9C7" stroke="#D9DFE9" stroke-width="2"/><text x="635" y="265" text-anchor="middle" style="font-size:23px;font-weight:700;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="635" dy="0">Аксиома</tspan></text><text x="635" y="330" text-anchor="middle" style="font-size:17px;font-weight:400;fill:#5A6B87;font-family:Arial,Segoe UI,sans-serif;"><tspan x="635" dy="0">фиксирует исходное</tspan><tspan x="635" dy="21">правило</tspan></text><rect x="780" y="215" width="170" height="190" rx="18" fill="#E9E1FA" stroke="#D9DFE9" stroke-width="2"/><text x="865" y="265" text-anchor="middle" style="font-size:23px;font-weight:700;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="865" dy="0">Теорема</tspan></text><text x="865" y="330" text-anchor="middle" style="font-size:17px;font-weight:400;fill:#5A6B87;font-family:Arial,Segoe UI,sans-serif;"><tspan x="865" dy="0">доказанное</tspan><tspan x="865" dy="21">утверждение</tspan></text><rect x="1010" y="215" width="170" height="190" rx="18" fill="#F1DFE0" stroke="#D9DFE9" stroke-width="2"/><text x="1095" y="265" text-anchor="middle" style="font-size:23px;font-weight:700;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="1095" dy="0">Доказательство</tspan></text><text x="1095" y="330" text-anchor="middle" style="font-size:17px;font-weight:400;fill:#5A6B87;font-family:Arial,Segoe UI,sans-serif;"><tspan x="1095" dy="0">обосновывает</tspan><tspan x="1095" dy="21">каждый шаг</tspan></text><rect x="180" y="485" width="840" height="100" rx="16" fill="#FFFFFF" stroke="#C24A4A" stroke-width="3"/><text x="600" y="522" text-anchor="middle" style="font-size:24px;font-weight:700;fill:#C24A4A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="600" dy="0">Почему вертикальные углы равны?</tspan></text><text x="600" y="559" text-anchor="middle" style="font-size:19px;font-weight:400;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="600" dy="0">Каждый из них в сумме с одним и тем же смежным углом даёт 180°.</tspan></text><text x="1162" y="676" text-anchor="end" style="font-size:16px;font-weight:400;fill:#5A6B87;font-family:Arial,Segoe UI,sans-serif;"><tspan x="1162" dy="0">Схема: Н. М. Алябьева · MathExam</tspan></text></svg>