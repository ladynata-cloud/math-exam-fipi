name: OGE 1–5 interactive discoveries

on:
  pull_request:
    paths:
      - 'trainers/oge-1-5-trainers/**'
      - 'tools/oge-practical-*.cjs'
      - '.github/workflows/oge-practical-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oge-practical-discovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eight-storylines:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - name: Install isolated browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/practical-browser" --no-save --no-package-lock --ignore-scripts jsdom@26.1.0 playwright@1.62.1
          "$RUNNER_TEMP/practical-browser/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/practical-browser/node_modules" >> "$GITHUB_ENV"
      - name: Original engine snapshots and every discovery prototype
        run: |
          node --test tools/oge-practical-*.test.cjs
          node tools/oge-check-links.mjs
          git diff --check
      - name: Retained original routes on mobile and desktop
        env:
          PRACTICAL_SCREENSHOT_DIR: artifacts/oge-practical-discovery/original-routes
        run: node tools/oge-practical-minimal.browser.cjs
      - name: All eight storylines and nested laboratories
        env:
          PRACTICAL_DISCOVERY_ARTIFACTS: artifacts/oge-practical-discovery/new-method
        run: node tools/oge-practical-discovery.browser.cjs
      - name: Save coverage and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oge-practical-discovery
          path: artifacts/oge-practical-discovery
          if-no-files-found: ignore
          retention-days: 7
