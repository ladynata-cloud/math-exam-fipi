<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Глава IV — вопросы для самопроверки · редакторский просмотр</title>
  <link rel="stylesheet" href="../../stereo-course/assets/task-scenes.css">
  <link rel="stylesheet" href="preview.css">
</head>
<body>
  <main>
    <header><p class="notice">Черновик для проверки. В курс ещё не опубликован.</p></header>
    <label for="lesson">Вопрос к главе IV</label>
    <select id="lesson" aria-describedby="source"></select>
    <p id="source" class="small"></p>
    <section id="problem" aria-labelledby="title">
      <h1 id="title">Загрузка карточек…</h1>
      <p id="condition"></p>
      <div id="model" class="task-scene"></div>
      <p id="goal"></p>
      <label for="work">Моё рассуждение</label>
      <textarea id="work" aria-describedby="ephemeral"></textarea>
      <p id="ephemeral" class="small">В этом просмотре запись сохраняется только до перезагрузки страницы.</p>
      <details id="help"><summary>Хочешь подсказку?</summary><div id="hints"></div></details>
      <div id="steps"></div>
      <button id="next" type="button">Разобрать по шагам</button>
    </section>
  </main>
  <script src="../../stereo-course/assets/math-text.js"></script>
  <script src="../../stereo-course/assets/task-scene-viewer.js"></script>
  <script src="preview.js"></script>
</body>
</html>
