header.top{

  <!-- everything is rendered by JS -->

<script type="text/plain" id="formula-legacy-source">
/* ═══════════════════════════════════════════════════════════════════
   1. MATH RENDERING HELPERS
   Tiny inline-math renderer — no LaTeX, just styled HTML.
   Token colors are reused EVERYWHERE for consistency.
   ═══════════════════════════════════════════════════════════════════ */

const v = x => `<em class="var">${x}</em>`;                       // italic variable
const fn = x => `<span style="font-style:normal;font-family:var(--body);font-weight:600">${x}</span>`;  // sin / cos
const frac = (num, den) =>
  `<span class="fr"><span class="num">${num}</span><span class="den">${den}</span></span>`;

// half-sum (α+β)/2 — ALWAYS gold
const hSum = (a='α', b='β') =>
  `<span class="tok-gold">${frac(`${v(a)}+${v(b)}`, '2')}</span>`;

// half-diff (α−β)/2 — ALWAYS blue
const hDiff = (a='α', b='β') =>
  `<span class="tok-blue">${frac(`${v(a)}−${v(b)}`, '2')}</span>`;

// rust-coloured minus
const rMinus = '<span class="tok-rust">−</span>';
const rMinusPill = '<span class="tok-rust-pill">−</span>';

// strike-through cancelling term — leaf green
const cancel = s => `<span class="tok-leaf">${s}</span>`;

/* ═══════════════════════════════════════════════════════════════════
   2. THE FOUR FORMULAS — quick reference
   ═══════════════════════════════════════════════════════════════════ */

const FORMULAS = {
  ssum:  `${fn('sin')} ${v('α')} + ${fn('sin')} ${v('β')} = 2 · ${fn('sin')} ${hSum()} · ${fn('cos')} ${hDiff()}`,
  sdiff: `${fn('sin')} ${v('α')} − ${fn('sin')} ${v('β')} = 2 · ${fn('cos')} ${hSum()} · ${fn('sin')} ${hDiff()}`,
  csum:  `${fn('cos')} ${v('α')} + ${fn('cos')} ${v('β')} = 2 · ${fn('cos')} ${hSum()} · ${fn('cos')} ${hDiff()}`,
  cdiff: `${fn('cos')} ${v('α')} ${rMinusPill} ${fn('cos')} ${v('β')} = ${rMinusPill} 2 · ${fn('sin')} ${hSum()} · ${fn('sin')} ${hDiff()}`
};

const LESSONS_META = [
  {id:'ssum',  num:1, title:'Сумма синусов',     lhs:`${fn('sin')} ${v('α')} + ${fn('sin')} ${v('β')}`},
  {id:'sdiff', num:2, title:'Разность синусов',  lhs:`${fn('sin')} ${v('α')} − ${fn('sin')} ${v('β')}`},
  {id:'csum',  num:3, title:'Сумма косинусов',   lhs:`${fn('cos')} ${v('α')} + ${fn('cos')} ${v('β')}`},
  {id:'cdiff', num:4, title:'Разность косинусов',lhs:`${fn('cos')} ${v('α')} ${rMinus} ${fn('cos')} ${v('β')}`}
];

/* ═══════════════════════════════════════════════════════════════════
   3. PQ MINI-INTRO  — "Почему p и q?"
   ═══════════════════════════════════════════════════════════════════ */

const PQ_INTRO = {
  steps:[
    {
      prompt:`Введём обозначения: ${hSum()} назовём <strong>p</strong>, ${hDiff()} назовём <strong>q</strong>.<br>Чему равно <strong>p + q</strong>?`,
      choices:[
        {body:`${v('α')}`,                  correct:true,  feedback:`Да! Дроби сложились — двойки в знаменателе сократились с 2 в числителе.`},
        {body:`${v('β')}`,                  correct:false, feedback:`Это будет p − q, а не p + q.`},
        {body:`${v('α')}+${v('β')}`,        correct:false, feedback:`Не забывай: у каждой дроби в знаменателе стоит 2.`},
        {body:`${v('α')}−${v('β')}`,        correct:false, feedback:`Складываем, а не вычитаем.`}
      ]
    },
    {
      prompt:`Теперь чему равно <strong>p − q</strong>?`,
      choices:[
        {body:`${v('β')}`,                  correct:true,  feedback:`Точно. ${v('α')} сократилось, осталось ${v('β')}.`},
        {body:`${v('α')}`,                  correct:false, feedback:`Это было p + q.`},
        {body:`${v('α')}−${v('β')}`,        correct:false, feedback:`Знаменатели 2 ещё не учтены.`},
        {body:`${v('α')}+${v('β')}`,        correct:false, feedback:`Это сумма, а нужна разность.`}
      ]
    }
  ],
  outro:`<strong>Вот зачем нужна замена.</strong> ${v('α')} превращается в <strong>p+q</strong>, ${v('β')} превращается в <strong>p−q</strong>. Теперь можно раскрывать ${fn('sin')}(p+q) и ${fn('sin')}(p−q) по формулам сложения, которые ты уже знаешь.`
};

/* ═══════════════════════════════════════════════════════════════════
   4. LESSON STEPS — derivations as interactive sequences.

   Each step has a `type`:
     - "info"      : just shows a line of math, user clicks "Дальше"
     - "choice"    : 3-4 options, pick one
     - "construct" : tile-bank — click tiles in the right order
     - "final"     : shows the resulting formula prominently

   For "construct":
     answer    — exact sequence of tile texts the user must build
     pool      — all tiles shown in the bank (includes distractors)
   ═══════════════════════════════════════════════════════════════════ */

// reusable tile sets
const SIN_BANK = ['sin p cos q', 'cos p sin q', 'sin p sin q', 'cos p cos q', '+', '−'];
const COS_BANK = ['cos p cos q', 'sin p sin q', 'sin p cos q', 'cos p sin q', '+', '−'];

const LESSONS = {

  /* ─────────────  sin α + sin β  ───────────── */
  ssum:{
    title:`${fn('sin')} ${v('α')} + ${fn('sin')} ${v('β')} → произведение`,
    goal:`Превратить сумму ${fn('sin')} ${v('α')} + ${fn('sin')} ${v('β')} в произведение.`,
    steps:[
      { type:'info',
        label:'Замена переменных',
        html:`Вводим <strong>p = ${hSum()}</strong>, <strong>q = ${hDiff()}</strong>.<br>Тогда ${v('α')} = p + q, ${v('β')} = p − q.`},
      { type:'info',
        label:'Подстановка',
        html:`${fn('sin')} ${v('α')} + ${fn('sin')} ${v('β')} = ${fn('sin')}(p+q) + ${fn('sin')}(p−q)`},
      { type:'construct',
        label:'Раскрываем sin(p+q) по формуле синуса суммы',
        target:`${fn('sin')}(p+q) =`,
        pool:SIN_BANK,
        answer:['sin p cos q','+','cos p sin q'],
        hint:`Формула: sin(p+q) = sin p · cos q + cos p · sin q.`},
      { type:'construct',
        label:'Раскрываем sin(p−q) по формуле синуса разности',
        target:`${fn('sin')}(p−q) =`,
        pool:SIN_BANK,
        answer:['sin p cos q','−','cos p sin q'],
        hint:`Формула: sin(p−q) = sin p · cos q − cos p · sin q. Меняется только знак.`},
      { type:'info',
        label:'Складываем',
        html:`${fn('sin')}(p+q) + ${fn('sin')}(p−q) = (sin p cos q + cos p sin q) + (sin p cos q − cos p sin q)`},
      { type:'choice',
        label:'Что сократится при сложении?',
        prompt:`После раскрытия скобок какие слагаемые сократятся?`,
        choices:[
          {body:`${cancel('cos p sin q')} и ${cancel('− cos p sin q')}`, correct:true,
           feedback:`Верно. Они отличаются только знаком — в сумме дают 0.`},
          {body:`sin p cos q и sin p cos q`, correct:false,
           feedback:`Эти два одинаковые — они <strong>удваиваются</strong>, а не сокращаются.`},
          {body:`Ничего не сократится`, correct:false,
           feedback:`Посмотри внимательно: cos p sin q стоит с плюсом, и cos p sin q — с минусом.`}
        ]},
      { type:'info',
        label:'Получаем',
        html:`= 2 · sin p · cos q`},
      { type:'info',
        label:'Возвращаемся к α и β',
        html:`Подставляем обратно: p = ${hSum()}, q = ${hDiff()}.`},
      { type:'final',
        formulaId:'ssum'}
    ]
  },

  /* ─────────────  sin α − sin β  ───────────── */
  sdiff:{
    title:`${fn('sin')} ${v('α')} − ${fn('sin')} ${v('β')} → произведение`,
    goal:`Превратить разность ${fn('sin')} ${v('α')} − ${fn('sin')} ${v('β')} в произведение.`,
    steps:[
      { type:'info',
        label:'Та же замена',
        html:`Снова берём <strong>p = ${hSum()}</strong>, <strong>q = ${hDiff()}</strong>. Тогда ${v('α')} = p + q, ${v('β')} = p − q.`},
      { type:'info',
        label:'Подстановка',
        html:`${fn('sin')} ${v('α')} − ${fn('sin')} ${v('β')} = ${fn('sin')}(p+q) − ${fn('sin')}(p−q)`},
      { type:'info',
        label:'Раскрываем обе скобки',
        html:`= (sin p cos q + cos p sin q) − (sin p cos q − cos p sin q)`},
      { type:'construct',
        label:'Раскрываем минус перед второй скобкой',
        target:`= sin p cos q + cos p sin q`,
        pool:SIN_BANK,
        answer:['−','sin p cos q','+','cos p sin q'],
        hint:`Минус перед скобкой меняет <strong>каждый</strong> знак внутри: −(sin p cos q − cos p sin q) = − sin p cos q + cos p sin q.`},
      { type:'choice',
        label:'Что теперь сократится?',
        prompt:`Какие слагаемые исчезают?`,
        choices:[
          {body:`${cancel('sin p cos q')} и ${cancel('− sin p cos q')}`, correct:true,
           feedback:`Да. Теперь сокращаются sin p cos q, а cos p sin q удваивается.`},
          {body:`cos p sin q и cos p sin q`, correct:false,
           feedback:`Они оба с плюсом — это удвоение, не сокращение.`},
          {body:`Сократится sin p и cos q`, correct:false,
           feedback:`Сокращаются только целые слагаемые, а не их части.`}
        ]},
      { type:'info',
        label:'Получаем',
        html:`= 2 · cos p · sin q`},
      { type:'final',
        formulaId:'sdiff'}
    ]
  },

  /* ─────────────  cos α + cos β  ───────────── */
  csum:{
    title:`${fn('cos')} ${v('α')} + ${fn('cos')} ${v('β')} → произведение`,
    goal:`Превратить сумму ${fn('cos')} ${v('α')} + ${fn('cos')} ${v('β')} в произведение.`,
    steps:[
      { type:'info',
        label:'Замена',
        html:`<strong>p = ${hSum()}</strong>, <strong>q = ${hDiff()}</strong>, и ${fn('cos')} ${v('α')} + ${fn('cos')} ${v('β')} = ${fn('cos')}(p+q) + ${fn('cos')}(p−q).`},
      { type:'construct',
        label:'Раскрываем cos(p+q)',
        target:`${fn('cos')}(p+q) =`,
        pool:COS_BANK,
        answer:['cos p cos q','−','sin p sin q'],
        hint:`У косинуса суммы — <em>минус</em>: cos(p+q) = cos p cos q − sin p sin q.`},
      { type:'construct',
        label:'Раскрываем cos(p−q)',
        target:`${fn('cos')}(p−q) =`,
        pool:COS_BANK,
        answer:['cos p cos q','+','sin p sin q'],
        hint:`А у косинуса разности — <em>плюс</em>: cos(p−q) = cos p cos q + sin p sin q.`},
      { type:'choice',
        label:'Складываем и смотрим, что сократится',
        prompt:`cos(p+q) + cos(p−q) = (cos p cos q − sin p sin q) + (cos p cos q + sin p sin q). Что сократится?`,
        choices:[
          {body:`${cancel('− sin p sin q')} и ${cancel('+ sin p sin q')}`, correct:true,
           feedback:`Да! Они противоположны по знаку — в сумме 0.`},
          {body:`cos p cos q и cos p cos q`, correct:false,
           feedback:`Они оба с плюсом — удваиваются.`},
          {body:`Минус и плюс между скобками`, correct:false,
           feedback:`Сокращаются слагаемые, а не отдельные знаки.`}
        ]},
      { type:'info',
        label:'Получаем',
        html:`= 2 · cos p · cos q`},
      { type:'final',
        formulaId:'csum'}
    ]
  },

  /* ─────────────  cos α − cos β  ───────────── */
  cdiff:{
    title:`${fn('cos')} ${v('α')} ${rMinus} ${fn('cos')} ${v('β')} → произведение`,
    goal:`Превратить разность ${fn('cos')} ${v('α')} ${rMinus} ${fn('cos')} ${v('β')} в произведение. <span class="tok-rust">Внимание: здесь появится минус перед всей формулой!</span>`,
    steps:[
      { type:'info',
        label:'Замена',
        html:`${fn('cos')} ${v('α')} ${rMinus} ${fn('cos')} ${v('β')} = ${fn('cos')}(p+q) ${rMinus} ${fn('cos')}(p−q).`},
      { type:'info',
        label:'Раскрываем обе скобки',
        html:`= (cos p cos q − sin p sin q) ${rMinus} (cos p cos q + sin p sin q)`},
      { type:'construct',
        label:'Раскрываем минус перед второй скобкой — БУДЬ ВНИМАТЕЛЕН со знаками',
        target:`= cos p cos q − sin p sin q`,
        pool:['cos p cos q', 'sin p sin q', 'sin p cos q', 'cos p sin q', '+', '−', '−'],
        answer:['−','cos p cos q','−','sin p sin q'],
        hint:`Минус меняет каждый знак: −(cos p cos q + sin p sin q) = − cos p cos q − sin p sin q. У второго слагаемого знак тоже меняется!`},
      { type:'choice',
        label:'Что сократится?',
        prompt:`Имеем: cos p cos q − sin p sin q − cos p cos q − sin p sin q. Что сокращается?`,
        choices:[
          {body:`${cancel('cos p cos q')} и ${cancel('− cos p cos q')}`, correct:true,
           feedback:`Точно. Они дают 0, остаются −sin p sin q − sin p sin q = −2 sin p sin q.`},
          {body:`Оба − sin p sin q`, correct:false,
           feedback:`Они одинаковые по знаку — складываются, дают <strong>−2</strong> sin p sin q.`},
          {body:`Ничего, минусы между ними мешают`, correct:false,
           feedback:`Минусы как раз помогают увидеть: cos p cos q с плюсом и cos p cos q с минусом сокращаются.`}
        ]},
      { type:'info',
        label:'Получаем (с минусом!)',
        html:`= ${rMinusPill} 2 · sin p · sin q`},
      { type:'final',
        formulaId:'cdiff'}
    ]
  }
};

/* ═══════════════════════════════════════════════════════════════════
   5. ASSEMBLIES — quick "build the right side" without derivation.
   For each formula: show LHS, give tile pool, user assembles RHS.
   ═══════════════════════════════════════════════════════════════════ */

const RHS_BANK = [
  '2', 'sin', 'cos',
  hSum(), hDiff(),
  '·', rMinusPill
];

const ASSEMBLIES = {
  ssum:  { lhs:`${fn('sin')} ${v('α')} + ${fn('sin')} ${v('β')} =`,
           answer:['2','·','sin', hSum(), '·','cos', hDiff()] },
  sdiff: { lhs:`${fn('sin')} ${v('α')} − ${fn('sin')} ${v('β')} =`,
           answer:['2','·','cos', hSum(), '·','sin', hDiff()] },
  csum:  { lhs:`${fn('cos')} ${v('α')} + ${fn('cos')} ${v('β')} =`,
           answer:['2','·','cos', hSum(), '·','cos', hDiff()] },
  cdiff: { lhs:`${fn('cos')} ${v('α')} ${rMinus} ${fn('cos')} ${v('β')} =`,
           answer:[rMinusPill,'2','·','sin', hSum(), '·','sin', hDiff()] }
};

/* ═══════════════════════════════════════════════════════════════════
   6. PRODUCT EXAMPLES — apply formula to specific α, β.

const PRODUCTS = {

     question:`Преобразовать ${fn('sin')} 75° + ${fn('sin')} 15°.`,

  ]
};

   8. FINAL TEST — 5 random tasks at the very end
   ═══════════════════════════════════════════════════════════════════ */

function buildFinalTest(){
  if (typeof state !== 'undefined' && state) state.testHelped = false;
  const pool = [];
  // 2 assembly tasks (any 2 of the 4 formulas)
  const aIds = shuffle(Object.keys(ASSEMBLIES)).slice(0,2);
  aIds.forEach(id => pool.push({kind:'assembly', id}));
  // 2 "choose the right formula" tasks
  const cIds = shuffle(Object.keys(FORMULAS)).slice(0,2);
  cIds.forEach(id => pool.push({kind:'pick', id}));
  // 1 trap
  pool.push({kind:'trap', id:shuffle(TRAPS)[0].id});
  return pool;
}
function shuffle(a){
  const x = a.slice();
  for(let i=x.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [x[i],x[j]]=[x[j],x[i]];
  }
  return x;
}

var state = loadState();

function loadState(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return JSON.parse(JSON.stringify(DEFAULT_STATE));
    const parsed = JSON.parse(raw);
    // gentle merge — keeps backward compatibility
    return Object.assign(JSON.parse(JSON.stringify(DEFAULT_STATE)), parsed, {
      progress: Object.assign({}, DEFAULT_STATE.progress, parsed.progress||{})
    });
  }catch(e){
    return JSON.parse(JSON.stringify(DEFAULT_STATE));
  }
}
function saveState(){
  try{
    const latest = JSON.parse(localStorage.getItem(LS_KEY) || '{}');
    const next = Object.assign({}, latest, state);
    // An older open derivation must not overwrite work saved by the alphabet.
    if(latest && Object.prototype.hasOwnProperty.call(latest, 'alphabet')) next.alphabet = latest.alphabet;
    localStorage.setItem(LS_KEY, JSON.stringify(next));
    if(next.alphabet) state.alphabet = next.alphabet;
  }catch(e){}
}
function resetProgress(){
  if(!confirm('Сбросить прогресс только прежних четырёх выводов? Азбука формул сохранится.')) return;
  const alphabet = state.alphabet;
  state = JSON.parse(JSON.stringify(DEFAULT_STATE));
  if(alphabet) state.alphabet = alphabet;
  saveState();
  render();
}

/** innerHTML doesn't execute injected <script> tags — we re-create them here. */
function runScripts(root){
  root.querySelectorAll('script').forEach(old=>{
    const s = document.createElement('script');
    if(old.src) s.src = old.src;
    s.textContent = old.src ? old.textContent : '(function(){\n' + old.textContent + '\n})();';
    old.parentNode.replaceChild(s, old);
  });
}

// Each rendered screen owns its pending transitions; navigation cancels them.
let renderVersion = 0;
const viewTimers = new Set();
function scheduleView(fn, delay){
  const version = renderVersion;
  const timer = window.setTimeout(()=>{
    viewTimers.delete(timer);
    if(version === renderVersion) fn();
  }, delay);
  viewTimers.add(timer);
  return timer;
}
function lockChoices(selector){
  document.querySelectorAll(selector).forEach(b=>{ b.disabled=true; b.classList.add('locked'); });
}
function unlockChoices(selector){
  document.querySelectorAll(selector).forEach(b=>{ b.disabled=false; b.classList.remove('locked','wrong'); });
}
function render(){
  viewTimers.forEach(timer=>window.clearTimeout(timer));
  viewTimers.clear();
  renderVersion++;

  // teacher mode always overrides view
  if(state.mode==='teacher'){
    renderShell(renderTeacher());
    saveState();
    return;
  }

  const views = {
    onboarding: renderOnboarding,
    pqIntro:    renderPQIntro,
    lesson:     renderLesson,
    assemblyHub:renderAssemblyHub,
    traps:      renderTraps,
    finalTest:  renderFinalTest,
    done:       renderDone
  };
  const fn = views[state.view] || renderOnboarding;
  renderShell(fn());
  saveState();
}

        <div class="step-n">${ix+1}</div>

          <div class="step-label">${step.label}</div>
          <div class="math big">${step.html}</div>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn" onclick="state.stepIx++;render()">Дальше →</button>
        ${ix>0?'<button class="btn ghost" onclick="state.stepIx--;render()">← Назад</button>':''}
      </div>
    `;
  }

  if(step.type==='final'){
    return `
      <div class="card" style="background:#fff;border-color:var(--gold-line);text-align:center;padding:32px 20px">
        <div class="onb-eyebrow" style="color:var(--gold)">Финальная формула</div>
        <div class="math huge" style="margin-top:12px">${FORMULAS[meta.id]}</div>
      </div>
      <div class="btn-row">
        <button class="btn gold" onclick="state.stepIx++;render()">Завершить вывод →</button>
      </div>
    `;
  }

  if(step.type==='choice'){
    return `
      <div class="math big" style="margin-bottom:12px">${step.prompt}</div>
      <div class="choices" id="lc-${ix}">
        ${step.choices.map((c,i)=>`
          <button class="choice" data-i="${i}">
            <span class="marker">${'ABCD'[i]}</span>
            <span class="body math">${c.body}</span>
          </button>`).join('')}
      </div>
      <div id="lc-fb-${ix}" style="margin-top:14px"></div>
      <script>
        const ch = ${JSON.stringify(step.choices)};
        document.querySelectorAll('#lc-${ix} .choice').forEach(b=>{
          b.addEventListener('click',()=>{
            if(b.disabled)return;
            const i=+b.dataset.i;
            const c=ch[i];
            lockChoices('#lc-${ix} .choice');
            b.classList.add(c.correct?'correct':'wrong');
            const fb=document.getElementById('lc-fb-${ix}');
            if(c.correct){
              fb.innerHTML='<div class="note leaf">'+c.feedback+'</div>';
              scheduleView(()=>{state.stepIx++;render();}, 1300);
            } else {
              state.errors++;
              fb.innerHTML='<div class="note rust">'+c.feedback+' Попробуй ещё.</div>';
              scheduleView(()=>{
                unlockChoices('#lc-${ix} .choice');
              }, 1500);
            }
          });
        });
      <\/script>
    `;
  }

  if(step.type==='construct'){
    return renderConstructor(step, ix);
  }
}

/* ── 13b. CONSTRUCTOR — click-to-place tiles ── */
function renderConstructor(step, ix){
  // unique poolIds (in case a tile name repeats, but we use position-indexed clicks)
  const poolHtml = step.pool.map((t,i)=>
    `<button class="tile ${['+','−'].includes(t)?'op':''}" data-pi="${i}" data-t="${escapeHtml(t)}">${t}</button>`
  ).join('');

  return `
    <div class="math big" style="margin-bottom:10px">${step.target}</div>

    <div class="onb-eyebrow" style="margin-bottom:6px">Собери выражение →</div>
    <div class="slots" id="slots-${ix}">
      <span class="placeholder">кликай по плитке снизу...</span>
    </div>

    <div class="onb-eyebrow" style="margin:14px 0 6px">Доступные блоки</div>
    <div class="bank" id="bank-${ix}">${poolHtml}</div>

    <div class="constructor-status" id="status-${ix}"></div>

    <div class="btn-row">
      <button class="btn" id="check-${ix}">Проверить</button>
      <button class="btn ghost" id="clear-${ix}">Очистить</button>
      <button class="btn ghost" id="hint-${ix}">Подсказка</button>
      ${ix>0?'<button class="btn ghost" onclick="state.stepIx--;render()">← Назад</button>':''}
    </div>
    <div id="hint-box-${ix}" style="margin-top:10px"></div>

    <script>
      (function(){
        const answer = ${JSON.stringify(step.answer)};
        const placed = []; // array of {pi, text}
        const slots  = document.getElementById('slots-${ix}');
        const bank   = document.getElementById('bank-${ix}');
        const status = document.getElementById('status-${ix}');
        let submitted = false;

        function repaintSlots(){
          if(placed.length===0){
            slots.innerHTML = '<span class="placeholder">кликай по плитке снизу...</span>';
            return;
          }
          slots.innerHTML = placed.map((p,idx)=>
            '<button class="tile '+((['+','−'].includes(p.text))?'op':'')+'" data-idx="'+idx+'">'+p.text+'</button>'
          ).join('');
          slots.querySelectorAll('button').forEach(b=>{
            b.addEventListener('click',()=>{
            if(b.disabled)return;
              const idx=+b.dataset.idx;
              const rem=placed.splice(idx,1)[0];
              bank.querySelector('[data-pi="'+rem.pi+'"]').classList.remove('placed');
              repaintSlots();
              status.className='constructor-status';
              status.textContent='';
            });
          });
        }

        bank.querySelectorAll('.tile').forEach(b=>{
          b.addEventListener('click',()=>{
            if(b.disabled)return;
            if(b.classList.contains('placed')) return;
            b.classList.add('placed');
            placed.push({pi:+b.dataset.pi, text:b.dataset.t});
            repaintSlots();
          });
        });

        document.getElementById('check-${ix}').onclick = ()=>{
          if(submitted)return;
          const got = placed.map(p=>p.text);
          if(got.length===answer.length && got.every((x,i)=>x===answer[i])){
            status.className='constructor-status ok';
            status.innerHTML = '<strong>Верно.</strong> Идём дальше.';
            submitted=true; document.getElementById('check-${ix}').disabled=true;
            scheduleView(()=>{ state.stepIx++; render(); }, 1200);
          } else if(got.length===0){
            status.className='constructor-status bad';
            status.textContent='Поле пустое — сначала собери выражение из блоков.';
          } else {
            state.errors++;
            status.className='constructor-status bad';
            status.innerHTML = '<strong>Пока не то.</strong> Проверь порядок и знаки. Подсказка → ниже.';
          }
        };
        document.getElementById('clear-${ix}').onclick = ()=>{
          placed.length=0;
          bank.querySelectorAll('.tile').forEach(x=>x.classList.remove('placed'));
          repaintSlots();
          status.className='constructor-status';status.textContent='';
        };
        document.getElementById('hint-${ix}').onclick = ()=>{
          state.hintsUsed++;
          document.getElementById('hint-box-${ix}').innerHTML =
            '<div class="note">'+${JSON.stringify(step.hint||'Вспомни формулы синуса/косинуса суммы и разности.')}+'</div>';
        };
      })();
    <\/script>
  `;
}

function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

/* ── 13c. Assembly inside a lesson ── */
function renderAssemblyOne(lessonId){
  return renderAssemblyWidget(lessonId, 'lesson');
}

function handleAssemblyDone(lessonId, mode){
  state.progress[lessonId].assemble = true;
  if(mode==='lesson'){
    state.section='product'; state.productIx=0;
    render();
  } else {
    // hub mode — advance to next quick-assembly
    scheduleView(()=>{ state.assemblyIx++; render(); }, 1100);
  }
}

function renderAssemblyWidget(lessonId, mode){
  const a = ASSEMBLIES[lessonId];

  // shuffled pool with distractors
  const correctSet = a.answer;
  const distractor = {
    ssum: [rMinusPill, hSum(), hDiff(), '2', 'sin'],
    sdiff:[rMinusPill, hSum(), hDiff(), '2', 'cos'],
    csum: [rMinusPill, hSum(), hDiff(), '2'],
    cdiff:[hSum(), hDiff(), '2', 'cos']
  }[lessonId];

  const pool = shuffle([...correctSet, ...distractor]);

  return `
    <div class="math big" style="margin-top:14px">${a.lhs}</div>
    <div class="onb-eyebrow" style="margin:12px 0 6px">Собери правую часть</div>
    <div class="slots" id="asm-slots">
      <span class="placeholder">собирай по порядку...</span>
    </div>
    <div class="onb-eyebrow" style="margin:14px 0 6px">Блоки</div>
    <div class="bank" id="asm-bank">
      ${pool.map((t,i)=>`<button class="tile" data-pi="${i}" data-t="${escapeHtml(t)}">${t}</button>`).join('')}
    </div>
    <div class="constructor-status" id="asm-status"></div>
    <div class="btn-row">
      <button class="btn" id="asm-check">Проверить</button>
      <button class="btn ghost" id="asm-clear">Очистить</button>
      <button class="btn ghost" id="asm-hint">Подсказка</button>
    </div>
    <div id="asm-hint-box" style="margin-top:10px"></div>

    <script>
      (function(){
        const answer = ${JSON.stringify(correctSet)};
        const lessonId = ${JSON.stringify(lessonId)};
        const mode = ${JSON.stringify(mode)};
        const placed = [];
        const slots  = document.getElementById('asm-slots');
        const bank   = document.getElementById('asm-bank');
        const status = document.getElementById('asm-status');
        let submitted = false;
        function repaint(){
          if(!placed.length){ slots.innerHTML='<span class="placeholder">собирай по порядку...</span>'; return; }
          slots.innerHTML = placed.map((p,idx)=>'<button class="tile" data-idx="'+idx+'">'+p.text+'</button>').join('');
          slots.querySelectorAll('button').forEach(b=>{
            b.addEventListener('click',()=>{
            if(b.disabled)return;
              const idx=+b.dataset.idx;
              const rem=placed.splice(idx,1)[0];
              bank.querySelector('[data-pi="'+rem.pi+'"]').classList.remove('placed');
              repaint();status.className='constructor-status';status.textContent='';
            });
          });
        }
        bank.querySelectorAll('.tile').forEach(b=>{
          b.addEventListener('click',()=>{
            if(b.disabled)return;
            if(b.classList.contains('placed'))return;
            b.classList.add('placed');
            placed.push({pi:+b.dataset.pi, text:b.dataset.t});
            repaint();
          });
        });
        document.getElementById('asm-check').onclick=()=>{
          if(submitted)return;
          const got = placed.map(p=>p.text);
          if(got.length===answer.length && got.every((x,i)=>x===answer[i])){
            status.className='constructor-status ok';
            status.innerHTML = '<strong>Точно.</strong> Формула собрана.';
            submitted=true; document.getElementById('asm-check').disabled=true;
            window.handleAssemblyDone(lessonId, mode);
          } else {
            state.errors++;
            status.className='constructor-status bad';
            status.innerHTML = 'Пока не то. Проверь, какие функции стоят при полусумме и полуразности, и не забыт ли коэффициент 2.';
          }
        };
        document.getElementById('asm-clear').onclick=()=>{
          placed.length=0;
          bank.querySelectorAll('.tile').forEach(x=>x.classList.remove('placed'));
          repaint();status.className='constructor-status';status.textContent='';
        };
        document.getElementById('asm-hint').onclick=()=>{
          state.hintsUsed++;
          const FORMULAS_MAP = ${JSON.stringify(FORMULAS)};
          document.getElementById('asm-hint-box').innerHTML =
            '<div class="note">Правильно так: ' + FORMULAS_MAP[lessonId] + '</div>';
        };
      })();
    <\/script>
  `;
}

/* ── 13d. Product application (one example) ── */
function renderProductOne(lessonId){
  const list = PRODUCTS[lessonId];
  const ix = Math.min(state.productIx, list.length-1);
  const p  = list[ix];

  return `
    <div class="math big" style="margin-top:14px">${p.question}</div>

    <div class="split" style="margin-top:14px">
      <div class="card" style="background:#fff;padding:18px">
        <div class="onb-eyebrow">Подставляем</div>
        <div class="math" style="margin-top:8px">
          ${hSum(p.a, p.b)} = <strong>${p.halfSum}</strong><br>
          ${hDiff(p.a, p.b)} = <strong>${p.halfDiff}</strong>
        </div>
      </div>
      <div class="card" style="background:var(--paper);padding:18px">
        <div class="onb-eyebrow" style="color:var(--gold)">Получаем</div>
        <div class="math big" style="margin-top:8px">${p.answer}</div>
      </div>
    </div>

    <div class="btn-row">
      ${list.length>1 && ix<list.length-1
        ? '<button class="btn" onclick="state.productIx++;render()">Следующий пример →</button>'
        : `<button class="btn gold" onclick="finishLesson('${lessonId}')">Урок ${LESSONS_META.find(l=>l.id===lessonId).num} завершён ✓</button>`}
      <button class="btn ghost" onclick="state.section='derive';state.stepIx=0;render()">↻ К выводу</button>
    </div>

}

function finishLesson(lessonId){
  state.progress[lessonId].product = true;
  // pick next lesson or go to mix/test
  const order = ['ssum','sdiff','csum','cdiff'];
  const idx = order.indexOf(lessonId);
  if(idx < order.length-1){
    state.lesson = order[idx+1]; state.section='derive'; state.stepIx=0;
  } else {
    // all 4 lessons done — go to final test prompt
    state.view='finalTest'; state.test = buildFinalTest(); state.testIx=0; state.testAnswers=[];
  }
  render();
}

      <div class="onb-eyebrow" style="margin-top:18px">Что не так?</div>

          <button class="choice" data-i="${i}">

/* ═══════════════════════════════════════════════════════════════════
   16. VIEW: FINAL TEST
   ═══════════════════════════════════════════════════════════════════ */

function renderFinalTest(){
  if(!state.test){ state.test = buildFinalTest(); state.testIx=0; state.testAnswers=[]; }
  const ix = state.testIx;
  const total = state.test.length;

  if(ix >= total){
    const correct = state.testAnswers.filter(Boolean).length;
    const pct = Math.round(correct/total*100);
    if(state.testHelped) state.progress.testAssistedBest = Math.max(state.progress.testAssistedBest || 0, correct);
    else state.progress.testBest = Math.max(state.progress.testBest, correct);
    return `
      <section class="card" style="text-align:center;padding:34px 24px">
        <div class="onb-eyebrow" style="color:var(--leaf)">Готово</div>
        <h2 style="font-family:var(--display);font-size:30px;margin:8px 0 18px">Финальный тест: ${correct} / ${total}</h2>
        ${state.testHelped ? '<p class="sub">Решено с помощью. Самостоятельный рекорд сохранён; для новой попытки начни тест заново.</p>' : ''}
        <div class="score-ring" style="--p:${pct}"><span>${pct}%</span></div>
        <p class="sub" style="margin-top:18px">${correct===total
          ? 'Готово: можно переходить к применению формул в задачах.'
          : correct>=3
            ? 'Хорошая база. Перед задачами ещё раз пробеги «Ловушки» и слабый урок.'
            : 'Стоит вернуться к выводу — пройди один урок ещё раз с самого начала.'}</p>
        <div class="btn-row" style="justify-content:center">
          <button class="btn" onclick="state.test=buildFinalTest();state.testIx=0;state.testAnswers=[];render()">Пройти тест заново</button>
          <button class="btn ghost" onclick="state.mode='learn';state.view='onboarding';render()">На главную</button>
        </div>
      </section>`;
  }

  const q = state.test[ix];
  let body = '';

  if(q.kind==='pick'){
    // show "X = ?" and 4 options (1 correct, 3 distractors from other formulas)
    const correctTxt = FORMULAS[q.id];
    const wrong = Object.keys(FORMULAS).filter(k=>k!==q.id).map(k=>FORMULAS[k]);
    const opts = shuffle([correctTxt, ...wrong]).slice(0,4);
    if(!opts.includes(correctTxt)) opts[0]=correctTxt;
    const correctIx = opts.indexOf(correctTxt);
    const lhs = LESSONS_META.find(l=>l.id===q.id).lhs;
    body = `
      <div class="math big">Выбери верную формулу для:</div>
      <div class="math huge" style="margin:14px 0 18px;text-align:center">${lhs}</div>
      <div class="choices" id="ft-c">
        ${opts.map((o,i)=>`
          <button class="choice" data-i="${i}">
            <span class="marker">${'ABCD'[i]}</span>
            <span class="body math" style="font-size:15px">${o}</span>
          </button>`).join('')}
      </div>
      <script>
        const ci = ${correctIx};
        document.querySelectorAll('#ft-c .choice').forEach(b=>{
          b.addEventListener('click',()=>{
            if(b.disabled)return;
            const i=+b.dataset.i;
            lockChoices('#ft-c .choice');
            const ok = i===ci;
            b.classList.add(ok?'correct':'wrong');
            state.testAnswers.push(ok); state.testIx++; saveState();
            scheduleView(render, 1300);
          });
        });
      <\/script>
    `;
  }
  else if(q.kind==='assembly'){
    // mini assembly with auto-next
    const a = ASSEMBLIES[q.id];
    const lhs = a.lhs;
    const correctSet = a.answer;
    const distractor = [rMinusPill, hSum(), hDiff(), '2', 'sin', 'cos'].filter(x=>!correctSet.includes(x));
    const pool = shuffle([...correctSet, ...distractor]);
    body = `
      <div class="math big">Собери правую часть:</div>
      <div class="math big" style="margin:8px 0 14px">${lhs}</div>
      <div class="slots" id="ft-slots"><span class="placeholder">собирай по порядку...</span></div>
      <div class="onb-eyebrow" style="margin:14px 0 6px">Блоки</div>
      <div class="bank" id="ft-bank">
        ${pool.map((t,i)=>`<button class="tile" data-pi="${i}" data-t="${escapeHtml(t)}">${t}</button>`).join('')}
      </div>
      <div class="constructor-status" id="ft-status"></div>
      <div class="btn-row">
        <button class="btn" id="ft-check">Ответить</button>
        <button class="btn ghost" id="ft-clear">Очистить</button>
      </div>
      <script>
        (function(){
          const answer=${JSON.stringify(correctSet)};
          const placed=[];
          const slots=document.getElementById('ft-slots');
          const bank=document.getElementById('ft-bank');
          const status=document.getElementById('ft-status');
          let submitted=false;
          function repaint(){
            if(!placed.length){slots.innerHTML='<span class="placeholder">собирай по порядку...</span>';return;}
            slots.innerHTML = placed.map((p,idx)=>'<button class="tile" data-idx="'+idx+'">'+p.text+'</button>').join('');
            slots.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
            if(b.disabled)return;
              const idx=+b.dataset.idx;
              const rem=placed.splice(idx,1)[0];
              bank.querySelector('[data-pi="'+rem.pi+'"]').classList.remove('placed');
              repaint();
            }));
          }
          bank.querySelectorAll('.tile').forEach(b=>b.addEventListener('click',()=>{
            if(b.disabled)return;
            if(b.classList.contains('placed'))return;
            b.classList.add('placed');
            placed.push({pi:+b.dataset.pi,text:b.dataset.t});repaint();
          }));
          document.getElementById('ft-check').onclick=()=>{
            if(submitted)return;
            submitted=true; document.getElementById('ft-check').disabled=true;
            const got=placed.map(p=>p.text);
            const ok = got.length===answer.length && got.every((x,i)=>x===answer[i]);
            status.className='constructor-status '+(ok?'ok':'bad');
            status.innerHTML = ok ? '<strong>Верно.</strong>' : '<strong>Ответ принят.</strong> После теста можно вернуться к сборке формулы.';
            state.testAnswers.push(ok); state.testIx++; saveState();
            scheduleView(render, 1300);
          };
          document.getElementById('ft-clear').onclick=()=>{
            placed.length=0;
            bank.querySelectorAll('.tile').forEach(x=>x.classList.remove('placed'));
            repaint();
          };
        })();
      <\/script>
    `;
  }
  else if(q.kind==='trap'){
    const t = TRAPS.find(x=>x.id===q.id);
    body = `
      <div class="math big">Найди ошибку в записи:</div>
      <div class="card" style="background:var(--rust-bg);border-color:var(--rust-line);margin:12px 0">
        <div class="math big">${t.wrong}</div>
      </div>
      <div class="choices" id="ft-tc">
        ${t.options.map((o,i)=>`
          <button class="choice" data-i="${i}">
            <span class="marker">${'ABC'[i]}</span>
            <span class="body" style="font-family:var(--body);font-weight:500;font-size:15px">${o}</span>
          </button>`).join('')}
      </div>
      <script>
        const ci = ${t.correct};
        document.querySelectorAll('#ft-tc .choice').forEach(b=>{
          b.addEventListener('click',()=>{
            if(b.disabled)return;
            const i=+b.dataset.i;
            lockChoices('#ft-tc .choice');
            const ok=i===ci;
            b.classList.add(ok?'correct':'wrong');
            state.testAnswers.push(ok); state.testIx++; saveState();
            scheduleView(render, 1400);
          });
        });
      <\/script>
    `;
  }

  return `
    <section class="card">
      <div class="flex-between">
        <div>
          <div class="onb-eyebrow" style="color:var(--rust)">Финальный тест · ${ix+1} / ${total}</div>
          <h2 style="font-family:var(--display);font-size:22px;margin:4px 0 0">${q.kind==='assembly'?'Сборка':q.kind==='pick'?'Выбор формулы':'Ловушка'}</h2>
        </div>
        <div class="muted" style="font-size:13px">подсказки отключены</div>
      </div>
      <div style="margin-top:18px">${body}</div>
    </section>
  `;
}

  function guideView() {

  }
  function equationBridge() { return `<aside class="fa-bridge"><h2>Готов к следующему шагу</h2><p>Формулы помогли подготовить уравнение. Теперь можно решать его и отбирать корни в основном курсе.</p><a class="fa-button fa-primary" href="trigonometry.html?topic=equations">К тригонометрическим уравнениям →</a><a class="fa-button" href="../part-two/">К задачам второй части</a></aside>`; }

  function circle(a, b) {
    const cx = 200, cy = 165, r = 108, rad = a * Math.PI / 180;
    const x = cx + r * Math.cos(rad), y = cy - r * Math.sin(rad);
    const second = b === undefined ? null : { x: cx + r * Math.cos(b * Math.PI / 180), y: cy - r * Math.sin(b * Math.PI / 180) };

      ${second ? `<line x1="200" y1="165" x2="${second.x}" y2="${second.y}" stroke="#bb7945" stroke-width="3" stroke-dasharray="6 5"/><circle cx="${second.x}" cy="${second.y}" r="5" fill="#bb7945"/>` : ''}<path d="M${x} ${cy}V${y}H${cx}" fill="none" stroke="#64a6aa" stroke-width="1.5" stroke-dasharray="5 5"/><line x1="200" y1="165" x2="${x}" y2="${y}" stroke="#087f83" stroke-width="3.5"/><line x1="200" y1="165" x2="${x}" y2="165" stroke="#e29b50" stroke-width="5"/><line x1="200" y1="165" x2="200" y2="${y}" stroke="#087f83" stroke-width="5"/><circle cx="${x}" cy="${y}" r="6" fill="#087f83" stroke="#fff" stroke-width="2"/><text x="${x + (x > 280 ? -13 : 13)}" y="${y - 12}" text-anchor="${x > 280 ? 'end' : 'start'}" class="fa-svg-label">P</text></svg>`;
  }
  const num = x => Math.abs(x) < 0.00005 ? '0' : x.toFixed(3).replace(/\.?0+$/, '');
  function readings(kind, a, b) {
    const rad = x => x * Math.PI / 180, sin = x => Math.sin(rad(x)), cos = x => Math.cos(rad(x));
    if (kind === 'radians') return [`${a}° = ${num(a / 180)}π рад`, '180° = π рад; 360° = 2π рад'];
    if (kind === 'identity') return [`cos² ${a}° + sin² ${a}° = ${num(cos(a)**2 + sin(a)**2)}`, 'Сумма квадратов координат сохраняется.'];
    if (kind === 'parity') return [`sin(−${a}°) = ${num(sin(-a))}; sin ${a}° = ${num(sin(a))}`, `cos(−${a}°) = cos ${a}° = ${num(cos(a))}`];
    if (kind === 'reduction') return [`sin(${a}° + 90°) = ${num(sin(a+90))}`, `cos ${a}° = ${num(cos(a))}`];
    if (kind === 'nonadditive') return [`sin(${a}° + ${b}°) = ${num(sin(a+b))}`, `sin ${a}° + sin ${b}° = ${num(sin(a)+sin(b))}`];
    if (kind === 'addition') return [`sin(${a}° + ${b}°) = ${num(sin(a+b))}`, `sin α cos β + cos α sin β = ${num(sin(a)*cos(b)+cos(a)*sin(b))}`, `cos(α + β) = cos α cos β − sin α sin β = ${num(cos(a+b))}`];
    if (kind === 'double') return [`sin(2 · ${a}°) = ${num(sin(2*a))}`, `2 sin ${a}° cos ${a}° = ${num(2*sin(a)*cos(a))}`];
    if (kind === 'cosdouble') return [`cos(2 · ${a}°) = ${num(cos(2*a))}`, `cos² α − sin² α = ${num(cos(a)**2-sin(a)**2)}`, `1 − 2 sin² α = ${num(1-2*sin(a)**2)}; 2 cos² α − 1 = ${num(2*cos(a)**2-1)}`];
    if (kind === 'halfsum') return [`p = (α + β)/2 = ${(a+b)/2}°; q = (α − β)/2 = ${(a-b)/2}°`, `p + q = ${a}°; p − q = ${b}°`, `sin α + sin β = ${num(sin(a)+sin(b))}; 2 sin p cos q = ${num(2*sin((a+b)/2)*cos((a-b)/2))}`];
    if (kind === 'cosdifference') return [`cos α − cos β = ${num(cos(a)-cos(b))}`, `−2 sin((α+β)/2) sin((α−β)/2) = ${num(-2*sin((a+b)/2)*sin((a-b)/2))}`, `2 sin((α+β)/2) sin((β−α)/2) = ${num(2*sin((a+b)/2)*sin((b-a)/2))}`];
    if (kind === 'domain') return [`(1 − cos 2α) / sin α: ${Math.abs(sin(a)) < 1e-10 ? 'не определено' : num((1-cos(2*a))/sin(a))}`, `2 sin α = ${num(2*sin(a))}`, 'У исходной дроби: sin α ≠ 0.'];
    return [`cos ${a}° = ${num(cos(a))} — координата по горизонтали`, `sin ${a}° = ${num(sin(a))} — координата по вертикали`];
  }
  function comparisonAngle(kind, a, b) {
    if (['nonadditive','addition','halfsum','cosdifference'].includes(kind)) return a + b;
    if (kind === 'parity') return -a;
    if (kind === 'reduction') return a + 90;
    if (kind === 'double' || kind === 'cosdouble') return 2 * a;
    return undefined;
  }
  function labView() {
    const l = (D.investigations || []).find(l => l.id === store.state.view.investigationId); if (!l) return home();
    const two = ['nonadditive','addition','halfsum','cosdifference'].includes(l.kind);
    const sceneAngle = l.kind === 'domain' ? labState.a : labState.a;
    const second = comparisonAngle(l.kind, labState.a, labState.b);
    return `<p class="fa-kicker">Исследование · сначала твой прогноз</p><h1>${esc(l.title)}</h1><p class="fa-lead">${esc(l.question)}</p><div class="fa-prediction">${l.predictions.map((label,i) => button(esc(label),'predict',`data-prediction="${i}" aria-pressed="${labState.prediction === i}"`, labState.prediction === i ? 'fa-primary' : '')).join('')}</div>
      ${labState.prediction === null ? '<p class="fa-note">Выбери предположение. Потом проверим его на модели.</p>' : `<section class="fa-lab-model"><div>${circle(sceneAngle,second)}<p class="fa-small">Зелёный луч: α.${second !== undefined ? ' Пунктир: второй угол для сравнения.' : ''} Оси имеют одинаковый масштаб.</p></div><div><label class="fa-slider-label">Угол α <strong id="fa-angle-a">${labState.a}°</strong><input type="range" id="fa-angle-slider-a" min="-180" max="360" step="15" value="${labState.a}"></label>${two ? `<label class="fa-slider-label">Угол β <strong id="fa-angle-b">${labState.b}°</strong><input type="range" id="fa-angle-slider-b" min="-180" max="360" step="15" value="${labState.b}"></label>` : ''}<p class="fa-note">${esc(l.instruction)}</p><div class="fa-readings">${readings(l.kind,labState.a,labState.b).map(s => `<p>${math(s)}</p>`).join('')}</div>${button('Проверить вывод', 'observe', '', 'fa-primary')}</div></section>`}
      ${labState.observed ? `<section class="fa-conclusion"><h2>Какой вывод выдержал проверку?</h2>${l.conclusions.map((text,i) => button(math(text),'conclude',`data-conclusion="${i}"`)).join('')}<p role="status" class="fa-feedback ${labState.feedback.startsWith('Верно') ? 'ok' : ''}">${esc(labState.feedback)}</p>${store.state.investigations[l.id] ? `<p>${esc(l.explanation)}</p><p class="fa-small">Числовой опыт помогает заметить связь; общая формула требует вывода.</p>${button('К умениям темы', 'module', `data-module="${store.state.view.moduleId || l.modules[0]}"`, 'fa-primary')}` : ''}</section>` : ''}`;
  }
  function render(focus) {
    const previous = document.activeElement;
    const owned = previous && host.contains(previous);
    const identity = !focus && owned ? { id: previous.id, tag: previous.tagName, data: { ...previous.dataset }, name: previous.getAttribute('name'), value: previous.value, details: previous.tagName === 'SUMMARY' ? previous.parentElement.id : null } : null;
    const views = { home, map: mapView, module: moduleView, study: studyView, task: taskView, review: reviewView, reference: referenceView, teacher: teacherView, guide: guideView, lab: labView, 'diagnostic-result': diagnosticResult };
    const fresh = store.ensureCurrent();
    const draft = store.current(store.state.view.taskId)?.draft || ui.answer || '';
    const conflict = `<h1>Продолжить с актуальными данными</h1><p>В другой вкладке уже сохранена работа. Обнови эту страницу, чтобы продолжить обучение и открыть помощь с сохранением её отметки.</p>${draft ? `<label class="fa-input-label" for="fa-conflict-draft">Твоя последняя запись — её можно скопировать перед обновлением</label><input class="fa-answer" id="fa-conflict-draft" readonly value="${esc(draft)}">` : ''}<div class="fa-actions">${button('Обновить страницу','reload','','fa-primary')}</div>`;
    const content = fresh ? (views[store.state.view.screen] || home)() : conflict;
    host.innerHTML = shell(store.ensureCurrent() ? content : conflict);
    host.querySelectorAll('[data-action]').forEach(el => el.addEventListener('click', () => action(el)));
    bindTask(); bindLab();
    if (identity) {
      const target = [...host.querySelectorAll('button,input,summary,a,[tabindex]')].find(node => {
        if (node.disabled || node.tagName !== identity.tag) return false;
        if (identity.id) return node.id === identity.id;
        if (identity.details) return node.parentElement.id === identity.details;
        if (identity.name) return node.getAttribute('name') === identity.name && node.value === identity.value;
        return Object.keys(identity.data).length > 0 && Object.entries(identity.data).every(([key,value]) => node.dataset[key] === value);
      });
      (target || host.querySelector('#fa-content'))?.focus({ preventScroll:true });
    }
    if (focus) { const h = host.querySelector('#fa-content'); h.focus({ preventScroll: true }); host.scrollIntoView({ block: 'start', behavior: 'instant' }); }
  }
  function bindTask() {
    const t = tasks.get(store.state.view.taskId);
    const form = host.querySelector('#fa-task-form'); if (!form || !t) return;
    const a = store.current(t.id);
    const input = host.querySelector('#fa-answer');
    if (input) input.addEventListener('input', () => { ui.answer = input.value; a.draft = input.value.slice(0,350); store.persist(); });
    host.querySelectorAll('input[name="fa-answer"]').forEach(el => el.addEventListener('change', () => { ui.answer = el.value; a.draft = el.value; store.persist(); }));
    host.querySelectorAll('[data-token]').forEach(el => el.addEventListener('click', () => { if(a.closed || ui.blocks.length >= 80) return; ui.blocks.push(el.dataset.token); ui.answer = ui.blocks.join(' '); a.draft = ui.answer; a.blocks = ui.blocks.slice(); store.persist(); render(false); host.querySelector('[data-token]')?.focus(); }));
    host.querySelectorAll('[data-remove]').forEach(el => el.addEventListener('click', () => { if(a.closed) return; ui.blocks.splice(Number(el.dataset.remove),1); ui.answer = ui.blocks.join(' '); a.draft = ui.answer; a.blocks = ui.blocks.slice(); store.persist(); render(false); host.querySelector('[data-token]')?.focus(); }));
    host.querySelectorAll('[data-insert]').forEach(el => el.addEventListener('click', () => { if (!input || a.closed) return; const pos = input.selectionStart || 0; input.setRangeText(el.dataset.insert, pos, input.selectionEnd || pos, 'end'); ui.answer = input.value; a.draft = input.value; store.persist(); input.focus(); }));
    const reference = host.querySelector('#fa-task-reference');
    reference?.querySelector('summary')?.addEventListener('click', e => {
      if (!reference.open) {
        store.help(t.id);
        if (!store.ensureCurrent()) { e.preventDefault(); render(false); }
      }
    });
    reference?.addEventListener('toggle', e => {
      if (e.target.open) {
        store.help(t.id);
        if (!store.ensureCurrent()) { e.target.open = false; render(false); return; }
        const b = host.querySelector('.fa-task-heading .fa-badge');
        if (b && !a.closed) b.textContent = 'Справка открыта · текущая попытка с помощью';
      }
    });
    form.addEventListener('submit', e => {
      e.preventDefault();
      const raw = t.kind === 'choice' ? host.querySelector('input[name="fa-answer"]:checked')?.value || '' : t.kind === 'assemble' ? ui.blocks.length ? ui.blocks.join(' ') : a.draft || '' : input?.value || '';
      const result = store.submit(t.id, raw, t);
      ui.feedback = result.status === 'conflict' ? 'В другой вкладке уже сохранена работа. Обнови эту страницу, чтобы продолжить с актуальной попыткой. Этот ответ не засчитан.' : result.status === 'format' ? 'Проверь запись: заполни ответ и закрой скобки. Эта отправка не считается математической ошибкой.' : result.status === 'form' ? 'Выражение равносильно ответу. Теперь выполни действие из условия: запиши требуемую форму и упрости аргументы. Математической ошибки здесь нет.' : result.status === 'wrong' ? 'Пока не сходится. Проверь знак, функцию и весь аргумент. Можно исправить запись или попросить подсказку.' : feedbackLabels[result.status];
      ui.feedbackType = result.status === 'wrong' ? 'wrong' : ['format','form','conflict'].includes(result.status) ? 'format' : 'ok';
      render(false); host.querySelector('.fa-feedback')?.scrollIntoView({ block:'nearest' });
      if (!result.correct) (host.querySelector('#fa-answer') || host.querySelector('input[name="fa-answer"]:checked') || host.querySelector('[data-token]'))?.focus(); else host.querySelector('[data-action="next"]')?.focus();
    });
  }
  function bindLab() {
    for (const name of ['a','b']) host.querySelector('#fa-angle-slider-' + name)?.addEventListener('input', e => {
      const value = Number(e.target.value); labState[name] = value; labState.observed = false; labState.feedback = '';
      if (!store.ensureCurrent()) return render(false);
      const lab = D.investigations.find(item => item.id === store.state.view.investigationId);
      if (!lab) return;
      // Keep the actual range input mounted during dragging and key repeats.
      const label = host.querySelector('#fa-angle-' + name); if (label) label.textContent = value + '°';
      const figure = host.querySelector('.fa-lab-model svg');
      if (figure) figure.outerHTML = circle(labState.a, comparisonAngle(lab.kind,labState.a,labState.b));
      const panel = host.querySelector('.fa-readings');
      if (panel) panel.innerHTML = readings(lab.kind,labState.a,labState.b).map(s => `<p>${math(s)}</p>`).join('');
      host.querySelector('.fa-conclusion')?.remove();
    });
  }
  function action(el) {
    const v = store.state.view, act = el.dataset.action;
    if (act === 'reload') return location.reload();
    if (act === 'home') return go('home');
    if (act === 'map') return go('map', { route: '' });
    if (act === 'module') return go('module', { moduleId: el.dataset.module });
    if (act === 'route') return el.dataset.route === 'review' ? go('review', { route:'review' }) : go('map', { route:el.dataset.route });
    if (act === 'study') return go('study', { skillId:el.dataset.skill });
    if (act === 'practice') return startTask(el.dataset.skill);
    if (act === 'diagnostic') return go('task', { taskId:diagnostic[0], route:'diagnostic' });
    if (act === 'next') return nextTask();
    if (act === 'skip') return nextTask(true);
    if (act === 'review-skill') return startTask(el.dataset.skill, undefined, 'review');
    if (['review','reference','teacher','guide'].includes(act)) return go(act, act === 'review' ? { route:'review' } : {});
    if (act === 'hint' || act === 'solution') { store.help(v.taskId); ui[act] = true; render(false); return; }
    if (act === 'undo' || act === 'clear') { const a = store.current(v.taskId); if (a?.closed) return; if (act === 'undo') ui.blocks.pop(); else ui.blocks = []; ui.answer = ui.blocks.join(' '); if (a) { a.draft = ui.answer; a.blocks = ui.blocks.slice(); } store.persist(); render(false); host.querySelector('[data-action="'+act+'"]')?.focus(); return; }
    if (act === 'print') return window.print();
    if (act === 'export') {
      if (!store.ensureCurrent()) return render(false);
      const blob = new Blob([JSON.stringify(store.report(),null,2)], { type:'application/json' }), url = URL.createObjectURL(blob), link = document.createElement('a');
      link.href = url; link.download = 'mathexam-formula-progress.json'; link.click(); setTimeout(() => URL.revokeObjectURL(url),1000); return;
    }
    if (act.startsWith('demo-')) {
      if (act === 'demo-play') { ui.playing = !ui.playing; if (demoTimer) { clearInterval(demoTimer); demoTimer = null; } if (ui.playing) demoTimer = setInterval(() => { ui.demo = (ui.demo+1)%4; render(false); }, 2600); }
      else { if (demoTimer) { clearInterval(demoTimer); demoTimer=null; } ui.playing=false; ui.demo = Math.max(0,Math.min(3,ui.demo+(act === 'demo-next' ? 1 : -1))); }
      return render(false);
    }
    if (act === 'lab') { labState = { a:30,b:30,prediction:null,observed:false,feedback:'' }; const l = D.investigations.find(l => l.id === el.dataset.lab); if (l?.kind === 'domain') labState.a=0; return go('lab', { investigationId:el.dataset.lab }); }
    if (act === 'predict') { labState.prediction = Number(el.dataset.prediction); return render(false); }
    if (act === 'observe') { labState.observed = true; return render(false); }
    if (act === 'conclude') {
      const l = D.investigations.find(l => l.id === v.investigationId);
      if (Number(el.dataset.conclusion) === l.correct) { store.state.investigations[l.id] = true; store.persist(); labState.feedback = 'Верно. Ты проверил идею на модели.'; }
      else labState.feedback = 'Проверь ещё раз: сравни значения и положение точки. Можно изменить угол.';
      return render(false);
    }
  }
  function closeCourseSupport() {
    const dialog = document.getElementById('profile-course-support');
    if (dialog?.open) dialog.close();
  }
  // Preserve the shared course help and its return-to-task contract. A retained

  document.addEventListener('click', event => {
    const control = event.target?.closest?.('#profile-course-help, #profile-course-support [data-course-help]');

  document.addEventListener('profile-course-help-requested', () => { activeHelp(); if (!store.ensureCurrent()) { closeCourseSupport(); render(false); } });
  window.addEventListener('storage', event => { if (event.key === F.KEY || event.key === null) { if (!store.ensureCurrent()) closeCourseSupport(); render(false); } });

})();
