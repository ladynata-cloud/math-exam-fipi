name: Temporary OGE19 cloud offline rebuild
on:
  push:
    branches: ['task/oge19-editorial-completion-20261103']
    paths: ['trainers/task19-visual-data.js', '.github/workflows/oge19-cloud-prepare.yml']
permissions:
  contents: write
jobs:
  rebuild:
    if: github.repository == 'ladynata-cloud/math-exam-fipi' && github.ref == 'refs/heads/task/oge19-editorial-completion-20261103'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - name: Build only the OGE19 offline download on the exact candidate
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/build-trainer-downloads.mjs --only=task19-trainer --downloads-only
          python3 - <<'PY'
          import subprocess
          changed=subprocess.check_output(['git','status','--porcelain','-z']).decode().split('\0')
          for entry in filter(None,changed):
              path=entry[3:]
              assert path.startswith('downloads/trainers/task19-trainer/') or path=='downloads/trainers-manifest.json', path
          PY
          git diff --check
          git add -- downloads/trainers/task19-trainer downloads/trainers-manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "build(oge19): regenerate reviewed offline download"
          git push origin HEAD:refs/heads/task/oge19-editorial-completion-20261103
