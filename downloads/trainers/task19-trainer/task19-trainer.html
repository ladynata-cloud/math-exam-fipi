    sample(p){const r=p.radius,q=p.other,d=p.mode==='intersecting'?Math.abs(r-q)+p.position*(r+q-Math.abs(r-q)):p.distance,O1=[-d/2,0],O2=[d/2,0],P={O1,O2},M={radius:r,other:q,distance:d,intersections:0};const low=Math.abs(r-q),high=r+q,eps=1e-8;if(d>eps&&d>=low-eps&&d<=high+eps){const x=(r*r-q*q+d*d)/(2*d),y=Math.sqrt(Math.max(0,r*r-x*x));P.P=[O1[0]+x,y];M.intersections=Math.abs(d-low)<eps||Math.abs(d-high)<eps?1:2;if(M.intersections===2)P.Q=[O1[0]+x,-y];M.O1P=hypot(O1,P.P);M.O2P=hypot(O2,P.P);}return{points:P,metrics:M};},
    render(s){const P=s.points,M=s.metrics,T=fit([...bounds(P.O1,M.radius),...bounds(P.O2,M.other)],{x:55,y:45,w:450,h:240});let body=circleAt(T,P.O1,M.radius,BLUE)+circleAt(T,P.O2,M.other,GREEN)+line(T(P.O1),T(P.O2),INK,'5 5')+origin(T,P.O1,'O₁',BLUE)+origin(T,P.O2,'O₂',GREEN),readout=[`Радиусы: ${fmt(M.radius)} и ${fmt(M.other)}`,`Между центрами: ${fmt(M.distance)}`,`Общих точек: ${M.intersections}`];if(P.P){body+=line(T(P.O1),T(P.P),BLUE)+line(T(P.O2),T(P.P),GREEN)+dot(T(P.P))+text(T(P.P)[0],T(P.P)[1]-22,'P');readout.push(`O₁P = ${fmt(M.O1P)}; O₂P = ${fmt(M.O2P)}`);}if(P.Q)body+=dot(T(P.Q))+text(T(P.Q)[0],T(P.Q)[1]+22,'Q');return{body,readout};}
  };
  defs.circleCenter={
    title:'Найди центр окружности',values:{x:1.2,y:.5},controls:[range('x','Сдвинуть P вправо или влево',-2,2,.1),range('y','Сдвинуть P вверх или вниз',-2,2,.1)],
    sample(p){const P={O:[0,0],P:[p.x,p.y],A:[4,0],B:[0,4],C:[-4,0],D:[0,-4]},M={radius:4};for(const n of ['A','B','C','D'])M['P'+n]=hypot(P.P,P[n]);M.spread=Math.max(M.PA,M.PB,M.PC,M.PD)-Math.min(M.PA,M.PB,M.PC,M.PD);return{points:P,metrics:M};},
    render(s){const P=s.points,M=s.metrics,T=fit(bounds(P.O,4));let body=circleAt(T,P.O,4,INK,LIGHT)+labelPoints(P,['A','B','C','D'],T);for(const n of ['A','B','C','D'])body+=line(T(P.P),T(P[n]),BLUE,'5 5');body+=dot(T(P.P),GREEN)+text(T(P.P)[0]+17,T(P.P)[1]-16,'P',GREEN);return{body,readout:[`PA = ${fmt(M.PA)}; PC = ${fmt(M.PC)}`,`PB = ${fmt(M.PB)}; PD = ${fmt(M.PD)}`,`Разница наибольшего и наименьшего расстояния: ${fmt(M.spread)}`]};}
  };
  defs.radiusChord={
    title:'Радиус пересекает хорду',values:{offset:2,position:.4},controls:[range('offset','Сдвинуть хорду',1,4,.1),range('position','Передвинуть точку M вдоль хорды',-.8,.8,.05)],
    sample(p){const r=5,h=Math.sqrt(r*r-p.offset*p.offset),O=[0,0],A=[-h,p.offset],B=[h,p.offset],M=[p.position*h,p.offset],T=mul(M,r/hypot(O,M));return{points:{O,A,B,M,T},metrics:{radius:r,AM:hypot(A,M),MB:hypot(M,B),OT:hypot(O,T),angle:angleAt(O,M,A)}};},
    render(s){const P=s.points,M=s.metrics,T=fit(bounds(P.O,5));return{body:circleAt(T,P.O,5,INK,LIGHT)+line(T(P.A),T(P.B),BLUE)+line(T(P.O),T(P.T),GREEN)+labelPoints(P,['A','B','T'],T)+origin(T,P.O)+dot(T(P.M),GREEN)+text(T(P.M)[0]+(P.M[0]>=0?17:-17),T(P.M)[1]+20,'M',GREEN),readout:[`AM = ${fmt(M.AM)}; MB = ${fmt(M.MB)}`,`Радиус OT = ${fmt(M.OT)}`,`Угол OMA = ${fmt(M.angle)}°`]};}
  };
  defs.equalCircleChords={
    title:'Две равные хорды',values:{offset:2,angle:95},controls:[range('offset','Изменить длину обеих хорд',.5,4.5,.1),range('angle','Повернуть вторую хорду',40,150,1,'°')],
    sample(p){const h=Math.sqrt(25-p.offset*p.offset),O=[0,0],A=[-h,p.offset],B=[h,p.offset],M=[0,p.offset],C=rotate(A,p.angle),D=rotate(B,p.angle),N=rotate(M,p.angle);return{points:{O,A,B,C,D,M,N},metrics:{radius:5,AB:hypot(A,B),CD:hypot(C,D),OM:hypot(O,M),ON:hypot(O,N),angleM:angleAt(O,M,A),angleN:angleAt(O,N,C)}};},
    render(s){const P=s.points,M=s.metrics,T=fit(bounds(P.O,5));return{body:circleAt(T,P.O,5,INK,LIGHT)+line(T(P.A),T(P.B),BLUE)+line(T(P.C),T(P.D),GREEN)+line(T(P.O),T(P.M),BLUE,'5 5')+line(T(P.O),T(P.N),GREEN,'5 5')+rightMark(T(P.O),T(P.M),T(P.A))+rightMark(T(P.O),T(P.N),T(P.C))+labelPoints(P,['A','B','C','D'],T)+origin(T,P.O)+dot(T(P.M),BLUE)+text(T(P.M)[0]+15,T(P.M)[1]+18,'M',BLUE)+dot(T(P.N),GREEN)+text(T(P.N)[0]-15,T(P.N)[1]+18,'N',GREEN),readout:[`AB = ${fmt(M.AB)}; CD = ${fmt(M.CD)}`,`Расстояния до хорд: OM = ${fmt(M.OM)}; ON = ${fmt(M.ON)}`,`∠OMA = ${fmt(M.angleM)}°; ∠ONC = ${fmt(M.angleN)}°`]};}
  };
  function quadSample(p,rhombus){
    const a=rhombus?p.side:p.width,b=rhombus?p.side:p.height,angle=rhombus?p.angle:90,A=[0,0],B=[a,0],D=polar(b,angle),C=add(B,D),P={A,B,C,D},M={AB:hypot(A,B),BC:hypot(B,C),CD:hypot(C,D),DA:hypot(D,A),angle:angleAt(B,A,D)};
    P.O=rhombus&&p.mode==='circumcircle'?[a/2,a*(1-Math.cos(angle*RAD))/(2*Math.sin(angle*RAD))]:mid(A,C);
    const O=P.O;for(const [name,u,v]of [['E',A,B],['F',B,C],['G',C,D],['H',D,A]])P[name]=foot(O,u,v);
    for(const n of ['A','B','C','D','E','F','G','H'])M['O'+n]=hypot(O,P[n]);
    M.radius=p.mode==='circumcircle'?M.OA:Math.min(M.OE,M.OF,M.OG,M.OH);M.oppositeAngleSum=angleAt(B,A,D)+angleAt(B,C,D);return{points:P,metrics:M};
  }
  function quadRender(s){const P=s.points,M=s.metrics,p=s.values,T=fit([...Object.values(P),...bounds(P.O,M.radius)],{x:65,y:35,w:430,h:255});let body=poly(['A','B','C','D'].map(n=>T(P[n])))+circleAt(T,P.O,M.radius,BLUE)+labelPoints(P,['A','B','C','D'],T)+origin(T,P.O),readout=[];
    if(p.mode==='circumcircle'){for(const n of ['A','B','C','D'])body+=line(T(P.O),T(P[n]),BLUE,'5 5');readout=[`OA = ${fmt(M.OA)}; OB = ${fmt(M.OB)}`,`OC = ${fmt(M.OC)}; OD = ${fmt(M.OD)}`,`Радиус окружности = ${fmt(M.radius)}`,`Сумма противоположных углов A и C: ${fmt(M.oppositeAngleSum)}°`];}
    else{for(const [n,a]of [['E','A'],['F','B'],['G','C'],['H','D']])body+=line(T(P.O),T(P[n]),GREEN,'5 5')+rightMark(T(P.O),T(P[n]),T(P[a]))+dot(T(P[n]),GREEN);readout=[`Расстояния от O до AB и CD: ${fmt(M.OE)}; ${fmt(M.OG)}`,`Расстояния от O до BC и AD: ${fmt(M.OF)}; ${fmt(M.OH)}`,`Радиус круга = ${fmt(M.radius)}`,`Стороны AB = ${fmt(M.AB)}; BC = ${fmt(M.BC)}`,`Суммы противоположных сторон: ${fmt(M.AB+M.CD)} и ${fmt(M.BC+M.DA)}`];}
    return{body,readout};
  }
  defs.circleRectangle={title:'Прямоугольник и окружность',values:{width:6,height:3,mode:'incircle'},controls:[range('width','Сторона AB',2,8,.1),range('height','Сторона AD',2,5,.1)],sample:p=>quadSample(p,false),render:quadRender};
  defs.circleRhombus={title:'Ромб и окружность',values:{side:4,angle:65,mode:'incircle'},controls:[range('side','Сторона ромба',2,5,.1),range('angle','Изменить угол ромба',40,140,1,'°')],sample:p=>quadSample(p,true),render:quadRender};
  defs.circleMeasure={
    title:'Размер круга и окружности',values:{radius:3,mode:'area'},controls:[range('radius','Изменить радиус',1,4,.1)],
    sample(p){return{points:{O:[0,0],A:[p.radius,0],U:[0,0],V:[2*Math.PI*p.radius,0]},metrics:{radius:p.radius,diameter:2*p.radius,length:2*Math.PI*p.radius,area:Math.PI*p.radius*p.radius,comparison:2*Math.PI*p.radius,unitArea:Math.PI,areaRatio:p.radius*p.radius}};},
    render(s){const M=s.metrics,p=s.values;let body='',readout=[];if(p.mode==='area'){const u=27,O=[355,155],U=[120,155];body=circle(U,u,GREEN,LIGHT)+circle(O,M.radius*u,BLUE,LIGHT)+line(U,[U[0]+u,U[1]],GREEN)+line(O,[O[0]+M.radius*u,O[1]],BLUE)+text(120,285,'Радиус 1',GREEN)+text(355,285,'Радиус r',BLUE);readout=[`r = ${fmt(M.radius)}`,`Площадь круга: ${fmt(M.area)}`,`Значение 2πr: ${fmt(M.comparison)}`,`Площадь больше единичного круга в ${fmt(M.areaRatio)} раза`];}else{const u=14,O=[280,120];body=circle(O,M.radius*u,BLUE)+line([O[0]-M.radius*u,O[1]],[O[0]+M.radius*u,O[1]],GREEN)+text(280,205,'Диаметр',GREEN)+line([65,275],[65+M.length*u,275],BLUE)+dot([65,275],BLUE)+dot([65+M.length*u,275],BLUE)+text(280,310,'Длина окружности на прямой',BLUE);readout=[`r = ${fmt(M.radius)}; диаметр = ${fmt(M.diameter)}`,`Длина окружности: ${fmt(M.length)}`,`Длина / диаметр: ${fmt(M.length/M.diameter)}`,`2πr = ${fmt(M.comparison)}`];}return{body,readout};}
  };
  return defs;
});

<script data-inline-source="/trainers/task19-models-lines-polygons.js">
/* Constrained experiments for lines, quadrilaterals and polygons. */
(function(root,factory){
  if(typeof module==='object'&&module.exports)module.exports=factory;
  else root.Task19LinePolygonModels=factory;
})(typeof window==='object'?window:globalThis,function(kit){
  'use strict';
  const {RAD,BLUE,GREEN,INK,LIGHT,clamp,hypot,mid,fmt,angleAt,line,text,dot,poly,fit,labelPoints}=kit;
  const area=P=>Math.abs(P.reduce((sum,p,i)=>{const q=P[(i+1)%P.length];return sum+p[0]*q[1]-p[1]*q[0];},0))/2;
  const turn=(p,c,a)=>{const x=p[0]-c[0],y=p[1]-c[1];return[c[0]+x*Math.cos(a)-y*Math.sin(a),c[1]+x*Math.sin(a)+y*Math.cos(a)];};
  const ring=(c,r,color=INK)=>`<circle cx="${c[0]}" cy="${c[1]}" r="${r}" fill="none" stroke="${color}" stroke-width="2"/>`;
  const sideLengths=P=>P.map((p,i)=>hypot(p,P[(i+1)%P.length]));
  const angles=P=>P.map((p,i)=>angleAt(P[(i+P.length-1)%P.length],p,P[(i+1)%P.length]));
  const dotted=(a,b,color)=>line(a,b,color,'6 5');
  const defs={};

  defs.lineRelations={
    title:'Прямые и секущая',values:{angle:55,separation:3,mode:'parallel'},
    controls:[['angle','Наклон секущей',25,155,1,'°'],['separation','Расстояние между прямыми',2,4,0.1,'']],
    normalize:p=>{if(p.mode==='perpendicular')p.angle=90;return p;},
    controlsFor:p=>['perpendicular','threeParallel'].includes(p.mode)?[['separation','Раздвинь прямые',2,4,0.1,'']]:defs.lineRelations.controls,
    sample:p=>{const y=p.separation/2,dx=y/Math.tan(p.angle*RAD);return{points:{P:[-dx,-y],Q:[dx,y],L1:[-5,-y],R1:[5,-y],L2:[-5,y],R2:[5,y],L3:[-5,0],R3:[5,0]},metrics:{alpha:p.angle,beta:180-p.angle,gamma:p.angle,sum:180,separation:p.separation}};},
    render:s=>{const p=s.values,M=s.metrics,T=q=>[280+q[0]*35,165-q[1]*35],P=s.points;const lo=T([-5,-p.separation/2]),hi=T([-5,p.separation/2]);let body=line(lo,T([5,-p.separation/2]))+line(hi,T([5,p.separation/2]));
      if(p.mode==='threeParallel'){body+=line(T(P.L3),T(P.R3),BLUE)+text(75,lo[1]-20,'a')+text(75,hi[1]-20,'b')+text(75,145,'c',BLUE);return{body,readout:['Угол между a и c: 0°','Угол между b и c: 0°','Угол между a и b: 0°']};}
      const reach=Math.max(4.2,hypot([0,0],P.Q)+0.5),u=[Math.cos(p.angle*RAD)*reach,Math.sin(p.angle*RAD)*reach];body+=line(T([-u[0],-u[1]]),T(u),BLUE)+dot(T(P.P))+dot(T(P.Q));
      const same=p.mode==='sameSide',inner=same||p.mode==='alternate';
      body+=text(75,lo[1]-20,'a')+text(75,hi[1]-20,'b')+text(T(P.Q)[0]+(inner?-38:38),T(P.Q)[1]+(inner?22:-22),'α',BLUE);
      body+=text(T(P.P)[0]+(same?-38:38),T(P.P)[1]-22,same?'β':'γ',GREEN);
      if(p.mode==='perpendicular')for(const n of ['P','Q']){const q=T(P[n]);body+=`<path d="M ${q[0]+13} ${q[1]} v -13 h -13" fill="none" stroke="${GREEN}" stroke-width="2"/>`;}
      return{body,readout:same?[`α = ${fmt(M.alpha)}°`,`β = ${fmt(M.beta)}°`,`α + β = ${fmt(M.sum)}°`]:[`α = ${fmt(M.alpha)}°`,`γ = ${fmt(M.gamma)}°`,`Угол между прямыми a и b: 0°`]};}
  };

  defs.lineThroughPoint={
    title:'Поворот прямой через точку',values:{angle:30,target:30,mode:'twoPoints'},
    controls:[['angle','Поверни прямую через P',0,170,1,'°']],
    controlsFor:p=>p.mode==='many'?[['angle','Поверни третью прямую через P',15,75,1,'°']]:defs.lineThroughPoint.controls,
    normalize:p=>{if(p.mode==='many')p.angle=clamp(p.angle,15,75);return p;},
    sample:p=>{const u=[3.4*Math.cos(p.angle*RAD),3.4*Math.sin(p.angle*RAD)],P={P:[0,0],B:[3*Math.cos(p.target*RAD),3*Math.sin(p.target*RAD)],U:[-u[0],-u[1]],V:u};return{points:P,metrics:{angle:p.angle,target:p.target,distance:3*Math.abs(Math.sin((p.angle-p.target)*RAD)),relative:Math.min(p.angle,180-p.angle)}};},
    render:s=>{const p=s.values,P=s.points,T=q=>[280+q[0]*42,175-q[1]*42],u=[3.4*Math.cos(p.angle*RAD),3.4*Math.sin(p.angle*RAD)];let body=line(T([-u[0],-u[1]]),T(u),BLUE)+dot(T(P.P),BLUE)+text(266,197,'P',BLUE);
      if(p.mode==='twoPoints')body+=dot(T(P.B),GREEN)+text(T(P.B)[0]+14,T(P.B)[1]-14,'B',GREEN);
      else if(p.mode==='many')body+=line([70,175],[490,175],INK)+line([280,40],[280,310],GREEN);
      else body+=line([55,285],[505,285],GREEN)+text(80,268,'a',GREEN);
      return{body,readout:p.mode==='twoPoints'?[`Расстояние от B до синей прямой: ${fmt(s.metrics.distance)}`,`Направление синей прямой: ${fmt(p.angle)}°`]:p.mode==='many'?[`Направления трёх прямых: 0°; ${fmt(p.angle)}°; 90°`,'Все три прямые проходят через P']:[`Угол синей прямой с прямой a: ${fmt(s.metrics.relative)}°`,`Синяя прямая всё время проходит через P`]};}
  };

  defs.bisectorDistance={
    title:'Точка и два равных расстояния',values:{angle:70,position:3,mode:'angle'},
    controls:[['angle','Раскрой угол',30,130,1,'°'],['position','Передвинь точку P',1,4.5,0.1,'']],
    controlsFor:p=>p.mode==='perpendicular'?[['position','Передвинь точку P по перпендикуляру',1,4.5,0.1,'']]:defs.bisectorDistance.controls,
    sample:p=>{if(p.mode==='perpendicular'){const P={A:[-3,0],B:[3,0],M:[0,0],P:[0,p.position]};return{points:P,metrics:{PA:hypot(P.P,P.A),PB:hypot(P.P,P.B),AM:3,MB:3,angle:90}};}
      const h=p.angle*RAD/2,P={O:[0,0],P:[p.position*Math.cos(h),p.position*Math.sin(h)],A:[5,0],B:[5*Math.cos(p.angle*RAD),5*Math.sin(p.angle*RAD)]};P.H=[P.P[0],0];const k=P.P[0]*Math.cos(p.angle*RAD)+P.P[1]*Math.sin(p.angle*RAD);P.K=[k*Math.cos(p.angle*RAD),k*Math.sin(p.angle*RAD)];return{points:P,metrics:{PH:hypot(P.P,P.H),PK:hypot(P.P,P.K),firstAngle:p.angle/2,secondAngle:p.angle/2}};},
    render:s=>{const P=s.points,p=s.values,T=fit(p.mode==='perpendicular'?Object.values(P).concat([[0,5]]):Object.values(P),{x:100,y:40,w:360,h:225});let body='';if(p.mode==='perpendicular'){body=line(T(P.A),T(P.B))+line(T([0,0]),T([0,5]),BLUE)+line(T(P.A),T(P.P),GREEN)+line(T(P.B),T(P.P),GREEN)+labelPoints(P,['A','B','P'],T)+dot(T(P.M))+text(T(P.M)[0]+20,T(P.M)[1]+23,'M');return{body,readout:[`PA = ${fmt(s.metrics.PA)}`,`PB = ${fmt(s.metrics.PB)}`,`AM = MB = 3`,`Угол PMB = 90°`]};}
      body=line(T(P.O),T(P.A))+line(T(P.O),T(P.B))+line(T(P.O),T(P.P),BLUE)+dotted(T(P.P),T(P.H),GREEN)+dotted(T(P.P),T(P.K),GREEN)+labelPoints(P,['O','A','B','P'],T)+dot(T(P.H),GREEN)+dot(T(P.K),GREEN)+text(T(P.H)[0],T(P.H)[1]+20,'H',GREEN)+text(T(P.K)[0]-17,T(P.K)[1]-12,'K',GREEN);
      return{body,readout:[`∠AOP = ${fmt(s.metrics.firstAngle)}°`,`∠POB = ${fmt(s.metrics.secondAngle)}°`,`PH = ${fmt(s.metrics.PH)}`,`PK = ${fmt(s.metrics.PK)}`]};}
  };

  defs.detachedAngles={
    title:'Сумма углов и их расположение',values:{angle:55,gap:110},controls:[['angle','Первый угол',25,155,1,'°'],['gap','Раздвинь вершины углов',70,150,1,'']],
    sample:p=>{const O=[280-p.gap,205],P=[280+p.gap,205];return{points:{O,P,A:[O[0]+90,O[1]],B:[O[0]+90*Math.cos(p.angle*RAD),O[1]-90*Math.sin(p.angle*RAD)],C:[P[0]+90,P[1]],D:[P[0]+90*Math.cos((180-p.angle)*RAD),P[1]-90*Math.sin((180-p.angle)*RAD)]},metrics:{first:p.angle,second:180-p.angle,sum:180}};},
    render:s=>{let body='';const p=s.values;[s.points.O,s.points.P].forEach((o,i)=>{const a=(i?180-p.angle:p.angle)*RAD;body+=line(o,[o[0]+90,o[1]],i?GREEN:BLUE)+line(o,[o[0]+90*Math.cos(a),o[1]-90*Math.sin(a)],i?GREEN:BLUE)+dot(o)+text(o[0],o[1]+25,i?'P':'O');});return{body,readout:[`Первый угол: ${fmt(s.metrics.first)}°`,`Второй угол: ${fmt(s.metrics.second)}°`,`Сумма: 180°`,`Вершины O и P — разные точки`]};}
  };

  defs.acuteAdjacent={
    title:'Острый угол и смежный с ним',values:{angle:55},controls:[['angle','Измени острый угол',20,85,1,'°']],
    sample:p=>({points:{O:[0,0],A:[-4,0],B:[4,0],C:[4*Math.cos(p.angle*RAD),4*Math.sin(p.angle*RAD)]},metrics:{alpha:p.angle,beta:180-p.angle,sum:180}}),
    render:s=>{const P=s.points,T=q=>[280+q[0]*48,270-q[1]*48];return{body:line(T(P.A),T(P.B))+line(T(P.O),T(P.C),BLUE)+labelPoints(P,['A','B','C'],T)+dot(T(P.O))+text(295,292,'O')+text(340,239,'α',BLUE)+text(220,220,'β',GREEN),readout:[`α = ${fmt(s.metrics.alpha)}°`,`β = ${fmt(s.metrics.beta)}°`,`Сумма: 180°`]};}
  };

  defs.squareMeasure={
    title:'Измерения квадрата',values:{side:4,focus:'sides',compare:false},controls:[['side','Измени сторону квадрата',2,6,0.5,'']],
    sample:p=>({points:{A:[0,0],B:[p.side,0],C:[p.side,p.side],D:[0,p.side],O:[p.side/2,p.side/2]},metrics:{side:p.side,area:p.side*p.side,perimeter:4*p.side,diagonal:p.side*Math.SQRT2,diagonalProduct:2*p.side*p.side,angle:90,otherArea:16}}),
    render:s=>{const p=s.values,P=s.points,M=s.metrics,u=p.compare?25:36,T=q=>[p.compare?315+q[0]*u:280+(q[0]-p.side/2)*u,270-q[1]*u];let body=poly(['A','B','C','D'].map(n=>T(P[n])))+labelPoints(P,['A','B','C','D'],T);const a=T(P.A);body+=`<path d="M ${a[0]+13} ${a[1]} v -13 h -13" fill="none" stroke="${INK}" stroke-width="2"/>`;
      if(p.focus==='diagonals')body+=line(T(P.A),T(P.C),BLUE)+line(T(P.B),T(P.D),GREEN)+dot(T(P.O));
      if(p.compare){body+=poly([[65,270],[165,270],[165,170],[65,170]])+text(115,300,'Сторона 4');return{body,readout:[`Площадь первого квадрата: 16`,`Сторона второго: ${fmt(M.side)}`,`Площадь второго: ${fmt(M.area)}`]};}
      return{body,readout:p.focus==='diagonals'?[`Сторона: ${fmt(M.side)}`,`AC = BD = ${fmt(M.diagonal)}`,`Угол между диагоналями: 90°`,`Площадь: ${fmt(M.area)}`,`AC · BD = ${fmt(M.diagonalProduct)}`]:p.focus==='area'?[`Сторона: ${fmt(M.side)}`,`Площадь: ${fmt(M.area)}`,`Периметр: ${fmt(M.perimeter)}`]:[`AB = BC = CD = DA = ${fmt(M.side)}`,`Все четыре угла: 90°`]};}
  };

  defs.quadrilateralExplore={
    title:'Проверка четырёхугольника',values:{mode:'free',angle:65,shift:1,height:3,a:3,b:5},
    controls:[['shift','Передвинь вершину C',-1,2,0.1,''],['height','Измени высоту справа',2,5,0.1,'']],
    controlsFor:p=>p.mode==='hinge'||p.mode==='cyclic'?[['angle','Измени угол, сохраняя длины сторон',45,135,1,'°']]:p.mode==='orthodiagonal'?[['a','Положение пересечения на AC',2,6,0.1,''],['b','Положение пересечения на BD',2,6,0.1,'']]:defs.quadrilateralExplore.controls,
    sample:p=>{let P;if(p.mode==='orthodiagonal')P={A:[-p.a,0],B:[0,-p.b],C:[8-p.a,0],D:[0,8-p.b],O:[0,0]};else if(p.mode==='hinge'||p.mode==='cyclic'){const D=[4*Math.cos(p.angle*RAD),4*Math.sin(p.angle*RAD)];P={A:[0,0],B:[6,0],C:[6+D[0],D[1]],D};}else P={A:[0,0],B:[6,0],C:[5+p.shift,p.height],D:[0,4]};
      const seq=['A','B','C','D'].map(n=>P[n]),M={sides:sideLengths(seq),angles:angles(seq),area:area(seq),AC:hypot(P.A,P.C),BD:hypot(P.B,P.D)};
      if(p.mode==='cyclic'){const D=P.D;P.O=[3,(16-6*D[0])/(2*D[1])];M.radius=hypot(P.O,P.A);M.OC=hypot(P.O,P.C);M.oppositeSum=M.angles[0]+M.angles[2];}
      if(p.mode==='orthodiagonal'){M.diagonalAngle=90;M.AO=p.a;M.OC=8-p.a;M.BO=p.b;M.OD=8-p.b;}
      if(p.mode==='hinge')M.otherSides=[6,4,6,4];return{points:P,metrics:M};},
    render:s=>{const P=s.points,p=s.values,M=s.metrics;let all=Object.values(P);if(p.mode==='cyclic')all=all.concat([[P.O[0]-M.radius,P.O[1]-M.radius],[P.O[0]+M.radius,P.O[1]+M.radius]]);const T=fit(all,p.mode==='hinge'?{x:35,y:55,w:240,h:190}:{x:85,y:35,w:390,h:245});let body=poly(['A','B','C','D'].map(n=>T(P[n])))+labelPoints(P,['A','B','C','D'],T);
      if(p.mode==='orthodiagonal')body+=line(T(P.A),T(P.C),BLUE)+line(T(P.B),T(P.D),GREEN)+dot(T(P.O))+text(T(P.O)[0]+15,T(P.O)[1]+20,'O');
      if(p.mode==='cyclic')body+=ring(T(P.O),hypot(T(P.O),T(P.A)),BLUE)+dotted(T(P.O),T(P.C),GREEN)+dot(T(P.O))+text(T(P.O)[0],T(P.O)[1]+20,'O');
      if(p.mode==='hinge'){body+=poly([[325,245],[505,245],[505,125],[325,125]])+text(410,280,'Прямоугольник 6 × 4');return{body,readout:[`Стороны первого: ${M.sides.map(fmt).join('; ')}`,`Стороны второго: 6; 4; 6; 4`,`Угол A первого: ${fmt(M.angles[0])}°`,`Угол второго: 90°`,`Площади: ${fmt(M.area)} и 24`]};}
      return{body,readout:p.mode==='orthodiagonal'?[`AC = ${fmt(M.AC)}; BD = ${fmt(M.BD)}`,`Угол между диагоналями: 90°`,`Стороны: ${M.sides.map(fmt).join('; ')}`,`AO = ${fmt(M.AO)}; OC = ${fmt(M.OC)}`]:p.mode==='cyclic'?[`OA = OB = OD = ${fmt(M.radius)}`,`OC = ${fmt(M.OC)}`,`∠A + ∠C = ${fmt(M.oppositeSum)}°`]:[`Углы A, B, C, D: ${M.angles.map(n=>fmt(n)+'°').join('; ')}`,`Сумма: ${fmt(M.angles.reduce((a,b)=>a+b,0))}°`]};}
  };

  defs.diagonalOverlay={
    title:'Поверни один треугольник',values:{angle:65,turn:0,rectangle:false},controls:[['turn','Поверни синий треугольник',0,1,0.05,'']],
    normalize:p=>{if(p.rectangle)p.angle=90;return p;},
    sample:p=>{const P={A:[0,0],B:[6,0],D:[4*Math.cos(p.angle*RAD),4*Math.sin(p.angle*RAD)]};P.C=[6+P.D[0],P.D[1]];P.O=mid(P.A,P.C);for(const[n,q]of[['E',P.A],['F',P.B],['G',P.C]])P[n]=turn(q,P.O,p.turn*Math.PI);return{points:P,metrics:{rotation:p.turn*180,AC:hypot(P.A,P.C),area:12*Math.sin(p.angle*RAD),mismatch:hypot(P.E,P.C)+hypot(P.F,P.D)+hypot(P.G,P.A)}};},
    render:s=>{const P=s.points,T=fit(Object.values(P),{x:70,y:35,w:420,h:255});let body=poly([T(P.A),T(P.C),T(P.D)])+line(T(P.A),T(P.C),GREEN)+`<polygon points="${['E','F','G'].map(n=>T(P[n]).join(',')).join(' ')}" fill="#b4d4f1" fill-opacity="0.65" stroke="${BLUE}" stroke-width="3"/>`+labelPoints(P,['A','B','C','D'],T)+dot(T(P.O));return{body,readout:[`Поворот: ${fmt(s.metrics.rotation)}°`,`Стороны обоих треугольников: 6; 4; ${fmt(s.metrics.AC)}`,`Площади: ${fmt(s.metrics.area)} и ${fmt(s.metrics.area)}`,`Расхождение вершин после поворота: ${fmt(s.metrics.mismatch)}`]};}
  };

  defs.polygonFan={
    title:'Разбей многоугольник на треугольники',values:{n:5,cuts:0,size:3,stretch:1,mode:'angles'},
    controls:[['n','Количество сторон',3,8,1,''],['cuts','Проведи диагонали из A',0,5,1,'']],
    normalize:p=>{p.n=p.fixedN?Number(p.fixedN):Math.round(p.n);p.cuts=Math.min(Math.round(p.cuts),p.n-3);if(p.mode==='regular')p.stretch=1;return p;},
    controlsFor:p=>p.mode==='regular'?[['size','Измени размер правильного шестиугольника',2,3.5,0.1,'']]:p.mode==='irregular'?[['stretch','Передвинь одну вершину',0.8,1.25,0.01,'']]:[...(!p.fixedN?[['n','Количество сторон',3,8,1,'']]:[]),['cuts','Проведи диагонали из A',0,p.n-3,1,'']],
    sample:p=>{const points={};for(let i=0;i<p.n;i++){const r=p.size*(i===1?p.stretch:1),a=(90+360*i/p.n)*RAD;points[String.fromCharCode(65+i)]=[r*Math.cos(a),r*Math.sin(a)];}const seq=Object.values(points),aa=angles(seq);return{points,metrics:{n:p.n,sides:sideLengths(seq),angles:aa,sum:aa.reduce((a,b)=>a+b,0),triangles:p.n-2,drawn:p.cuts+1}};},
    render:s=>{const P=s.points,p=s.values,names=Object.keys(P),T=q=>[280+q[0]*36,165-q[1]*36];let body=poly(names.map(n=>T(P[n])))+labelPoints(P,names,T);for(let i=0;i<p.cuts;i++)body+=line(T(P.A),T(P[names[i+2]]),BLUE);return{body,readout:p.mode==='angles'?[`Сторон: ${p.n}`,`Проведено диагоналей: ${p.cuts}`,`Для полного разбиения нужно треугольников: ${s.metrics.triangles}`,`Сумма внутренних углов: ${fmt(s.metrics.sum)}°`]:[`Длины сторон: ${s.metrics.sides.map(fmt).join('; ')}`,`Углы: ${s.metrics.angles.map(n=>fmt(n)+'°').join('; ')}`]};}
  };

  defs.coordinateMeasure={
    title:'Передвинь точку и проверь расстояние',values:{a:-3,b:4,x:-3,y:1,bx:4,by:3,mode:'line'},
    controls:[['a','Координата A',-6,6,0.5,''],['b','Координата B',-6,6,0.5,'']],
    controlsFor:p=>p.mode==='midpoint'?[['bx','Координата x точки B',-5,5,0.5,''],['by','Координата y точки B',-3,4,0.5,'']]:defs.coordinateMeasure.controls,
    sample:p=>{const P=p.mode==='midpoint'?{A:[p.x,p.y],B:[p.bx,p.by]}:{A:[p.a,0],B:[p.b,0]};P.M=mid(P.A,P.B);return{points:P,metrics:{length:hypot(P.A,P.B),difference:p.b-p.a,midX:P.M[0],midY:P.M[1],AM:hypot(P.A,P.M),MB:hypot(P.M,P.B)}};},
    render:s=>{const p=s.values,P=s.points,T=q=>[280+q[0]*34,190-q[1]*30];let body=line([60,190],[500,190]);for(let i=-6;i<=6;i++)body+=line([280+i*34,185],[280+i*34,195])+text(280+i*34,214,i);if(p.mode==='midpoint'){body+=line([280,45],[280,295]);for(let i=-3;i<=4;i++)if(i)body+=line([275,190-i*30],[285,190-i*30])+text(263,190-i*30,i);}
      body+=line(T(P.A),T(P.B),BLUE)+dot(T(P.A),BLUE)+dot(T(P.B),GREEN)+text(T(P.A)[0]-10,T(P.A)[1]-20,'A',BLUE)+text(T(P.B)[0]+10,T(P.B)[1]-20,'B',GREEN);if(p.mode==='midpoint')body+=dot(T(P.M))+text(T(P.M)[0],T(P.M)[1]+22,'M');return{body,readout:p.mode==='midpoint'?[`A (${fmt(P.A[0])}; ${fmt(P.A[1])})`,`B (${fmt(P.B[0])}; ${fmt(P.B[1])})`,`M (${fmt(s.metrics.midX)}; ${fmt(s.metrics.midY)})`,`AM = ${fmt(s.metrics.AM)}; MB = ${fmt(s.metrics.MB)}`]:[`Координаты: ${fmt(p.a)} и ${fmt(p.b)}`,`Разность B − A = ${fmt(s.metrics.difference)}`,`Расстояние AB = ${fmt(s.metrics.length)}`]};}
  };

  defs.rhombusArea={
    title:'Ромб внутри прямоугольника',values:{d1:6,d2:4},controls:[['d1','Первая диагональ',3,8,0.5,''],['d2','Вторая диагональ',2,6,0.5,'']],
    sample:p=>({points:{A:[-p.d1/2,0],B:[0,-p.d2/2],C:[p.d1/2,0],D:[0,p.d2/2],O:[0,0]},metrics:{area:p.d1*p.d2/2,rectangleArea:p.d1*p.d2,triangleArea:p.d1*p.d2/8}}),
    render:s=>{const p=s.values,P=s.points,T=q=>[280+q[0]*40,170-q[1]*40];let body=`<rect x="${280-p.d1*20}" y="${170-p.d2*20}" width="${p.d1*40}" height="${p.d2*40}" fill="none" stroke="${GREEN}" stroke-width="2" stroke-dasharray="6 5"/>`+poly(['A','B','C','D'].map(n=>T(P[n])))+line(T(P.A),T(P.C),BLUE)+line(T(P.B),T(P.D),BLUE)+labelPoints(P,['A','B','C','D'],T);return{body,readout:[`Диагонали: ${fmt(p.d1)} и ${fmt(p.d2)}`,`Площадь прямоугольника вокруг ромба: ${fmt(s.metrics.rectangleArea)}`,`Площадь ромба: ${fmt(s.metrics.area)}`,`Каждый из четырёх треугольников ромба: ${fmt(s.metrics.triangleArea)}`]};}
  };

  defs.equalPerimeters={
    title:'Один периметр — разные формы',values:{width:9},controls:[['width','Потяни сторону второго прямоугольника',2,10,0.5,'']],
    sample:p=>({points:{A:[0,0],B:[p.width,0],C:[p.width,12-p.width],D:[0,12-p.width]},metrics:{width:p.width,height:12-p.width,perimeter:24,area:p.width*(12-p.width),squareArea:36}}),
    render:s=>{const p=s.values,M=s.metrics,T=q=>[330+q[0]*17,270-q[1]*17];const body=poly([[75,270],[177,270],[177,168],[75,168]])+text(126,300,'Квадрат 6 × 6')+poly(['A','B','C','D'].map(n=>T(s.points[n])))+text(410,300,`${fmt(M.width)} × ${fmt(M.height)}`);return{body,readout:[`Периметр квадрата: 24`,`Периметр прямоугольника: ${fmt(M.perimeter)}`,`Площади: 36 и ${fmt(M.area)}`]};}
  };
  return defs;
});

<script data-inline-source="/trainers/task19-visual-models.js">
/* Small, deterministic geometry experiments for the optional task 19 hints. */
(function (root, factory) {
  const extensions = typeof module === 'object' && module.exports
    ? [require('./task19-models-triangles.js'), require('./task19-models-circles.js'), require('./task19-models-lines-polygons.js')]
    : [root.Task19TriangleModels, root.Task19CircleModels, root.Task19LinePolygonModels];
  const api = factory(extensions);
  if (typeof module === 'object' && module.exports) module.exports = api;
  else root.Task19Visuals = api;
})(typeof window === 'object' ? window : globalThis, function (extensions) {
  'use strict';
  const RAD = Math.PI / 180;
  const BLUE = '#245ca8', GREEN = '#18704f', INK = '#263238', LIGHT = '#eaf1f8';
  const clamp = (n, lo, hi) => Math.min(hi, Math.max(lo, n));
  const finite = (n, fallback) => Number.isFinite(Number(n)) ? Number(n) : fallback;
  const hypot = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
  const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmt = n => (Math.abs(n) < 0.005 ? 0 : Number(n.toFixed(2))).toLocaleString('ru-RU');
  const angleAt = (a, b, c) => {
    const u = [a[0] - b[0], a[1] - b[1]], v = [c[0] - b[0], c[1] - b[1]];
    return Math.acos(clamp((u[0] * v[0] + u[1] * v[1]) / (Math.hypot(...u) * Math.hypot(...v)), -1, 1)) / RAD;
  };
  const defs = {
    adjacentAngles: {title:'Две пересекающиеся прямые', values:{angle:55}, controls:[['angle','Угол α',20,160,1,'°']]},
    triangleAngles: {title:'Углы треугольника', values:{a:65,b:45}, controls:[['a','Угол A',20,130,1,'°'],['b','Угол B',20,130,1,'°']]},
    triangleMedian: {title:'Медиана и высота треугольника', values:{x:1.2,height:3}, controls:[['x','Положение вершины C',0.5,5.5,0.1,''],['height','Высота CH',2,5,0.1,'']]},
    triangleSides: {title:'Три отрезка', values:{a:3,b:4,c:5}, controls:[['a','Сторона a',1,9,0.5,''],['b','Сторона b',1,9,0.5,''],['c','Сторона c',1,9,0.5,'']]},
    parallelogram: {title:'Параллелограмм ABCD', values:{base:6,side:4,angle:65}, controls:[['base','Сторона AB',3,8,0.5,''],['side','Сторона AD',2,6,0.5,''],['angle','Угол A',30,150,1,'°']]},
    rhombus: {title:'Ромб ABCD', values:{side:4,angle:65}, controls:[['side','Длина стороны',2,6,0.5,''],['angle','Угол A',30,150,1,'°']]},
    rectangle: {title:'Прямоугольник ABCD', values:{width:6,height:3}, controls:[['width','Сторона AB',2,8,0.5,''],['height','Сторона AD',2,6,0.5,'']]},
    trapezoid: {title:'Трапеция ABCD', values:{bottom:7,top:3,height:3,offset:0}, controls:[['bottom','Основание AB',5,10,0.5,''],['top','Основание CD',2,4.5,0.5,''],['height','Высота',2,5,0.1,''],['offset','Сдвиг верхнего основания',-2,2,0.1,'']]},
    circleChord: {title:'Хорда и диаметр окружности', values:{radius:5,offset:2}, controls:[['radius','Радиус',2,6,0.5,''],['offset','Расстояние от центра до хорды',0,4.9,0.1,'']]},
    circleAngle: {title:'Углы, опирающиеся на одну дугу', values:{central:120,point:230}, controls:[['central','Центральный угол AOB',30,180,1,'°'],['point','Положение точки C на окружности',50,340,1,'°']]},
    similarity: {title:'Два подобных треугольника', values:{scale:2}, controls:[['scale','Во сколько раз увеличиваем стороны',1,3,0.1,'']]},
    areaTriangle: {title:'Основание и высота треугольника', values:{base:6,height:3,x:1}, controls:[['base','Основание AB',3,8,0.5,''],['height','Высота',2,5,0.1,''],['x','Сдвиг вершины C',-1,7,0.1,'']]}
  };

  function valuesFor(model, params) {
    const def = defs[model];
    if (!def) throw new Error('Unknown task 19 model: ' + model);
    let p = Object.assign({}, def.values, params || {});
    def.controls.forEach(([key,,lo,hi]) => { p[key] = clamp(finite(p[key], def.values[key]), lo, hi); });
    if (model === 'triangleAngles') p.b = Math.min(p.b, 170 - p.a);
    if (model === 'circleChord') p.offset = Math.min(p.offset, p.radius - 0.1);
    if (model === 'circleAngle') {
      if (p.diameter) p.central = 180;
      p.point = clamp(p.point, p.central + 20, p.compare ? 300 : 340);
    }
    if (model === 'trapezoid') p.top = Math.min(p.top, p.bottom - 0.5);
    if (def.normalize) p = def.normalize(p);
    if (def.controlsFor) def.controlsFor(p).forEach(([key,,lo,hi])=>{p[key]=clamp(finite(p[key],def.values[key]),lo,hi);});
    if (def.normalize) p = def.normalize(p);
    return p;
  }

  function controlsFor(model, params) {
    const p = valuesFor(model, params);
    const locked = Array.isArray(p.locked) ? p.locked : [];
    const definition = defs[model];
    return (definition.controlsFor ? definition.controlsFor(p) : definition.controls).filter(([key]) => !locked.includes(key) && !(model === 'circleAngle' && p.diameter && key === 'central')).map(([key,label,min,max,step,unit,choices]) => ({
      key,label,min,
      max: model === 'triangleAngles' && key === 'b' ? Math.min(max,170-p.a) : model === 'circleChord' && key === 'offset' ? p.radius-0.1 : max,
      step,unit,value:p[key],choices,
      ...(model === 'circleAngle' && key === 'point' ? {min:p.central+20,max:p.compare?300:340} : {})
    }));
  }

  function sample(model, params) {
    const p = valuesFor(model, params), result = {model,values:p,points:{},metrics:{}};
    if (defs[model].sample) return Object.assign(result, defs[model].sample(p), {model,values:p});
    const P = result.points, M = result.metrics;
    if (model === 'adjacentAngles') {
      M.alpha=p.angle; M.beta=180-p.angle; M.sum=180;
      P.O=[0,0];P.A=[1,0];P.B=[-1,0];P.C=[Math.cos(p.angle*RAD),Math.sin(p.angle*RAD)];P.D=[-P.C[0],-P.C[1]];
    } else if (model === 'triangleAngles') {
      M.a=p.a; M.b=p.b; M.c=180-p.a-p.b;
      const ac=6*Math.sin(p.b*RAD)/Math.sin(M.c*RAD);
      P.A=[0,0]; P.B=[6,0]; P.C=[ac*Math.cos(p.a*RAD),ac*Math.sin(p.a*RAD)];
    } else if (model === 'triangleMedian' || model === 'areaTriangle') {
      const b=model==='triangleMedian'?6:p.base;
      P.A=[0,0];P.B=[b,0];P.C=[p.x,p.height];P.H=[p.x,0];P.M=[b/2,0];
      M.base=b;M.height=p.height;M.area=b*p.height/2;M.leftArea=M.area/2;M.rightArea=M.area/2;
      M.AC=hypot(P.A,P.C);M.BC=hypot(P.B,P.C);M.CM=hypot(P.C,P.M);M.AM=b/2;M.MB=b/2;
      M.ACM=angleAt(P.A,P.C,P.M);M.MCB=angleAt(P.M,P.C,P.B);
    } else if (model === 'triangleSides') {
      M.a=p.a;M.b=p.b;M.c=p.c;M.exists=p.a+p.b>p.c&&p.a+p.c>p.b&&p.b+p.c>p.a;

      inputs.forEach(({input,output,key})=>{const bound=bounds.find(c=>c.key===key);if(!bound)return;input.min=bound.min;input.max=bound.max;input.value=params[key];output.textContent=bound.choices?bound.choices[params[key]]:fmt(params[key])+bound.unit;if(bound.choices)input.setAttribute('aria-valuetext',bound.choices[params[key]]);});
    }
    controlsFor(hint.model,params).forEach(c=>{
      const wrap=doc.createElement('div'),label=doc.createElement('label'),input=doc.createElement('input'),output=doc.createElement('output');
      wrap.className='t19-model-control';input.type='range';input.id=`t19-model-${id}-${c.key}`;input.min=c.min;input.max=c.max;input.step=c.step;input.value=c.value;
      input.dataset.key=c.key;label.htmlFor=input.id;label.textContent=c.label;output.htmlFor=input.id;
      const onInput=()=>{if(active){params[c.key]=Number(input.value);draw();publish();}};input.addEventListener('input',onInput);listeners.push([input,'input',onInput]);
      wrap.append(label,output,input);controls.append(wrap);inputs.push({input,output,key:c.key});
    });
    const onMeasure=()=>{if(active){measured=!measured;draw();publish();}};
    measure.addEventListener('click',onMeasure);listeners.push([measure,'click',onMeasure]);
    draw();publish();
    return ()=>{active=false;listeners.forEach(([element,type,listener])=>element.removeEventListener(type,listener));host.replaceChildren();};
  }
  return {mount,sample,render,controlsFor,restoreModel,modelNames:Object.keys(defs)};
});

</script>
<script data-inline-source="/trainers/task19-visual-app.js">
/* One statement, optional visual help, then a reasoned answer. No network or account. */
(function () {
  'use strict';
  const cards = window.Task19Data && window.Task19Data.cards;
  const el = id => document.getElementById(id);
  const key = 'mathExam.task19.visualHints.v1';
  if (!Array.isArray(cards) || !cards.length || !window.Task19Visuals) {
    el('statement').textContent = 'Не удалось загрузить задания. Обнови страницу.';
    el('hintToggle').disabled = el('btnTrue').disabled = el('btnFalse').disabled = true;
    return;
  }
  const byId = new Map();
  cards.forEach(c => { byId.set(c.id, c); (c.aliases || []).forEach(id => byId.set(id, c)); });
  const topics = [...new Set(cards.map(c => c.theme))];
  let state = { version: 1, topic: '', review: false, records: {}, current: null };
  let mounted = false, cleanup = null, storageWorks = true;
  const integer = value => Number.isFinite(value) ? Math.max(0, Math.min(1000000, Math.floor(value))) : 0;
  function readJSON(storageKey) {
    let raw;
    try { raw = localStorage.getItem(storageKey); }
    catch (_) { storageWorks = false; return null; }
    try { return raw ? JSON.parse(raw) : null; }
    catch (_) { return null; }
  }
  function canonicalRecord(id, record) {
    const card = byId.get(id);
    if (!card || !record || typeof record !== 'object') return;
    const attempts = integer(record.attempts);
    state.records[card.id] = { attempts, correct: Math.min(attempts, integer(record.correct)), needsReview: record.needsReview === true };
  }
  function restore() {
    const saved = readJSON(key);
    if (saved && saved.version === 1 && saved.records && typeof saved.records === 'object' && !Array.isArray(saved.records)) {
      Object.entries(saved.records).forEach(([id, r]) => canonicalRecord(id, r));
      state.topic = topics.includes(saved.topic) ? saved.topic : '';
      state.review = saved.review === true;
      if (saved.current && byId.has(saved.current.id)) {
        state.current = { id: byId.get(saved.current.id).id, answer: typeof saved.current.answer === 'boolean' ? saved.current.answer : null, hintOpen: saved.current.hintOpen === true, modelState: saved.current.modelState && typeof saved.current.modelState === 'object' ? saved.current.modelState : null };
      }
      return;
    }
    // Read-only import: the previous trainers' storage is never changed or deleted.
    const previous = readJSON('task19_trainer_v1');
    if (previous && previous.progress && typeof previous.progress === 'object') {
      Object.entries(previous.progress).forEach(([id, p]) => {
        if (p && typeof p === 'object') canonicalRecord(id, { attempts: p.seen, correct: p.correct, needsReview: integer(p.seen) > 0 && p.box === 1 });
      });
    }
    const oldErrors = readJSON('geometryStatements.errors.v2');
    if (Array.isArray(oldErrors)) oldErrors.forEach(error => {
      const card = error && byId.get(error.statementId);
      if (!card) return;
      if (!state.records[card.id]) state.records[card.id] = { attempts: 0, correct: 0, needsReview: true };
      state.records[card.id].needsReview = true;
    });
  }
  function save() {
    try { localStorage.setItem(key, JSON.stringify(state)); }
    catch (_) { storageWorks = false; }
    el('storageNote').textContent = storageWorks
      ? 'Результаты сохраняются в этом браузере. В прогресс учебного кабинета они не входят.'
      : 'Браузер не разрешает сохранять результаты. Тренироваться можно; после закрытия страницы новые результаты не сохранятся.';
  }
  function filtered() {
    return cards.filter(c => (!state.topic || c.theme === state.topic) && (!state.review || state.records[c.id]?.needsReview));
  }
  function pickNext() {
    const available = filtered();
    if (!available.length) return null;
    let candidates = available.filter(c => c.id !== state.current?.id);
    if (!candidates.length) candidates = available;
    const unseen = candidates.filter(c => !state.records[c.id]?.attempts);
    if (unseen.length) candidates = unseen;
    return candidates[Math.floor(Math.random() * candidates.length)];
  }
  function updateProgress() {
    const records = Object.values(state.records);
    const answered = records.reduce((n, r) => n + r.attempts, 0);
    const correct = records.reduce((n, r) => n + r.correct, 0);
    const mistakes = records.filter(r => r.needsReview).length;
    el('progressText').textContent = `Ответов: ${answered}. Верных: ${correct}. Повторить: ${mistakes}.`;
    el('topicCount').textContent = `Утверждений в выбранной теме: ${cards.filter(c => !state.topic || c.theme === state.topic).length}.`;
  }
  function closePreviousModel() {
    if (typeof cleanup === 'function') cleanup();
    cleanup = null; mounted = false;
    el('visualHost').replaceChildren();
  }
  function showHint(open) {
    if (!state.current) return;
    const card = byId.get(state.current.id);
    if (open && !mounted) {
      el('hintPrompt').textContent = card.hint.prompt;
      cleanup = window.Task19Visuals.mount(el('visualHost'), card.hint, {
        state:state.current.modelState,
        onChange:modelState=>{state.current.modelState=modelState;save();}
      });
      mounted = true;
    }
    state.current.hintOpen = open;
    el('hintPanel').hidden = !open;
    el('hintToggle').setAttribute('aria-expanded', String(open));
    el('hintToggle').textContent = open ? 'Скрыть подсказку' : 'Хочешь подсказку?';
    save();
  }
  function showAnswer() {
    const card = byId.get(state.current.id);
    const answer = state.current.answer;
    const correct = answer === card.truth;
    el('answerPanel').hidden = false;
    el('answerPanel').dataset.correct = String(correct);
    el('resultTitle').textContent = correct ? 'Да, ты прав.' : 'Давай разберёмся.';
    el('answerExplanation').textContent = `${card.truth ? 'Утверждение верное.' : 'Утверждение неверное.'} ${card.explanation}`;
    el('btnTrue').disabled = el('btnFalse').disabled = true;
    el('btnTrue').setAttribute('aria-pressed', String(answer));
    el('btnFalse').setAttribute('aria-pressed', String(!answer));
    el('nextCard').textContent = 'Следующее утверждение →';
    el('nextCard').classList.add('ready');
  }
  function render(moveFocus) {
    closePreviousModel();
    el('answerPanel').hidden = true;
    el('resultTitle').textContent = el('answerExplanation').textContent = '';
    el('hintPanel').hidden = true;
    el('hintPrompt').textContent = '';
    el('hintToggle').textContent = 'Хочешь подсказку?';
    el('hintToggle').setAttribute('aria-expanded', 'false');
    el('btnTrue').disabled = el('btnFalse').disabled = false;
    el('btnTrue').setAttribute('aria-pressed', 'false');
    el('btnFalse').setAttribute('aria-pressed', 'false');
    el('nextCard').classList.remove('ready');
    el('nextCard').textContent = 'Другое утверждение →';
    el('topicSelect').value = state.topic;
    el('reviewOnly').checked = state.review;
    if (!state.current) {
      el('topicLabel').textContent = state.topic || 'Все темы';
      el('statement').textContent = 'В выбранной теме нет ошибок для повторения.';
      el('hintToggle').hidden = el('answerActions').hidden = true;
      el('nextCard').textContent = 'Продолжить обычную тренировку →';
    } else {
      const card = byId.get(state.current.id);
      el('topicLabel').textContent = card.theme;
      el('statement').textContent = card.text;
      el('hintToggle').hidden = el('answerActions').hidden = false;
      if (state.current.hintOpen) showHint(true);
      if (typeof state.current.answer === 'boolean') showAnswer();
    }
    updateProgress(); save();
    if (moveFocus) el('statement').focus({ preventScroll: false });
  }
  function setCard(card) {
    state.current = card ? { id: card.id, answer: null, hintOpen: false } : null;
    render(true);
  }
  function answer(value) {
    if (!state.current || typeof state.current.answer === 'boolean') return;
    const card = byId.get(state.current.id);
    const record = state.records[card.id] || { attempts: 0, correct: 0, needsReview: false };
    record.attempts++;
    if (value === card.truth) record.correct++;
    record.needsReview = value !== card.truth;
    state.records[card.id] = record;
    state.current.answer = value;
    showAnswer(); updateProgress(); save();
  }
  restore();
  topics.forEach(topic => { const opt = document.createElement('option'); opt.value = topic; opt.textContent = topic; el('topicSelect').append(opt); });
  const requested = new URLSearchParams(location.search).get('card');
  if (requested && byId.has(requested)) {
    const card = byId.get(requested);
    if (state.current?.id !== card.id) state.current = { id: card.id, answer: null, hintOpen: false };
    state.topic = ''; state.review = false;
  }
  if (state.current && state.topic && byId.get(state.current.id).theme !== state.topic) state.current = null;
  if (!state.current) {
    const first = !state.review && !state.topic && !Object.keys(state.records).length ? byId.get('prev-056') : pickNext();
    state.current = first ? { id: first.id, answer: null, hintOpen: false } : null;
  }
  el('hintToggle').addEventListener('click', () => { if (state.current) showHint(!state.current.hintOpen); });
  el('btnTrue').addEventListener('click', () => answer(true));
  el('btnFalse').addEventListener('click', () => answer(false));
  el('nextCard').addEventListener('click', () => { if (!state.current) state.review = false; setCard(pickNext()); });
  el('topicSelect').addEventListener('change', () => { state.topic = el('topicSelect').value; setCard(pickNext()); });
  el('reviewOnly').addEventListener('change', () => { state.review = el('reviewOnly').checked; setCard(pickNext()); });
  document.addEventListener('keydown', event => {
    if (event.ctrlKey || event.altKey || event.metaKey || event.repeat || /INPUT|TEXTAREA|SELECT|BUTTON/.test(event.target?.tagName || '') || event.target?.isContentEditable) return;
    if (event.code === 'KeyJ' || event.code === 'KeyN') { event.preventDefault(); answer(event.code === 'KeyJ'); }
  });
  render(false);
})();

</script>
