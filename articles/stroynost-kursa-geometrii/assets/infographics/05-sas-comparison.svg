<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img"><title>Первый признак равенства треугольников</title><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#2B57C4"/></marker></defs><rect width="1200" height="760" fill="#FCFCF9"/><text x="60" y="58" text-anchor="start" style="font-size:36px;font-weight:700;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="60" dy="0">Первый признак равенства треугольников</tspan></text><text x="60" y="94" text-anchor="start" style="font-size:20px;font-weight:400;fill:#5A6B87;font-family:Arial,Segoe UI,sans-serif;"><tspan x="60" dy="0">Три доказательных маршрута в выбранных учебниках</tspan></text><rect x="55" y="160" width="335" height="470" rx="22" fill="#DCE7FF" stroke="#D9DFE9" stroke-width="2"/><text x="223" y="210" text-anchor="middle" style="font-size:29px;font-weight:700;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="223" dy="0">Атанасян</tspan></text><text x="223" y="290" text-anchor="middle" style="font-size:22px;font-weight:700;fill:#2B57C4;font-family:Arial,Segoe UI,sans-serif;"><tspan x="223" dy="0">Наложить один</tspan><tspan x="223" dy="28">треугольник на другой</tspan></text><line x1="125" y1="355" x2="320" y2="355" stroke="#D9DFE9" stroke-width="2"/><text x="223" y="405" text-anchor="middle" style="font-size:18px;font-weight:700;fill:#2E7D4F;font-family:Arial,Segoe UI,sans-serif;"><tspan x="223" dy="0">Сильная сторона:</tspan><tspan x="223" dy="23">наглядность</tspan></text><text x="223" y="515" text-anchor="middle" style="font-size:18px;font-weight:700;fill:#C24A4A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="223" dy="0">Вопрос: что разрешает</tspan><tspan x="223" dy="23">наложение?</tspan></text><rect x="440" y="160" width="335" height="470" rx="22" fill="#DDEFE5" stroke="#D9DFE9" stroke-width="2"/><text x="608" y="210" text-anchor="middle" style="font-size:29px;font-weight:700;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="608" dy="0">Погорелов</tspan></text><text x="608" y="290" text-anchor="middle" style="font-size:22px;font-weight:700;fill:#2B57C4;font-family:Arial,Segoe UI,sans-serif;"><tspan x="608" dy="0">Построить равный</tspan><tspan x="608" dy="28">треугольник в заданном</tspan><tspan x="608" dy="28">положении</tspan></text><line x1="510" y1="355" x2="705" y2="355" stroke="#D9DFE9" stroke-width="2"/><text x="608" y="405" text-anchor="middle" style="font-size:18px;font-weight:700;fill:#2E7D4F;font-family:Arial,Segoe UI,sans-serif;"><tspan x="608" dy="0">Сильная сторона: явные</tspan><tspan x="608" dy="23">аксиомы</tspan></text><text x="608" y="515" text-anchor="middle" style="font-size:18px;font-weight:700;fill:#C24A4A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="608" dy="0">Цена: более тяжёлый вход</tspan></text><rect x="825" y="160" width="335" height="470" rx="22" fill="#F7E9C7" stroke="#D9DFE9" stroke-width="2"/><text x="993" y="210" text-anchor="middle" style="font-size:29px;font-weight:700;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="993" dy="0">Мерзляк</tspan></text><text x="993" y="290" text-anchor="middle" style="font-size:22px;font-weight:700;fill:#2B57C4;font-family:Arial,Segoe UI,sans-serif;"><tspan x="993" dy="0">Опора на основное</tspan><tspan x="993" dy="28">свойство равенства,</tspan><tspan x="993" dy="28">затем наложение</tspan></text><line x1="895" y1="355" x2="1090" y2="355" stroke="#D9DFE9" stroke-width="2"/><text x="993" y="405" text-anchor="middle" style="font-size:18px;font-weight:700;fill:#2E7D4F;font-family:Arial,Segoe UI,sans-serif;"><tspan x="993" dy="0">Сильная сторона: видна</tspan><tspan x="993" dy="23">система оснований</tspan></text><text x="993" y="515" text-anchor="middle" style="font-size:18px;font-weight:700;fill:#C24A4A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="993" dy="0">Вопрос: всё ли уже</tspan><tspan x="993" dy="23">формализовано?</tspan></text><text x="600" y="690" text-anchor="middle" style="font-size:20px;font-weight:400;fill:#5A6B87;font-family:Arial,Segoe UI,sans-serif;"><tspan x="600" dy="0">Сравнивать нужно не длину доказательства, а прозрачность основания каждого шага.</tspan></text><text x="1162" y="736" text-anchor="end" style="font-size:16px;font-weight:400;fill:#5A6B87;font-family:Arial,Segoe UI,sans-serif;"><tspan x="1162" dy="0">Схема: Н. М. Алябьева · MathExam</tspan></text></svg>