name: Course visual consistency
on:
  push:
    branches: [qa/course-ui-corrected-20261109]
  pull_request:
    paths:
      - 'assets/course-ui*'
      - 'tools/course-ui.browser.cjs'
      - 'tools/stereo/task-first.browser.cjs'
      - 'tools/textbook-vilenkin-mastery.browser.cjs'
      - '.github/workflows/course-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: course-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  course-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - name: Verify exact corrected candidate source
        run: |
          git show -s --format='%H %P %T'
          test "$(git show -s --format=%P)" = "6463e076ffca4724566a196644f6d145a91ae736"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = ".github/workflows/course-ui.yml"
          git diff --exit-code HEAD^ HEAD -- assets stereo-course school courses trainers ege-baza ege-profil geometry-course geometry-merzlyak geometry-pogorelov oge vpr tools
      - name: Course screens and paired layout controls
        run: |
          npm install --prefix "$RUNNER_TEMP/course-ui" --no-save --no-package-lock --ignore-scripts playwright@1.62.1
          "$RUNNER_TEMP/course-ui/node_modules/.bin/playwright" install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/course-ui/node_modules" ARTIFACT_DIR="$RUNNER_TEMP/course-ui-evidence" node tools/course-ui.browser.cjs
      - name: Stereo learning with the shared CSS over HTTP
        if: ${{ !cancelled() }}
        run: NODE_PATH="$RUNNER_TEMP/course-ui/node_modules" STEREO_ARTIFACTS="$RUNNER_TEMP/course-ui-evidence/stereo-http" node tools/stereo/task-first.browser.cjs
      - name: Vilenkin learning with the shared CSS over HTTP
        if: ${{ !cancelled() }}
        run: NODE_PATH="$RUNNER_TEMP/course-ui/node_modules" VILENKIN_QA_ARTIFACTS="$RUNNER_TEMP/course-ui-evidence/vilenkin-http" node tools/textbook-vilenkin-mastery.browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: course-ui-evidence
          path: ${{ runner.temp }}/course-ui-evidence
          if-no-files-found: error
