<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title desc"><title id="title">Две стороны и угол между ними</title><desc id="desc">Даны AB=DE, AC=DF и равные углы A и D. Одинаковые засечки относятся к соответствующим сторонам.</desc><style>text{font-family:Arial,sans-serif;fill:#213f49;font-size:22px}.label{font-size:23px;font-style:italic}.small{font-size:18px;fill:#617579}.head{font-size:21px;font-weight:700}.line{fill:none;stroke:#213f49;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.teal{fill:none;stroke:#16746b;stroke-width:3;stroke-linecap:round}.red{fill:none;stroke:#bd654c;stroke-width:3;stroke-linecap:round}.gold{fill:none;stroke:#aa7623;stroke-width:3;stroke-linecap:round}.thin{fill:none;stroke:#617579;stroke-width:2}.dashed{stroke-dasharray:7 7}</style><rect width="900" height="440" rx="18" fill="#f5f6ef"/><text class="head" x="40" y="46">Где встречаются две данные стороны?</text><path d="M100 310 L300 310 L180 110 Z" fill="#e0ebe3" stroke="#213f49" stroke-width="3"/><path d="M570 115 L570 315 L770 195 Z" fill="#e0ebe3" stroke="#213f49" stroke-width="3"/><circle cx="100" cy="310" r="4" fill="#213f49"/><text class="label" x="93" y="340">A</text><circle cx="300" cy="310" r="4" fill="#213f49"/><text class="label" x="293" y="340">B</text><circle cx="180" cy="110" r="4" fill="#213f49"/><text class="label" x="173" y="97">C</text><circle cx="570" cy="115" r="4" fill="#213f49"/><text class="label" x="563" y="102">D</text><circle cx="570" cy="315" r="4" fill="#213f49"/><text class="label" x="563" y="345">E</text><circle cx="770" cy="195" r="4" fill="#213f49"/><text class="label" x="784" y="202">F</text><path class="line" d="M200.0 303.0 L200.0 317.0"/><path class="line" d="M132.0 211.1 L145.0 216.3"/><path class="line" d="M135.0 203.7 L148.0 208.9"/><path class="line" d="M577.0 215.0 L563.0 215.0"/><path class="line" d="M668.9 147.0 L663.7 160.0"/><path class="line" d="M676.3 150.0 L671.1 163.0"/><path class="red" d="M132 310 A32 32 0 0 0 111.9 280.3 M570 147 A32 32 0 0 0 599.7 126.9"/><text x="45" y="395">AB = DE · AC = DF · ∠BAC = ∠EDF</text></svg>