/* Общие проверки режима ?selftest=1 (канон CLAUDE.md, решение F4 делегата
   владельца). Блок побайтно одинаков в тренажёрах 16, 17, 18, 23, 24, 25;
   копии сверяет гейт tools/oge-geometry-contract.test.mjs. Каждая проверка
   дописывает ошибки в массив errs; прогресс ученика не трогается. */
const STK={
  /* чертёж: нет NaN/undefined/Infinity, все точки внутри viewBox (допуск tol) */
  svg:function(svg,tag,errs,tol){
    if(tol==null)tol=0.5;
    if(typeof svg!=='string'||svg.indexOf('<svg')<0){errs.push(tag+': нет чертежа');return;}
    if(/NaN|undefined|Infinity/.test(svg))errs.push(tag+': в чертеже NaN/undefined/Infinity');
    const vb=/viewBox="\s*(-?[\d.]+)[\s,]+(-?[\d.]+)[\s,]+(-?[\d.]+)[\s,]+(-?[\d.]+)\s*"/.exec(svg);
    if(!vb){errs.push(tag+': у чертежа нет viewBox');return;}
    const X0=+vb[1]-tol,Y0=+vb[2]-tol,X1=+vb[1]+(+vb[3])+tol,Y1=+vb[2]+(+vb[4])+tol;
    let out=0,first='';
    const at=function(x,y,what){if(!(x>=X0&&x<=X1&&y>=Y0&&y<=Y1)){out++;if(!first)first=what+' ('+Math.round(x)+'; '+Math.round(y)+')';}};
    const num=function(a,n){const m=new RegExp('\\s'+n+'="(-?[\\d.]+(?:e-?\\d+)?)"').exec(a);return m?+m[1]:null;};
    const re=/<(\w+)(\s[^>]*)?>/g;let m;
    while((m=re.exec(svg))){
      const el=m[1],a=m[2]||'';
      if(el==='svg')continue;
      [['x','y'],['x1','y1'],['x2','y2'],['cx','cy']].forEach(function(p){const x=num(a,p[0]),y=num(a,p[1]);if(x!=null&&y!=null)at(x,y,el);});
      if(el==='rect'){const x=num(a,'x')||0,y=num(a,'y')||0,w=num(a,'width'),h=num(a,'height');if(w!=null&&h!=null)at(x+w,y+h,'rect');}
      if(el==='circle'){const x=num(a,'cx'),y=num(a,'cy'),r=num(a,'r');if(x!=null&&y!=null&&r!=null){at(x-r,y,'circle');at(x+r,y,'circle');at(x,y-r,'circle');at(x,y+r,'circle');}}
      const pts=/\spoints="([^"]*)"/.exec(a);
      if(pts){const v=pts[1].trim().split(/[\s,]+/).map(Number);for(let i=0;i+1<v.length;i+=2)at(v[i],v[i+1],el);}
      const d=/\sd="([^"]*)"/.exec(a);
      if(d){/* конечные точки команд пути; относительные — от текущей точки */
        const tok=d[1].match(/[MLHVCSQTAZmlhvcsqtaz]|-?(?:\d+\.?\d*|\.\d+)(?:e-?\d+)?/g)||[];
        const need={M:2,L:2,H:1,V:1,C:6,S:4,Q:4,T:2,A:7,Z:0};
        let cx=0,cy=0,cmd='',i=0;
        while(i<tok.length){
          if(/[a-z]/i.test(tok[i])){cmd=tok[i++];if(/z/i.test(cmd))continue;}
          const n=need[cmd.toUpperCase()],rel=cmd!==cmd.toUpperCase();
          if(!n||i+n>tok.length)break;
          const v=tok.slice(i,i+n).map(Number);i+=n;
          const U=cmd.toUpperCase();
          if(U==='H'){cx=rel?cx+v[0]:v[0];}
          else if(U==='V'){cy=rel?cy+v[0]:v[0];}
          else{const ex=v[n-2],ey=v[n-1];cx=rel?cx+ex:ex;cy=rel?cy+ey:ey;}
          at(cx,cy,'path');
          if(U==='M')cmd=rel?'l':'L';
        }
      }
    }
    if(out)errs.push(tag+': за рамкой viewBox '+out+' точек, первая — '+first);
  },
  /* текст задачи и решения: нет null, undefined, NaN, Infinity и «1√» */
  text:function(html,tag,errs){
    const t=String(html).replace(/<[^>]*>/g,' ');
    const m=/\bnull\b|\bundefined\b|\bNaN\b|Infinity|(^|[^\d,.])1√/.exec(t);
    if(m)errs.push(tag+': в тексте «'+m[0].trim()+'»');
  },
  /* последний шаг разбора содержит проверяемый ответ хотя бы в одной записи */
  last:function(step,forms,tag,errs){
    const t=String(step==null?'':step).replace(/<[^>]*>/g,'').replace(/&nbsp;/g,' ').replace(/\s+/g,' ');
    const norm=function(f){return String(f).replace(/<[^>]*>/g,'').replace(/&nbsp;/g,' ').replace(/\s+/g,' ').trim();};
    if(!forms.some(function(f){return f!=null&&norm(f)!==''&&t.indexOf(norm(f))>=0;}))
      errs.push(tag+': последний шаг не содержит ответ ('+forms.filter(function(f){return f!=null;}).join(' / ')+')');
  },
  /* ловушки {v, e, m}: ни одна не принимается как ответ, разные сообщения не ловят одно число */
  traps:function(list,tag,errs,isAns){
    (list||[]).forEach(function(t,i){
      if(!isFinite(t.v)){errs.push(tag+': ловушка — не число');return;}
      if(isAns(t.v))errs.push(tag+': ловушка '+t.v+' совпадает с ответом');
      for(let j=i+1;j<list.length;j++){const u=list[j];
        if(u.m!==t.m&&Math.abs(t.v-u.v)<=(t.e||0)+(u.e||0))errs.push(tag+': ловушки '+t.v+' и '+u.v+' ловят одно число');}
    });
  },
  /* итог в консоль: маркер <ИМЯ>_SELFTEST_OK или _FAIL с числом ошибок */
  done:function(name,errs){
    if(typeof console==='undefined')return;
    if(!errs.length){console.log(name+'_SELFTEST_OK');return;}
    console.log(name+'_SELFTEST_FAIL '+errs.length);
    errs.slice(0,30).forEach(function(e){console.log('  '+e);});
  }
};
/*__SELFTEST_KIT_END__*/
/* общие проверки одной задачи: чертёж в рамке, текст без null/NaN, последний шаг с ответом, ловушки */
function stkTask(t,tag,errs){
  STK.svg(t.fig.svg,tag,errs);
  STK.text([t.text].concat(t.steps.map(s=>s.q+' '+s.show)).join(' '),tag,errs);
  STK.last(t.steps[t.steps.length-1].show,[fmtNum(t.ans)],tag,errs);
  STK.traps(t.diag,tag,errs,v=>eqAns(v,t.ans));
}
/* ================= Self-test (?selftest=1): математика, чертёж, ловушки, лестницы ================= */
function auditFig(f,errs,tag){
  if(!f||!f.svg){errs.push(tag+': нет фигуры');return;}
  if(!/^<svg[\s>]/.test(f.svg)||!/<\/svg>$/.test(f.svg)){errs.push(tag+': повреждён svg');return;}
  for(const c of f.chk||[]){
    if(c.t==='ang'){const a=angleAt(c.V,c.P,c.Q);if(Math.abs(a-c.want)>1.2)errs.push(tag+': угол '+n2(a)+'° ≠ '+n2(c.want)+'°');}
    else if(c.t==='ratio'){const r=dist(c.a[0],c.a[1])/dist(c.b[0],c.b[1]);if(Math.abs(r-c.want)>0.005*Math.max(1,c.want))errs.push(tag+': отношение длин '+n2(r)+' ≠ '+n2(c.want));}
    else if(c.t==='onseg'){const L=dist(c.A,c.B),s=dist(c.A,c.P)+dist(c.P,c.B)-L;if(s>0.6)errs.push(tag+': точка не на отрезке ('+n2(s)+'px)');}
    else if(c.t==='mid'){const M={x:(c.A.x+c.B.x)/2,y:(c.A.y+c.B.y)/2};if(dist(M,c.P)>0.6)errs.push(tag+': точка не середина отрезка');}
    else if(c.t==='circ'){const d=Math.abs(dist(c.P,c.c)-c.R);if(d>0.8)errs.push(tag+': точка не на окружности ('+n2(d)+'px)');}
    else if(c.t==='dline'){const d=Math.abs(distToLine(c.c,c.A,c.B)-c.R);if(d>0.8)errs.push(tag+': окружность не касается стороны ('+n2(d)+'px)');}
    else errs.push(tag+': неизвестная проверка чертежа');
  }
}
/* числа в тексте (для правила D20: подсказка и ловушка не называют число ответа);
   noDeg — без чисел с «°»: градусы не спутать с ответом, если ответ не угол */
function numsIn(h,noDeg){const r=[];plain(h).replace(/(\d+(?:[.,]\d+)?)(\s*°)?/g,(m,x,d)=>{if(!(noDeg&&d))r.push(parseFloat(x.replace(',','.')));return m;});return r;}
function selftest(N){
  N=N||40;
  const errs=[],uniq={};
  let figs=0,full=0,total=0;
  const keys=Object.keys(SUBS);
  if(JSON.stringify(keys)!==JSON.stringify(TYPE_IDS))errs.push('ключи SUBS не совпадают с TYPE_IDS');
  const run=(t,tag)=>{
    if(!isFinite(t.ans)||t.ans<=0)errs.push(tag+': плохой ответ '+t.ans);
    else if(!isFin(t.ans))errs.push(tag+': ответ не записывается конечной десятичной дробью: '+t.ans);
    if(!t.text||t.text.length<40)errs.push(tag+': подозрительно короткое условие');
    if(!t.steps.length)errs.push(tag+': нет лестницы');
    t.steps.forEach((s,i)=>{
      if(!s.q||!s.show||!isFinite(s.a))errs.push(tag+': ступень '+(i+1)+' неполная');
      else if(isDec(s.a)&&plain(s.show).indexOf(fmtNum(s.a))<0)errs.push(tag+': ступень '+(i+1)+' не показывает свой результат '+fmtNum(s.a));
      if(!s.chk)errs.push(tag+': у ступени '+(i+1)+' нет подсказки «что проверить»');
    });
    if(t.steps.length&&!eqAns(t.steps[t.steps.length-1].a,t.ans))errs.push(tag+': последняя ступень ≠ ответу');
    const given=numsIn(t.text),noDeg=!/в градусах/.test(t.text);
    const leak=t.steps.map(s=>s.hint||'').concat(t.diag.map(d=>d.m)).find(h=>numsIn(h,noDeg).some(x=>eqAns(x,t.ans)&&!given.some(g=>eqAns(g,t.ans))));
    if(leak)errs.push(tag+': подсказка или ловушка называет число ответа: «'+plain(leak).slice(0,70)+'»');
    auditFig(t.fig,errs,tag); stkTask(t,tag,errs); figs++;
    const lc=labelClashes(t.fig.svg); if(lc.n)errs.push(tag+': подписи чертежа налезают друг на друга ('+lc.first+')');
    const lo=labelOwners(t.fig.svg); if(lo.n)errs.push(tag+': подпись стоит у чужой точки ('+lo.first+')');
  };
  for(const k of keys){
    const sub=SUBS[k];
    ['topic','name','ref','refWhy','law','gen','proto','calc','text','fig','steps','diag'].forEach(f=>{if(sub[f]==null)errs.push(k+': нет поля '+f);});
    if(!TOPICS[sub.topic])errs.push(k+': неизвестная тема');
    if(!REFS.find(r=>r.id===sub.ref))errs.push(k+': нет карточки справочника '+sub.ref);
    try{run(build(k,sub.proto,{kind:'proto'}),k+'(proto)');}catch(ex){errs.push(k+'(proto): исключение '+ex.message);}
    uniq[k]=new Set();let kinds=0;
    for(let i=0;i<N;i++){
      let t;
      try{t=buildGen(k);}catch(ex){errs.push(k+': исключение '+ex.message);break;}
      run(t,k+' '+JSON.stringify(t.p));
      total++; if(t.full)full++; uniq[k].add(plain(t.text)); kinds=Math.max(kinds,t.trapsDefined);
    }
    if(kinds<2)errs.push(k+': у типа меньше двух ловушек');
  }
  if(total&&full/total<0.7)errs.push('доля задач с полным набором ловушек '+Math.round(100*full/total)+'% < 70% (решение D7)');
  // карта листа, пины, справочник
  const pinIds=new Set();
  for(const p of PINS){
    if(pinIds.has(p.id))errs.push('пин-дубль '+p.id); pinIds.add(p.id);
    if(!SHEET_MAP.items.some(x=>x.id===p.sheet))errs.push('пин '+p.id+': нет блока листа '+p.sheet);
    if(!p.subs.length)errs.push('пин '+p.id+': нет типов');
    p.subs.forEach(k=>{if(!SUBS[k])errs.push('пин '+p.id+': неизвестный тип '+k);});
    p.refs.forEach(r=>{if(!REFS.find(x=>x.id===r))errs.push('пин '+p.id+': неизвестная карточка '+r);});
    if(!p.why||p.why.length<25)errs.push('пин '+p.id+': пустое «зачем»');
  }
  REFS.forEach(r=>{if(r.sheet&&!SHEET_MAP.items.some(x=>x.id===r.sheet))errs.push('карточка '+r.id+': нет блока листа '+r.sheet);});
  SHEET_MISSING.forEach(m=>{if(!REFS.find(x=>x.id===m.ref))errs.push('«нет на листе»: неизвестная карточка '+m.ref);});
  // зачёт: квоты
  let q=0;for(const tk in QUIZ_QUOTA){const pool=[...new Set(variantsForTopic(tk).map(v=>v.k))];q+=QUIZ_QUOTA[tk];
    if(pool.length<QUIZ_QUOTA[tk])errs.push('зачёт: в теме '+tk+' меньше типов, чем квота');}
  if(q!==QUIZ_TOTAL)errs.push('зачёт: сумма квот '+q+' ≠ '+QUIZ_TOTAL);
  // разбор ответа: запятая и точка
  if(parseAns('2,5')!==2.5||parseAns('2.5')!==2.5||parseAns(' 7 ')!==7||!isNaN(parseAns(''))||parseAns('5/13')!==5/13)errs.push('разбор ответа: 2,5 / 2.5 / 5/13');
  const u={};for(const k in uniq)u[k]=uniq[k].size;
  return {ok:errs.length===0,errs:errs.slice(0,80),all:errs,figs,full:total?full/total:1,uniq:u};
}

/* ================= Инициализация ================= */
window.__oge15={SUBS,TYPE_IDS,TOPICS,REFS,PINS,TASK_VARIANTS,build,buildGen,buildVariant,variantsForTopic,variantsForPin,openReviewVariants,logTaskVerdict,selftest,parseAns,eqAns,matchDiag,switchTab,mulberry32,
  debug:()=>({tr,qz,st,streak,TAB,rzOpen,rzVariant,rzStep,rzAns,trSubOnly,trVariantOnly,trTopic,trReview,pinOpen}),
  /* для браузерного гейта: тренировка на задаче типа k с параметрами p (без p — из генератора) */
  trainWith:(k,p)=>{stashMain();trReview=false;trReviewEmpty=false;trSubOnly=k;trVariantOnly=null;tr={t:p?build(k,p,{kind:'gen'}):buildGen(k),missed:false,shown:false,done:false,ladder:false};TAB='train';markTab('train');render();}};
(function init(){
  if(typeof document==='undefined')return;
  let selftestMode=false;
  try{selftestMode=/(?:\?|&)selftest=1/.test(location.search);}catch(e){}
  if(selftestMode){
    const r=selftest(40);
    $('#main').innerHTML=`<div class="fin"><div class="score" style="color:${r.ok?'#16a34a':'#dc2626'}">${r.ok?'SELFTEST OK':'SELFTEST FAIL'}</div>
      <div class="smallnote">типов: ${TYPE_IDS.length} · проверено чертежей: ${r.figs} · полный набор ловушек: ${Math.round(100*r.full)}%</div>
      ${r.errs.length?`<div class="route"><ul>${r.errs.map(e=>`<li>${esc(e)}</li>`).join('')}</ul></div>`:''}</div>`;
    STK.done('OGE_TASK15',r.all);
    return;
  }
  document.addEventListener('pointerdown',()=>{userActed=true;},true);
  document.addEventListener('keydown',()=>{userActed=true;},true);
  $$('.tab').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));
  switchTab(CP.REVIEW?'train':TAB);   // ?mode=review — сразу работа над ошибками
})();
</script>
