<script>
'use strict';
const {SKILLS,TASKS}=globalThis.EgeBazaDataContent;
/*__DATA_APP__*/
const KEY='mathexam.ege-baza.data.v1';
const DAY=24*60*60*1000;
const PHASES={diagnostic:'Входная диагностика',checkpoint:'Итоговая проверка',repeat:'Повторная проверка'};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>String(Math.round(n*1e8)/1e8).replace('.',',');
const list=(phase,skill)=>TASKS.filter(t=>t.phase===phase&&(!skill||t.skill===skill));
const blank=()=>({v:1,practice:{},runs:{}});
function parseNumber(raw){const s=String(raw).trim().replace(/,/g,'.').replace(/^−/,'-');return /^[+-]?(?:\d+(?:\.\d+)?|\.\d+)$/.test(s)&&Number.isFinite(Number(s))?Number(s):null;}
function right(t,raw){const n=parseNumber(raw);return n!==null&&Math.abs(n-t.answer)<1e-8;}
function validState(raw){
 const out=blank();if(!raw||raw.v!==1)return out;
 for(const t of list('practice')){const r=raw.practice?.[t.id];if(!r||typeof r!=='object')continue;
  const tries=Number.isInteger(r.tries)&&r.tries>=0?Math.min(r.tries,100000):0;
  const answer=typeof r.answer==='string'?r.answer.slice(0,120):'';
  out.practice[t.id]={tries,hints:r.hints===true,solution:r.solution===true,answer,done:r.done===true&&tries>0&&right(t,answer)};
 }
 for(const phase of Object.keys(PHASES)){const r=raw.runs?.[phase];if(!r||typeof r!=='object')continue;
  const answers={};let contiguous=true;
  for(const t of list(phase)){const v=r.answers?.[t.id];if(contiguous&&(v===null||(typeof v==='string'&&parseNumber(v)!==null)))answers[t.id]=v===null?null:v.slice(0,120);else contiguous=false;}
  const complete=Object.keys(answers).length===list(phase).length;
  out.runs[phase]={answers,helped:r.helped===true,finishedAt:complete&&Number.isFinite(r.finishedAt)&&r.finishedAt>0?r.finishedAt:null};
 }
 return out;
}
let canSave=true,storageNotice='',observedStorageText=null;
function warn(text){storageNotice=text;$('storage-warning').textContent=text;$('storage-warning').hidden=!text;}
function load(){try{const text=localStorage.getItem(KEY);observedStorageText=text;if(!text)return blank();const raw=JSON.parse(text);if(!raw||raw.v!==1){warn('Сохранение этого модуля не удалось прочитать. Показан новый маршрут; данные других тренажёров не затронуты.');return blank();}return validState(raw);}catch(e){warn('Сохранение недоступно или повреждено. Можно заниматься и скачать отчёт, но прогресс может не пережить закрытие страницы.');return blank();}}
let state=load();
function refreshStored(required=false){
 try{if(localStorage.getItem(KEY)===observedStorageText)return false;}catch(e){if(required)throw e;return false;}
 state=load();warn('Сохранение изменилось в другой вкладке или было восстановлено. Показана новая версия; повторите действие после проверки результатов.');return true;
}
function save(){
 try{if(refreshStored(true)){render();return false;}const text=JSON.stringify(state);localStorage.setItem(KEY,text);observedStorageText=text;return true;}catch(e){canSave=false;warn('Браузер не разрешил сохранение. Перед закрытием страницы скачайте отчёт в разделе «Мой прогресс».');return false;}
}
// Catch stale restored data before an old form can overwrite it.
for(const type of ['click','submit'])document.addEventListener(type,e=>{if(refreshStored()){e.preventDefault();e.stopImmediatePropagation();render();}},true);
function practiceRec(t){return state.practice[t.id]||(state.practice[t.id]={tries:0,hints:false,solution:false,done:false,answer:''});}
function independent(r){return !!r?.done&&r.tries===1&&!r.hints&&!r.solution;}
function result(phase,skill){const run=state.runs[phase];const ts=list(phase,skill);return {finished:!!run?.finishedAt,total:ts.length,correct:ts.filter(t=>run&&Object.hasOwn(run.answers,t.id)&&right(t,run.answers[t.id])).length,helped:!!run?.helped};}
function skillState(s){
 const p=list('practice',s.id),solo=p.filter(t=>independent(state.practice[t.id])).length,done=p.filter(t=>state.practice[t.id]?.done).length;
 const c=result('checkpoint',s.id),r=result('repeat',s.id),d=result('diagnostic',s.id);
 const level=r.finished&&r.correct===r.total&&!r.helped?4:c.finished&&c.correct===c.total&&!c.helped?3:solo>=3?2:done?1:0;
 return {solo,done,level,label:['Начать знакомство','Тренируюсь','Решаю самостоятельно','Проверка пройдена','Подтверждено повторением'][level],d,c,r};
}
function recommended(){return SKILLS.find(s=>{const st=skillState(s);return st.level<3&&(!st.d.finished||st.d.correct<st.d.total);})||SKILLS.find(s=>skillState(s).level<3)||null;}
function route(hash){if(location.hash===hash)render();else location.hash=hash;}
function btn(text,action,cls='secondary',extra=''){return `<button class="btn ${cls}" data-action="${action}" ${extra}>${text}</button>`;}
function markLearning(){let changed=false;for(const run of Object.values(state.runs)){if(!run.finishedAt&&!run.helped){run.helped=true;changed=true;}}if(changed)save();}
function grid(n,cls='grid100'){return `<div class="${cls}" aria-hidden="true">${Array.from({length:100},(_,i)=>`<i class="${i<n?'on':''}"></i>`).join('')}</div>`;}
function renderMap(){
 const done=SKILLS.filter(s=>skillState(s).level>=3).length,rec=recommended(),d=state.runs.diagnostic;
 $('main').innerHTML=`<section class="hero"><div><span class="eyebrow">Базовый ЕГЭ · Модуль 02</span><h1>Данные, графики<br>и логика</h1><p>Научитесь извлекать данные из рисунка, оценивать случайность и проверять выводы из условия.</p><div class="actions">${btn(d?.finishedAt?'Посмотреть диагностику':d?'Продолжить диагностику':'Найти точку старта','start-diagnostic','gold')}${btn('Выбрать тему','scroll-skills','secondary')}</div><p class="small">4 навыка · 16 тренировочных задач · проверка и повторение</p></div><div class="hero-art"><span class="eyebrow">Из наблюдения — в вывод</span><div class="equation">Данные → смысл</div><div class="art-caption">Что дано? Что нужно найти? Как проверить?</div></div></section>
 <section class="panel recommend"><span class="eyebrow">Следующий шаг</span><h3>${rec?esc(rec.title):'Вернитесь к навыкам на повторной проверке'}</h3><p>${!d?.finishedAt?'Начните с 8 коротких заданий. Они помогут выбрать темы для повторения. Можно сразу открыть любой урок.':rec?'Диагностика задаёт направление, а итоговая проверка показывает, что получается самостоятельно.':'Все четыре навыка подтверждены в проверке. Закрепите их на новых заданиях спустя сутки.'}</p><div class="actions">${rec?btn('Открыть урок','learn-'+rec.id):btn('К проверкам','checks')}</div></section>
 <div class="section-head" id="skills"><div><span class="eyebrow">Ваш маршрут</span><h2>Четыре опорных навыка</h2></div><p class="muted small">Подтверждено в проверке: <b>${done} из 4</b></p></div>
 <div class="cards">${SKILLS.map((s,i)=>{const st=skillState(s);return `<article class="card"><div class="card-head"><span class="num">0${i+1}</span><span class="tag ${st.level<2?'gold':''}">${st.label}</span></div><h3>${esc(s.title)}</h3><p>${esc(s.desc)}</p><div class="steps" aria-label="Этап ${st.level} из 4">${[1,2,3,4].map(n=>`<i class="${st.level>=n?'on':''}"></i>`).join('')}</div><p class="small">С первого раза без помощи: ${st.solo} из 4${st.d.finished?` · Старт: ${st.d.correct}/2`:''}</p><div class="actions">${btn('Разобраться','learn-'+s.id,'secondary small')}${btn('Практика','practice-'+s.id+'-0','small')}</div></article>`;}).join('')}</div>
 <section class="panel" style="margin-top:22px"><h3>Как растёт прогресс</h3><p>Три разных тренировочных задания с первого раза без помощи дают отметку «Решаю самостоятельно». Два верных ответа по навыку в итоговой проверке подтверждают его. Повторная проверка через сутки использует другой набор задач.</p><p class="small muted">Этот модуль — часть курса. Все задания базового ЕГЭ доступны в <a href="../">экзаменационном тренажёре</a>.</p></section>`;
}
const modelHTML=globalThis.EgeBazaDataVisuals.modelHTML,updateModel=globalThis.EgeBazaDataVisuals.updateModel;
function visual(t){return globalThis.EgeBazaDataVisuals.draw(t.visual);}
function renderLearn(id){const s=SKILLS.find(s=>s.id===id);if(!s){route('#map');return;}markLearning();
 $('main').innerHTML=`<span class="eyebrow">Разобраться · Навык ${SKILLS.indexOf(s)+1} из 4</span><h1 class="lesson-title">${esc(s.title)}</h1><div class="two"><section class="panel"><h3>Что нужно понять</h3><ol>${s.lesson.map(p=>`<li>${esc(p)}</li>`).join('')}</ol><div class="model">${modelHTML(s)}</div></section><aside class="stack"><section class="panel"><span class="eyebrow">Цель урока</span><h3>${esc(s.goal)}</h3><p class="small muted">Пригодится: ${esc(s.exam)}.</p><div class="actions">${btn('Попробовать самостоятельно','practice-'+id+'-0')}</div></section><section class="panel"><h3>Нужен ещё один шаг?</h3><p>Откройте подробный тренажёр. Он работает отдельно; вернувшись, продолжите практику здесь.</p><p><a href="${s.link}" target="_blank" rel="noopener">${esc(s.linkTitle)} ↗</a></p></section><section class="panel"><h3>Объясните своими словами</h3><p>Почему выбранное действие работает? Как проверить результат другим способом?</p></section></aside></div>`;
 $('slider').addEventListener('input',()=>updateModel(s));$('example')?.addEventListener('change',()=>updateModel(s));updateModel(s);
}
function renderPractice(id,index){const s=SKILLS.find(s=>s.id===id);if(!s){route('#map');return;}markLearning();const tasks=list('practice',id),i=Math.max(0,Math.min(tasks.length-1,index||0)),t=tasks[i],r=practiceRec(t);
 $('main').innerHTML=`<div class="task-top"><div><span class="eyebrow">Самостоятельная практика</span><h2>${esc(s.title)}</h2></div>${btn('К объяснению','learn-'+id,'secondary small')}</div><div class="mini-nav" aria-label="Задания навыка">${tasks.map((q,j)=>`<button class="${i===j?'active':''} ${state.practice[q.id]?.done?'done':''}" data-action="practice-${id}-${j}" aria-label="Задание ${j+1}${state.practice[q.id]?.done?', решено':''}" ${i===j?'aria-current="step"':''}>${j+1}</button>`).join('')}</div>
 <section class="panel"><span class="eyebrow">Задача ${i+1} из ${tasks.length}</span><p class="prompt">${esc(t.text)}</p>${visual(t)}${r.done?`<div class="feedback"><b>${independent(r)?'Верно с первого раза — самостоятельно':r.hints||r.solution?'Верно — с поддержкой':'Верно после исправления'}</b><p>Ответ: ${fmt(t.answer)} ${esc(t.unit)}.</p><p>${esc(t.solution)}</p></div><div class="actions">${i<3?btn('Следующая задача','practice-'+id+'-'+(i+1)):btn('К карте навыков','map')}${btn('К проверкам','checks','secondary')}</div>`:`<form id="answer-form"><label for="answer">Ваш ответ ${t.unit?'('+esc(t.unit)+')':''}</label><p class="small muted" id="answer-format">Одно число без единиц. Можно использовать запятую или точку.</p><div class="answer-row"><input id="answer" inputmode="decimal" autocomplete="off" aria-describedby="answer-format feedback" value="${esc(r.answer)}"><button class="btn" type="submit">Проверить</button></div></form><div id="feedback" role="status" class="feedback" ${r.hints||r.solution?'':'hidden'}>${r.solution?esc(t.solution):r.hints?esc(t.hint):''}</div><div class="actions">${btn('Подсказка','hint','secondary small')}${btn('Разобрать решение','solution','secondary small')}</div><p class="small muted" style="margin-top:14px">Помощь доступна всегда. После подсказки задача учитывается как решённая с поддержкой.</p>`}</section>`;
 if(!r.done){$('answer-form').addEventListener('submit',e=>{e.preventDefault();const input=$('answer').value;if(parseNumber(input)===null){feedback('Введите одно число, например 0,75. Пустой ответ и выражения не засчитываются.','bad');return;}r.answer=input.trim();r.tries++;r.done=right(t,input);save();if(r.done){renderPractice(id,i);$('main').focus();}else feedback('Пока не совпало. Проверьте действие и вычисление. Можно воспользоваться подсказкой.','bad');});$('main').querySelector('[data-action="hint"]').onclick=()=>{r.hints=true;save();feedback(t.hint,'tip');};$('main').querySelector('[data-action="solution"]').onclick=()=>{r.solution=true;save();feedback(t.solution,'tip');};}
}
function feedback(message,kind=''){const f=$('feedback');f.hidden=false;f.className='feedback '+kind;f.textContent=message;}
function repeatAvailable(){const at=state.runs.checkpoint?.finishedAt;return !!at&&Date.now()>=at+DAY;}
function renderChecks(){const ready=repeatAvailable();const unlock=state.runs.checkpoint?.finishedAt;const labels={diagnostic:'Определить, что уже получается. 8 заданий, без оценки за курс.',checkpoint:'Проверить четыре навыка на другом наборе из 8 заданий.',repeat:unlock?`Новые 8 заданий для проверки сохранения навыков. Доступно с ${new Date(unlock+DAY).toLocaleString('ru-RU')}.`:'Откроется через 24 часа после завершения итоговой проверки.'};
 $('main').innerHTML=`<span class="eyebrow">Самостоятельность и повторение</span><h1>Проверить себя</h1><p class="muted" style="margin-top:18px">Решайте на бумаге, записывайте только ответ. Разбор появится после завершения всей работы.</p><div class="cards" style="margin-top:24px">${Object.entries(PHASES).map(([phase,title],i)=>{const r=state.runs[phase],res=result(phase);return `<section class="card"><span class="num">0${i+1}</span><h3>${title}</h3><p>${labels[phase]}</p>${res.finished?`<p><b>Результат: ${res.correct} из ${res.total}</b>${res.helped?' · с обращением к обучению':''}</p>`:''}<div class="actions">${btn(res.finished?'Посмотреть разбор':r?'Продолжить':'Начать','start-'+phase,'',phase==='repeat'&&!ready&&!res.finished?'disabled':'')}</div></section>`;}).join('')}</div><section class="panel" style="margin-top:24px"><h3>Честная проверка</h3><p>У каждой проверки свой фиксированный набор. Повторное открытие показывает ваш результат, а не выдаёт знакомые задачи за новую попытку. Пропущенные задания учитываются как нерешённые.</p><p>Если во время проверки открыть урок или практику этого модуля, результат будет отмечен как учебный, с обращением к объяснениям.</p></section>`;
}
function startRun(phase){if(!PHASES[phase])return;if(phase==='repeat'&&!repeatAvailable())return route('#checks');if(state.runs[phase]?.finishedAt)return route('#results-'+phase);if(!state.runs[phase]){state.runs[phase]={answers:{},finishedAt:null,helped:false};save();}route('#test-'+phase);}
function renderTest(phase){const run=state.runs[phase];if(!run||!PHASES[phase])return route('#checks');if(run.finishedAt)return route('#results-'+phase);if(phase==='repeat'&&!repeatAvailable())return route('#checks');const ts=list(phase);const index=ts.findIndex(t=>!Object.hasOwn(run.answers,t.id));if(index<0){run.finishedAt=Date.now();save();return route('#results-'+phase);}const t=ts[index];
 $('main').innerHTML=`<span class="eyebrow">${PHASES[phase]}</span><div class="task-top"><h2>Задание ${index+1} из ${ts.length}</h2><span class="tag">Разбор после завершения</span></div><div class="progress" role="progressbar" aria-label="Выполнено заданий" aria-valuenow="${index}" aria-valuemin="0" aria-valuemax="${ts.length}"><span style="width:${index/ts.length*100}%"></span></div>${run.helped?'<p class="notice">Вы обращались к урокам или практике во время этой проверки. Она будет отмечена как учебная.</p>':''}<section class="panel"><p class="prompt">${esc(t.text)}</p>${visual(t)}<form id="answer-form"><label for="answer">Ответ ${t.unit?'('+esc(t.unit)+')':''}</label><p class="small muted" id="answer-format">Число с запятой или точкой, без единиц измерения.</p><div class="answer-row"><input id="answer" inputmode="decimal" autocomplete="off" aria-describedby="answer-format feedback"><button class="btn" type="submit">${index===ts.length-1?'Завершить проверку':'Сохранить и дальше'}</button></div></form><div id="feedback" class="feedback" role="status" hidden></div><div class="actions">${btn('Пока не знаю','skip','secondary small')}</div><p class="small muted" style="margin-top:14px">Ответ сохраняется сразу. После перехода к следующему заданию изменить его нельзя.</p></section>`;
 function submit(value){run.answers[t.id]=value;if(Object.keys(run.answers).length===ts.length)run.finishedAt=Date.now();save();render();}
 $('answer-form').addEventListener('submit',e=>{e.preventDefault();const val=$('answer').value;if(parseNumber(val)===null)return feedback('Запишите число или нажмите «Пока не знаю».','bad');submit(val.trim());});$('main').querySelector('[data-action="skip"]').onclick=()=>submit(null);
}
function renderResults(phase){const run=state.runs[phase];if(!PHASES[phase]||!run?.finishedAt)return route('#checks');const res=result(phase),rec=recommended();
 $('main').innerHTML=`<span class="eyebrow">${PHASES[phase]} · Результат</span><section class="panel"><div class="medal" aria-hidden="true">${res.correct===res.total?'✓':'↗'}</div><h2>${res.correct===res.total?'Все задания решены верно':'Теперь понятно, что повторить'}</h2><p class="score">${res.correct} <span class="muted">/ ${res.total}</span></p><p>${run.helped?'Проверка выполнена с обращением к обучению. Она не повышает отметку самостоятельности.':phase==='diagnostic'?'Это стартовый срез. Навыки подтвердятся на итоговой проверке.':'Результат проверки без подсказок внутри модуля.'}</p><div class="summary-list">${SKILLS.map(s=>{const r=result(phase,s.id);return `<div class="summary-row"><span>${esc(s.title)}</span><span><b>${r.correct}/2</b> · <a href="#learn-${s.id}">Повторить</a></span></div>`;}).join('')}</div><div class="actions">${btn('К моему маршруту','map')}${btn('Скачать отчёт','download','secondary')}${rec?btn('Открыть '+rec.title,'learn-'+rec.id,'secondary'):''}</div></section><div class="section-head"><h2>Разбор заданий</h2></div><div class="result-list">${list(phase).map((t,i)=>{const val=run.answers[t.id],ok=right(t,val);return `<article class="result-item ${ok?'good':'bad'}"><span class="eyebrow">Задание ${i+1} · ${ok?'Верно':'Повторить'}</span><p>${esc(t.text)}</p>${visual(t)}<p class="small">Ваш ответ: <b>${val===null?'пропущено':esc(val)}</b>. Верный ответ: <b>${fmt(t.answer)} ${esc(t.unit)}</b>.</p><p>${esc(t.solution)}</p></article>`;}).join('')}</div>`;
}
function report(){const out=['MathExam · Базовый ЕГЭ','Модуль 2: Данные, графики и логика','Сформировано: '+new Date().toLocaleString('ru-RU'),'Прогресс одного браузера; автоматической отправки преподавателю нет.',''];
 for(const s of SKILLS){const st=skillState(s);out.push(s.title+': '+st.label,`  Практика: ${st.done}/4 решено, ${st.solo}/4 с первого раза без помощи.`);}
 for(const [phase,name] of Object.entries(PHASES)){const r=result(phase),run=state.runs[phase];out.push('',name+': '+(r.finished?`${r.correct}/${r.total}, ${new Date(run.finishedAt).toLocaleString('ru-RU')}${r.helped?', с обращением к обучению':''}`:run?`не завершена, ответов ${Object.keys(run.answers).length}/${r.total}`:'ещё не начата'));if(r.finished)for(const s of SKILLS){const x=result(phase,s.id);out.push('  '+s.title+': '+x.correct+'/2');}}
 const weak=SKILLS.filter(s=>skillState(s).level<3);out.push('','Для дальнейшей работы: '+(weak.length?weak.map(s=>s.title).join('; '):'повторная проверка на сохранение навыков.'));return out.join('\n');
}
function downloadReport(){const url=URL.createObjectURL(new Blob([report()],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='mathexam-baza-module-2-report.txt';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function renderReport(){const confirmed=SKILLS.filter(s=>skillState(s).level>=3).length;$('main').innerHTML=`<span class="eyebrow">Что уже получается</span><h1>Мой прогресс</h1><div class="two"><section class="panel"><h3>Подтверждено навыков: ${confirmed} из 4</h3><p>Отметка за модуль отражает только эти четыре навыка и не является прогнозом оценки за весь ЕГЭ.</p><label class="sr" for="report-text">Отчёт преподавателю</label><textarea class="report" id="report-text" readonly>${esc(report())}</textarea><div class="actions">${btn('Скачать отчёт','download')}${btn('Выделить текст','select-report','secondary')}</div></section><aside class="stack"><section class="panel"><h3>Сохранение</h3><p>Результаты доступны в этом браузере на этом устройстве. Для передачи преподавателю скачайте отчёт или скопируйте текст.</p><p><a href="../../../ege-baza/#backup?module=m02">Скачать или восстановить резервную копию</a> для продолжения работы в другом браузере.</p></section><section class="panel"><h3>Начать модуль заново</h3><p>Удалится только прогресс этого модуля. Сначала можно сохранить отчёт.</p><div class="actions"><button class="danger" data-action="reset-ask">Сбросить мой прогресс</button></div><div id="reset-confirm" hidden><p>Удалить диагностику, практику и проверки этого модуля?</p><div class="actions"><button class="danger" data-action="reset-confirm">Да, удалить</button>${btn('Отмена','reset-cancel','secondary')}</div></div></section></aside></div>`;}
function renderTeacher(){$('main').innerHTML=`<span class="eyebrow">Второй модуль курса · Мини-группа</span><h1>Преподавателю</h1><div class="two"><section class="panel"><h3>Рабочая последовательность</h3><ol><li>Дайте входную диагностику. В отчёте видны четыре направления, но два вопроса по навыку — ориентир, а не полный диагноз.</li><li>Выберите общую тему для группы. Вычислительные пробелы назначайте для короткой самостоятельной работы.</li><li>На занятии обсудите интерактивную модель. Попросите ученика предсказать изменение до движения ползунка. Отдельно обсудите единицы на оси, дополнение вероятности до 1 и разницу между высотой графика и наклоном.</li><li>После практики проведите итоговую проверку. Используются задания, которых нет в тренировочном наборе.</li><li>Не раньше чем через сутки предложите повторную проверку на отдельном наборе. Уточните причины ошибок по записи решения.</li></ol><p>Отчёт ученик передаёт сам. Здесь нет общего журнала группы или автоматической отправки результатов.</p></section><aside class="panel"><h3>Объём первой версии</h3><p>40 авторских заданий: 8 входных, 16 тренировочных, 8 итоговых и 8 для повторения. Наборы фиксированы.</p><p>Модуль охватывает основные действия с данными, вероятностью, графиками и утверждениями. Полную матрицу подтипов и дополнительные проверочные формы ещё предстоит завершить.</p><p><a href="../">Существующий тренажёр по всем 21 заданиям ЕГЭ</a></p></aside></div><section class="panel" style="margin-top:20px"><h3>Связи навыков</h3><div class="table-wrap"><table><thead><tr><th>Навык</th><th>Результат</th><th>Применение</th></tr></thead><tbody>${SKILLS.map(s=>`<tr><td><a href="#learn-${s.id}">${esc(s.title)}</a></td><td>${esc(s.goal)}</td><td>${esc(s.exam)}</td></tr>`).join('')}</tbody></table></div></section>`;}
function render(){refreshStored();const parts=(location.hash.slice(1)||'map').split('-'),page=parts[0];document.querySelectorAll('[data-page]').forEach(b=>{const active=b.dataset.page===(['test','results'].includes(page)?'checks':['learn','practice'].includes(page)?'map':page);if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
 if(page==='learn')renderLearn(parts[1]);else if(page==='practice')renderPractice(parts[1],Number(parts[2]));else if(page==='test')renderTest(parts[1]);else if(page==='results')renderResults(parts[1]);else if(page==='checks')renderChecks();else if(page==='report')renderReport();else if(page==='teacher')renderTeacher();else renderMap();
 $('main').focus({preventScroll:true});
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action],[data-page]');if(!b||b.disabled)return;if(b.dataset.page)return route('#'+b.dataset.page);const action=b.dataset.action;if(['hint','solution','skip'].includes(action))return;if(action==='download')return downloadReport();if(action==='scroll-skills')return $('skills')?.scrollIntoView({behavior:'smooth'});if(action==='select-report'){const t=$('report-text');t.focus();t.select();return;}if(action==='reset-ask'){$('reset-confirm').hidden=false;return;}if(action==='reset-cancel'){$('reset-confirm').hidden=true;return;}if(action==='reset-confirm'){try{if(localStorage.getItem(KEY)!==observedStorageText){refreshStored();render();return;}localStorage.removeItem(KEY);observedStorageText=null;}catch(e){warn('Не удалось удалить сохранение в браузере. Результаты сохранены; проверьте настройки хранения.');return;}state=blank();route('#map');return;}if(action.startsWith('start-'))return startRun(action.slice(6));route('#'+action);});
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0);});
window.addEventListener('storage',e=>{if(e.key===KEY||e.key===null){state=load();render();warn('Прогресс обновлён из другой вкладки. Продолжайте с показанного задания.');}});
window.addEventListener('pageshow',()=>{if(refreshStored())render();});
window.MathExamData={KEY,SKILLS,TASKS,parseNumber,right,validState,skillState,result,repeatAvailable,report};
render();
</script>
</body>
