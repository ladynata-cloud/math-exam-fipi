<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img" aria-labelledby="title desc"><title id="title">Точка на отрезке и середина</title><desc id="desc">Принадлежность точки M отрезку не задаёт равенство частей. Справа отметки равенства соответствуют условию о середине.</desc><style>text{font-family:Arial,sans-serif;fill:#213f49;font-size:22px}.label{font-size:23px;font-style:italic}.small{font-size:18px;fill:#617579}.head{font-size:21px;font-weight:700}.line{fill:none;stroke:#213f49;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.teal{fill:none;stroke:#16746b;stroke-width:3;stroke-linecap:round}.red{fill:none;stroke:#bd654c;stroke-width:3;stroke-linecap:round}.gold{fill:none;stroke:#aa7623;stroke-width:3;stroke-linecap:round}.thin{fill:none;stroke:#617579;stroke-width:2}.dashed{stroke-dasharray:7 7}</style><rect width="900" height="350" rx="18" fill="#f5f6ef"/><text class="head" x="45" y="52">M лежит на AB</text><text class="head" x="485" y="52">M — середина AB</text><path class="line" d="M70 155 H390 M510 155 H830"/><circle cx="70" cy="155" r="4" fill="#213f49"/><text class="label" x="63" y="185">A</text><circle cx="170" cy="155" r="4" fill="#213f49"/><text class="label" x="163" y="185">M</text><circle cx="390" cy="155" r="4" fill="#213f49"/><text class="label" x="383" y="185">B</text><circle cx="510" cy="155" r="4" fill="#213f49"/><text class="label" x="503" y="185">A</text><circle cx="670" cy="155" r="4" fill="#213f49"/><text class="label" x="663" y="185">M</text><circle cx="830" cy="155" r="4" fill="#213f49"/><text class="label" x="823" y="185">B</text><path class="line" d="M590.0 148.0 L590.0 162.0"/><path class="line" d="M750.0 148.0 L750.0 162.0"/><text x="55" y="255">AM + MB = AB</text><text x="500" y="255">AM + MB = AB</text><text class="small" x="55" y="299">Равенство частей не дано.</text><text x="500" y="299">AM = MB</text></svg>