name: Vilenkin 6 cloud cabinet
on:
  pull_request:
    paths:
      - 'courses/vilenkin-6-part-1/**'
      - 'learning/**'
      - 'board-server/**'
      - 'Dockerfile'
      - 'tools/vilenkin6-course/**'
      - 'tools/learning-vilenkin6.dom.cjs'
      - 'tools/learning-vilenkin-textbook.dom.cjs'
      - 'tools/learning-vilenkin-textbook.browser.cjs'
      - 'tools/learning-lcm-multi.browser.cjs'
      - 'tools/learning-vilenkin-course-ui.browser.cjs'
      - 'tools/learning-vilenkin-helper.test.cjs'
      - 'tools/learning-vilenkin-helper.browser.cjs'
      - 'tools/learning-number-theory-route.dom.cjs'
      - 'docs/tasks/VILENKIN6_CLOUD_CABINET.md'
      - 'docs/tasks/VILENKIN6_SOURCE_HELPER.md'
      - 'docs/tasks/GRADE6_LCM_MULTI_CABINET.md'
      - 'docs/tasks/GRADE6_LCM_NAVIGATION_INTEGRATION_20261101.md'
      - '.github/workflows/vilenkin6-cloud.yml'
permissions:
  contents: read
jobs:
  managed-course:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - name: Install locked backend and isolated DOM dependencies
        run: |
          npm --prefix board-server ci --include=optional
          npm install --prefix "$RUNNER_TEMP/v6-cloud" --no-save --no-package-lock --ignore-scripts linkedom@0.18.14 jsdom@26.1.0 playwright@1.62.1
          node "$RUNNER_TEMP/v6-cloud/node_modules/playwright/cli.js" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/v6-cloud/node_modules" >> "$GITHUB_ENV"
      - name: Cloud persistence, managed course and standalone regression
        run: |
          node --test board-server/test/learning-vilenkin6.test.js board-server/test/learning-vilenkin-textbook.test.js board-server/test/learning-vilenkin-helper.test.js
          node tools/vilenkin6-course/build-textbook-catalog.cjs --check
          node --test tools/vilenkin6-course/lcm-multi.test.cjs
          node --test tools/vilenkin6-course/textbook-managed-dom.cjs tools/learning-vilenkin-textbook.dom.cjs tools/learning-number-theory-route.dom.cjs
          node --test tools/learning-vilenkin-helper.test.cjs
          node tools/vilenkin6-course/textbook-dom.cjs
          node --test tools/vilenkin6-course/textbook-support.test.cjs tools/vilenkin6-course/textbook-source-labels.test.cjs tools/vilenkin6-course/textbook-integrated-support.test.cjs
          python3 tools/vilenkin6-course/coverage-inventory.py --check
          python3 tools/vilenkin6-course/coverage-inventory.test.py
          node tools/learning-vilenkin-textbook.browser.cjs
          LCM_ARTIFACT_DIR=artifacts/learning-lcm-multi node tools/learning-lcm-multi.browser.cjs
          node tools/learning-vilenkin-helper.browser.cjs
          VILENKIN_UI_EVIDENCE_DIR=artifacts/learning-vilenkin-navigation node tools/learning-vilenkin-course-ui.browser.cjs
          node tools/vilenkin6-course/textbook-support-browser.cjs
          node tools/vilenkin6-course/check.cjs
          node tools/vilenkin6-course/dom.cjs
          node tools/vilenkin6-course/managed-dom.cjs
          node --test tools/vilenkin6-course/bridge.test.cjs
          node tools/learning-vilenkin6.dom.cjs
          python3 tools/vilenkin6-course/build-offline.py
          git diff --exit-code -- courses/vilenkin-6-part-1/offline.html
          git diff --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: learning-vilenkin-combined-browser
          path: |
            artifacts/learning-lcm-multi
            artifacts/learning-vilenkin-navigation
          if-no-files-found: warn
          retention-days: 14
