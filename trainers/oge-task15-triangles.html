<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ОГЭ · Задание 15 — треугольники</title>
<style>
:root{
  --page:#e8e4db; --card:#ffffff; --canvas:#fffdf7; --ink:#1a1a2e; --muted:#5f6878;
  --line:#ddd6c6; --blue:#2d70b3; --good:#16a34a; --bad:#dc2626; --warn:#c2410c;
  --amber:#d97706; --pink:#db2777; --teal:#0d9488; --violet:#7c3aed; --soft:#f6f2e7;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:16px/1.55 system-ui,'Segoe UI',Roboto,sans-serif}
.skip{position:absolute;left:-9999px;top:8px;z-index:10;background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:10px;padding:10px 14px;font-weight:700;text-decoration:none}
.skip:focus{left:12px}
.app{max-width:1020px;margin:18px auto 40px;background:var(--card);border-radius:18px;box-shadow:0 14px 40px rgba(26,26,46,.14);overflow:hidden}
.head{background:var(--ink);color:#f5f2ea;padding:16px 22px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.head h1{margin:0;font-family:Georgia,serif;font-size:26px;font-weight:700}
.head h1 .num{color:#f2b134}
.head .sub{font-size:13.5px;color:#c9c4b6;margin-top:3px}
.head .crumbs{display:inline-flex;align-items:center;min-height:44px;color:#f2b134;font-size:13.5px;font-weight:700;text-decoration:none}
.head .crumbs:hover{text-decoration:underline}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:rgba(255,255,255,.09);border-radius:10px;padding:6px 12px;min-width:78px;text-align:center}
.stat .n{font-weight:800;font-size:20px}
.stat .l{font-size:10.5px;color:#c9c4b6;text-transform:uppercase;letter-spacing:.07em}
.tabs{display:flex;gap:8px;flex-wrap:wrap;padding:14px 22px 0}
.tab{border:1px solid var(--line);background:var(--card);padding:9px 15px;border-radius:10px;cursor:pointer;font:inherit;font-weight:700;color:var(--ink)}
.tab.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.tab .cnt{font-weight:400;color:var(--muted);font-size:13px}
.tab.active .cnt{color:#c9c4b6}
main{padding:18px 22px 26px}
main:focus{outline:none}
.review-note{border-left:4px solid var(--violet);background:#f3effd;border-radius:9px;padding:10px 14px;margin-bottom:12px;font-size:14.5px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:6px 13px;cursor:pointer;font:inherit;font-size:13.5px;font-weight:700;color:#444}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.trsub{background:#efe9fb;border-color:#c9b7f2;color:#5a2ecc}
.grid{display:grid;grid-template-columns:360px 1fr;gap:20px;align-items:start}
@media(max-width:840px){.grid{grid-template-columns:1fr}}
.diagram{border:1px solid var(--line);border-radius:14px;background:var(--canvas);padding:6px;display:flex;align-items:center;justify-content:center}
.diagram svg{max-width:100%;height:auto;display:block}
@media(max-width:600px){.diagram svg{max-height:max(27vh,190px);width:auto}.figcap{font-size:12px;line-height:1.3;margin-top:4px}}
.figcap{font-size:12.5px;color:var(--muted);margin-top:6px}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.tag{font-size:12px;border-radius:999px;padding:4px 10px;font-weight:700}
.tag.topic{background:#e8f0f7;color:#1d4d78}
.tag.gen{background:#f2ecdc;color:#75591e}
.task{font-family:Georgia,serif;font-size:19px;line-height:1.5}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.08;font-size:.86em;margin:0 2px}
.frac .fn{border-bottom:1.6px solid currentColor;padding:0 4px}
.frac .fd{padding:0 4px}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 0 4px}
input.ans{font-size:19px;padding:8px 12px;border:2px solid var(--line);border-radius:10px;width:150px;font-family:Georgia,serif;background:#fff;color:var(--ink)}
input.ans:focus{border-color:var(--blue)}
input.ans:disabled{background:#f1efe9;color:#8a8478}
button{font:inherit;font-weight:700;border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:10px;padding:10px 16px;cursor:pointer}
button.sec{background:#fff;color:var(--ink)}
button.blue{background:var(--blue);border-color:var(--blue)}
button.soft{background:var(--soft);color:var(--ink);border-color:var(--line)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible,.rzcard:focus-visible,.misschip:focus-visible{outline:3px solid #f2b134;outline-offset:2px}
.fb{display:none;border-left:4px solid var(--line);padding:11px 14px;border-radius:9px;background:#f6f6f4;margin-top:12px;font-size:15px}
.fb.show{display:block}
.fb.ok{border-color:var(--good);background:#e9f6ee}
.fb.bad{border-color:var(--bad);background:#fbeaea}
.fb.diag{border-color:var(--warn);background:#fdf1e7}
.law{border:1.5px solid #b7e0c4;background:#eef9f1;border-radius:12px;padding:12px 15px;margin-top:12px;font-family:Georgia,serif}
.law b{color:#14733a}
.refcall{display:block;width:100%;text-align:left;margin-top:12px;border:1px dashed #b9ab7e;background:#fffbeb;border-radius:11px;padding:10px 13px;font:inherit;font-size:14.5px;font-weight:400;color:var(--ink);cursor:pointer}
.refcall:hover{background:#fef6d8}
.refcall .t{font-weight:800;color:#8a6a12}
.rowbtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.progressline{font-size:13.5px;color:var(--muted);margin:2px 0 12px}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.dot{width:15px;height:15px;border-radius:50%;background:#d8d2c2}
.dot.g{background:var(--good)}.dot.r{background:var(--bad)}
.fin{border:1px solid var(--line);border-radius:14px;background:var(--canvas);padding:20px;text-align:center}
.fin .score{font-family:Georgia,serif;font-size:40px;font-weight:800}
.route{margin-top:12px;text-align:left;border-top:1px dashed var(--line);padding-top:12px}
.route li{margin:6px 0}
.smallnote{font-size:13px;color:var(--muted)}
/* лестница: ступень = вопрос → ответ ученика или «Показать шаг» */
.ladder{margin-top:14px;border-top:1px dashed var(--line);padding-top:10px}
.ladder .lnote{font-size:13.5px;color:#4a5560;background:#f2f6fa;border-radius:9px;padding:9px 12px;margin:0 0 8px}
.lstep{border-left:3px solid var(--blue);background:#f7f9fc;border-radius:0 10px 10px 0;padding:10px 13px;margin:8px 0}
.lstep.ok{border-color:var(--good);background:#f0f9f3}
.lstep.shown{border-color:var(--warn);background:#fdf6ee}
.lstep .q{font-size:15.5px}
.lstep .q .sn{font-weight:800;color:var(--blue);margin-right:4px}
.lstep .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.lstep input.ans{font-size:17px;width:130px}
.lstep .res{margin-top:7px;font-size:15px}
.lstep .hintbox{margin-top:7px;font-size:14px;color:#5a4a12;background:#fffbeb;border:1px dashed #d9c37a;border-radius:8px;padding:7px 10px}
/* Разбор */
.rzgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:10px}
.rzcard{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;padding:11px 13px;cursor:pointer;background:var(--card);color:var(--ink);font:inherit;font-weight:400}
.rzcard:hover{border-color:var(--blue)}
.rzcard.done{background:#eef9f1;border-color:#b7e0c4}
.rzcard .nm{font-weight:800;font-size:14.5px}
.rzcard .tp{font-size:12px;color:var(--muted);margin-top:2px}
.rzcard .ok{color:var(--good);font-size:12.5px;font-weight:700;margin-top:4px}
.rzstep{border-left:3px solid var(--blue);background:#f2f6fa;border-radius:0 9px 9px 0;padding:9px 13px;margin:8px 0;font-size:15.5px}
.rzstep .a{margin-top:6px;color:#14532d}
.backlink{display:inline-flex;align-items:center;min-height:44px;color:var(--blue);background:none;border:none;padding:0;cursor:pointer;font:inherit;font-weight:700;font-size:14px;margin-bottom:6px}

.refgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.refgrid{grid-template-columns:1fr}}
.refcard{border:1px solid var(--line);border-radius:14px;background:var(--canvas);padding:15px 17px;min-width:0}
.refcard.hot{border-color:var(--amber);box-shadow:0 0 0 3px rgba(217,119,6,.22)}
.refcard h3{margin:0 0 8px;font-family:Georgia,serif;font-size:18px}
.refcard .fx{font-family:Georgia,serif;font-size:17px;margin:7px 0;letter-spacing:.01em}
.refcard .use{font-size:13px;color:var(--muted);margin-top:9px;border-top:1px dashed var(--line);padding-top:8px}
.quizq{font-size:13.5px;color:var(--muted);margin-bottom:8px;font-weight:700}
.pinpanel{border:1.5px dashed #b9ab7e;background:#fffbeb;border-radius:12px;padding:13px 16px;margin:12px 0}
.pinpanel h3{margin:0 0 4px;font-family:Georgia,serif;font-size:18px}
.pinpanel .why{font-size:14px;color:#6b5410;margin-bottom:8px}
.subrow{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:6px 0;border-bottom:1px dotted var(--line);padding-bottom:6px}
.subrow:last-child{border-bottom:none;padding-bottom:0}
.subrow .nm{font-weight:700;font-size:14.5px;flex:1;min-width:180px}
.minibtn{font-size:13px;padding:6px 11px;border-radius:8px}
.missing{border:1px solid var(--line);border-radius:12px;background:#f2f6fa;padding:12px 15px;margin:12px 0}
.missing b{font-family:Georgia,serif}
.misschip{display:inline-flex;align-items:center;min-height:44px;margin:4px 5px 0 0;padding:4px 12px;border-radius:999px;background:#fff;border:1px solid var(--line);cursor:pointer;font:inherit;font-size:13px;font-weight:700;color:var(--ink)}
.misschip:hover{border-color:var(--blue);color:var(--blue)}
.sheetbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
/* доступность (канон): цели касания не ниже 44 px; пояснение «О прогрессе» */
button,select,input:not([type=checkbox]):not([type=radio]):not([type=range]){min-height:44px}
.pnote{margin:8px 0 10px;font-size:13.5px;line-height:1.5;color:#4a5560}
.pnote summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:600}
.pnote div{padding:2px 0 8px}
@media(max-width:520px){
  .app{margin:0;border-radius:0}
  .head{padding:4px 12px 8px;gap:4px}
  .head h1{font-size:19px}
  .head .h1tail,.head .sub{display:none}
  .stats{gap:6px}
  .stat{min-width:58px;padding:2px 8px}
  .stat .n{font-size:15px}
  .stat .l{font-size:9px}
  .grid{gap:10px}
  .meta{margin-bottom:6px}
  .controls{margin:10px 0 4px}
  .tabs{gap:4px;padding:8px 10px 0}
  .filters{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
  .filters .chip{flex:0 0 auto;white-space:nowrap}
  .tab .cnt{display:none}
  .tab{padding:6px 7px;font-size:13px}
  main{padding:10px 12px 22px}
  .task{font-size:17px;line-height:1.45}
}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
@media print{
  body{background:#fff}
  .skip,.tabs,.head .stats,.crumbs,.filters,.controls,.rowbtns,.ladder,.pnote,.review-note,.refcall,.backlink,.fb{display:none!important}
  .app{box-shadow:none;margin:0;max-width:none}
  .head{background:#fff;color:var(--ink);border-bottom:2px solid var(--ink)}
  .head .sub{color:var(--muted)}
  .grid{grid-template-columns:1fr}
  .diagram{break-inside:avoid}
}
</style>

<body>
<a class="skip" href="#main">Перейти к заданию</a>
<div class="app">
  <header class="head">
    <div>
      <a class="crumbs" href="../oge/">← Курс ОГЭ</a>
      <h1>ОГЭ · Задание <span class="num">15</span><span class="h1tail"> — треугольники</span></h1>
      <div class="sub">углы · прямоугольный треугольник · площадь и средняя линия · правильный треугольник · чертёж строится по числам задачи</div>
    </div>
    <div class="stats">
      <div class="stat"><div class="n" id="stSolved">0</div><div class="l">решено</div></div>
      <div class="stat"><div class="n" id="stStreak">0</div><div class="l">серия</div></div>
      <div class="stat"><div class="n" id="stBest">—</div><div class="l">зачёт</div></div>
    </div>
  </header>
  <nav class="tabs" aria-label="Режимы тренажёра">
    <button type="button" class="tab active" data-tab="razbor">Разбор <span class="cnt" id="cntRz"></span></button>
    <button type="button" class="tab" data-tab="train">Тренировка</button>
    <button type="button" class="tab" data-tab="quiz">Зачёт</button>
    <button type="button" class="tab" data-tab="refs">Справочник</button>
  </nav>
  <main id="main" tabindex="-1"></main>
</div>
<script>
'use strict';
/* ================= ОГЭ-15 «Треугольники» — ядро ================= */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const rad=a=>a*Math.PI/180, degf=a=>a*180/Math.PI;
const n2=x=>Math.round(x*100)/100;
const dist=(P,Q)=>Math.hypot(P.x-Q.x,P.y-Q.y);
function angleAt(V,P,Q){ // угол между лучами V→P и V→Q, градусы 0..180
  const ux=P.x-V.x, uy=P.y-V.y, vx=Q.x-V.x, vy=Q.y-V.y;
  const d=(ux*vx+uy*vy)/(Math.hypot(ux,uy)*Math.hypot(vx,vy));
  return degf(Math.acos(Math.max(-1,Math.min(1,d))));
}
function distToLine(P,A,B){ // расстояние от P до прямой AB
  const dx=B.x-A.x, dy=B.y-A.y;
  return Math.abs(dy*(P.x-A.x)-dx*(P.y-A.y))/Math.hypot(dx,dy);
}

/* ?seed=<целое> (контракт §10, решение делегата 7): все генераторы берут
   числа из mulberry32(seed) — у группы одна и та же последовательность
   задач; без сида — обычный Math.random. Сид не влияет на запись прогресса. */
function mulberry32(seed){
  let a=seed>>>0;
  return function(){
    a=(a+0x6D2B79F5)>>>0; let t=a;
    t=Math.imul(t^(t>>>15),t|1); t^=t+Math.imul(t^(t>>>7),t|61);
    return ((t^(t>>>14))>>>0)/4294967296;
  };
}
const SEED=(function(){
  try{const m=/[?&]seed=(\d{1,12})(?:&|$)/.exec(location.search||'');return m?(parseInt(m[1],10)>>>0):null;}
  catch(e){return null;}
})();
const RND=SEED==null?()=>Math.random():mulberry32(SEED);
const ri=(a,b)=>a+Math.floor(RND()*(b-a+1));
const pick=a=>a[Math.floor(RND()*a.length)];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(RND()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
/* перевыбор параметров генератора, пока bad(p) (не больше 80 раз) */
function rp(gen,bad){let p;for(let i=0;i<80;i++){p=gen();if(!bad||!bad(p))return p;}return p;}

/* ---------- числа ---------- */
function fmtNum(x){ // 6.72 → «6,72»; до шести знаков после запятой, без хвостовых нулей
  const r=Math.round(x*1e6)/1e6;
  return String(r).replace('.',',').replace('-','−');
}
/* конечная десятичная дробь не длиннее тысячных — такой ответ ученик может ввести точно */
const isFin=x=>isFinite(x)&&Math.abs(Math.round(x*1000)-x*1000)<1e-6;
/* число ступени лестницы: конечная десятичная дробь до десятитысячных (0,9216) — вводится точно */
const isDec=x=>isFinite(x)&&Math.abs(Math.round(x*1e4)-x*1e4)<1e-6;
function frac(a,b){return `<span class="frac"><span class="fn">${a}</span><span class="fd">${b}</span></span>`;}
const sq=(k,r)=>(k===1?'':fmtNum(k))+'√'+r;   // 6√2, √3
const dg=x=>fmtNum(x)+'°';
/* отношение p/q: десятичной дробью, если она конечная, иначе дробью */
function ratioTxt(p,q){const v=p/q;return isFin(v)?fmtNum(v):frac(p,q);}
/* пифагоровы тройки (катет, катет, гипотенуза) */
const TRIPLES=[[3,4,5],[5,12,13],[8,15,17],[7,24,25],[20,21,29],[9,40,41],[12,35,37]];

/* ---------- SVG-библиотека (как в 16: без стрелок; засечки — равенство; цвет дуги — класс равенства) ---------- */
const COL={ink:'#1a1a2e',blue:'#2d70b3',amber:'#d97706',pink:'#db2777',teal:'#0d9488',violet:'#7c3aed',good:'#16a34a',grey:'#8a8478'};
let _uid=0;
function CF(W,H,title,body){
  const id='p'+(_uid++);
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${title}" xmlns="http://www.w3.org/2000/svg"><title>${title}</title>`+
  `<defs><pattern id="${id}" width="25" height="25" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="1.15" fill="#e7e1d2"/></pattern></defs>`+
  `<rect x="0" y="0" width="${W}" height="${H}" fill="#fffdf7"/><rect x="0" y="0" width="${W}" height="${H}" fill="url(#${id})"/>`+body+`</svg>`;
}
function seg(P,Q,col=COL.ink,w=2.1,dash){
  return `<line x1="${n2(P.x)}" y1="${n2(P.y)}" x2="${n2(Q.x)}" y2="${n2(Q.y)}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"${dash?` stroke-dasharray="${dash}"`:''}/>`;
}
function circleEl(c,R,col=COL.ink,w=2.1,dash){
  return `<circle cx="${n2(c.x)}" cy="${n2(c.y)}" r="${n2(R)}" stroke="${col}" stroke-width="${w}" fill="none"${dash?` stroke-dasharray="${dash}"`:''}/>`;
}
function vdot(P,name,col=COL.ink){
  return `<circle cx="${n2(P.x)}" cy="${n2(P.y)}" r="5.6" fill="#fffdf7"/><circle data-v="${name}" cx="${n2(P.x)}" cy="${n2(P.y)}" r="3.6" fill="${col}"/>`;
}
function lab(x,y,t,size=16,anchor='middle',col=COL.ink,of){
  return `<text x="${n2(x)}" y="${n2(y)}"${of?` data-of="${of}"`:''} font-family="Georgia,serif" font-size="${size}" font-weight="700" fill="${col}" text-anchor="${anchor}" paint-order="stroke" stroke="#fffdf7" stroke-width="4.5" stroke-linejoin="round">${t}</text>`;
}
function pol(c,r,a){return {x:c.x+r*Math.cos(rad(a)), y:c.y-r*Math.sin(rad(a))};}
function mathAng(V,P){return degf(Math.atan2(-(P.y-V.y),P.x-V.x));}
function arcPolyline(V,r,a1,delta,col,w=3){
  const n=Math.max(10,Math.round(Math.abs(delta)/6)); const pts=[];
  for(let i=0;i<=n;i++){const p=pol(V,r,a1+delta*i/n); pts.push(`${n2(p.x)},${n2(p.y)}`);}
  return `<polyline points="${pts.join(' ')}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/>`;
}
function normDelta(d){while(d>180)d-=360;while(d<=-180)d+=360;return d;}
/* дуга угла в вершине V между лучами на P и Q; label — надпись; n — число дужек;
   tk — засечка поперёк дуги (равные углы, например половины угла при биссектрисе) */
function angArc(V,P,Q,col,r=24,label=null,n=1,tk=0){
  const a1=mathAng(V,P), d=normDelta(mathAng(V,Q)-a1);
  let s='';
  for(let i=0;i<n;i++) s+=arcPolyline(V,r-5*i,a1,d,col);
  if(tk){const m=a1+d/2,p1=pol(V,r-5,m),p2=pol(V,r+5,m);s+=`<line x1="${n2(p1.x)}" y1="${n2(p1.y)}" x2="${n2(p2.x)}" y2="${n2(p2.y)}" stroke="${col}" stroke-width="2.2" stroke-linecap="round"/>`;}
  if(label!=null){
    const narrow=Math.abs(d)<=28;
    const lp=pol(V,r+(narrow?22:15),a1+d/2);
    s+=lab(lp.x,lp.y+5,label,15,'middle',col);
  }
  return s;
}

   gen() → параметры (перевыбор — внутри gen), proto — параметры разбора,
   calc(p) — ответ, text(p) — условие (свои формулировки, не текст КИМ),
   fig(p) — чертёж по числам задачи, steps(p) — лестница [{q, a, hint, show, chk}]
   (вопрос ступени → число ступени; hint — правило без результата; show — ступень
   с результатом; chk — что проверить при промахе), diag(p) — ловушки [{v, m}]:
   число типичной ошибки и адресное сообщение. */
const TOPICS={ug:'Углы: сумма и внешний угол',iso:'Равнобедренный треугольник, биссектриса, высота',
  pyth:'Теорема Пифагора',trig:'sin, cos, tg в прямоугольном треугольнике',
  area:'Площадь, высота, средняя линия, медиана',reg:'Правильный треугольник'};
const DEG=' Ответ дайте в градусах.';
const HINT180='Сумма углов треугольника равна 180°.';
const HINTSM='Смежные углы в сумме дают 180°.';
const HINT90='Острые углы прямоугольного треугольника в сумме дают 90°.';
const HINTPY='Теорема Пифагора: квадрат гипотенузы равен сумме квадратов катетов.';
const sub1=n=>n.replace(/(\D)1$/,'$1<sub>1</sub>');
/* прямоугольный треугольник с прямым углом C: C(0; 0), A(AC; 0), B(0; BC) */
function rtPts(ac,bc){return {C:V2(0,0),A:V2(ac,0),B:V2(0,bc)};}
/* правильный треугольник со стороной s: основание AC, вершина B, центр O, H — середина AC */
function eqPts(s){const h=s*Math.sqrt(3)/2;return {A:V2(0,0),C:V2(s,0),B:V2(s/2,h),O:V2(s/2,h/3),H:V2(s/2,0)};}
const EQCAP='Все правильные треугольники подобны: чертёж у задач один, размеры — по надписям.';

rtLegSin:{topic:'trig',name:'Синус: катет и гипотенуза',ref:'rt',

      :[r1,{q:'Чему равна гипотенуза AB?',a:p.k*p.q,chk:'частное BC : sin A',show:`AB = BC : sin A = ${p.k*p.p} : ${s} = ${p.k*p.q}.`}];},

      {v:p.k*p.p*p.q/p.r,m:'Катет BC противолежит углу A: с гипотенузой его связывает синус, а не косинус.'}]},

rtTrig:{topic:'trig',name:'sin, cos, tg: стороны и тождество',ref:'rt',
  refWhy:'Синус, косинус и тангенс острого угла — отношения сторон прямоугольного треугольника.',
  law:'sin A = BC : AB, cos A = AC : AB, tg A = BC : AC; sin²A + cos²A = 1.',
  gen:()=>{const fn=pick(['sin','cos','tg','id']);
    if(fn==='id'){const t=pick([[3,4,5],[7,24,25]]),sw=ri(0,1);return {fn,p:t[sw],r:t[1-sw],q:t[2],k:1,g:''};}
    const t=fn==='tg'?pick(TG_NICE):pick([[3,4,5],[7,24,25]]),sw=fn==='tg'?0:ri(0,1);
    return {fn,p:t[sw],r:t[1-sw],q:t[2],k:ri(1,t[2]<=5?8:t[2]<=17?3:1),g:pick(['BC,AB','AC,AB','BC,AC']),f:ri(0,1)};},
  proto:{fn:'sin',p:3,r:4,q:5,k:2,g:'BC,AC'},
  calc:p=>trigVal(p),
  text:p=>{const L={BC:p.k*p.p,AC:p.k*p.r,AB:p.k*p.q},fn=p.fn==='tg'?'tg A':p.fn==='cos'?'cos A':'sin A';
    if(p.fn==='id')return `В треугольнике ABC угол C прямой, sin A = ${fmtNum(p.p/p.q)}. Найдите cos A.`;
    const [u,v]=p.g.split(',');return p.f
      ?`Треугольник ABC прямоугольный, угол C прямой. Известно, что ${u} = ${L[u]}, ${v} = ${L[v]}. Найдите ${{sin:'синус',cos:'косинус',tg:'тангенс'}[p.fn]} угла A.`
      :`В треугольнике ABC угол C прямой, ${u} = ${L[u]}, ${v} = ${L[v]}. Найдите ${fn}.`;},
  fig:p=>{if(p.fn==='id')return rtLegFig(p,[]);
    const L={BC:p.k*p.p,AC:p.k*p.r,AB:p.k*p.q},[u,v]=p.g.split(','),sl=[];
    const side={BC:['B','C'],AC:['A','C'],AB:['A','B']};sl.push(side[u].concat([fmtNum(L[u])]),side[v].concat([fmtNum(L[v])]));
    return rtLegFig(p,sl);},
  steps:p=>{const L={BC:p.k*p.p,AC:p.k*p.r,AB:p.k*p.q},val=trigVal(p);
    if(p.fn==='id'){const s=p.p/p.q;return [
      {q:'Чему равен cos<sup>2</sup>A?',a:1-s*s,hint:'Основное тригонометрическое тождество: sin²A + cos²A = 1.',chk:'основное тригонометрическое тождество',
       show:`cos<sup>2</sup>A = 1 − ${fmtNum(s)}<sup>2</sup> = ${fmtNum(1-s*s)}.`},
      {q:'Чему равен cos A?',a:val,chk:'квадратный корень',
       show:`cos A = √${fmtNum(1-s*s)} = ${fmtNum(val)} (угол A острый — косинус положителен).`}];}
    const need=p.fn==='sin'?['BC','AB']:p.fn==='cos'?['AC','AB']:['BC','AC'];
    const given=p.g.split(','),miss=need.find(x=>!given.includes(x));
    const fn=p.fn==='tg'?'tg A':p.fn==='cos'?'cos A':'sin A',frm=`${fn} = ${need[0]} : ${need[1]}`;
    const s1=miss
      ?{q:`Найдите сторону ${miss}.`,a:L[miss],hint:HINTPY,chk:'теорему Пифагора',
        show:miss==='AB'?`AB = √(${L.AC}² + ${L.BC}²) = ${L.AB}.`:`${miss} = √(${L.AB}² − ${L[given.find(x=>x!=='AB')]}²) = ${L[miss]}.`}
      :{q:p.fn==='cos'?'Какой катет прилежит к углу A? Введите его длину.':'Какой катет лежит против угла A? Введите его длину.',a:p.fn==='cos'?L.AC:L.BC,
        hint:'Противолежащий катет не касается вершины A, прилежащий — выходит из неё.',chk:', какой катет нужен',
        show:p.fn==='cos'?`Прилежащий к углу A катет — AC = ${L.AC}.`:`Против угла A лежит катет BC = ${L.BC}.`};
    return [s1,{q:`Чему равен ${fn}?`,a:val,hint:p.fn==='tg'?'Тангенс — отношение противолежащего катета к прилежащему.':'Синус и косинус — отношения катетов к гипотенузе.',chk:'отношение сторон',
      show:`${frm} = ${L[need[0]]} : ${L[need[1]]} = ${fmtNum(val)}.`}];},
  diag:p=>{const s=p.p/p.q,c=p.r/p.q,t=p.p/p.r;
    if(p.fn==='id')return [{v:1-s,m:'Единице равна сумма квадратов синуса и косинуса, а не сумма самих синуса и косинуса.'},
      {v:1-s*s,m:'Это cos<sup>2</sup>A — квадрат косинуса. Сам косинус — корень из этого числа.'}];
    if(p.fn==='sin')return [{v:c,m:'Это косинус угла A: отношение прилежащего катета AC к гипотенузе. Синус — отношение противолежащего катета BC к гипотенузе.'},
      {v:t,m:'Это тангенс угла A: отношение катетов BC : AC. Синус — отношение катета BC к гипотенузе AB.'},
      {v:1/s,m:'Дробь перевёрнута: синус острого угла меньше единицы — гипотенуза стоит в знаменателе.'}];
    if(p.fn==='cos')return [{v:s,m:'Это синус угла A: отношение противолежащего катета BC к гипотенузе. Косинус — отношение прилежащего катета AC к гипотенузе.'},
      {v:1/t,m:'Это отношение катетов AC : BC. Косинус — отношение прилежащего катета AC к гипотенузе AB.'},
      {v:1/c,m:'Дробь перевёрнута: косинус острого угла меньше единицы — гипотенуза стоит в знаменателе.'}];
    return [{v:s,m:'Это синус угла A — отношение катета BC к гипотенузе. Тангенс — отношение катетов BC : AC.'},
      {v:c,m:'Это косинус угла A. Тангенс — отношение противолежащего катета BC к прилежащему AC.'},
      {v:1/t,m:'Дробь перевёрнута: тангенс угла A — это BC : AC, противолежащий катет к прилежащему.'}];}},

/* ---------- ТЕОРЕМА ПИФАГОРА ---------- */
pythLeg:{topic:'pyth',name:'Пифагор: катет',ref:'pyth',
  refWhy:'Известны гипотенуза и катет — второй катет даёт теорема Пифагора.',

  gen:()=>{const t=pick(TRIPLES),sw=ri(0,1),k=ri(1,t[2]<=17?5:2);return {a:k*t[sw],b:k*t[1-sw],c:k*t[2],giv:pick(['AC','BC']),f:ri(0,1)};},
  proto:{a:12,b:5,c:13,giv:'AC',f:0},
  calc:p=>p.b,
  text:p=>{const ask=p.giv==='AC'?'BC':'AC';return p.f
    ?`В треугольнике ABC угол C прямой, гипотенуза AB равна ${p.c}, катет ${p.giv} равен ${p.a}. Найдите катет ${ask}.`
    :`В прямоугольном треугольнике ABC с прямым углом C катет ${p.giv} равен ${p.a}, а гипотенуза AB равна ${p.c}. Найдите катет ${ask}.`;},
  fig:p=>{const ac=p.giv==='AC'?p.a:p.b,bc=p.giv==='AC'?p.b:p.a,ask=p.giv==='AC'?['B','C']:['A','C'];
    return rtSidesFig(ac,bc,[[p.giv[0],'C',fmtNum(p.a)],['A','B',fmtNum(p.c)],ask.concat(['?',COL.pink])]);},
  steps:p=>{const ask=p.giv==='AC'?'BC':'AC';return [
    {q:`По теореме Пифагора AB² = AC² + BC². Чему равен ${ask}²?`,a:p.b*p.b,chk:'разность квадратов гипотенузы и катета',
     show:`${ask}² = ${p.c}² − ${p.a}² = ${p.c*p.c} − ${p.a*p.a} = ${p.b*p.b}.`},
    {q:`Чему равен ${ask}?`,a:p.b,chk:'квадратный корень',show:`${ask} = √${p.b*p.b} = ${p.b}.`}];},
  diag:p=>[{v:p.c-p.a,m:'Длины сторон здесь не вычитаются: стороны прямоугольного треугольника связаны через квадраты (теорема Пифагора).'},
    {v:p.b*p.b,m:'Это квадрат катета. Сам катет — квадратный корень из этого числа.'},
    {v:Math.sqrt(p.c*p.c+p.a*p.a),m:'Катет короче гипотенузы, а здесь получилось длиннее: квадраты сложены вместо вычитания.'}]},

  law:'В прямоугольном треугольнике квадрат гипотенузы равен сумме квадратов катетов.',
  gen:()=>{const t=pick(TRIPLES),sw=ri(0,1),k=ri(1,t[2]<=17?5:2);return {a:k*t[sw],b:k*t[1-sw],c:k*t[2],f:ri(0,1)};},
  proto:{a:8,b:15,c:17,f:0},
  calc:p=>p.c,
  text:p=>p.f?`Треугольник ABC прямоугольный, угол C прямой. Известно, что AC = ${p.a}, BC = ${p.b}. Найдите гипотенузу.`
    :`В прямоугольном треугольнике ABC с прямым углом C катеты AC = ${p.a} и BC = ${p.b}. Найдите гипотенузу AB.`,

    {q:'Чему равен квадрат гипотенузы AB²?',a:p.c*p.c,hint:HINTPY,chk:'сумму квадратов катетов',
     show:`AB² = ${p.a}² + ${p.b}² = ${p.a*p.a} + ${p.b*p.b} = ${p.c*p.c}.`},
    {q:'Чему равна гипотенуза AB?',a:p.c,chk:'квадратный корень',show:`AB = √${p.c*p.c} = ${p.c}.`}],
  diag:p=>[{v:p.a+p.b,m:'Длины катетов не складываются: гипотенуза связана с катетами через квадраты (теорема Пифагора).'},
    {v:p.c*p.c,m:'Это квадрат гипотенузы. Сама гипотенуза — квадратный корень из этого числа.'},
    {v:Math.sqrt(Math.abs(p.b*p.b-p.a*p.a)),m:'Гипотенуза — самая длинная сторона, а здесь получилось меньше катета: квадраты катетов вычтены, а не сложены.'}]},

rtAltitude:{topic:'pyth',name:'Высота и отрезки гипотенузы',ref:'rth',
  refWhy:'Высота к гипотенузе — через площадь (S = ½·AC·BC = ½·AB·CH) или через отрезки гипотенузы.',
  law:'Площадь прямоугольного треугольника можно найти двумя способами: ½·AC·BC и ½·AB·CH. Высота из прямого угла: CH² = AH·BH.',
  gen:()=>{const d=pick(['CH','CH','AH','geo']);
    if(d==='geo')return rp(()=>({d,m:ri(1,6),n:ri(1,6),t:ri(1,3)}),p=>p.m===p.n||Math.max(p.m,p.n)>1.8*Math.min(p.m,p.n));
    /* вариант AH — только 3-4-5: у тонкого треугольника 7-24-25 короткому отрезку AH негде подписаться */
    const f=pick(d==='AH'?[[3,4,5,8],[4,3,5,8]]:[[3,4,5,8],[4,3,5,8],[7,24,25,2],[24,7,25,2]]),k=ri(1,f[3]);return {d,b:k*f[0],a:k*f[1],c:k*f[2]};},
  proto:{d:'CH',b:6,a:8,c:10},
  calc:p=>p.d==='geo'?p.t*p.m*p.n:p.d==='CH'?p.a*p.b/p.c:p.b*p.b/p.c,
  text:p=>p.d==='geo'
    ?`Высота CH прямоугольного треугольника ABC, проведённая из вершины прямого угла C, делит гипотенузу на отрезки AH = ${p.t*p.m*p.m} и BH = ${p.t*p.n*p.n}. Найдите CH.`
    :p.d==='CH'?`В прямоугольном треугольнике ABC с прямым углом C катеты равны AC = ${p.b} и BC = ${p.a}. Найдите высоту CH, проведённую к гипотенузе.`
    :`В прямоугольном треугольнике ABC с прямым углом C катеты равны AC = ${p.b} и BC = ${p.a}, CH — высота, проведённая к гипотенузе. Найдите отрезок AH.`,
  fig:p=>{let ac,bc;if(p.d==='geo'){const ah=p.t*p.m*p.m,bh=p.t*p.n*p.n;ac=Math.sqrt(ah*(ah+bh));bc=Math.sqrt(bh*(ah+bh));}else{ac=p.b;bc=p.a;}
    const T=rtPts(ac,bc);T.H=foot(T.C,T.A,T.B);
    const sl=p.d==='geo'?[['A','H',fmtNum(p.t*p.m*p.m)],['H','B',fmtNum(p.t*p.n*p.n)],['C','H','?',COL.pink,1]]
      :p.d==='CH'?[['A','C',fmtNum(p.b)],['B','C',fmtNum(p.a)],['C','H','?',COL.pink,1]]
      :[['A','C',fmtNum(p.b)],['B','C',fmtNum(p.a)],['A','H','?',COL.pink]];
    return drawFig({pts:T,title:'Прямоугольный треугольник ABC, высота CH к гипотенузе',segs:[['C','H']],rights:[['C','A','B'],['H','C','B']],sl,labIn:p.d==='geo'?['H']:[],
      chk:[{t:'ang',v:'C',p:'A',q:'B',want:90},{t:'ang',v:'H',p:'C',q:'B',want:90},{t:'onseg',p:'H',a:'A',b:'B'},{t:'ratio',a:['C','A'],b:['C','B'],want:ac/bc}]});},
  steps:p=>{if(p.d==='geo'){const ah=p.t*p.m*p.m,bh=p.t*p.n*p.n;return [
      {q:'Чему равен квадрат высоты CH²?',a:ah*bh,hint:'Высота прямоугольного треугольника, проведённая из вершины прямого угла, — среднее пропорциональное отрезков гипотенузы: CH² = AH·BH.',chk:'произведение отрезков гипотенузы',
       show:`CH² = AH·BH = ${ah}·${bh} = ${ah*bh}.`},
      {q:'Чему равна высота CH?',a:p.t*p.m*p.n,chk:'квадратный корень',show:`CH = √${ah*bh} = ${p.t*p.m*p.n}.`}];}
    const s1={q:'Чему равна гипотенуза AB?',a:p.c,hint:HINTPY,chk:'теорему Пифагора',show:`AB = √(${p.b}² + ${p.a}²) = √${p.c*p.c} = ${p.c}.`};
    if(p.d==='CH')return [s1,
      {q:'Чему равна площадь треугольника ABC?',a:p.a*p.b/2,hint:'Площадь прямоугольного треугольника — половина произведения катетов.',chk:'половину произведения катетов',
       show:`S = ½·${p.b}·${p.a} = ${fmtNum(p.a*p.b/2)}.`},
      {q:'Площадь равна и ½·AB·CH. Чему равна высота CH?',a:p.a*p.b/p.c,chk:'частное 2S : AB',
       show:`CH = 2S : AB = ${p.a*p.b} : ${p.c} = ${fmtNum(p.a*p.b/p.c)}.`}];
    return [s1,
      {q:'Чему равен cos A в треугольнике ABC?',a:p.b/p.c,hint:'cos A — отношение прилежащего катета к гипотенузе.',chk:'отношение AC : AB',
       show:`cos A = AC : AB = ${p.b} : ${p.c} = ${ratioTxt(p.b,p.c)}.`},
      {q:'В прямоугольном треугольнике ACH cos A = AH : AC. Чему равен AH?',a:p.b*p.b/p.c,chk:'произведение AC · cos A',
       show:`AH = AC · cos A = ${p.b} · ${ratioTxt(p.b,p.c)} = ${fmtNum(p.b*p.b/p.c)}.`}];},
  diag:p=>{if(p.d==='geo'){const ah=p.t*p.m*p.m,bh=p.t*p.n*p.n;return [
      {v:(ah+bh)/2,m:'Это половина гипотенузы — длина медианы, а не высоты.'},
      {v:ah*bh,m:'Это квадрат высоты. Сама высота — квадратный корень из этого числа.'}];}
    if(p.d==='CH')return [{v:p.a*p.b/2,m:'Это площадь треугольника ABC. Спрашивают высоту CH.'},
      {v:p.c/2,m:'Это половина гипотенузы — длина медианы, проведённой к гипотенузе. Высота CH — другой отрезок.'},
      {v:p.a*p.b,m:'Это произведение катетов (удвоенная площадь). Высота CH связана с ним через гипотенузу.'}];
    return [{v:p.a*p.a/p.c,m:'Это отрезок BH — прилежащий к катету BC. Спрашивают отрезок AH.'},
      {v:p.c/2,m:'Это половина гипотенузы. Высота делит гипотенузу пополам только в равнобедренном прямоугольном треугольнике.'},
      {v:p.a*p.b/p.c,m:'Это высота CH. Спрашивают отрезок гипотенузы AH.'}];}},

/* ---------- ПЛОЩАДЬ, СРЕДНЯЯ ЛИНИЯ, МЕДИАНА ---------- */
areaBH:{topic:'area',name:'Площадь и высота треугольника',ref:'area',
  refWhy:'Площадь треугольника — половина произведения стороны на высоту, проведённую к этой стороне.',
  law:'Площадь треугольника равна половине произведения стороны на высоту, проведённую к этой стороне.',
  gen:()=>{const d=pick(['S','S','h']);return rp(()=>{const t=pick(BH_TRIPLES);return {d,xh:t[0],h:t[1],ab:t[2],ac:t[0]+ri(3,14)};},
      p=>{const S=p.ac*p.h/2,tr=p.d==='S'?[p.ab*p.ac/2,p.ac*p.h,p.ab*p.h/2]:[S/p.ac,2*S];return tr.some(v=>Math.abs(v-(p.d==='S'?S:p.h))<1e-9)||new Set(tr).size<tr.length;});},
  proto:{d:'S',xh:6,h:8,ab:10,ac:15},
  calc:p=>p.d==='S'?p.ac*p.h/2:p.h,
  text:p=>p.d==='S'
    ?`В треугольнике ABC сторона AB равна ${p.ab}, сторона AC равна ${p.ac}, а высота BH, проведённая к стороне AC, равна ${p.h}. Найдите площадь треугольника ABC.`
    :`Площадь треугольника ABC равна ${fmtNum(p.ac*p.h/2)}, сторона AC равна ${p.ac}. Найдите высоту BH, проведённую к стороне AC.`,
  fig:p=>{const pts={A:V2(0,0),C:V2(p.ac,0),B:V2(p.xh,p.h),H:V2(p.xh,0)};
    const sl=p.d==='S'?[['A','B',fmtNum(p.ab)],['A','C','AC = '+fmtNum(p.ac),COL.blue,0,0.5,0,34],['B','H',fmtNum(p.h),COL.blue,1]]:[['A','C','AC = '+fmtNum(p.ac),COL.blue,0,0.5,0,34],['B','H','?',COL.pink,1]];
    return drawFig({pts,title:'Треугольник ABC, высота BH к стороне AC',segs:[['B','H',{dash:'6 4'}]],rights:[['H','B','C']],sl,pad:50,
      note:p.d==='S'?'S = ?':'',
      chk:[{t:'ang',v:'H',p:'B',q:'C',want:90},{t:'onseg',p:'H',a:'A',b:'C'},{t:'ratio',a:['A','C'],b:['B','H'],want:p.ac/p.h},{t:'ratio',a:['A','B'],b:['B','H'],want:p.ab/p.h}]});},
  steps:p=>{const S=p.ac*p.h/2;return p.d==='S'
    ?[{q:'Чему равно произведение стороны AC на высоту BH, проведённую к ней?',a:p.ac*p.h,chk:'произведение AC · BH',
       show:`AC · BH = ${p.ac} · ${p.h} = ${p.ac*p.h}.`},
      {q:'Чему равна площадь треугольника ABC?',a:S,hint:'Площадь треугольника равна половине произведения стороны на высоту, проведённую к этой стороне.',chk:'половину произведения',
       show:`S = ½ · ${p.ac*p.h} = ${fmtNum(S)}.`}]
    :[{q:'Чему равно произведение AC · BH?',a:2*S,hint:'Площадь треугольника равна половине произведения стороны на высоту, проведённую к этой стороне.',chk:'удвоенную площадь',
       show:`AC · BH = 2S = 2 · ${fmtNum(S)} = ${fmtNum(2*S)}.`},
      {q:'Чему равна высота BH?',a:p.h,chk:'частное 2S : AC',show:`BH = ${fmtNum(2*S)} : ${p.ac} = ${p.h}.`}];},
  diag:p=>{const S=p.ac*p.h/2;return p.d==='S'
    ?[{v:p.ab*p.ac/2,m:'Так считают площадь прямоугольного треугольника по катетам. Здесь угол A не прямой: нужна сторона и высота, проведённая к ней.'},
      {v:p.ac*p.h,m:'Это произведение стороны на высоту — так находят площадь параллелограмма, а не треугольника.'},
      {v:p.ab*p.h/2,m:'Высота BH проведена к стороне AC, а не к AB.'}]
    :[{v:S/p.ac,m:'Здесь площадь поделена на сторону. Но площадь треугольника — половина произведения AC · BH.'},
      {v:2*S,m:'Это произведение AC · BH (удвоенная площадь). Спрашивают саму высоту.'}];}},

areaSin:{topic:'area',name:'Площадь по двум сторонам и углу',ref:'area',
  refWhy:'Даны две стороны и угол между ними: S = ½·AB·AC·sin A.',
  law:'Площадь треугольника равна половине произведения двух сторон на синус угла между ними.',
  gen:()=>{const g=pick([30,150,45,135,60,120]);   // стороны не больше чем втрое разные: чертёж читается
    return rp(()=>g===30||g===150?{g,m:ri(4,20),b:ri(4,20)}:{g,m:ri(2,g===45||g===135?12:10),b:ri(3,16)},p=>{const r=areaSinLen(p)/p.b;return r<1/3||r>3;});},
  proto:{g:150,m:12,b:9},
  calc:p=>areaSinS(p),
  text:p=>`В треугольнике ABC сторона AB равна ${areaSinAB(p)}, сторона AC равна ${p.b}, а угол A между ними равен ${p.g}°. Найдите площадь треугольника ABC.`,
  fig:p=>{const L=areaSinLen(p),pts={A:V2(0,0),C:V2(p.b,0),B:mul(dirv(p.g),L)};
    return drawFig({pts,title:'Треугольник ABC: две стороны и угол между ними',arcs:[{v:'A',p:'C',q:'B',label:dg(p.g)}],
      note:'S = ?',
      sl:[['A','B',areaSinAB(p)],['A','C',fmtNum(p.b)]],
      chk:[{t:'ang',v:'A',p:'B',q:'C',want:p.g},{t:'ratio',a:['A','B'],b:['A','C'],want:L/p.b}]});},
  steps:p=>{const S=areaSinS(p),st=SIN_TXT[p.g],r=p.g===45||p.g===135?2:p.g===60||p.g===120?3:0;
    const h=r?p.m*r/2:p.m/2,steps=[];
    if(r)steps.push({q:`В произведении AB · sin A встречается √${r} · √${r}. Чему равно это произведение корней?`,a:r,
      hint:'Произведение двух одинаковых квадратных корней равно подкоренному числу.',chk:'квадрат квадратного корня',
      show:`По таблице ${st}. Поэтому AB · sin A = ${p.m} · √${r} · √${r} : 2, а √${r} · √${r} = ${r}.`});
    steps.push({q:'Чему равно произведение AB · sin A?',a:h,
      hint:r?'Подставьте найденное произведение корней и выполните действия с коэффициентами.':`Значение синуса возьмите из таблицы: ${st}.`,chk:'произведение стороны AB на синус угла A',
      show:r?`AB · sin A = ${p.m} · ${r} : 2 = ${fmtNum(h)}.`:`AB · sin A = ${p.m} · ½ = ${fmtNum(h)}.`},
      {q:'Чему равна площадь треугольника ABC?',a:S,hint:'Умножьте найденное произведение на сторону AC и возьмите половину.',chk:'половину произведения AC · (AB · sin A)',
       show:`S = ½ · AC · (AB · sin A) = ½ · ${p.b} · ${fmtNum(h)} = ${fmtNum(S)}.`});
    return steps;},
  diag:p=>{const S=areaSinS(p),L=areaSinLen(p);return [
    {v:2*S,m:'Это произведение AB · AC · sin A — удвоенная площадь. Спрашивают площадь треугольника.'},
    {v:L*p.b/2,m:'Так получается без синуса угла A — как будто угол между сторонами прямой.'},
    {v:L*p.b,m:'Это произведение AB · AC — так получается, если не взять ни половину, ни синус угла A.'}];}},

midline:{topic:'area',name:'Средняя линия и периметр',ref:'mid',
  refWhy:'MN соединяет середины двух сторон: она параллельна третьей стороне и равна её половине.',
  law:'Средняя линия треугольника параллельна третьей стороне и равна её половине.',
  gen:()=>{const d=pick(['MN','MN','P']);return rp(()=>({d,x:ri(6,26),y:ri(6,26),z:ri(6,30)}),p=>{
      const {x,y,z}=p;if(!(z<x+y-2&&x<y+z-2&&y<x+z-2)||x===y||x===z||y===z||Math.min(x,y,z)<0.45*Math.max(x,y,z))return true;
      const v=p.d==='MN'?[z/2,x/2,y/2,z,2*z]:[(x+y+z)/2,x+y+z,(x+y)/2+z,(x+y)/2];return new Set(v).size<v.length;});},
  proto:{d:'MN',x:13,y:15,z:14},
  calc:p=>p.d==='MN'?p.z/2:(p.x+p.y+p.z)/2,
  text:p=>p.d==='MN'
    ?`Стороны треугольника ABC равны: AB = ${p.x}, BC = ${p.y}, AC = ${p.z}. Точки M и N — середины сторон AB и BC соответственно. Найдите длину отрезка MN.`
    :`Точки M и N — середины сторон AB и BC треугольника ABC со сторонами AB = ${p.x}, BC = ${p.y}, AC = ${p.z}. Найдите периметр треугольника MBN.`,
  fig:p=>{const bx=(p.x*p.x-p.y*p.y+p.z*p.z)/(2*p.z),B=V2(bx,Math.sqrt(Math.max(0,p.x*p.x-bx*bx)));
    const pts={A:V2(0,0),C:V2(p.z,0),B};pts.M=lerp(pts.A,B,0.5);pts.N=lerp(B,pts.C,0.5);
    return drawFig({pts,title:'Треугольник ABC, M и N — середины сторон AB и BC',pad:42,segs:[['M','N',{col:COL.blue,w:2.4}]],
      ticks:[['A','M',1],['M','B',1],['B','N',2],['N','C',2]],
      sl:[['A','B','AB = '+fmtNum(p.x),COL.blue,0,0.36,0,30],['B','C','BC = '+fmtNum(p.y),COL.blue,0,0.64,0,30],['A','C',fmtNum(p.z)]].concat(p.d==='MN'?[['M','N','?',COL.pink,1]]:[]),
      fills:p.d==='P'?[[['M','B','N'],'rgba(219,39,119,.13)']]:[],
      chk:[{t:'mid',p:'M',a:'A',b:'B'},{t:'mid',p:'N',a:'B',b:'C'},{t:'ratio',a:['A','B'],b:['A','C'],want:p.x/p.z},{t:'ratio',a:['B','C'],b:['A','C'],want:p.y/p.z}]});},
  steps:p=>p.d==='MN'
    ?[{q:'MN — средняя линия треугольника ABC. Какой стороне она параллельна? Введите длину этой стороны.',a:p.z,chk:', какой стороне параллельна средняя линия',
       show:`MN соединяет середины AB и BC, поэтому MN ∥ AC; AC = ${p.z}.`},
      {q:'Чему равна длина MN?',a:p.z/2,hint:'Средняя линия треугольника параллельна третьей стороне и равна её половине.',chk:'половину стороны AC',
       show:`MN = AC : 2 = ${p.z} : 2 = ${fmtNum(p.z/2)}.`}]
    :[{q:'Чему равны отрезки MB и BN вместе?',a:(p.x+p.y)/2,chk:'половины сторон AB и BC',
       show:`MB + BN = ${p.x} : 2 + ${p.y} : 2 = ${fmtNum((p.x+p.y)/2)}.`},
      {q:'Чему равен отрезок MN?',a:p.z/2,hint:'Средняя линия треугольника параллельна третьей стороне и равна её половине.',chk:'половину стороны AC',
       show:`MN = AC : 2 = ${fmtNum(p.z/2)}.`},
      {q:'Чему равен периметр треугольника MBN?',a:(p.x+p.y+p.z)/2,chk:'сумму трёх сторон треугольника MBN',
       show:`P = ${fmtNum((p.x+p.y)/2)} + ${fmtNum(p.z/2)} = ${fmtNum((p.x+p.y+p.z)/2)}.`}],
  diag:p=>p.d==='MN'
    ?[{v:p.x/2,m:'Это половина стороны AB (отрезок AM). Средняя линия MN параллельна третьей стороне — AC.'},
      {v:p.y/2,m:'Это половина стороны BC (отрезок BN). Средняя линия MN параллельна третьей стороне — AC.'},
      {v:p.z,m:'Это длина самой стороны AC. Средняя линия параллельна AC, но короче её.'},
      {v:2*p.z,m:'Средняя линия короче стороны, которой она параллельна, а здесь получилось длиннее AC.'}]
    :[{v:p.x+p.y+p.z,m:'Это периметр всего треугольника ABC, а спрашивают периметр маленького треугольника MBN.'},
      {v:(p.x+p.y)/2+p.z,m:'Здесь отрезок MN взят равным AC. Средняя линия короче AC.'},

/* ---------- ПРАВИЛЬНЫЙ ТРЕУГОЛЬНИК ----------

regR:{topic:'reg',name:'Правильный: радиус описанной',ref:'reg',
  refWhy:'Высота правильного треугольника — по теореме Пифагора; центр делит её в отношении 2 : 1, считая от вершины.',
  law:'Центр правильного треугольника — точка пересечения его медиан (они же высоты); он делит каждую высоту в отношении 2 : 1, считая от вершины. Отсюда R = ⅔h = a√3/3.',
  gen:()=>{const d=pick(['a','a','h','r']);return {d,k:ri(2,d==='h'?15:20),f:ri(0,1)};},
  proto:{d:'a',k:4,f:1},
  calc:p=>p.d==='a'?p.k:2*p.k,
  text:p=>{const k=p.k;
    if(p.d==='a')return p.f?`Около правильного треугольника ABC со стороной ${sq(k,3)} описана окружность. Найдите её радиус.`
      :`Сторона правильного треугольника ABC равна ${sq(k,3)}. Найдите радиус окружности, описанной около этого треугольника.`;
    if(p.d==='h')return p.f?`Окружность описана около правильного треугольника ABC, высота которого равна ${3*k}. Найдите радиус этой окружности.`
      :`Высота правильного треугольника ABC равна ${3*k}. Найдите радиус окружности, описанной около этого треугольника.`;
    return p.f?`В правильный треугольник ABC вписана окружность радиуса ${k}. Найдите радиус окружности, описанной около него.`
      :`Радиус окружности, вписанной в правильный треугольник ABC, равен ${k}. Найдите радиус окружности, описанной около этого треугольника.`;},
  fig:p=>{const s=p.d==='a'?p.k*Math.sqrt(3):2*p.k*Math.sqrt(3);
    return eqFig(s,{circum:true,incircle:p.d==='r',height:p.d!=='r',rad:'?',sideLab:p.d==='a'?sq(p.k,3):null,
      hLab:p.d==='h'?fmtNum(3*p.k):null,rLab:p.d==='r'?fmtNum(p.k):null});},
  steps:p=>{const k=p.k;
    if(p.d==='a')return eqHeightSteps(k,1).concat([{q:'Центр O делит высоту в отношении 2 : 1, считая от вершины. Чему равен радиус R = OB?',a:k,chk:'две трети высоты',
      show:`R = OB = ⅔ · ${fmtNum(1.5*k)} = ${k}. Так и получается формула листа: R = a√3/3.`}]);
    if(p.d==='h')return [
      {q:'Центр O делит высоту в отношении BO : OH = 2 : 1. Если OH принять за одну долю, вся высота содержит три такие доли. Чему равна одна доля?',a:k,chk:'деление высоты на три равные доли',
       show:`Одна часть: ${3*k} : 3 = ${k}.`},
      {q:'Радиус R = OB — две такие части. Чему равен R?',a:2*k,chk:'две части высоты',show:`R = 2 · ${k} = ${2*k}.`}];
    return [
      {q:'Во сколько раз радиус описанной окружности правильного треугольника больше радиуса вписанной?',a:2,
       hint:'Центр правильного треугольника — точка пересечения медиан. Вспомните, в каком отношении она делит каждую медиану.',chk:'отношение R : r',
       show:'R = OB и r = OH, а OB : OH = 2 : 1 — значит, R = 2r.'},
      {q:'Чему равен радиус R?',a:2*k,chk:'удвоенный радиус вписанной окружности',show:`R = 2 · ${k} = ${2*k}.`}];},
  diag:p=>{const k=p.k;
    if(p.d==='a')return [{v:3*k,m:'Это произведение a·√3, а радиус описанной окружности втрое меньше.'},
      {v:k/2,m:'Это радиус вписанной окружности — он меньше радиуса описанной.'},
      {v:1.5*k,m:'Это высота треугольника. Центр описанной окружности лежит на высоте, но не в её основании.'}];
    if(p.d==='h')return [{v:k,m:'Это радиус вписанной окружности — треть высоты. Спрашивают радиус описанной.'},
      {v:1.5*k,m:'Центр окружности не делит высоту пополам.'}];
    return [{v:k/2,m:'Описанная окружность больше вписанной, а здесь получилось меньше.'},
      {v:3*k,m:'Это высота треугольника (R + r). Спрашивают радиус описанной окружности.'}];}},

regH:{topic:'reg',name:'Правильный: высота',ref:'reg',

/* правильный треугольник со стороной s: o.circum / o.incircle — окружности, o.height — высота BH,
   o.rad / o.irad — подпись радиуса OB / OH, o.sideLab / o.hLab / o.RLab / o.rLab / o.areaLab — надписи */
function eqFig(s,o){
  const T=eqPts(s),R=s/Math.sqrt(3),r=R/2,pts={A:T.A,C:T.C,B:T.B},segs=[],sl=[],circles=[],chk=[],dots=['A','B','C'];
  chk.push({t:'ang',v:'A',p:'B',q:'C',want:60},{t:'ang',v:'B',p:'A',q:'C',want:60});
  const needO=o.circum||o.incircle||o.rad||o.irad||o.RLab||o.rLab;
  if(needO){pts.O=T.O;dots.push('O');}
  if(o.height||o.irad||o.rLab){pts.H=T.H;dots.push('H');chk.push({t:'mid',p:'H',a:'A',b:'C'});}
  if(o.circum){circles.push({c:'O',R,col:COL.teal});chk.push({t:'circ',p:'A',c:'O',R},{t:'circ',p:'B',c:'O',R},{t:'circ',p:'C',c:'O',R});}
  if(o.incircle){circles.push({c:'O',R:r,col:COL.violet});chk.push({t:'dline',c:'O',a:'A',b:'C',R:r},{t:'dline',c:'O',a:'A',b:'B',R:r},{t:'dline',c:'O',a:'B',b:'C',R:r});}
  if(o.height)segs.push(['B','H',{dash:'6 4'}]);
  if(o.rad||o.RLab){segs.push(['O','B',{col:COL.teal,w:2.4}]);sl.push(['O','B',o.rad||o.RLab,o.rad==='?'?COL.pink:COL.teal,0,0.5,1]);}
  if(o.irad||o.rLab){segs.push(['O','H',{col:COL.violet,w:2.4}]);sl.push(['O','H',o.irad||o.rLab,o.irad==='?'?COL.pink:COL.violet,0,0.5,1]);}
  if(o.sideLab)sl.push(pts.H?['A','C','AC = '+o.sideLab,o.sideLab==='?'?COL.pink:COL.blue,0,0.5,0,34]:['A','C',o.sideLab,o.sideLab==='?'?COL.pink:COL.blue]);
  const texts=[];   // площадь и «P = ?» — в центре треугольника, как неподвижные надписи
  if(o.areaLab)texts.push({at:['A','B','C'],t:o.areaLab,col:COL.blue,dy:0});
  if(o.perLab)texts.push({at:['A','B','C'],t:'P = ?',col:COL.pink,dy:24});
  return drawFig({pts,dots,title:'Правильный треугольник ABC'+(o.circum?' и описанная окружность':'')+(o.incircle?' и вписанная окружность':''),
    segs,circles,sl:sl.filter(x=>x[2]),ticks:[['A','B',1],['B','C',1],['C','A',1]],lab:{O:[12,-8]},pad:pts.H&&o.sideLab?50:38,
    rights:(o.height||o.irad||o.rLab)?[['H','B','C']]:[],chk,cap:EQCAP,texts,
    note:o.height&&o.hLab?'BH = '+o.hLab:'',noteCol:o.hLab==='?'?COL.pink:COL.blue});
}

/* ловушки одной задачи (решения F1, Q2 делегата владельца): ловушка, совпавшая
   с ответом, снимается; ловушка с неконечным числом (например, 800/29) ловит

   лестницы, решение по развилке 2); две разные ошибки на одно число — одно
   сообщение «найдите свою», три и больше — честный общий текст */
const trapTol=x=>1e-9*Math.max(1,Math.abs(x));
function trapPair(m1,m2){return 'Такой ответ получается при одной из двух ошибок — найдите свою:<br>• '+m1+'<br>• '+m2;}
const TRAP_MANY='Не сходится. Это число получается при нескольких разных ошибках — пройдите решение заново по чертежу: что дано и что спрашивают.';
function mergeTraps(list){
  const up=list.map((_,i)=>i), top=i=>up[i]===i?i:(up[i]=top(up[i]));
  for(let i=0;i<list.length;i++)for(let j=i+1;j<list.length;j++)
    if(Math.abs(list[i].v-list[j].v)<=list[i].e+list[j].e)up[top(j)]=top(i);
  const groups=new Map();
  list.forEach((t,i)=>{const r=top(i);if(!groups.has(r))groups.set(r,[]);groups.get(r).push(t);});
  const out=[];let clash=false;
  for(const g of groups.values()){
    const ms=[...new Set(g.map(t=>t.m))];
    if(ms.length===1){out.push(g[0]);continue;}
    clash=true;
    out.push({v:g[0].v,e:g[0].e,m:ms.length===2?trapPair(ms[0],ms[1]):TRAP_MANY});
  }
  out.clash=clash;
  return out;
}

  const base=SUBS[k], variant=variantFor(k,p), sub=Object.assign({},base,variant), ans=sub.calc(p);

  const kept=raw.filter(d=>isFinite(d.v)&&d.v>0&&Math.abs(d.v-ans)>tol(d.v)+trapTol(ans));
  const diag=mergeTraps(kept.map(d=>({v:d.v,m:d.m,e:tol(d.v)})));
  return Object.assign({k,variantId:variant.id,sub,p,ans,fig:sub.fig(p),text:sub.text(p),steps:sub.steps(p),diag,

}

function parseAns(s){
  s=String(s==null?'':s).trim().replace(/[−–—]/g,'-').replace(/\s+/g,'').replace(/,/g,'.');
  if(!s)return NaN;
  const m=s.match(/^(-?\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)$/);
  if(m){const d=parseFloat(m[2]);return d?parseFloat(m[1])/d:NaN;}
  return /^-?\d+(?:\.\d+)?$/.test(s)?parseFloat(s):NaN;
}
function eqAns(v,ans){return isFinite(v)&&isFinite(ans)&&Math.abs(v-ans)<=1e-9*Math.max(1,Math.abs(ans));}
function matchDiag(v,diag){for(const d of diag){if(Math.abs(v-d.v)<=d.e)return d.m;}return null;}

var KEY = "mathExamCourseProgress.v1";
const QUIZ_TOTAL=10;   // размер зачёта
const PASS_AT=8;       // зачёт сдан при 8 из 10 (решение F2)
const CP=(function(){
  var RO=/[?&]selftest=1/.test(location.search||"");
  function isObj(o){ return !!o && typeof o === "object" && !Array.isArray(o); }
  function num(v){ return (typeof v === "number" && isFinite(v) && v > 0) ? Math.floor(v) : 0; }
  function readAll(){
    try { var o = JSON.parse(localStorage.getItem(KEY) || "{}"); return isObj(o) ? o : {}; }
    catch (e) { return {}; }
  }
  /* меняет только свою ветку: читает ключ заново прямо перед записью */
  function saveRec(fn){
    if (RO) return;
    try {
      var all = readAll();
      var rec = isObj(all[TID]) ? all[TID] : {};
      if (!isObj(rec.solvedByType)) rec.solvedByType = {};
      rec.v = 1;
      fn(rec);
      rec.updatedAt = Date.now();
      all[TID] = rec;
      localStorage.setItem(KEY, JSON.stringify(all));
    } catch (e) {}
  }
  function solvedOne(type){ saveRec(function(rec){ rec.solvedByType[type] = num(rec.solvedByType[type]) + 1; }); }
  function finishQuiz(score, total){
    saveRec(function(rec){
      rec.runs = num(rec.runs) + 1;
      rec.total = total;
      rec.best = Math.max(num(rec.best), score);
      if (score >= PASS_AT) rec.passed = true;
    });
  }
  /* журнал: промах открывает тип, три верных подряд закрывают;
     верный ответ по типу без промахов записи не заводит */
  function mlog(type, ok){
    if (RO) return;
    try {
      var all = readAll();
      var key = TID + "|" + type;
      if (ok && !(isObj(all.mistakes) && isObj(all.mistakes[key]))) return;
      if (!isObj(all.mistakes)) all.mistakes = {};
      var e = isObj(all.mistakes[key]) ? all.mistakes[key] : (all.mistakes[key] = { w:0, r:0 });
      if (ok) { if (num(e.w)) e.r = num(e.r) + 1; }
      else { e.w = num(e.w) + 1; e.r = 0; e.lastWrong = Date.now(); }
      e.last = Date.now();
      localStorage.setItem(KEY, JSON.stringify(all));
    } catch (err) {}
  }
  /* режим повтора: только открытые типы этого тренажёра */
  function openTypes(){
    var mk = readAll().mistakes, pre = TID + "|", res = [];
    if (!isObj(mk)) return res;
    for (var k in mk) if (Object.prototype.hasOwnProperty.call(mk, k) && k.indexOf(pre) === 0){
      var t = k.slice(pre.length), e = mk[k];
      if (isObj(e) && num(e.w) > 0 && num(e.r) < 3 && TYPE_IDS.indexOf(t) >= 0) res.push(t);
    }
    return res;
  }
  var REVIEW = /[?&]mode=review(&|$)/.test(location.search || "");
  return { RO:RO, REVIEW:REVIEW, isObj:isObj, num:num, readAll:readAll, saveRec:saveRec,
    solvedOne:solvedOne, finishQuiz:finishQuiz, mlog:mlog, openTypes:openTypes };
})();
/* Детализация журнала живёт только в своей ветке. Общий журнал курса по-прежнему
   содержит 26 ключей TID|тип; он закрывается, когда закрыты все ошибочные методы.
   Старую открытую запись без детализации повторяем по всем вариантам типа:
   прежняя запись не позволяет достоверно восстановить, какой способ вызвал ошибку. */
function variantMistakes(all){
  const rec=all&&all[TID];return CP.isObj(rec)&&CP.isObj(rec.mistakesByVariant)?rec.mistakesByVariant:{};
}
function openReviewVariants(){
  const all=CP.readAll(), details=variantMistakes(all);
  return TASK_VARIANTS.filter(v=>{
    const e=CP.isObj(all.mistakes)&&all.mistakes[TID+'|'+v.k];
    if(!CP.isObj(e)||CP.num(e.w)===0||CP.num(e.r)>=3)return false;
    const group=TASK_VARIANTS.filter(x=>x.k===v.k);
    const tracked=group.some(x=>CP.isObj(details[x.id])&&CP.num(details[x.id].w)>0&&CP.num(details[x.id].r)<3);
    return !tracked||(CP.isObj(details[v.id])&&CP.num(details[v.id].w)>0&&CP.num(details[v.id].r)<3);
  });
}
function logTaskVerdict(t,ok){
  if(CP.RO||!TASK_VARIANTS.some(v=>v.id===t.variantId&&v.k===t.k))return;
  try{
    const all=CP.readAll(), key=TID+'|'+t.k;
    const old=CP.isObj(all.mistakes)&&CP.isObj(all.mistakes[key])?all.mistakes[key]:null;
    if(ok&&(!old||!CP.num(old.w)))return;
    const rec=CP.isObj(all[TID])?all[TID]:{}, previous=variantMistakes(all), details={};
    // Ограниченный набор известных вариантов; чужие ветки и журнал не затрагиваем.
    for(const v of TASK_VARIANTS)if(CP.isObj(previous[v.id]))details[v.id]=previous[v.id];
    const group=TASK_VARIANTS.filter(v=>v.k===t.k);
    const tracked=group.some(v=>CP.isObj(details[v.id])&&CP.num(details[v.id].w)>0&&CP.num(details[v.id].r)<3);
    if(old&&CP.num(old.w)>0&&CP.num(old.r)<3&&!tracked){
      for(const v of group)details[v.id]={w:CP.num(old.w),r:0,lastWrong:old.lastWrong,last:old.last,legacy:true};
    }
    if(ok&&(!CP.isObj(details[t.variantId])||!CP.num(details[t.variantId].w)))return;
    const now=Date.now(), e=CP.isObj(details[t.variantId])?details[t.variantId]:{w:0,r:0};
    if(ok)e.r=Math.min(3,CP.num(e.r)+1);
    else{e.w=CP.num(e.w)+1;e.r=0;e.lastWrong=now;delete e.legacy;}
    e.last=now;details[t.variantId]=e;
    const shared=old||{w:0,r:0};
    if(!ok){shared.w=CP.num(shared.w)+1;shared.lastWrong=now;}
    const active=group.map(v=>details[v.id]).filter(x=>CP.isObj(x)&&CP.num(x.w)>0);
    shared.r=Math.min(...active.map(x=>Math.min(3,CP.num(x.r))));shared.last=now;
    if(!CP.isObj(all.mistakes))all.mistakes={};all.mistakes[key]=shared;
    rec.mistakesByVariant=details;rec.v=1;rec.updatedAt=now;
    if(!CP.isObj(rec.solvedByType))rec.solvedByType={};all[TID]=rec;
    localStorage.setItem(KEY,JSON.stringify(all));
  }catch(e){}
}
/* свои поля записи (отметки разбора, счётчики тренировки) — тоже через CP.saveRec */
function loadSt(){
  const r=CP.readAll()[TID], o=CP.isObj(r)?r:{}, sb=CP.isObj(o.solvedByType)?o.solvedByType:{};
  let solved=0; TYPE_IDS.forEach(k=>{solved+=CP.num(sb[k]);});
  return {solved, best:(typeof o.best==='number'&&isFinite(o.best))?CP.num(o.best):null,
    razbor:CP.isObj(o.razbor)?o.razbor:{},razborVariants:CP.isObj(o.razborVariants)?o.razborVariants:{}};
}
let st=loadSt();
function markRazbor(k,id){CP.saveRec(rec=>{rec.razbor=CP.isObj(rec.razbor)?rec.razbor:{};rec.razbor[k]=1;
  rec.razborVariants=CP.isObj(rec.razborVariants)?rec.razborVariants:{};rec.razborVariants[id]=1;});st=loadSt();}

/* ================= UI ================= */
let TAB='razbor', streak=0, userActed=false, _lid=0;
let rzOpen=null, rzVariant=null, rzStep=0, rzAns=false;
let trTopic='all', trSubOnly=null, trVariantOnly=null, tr=null;
let trReview=CP.REVIEW, trReviewEmpty=false;      // ?mode=review: задачи только из открытых типов журнала
let qz=null;
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function plain(h){return String(h).replace(/<[^>]*>/g,'').replace(/&nbsp;/g,' ');}
function tagTopic(t){return `<span class="tag topic">${TOPICS[t]}</span>`;}
function refcallHtml(sub){
  const r=REFS.find(x=>x.id===sub.ref); if(!r)return '';
  return `<button type="button" class="refcall" data-ref="${r.id}"><span class="t">📖 Справочник: ${r.name}.</span> ${sub.refWhy||''}</button>`;
}
function figHtml(t){return `<div class="diagram">${t.fig.svg}</div>${t.fig.cap?`<div class="figcap">${t.fig.cap}</div>`:''}`;}
function updStats(){
  $('#stSolved').textContent=st.solved;
  $('#stStreak').textContent=streak;
  $('#stBest').textContent=st.best==null?'—':st.best+'/'+QUIZ_TOTAL;
  const done=TASK_VARIANTS.filter(v=>st.razborVariants[v.id]).length;
  $('#cntRz').textContent=done?`${done}/${TASK_VARIANTS.length}`:'';
}
function bindRefcalls(root){(root||document).querySelectorAll('.refcall').forEach(el=>el.addEventListener('click',()=>openRef(el.dataset.ref)));}
function focusIf(el){if(userActed&&el&&!el.disabled)try{el.focus({preventScroll:true});}catch(e){}}
/* показать появившийся итог или ступень, если они ниже края экрана (мгновенно — без анимации) */
function reveal(el){if(el&&el.scrollIntoView)try{el.scrollIntoView({block:'nearest'});}catch(e){}}
/* экран тренировки и зачёта при уходе на другую вкладку не пересоздаётся: узлы
   уходят в запас и возвращаются как были — лестница, введённые числа, вердикт,
   кнопки (находки ревью 1, 2). SHOWN — какой экран сейчас в #main. */
let SHOWN=null;
function stashMain(){
  const o=SHOWN==='train'?tr:(SHOWN==='quiz'&&qz&&qz.i<qz.items.length?qz:null);
  if(o){const f=document.createDocumentFragment(),m=$('#main');while(m.firstChild)f.appendChild(m.firstChild);o.dom=f;}
  SHOWN=null;
}
function restoreMain(o,name){if(!o||!o.dom)return false;$('#main').replaceChildren(o.dom);o.dom=null;SHOWN=name;return true;}
function markTab(tb){$$('.tab').forEach(b=>{b.classList.toggle('active',b.dataset.tab===tb);b.setAttribute('aria-pressed',String(b.dataset.tab===tb));});}
function switchTab(tb){
  if(tb===TAB&&SHOWN===tb)return;   // нажатие на открытую вкладку тренировки или зачёта ничего не сбрасывает
  stashMain(); TAB=tb; markTab(tb);
  render();
}
/* после перехода на новый экран фокус — на нём, а не на body (находка ревью 11) */
function focusMain(){focusIf($('#main'));}
function render(){
  updStats(); SHOWN=TAB;
  if(TAB==='razbor')renderRazbor();
  else if(TAB==='train')renderTrain();
  else if(TAB==='quiz')renderQuiz();
  else renderRefs();
}

/* ---------- Разбор: ступени «вопрос → ответ», по одному нажатию (канон) ---------- */
function renderRazbor(){
  if(rzOpen)return renderRazborDetail();
  let html=`<div class="progressline">Выберите способ решения. Внутри карточки можно выбрать пример: сначала вопрос шага, потом ответ на него. Карточка зеленеет, когда разобраны все её примеры.</div>`;
  for(const tk of Object.keys(TOPICS)){
    const keys=TYPE_IDS.filter(k=>TASK_VARIANTS.some(v=>v.k===k&&v.topic===tk));
    html+=`<h3 style="font-family:Georgia,serif;margin:18px 0 10px">${TOPICS[tk]}</h3><div class="rzgrid">`;
    html+=keys.map(k=>{const examples=TASK_VARIANTS.filter(v=>v.k===k&&v.topic===tk),n=examples.filter(v=>st.razborVariants[v.id]).length;
      return `<button type="button" class="rzcard${n===examples.length?' done':''}" data-k="${k}" data-variant="${examples[0].id}">
      <div class="nm">${examples.length===1?examples[0].name:SUBS[k].name}</div><div class="tp">${TOPICS[tk]}</div>
      <div class="${n?'ok':'tp'}">Разобрано примеров: ${n} из ${examples.length}</div></button>`;}).join('');
    html+=`</div>`;
  }
  $('#main').innerHTML=html;
  $$('.rzcard').forEach(c=>c.addEventListener('click',()=>{rzOpen=c.dataset.k;rzVariant=c.dataset.variant;rzStep=0;rzAns=false;render();focusMain();}));
}
function renderRazborDetail(){
  const k=rzOpen,examples=TASK_VARIANTS.filter(v=>v.k===k);
  if(!examples.some(v=>v.id===rzVariant))rzVariant=examples[0].id;
  const t=buildVariant(rzVariant,true),sub=t.sub,n=t.steps.length;
  const finished=rzStep>=n&&rzAns;
  let steps='';
  for(let j=0;j<rzStep;j++){
    const s=t.steps[j], open=j<rzStep-1||rzAns;
    steps+=`<div class="rzstep"><div><b>Шаг ${j+1}.</b> ${s.q}</div>${open?`<div class="a">${s.show}</div>`:''}</div>`;
  }
  let btn;
  if(finished)btn=`<div class="fb ok show">Ответ: <b>${fmtNum(t.ans)}</b></div>
      <div class="law"><b>Правило.</b> ${sub.law}</div>${refcallHtml(sub)}
      <div class="rowbtns"><button type="button" class="blue" id="rzTrain">Тренировать этот способ →</button><button type="button" id="rzDone">${st.razborVariants[rzVariant]?'✓ Пример разобран':'Отметить пример разобранным'}</button><button type="button" class="sec" id="rzBack2">К списку типов</button></div>`;
  else if(rzStep===0)btn=`<div class="rowbtns"><button type="button" id="rzNext">Показать первый шаг</button></div>`;
  else if(!rzAns)btn=`<div class="rowbtns"><button type="button" id="rzNext">Ответ шага</button></div><div class="smallnote" style="margin-top:8px">Шаг ${rzStep} из ${n}: сначала подумайте над вопросом.</div>`;
  else btn=`<div class="rowbtns"><button type="button" id="rzNext">Следующий шаг</button></div><div class="smallnote" style="margin-top:8px">Шаг ${rzStep} из ${n}</div>`;
  $('#main').innerHTML=`<button type="button" class="backlink" id="rzBack">← Ко всем типам</button>
  ${examples.length>1?`<div style="margin:8px 0 12px"><label for="rzVariant">Пример и способ решения:</label><br><select id="rzVariant" style="max-width:100%;font:inherit;padding:8px">${examples.map(v=>`<option value="${v.id}"${v.id===rzVariant?' selected':''}>${st.razborVariants[v.id]?'✓ ':''}${v.name}</option>`).join('')}</select></div>`:''}
  <div class="meta">${tagTopic(sub.topic)}<span class="tag gen">разбор типа</span><b style="font-family:Georgia,serif">${sub.name}</b></div>
  <div class="grid"><div>${figHtml(t)}</div><div>
    <div class="task">${t.text}</div>
    <div class="steps">${steps}</div>${btn}
  </div></div>`;
  bindRefcalls();
  const selector=$('#rzVariant');if(selector)selector.addEventListener('change',()=>{rzVariant=selector.value;rzStep=0;rzAns=false;render();focusIf($('#rzVariant'));});
  const bk=()=>{rzOpen=null;render();focusMain();};
  $('#rzBack').addEventListener('click',bk);
  if(finished){
    $('#rzBack2').addEventListener('click',bk);
    $('#rzDone').addEventListener('click',()=>{markRazbor(k,rzVariant);bk();});
    $('#rzTrain').addEventListener('click',()=>{const id=rzVariant;markRazbor(k,id);rzOpen=null;startTrainSub(k,id);});
  } else $('#rzNext').addEventListener('click',()=>{
    if(rzStep===0){rzStep=1;rzAns=false;}
    else if(!rzAns)rzAns=true;
    else{rzStep++;rzAns=false;}
    render(); focusIf($('#rzNext')||$('#rzTrain'));
  });
}

/* ---------- Тренировка ---------- */
/* строка над лестницей до первого нажатия (решение D3, дословно) */
const LADDER_NOTE='Подсказки ничего не отнимают. «Показать шаг» открывает результат ступени — после этого задача в счёт решённых не пойдёт (промахом это не считается). Ответ задачи — на последней ступени.';
const PNOTE15='<details class="pnote"><summary>О прогрессе: подсказки ничего не отнимают</summary><div>Баллов и «звёздочек» здесь нет. Задача засчитывается как решённая, если ответ получен без «Показать шаг»; ошибка, исправленная самостоятельно, этому не мешает. «Подсказка» и «Решить по шагам» ничего не отнимают. Ошибки попадают в «Работу над ошибками» курса. Каждый способ решения закрывается после трёх задач подряд без промаха; весь тип — когда повторены все способы, в которых были ошибки.</div></details>';
const MSG_NUM='Введите число: целое или десятичную дробь (через запятую или точку).';
/* ответ задания 15 — целое или конечная десятичная дробь, корни бывают только в условии (поправка 1 делегата) */
function numMsg(s){return /√|sqrt|корен/i.test(String(s))?'Ответ задания 15 записывается числом без корня — целым или десятичной дробью. Корни бывают только в условии.':MSG_NUM;}
function pickTrainTask(){
  if(trReview){
    const open=openReviewVariants();
    if(open.length)return pickVariantTask(open);
    trReview=false; trReviewEmpty=true;
  }
  const variants=variantsForTopic(trTopic).filter(v=>(!trSubOnly||v.k===trSubOnly)&&(!trVariantOnly||v.id===trVariantOnly));
  return pickVariantTask(variants.length?variants:TASK_VARIANTS);
}
function startTrainSub(k,id){trReview=false;trReviewEmpty=false;trSubOnly=k;trVariantOnly=id||null;trTopic='all';tr=null;switchTab('train');focusMain();}
function startRazborSub(k,id){rzOpen=k;rzVariant=id||TASK_VARIANTS.find(v=>v.k===k).id;rzStep=0;rzAns=false;switchTab('razbor');focusMain();}
/* учёт задачи (решения D1, F8): промах — сразу и один раз; решено — без показанных шагов */
function trMiss(){if(!tr||tr.missed||tr.shown||tr.done)return;tr.missed=true;logTaskVerdict(tr.t,false);streak=0;updStats();}
function trFinish(){
  if(!tr||tr.done)return;
  tr.done=true;
  const clean=!tr.shown;
  if(clean){CP.solvedOne(tr.t.k);if(!tr.missed)logTaskVerdict(tr.t,true);}
  streak=clean&&!tr.missed?streak+1:0;
  CP.saveRec(rec=>{const x=CP.isObj(rec.train)?rec.train:{};rec.train={solved:CP.num(x.solved)+(clean?1:0),shown:CP.num(x.shown)+(clean?0:1)};});
  st=loadSt(); updStats();
}
/* двойное касание: второе касание в первые 400 мс после смены экрана не срабатывает (находка ревью 4) */
const fresh=t0=>performance.now()-t0<400;
function renderTrain(){
  if(restoreMain(tr,'train'))return;
  if(!tr)tr={t:pickTrainTask(),missed:false,shown:false,done:false,ladder:false};
  tr.t0=performance.now();
  const t=tr.t;
  const open=trReview?openReviewVariants():[];
  const reviewDetails=variantMistakes(CP.readAll());
  const legacyReview=trReview&&open.some(v=>reviewDetails[v.id]?.legacy||
    !TASK_VARIANTS.some(x=>x.k===v.k&&CP.isObj(reviewDetails[x.id])&&CP.num(reviewDetails[x.id].w)>0&&CP.num(reviewDetails[x.id].r)<3));
  const reviewNote=trReview
    ?`<div class="review-note" role="status"><b>Работа над ошибками:</b> ${open.map(v=>'«'+v.name+'»').join(', ')}. Каждый способ закрывается тремя задачами подряд без промаха.${legacyReview?' В старой записи способ решения не сохранён; повторяем варианты этого типа.':''} Выбор темы — выход из повтора.</div>`
    :(trReviewEmpty?`<div class="smallnote" role="status" style="margin-bottom:8px">Открытых типов в журнале ошибок нет — обычная тренировка.</div>`:'');

    `<button type="button" class="chip${!trReview&&!trSubOnly&&trTopic===v?' on':''}" data-topic="${v}">${n}</button>`).join('');
  const subChip=trSubOnly?`<button type="button" class="chip on trsub" id="trSubOff">${trVariantOnly?'Способ: '+TASK_VARIANTS.find(v=>v.id===trVariantOnly).name:'Тип: '+SUBS[trSubOnly].name} ✕</button>`:'';
  $('#main').innerHTML=`<div class="filters">${chips}${subChip}</div>
  ${reviewNote}
  <div class="meta">${tagTopic(t.sub.topic)}<span class="smallnote">${t.sub.name}</span></div>
  <div class="grid"><div>${figHtml(t)}</div><div>
    <div class="task" id="taskText">${t.text}</div>
    <div class="controls"><input class="ans" id="ans" inputmode="decimal" placeholder="ответ" autocomplete="off" aria-label="Ответ задачи">
      <button type="button" id="check">Проверить</button>
      <button type="button" class="soft" id="ladBtn">Решить по шагам</button></div>
    <div class="fb" id="fb" role="status" aria-live="polite" tabindex="-1"></div>
    <div class="rowbtns" id="nextRow" style="display:none"><button type="button" class="blue" id="next">Следующая →</button></div>
    <div class="ladder" id="lad" style="display:none"></div>
    <div id="after"></div>
  </div></div>${PNOTE15}`;
  $$('.chip[data-topic]').forEach(ch=>ch.addEventListener('click',()=>{trTopic=ch.dataset.topic;trSubOnly=null;trVariantOnly=null;trReview=false;trReviewEmpty=false;tr=null;render();focusMain();}));
  const off=$('#trSubOff'); if(off)off.addEventListener('click',()=>{trSubOnly=null;trVariantOnly=null;tr=null;render();focusMain();});
  const fb=$('#fb'), inp=$('#ans');
  /* итог задачи: после лестницы — под лестницей, где ученик закончил, иначе у поля ответа */
  const doneUi=(msg,cls)=>{
    inp.disabled=true;$('#check').disabled=true;$('#ladBtn').style.display='none';
    const law=`<div class="law"><b>Правило.</b> ${t.sub.law}</div>${refcallHtml(t.sub)}`;
    tr.doneAt=performance.now();
    if(tr.ladder){
      $('#after').innerHTML=`<div class="fb ${cls} show" id="fbDone" role="status" tabindex="-1">${msg}</div>${law}<div class="rowbtns"><button type="button" class="blue" id="next2">Следующая →</button></div>`;
      $('#next2').addEventListener('click',nextTask);
    } else {
      fb.className='fb '+cls+' show';fb.innerHTML=msg;$('#nextRow').style.display='';   // «Следующая →» — после итога: Tab с итога ведёт на неё
      $('#after').innerHTML=law;
    }
    /* фокус — на итоге, а не на «Следующая →»: второй Enter не перелистывает задачу (находка ревью 3) */
    bindRefcalls($('#after')); focusIf(tr.ladder?$('#fbDone'):fb); reveal(tr.ladder?$('#next2'):$('#nextRow'));
  };
  const nextTask=()=>{if(!tr||fresh(tr.doneAt||0))return;tr=null;render();focusIf($('#ans'));};
  $('#check').addEventListener('click',()=>{
    if(tr.done||tr.ladder||fresh(tr.t0))return;
    const v=parseAns(inp.value);
    if(!isFinite(v)){fb.className='fb show';fb.textContent=numMsg(inp.value);return;}
    if(eqAns(v,t.ans)){trFinish();doneUi(`Верно! Ответ ${fmtNum(t.ans)}.${tr.missed?' Ошибку вы исправили сами — задача засчитана.':''}`,'ok');}
    else{
      trMiss();
      const d=matchDiag(v,t.diag);
      fb.className=d?'fb diag show':'fb bad show';
      fb.innerHTML=(d||'Пока неверно. Сверьтесь с чертежом: что дано и что спрашивают.')+' Можно попробовать ещё раз или открыть «Решить по шагам».'; reveal(fb);
    }
  });
  $('#ladBtn').addEventListener('click',()=>{
    if(tr.done||tr.ladder||fresh(tr.t0))return;
    tr.ladder=true; inp.disabled=true; $('#check').disabled=true; $('#ladBtn').style.display='none';
    const lad=$('#lad'); lad.style.display='';
    mountLadder(lad,t,{onMiss:trMiss,onShow:()=>{tr.shown=true;},onDone:()=>{
      trFinish();
      doneUi(tr.shown?`Ответ задачи: ${fmtNum(t.ans)}. Шаг был показан — эта задача в счёт не идёт; попробуйте следующую такую же сами.`
        :`Все шаги решены самостоятельно — задача засчитана. Ответ ${fmtNum(t.ans)}.`,tr.shown?'':'ok');
    }});
  });
  $('#next').addEventListener('click',nextTask);
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('#check').click();}});
}
/* лестница: ступень — вопрос, поле для числа ступени, «Проверить», «Подсказка»
   (правило без результата), «Показать шаг» (результат ступени → «решение показано») */
function mountLadder(root,t,h){
  root.innerHTML=`<p class="lnote">${LADDER_NOTE}</p>`;
  let i=0;
  const next=()=>{if(i>=t.steps.length){h.onDone();return;}step(i);};
  function step(idx){
    const s=t.steps[idx], last=idx===t.steps.length-1, id='ls'+(++_lid);
    const div=document.createElement('div');div.className='lstep';
    div.innerHTML=`<div class="q"><span class="sn">Шаг ${idx+1}.</span> ${s.q}</div>
      <div class="row"><input class="ans" id="${id}i" inputmode="decimal" autocomplete="off" aria-label="Ответ шага ${idx+1}">
      <button type="button" id="${id}c">Проверить</button>${s.hint?`<button type="button" class="soft" id="${id}h">Подсказка</button>`:''}
      <button type="button" class="sec" id="${id}s">Показать шаг</button></div>
      <div class="fb" id="${id}f" role="status" aria-live="polite"></div>`;
    root.appendChild(div);
    const inp=div.querySelector('input'), fb=div.querySelector('.fb');
    let resolved=false;
    const lock=()=>div.querySelectorAll('input,button').forEach(e=>{e.disabled=true;});
    const check=()=>{
      if(resolved)return;
      const v=parseAns(inp.value);
      if(!isFinite(v)){fb.className='fb show';fb.textContent=numMsg(inp.value)+(!isDec(s.a)?' Если число не записывается конечной десятичной дробью, введите обыкновенную дробь, например 5/13.':'');return;}
      const near=!isDec(s.a)&&Math.abs(v-s.a)<=0.005;   // неконечное значение введено приближённо — верно, с точной записью
      if(eqAns(v,s.a)||near){resolved=true;fb.className='fb ok show';fb.innerHTML=(near?'Верно: точное значение — '+(s.at||fmtNum(s.a))+'. ':'Верно! ')+s.show;div.classList.add('ok');lock();i++;next();}
      else{h.onMiss();const d=last?matchDiag(v,t.diag):null;fb.className=d?'fb diag show':'fb bad show';
        const c=s.chk||'этот шаг';fb.innerHTML=d||('Пока не сходится: проверьте'+(c[0]===','?c:' '+c)+'.');}
    };
    div.querySelector('#'+id+'c').addEventListener('click',check);
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();check();}});
    const hb=div.querySelector('#'+id+'h');
    if(hb)hb.addEventListener('click',()=>{if(div.querySelector('.hintbox'))return;const x=document.createElement('div');x.className='hintbox';x.innerHTML='Подсказка: '+s.hint;div.insertBefore(x,fb);hb.disabled=true;});
    div.querySelector('#'+id+'s').addEventListener('click',()=>{
      if(resolved)return;resolved=true;h.onShow();
      fb.className='fb show';fb.innerHTML=s.show;div.classList.add('shown');lock();i++;next();
    });
    focusIf(inp); reveal(div);
  }
  next();
}

/* ---------- Зачёт (решения F2, D9, D15): 10 задач, одна попытка, тип скрыт, голый вердикт ---------- */
const QUIZ_QUOTA={ug:2,iso:2,pyth:1,trig:2,area:2,reg:1};
function startQuiz(){
  const items=[],used=new Set();
  for(const tk in QUIZ_QUOTA){
    const variants=variantsForTopic(tk),keys=shuffle([...new Set(variants.map(v=>v.k))].filter(k=>!used.has(k))).slice(0,QUIZ_QUOTA[tk]);
    if(keys.length!==QUIZ_QUOTA[tk])throw new Error('Недостаточно способов для зачёта: '+tk);
    for(const k of keys){used.add(k);items.push(buildVariant(pick(variants.filter(v=>v.k===k)).id));}
  }
  qz={items:shuffle(items),i:0,res:[],answered:false,done:false};
}
function renderQuiz(){
  const main=$('#main');
  if(!qz){
    main.innerHTML=`<div class="fin"><div style="font-family:Georgia,serif;font-size:22px;margin-bottom:8px">Зачёт: ${QUIZ_TOTAL} задач, одна попытка на задачу</div>
    <div class="smallnote">Тип задачи не называется, подсказок и шагов нет. Состав: 2 — углы и внешний угол, 2 — равнобедренный треугольник, биссектриса, высота, 1 — применение теоремы Пифагора, 2 — sin, cos, tg, 2 — площадь, высота, средняя линия, медиана, 1 — правильный треугольник. Зачёт сдан при ${PASS_AT} верных из ${QUIZ_TOTAL}.</div>
    <div class="rowbtns" style="justify-content:center"><button type="button" id="qStart">Начать зачёт</button></div>
    ${st.best!=null?`<div class="smallnote" style="margin-top:8px">Лучший результат: ${st.best}/${QUIZ_TOTAL}</div>`:''}</div>`;
    $('#qStart').addEventListener('click',()=>{startQuiz();render();focusIf($('#qAns'));});
    return;
  }
  if(restoreMain(qz,'quiz'))return;
  if(qz.i>=qz.items.length)return renderQuizFinal();
  const t=qz.items[qz.i]; qz.t0=performance.now();
  main.innerHTML=`<div class="quizq">Задача ${qz.i+1} из ${qz.items.length}</div>
  <div class="grid"><div>${figHtml(t)}</div><div>
    <div class="task">${t.text}</div>
    <div class="controls"><input class="ans" id="qAns" inputmode="decimal" placeholder="ответ" autocomplete="off" aria-label="Ответ">
      <button type="button" id="qCheck">Ответить</button></div>
    <div class="fb" id="qFb" role="status" aria-live="polite" tabindex="-1"></div>
    <div class="rowbtns" id="qNextRow" style="display:none"><button type="button" class="blue" id="qNext">${qz.i===qz.items.length-1?'К результатам':'Дальше →'}</button></div>
  </div></div>`;
  const fb=$('#qFb'), inp=$('#qAns');
  $('#qCheck').addEventListener('click',()=>{
    if(qz.answered||fresh(qz.t0))return;
    const v=parseAns(inp.value);
    if(!isFinite(v)){fb.className='fb show';fb.textContent=numMsg(inp.value);return;}
    qz.answered=true;
    const ok=eqAns(v,t.ans);
    qz.res.push({ok,k:t.k,variantId:t.variantId,name:t.sub.name,v,ans:t.ans,d:ok?null:matchDiag(v,t.diag)});
    logTaskVerdict(t,ok);   // зачёт тоже пишет журнал: одна попытка — один вердикт
    fb.className=ok?'fb ok show':'fb bad show'; fb.textContent=ok?'Верно.':'Неверно.';
    qz.ansAt=performance.now();
    /* фокус — на вердикте: Enter после ответа не перелистывает (находка ревью 3) */
    inp.disabled=true; $('#qCheck').disabled=true; $('#qNextRow').style.display=''; focusIf(fb); reveal($('#qNextRow'));
  });
  $('#qNext').addEventListener('click',()=>{if(!qz.answered||fresh(qz.ansAt||0))return;qz.i++;qz.answered=false;render();focusIf($('#qAns')||$('#qFin'));});
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();if(!qz.answered)$('#qCheck').click();}});
}
function renderQuizFinal(){
  const score=qz.res.filter(r=>r.ok).length, total=qz.items.length;
  if(!qz.done){qz.done=true;CP.finishQuiz(score,total);st=loadSt();updStats();}
  const verdict=score>=PASS_AT
    ?`<div class="smallnote" role="status" style="color:#15803d;font-weight:700">Зачёт сдан: ${score} из ${total} (нужно ${PASS_AT}).</div>`
    :`<div class="smallnote" role="status">Для зачёта нужно ${PASS_AT} верных из ${total}. Разберите типы из списка и попробуйте ещё раз.</div>`;
  const dots=qz.res.map(r=>`<span class="dot ${r.ok?'g':'r'}" title="${r.ok?'верно':'неверно'}"></span>`).join('');
  const lines=qz.res.map((r,i)=>r.ok?'':`<li>Задача ${i+1} — «${r.name}»: ваш ответ ${fmtNum(r.v)}${r.d?' — '+r.d:''}; верный ответ ${fmtNum(r.ans)}.
      <button type="button" class="sec minibtn" data-rz="${r.k}" data-variant="${r.variantId}">Разбор</button> <button type="button" class="blue minibtn" data-tr="${r.k}" data-variant="${r.variantId}">Тренировать</button></li>`).join('');
  const t0=performance.now();
  $('#main').innerHTML=`<div class="fin" id="qFin" tabindex="-1"><div class="score">${score} / ${total}</div>
    ${verdict}<div class="dots" style="justify-content:center">${dots}</div>
    ${lines?`<div class="route"><b>Разбор ошибок:</b><ul>${lines}</ul></div>`:`<div class="route"><b>Все задачи решены верно.</b></div>`}
    <div class="rowbtns" style="justify-content:center"><button type="button" id="qAgain">Пройти ещё раз</button></div></div>`;
  $$('.route button').forEach(b=>b.addEventListener('click',()=>{if(fresh(t0))return;qz=null;if(b.dataset.rz)startRazborSub(b.dataset.rz,b.dataset.variant);else startTrainSub(b.dataset.tr,b.dataset.variant);focusMain();}));
  $('#qAgain').addEventListener('click',()=>{if(fresh(t0))return;startQuiz();render();focusIf($('#qAns'));});
}
