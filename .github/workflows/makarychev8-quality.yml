name: Makarychev 8 course quality
on:
  pull_request:
    paths:
      - 'school/makarychev8/**'
      - 'school/peterson6/math.js'
      - '.github/workflows/makarychev8-quality.yml'
  push:
    branches: [main]
    paths:
      - 'school/makarychev8/**'
      - 'school/peterson6/math.js'
permissions:
  contents: read
jobs:
  course:
    runs-on: ubuntu-latest
    # Four full source-block browser suites plus every course DOM journey.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent textbook mathematics
        run: |
          python -m pip install sympy==1.14.0
          python school/makarychev8/test-exercises-1-24.py
          python school/makarychev8/test-exercises-25-54.py
          python school/makarychev8/test-exercises-55-74.py
          python school/makarychev8/test-exercises-75-109.py
      - name: Build, syntax and mathematical contracts
        run: |
          node school/makarychev8/build.cjs
          git diff --exit-code -- school/makarychev8/data.js
          node --check school/makarychev8/app.js
          node --check school/makarychev8/check.js
          node --check school/makarychev8/models.js
          node --check school/makarychev8/task-graphs.js
          node school/makarychev8/test-task-graphs.cjs
          node school/makarychev8/test-course.cjs
          node school/makarychev8/test-models.cjs
          node school/makarychev8/test-state.cjs
          git diff --check
      - name: Isolated DOM and browser dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/makarychev-qa" --no-audit --no-fund --ignore-scripts jsdom@26.1.0 playwright@1.62.1
          node "$RUNNER_TEMP/makarychev-qa/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Every worked solution and saved-work journey
        run: |
          NODE_PATH="$RUNNER_TEMP/makarychev-qa/node_modules" node school/makarychev8/test-ui.cjs
          NODE_PATH="$RUNNER_TEMP/makarychev-qa/node_modules" node school/makarychev8/test-import.cjs
      - name: Chromium source exercises and responsive layout
        run: NODE_PATH="$RUNNER_TEMP/makarychev-qa/node_modules" node school/makarychev8/test-browser.cjs
      - name: Chromium exercises25–54 and graph construction
        run: NODE_PATH="$RUNNER_TEMP/makarychev-qa/node_modules" node school/makarychev8/test-browser-25-54.cjs
      - name: Chromium exercises55–74, signs and integral values
        run: NODE_PATH="$RUNNER_TEMP/makarychev-qa/node_modules" node school/makarychev8/test-browser-55-74.cjs
      - name: Chromium exercises75–109, proofs and two-line construction
        run: NODE_PATH="$RUNNER_TEMP/makarychev-qa/node_modules" node school/makarychev8/test-browser-75-109.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: makarychev8-browser
          path: artifacts/makarychev8/
          if-no-files-found: ignore

  square-roots:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Complete chapter source, mathematics and append-only contract
        run: |
          python -m pip install sympy==1.14.0
          python school/makarychev8/test-roots-source.py
          node school/makarychev8/build.cjs
          git diff --exit-code -- school/makarychev8/data.js
      - name: Isolated root browser dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/makarychev-roots-qa" --no-audit --no-fund --ignore-scripts jsdom@26.1.0 playwright@1.62.1
          node "$RUNNER_TEMP/makarychev-roots-qa/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Root input, exact branches and diagram geometry
        run: NODE_PATH="$RUNNER_TEMP/makarychev-roots-qa/node_modules" node school/makarychev8/test-roots-engine.cjs
      - name: Every root condition, worked solution and saved-work journey
        run: NODE_PATH="$RUNNER_TEMP/makarychev-roots-qa/node_modules" node school/makarychev8/test-browser-roots.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: makarychev8-square-roots-browser
          path: artifacts/makarychev8/
          if-no-files-found: ignore
