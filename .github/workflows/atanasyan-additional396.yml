name: Atanasyan additional 396–403 — source, mathematics and mobile
on:
  pull_request:
    paths:
      - 'stereo-course/textbook/**'
      - 'stereo-course/assets/**'
      - 'tools/stereo-textbook/**'
      - '.github/workflows/atanasyan-additional396.yml'
permissions:
  contents: read
jobs:
  additional-source-math:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --ignore-scripts jsdom@26.1.0 ajv@8.17.1 ajv-formats@3.0.1
      - name: Source contracts, unchanged 653, exact build and model geometry
        run: |
          python3 tools/stereo-textbook/build_textbook.py
          git diff --exit-code -- stereo-course/textbook/data/course.json
          git diff --check
          python3 tools/stereo-textbook/catalog.test.py
          node tools/stereo-textbook/schema.test.cjs
          node tools/stereo-textbook/model-geometry.test.cjs
          node tools/stereo-textbook/additional396-content.test.cjs
          node tools/stereo-textbook/runtime.test.cjs
          node tools/stereo-textbook/browser-shards.test.cjs
  additional-mobile:
    needs: additional-source-math
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - name: Every new card and every state on two phones and desktop
        run: node tools/stereo-textbook/additional396.browser.cjs
      - name: Preserve actual screenshots and persistence evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atanasyan-additional396
          path: artifacts/atanasyan-additional396/
          retention-days: 14
          if-no-files-found: error
