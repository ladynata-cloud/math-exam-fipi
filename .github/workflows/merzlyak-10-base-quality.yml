name: Merzlyak 10 basic — source, state and draft figures
on:
  pull_request:
    paths: ['stereo-course/merzlyak-10-base/**', 'tools/merzlyak-10-base/**', '.github/workflows/merzlyak-10-base-quality.yml']
permissions:
  contents: read
jobs:
  bounded-consultation:
    if: github.event.action == 'opened' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: One focused consultation, or explicit unavailable evidence
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REVIEW_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_PR_URL: ${{ github.event.pull_request.html_url }}
        run: python3 tools/merzlyak-10-base/claude-review.py
      - name: Preserve limited consultation provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: merzlyak-10-base-consultation
          path: artifacts/merzlyak-consultation/
          retention-days: 7
          if-no-files-found: warn
  content-and-figures:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.62.1 jsdom@26.1.0 ajv@8.17.1 ajv-formats@3.0.1
      - run: python3 -m pip install --disable-pip-version-check numpy==2.3.5
      - run: npx playwright install --with-deps chromium
      - name: Source completeness and reproducible bundle
        run: |
          python3 tools/merzlyak-10-base/build.test.py
          python3 tools/merzlyak-10-base/build.py
          git diff --exit-code -- stereo-course/merzlyak-10-base/data/course.json
      - name: Schemas, draft gates and retained learner work
        run: node tools/merzlyak-10-base/schema-runtime.test.cjs
      - name: Geometric integrity of authored models
        run: |
          node tools/stereo-textbook/model-geometry.test.cjs stereo-course/merzlyak-10-base/data/course.json
          python3 tools/merzlyak-10-base/para01-models.test.py
          python3 tools/merzlyak-10-base/para02-models.test.py
          python3 tools/merzlyak-10-base/para03-models.test.py
          python3 tools/merzlyak-10-base/para04-05-models.test.py
          python3 tools/merzlyak-10-base/para06-07-models.test.py
          python3 tools/merzlyak-10-base/para08-09-models.test.py
          python3 tools/merzlyak-10-base/exercises-10-11-models.test.py
          python3 tools/merzlyak-10-base/para12-13-models.test.py
          python3 tools/merzlyak-10-base/para14-15-models.test.py
          python3 tools/merzlyak-10-base/para18-19-models.test.py
          python3 tools/merzlyak-10-base/exercises-20-models.test.py
          python3 tools/merzlyak-10-base/theory-details-01-09-models.test.py
          python3 tools/merzlyak-10-base/theory-details-10-19-models.test.py
          python3 tools/merzlyak-10-base/supplementary-models.test.py
          python3 tools/merzlyak-10-base/selfcheck-models-review.test.py
          node tools/merzlyak-10-base/theory-models.test.cjs
          python3 tools/merzlyak-10-base/theory-models.test.py
          python3 tools/merzlyak-10-base/review-math-01-02.py
          python3 tools/merzlyak-10-base/review-math-03.py
          python3 tools/merzlyak-10-base/reviewer-04-05-checks.py
          python3 tools/merzlyak-10-base/independent-models-06-07.test.py
          python3 tools/merzlyak-10-base/reviewer-08-09-checks.py
          python3 tools/merzlyak-10-base/reviewer-10-11-checks.py
          python3 tools/merzlyak-10-base/reviewer-12-13-checks.py
          python3 tools/merzlyak-10-base/reviewer-supplementary-checks.py
          python3 tools/merzlyak-10-base/independent-theory-01-09.test.py
          python3 tools/merzlyak-10-base/independent-models-14-15.test.py
          python3 tools/merzlyak-10-base/practical-projects-models-review.test.py
      - name: Every draft model and view at mobile and desktop widths
        run: node tools/merzlyak-10-base/model-browser.cjs
      - name: Preserve visual evidence (not a publication approval)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: merzlyak-10-base-draft-models
          path: artifacts/merzlyak-models/
          retention-days: 7
          if-no-files-found: warn
      - run: git diff --check
