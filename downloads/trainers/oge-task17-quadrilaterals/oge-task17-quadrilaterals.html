(function standaloneTrainer(config) {
  'use strict';
  const source = new URL(config.source);

  function link(href) {
    if (!href || href.startsWith('#') || /^(?:mailto:|tel:|data:|blob:)/i.test(href)) return href;

<title>ОГЭ №17 — Четырёхугольники · тренажёр</title>
<link rel="canonical" href="https://mathexam.space/trainers/oge-task17-quadrilaterals.html">
<style>
:root{--bg:#e8e4db;--card:#fffdf7;--ink:#1a1a2e;--muted:#5b5b6e;--line:#d8d2c2;--accent:#2d70b3;--good:#16a34a;--bad:#dc2626;--warn:#c2410c;--amber:#d97706;--violet:#7c3aed;--teal:#0d9488;--pink:#db2777;--soft:#eef4fa}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:980px;margin:auto;padding:14px 12px 46px}
.head{background:#1a1a2e;color:#fffdf7;border-radius:18px 18px 0 0;padding:16px 20px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.head h1{margin:0;font-size:clamp(19px,3vw,26px);letter-spacing:-.02em}
.head .sub{opacity:.75;font-size:13px;margin-top:3px}
.head .crumbs{display:inline-block;color:#f2b134;font-size:13.5px;font-weight:800;text-decoration:none;margin-bottom:4px}
.head .crumbs:hover{text-decoration:underline}
.badge{background:rgba(255,253,247,.14);border:1px solid rgba(255,253,247,.25);border-radius:999px;padding:6px 12px;font-weight:800;font-size:13px;white-space:nowrap}
.app{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 14px 34px rgba(26,26,46,.14);overflow:hidden}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);background:#f6f2e9;flex-wrap:wrap}
.tab{flex:1;min-width:110px;border:0;background:transparent;padding:13px 8px;font:inherit;font-weight:850;font-size:14.5px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent);background:var(--card)}
.main{padding:16px}
@media(max-width:620px){.main{padding:12px 10px}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font:inherit;font-size:13.5px;font-weight:800;cursor:pointer;color:var(--muted)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip .n{opacity:.65;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:12px}
.tcard{border:1px solid var(--line);border-radius:14px;background:#fff;padding:12px;cursor:pointer;transition:.12s;position:relative}
.tcard:hover{border-color:var(--accent);box-shadow:0 6px 16px rgba(45,112,179,.14);transform:translateY(-1px)}
.tcard h3{margin:0 0 5px;font-size:14.5px;line-height:1.3}
.tcard .cnt{font-size:12px;color:var(--muted)}
.tcard .done{position:absolute;top:9px;right:10px;color:var(--good);font-weight:900;font-size:13px}
.tcard .weak{display:inline-block;margin-top:6px;background:#fef2f2;color:var(--bad);border:1px solid #fecaca;border-radius:999px;font-size:11.5px;font-weight:850;padding:2px 8px}
.topicH{margin:16px 0 2px;font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:900}
.task{border:1px solid var(--line);border-radius:16px;background:#fff;padding:16px;margin-top:12px}
.task .qtext{font-size:clamp(16.5px,2.2vw,19px);line-height:1.45}
.pill{display:inline-block;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:850;background:#f1ede2;color:#57534e;margin:0 6px 8px 0}
.pill.src{background:#eaf8f3;color:#006b55}.pill.gen{background:#fff7e6;color:#985b00}
.fig{display:flex;justify-content:center;margin:12px 0;background:#fffdf7;border:1px solid #efe9da;border-radius:12px;padding:8px}
.fig svg{max-width:100%;height:auto}
.ansrow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.ansrow input{flex:1;min-width:150px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;font-size:17px;outline:none;background:#fffdf7}

<div class="main" id="main"></div>
</div>
<div class="stbox" id="stbox"></div>
<div class="note" style="text-align:center;margin-top:10px">Прогресс хранится на этом устройстве. Ответы: целые, десятичные (запятая или точка) и дроби вида 7/2.</div>
</div>
<script>
'use strict';
/* ================= ЯДРО: утилиты и честный SVG-слой ================= */
const RAD=d=>d*Math.PI/180, DEG=r=>r*180/Math.PI;
const dist=(p,q)=>Math.hypot(p.x-q.x,p.y-q.y);
const angAt=(V,P,Q)=>{ // угол при вершине V в градусах (0..180)
  const a1=Math.atan2(P.y-V.y,P.x-V.x), a2=Math.atan2(Q.y-V.y,Q.x-V.x);
  let d=Math.abs(a1-a2)%(2*Math.PI); if(d>Math.PI)d=2*Math.PI-d; return DEG(d);
};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fnum=v=>{ // вывод числа: 3.5 → «3,5»; целые без хвоста
  if(typeof v==='string')return v;
  const r=Math.round(v*1e6)/1e6;
  return (Number.isInteger(r)? String(r) : String(r).replace('.',','));
};
const frac=(a,b)=>'<span class="frac"><span>'+a+'</span><span>'+b+'</span></span>';
const CLR={given:'#d97706',ask:'#2d70b3',c3:'#0d9488',c4:'#7c3aed',c5:'#db2777',ink:'#1a1a2e',good:'#16a34a'};

function Fig(W,H,pad){
  W=W||440;H=H||300;pad=pad||34;
  const parts=[], chk=[], tickGroups={};
  let T=p=>p;
  const F={W,H,chk,
    fit(pts){ // вписать: равномерный масштаб + переворот y
      let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
      pts.forEach(p=>{x0=Math.min(x0,p.x);x1=Math.max(x1,p.x);y0=Math.min(y0,p.y);y1=Math.max(y1,p.y)});
      const s=Math.min((W-2*pad)/Math.max(x1-x0,1e-9),(H-2*pad)/Math.max(y1-y0,1e-9));
      const cx=(x0+x1)/2, cy=(y0+y1)/2;
      T=p=>({x:W/2+(p.x-cx)*s, y:H/2-(p.y-cy)*s});
      F.scale=s; return T;
    },
    seg(p,q,o){o=o||{};const a=T(p),b=T(q);
      parts.push('<line x1="'+a.x.toFixed(1)+'" y1="'+a.y.toFixed(1)+'" x2="'+b.x.toFixed(1)+'" y2="'+b.y.toFixed(1)+'" stroke="'+(o.c||CLR.ink)+'" stroke-width="'+(o.w||2.2)+'"'+(o.dash?' stroke-dasharray="7 5"':'')+' stroke-linecap="round"/>');},
    poly(ps,o){o=o||{};const d=ps.map((p,i)=>{const t=T(p);return (i?'L':'M')+t.x.toFixed(1)+' '+t.y.toFixed(1)}).join('');
      parts.push('<path d="'+d+(o.close?'Z':'')+'" fill="'+(o.fill||'none')+'" stroke="'+(o.c||CLR.ink)+'" stroke-width="'+(o.w||2.4)+'" stroke-linejoin="round"'+(o.dash?' stroke-dasharray="7 5"':'')+'/>');},
    dot(p,o){o=o||{};const t=T(p);parts.push('<circle cx="'+t.x.toFixed(1)+'" cy="'+t.y.toFixed(1)+'" r="'+(o.r||3.8)+'" fill="'+(o.c||CLR.ink)+'" stroke="#fffdf7" stroke-width="1.6"/>');},
    lab(txt,p,o){o=o||{};const t=T(p);
      parts.push('<text x="'+(t.x+(o.dx||0)).toFixed(1)+'" y="'+(t.y+(o.dy||0)).toFixed(1)+'" font-size="'+(o.fs||16)+'" font-weight="'+(o.fw||800)+'" fill="'+(o.c||CLR.ink)+'" text-anchor="'+(o.anchor||'middle')+'" style="paint-order:stroke;stroke:#fffdf7;stroke-width:4px;stroke-linejoin:round">'+esc(txt)+'</text>');},
    arc(V,P,Q,o){ // дуга угла полилинией; лейбл — число° => авто-chk 1.5°
      o=o||{}; const val=angAt(V,P,Q);
      if(o.lab){const m=String(o.lab).match(/^([\d.,]+)°/); if(m){const cl=parseFloat(m[1].replace(',','.'));
        chk.push({ok:Math.abs(cl-val)<=1.5, m:'дуга '+o.lab+' ≠ факт '+val.toFixed(1)+'°'});}}
      const v=T(V),p=T(P),q=T(Q);
      let a1=Math.atan2(p.y-v.y,p.x-v.x), a2=Math.atan2(q.y-v.y,q.x-v.x);
      let d=a2-a1; while(d>Math.PI)d-=2*Math.PI; while(d<-Math.PI)d+=2*Math.PI;
      const r=o.r||26, N=24, pts=[];
      for(let i=0;i<=N;i++){const a=a1+d*i/N;pts.push((v.x+r*Math.cos(a)).toFixed(1)+' '+(v.y+r*Math.sin(a)).toFixed(1));}
      parts.push('<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+(o.c||CLR.given)+'" stroke-width="3.4" stroke-linecap="round"/>');
      if(o.lab!=null){const mid=a1+d/2, ext=(val>=140||val<=18)||o.out, rr=r+(ext?20:15);
        parts.push('<text x="'+(v.x+rr*Math.cos(mid)+(o.dx||0)).toFixed(1)+'" y="'+(v.y+rr*Math.sin(mid)+5+(o.dy||0)).toFixed(1)+'" font-size="15" font-weight="850" fill="'+(o.c||CLR.given)+'" text-anchor="middle" style="paint-order:stroke;stroke:#fffdf7;stroke-width:4px">'+esc(o.lab)+'</text>');}
    },
    rsq(V,P,Q,o){ // квадратик прямого угла + авто-chk 90°
      o=o||{}; chk.push({ok:Math.abs(angAt(V,P,Q)-90)<=1.5, m:'прямой угол при вершине нарушен: '+angAt(V,P,Q).toFixed(1)+'°'});
      const v=T(V),p=T(P),q=T(Q),s=o.s||11;
      const u1={x:p.x-v.x,y:p.y-v.y},u2={x:q.x-v.x,y:q.y-v.y};
      const n1=Math.hypot(u1.x,u1.y),n2=Math.hypot(u2.x,u2.y);
      const e1={x:u1.x/n1*s,y:u1.y/n1*s},e2={x:u2.x/n2*s,y:u2.y/n2*s};
      parts.push('<path d="M'+(v.x+e1.x).toFixed(1)+' '+(v.y+e1.y).toFixed(1)+'L'+(v.x+e1.x+e2.x).toFixed(1)+' '+(v.y+e1.y+e2.y).toFixed(1)+'L'+(v.x+e2.x).toFixed(1)+' '+(v.y+e2.y).toFixed(1)+'" fill="none" stroke="'+(o.c||CLR.good)+'" stroke-width="2.4"/>');},
    tick(P,Q,n,cls){ // засечки: класс равенства cls → авто-chk длин
      (tickGroups[cls]=tickGroups[cls]||[]).push(dist(P,Q));
      const p=T(P),q=T(Q),mx=(p.x+q.x)/2,my=(p.y+q.y)/2;
      const dx=q.x-p.x,dy=q.y-p.y,L=Math.hypot(dx,dy),nx=-dy/L,ny=dx/L,tx=dx/L,ty=dy/L;
      for(let i=0;i<n;i++){const off=(i-(n-1)/2)*6;
        parts.push('<line x1="'+(mx+tx*off-nx*6).toFixed(1)+'" y1="'+(my+ty*off-ny*6).toFixed(1)+'" x2="'+(mx+tx*off+nx*6).toFixed(1)+'" y2="'+(my+ty*off+ny*6).toFixed(1)+'" stroke="'+CLR.ink+'" stroke-width="2.2"/>');}},
    svg(){ for(const k in tickGroups){const g=tickGroups[k],m=g.reduce((a,b)=>a+b,0)/g.length;
        chk.push({ok:g.every(v=>Math.abs(v-m)/m<=0.005), m:'засечки класса '+k+' на неравных отрезках: '+g.map(v=>v.toFixed(2)).join(', ')});}
      return '<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" xmlns="http://www.w3.org/2000/svg">'+parts.join('')+'</svg>';}
  };
  return F;
}
/* ================= ПОСТРОИТЕЛИ ЧЕСТНЫХ ЧЕРТЕЖЕЙ ================= */
/* Каждый строит фигуру ПО ЧИСЛАМ задачи; дуги/засечки/квадратики сами регистрируют chk */

function markRectangle(F, corners){
  corners.forEach((vertex,i)=>F.rsq(vertex,corners[(i+3)%4],corners[(i+1)%4],{c:'#68786c',s:8}));
}

function figSquare(p){ // p:{sideLab, showDiag, diagLab}
  const F=Fig(360,260), s=10;
  const A={x:0,y:0},B={x:s,y:0},C={x:s,y:s},D={x:0,y:s};
  F.fit([A,B,C,D]);
  F.poly([A,B,C,D],{close:1});
  if(p.showDiag){F.seg(A,C,{c:CLR.ask,w:2.4}); if(p.diagLab)F.lab(p.diagLab,{x:s*.5,y:s*.58},{c:CLR.ask,dx:14});}
  markRectangle(F,[A,B,C,D]);
  F.lab(p.sideLab,{x:s/2,y:0},{dy:22});
  F.lab('A',A,{dx:-12,dy:14});F.lab('B',B,{dx:12,dy:14});F.lab('C',C,{dx:12,dy:-8});F.lab('D',D,{dx:-12,dy:-8});
  return F;
}

function figRect(p){ // p:{mode:'angle',alpha,askLab} | {mode:'bo',bo,ab,hn,sn,dn}
  const F=Fig(440,290);
  let w,h;
  if(p.mode==='angle'){ // угол alpha между диагональю и одной из сторон — честный аспект
    const t=Math.tan(RAD(Math.min(p.alpha,90-p.alpha))); w=10; h=10*t;
  } else { const d=2*p.bo; h=p.ab; w=Math.sqrt(d*d-h*h); }
  const A={x:0,y:0},D={x:w,y:0},C={x:w,y:h},B={x:0,y:h},O={x:w/2,y:h/2};
  F.fit([A,B,C,D]);
  F.poly([A,B,C,D],{close:1});
  markRectangle(F,[A,B,C,D]);
  F.seg(A,C,{w:2});F.seg(B,D,{w:2});F.dot(O,{r:3.2});
  if(p.mode==='angle'){
    if(p.alpha<=45) F.arc(A,D,C,{lab:p.alpha+'°',r:30});
    else F.arc(A,B,C,{lab:p.alpha+'°',r:26});
    // острый угол между диагоналями при O
    const acute = angAt(O,A,B)<=90? [A,B]:[A,D];
    F.arc(O,acute[0],acute[1],{lab:p.askLab||'?',c:CLR.ask,r:20});
  } else {
    F.tick(O,{x:0,y:0},1,'полудиагонали');F.tick(O,C,1,'полудиагонали');F.tick(O,B,1,'полудиагонали');F.tick(O,D,1,'полудиагонали');
    /* подписи — по данным задачи (какая половина диагонали и какая сторона даны, какая диагональ ищется) */
    const norm=t=>t&&t.length===2&&t[0]==='O'?t[1]+'O':(t||'');
    const HALF={AO:{x:w*0.25,y:h*0.25},CO:{x:w*0.75,y:h*0.75},BO:{x:w*0.25,y:h*0.75},DO:{x:w*0.75,y:h*0.25}};
    const hn=norm(p.hn||'BO'), sn=p.sn||'AB', dn=p.dn||'AC';
    F.lab(hn+' = '+fnum(p.bo),HALF[hn]||HALF.BO,{c:CLR.ink,dy:-6});
    /* подпись стороны — внутри прямоугольника у середины стороны: снаружи она не влезала в рамку (AB слева обрезалась и раньше) */
    const SIDE={AB:[{x:0,y:h/2},{dx:8,anchor:'start'}],BA:[{x:0,y:h/2},{dx:8,anchor:'start'}],CD:[{x:w,y:h/2},{dx:-8,anchor:'end'}],DC:[{x:w,y:h/2},{dx:-8,anchor:'end'}],
      AD:[{x:w/2,y:0},{dy:-8}],DA:[{x:w/2,y:0},{dy:-8}],BC:[{x:w/2,y:h},{dy:16}],CB:[{x:w/2,y:h},{dy:16}]};
    const sd=SIDE[sn]||SIDE.AB; F.lab(sn+' = '+fnum(p.ab),sd[0],sd[1]);
    /* «?» — на свободной половине искомой диагонали */
    const askAt=dn==='BD'?(hn==='BO'?HALF.DO:HALF.BO):(hn==='CO'?HALF.AO:HALF.CO);
    F.lab(dn+' — ?',askAt,{c:CLR.ask,dy:-6});
  }
  F.lab('A',A,{dx:-12,dy:12});F.lab('D',D,{dx:12,dy:12});F.lab('C',C,{dx:12,dy:-6});F.lab('B',B,{dx:-12,dy:-6});
  F.lab('O',O,{dx:14,dy:-8});
  return F;
}

function rhombPts(acuteA,s){ s=s||10; const a=RAD(acuteA);
  const A={x:0,y:0},B={x:s*Math.cos(a),y:s*Math.sin(a)},D={x:s,y:0},C={x:s+s*Math.cos(a),y:s*Math.sin(a)};
  return {A,B,C,D,s};
}
function rhombBase(F,P,ticks){ F.poly([P.A,P.B,P.C,P.D],{close:1});
  if(ticks!==false){F.tick(P.A,P.B,1,'стороны ромба');F.tick(P.B,P.C,1,'стороны ромба');F.tick(P.C,P.D,1,'стороны ромба');F.tick(P.D,P.A,1,'стороны ромба');}
  F.lab('A',P.A,{dx:-12,dy:14});F.lab('D',P.D,{dx:13,dy:14});F.lab('B',P.B,{dx:-12,dy:-7});F.lab('C',P.C,{dx:13,dy:-7});
}
function figRhombAngle(p){ // p:{acute, givenAt:'A'|'B', givenLab, askAt, askLab}
  const F=Fig(440,270),P=rhombPts(p.acute); F.fit([P.A,P.B,P.C,P.D]); rhombBase(F,P);
  const at=v=>v==='A'?[P.A,P.B,P.D]:[P.B,P.A,P.C];
  const g=at(p.givenAt),a=at(p.askAt);
  F.arc(g[0],g[1],g[2],{lab:p.givenLab,r:24});
  F.arc(a[0],a[1],a[2],{lab:p.askLab||'?',c:CLR.ask,r:24});
  return F;
}
function figRhombACD(p){ // ∠ABC дан (при B), диагональ CA, ∠ACD — ?
  const F=Fig(440,270),P=rhombPts(180-p.abc); F.fit([P.A,P.B,P.C,P.D]); rhombBase(F,P);
  F.seg(P.C,P.A,{c:CLR.c3,w:2});
  F.arc(P.B,P.A,P.C,{lab:p.abc+'°',r:22});
  F.arc(P.C,P.A,P.D,{lab:'?',c:CLR.ask,r:26});
  return F;
}
function figRhombHeight(p){ // p:{acute, sideLab, hLab, segLabs:[AH,HD]?, angLab?}
  const F=Fig(440,280),P=rhombPts(p.acute); F.fit([P.A,P.B,P.C,P.D]); rhombBase(F,P);
  const H={x:P.B.x,y:0};
  F.seg(P.B,H,{c:CLR.ask,w:2.4}); F.rsq(H,P.B,P.D);
  if(p.hLab)F.lab(p.hLab,{x:P.B.x,y:P.B.y/2},{c:CLR.ask,dx:16});
  if(p.sideLab)F.lab(p.sideLab,{x:P.B.x/2,y:P.B.y/2},{dx:-20});
  if(p.angLab)F.arc(P.A,P.B,P.D,{lab:p.angLab,r:24});
  if(p.segLabs){F.lab(p.segLabs[0],{x:P.B.x/2,y:0},{dy:22,c:CLR.ask});F.lab(p.segLabs[1],{x:(P.B.x+P.D.x)/2,y:0},{dy:22,c:CLR.ask});F.dot(H);}
  return F;
}
function figRhombDiag(p){ // p:{acute, d1Lab, d2Lab, dist:{val}?, perpAng:{lab}?, askAcute?}
  const F=Fig(440,290),P=rhombPts(p.acute); F.fit([P.A,P.B,P.C,P.D]); rhombBase(F,P);
  const O={x:(P.A.x+P.C.x)/2,y:(P.A.y+P.C.y)/2};
  F.seg(P.A,P.C,{w:1.9});F.seg(P.B,P.D,{w:1.9});F.rsq(O,P.A,P.B,{c:'#8a8375',s:9});F.dot(O,{r:3});F.lab('O',O,{dx:4,dy:20});
  if(p.d1Lab)F.lab(p.d1Lab,{x:(P.A.x+O.x)/2,y:(P.A.y+O.y)/2},{dy:-8,c:CLR.ink});
  if(p.d2Lab)F.lab(p.d2Lab,{x:(P.B.x+O.x)/2,y:(P.B.y+O.y)/2},{dx:16,c:CLR.ink});
  if(p.dist||p.perpAng){ // перпендикуляр из O к стороне AB
    const a=RAD(p.acute), n={x:Math.sin(a),y:-Math.cos(a)}; // нормаль к AB
    const t=O.x*n.x+O.y*n.y; const Hp={x:O.x-t*n.x,y:O.y-t*n.y};
    F.seg(O,Hp,{c:CLR.c3,w:2.2}); F.rsq(Hp,O,P.A,{s:9});
    if(p.dist)F.lab(fnum(p.dist),{x:(O.x+Hp.x)/2,y:(O.y+Hp.y)/2},{c:CLR.c3,dx:-14});
    if(p.perpAng)F.arc(O,Hp,P.B,{lab:p.perpAng,r:18,c:CLR.given});
    if(p.askAcute)F.arc(P.A,P.B,P.D,{lab:'?',c:CLR.ask,r:24});
  }
  return F;
}
function figRhombHBD(p){ // высота из тупого B и большая диагональ AC; угол между ними — ?
  const F=Fig(440,290),P=rhombPts(180-p.obtuse); F.fit([P.A,P.B,P.C,P.D]); rhombBase(F,P);
  const H={x:P.B.x,y:0};
  F.seg(P.B,H,{c:CLR.c3,w:2.3}); F.rsq(H,P.B,P.D);
  F.seg(P.A,P.C,{w:1.9});
  F.arc(P.B,P.A,P.C,{lab:p.obtuse+'°',r:20});
  const k=P.C.y/P.C.x, X={x:P.B.x,y:k*P.B.x}; F.dot(X,{r:3});
  F.arc(X,P.B,P.C,{lab:'?',c:CLR.ask,r:17});
  return F;
}
function figRhombSSD(p){ // острый угол дан при A; меньшая диагональ BD; угол между стороной и BD — ?
  const F=Fig(440,280),P=rhombPts(p.acute); F.fit([P.A,P.B,P.C,P.D]); rhombBase(F,P);
  F.seg(P.B,P.D,{c:CLR.c3,w:2});
  F.arc(P.A,P.B,P.D,{lab:p.acute+'°',r:22});
  F.arc(P.B,P.A,P.D,{lab:'?',c:CLR.ask,r:20});
  return F;
}

function parPts(angA,w,l){ w=w||13; l=l||7; const a=RAD(angA);
  const A={x:0,y:0},D={x:w,y:0},B={x:l*Math.cos(a),y:l*Math.sin(a)},C={x:w+l*Math.cos(a),y:l*Math.sin(a)};
  return {A,B,C,D};
}
function parBase(F,P){F.poly([P.A,P.B,P.C,P.D],{close:1});
  F.lab('A',P.A,{dx:-12,dy:14});F.lab('D',P.D,{dx:12,dy:14});F.lab('B',P.B,{dx:-12,dy:-7});F.lab('C',P.C,{dx:12,dy:-7});}
function figParE(p){ // E — середина AB, отрезок EC; трапеция DAEC / треугольник CBE
  const F=Fig(440,270),P=parPts(58); F.fit([P.A,P.B,P.C,P.D]); parBase(F,P);
  const E={x:P.B.x/2,y:P.B.y/2};
  F.seg(E,P.C,{c:CLR.ask,w:2.2}); F.dot(E); F.lab('E',E,{dx:-13,dy:4});
  F.tick(P.A,E,1,'половины AB'); F.tick(E,P.B,1,'половины AB');
  return F;
}
function figParDiag(p){ // обе диагонали, O; засечки: AO=OC (1), BO=OD (2)
  const F=Fig(440,260),P=parPts(52); F.fit([P.A,P.B,P.C,P.D]); parBase(F,P);
  const O={x:(P.A.x+P.C.x)/2,y:(P.A.y+P.C.y)/2};
  F.seg(P.A,P.C,{w:1.9});F.seg(P.B,P.D,{w:1.9});F.dot(O,{r:3.2});F.lab('O',O,{dx:2,dy:-10});
  F.tick(P.A,O,1,'AO=OC');F.tick(O,P.C,1,'AO=OC');F.tick(P.B,O,2,'BO=OD');F.tick(O,P.D,2,'BO=OD');
  return F;
}
function figParHeights(p){ // две высоты
  const F=Fig(460,300),P=parPts(55); F.fit([P.A,P.B,P.C,P.D]); parBase(F,P);
  const H1={x:P.B.x,y:0}; F.seg(P.B,H1,{c:CLR.ask,w:2.2}); F.rsq(H1,P.B,P.D);
  const a=RAD(55),u={x:Math.cos(a),y:Math.sin(a)}, t=P.D.x*u.x+P.D.y*u.y, H2={x:t*u.x,y:t*u.y};
  F.seg(P.A,H2,{dash:1,w:1.6,c:'#8a8375'}); F.seg(P.D,H2,{c:CLR.c3,w:2.2}); F.rsq(H2,P.D,P.A,{s:9});

function trapPts(a,b,theta,h){ // iso-трапеция: основания a(верх)<b(низ) или через угол theta при большем основании
  if(theta!=null){ h=h||( (b-a)/2*Math.tan(RAD(theta)) ); }
  const dx=(b-a)/2;
  return {A:{x:0,y:0},D:{x:b,y:0},B:{x:dx,y:h},C:{x:dx+a,y:h},h};
}
function trapBase(F,P,iso){F.poly([P.A,P.B,P.C,P.D],{close:1});
  if(iso){F.tick(P.A,P.B,1,'боковые стороны');F.tick(P.C,P.D,1,'боковые стороны');}
  F.lab('A',P.A,{dx:-12,dy:14});F.lab('D',P.D,{dx:12,dy:14});F.lab('B',P.B,{dx:-12,dy:-7});F.lab('C',P.C,{dx:12,dy:-7});}

  F.seg(E,Fp,{c:CLR.c3,w:2.2});F.dot(E);F.dot(Fp);F.lab('E',E,{dx:-13});F.lab('F',Fp,{dx:13});

  if(p.hLab){const hx=P.B.x+p.a*0.55;F.seg({x:hx,y:P.h},{x:hx,y:0},{dash:1,w:1.7,c:'#8a8375'});F.rsq({x:hx,y:0},{x:hx,y:P.h},P.D,{s:9,c:'#8a8375'});F.lab(p.hLab,{x:hx,y:P.h/2},{dx:14,c:CLR.ink});}

const trapTol=x=>Math.max(1e-9,Math.abs(x)*1e-9)+1e-9;
/* ловушки одной задачи: те, что одно и то же число задевает одновременно,
   сводятся в одну (решения F1 и Q2 делегата владельца): две разные ошибки —
   одно объединённое сообщение «найдите свою», три и больше — честный общий текст */
function trapPair(m1,m2){return 'Такой ответ получается при одной из двух ошибок — найдите свою:\n• '+m1+'\n• '+m2;}
const TRAP_MANY='Не сходится. Это число получается при нескольких разных ошибках — сверьте решение по шагам в «🪜 Шаг за шагом».';
function mergeTraps(list){
  const up=list.map((_,i)=>i), top=i=>up[i]===i?i:(up[i]=top(up[i]));
  for(let i=0;i<list.length;i++)for(let j=i+1;j<list.length;j++)
    if(Math.abs(list[i].v-list[j].v)<=list[i].e+list[j].e)up[top(j)]=top(i);
  const groups=new Map();
  list.forEach((t,i)=>{const r=top(i);if(!groups.has(r))groups.set(r,[]);groups.get(r).push(t);});
  const out=[];let clash=false;
  for(const g of groups.values()){
    const ms=[...new Set(g.map(t=>t.m))];
    if(ms.length===1){g.forEach(t=>out.push(t));continue;}
    clash=true;
    const m=ms.length===2?trapPair(ms[0],ms[1]):TRAP_MANY;
    g.forEach(t=>out.push({v:t.v,e:t.e,m}));
  }
  out.clash=clash;
  return out;
}

function build(k,p,meta){
  const s=S17[k]; const ans=s.calc(p);
  const F=s.fig(p);
  const diag=mergeTraps((s.diag(p)||[]).filter(d=>d&&d.m&&typeof d.v==='number'&&isFinite(d.v)&&!(typeof ans==='number'&&Math.abs(d.v-ans)<=trapTol(ans)))
    .map(d=>({v:d.v,m:d.m,e:trapTol(d.v)})));
  const m={key:k,topic:s.topic,name:s.name,ans,ansFmt:s.ansFmt||'num',text:s.text(p),sol:s.sol(p),
    law:s.law,ref:s.ref,refWhy:s.refWhy,svg:F.svg(),chk:F.chk,diag,p};
  return Object.assign(m,meta||{});
}
/* ---- разбор ответа: целые, десятичные с запятой/точкой, дроби a/b ---- */
function parseAns(str){
  str=String(str||'').trim().replace(',','.').replace(/\s+/g,'');
  if(!str)return null;
  const fr=str.match(/^(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)$/);
  if(fr){const d=parseFloat(fr[2]); if(!d)return null; return parseFloat(fr[1])/d;}
  const v=parseFloat(str);
  return (isFinite(v)&&/^-?\d*\.?\d+$/.test(str))?v:null;
}
function isRight(task,raw){
  if(task.ansFmt==='concat'){
    const u=String(raw||'').replace(/[^\d,.\u002c]/g,'').replace(/[.,]/g,',');
    const e=String(task.ans).replace(/[.,]/g,',');
    return u===e || u.replace(/,/g,'')===e.replace(/,/g,'');
  }
  const v=parseAns(raw); if(v==null)return false;
  const a=task.ans;
  return Math.abs(v-a)<=Math.max(1e-9,Math.abs(a)*1e-9)+1e-9;
}

  function num(v){ return (typeof v === "number" && isFinite(v) && v > 0) ? Math.floor(v) : 0; }

      if (!isObj(all.mistakes)) all.mistakes = {};

     passed по сохранённому best; дальше запись несёт updatedAt и больше

  function migrate(bestNorm){

    solvedOne:solvedOne, finishQuiz:finishQuiz, mlog:mlog, openTypes:openTypes, migrate:migrate };
})();

function pickTrainTask(){
  if(REVIEW.on){   // работа над ошибками: только открытые типы журнала, задачи генератора
    const open=CP.openTypes().filter(k=>S17[k]);
    if(open.length){const k=open[Math.floor(Math.random()*open.length)];
      return build(k,S17[k].gen(),{gen:true,srcLab:'генератор',note:S17[k].note});}
    REVIEW.on=false; REVIEW.empty=true;
  }
  const pool=k=>FILT.sub? [FILT.sub] : SUBKEYS.filter(x=>FILT.topic==='all'||S17[x].topic===FILT.topic);
  const keys=pool();
  if(FILT.src!=='gen'){ // сперва нетронутый архив
    const fresh=ARCHIVE.filter(r=>keys.includes(r.sub)&&!ST.usedNums[r.nums[0]]);
    if(fresh.length){const r=fresh[Math.floor(Math.random()*fresh.length)];
      upd(rec=>{rec.usedNums=CP.isObj(rec.usedNums)?rec.usedNums:{};rec.usedNums[r.nums[0]]=1;});
      return build(r.sub,r.p,{gen:false,srcLab:srcLabel(r,true),note:S17[r.sub].note});}
    if(FILT.src==='arch')return null;
  }
  const k=keys[Math.floor(Math.random()*keys.length)];
  return build(k,S17[k].gen(),{gen:true,srcLab:'генератор',note:S17[k].note});
}
const PNOTE17='<details class="pnote"><summary>О прогрессе: подсказки ничего не отнимают</summary><div>Баллов и «звёздочек» здесь нет. Задача засчитывается как решённая, если ответ получен без показа решения; ошибка, исправленная самостоятельно, этому не мешает. Если показан шаг с готовым числом («Показать шаг») или всё решение («Сдаюсь — решение»), задача отмечается «решение показано» — к такому типу стоит вернуться. Ошибки попадают в «Работу над ошибками» курса; тип уходит оттуда после трёх задач подряд, решённых без промаха.</div></details>';
function renderTrain(newTask){hdr();

   ['all','Архив + генератор','arch','Только архив','gen','Только генератор'].map((v,i,ar)=>i%2?'':'<button class="chip'+(FILT.src===ar[i]?' on':'')+'" data-s="'+ar[i]+'">'+ar[i+1]+'</button>').join('')+
   (FILT.sub?'<span class="pill">тип: '+esc(S17[FILT.sub].name)+' <a class="reflink" id="clrSub">✕</a></span>':'')+'</div>'+

    :(REVIEW.empty?'<div class="note" role="status">Открытых типов в журнале ошибок нет — обычная тренировка.</div>':'');
  const z=$('tzone');

  const t=CUR;

   '<div class="msg" id="fb" role="status" aria-live="polite"></div><div class="row" style="margin-top:10px">'+

  logE('task_start',{kind:'train',sub:t.key});
  const fb=$('fb');

     или решение целиком: задача тогда не идёт в счёт решённых самостоятельно */
  let missed=false, shown=false, done=false;
  const finish=()=>{done=true;$('ans').disabled=true;$('nxt').style.display='inline-block';$('chk').disabled=true;};
  $('chk').onclick=()=>{if(done)return;const raw=$('ans').value;
    /* пустое или нечисловое поле — не попытка и не промах */
    if(!raw.trim()||(t.ansFmt!=='concat'&&parseAns(raw)==null)){fb.className='msg warn';fb.textContent='Впишите ответ числом: целое, десятичная дробь или дробь вида 7/2.';return;}
    if(isRight(t,raw)){
      fb.className='msg ok';fb.textContent='Верно! Ответ: '+fnum(t.ans)+'.'+(shown?' Шаги решения были открыты — задача засчитана как разобранная.':'');
      upd(rec=>{rec.solved=CP.num(rec.solved)+1;});hdr();logE('solved',{sub:t.key});
      if(window.OgeGeometryHelpUsed)fb.textContent += " Решено с подсказкой.";
      if(!shown&&!window.OgeGeometryHelpUsed){CP.solvedOne(t.key); if(!missed)CP.mlog(t.key,true);}   // один вердикт на задачу
      finish();}
    else{const v=parseAns(raw);
      if(!missed){missed=true;CP.mlog(t.key,false);}
      const d=t.diag.find(d=>v!=null&&Math.abs(v-d.v)<=d.e);

      logE('opt_wrong',{sub:t.key,pick:raw});}};
  $('ans').addEventListener('keydown',e=>{if(e.key==='Enter')$('chk').click();});

    const l2=$('toSheet2');if(l2)l2.onclick=()=>renderSheet(SUB2PIN[t.key]);};
  let si=0;

  $('stepH').onclick=()=>{
    if(si>=t.sol.length)return;
    /* шаг с готовым вычислением («… = 10») — это показ результата, а не подсказка:
       задача тогда не идёт в счёт решённых самостоятельно (решение F8 делегата владельца) */
    if(/=\s*(<[^>]+>\s*)*[−-]?\d/.test(t.sol[si]))shown=true;
    if(si<t.sol.length-1){showStep();logE('step_hint',{sub:t.key,step:si});
      fb.className='msg info';fb.textContent='Шаг '+si+' из '+t.sol.length+' открыт — попробуйте довести до ответа сами.';
      $('stepH').textContent='🪜 Ещё шаг ('+(si+1)+' из '+t.sol.length+')';}

    fb.className='msg warn';fb.textContent='Разберите решение по шагам — этот тип ещё вернётся.';
    logE('giveup',{sub:t.key});finish();$('stepH').disabled=true;};
  $('nxt').onclick=()=>renderTrain(true);

function quizSet(){const set=[];
  for(const tp in QUOTA){
    const ks=SUBKEYS.filter(k=>S17[k].topic===tp&&S17[k].quiz!==false);
    for(let i=0;i<QUOTA[tp];i++){const k=ks[Math.floor(Math.random()*ks.length)];
      set.push(build(k,S17[k].gen(),{gen:true}));}}
  for(let i=set.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[set[i],set[j]]=[set[j],set[i]];}
  return set;
}

/* Общие проверки режима ?selftest=1 (канон CLAUDE.md, решение F4 делегата
   владельца). Блок побайтно одинаков в тренажёрах 16, 17, 18, 23, 24, 25;
   копии сверяет гейт tools/oge-geometry-contract.test.mjs. Каждая проверка
   дописывает ошибки в массив errs; прогресс ученика не трогается. */
const STK={
  /* чертёж: нет NaN/undefined/Infinity, все точки внутри viewBox (допуск tol) */
  svg:function(svg,tag,errs,tol){
    if(tol==null)tol=0.5;
    if(typeof svg!=='string'||svg.indexOf('<svg')<0){errs.push(tag+': нет чертежа');return;}
    if(/NaN|undefined|Infinity/.test(svg))errs.push(tag+': в чертеже NaN/undefined/Infinity');
    const vb=/viewBox="\s*(-?[\d.]+)[\s,]+(-?[\d.]+)[\s,]+(-?[\d.]+)[\s,]+(-?[\d.]+)\s*"/.exec(svg);
    if(!vb){errs.push(tag+': у чертежа нет viewBox');return;}
    const X0=+vb[1]-tol,Y0=+vb[2]-tol,X1=+vb[1]+(+vb[3])+tol,Y1=+vb[2]+(+vb[4])+tol;
    let out=0,first='';
    const at=function(x,y,what){if(!(x>=X0&&x<=X1&&y>=Y0&&y<=Y1)){out++;if(!first)first=what+' ('+Math.round(x)+'; '+Math.round(y)+')';}};
    const num=function(a,n){const m=new RegExp('\\s'+n+'="(-?[\\d.]+(?:e-?\\d+)?)"').exec(a);return m?+m[1]:null;};
    const re=/<(\w+)(\s[^>]*)?>/g;let m;
    while((m=re.exec(svg))){
      const el=m[1],a=m[2]||'';
      if(el==='svg')continue;
      [['x','y'],['x1','y1'],['x2','y2'],['cx','cy']].forEach(function(p){const x=num(a,p[0]),y=num(a,p[1]);if(x!=null&&y!=null)at(x,y,el);});
      if(el==='rect'){const x=num(a,'x')||0,y=num(a,'y')||0,w=num(a,'width'),h=num(a,'height');if(w!=null&&h!=null)at(x+w,y+h,'rect');}
      if(el==='circle'){const x=num(a,'cx'),y=num(a,'cy'),r=num(a,'r');if(x!=null&&y!=null&&r!=null){at(x-r,y,'circle');at(x+r,y,'circle');at(x,y-r,'circle');at(x,y+r,'circle');}}
      const pts=/\spoints="([^"]*)"/.exec(a);
      if(pts){const v=pts[1].trim().split(/[\s,]+/).map(Number);for(let i=0;i+1<v.length;i+=2)at(v[i],v[i+1],el);}
      const d=/\sd="([^"]*)"/.exec(a);
      if(d){/* конечные точки команд пути; относительные — от текущей точки */
        const tok=d[1].match(/[MLHVCSQTAZmlhvcsqtaz]|-?(?:\d+\.?\d*|\.\d+)(?:e-?\d+)?/g)||[];
        const need={M:2,L:2,H:1,V:1,C:6,S:4,Q:4,T:2,A:7,Z:0};
        let cx=0,cy=0,cmd='',i=0;
        while(i<tok.length){
          if(/[a-z]/i.test(tok[i])){cmd=tok[i++];if(/z/i.test(cmd))continue;}
          const n=need[cmd.toUpperCase()],rel=cmd!==cmd.toUpperCase();
          if(!n||i+n>tok.length)break;
          const v=tok.slice(i,i+n).map(Number);i+=n;
          const U=cmd.toUpperCase();
          if(U==='H'){cx=rel?cx+v[0]:v[0];}
          else if(U==='V'){cy=rel?cy+v[0]:v[0];}
          else{const ex=v[n-2],ey=v[n-1];cx=rel?cx+ex:ex;cy=rel?cy+ey:ey;}
          at(cx,cy,'path');
          if(U==='M')cmd=rel?'l':'L';
        }
      }
    }
    if(out)errs.push(tag+': за рамкой viewBox '+out+' точек, первая — '+first);
  },
  /* текст задачи и решения: нет null, undefined, NaN, Infinity и «1√» */
  text:function(html,tag,errs){
    const t=String(html).replace(/<[^>]*>/g,' ');
    const m=/\bnull\b|\bundefined\b|\bNaN\b|Infinity|(^|[^\d,.])1√/.exec(t);
    if(m)errs.push(tag+': в тексте «'+m[0].trim()+'»');
  },
  /* последний шаг разбора содержит проверяемый ответ хотя бы в одной записи */
  last:function(step,forms,tag,errs){
    const t=String(step==null?'':step).replace(/<[^>]*>/g,'').replace(/&nbsp;/g,' ').replace(/\s+/g,' ');
    const norm=function(f){return String(f).replace(/<[^>]*>/g,'').replace(/&nbsp;/g,' ').replace(/\s+/g,' ').trim();};
    if(!forms.some(function(f){return f!=null&&norm(f)!==''&&t.indexOf(norm(f))>=0;}))
      errs.push(tag+': последний шаг не содержит ответ ('+forms.filter(function(f){return f!=null;}).join(' / ')+')');
  },
  /* ловушки {v, e, m}: ни одна не принимается как ответ, разные сообщения не ловят одно число */
  traps:function(list,tag,errs,isAns){
    (list||[]).forEach(function(t,i){
      if(!isFinite(t.v)){errs.push(tag+': ловушка — не число');return;}
      if(isAns(t.v))errs.push(tag+': ловушка '+t.v+' совпадает с ответом');
      for(let j=i+1;j<list.length;j++){const u=list[j];
        if(u.m!==t.m&&Math.abs(t.v-u.v)<=(t.e||0)+(u.e||0))errs.push(tag+': ловушки '+t.v+' и '+u.v+' ловят одно число');}
    });
  },
  /* итог в консоль: маркер <ИМЯ>_SELFTEST_OK или _FAIL с числом ошибок */
  done:function(name,errs){
    if(typeof console==='undefined')return;
    if(!errs.length){console.log(name+'_SELFTEST_OK');return;}
    console.log(name+'_SELFTEST_FAIL '+errs.length);
    errs.slice(0,30).forEach(function(e){console.log('  '+e);});
  }
};
/*__SELFTEST_KIT_END__*/
/* общие проверки одной задачи: чертёж в рамке, текст без null/NaN, последний шаг с ответом, ловушки */
function stkTask(t,tag,errs){
  STK.svg(t.svg,tag,errs);
  STK.text([t.text].concat(t.sol).join(' '),tag,errs);
  if(t.ansFmt==='concat')return;
  STK.last(t.sol[t.sol.length-1],[fnum(t.ans)],tag,errs);
  STK.traps(t.diag,tag,errs,v=>Math.abs(v-t.ans)<=Math.max(1e-6,Math.abs(t.ans)*1e-6));
}
/* ---------- СЕЛФТЕСТ (?selftest=1) ---------- */
function selftest(){const out=[];let bad=0;
  const say=s=>out.push(s), fail=s=>{bad++;out.push('✘ '+s)};
  // 1. архив: уникальность, существование подтипа, эталон
  const seen={};ARCHIVE.forEach(r=>{r.nums.forEach(n=>{if(seen[n])fail('дубль номера '+n);seen[n]=1;});
    const s=S17[r.sub];if(!s){fail('нет подтипа '+r.sub+' у №'+r.nums[0]);return;}
    const v=s.calc(r.p);
    const okv=(typeof r.exp==='string')?String(v)===r.exp:Math.abs(v-r.exp)<=Math.abs(r.exp)*1e-9+1e-9;
    if(!okv)fail('№'+r.nums[0]+' ('+r.sub+'): calc='+v+' ≠ эталон '+r.exp);
    if(typeof v==='number'&&!isFinite(v))fail('№'+r.nums[0]+': неконечный ответ');});
  say('архив: '+ARCHIVE.length+' задач, эталоны сверены');
  // 2. геоаудит архива: chk каждой фигуры
  let gch=0;ARCHIVE.forEach(r=>{if(!S17[r.sub])return;const t=build(r.sub,r.p,{});
    t.chk.forEach(c=>{gch++;if(!c.ok)fail('гео №'+r.nums[0]+' ('+r.sub+'): '+c.m);});
    if(t.svg.indexOf('NaN')>=0)fail('NaN в SVG №'+r.nums[0]);});
  say('геоаудит архива: '+gch+' ассертов');
  // 3. стресс генераторов
  let gen=0,gch2=0;SUBKEYS.forEach(k=>{for(let i=0;i<60;i++){const p=S17[k].gen(),t=build(k,p,{gen:true});gen++;
    if(t.ansFmt!=='concat'&&(typeof t.ans!=='number'||!isFinite(t.ans)))fail('генератор '+k+': плохой ответ '+t.ans+' p='+JSON.stringify(p));
    if(!t.text||t.text.indexOf('undefined')>=0)fail('генератор '+k+': текст с undefined');
    if(t.svg.indexOf('NaN')>=0)fail('NaN в SVG генератора '+k+' p='+JSON.stringify(p));
    t.chk.forEach(c=>{gch2++;if(!c.ok)fail('гео '+k+' p='+JSON.stringify(p)+': '+c.m);});
    t.diag.forEach(d=>{if(Math.abs(d.v-t.ans)<1e-9)fail('ловушка = ответу в '+k);});}});
  say('стресс: '+gen+' генераций, '+gch2+' гео-ассертов');
  // 4. зачёт: квоты и исключения
  let q=0;for(const tp in QUOTA){q+=QUOTA[tp];
    if(!SUBKEYS.some(k=>S17[k].topic===tp&&S17[k].quiz!==false))fail('в теме '+tp+' нет подтипов для зачёта');}
  if(q!==10)fail('сумма квот '+q+' ≠ 10'); else say('зачёт: квоты 1+1+3+2+3 = 10');
  // 5. справочник: id и ссылки
  const rid={};REF.forEach(r=>{if(rid[r.id])fail('дубль ref '+r.id);rid[r.id]=1;});
  SUBKEYS.forEach(k=>{if(!rid[S17[k].ref])fail(k+': ссылка на несуществующий блок '+S17[k].ref);
    if(!S17[k].refWhy)fail(k+': пустой refWhy');});
  say('справочник: '+REF.length+' блоков, все ссылки живые');
  // 6. карта листа: пины целостны
  const pid={};let pinned=0;
  PINS.forEach(p=>{if(pid[p.id])fail('дубль пина '+p.id);pid[p.id]=1;
    if(!SHEET_MAP.items.some(x=>x.id===p.sheet))fail('пин '+p.id+': нет блока листа '+p.sheet);
    if(p.ref&&!rid[p.ref])fail('пин '+p.id+' ссылается на несуществующий блок '+p.ref);
    p.subs.forEach(su=>{const k=typeof su==='string'?su:su.k;pinned++;
      if(!S17[k])fail('пин '+p.id+': нет подтипа '+k);});});
  for(const k in SUB2PIN)if(!PINS.some(p=>p.id===SUB2PIN[k]))fail('SUB2PIN бьёт в пустоту: '+k);
  say('карта листа: '+PINS.length+' пинов, '+pinned+' прикреплений');
  // 7. общие проверки канона: чертёж в рамке, текст без null/NaN, последний шаг с ответом, ловушки
  const E=[];ARCHIVE.forEach(r=>{if(S17[r.sub])stkTask(build(r.sub,r.p,{}),'№'+r.nums[0],E);});
  SUBKEYS.forEach(k=>{for(let i=0;i<60;i++)stkTask(build(k,S17[k].gen(),{gen:true}),k,E);});
  E.slice(0,40).forEach(fail);if(E.length>40)fail('… и ещё '+(E.length-40));
  say('общие проверки: чертежи, тексты, последний шаг, ловушки');
  out.unshift(bad? '✘ СЕЛФТЕСТ: '+bad+' ошибок':'✔ СЕЛФТЕСТ ПРОЙДЕН');
  return {ok:!bad,bad:bad,report:out.join('\n'),fails:out.filter(x=>x.indexOf('✘ ')===0&&x.indexOf('✘ СЕЛФТЕСТ')!==0)};
}

/* Minimal course shell. Moves live controls, retaining their original handlers. */
const MinimalGeometry=(()=>{
  const q=s=>document.querySelector(s);
  function shell(mainSelector,title){
    document.body.classList.add('minimal-course');
    const main=q(mainSelector);if(!main)return null;
    if(q('.head h1'))q('.head h1').textContent=title;
    let settings=q('#courseSettings');
    if(!settings){
      settings=document.createElement('details');settings.id='courseSettings';settings.className='minimal-settings';
      const summary=document.createElement('summary');summary.textContent='Выбрать тему · мои результаты';settings.appendChild(summary);
      let target=main.closest('.wrap')||main;if(target.querySelector('.head'))target=main;target.insertAdjacentElement('afterend',settings);
      const content=document.createElement('div');content.className='minimal-navigation';settings.appendChild(content);
      document.querySelectorAll('.head .sub,.head .stats,.head .badge,.head #badge,.tabs').forEach(node=>content.appendChild(node));
      const footer=q('body>.wrap>.note');if(footer)content.appendChild(footer);
    }
    return settings;
  }
  function secondary(main,selectors){
    const settings=q('#courseSettings');if(!settings||!main)return;
    let box=settings.querySelector('.minimal-task-settings');
    if(!box){box=document.createElement('div');box.className='minimal-task-settings';settings.appendChild(box);}
    box.replaceChildren();
    selectors.forEach(selector=>main.querySelectorAll(selector).forEach(node=>box.appendChild(node)));
  }
  function hint(anchor,content,open=false){
    const button=document.createElement('button');button.type='button';button.className='minimal-hint-toggle';button.id='courseHintToggle';button.textContent='Хочешь подсказку?';button.setAttribute('aria-expanded',String(open));button.setAttribute('aria-controls','courseHintPanel');
    const panel=document.createElement('section');panel.id='courseHintPanel';panel.className='minimal-hint';panel.setAttribute('aria-label','Подсказка');panel.hidden=!open;
    if(typeof content==='string')panel.innerHTML=content;else if(content)panel.appendChild(content);
    anchor.insertAdjacentElement('afterend',button);button.insertAdjacentElement('afterend',panel);
    button.onclick=()=>{panel.hidden=!panel.hidden;button.setAttribute('aria-expanded',String(!panel.hidden));};
    return {button,panel};
  }
  function disclosure(panel,nodes){
    const details=document.createElement('details');details.className='minimal-help-actions';const summary=document.createElement('summary');summary.textContent='Разобрать решение';details.appendChild(summary);
    nodes.filter(Boolean).forEach(node=>details.appendChild(node));if(details.children.length>1)panel.appendChild(details);return details;
  }
  function part2(anchor){const note=document.createElement('p');note.className='minimal-part2-note';note.textContent='На ОГЭ нужно записать полное решение с обоснованием.';anchor.appendChild(note);}
  return {shell,secondary,hint,disclosure,part2};
})();

 cosine_law:{title:'Теорема косинусов',explanation:'Для стороны a напротив угла A: a² = b² + c² − 2bc·cos A. Проверь, что b и c — стороны, образующие именно угол A.',passages:[{bookId:'atanasyan2010',section:'п. 98',printedPage:'257–258',url:atanPdf+'#page=259'},{bookId:'merzlyak9_2022',section:'§ 2, теорема 2.1 — текст издания',printedPage:'11',url:merzOriginal+'#:~:text=Теорема%202.1'}]},
 trig_sum_identity:{title:'Откуда берётся косинус суммы или разности?',explanation:'Авторский вывод через скалярное произведение. Возьми единичные векторы u = (cos α, sin α), v = (cos β, sin β). Их произведение по углу равно cos(α − β), а по координатам — cos α·cos β + sin α·sin β. Для суммы замени v на (cos β, −sin β): получишь знак минус. Ссылки ниже содержат основания этого вывода.',derived:true,passages:[{bookId:'atanasyan2010',section:'пп. 102–103, скалярное произведение и координаты',printedPage:'264–267',url:atanPdf+'#page=266'},{bookId:'merzlyak9_2022',section:'§ 16, определение и теорема 16.2 — текст издания',url:merzOriginal+'#:~:text=Теорема%2016.2'}]},
 trig_reduction:{title:'Как преобразовать тригонометрическое выражение?',explanation:'Для острого угла sin² α + cos² α = 1 следует из теоремы Пифагора после деления на квадрат гипотенузы. Для произвольного угла это равенство координат единичной окружности. Отражение точки относительно осей объясняет знаки: sin(x − 90°) = −cos x; cos(360° − x) = cos x.',derived:true,passages:[{bookId:'atanasyan2010',section:'пп. 93–94, тригонометрические функции и формулы приведения',printedPage:'252–254',url:atanPdf+'#page=254'},{bookId:'merzlyak9_2022',section:'§ 1, синус, косинус и тангенс угла от 0° до 180° — текст издания',url:merzOriginal}]},
 inscribed_angle_converse:{title:'Когда равенство углов доказывает принадлежность окружности?',explanation:'Точки A и D находятся с одной стороны прямой BC. Если ∠BAC = ∠BDC, то A, B, C, D лежат на одной окружности. Это обратный признак, а не прямое свойство вписанного угла. Его можно вывести, построив окружность через A, B, C и используя теорему о внешнем угле: точка с тем же углом в данной полуплоскости не может лежать внутри или вне этой окружности. Ниже — теоремы, на которых основан этот вывод.',derived:true,parents:['inscribed_angles','circumcircle','triangle_exterior']},
 diameter_locus:{title:'Почему вершина прямого угла лежит на окружности?',explanation:'Если ∠APB = 90°, середина O гипотенузы AB равноудалена от A, P и B. Значит OP = OA = OB: точка P лежит на окружности с центром O и диаметром AB. Прямой и обратный переходы обоснованы отдельно.',derived:true,parents:['median_hypotenuse','circle_definition']},
 median_length:{title:'Как получить формулу длины медианы?',explanation:'Пусть AM — медиана, BM = CM = a/2, AB = c, AC = b. Запиши теорему косинусов для ABM и ACM. Углы при M смежные, поэтому слагаемые с косинусами при сложении сократятся: b² + c² = 2AM² + a²/2. Вырази AM².',derived:true,parents:['triangle_parts','cosine_law','adjacent_vertical']},
 bisector_length:{title:'Как обосновать длину биссектрисы?',explanation:'Пусть BE — биссектриса в ABC. Отношение AE:EC = AB:BC получается из отношения площадей ABE и CBE: используй общую высоту к AC и формулу площади через синус угла. Затем запиши теорему косинусов в ABE и CBE и исключи косинусы смежных углов при E. Получится BE² = AB·BC − AE·EC.',derived:true,parents:['angle_bisector','triangle_area','triangle_sine_area','cosine_law']},
 heron_formula:{title:'Формула Герона',explanation:'Обозначь полупериметр p = (a + b + c)/2. Формула S² = p(p − a)(p − b)(p − c) получается из S = ab·sin C/2 и теоремы косинусов: замени sin² C на 1 − cos² C, затем разложи разность квадратов. Это авторская схема вывода из указанных теорем.',derived:true,parents:['triangle_sine_area','cosine_law','trig_reduction']},
 incircle_area:{title:'Площадь через вписанную и вневписанную окружность',explanation:'Для инцентра разбей треугольник на три с общей высотой r к его сторонам: S = r(a + b + c)/2 = rp. Для центра вневписанной окружности против стороны a складывай две площади и вычитай третью: S = rₐ(b + c − a)/2 = rₐ(p − a). Ниже — свойства касательной и формула площади, которые обосновывают вывод.',derived:true,parents:['incircle','tangent','triangle_area']}
});
function getTopic(id,seen=new Set()){if(seen.has(id))return null;seen.add(id);const topic=extraTopics[id]||root.Task19TextbookData?.topics?.[id];if(!topic)return null;if(!topic.parents)return topic;return {...topic,passages:[...new Map(topic.parents.flatMap(p=>getTopic(p,new Set(seen))?.passages||[]).map(p=>[p.bookId+'|'+p.section,p])).values()]};}

 for(const topic of topics){const section=element(d,'section',null,'ocr-topic');section.dataset.topic=topic.id;section.append(element(d,'h4',topic.title),element(d,'p',topic.explanation));if(topic.derived)section.append(element(d,'p','Авторский вывод. Ссылки — на определения и теоремы, использованные в обосновании.','ocr-note'));const list=element(d,'ul');
  for(const p of topic.passages){const book=data.books[p.bookId];if(!book)continue;const a=link(d,p.url,(book.authors.includes('Атанасян')?'Атанасян и др.':'Мерзляк и др.')+' · '+book.title+' · '+p.section+(p.printedPage?' · с. '+p.printedPage:''));if(!a)continue;const li=element(d,'li');li.append(a,element(d,'span',book.edition+' · '+(p.hostNote||(new URL(p.url).hostname.endsWith('scribd.com')?'Текст издания во внешнем архиве Scribd. Это не сайт издательства.':book.hostNote)||''),'ocr-edition'));list.append(li);}
  section.append(list);box.append(section);
 }
 close(box);return box;
}
function sheetCards(host,ids,options={}){
 const media=root.MathExamTrainerOffline?.media||(file=>file);
 const sources={...(root.Task19Reference?.crops||{}),...(options.crops||{})},d=host.ownerDocument,items=[...new Set(ids||[])].map(id=>({id,...sources[id]})).filter(c=>c.file);if(!items.length&&!options.pages?.length)return null;
 const box=disclosure(host,options.label||'Где это в справочных материалах ОГЭ?','ocr-sheet');box.append(element(d,'p','Справочные материалы ФИПИ, проект ОГЭ 2027. Формула помогает вычислить величину; применимость формулы нужно обосновать.','ocr-note'));
 for(const c of items){const figure=element(d,'figure'),img=element(d,'img');img.src=media(c.file);img.alt=c.alt;img.width=c.width;img.height=c.height;img.loading='lazy';figure.append(element(d,'figcaption',c.title),img);box.append(figure);}

 for(const page of pages){const full=disclosure(box,'Показать весь справочный лист: страница '+page,'ocr-full-sheet'),img=element(d,'img'),pan=element(d,'div',null,'ocr-sheet-pan'),zoom=element(d,'button','Увеличить лист','ocr-close ocr-zoom');img.src=media('/trainers/task19-reference/fipi-oge-2027-page-0'+page+'.png');img.alt='Полная страница '+page+' справочных материалов ОГЭ, проект 2027';img.loading='lazy';zoom.type='button';zoom.setAttribute('aria-pressed','false');pan.tabIndex=0;pan.setAttribute('role','region');pan.setAttribute('aria-label','Справочный лист: после увеличения прокручивай в стороны');zoom.onclick=()=>{const large=pan.classList.toggle('ocr-zoomed');zoom.setAttribute('aria-pressed',String(large));zoom.textContent=large?'Уменьшить лист':'Увеличить лист';};pan.append(img);full.append(zoom,element(d,'p','Лист откроется здесь. После увеличения прокручивай его в стороны.','ocr-note'),pan);}
 const p=element(d,'p');p.append(link(d,'https://mathexam.space/trainers/task19-reference/source-demo-2027.pdf','Открыть оригинал PDF'),d.createTextNode(' · '),link(d,'https://fipi.ru/oge/demoversii-specifikacii-kodifikatory','Источник — ФИПИ'));box.append(p);close(box);return box;

const q=(s,r=doc)=>r.querySelector(s),all=(s,r=doc)=>Array.from(r.querySelectorAll(s));

 const nav=el('div',null,'ocg-figure-nav');nav.append(el('p','Если рисунок не помещается, прокрути его пальцем или кнопками. Стрелки клавиатуры тоже работают.','ocg-scroll-note'));
 const left=button('← Влево',()=>{wrap.scrollLeft-=Math.max(160,wrap.clientWidth*.8);}),right=button('Вправо →',()=>{wrap.scrollLeft+=Math.max(160,wrap.clientWidth*.8);});
 left.dataset.geometryPan='left';right.dataset.geometryPan='right';nav.append(left,right);wrap.before(nav);

function watch(inputs,run){inputs.forEach(i=>i.addEventListener('input',run));run();}
const captions={adjacent:'Меняй внутренний угол. Что происходит с соседним внешним углом?',tangentChord:'Меняй дугу AB. Сравни её с углом между касательной в A и хордой AB.',cyclic:'Двигай вершину D по окружности. Сравни противоположные углы A и C.',sine:'Меняй радиус и угол. Сравни длину хорды BC с синусом вписанного угла A.',isosceles:'Меняй угол при основании. Сравни два угла при основании и угол при вершине.',trapezoidAngles:'Меняй нижний угол равнобедренной трапеции. Сравни углы при каждом основании.',circleAngle:'Двигай точку C по большой дуге AB. Затем меняй центральный угол: сравни два угла над одной и той же малой дугой AB.',tangent:'Отодвигай точку P от окружности. Посмотри, какой угол между радиусом OT и касательной PT сохраняется.',chord:'Отодвигай хорду от центра. Сравни расстояние OM и длину хорды AB.',incircle:'Меняй радиус. Сравни его с расстоянием между двумя параллельными касательными.',squareIncircle:'Меняй радиус вписанной окружности. Сравни диаметр со стороной квадрата, затем найди площадь.',trapezoidMidSegments:'Меняй основания трапеции. Проведи диагональ и сравни два отрезка средней линии с основаниями.',regular:'Выбери число сторон. Сравни радиус описанной окружности с расстоянием от центра до стороны.',power:'Передвигай точку P внутри окружности. Сравни произведения отрезков двух хорд.',area:'Меняй наклон, сохраняя основание и высоту. Изменится ли площадь?',square:'Меняй сторону квадрата. Сравни сторону, периметр и площадь: как пройти от периметра к площади?',rhombArea:'Меняй диагонали ромба. Дострой прямоугольник и сравни площади: какую его часть занимает ромб?',rhombHeight:'Меняй сторону и угол ромба. Сравни сторону с высотой; затем найди площадь по основанию и высоте.',diagonal:'Меняй фигуру. Следи за длинами диагоналей и точкой их пересечения.',angles:'Меняй угол. Сравни соседние и противоположные углы.',gridLength:'Меняй горизонтальный и вертикальный шаги. Как найти прямое расстояние между концами?',gridArea:'Сначала выбери основание и высоту. Нажми «Достроить прямоугольник» и сравни площади.',midline:'Меняй размеры. Нажми «Показать среднюю линию»: какие стороны она соединяет?',ratio:'Меняй коэффициент подобия. Сравни, во сколько раз меняются длины и площади.'};
function model(host,kind,shape){
 host.dataset.geometryModel=kind;host.append(el('p',captions[kind],'ocg-instruction'),el('p','Это отдельная учебная модель. Её числа не являются ответом к твоей задаче.','ocg-note'));

 if(kind==='adjacent'){

 }else if(kind==='sine'){

 }else if(kind==='isosceles'){

  watch([angle],()=>{const A=+angle.value,h=90*Math.tan(rad(A)),bottom=260,top=bottom-h;draw(poly([[130,bottom],[310,bottom],[220,top]])+point(130,bottom,'A',-24,15)+point(310,bottom,'B',10,15)+point(220,top,'C',10,-8)+label(162,bottom-14,`${A}°`)+label(278,bottom-14,`${A}°`));out.textContent=`CA = CB, поэтому углы A и B равны ${A}°. Угол C = 180° − 2 · ${A}° = ${180-2*A}°.`;});

  }
  function save(){
    if(state.stage==='practice')state.drafts[state.variant]={answer:state.answer,proof:state.proof,wrong:state.wrong,helped:state.helped,checked:state.checked};
    retainExposure(lesson,state);sessions.set(lesson.id,state);
    if(!root.navigator?.locks?.request){storageAvailable=false;notice.textContent='Безопасное сохранение между вкладками недоступно. Работа останется на этой странице до её закрытия.';return true;}
    const l=lesson,key=PREFIX+l.id,epoch=epochs.get(l.id)||0;
    if(!versions.has(l.id))versions.set(l.id,state.rev);
    const desired=JSON.parse(JSON.stringify(state));
    let immediate=true;
    root.navigator.locks.request(key,()=>{
      if((epochs.get(l.id)||0)!==epoch)return;
      const fresh=decode(root.localStorage.getItem(key),l);
      if(fresh.rev!==versions.get(l.id)){
        immediate=false;acceptFresh(l,fresh,'В другой вкладке появилась более свежая работа. Здесь показана сохранённая версия; повтори своё действие.');
        if(lesson.id===l.id)render();return;
      }
      retainExposure(l,desired);desired.rev=fresh.rev+1;root.localStorage.setItem(key,JSON.stringify(desired));versions.set(l.id,desired.rev);
      // The session may already contain later keystrokes or another practice variant.
      const cached=sessions.get(l.id);if(cached)cached.rev=desired.rev;
    }).catch(()=>{storageAvailable=false;notice.textContent='Сохранение в этом браузере недоступно. Пока страница открыта, можно продолжать.';});
    return immediate;
  }
  function button(text,action,fn){const b=e('button',text);b.type='button';b.dataset.ovmAction=action;b.addEventListener('click',fn);return b;}
  function change(fn){fn();if(save())render();}
  function choices(q,field,action){
    const fieldset=e('fieldset'),legend=e('legend',q.question);fieldset.append(legend);
    q.choices.forEach((text,index)=>{const l=e('label',null,'ovm-choice'),r=e('input');r.type='radio';r.name='ovm-'+field;r.value=String(index);r.checked=state[field]===index;r.addEventListener('change',()=>{state[field]=index;go.disabled=field==='reason'&&index!==q.answer;save();});l.append(r,e('span',text));fieldset.append(l);});host.append(fieldset);
    host.append(button('Проверить',action,()=>{if(state[field]===null){feedback.textContent='Сначала выбери предположение.';return;}const ok=state[field]===q.answer;feedback.textContent=(ok?'Верно. ':'Пока не так. ')+q.explain;if(field==='prediction'){go.disabled=false;}else if(ok){go.disabled=false;}save();}));
    const feedback=e('p','','ovm-feedback');feedback.setAttribute('data-ovm-feedback','');feedback.setAttribute('role','status');host.append(feedback);
    const nextStage=field==='prediction'?'experiment':'practice';
    const go=button(field==='prediction'?'Проверить на модели':'Решить новый пример',nextStage,()=>{if(field==='reason'&&state.reason!==q.answer)return;change(()=>{state.stage=nextStage;if(nextStage==='practice')state.visits[state.variant]=(state.visits[state.variant]||0)+1;});});
    go.disabled=field==='prediction'?state.prediction===null:state.reason!==q.answer;host.append(go);
  }
  function renderScene(scene,readout){const view=lesson.render(state.params);scene.innerHTML=view.svg;readout.textContent=view.readout;}
  function experiment(){
    host.append(e('p',lesson.goal));
    const scene=e('div',null,'ovm-scene');scene.setAttribute('data-ovm-scene','');const readout=e('p',null,'ovm-readout');readout.setAttribute('aria-live','polite');host.append(scene,readout);renderScene(scene,readout);
    for(const c of lesson.controls){
      const box=e('div',null,'ovm-control'),label=e('label',c.label),number=e('input'),range=e('input');
      number.type='number';range.type='range';for(const input of [number,range]){input.min=String(c.min);input.max=String(c.max);input.step=String(c.step);input.value=String(state.params[c.key]);input.dataset.ovmControl=c.key;input.setAttribute('aria-label',c.label+(input===number?' — точное значение':' — ползунок'));}
      label.append(number);box.append(label,range);host.append(box);
      const update=(input,other)=>{const value=Number(input.value);if(!input.value||!Number.isFinite(value)||value<c.min||value>c.max){input.setAttribute('aria-invalid','true');return;}input.removeAttribute('aria-invalid');state.params[c.key]=value;if(!save())return;other.value=String(value);renderScene(scene,readout);};
      range.addEventListener('input',()=>update(range,number));number.addEventListener('input',()=>update(number,range));
    }
    host.append(button('Почему это работает?','reason',()=>change(()=>{state.stage='reason';})));
  }
  function practice(){
    const p=lesson.practices[state.variant],familiar=state.seen.includes(state.variant)||state.helped||state.wrong||(state.visits[state.variant]||0)>1;
    host.append(e('p',familiar?'Знакомый пример · повторение':`Новое условие ${state.variant+1} из ${lesson.practices.length}`,'ovm-kicker'),e('p',p.prompt,'ovm-problem'));
    const label=e('label','Ответ'),answer=e('input');answer.type='text';answer.inputMode='decimal';answer.maxLength=100;answer.setAttribute('data-ovm-answer','');answer.value=state.answer;answer.disabled=state.checked;label.append(answer);host.append(label);
    answer.addEventListener('input',()=>{state.answer=answer.value;save();});
    if(p.proof){const proofLabel=e('label','Запиши обоснование'),proof=e('textarea');proof.rows=4;proof.maxLength=5000;proof.setAttribute('data-ovm-proof','');proof.value=state.proof;proofLabel.append(proof);host.append(proofLabel,e('p','Числовой ответ проверяется автоматически. Обоснование сохраняется для самостоятельной проверки или обсуждения с преподавателем.','ovm-note'));proof.addEventListener('input',()=>{state.proof=proof.value;save();});}
    const fb=e('p','','ovm-feedback');fb.setAttribute('data-ovm-feedback','');fb.setAttribute('role','status');
    const result=e('p','','ovm-result');result.setAttribute('data-ovm-result','');
    const names={independent:'Самостоятельно',corrected:'После исправления',helped:'С помощью'};
    const resultLabel=value=>(p.proof?'Числовой ответ: ':'')+value+(p.proof?'. Обоснование автоматически не проверено.':'');
    if(state.checked)result.textContent=resultLabel(names[state.results[state.variant]]||'Пример завершён')+'. Можно переходить к следующему условию.';
    const row=e('div',null,'ovm-buttons');
    const check=button('Проверить ответ','check-practice',()=>{
      if(state.checked)return;
      retainExposure(lesson,state);
      if(!numberParts(state.answer)){fb.textContent='Введи число или дробь с ненулевым знаменателем, например 2,5 или 5/2.';return;}
      if(!correct(state.answer,p.answer)){state.wrong=true;if(save())fb.textContent='Пока не совпадает. Проверь условия модели и вычисление; можно открыть подсказку.';return;}
      const wasSeen=state.seen.includes(state.variant);state.checked=true;
      if(!wasSeen){state.seen.push(state.variant);state.results[state.variant]=state.helped?'helped':state.wrong?'corrected':'independent';}
      if(save()){answer.disabled=true;check.disabled=true;result.textContent=wasSeen?'Знакомый повтор. Новый самостоятельный результат не добавлен.':resultLabel(names[state.results[state.variant]])+'. '+(p.proof?'Теперь проверь своё обоснование.':'');updateStats();}
    });check.disabled=state.checked;row.append(check);
    row.append(button('Подсказка','hint',()=>{state.helped=true;if(save())fb.textContent=p.hint;}));
    row.append(button('Разбор','solution',()=>{state.helped=true;if(save())fb.textContent=p.solution+(p.proof?' '+p.proof:'');}));
    host.append(row,fb,result);
    host.append(button('Другое условие','next',()=>change(()=>{const next=(state.variant+1)%lesson.practices.length;state.drafts[state.variant]={answer:state.answer,proof:state.proof,wrong:state.wrong,helped:state.helped,checked:state.checked};
      state.variant=next;state.visits[next]=(state.visits[next]||0)+1;const draft=state.drafts[next];state.answer=draft&&!draft.checked?draft.answer:'';state.proof=draft&&!draft.checked?draft.proof:'';state.wrong=!!draft?.wrong;state.helped=!!draft?.helped;state.checked=false;})));
  }
  function updateStats(){const stats=host.querySelector('[data-ovm-stats]');if(stats)stats.textContent=`Новые примеры: ${Object.values(state.results).filter(x=>x==='independent').length} самостоятельно · ${Object.values(state.results).filter(x=>x==='corrected').length} после исправления · ${Object.values(state.results).filter(x=>x==='helped').length} с помощью.`;}
  function render(){
    const focusInside=host.contains(document.activeElement);host.replaceChildren();host.dataset.ovmLesson=lesson.id;host.dataset.ovmStage=state.stage;const heading=e('h2',lesson.title);heading.tabIndex=-1;host.append(heading);
    if(!storageAvailable)notice.textContent='Сохранение в этом браузере недоступно. Можно работать до закрытия страницы.';
    if(state.stage==='prediction'){if(lesson.preview){const scene=e('div',null,'ovm-scene');scene.dataset.ovmPreview='';const view=lesson.preview(state.params);scene.innerHTML=typeof view==='string'?view:view.svg;host.append(scene);}choices(lesson.predict,'prediction','check-prediction');}
    if(state.stage==='experiment')experiment();
    if(state.stage==='reason')choices(lesson.reason,'reason','check-reason');
    if(state.stage==='practice')practice();
    const stats=e('p','', 'ovm-note');stats.dataset.ovmStats='';host.append(stats);updateStats();
    if(focusInside)heading.focus();
    if(state.stage!=='prediction')host.append(button('Вернуться к исследованию','restart',()=>change(()=>{state.stage='prediction';})));
  }
  picker.addEventListener('change',()=>{try{root.localStorage.setItem(PREFIX+'selection.'+task,picker.value);}catch(_){}load(lessons.find(l=>l.id===picker.value)||lessons[0]);});
  root.addEventListener('storage',ev=>{
    for(const l of lessons){
      if((ev.key!==null&&ev.key!==PREFIX+l.id)||!sessions.has(l.id))continue;
      // A queued event can be older than a commit already observed in this tab.
      const raw=read(l);if(raw===undefined)continue;const fresh=decode(raw,l);if(fresh.rev===versions.get(l.id))continue;
      acceptFresh(l,fresh,'Работа обновлена из другой вкладки.');if(lesson.id===l.id)render();
    }
  });
  try{const selected=root.localStorage.getItem(PREFIX+'selection.'+task);lesson=lessons.find(l=>l.id===selected)||lesson;}catch(_){}
  load(lesson);
})(typeof window !== 'undefined' ? window : globalThis);

</script>
</body>
