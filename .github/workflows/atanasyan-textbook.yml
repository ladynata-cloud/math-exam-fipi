name: Atanasyan textbook — source, proof and interactive course
on:
  pull_request:
    paths: ['stereo-course/textbook/**', 'stereo-course/assets/task-scene-viewer.js', 'stereo-course/assets/math-text.js', 'tools/stereo-textbook/**', '.github/workflows/atanasyan-textbook.yml']
permissions:
  contents: read
jobs:
  source-model-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.62.1 jsdom@26.1.0 ajv@8.17.1 ajv-formats@3.0.1
      - name: Source catalogue and reproducible build
        run: |
          python3 tools/stereo-textbook/build_textbook.py
          git diff --exit-code -- stereo-course/textbook/data/course.json
          python3 tools/stereo-textbook/catalog.test.py
          node tools/stereo-textbook/schema.test.cjs
          node tools/stereo-textbook/content.test.cjs
      - name: Retained work, nested theory and publication boundaries
        run: node tools/stereo-textbook/runtime.test.cjs
      - run: npx playwright install --with-deps chromium
      - name: Every authored lesson, mobile models and real two-tab recovery
        env:
          TEXTBOOK_ARTIFACTS: artifacts/textbook
        run: node tools/stereo-textbook/browser.cjs
      - name: Preserve actual browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atanasyan-textbook-visuals
          path: artifacts/textbook/
          retention-days: 7
          if-no-files-found: warn
      - run: git diff --check
