name: Notebook mathematics course — content and shared board
on:
  pull_request:
    paths:
      - 'trainers/notebook-math*'
      - 'trainers/board-compat.json'
      - 'trainers/board-picker-data.json'
      - 'tools/notebook-math*'
      - '.github/workflows/notebook-math-course.yml'
  push:
    branches: [main]
    paths:
      - 'trainers/notebook-math*'
      - 'tools/notebook-math*'
      - '.github/workflows/notebook-math-course.yml'
permissions:
  contents: read
jobs:
  course:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - name: Content, answer keys, state and registry
        run: node --test tools/notebook-math.test.cjs
      - name: Install board and browser dependencies
        run: |
          npm ci --prefix board-server --include=optional
          npm install --prefix "$RUNNER_TEMP/notebook-browser" --no-save --no-package-lock --ignore-scripts playwright@1.62.1
          "$RUNNER_TEMP/notebook-browser/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/notebook-browser/node_modules" >> "$GITHUB_ENV"
      - name: Course and synthetic real board room
        run: node tools/notebook-math-board.browser.cjs
