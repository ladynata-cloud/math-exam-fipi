<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex">
  <title>Сечения с нуля · совместная работа на доске</title>
  <link rel="canonical" href="https://mathexam.space/stereo-course/sections/">
  <link rel="stylesheet" href="/stereo-course/sections/assets/style.css">
  <style>
    body[data-sections-board] .layout{display:block;padding:.4rem .65rem 1rem}
    body[data-sections-board] .layout>.catalog{position:static;margin:1rem 0}
    body[data-sections-board] .lesson-header{padding:.65rem .8rem}
    body[data-sections-board] .lesson-header h2{font-size:1.2rem;margin:0 0 .45rem}
    body[data-sections-board] .lesson-condition{line-height:1.45;margin:0}
    body[data-sections-board] .model-svg{height:clamp(180px,42vh,360px)}
  </style>
</head>
<body data-sections-board="true">
  <a class="skip-link" href="#lesson-title">К заданию</a>
  <div id="sections-app"><p>Открываем общий разбор…</p></div>
  <noscript><p>Для совместной работы нужен JavaScript.</p></noscript>
  <script src="/stereo-course/sections/assets/course-data.js"></script>
  <script src="/trainers/board-bridge.js"></script>
  <script src="/stereo-course/sections/assets/board-session.js"></script>
  <script src="/stereo-course/sections/assets/app.js"></script>
  <script>
    // The shared room opens on the lesson. Keep the catalogue and the rule reachable after it.
    const course = document.getElementById('sections-app');
    const lessonLayout = course.querySelector('.layout');
    if (lessonLayout) {
      course.querySelector('.app-header').classList.add('sr-only');
      lessonLayout.append(lessonLayout.querySelector('.catalog'));
      lessonLayout.after(course.querySelector('.principle'));
    }
  </script>
  <script defer src="/assets/assistant/home-link.js?v=20261110"></script>
</body>
</html>
