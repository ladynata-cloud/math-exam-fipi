name: H35 algebra harmonization

on:
  pull_request:
    paths:
      - 'trainers/linear-systems-trainer.html'
      - 'trainers/quadratic-inequalities-lab.html'
      - 'trainers/algebra-harmonization/**'
      - 'downloads/trainers/linear-systems-trainer/**'
      - 'downloads/trainers-manifest.json'
      - 'tools/h35-algebra-harmonization*'
      - 'tools/fixtures/h35-algebra-conditions.json'
      - '.github/workflows/h35-algebra-harmonization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  algebra:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned browser and DOM test dependencies
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.62.1 jsdom@26.1.0
          npx playwright install --with-deps chromium
      - name: Original mathematics, durable work, concurrent tabs and DOM behavior
        run: node --test tools/h35-algebra-harmonization.test.cjs
      - name: Real browser, both viewports and offline HTML and ZIP
        env:
          H35_ARTIFACTS: artifacts/h35-algebra
        run: node tools/h35-algebra-harmonization.browser.cjs
      - name: Confirm scoped downloadable package is reproducible
        run: |
          node scripts/build-trainer-downloads.mjs --only=linear-systems-trainer --downloads-only
          git diff --exit-code -- trainers/linear-systems-trainer.html downloads/trainers/linear-systems-trainer/
      - name: H35 acceptance gate
        run: echo H35_ALGEBRA_HARMONIZATION_GATE_OK
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: h35-algebra-browser
          path: artifacts/h35-algebra/
          if-no-files-found: warn
