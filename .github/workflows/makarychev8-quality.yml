name: Makarychev 8 course quality
on:
  pull_request:
    paths:
      - 'school/makarychev8/**'
      - 'school/peterson6/math.js'
      - '.github/workflows/makarychev8-quality.yml'
  push:
    branches: [main]
    paths:
      - 'school/makarychev8/**'
      - 'school/peterson6/math.js'
permissions:
  contents: read
jobs:
  course:
    runs-on: ubuntu-latest
    # Includes the new chapter and every earlier worked solution.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent textbook mathematics
        run: |
          python -m pip install sympy==1.14.0
          python school/makarychev8/test-exercises-1-24.py
          python school/makarychev8/test-exercises-25-54.py
          python school/makarychev8/test-exercises-55-74.py
          python school/makarychev8/test-exercises-75-109.py
          python school/makarychev8/test-roots-source.py
          python school/makarychev8/test-exercises-110-133.py
          python school/makarychev8/test-exercises-134-149.py
          python school/makarychev8/test-exercises-150-180.py
          python school/makarychev8/test-exercises-181-200.py
          python school/makarychev8/test-exercises-201-211.py
          python school/makarychev8/test-exercises-212-214.py
          python school/makarychev8/test-exercises-215-220.py
          python school/makarychev8/test-exercises-221-230.py
          python school/makarychev8/test-exercises-231-267.py
          python school/makarychev8/test-exercises-510-530.py
          python school/makarychev8/test-exercises-531-556.py
          python school/makarychev8/test-exercises-557-577.py
          python school/makarychev8/test-exercises-578-597.py
          python school/makarychev8/test-exercises-598-616.py
          python school/makarychev8/test-exercises-617-630.py
          python school/makarychev8/test-exercises-631-647.py
          python school/makarychev8/test-exercises-648-670.py
          python school/makarychev8/test-exercises-671-686.py
          python school/makarychev8/test-exercises-687-695.py
          python school/makarychev8/test-exercises-696-701.py
          python school/makarychev8/test-exercises-702-718.py
          python school/makarychev8/test-exercises-719-732.py
          python school/makarychev8/test-exercises-733-742.py
          python school/makarychev8/test-exercises-743-752.py
          python school/makarychev8/test-exercises-753-763.py
          python school/makarychev8/test-exercises-764-782.py
          python school/makarychev8/test-exercises-783-797.py
          python school/makarychev8/test-exercises-798-805.py
      - name: Build, syntax and mathematical contracts
        run: |
          node school/makarychev8/build.cjs
          git diff --exit-code -- school/makarychev8/data.js
          node --check school/makarychev8/app.js
          node --check school/makarychev8/check.js
          node --check school/makarychev8/models.js
          node --check school/makarychev8/task-graphs.js
          node school/makarychev8/test-task-graphs.cjs
          node school/makarychev8/test-course.cjs
          node school/makarychev8/test-rate-stories.cjs
          node school/makarychev8/test-plane-equations.cjs
          node school/makarychev8/test-linear-systems.cjs
          node school/makarychev8/test-graphical-systems.cjs
          node school/makarychev8/test-system-substitution.cjs
          node school/makarychev8/test-story-balances.cjs
          node school/makarychev8/test-parameter-equations.cjs
          node school/makarychev8/test-quadratic-review.cjs
          node school/makarychev8/test-applied-review.cjs
          node school/makarychev8/test-vieta-review.cjs
          node school/makarychev8/test-trinomial-review.cjs
          node school/makarychev8/test-rational-graphs.cjs
          node school/makarychev8/test-models.cjs
          node school/makarychev8/test-state.cjs
          git diff --check
      - name: Isolated DOM and browser dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/makarychev-qa" --no-audit --no-fund --ignore-scripts jsdom@26.1.0 playwright@1.62.1
          node "$RUNNER_TEMP/makarychev-qa/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Every worked solution and saved-work journey
        run: |
          NODE_PATH="$RUNNER_TEMP/makarychev-qa/node_modules" node --max-old-space-size=1024 school/makarychev8/test-ui.cjs
          NODE_PATH="$RUNNER_TEMP/makarychev-qa/node_modules" node school/makarychev8/test-import.cjs
          NODE_PATH="$RUNNER_TEMP/makarychev-qa/node_modules" node school/makarychev8/test-audit-learning.cjs
      - name: Square roots and two board participants
        run: |
          NODE_PATH="$RUNNER_TEMP/makarychev-qa/node_modules" node school/makarychev8/test-roots-engine.cjs
          NODE_PATH="$RUNNER_TEMP/makarychev-qa/node_modules" node school/makarychev8/test-board.cjs
      - name: Numbered fractions, self-drawn graphs and saved notes
        run: NODE_PATH="$RUNNER_TEMP/makarychev-qa/node_modules" node school/makarychev8/test-browser-fractions.cjs
      - name: Square roots, accepted work and narrow screens
        run: NODE_PATH="$RUNNER_TEMP/makarychev-qa/node_modules" node school/makarychev8/test-browser-roots.cjs
      - name: Chromium incomplete quadratic equations and new conditions
        run: NODE_PATH="$RUNNER_TEMP/makarychev-qa/node_modules" node school/makarychev8/test-browser-quadratics.cjs
      - name: Chromium quadratic formula, curves and investigation
        run: NODE_PATH="$RUNNER_TEMP/makarychev-qa/node_modules" node school/makarychev8/test-browser-quadratic-formula.cjs
      - name: Word problem models and both scale constructions
        run: NODE_PATH="$RUNNER_TEMP/makarychev-qa/node_modules" node school/makarychev8/test-browser-word-problems.cjs
      - name: Vieta, inverse verification, real parameters and proof chains
        run: NODE_PATH="$RUNNER_TEMP/makarychev-qa/node_modules" node school/makarychev8/test-browser-vieta.cjs
      - name: Trinomial vertices, investigation, exact products and mobile views
        run: NODE_PATH="$RUNNER_TEMP/makarychev-qa/node_modules" node school/makarychev8/test-browser-trinomial.cjs
      - name: Factor multiplicity, unrestricted examples and the missing point
        run: NODE_PATH="$RUNNER_TEMP/makarychev-qa/node_modules" node school/makarychev8/test-browser-factors.cjs
      - name: Rational equations, source domains and reciprocal intersections
        run: NODE_PATH="$RUNNER_TEMP/makarychev-qa/node_modules" node school/makarychev8/test-browser-rational-equations.cjs
      - name: Chromium word problems, physical limits and free equation coefficients
        run: NODE_PATH="$RUNNER_TEMP/makarychev-qa/node_modules" node school/makarychev8/test-browser-rate-stories.cjs
      - name: Chromium graphs of two-variable equations and unions of lines
        run: NODE_PATH="$RUNNER_TEMP/makarychev-qa/node_modules" node school/makarychev8/test-browser-plane-equations.cjs
      - name: Chromium linear systems, two-ray intersections and time segment
        run: NODE_PATH="$RUNNER_TEMP/makarychev-qa/node_modules" node school/makarychev8/test-browser-linear-systems.cjs
      - name: Chromium graphical systems and independent intersection coordinates
        run: NODE_PATH="$RUNNER_TEMP/makarychev-qa/node_modules" node school/makarychev8/test-browser-graphical-systems.cjs
      - name: Chromium substitution, radical pairs and strict intervals
        run: NODE_PATH="$RUNNER_TEMP/makarychev-qa/node_modules" node school/makarychev8/test-browser-system-substitution.cjs
      - name: Chromium word problem models, integer constraints and source note
        run: NODE_PATH="$RUNNER_TEMP/makarychev-qa/node_modules" node school/makarychev8/test-browser-story-balances.cjs
      - name: Chromium parameter equations, degree loss and saved model
        run: NODE_PATH="$RUNNER_TEMP/makarychev-qa/node_modules" node school/makarychev8/test-browser-parameter-equations.cjs
      - name: Chromium supplementary proof and exact root checks
        run: NODE_PATH="$RUNNER_TEMP/makarychev-qa/node_modules" node school/makarychev8/test-browser-quadratic-review.cjs
      - name: Chromium integer runs, frames and folding carton
        run: NODE_PATH="$RUNNER_TEMP/makarychev-qa/node_modules" node school/makarychev8/test-browser-applied-review.cjs
      - name: Chromium Vieta proof and transformed equations
        run: NODE_PATH="$RUNNER_TEMP/makarychev-qa/node_modules" node school/makarychev8/test-browser-vieta-review.cjs
      - name: Chromium factorizations and original expression restrictions
        run: NODE_PATH="$RUNNER_TEMP/makarychev-qa/node_modules" node school/makarychev8/test-browser-trinomial-review.cjs
      - name: Chromium rational equations, reading graphs and removable holes
        run: NODE_PATH="$RUNNER_TEMP/makarychev-qa/node_modules" node school/makarychev8/test-browser-rational-graphs.cjs
      - name: Chromium source exercises and responsive layout
        run: NODE_PATH="$RUNNER_TEMP/makarychev-qa/node_modules" node school/makarychev8/test-browser.cjs
      - name: Chromium exercises25–54 and graph construction
        run: NODE_PATH="$RUNNER_TEMP/makarychev-qa/node_modules" node school/makarychev8/test-browser-25-54.cjs
      - name: Chromium exercises55–74, signs and integral values
        run: NODE_PATH="$RUNNER_TEMP/makarychev-qa/node_modules" node school/makarychev8/test-browser-55-74.cjs
      - name: Chromium exercises75–109, proofs and two-line construction
        run: NODE_PATH="$RUNNER_TEMP/makarychev-qa/node_modules" node school/makarychev8/test-browser-75-109.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: makarychev8-browser
          path: artifacts/makarychev8/
          if-no-files-found: ignore
