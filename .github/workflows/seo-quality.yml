name: Public SEO and sitemap

on:
  pull_request:
    paths:
      - '**/*.html'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'assets/topic-pages.css'
      - 'assets/course-examples*'
      - 'assets/course-examples/**'
      - 'content/course-entrances/**'
      - 'tools/course-entrances*'
      - 'tools/build-course-*'
      - 'tools/grade5_course_entries.py'
      - 'assets/grade5-course-entry.css'
      - 'school/peterson5/data.js'
      - 'school/peterson5/workshop-data.js'
      - 'courses/vilenkin-5-part-1/data/**'
      - 'tools/build-sitemap.py'
      - 'tools/seo-*'
      - 'trainers/oge-basics/multiplication-division/arzhenikov-map.*'
      - 'tools/arzhenikov-map.browser.cjs'
      - 'tools/arzhenikov-garden*'
      - 'tools/arzhenikov-life*'
      - 'tools/arzhenikov-adventure*'
      - 'tools/arzhenikov-harbor*'
      - 'tools/arzhenikov-discoveries*'
      - 'tools/arzhenikov-journeys*'
      - 'tools/arzhenikov-courses*'
      - 'tools/arzhenikov-offline*'
      - 'tools/build-arzhenikov-offline.py'
      - 'trainers/oge-basics/multiplication-division/arzhenikov-life*'
      - 'trainers/oge-basics/multiplication-division/arzhenikov-workshop*'
      - 'trainers/oge-basics/multiplication-division/arzhenikov-garden*'
      - 'trainers/oge-basics/multiplication-division/arzhenikov-adventure*'
      - 'trainers/oge-basics/multiplication-division/arzhenikov-harbor*'
      - 'trainers/oge-basics/multiplication-division/arzhenikov-discoveries*'
      - 'trainers/oge-basics/multiplication-division/arzhenikov-journeys*'
      - 'trainers/oge-basics/multiplication-division/arzhenikov-course*'
      - 'trainers/oge-basics/multiplication-division/arzhenikov-offline.zip'
      - 'trainers/oge-basics/multiplication-division/arzhenikov-art*'
      - 'trainers/oge-basics/multiplication-division/arzhenikov-*-atlas.png'
      - 'trainers/oge-basics/multiplication-division/arzhenikov-peach.png'
      - '.github/workflows/seo-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-seo:
    runs-on: ubuntu-latest
    # Include browser/dependency installation as well as the actual route checks.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Sitemap exclusions, canonical routes and public entrances
        run: |
          python3 tools/seo-sitemap.test.py
          python3 tools/build-sitemap.py --check
          python3 tools/seo-check.py
          git diff --check
      - name: New learner pages have a searchable public entry
        if: github.event_name == 'pull_request'
        run: python3 tools/seo-new-trainers.py --base HEAD^1
      - name: Static catalog and JavaScript destination parity
        run: |
          npm install --prefix "$RUNNER_TEMP/seo-catalog-qa" --no-save --no-package-lock --ignore-scripts jsdom@26.1.0
          NODE_PATH="$RUNNER_TEMP/seo-catalog-qa/node_modules" node tools/seo-catalog.test.cjs
          NODE_PATH="$RUNNER_TEMP/seo-catalog-qa/node_modules" node tools/seo-arzhenikov.test.cjs
      - name: Public compatibility routes and actual catalog clicks
        run: |
          npm install --prefix "$RUNNER_TEMP/seo-browser-qa" --no-save --no-package-lock --ignore-scripts playwright@1.62.1
          "$RUNNER_TEMP/seo-browser-qa/node_modules/.bin/playwright" install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/seo-browser-qa/node_modules" node tools/seo-entrypoints.browser.cjs
          NODE_PATH="$RUNNER_TEMP/seo-browser-qa/node_modules" node tools/seo-arzhenikov.browser.cjs
          NODE_PATH="$RUNNER_TEMP/seo-browser-qa/node_modules" node tools/arzhenikov-map.browser.cjs
          node --test tools/arzhenikov-garden.test.cjs
          NODE_PATH="$RUNNER_TEMP/seo-browser-qa/node_modules" node tools/arzhenikov-garden.browser.cjs
          NODE_PATH="$RUNNER_TEMP/seo-browser-qa/node_modules" node tools/arzhenikov-life.browser.cjs
          NODE_PATH="$RUNNER_TEMP/seo-browser-qa/node_modules" node tools/arzhenikov-adventure.browser.cjs
          node --test tools/arzhenikov-harbor.test.cjs
          NODE_PATH="$RUNNER_TEMP/seo-browser-qa/node_modules" node tools/arzhenikov-harbor.browser.cjs
          node --test tools/arzhenikov-discoveries.test.cjs
          python3 tools/arzhenikov-offline.test.py
          python3 tools/build-arzhenikov-offline.py --check
          NODE_PATH="$RUNNER_TEMP/seo-browser-qa/node_modules" node tools/arzhenikov-journeys.browser.cjs
          node --test tools/arzhenikov-courses.test.cjs
          NODE_PATH="$RUNNER_TEMP/seo-browser-qa/node_modules" node tools/arzhenikov-courses.browser.cjs

      - name: Preserve child adventure screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arzhenikov-child-adventure
          path: artifacts/arzhenikov-adventure/
          if-no-files-found: ignore

      - name: Preserve Arzhenikov search entrance screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: seo-arzhenikov-entrance
          path: artifacts/seo-arzhenikov/
          if-no-files-found: ignore

      - name: Preserve sequential course screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arzhenikov-sequential-courses
          path: artifacts/arzhenikov-courses/
          if-no-files-found: ignore

      - name: Course entrances, mathematical GIFs and retained work
        run: |
          python3 -m pip install Pillow==12.0.0
          python3 tools/course-entrances.test.py
          NODE_PATH="$RUNNER_TEMP/seo-browser-qa/node_modules" node tools/course-entrances.browser.cjs
