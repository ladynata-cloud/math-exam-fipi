name: Проверить и собрать задачи Петерсона №200–203, часть 2
on:
  push:
    branches: ['work/peterson6-ratio203-from-9903-20261122']
    paths: ['.github/workflows/peterson6-ratio203-reviewed.yml']
permissions:
  contents: write
jobs:
  verified-course:
    if: github.repository == 'ladynata-cloud/math-exam-fipi' && github.ref == 'refs/heads/work/peterson6-ratio203-from-9903-20261122'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      VERIFIED_BASE: 9903330532094e3dc8a3a948afd2d6945b219c95
      VERIFIED_TREE: a864150bce92bff063a44a93ae5668ee83a37b5d
      OUTPUT_BRANCH: content/peterson6-volume2-proportions-200-203-20261122
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify the reviewed changes, mathematical answers, bank and offline package
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$VERIFIED_BASE"
          cp .github/peterson6-proof/ratio203.patch "$RUNNER_TEMP/ratio203.patch"
          echo 'b29e4afb493b90a8a771c8b59396edc7b5ce5df283af62b8508cf51acfddd5cd  FILE' | sed "s@FILE@$RUNNER_TEMP/ratio203.patch@" | sha256sum -c -
          git checkout --quiet --detach "$VERIFIED_BASE"
          git apply --index "$RUNNER_TEMP/ratio203.patch"
          node school/peterson6/build.cjs
          node school/peterson6/build.cjs --check
          node school/peterson6/test-continuation-content.cjs
          node school/peterson6/test-continuation-math.cjs
          node scripts/build-trainer-downloads.mjs --only=peterson6-math --downloads-only
          git add -- school/peterson6/data.js trainers/board-picker.js downloads/trainers/peterson6-math/peterson6-math.html downloads/trainers/peterson6-math/peterson6-math-package.zip
          test "$(git write-tree)" = "$VERIFIED_TREE"
          git -c user.name='MathExam' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Петерсон, часть 2. Пропорции №200–203 и проверка достаточности данных'
          test "$(git rev-parse HEAD^)" = "$VERIFIED_BASE"
          test -z "$(git ls-remote --heads origin "refs/heads/$OUTPUT_BRANCH")"
          git push origin "HEAD:refs/heads/$OUTPUT_BRANCH"
