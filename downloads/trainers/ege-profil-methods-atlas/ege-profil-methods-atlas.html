<script data-inline-source="/ege-profil/azbuka-metodov/engine.js">
(() => {
  'use strict';

  const storageKey = 'mathexam.profile-alphabets.v1.';
  const normalize = value => String(value).replaceAll('²', '^2').normalize('NFKC').toLowerCase().trim()
    .replace(/[−–—]/g, '-').replace(/[·×*]/g, '').replace(/\s+/g, '')
    .replace(/[\u0430\u0432\u0441\u0435\u043e\u0442\u043c\u043d\u0440\u0445]/g,
      letter => ({ а: 'a', в: 'b', с: 'c', е: 'e', о: 'o', т: 't', м: 'm', н: 'h', р: 'p', х: 'x' })[letter]);

  function fraction(value) {
    const ratio = /^([+-]?\d+)\/([+-]?\d+)$/.exec(value);
    if (ratio) return BigInt(ratio[2]) ? [BigInt(ratio[1]), BigInt(ratio[2])] : null;
    const decimal = /^([+-]?)(\d*)(?:[,.](\d*))?$/.exec(value);
    if (!decimal || !(decimal[2] || decimal[3])) return null;
    const digits = decimal[3] || '';
    return [BigInt(decimal[1] + decimal[2] + digits), 10n ** BigInt(digits.length)];
  }

  function matches(raw, answers) {
    if (typeof raw !== 'string' || raw.length > 120) return false;
    // A typed multiplication sign belongs to algebraic text, not to a number.
    const numeric = value => String(value).normalize('NFKC').replace(/[−–—]/g, '-').trim().replace(/\s*\/\s*/g, '/');
    const input = normalize(raw);
    if (!input) return false;
    const value = fraction(numeric(raw));
    return answers.some(answer => {
      const expected = fraction(numeric(answer));
      return expected ? Boolean(value && value[0] * expected[1] === expected[0] * value[1]) : input === normalize(answer);
    });
  }

  function fresh() {
    return { phase: 0, attempts: [], helped: false, draft: '', events: [], independent: false };
  }

  function create(storage) {
    let available = Boolean(storage);
    const memory = new Map();

    function read(id) {
      if (available) {
        try {
          const raw = storage.getItem(storageKey + id);
          const value = raw && JSON.parse(raw);
          if (value && Number.isInteger(value.phase) && value.phase >= 0 &&
              Array.isArray(value.attempts) && Array.isArray(value.events) &&
              typeof value.draft === 'string' && typeof value.helped === 'boolean' &&
              typeof value.independent === 'boolean') return value;
        } catch {
          available = false;
        }
      }
      return memory.get(id) ?? fresh();
    }

    function save(id, state) {
      memory.set(id, state);
      if (available) {
        try {
          storage.setItem(storageKey + id, JSON.stringify(state));
        } catch {
          available = false;
        }
      }
      return state;
    }

    return { read, save, available: () => available };
  }

  function progress(record, lesson) {
    if (record.independent) return 'verified';
    if (record.phase > lesson.checks.length || record.helped || record.attempts.includes(false)) return 'supported';
    return record.phase || record.draft || record.attempts.length ? 'started' : 'new';
  }

  function question(record, lesson) {
    return record.phase === 0 ? lesson.practice : lesson.checks[record.phase - 1];
  }

  function addEvent(record, type, extra = {}) {
    record.events.push({ type, phase: record.phase, at: new Date().toISOString(), ...extra });
  }

  function check(record, lesson, raw) {
    const current = question(record, lesson);
    if (!current || !raw.trim() || record.attempts.at(-1) === true) return null;
    const correct = matches(raw, current.answers);
    const familiar = record.events.some(event => event.phase === record.phase &&
      ['correct', 'wrong', 'hint'].includes(event.type));
    record.draft = raw;
    record.attempts.push(correct);
    addEvent(record, correct ? 'correct' : 'wrong', { answer: raw, helped: record.helped });
    if (record.phase && correct && !familiar && !record.helped) record.independent = true;
    return correct;
  }

  function hint(record, lesson) {
    if (!question(record, lesson) || record.helped || record.attempts.at(-1) === true) return;
    record.helped = true;
    addEvent(record, 'hint');
  }

  function advance(record, lesson) {
    if (record.attempts.at(-1) !== true) return;
    record.phase = record.phase && record.independent ? lesson.checks.length + 1 : record.phase + 1;
    record.attempts = [];
    record.draft = '';
    record.helped = false;
    addEvent(record, 'advance');
  }

  function restart(record) {
    if (!record.phase) return;
    const reset = { ...fresh(), events: record.events, independent: record.independent, note: record.note };
    addEvent(reset, 'repeat');
    return reset;
  }

  globalThis.ProfileAlphabetEngine = { storageKey, create, matches, progress, question, check, hint, advance, restart };
})();

    let path = '';

    for (let index = -500; index <= 500; index++) {
      const x = index / 100;
      const y = type.value(x);
      if (!Number.isFinite(y) || Math.abs(y) > limit + 0.2) {
        previousX = undefined;
        continue;
      }
      const join = previousX !== undefined && !type.cuts?.some(cut => previousX < cut && cut <= x);
      path += (join ? 'L' : 'M') + xPixel(x).toFixed(2) + ' ' + yPixel(y).toFixed(2);
      previousX = x;
    }
    return '<path class="atlas-curve" d="' + path + '"/>';
  }

  function mount(container, initial = 'mod') {
    container.innerHTML = '<section class="az-panel az-atlas"><h2>Атлас функций</h2>' +
      '<label for="az-atlas-function">Функция</label><select id="az-atlas-function">' +
      entries.map(([id, title]) => '<option value="' + id + '">' + title + '</option>').join('') +
      '</select><label for="az-atlas-level">Уровень y = <output for="az-atlas-level"></output></label>' +
      '<input id="az-atlas-level" type="range" min="-4" max="4" value="2" step="0.5">' +
      '<svg viewBox="0 0 360 345" role="img"></svg><div class="az-atlas-properties"></div>' +
      '<details><summary>Проверить число решений</summary><p class="az-atlas-count"></p></details></section>';
    const select = container.querySelector('select');
    const input = container.querySelector('input');
    const svg = container.querySelector('svg');
    const output = container.querySelector('output');
    const count = container.querySelector('.az-atlas-count');
    const properties = container.querySelector('.az-atlas-properties');
    const disclosure = container.querySelector('details');
    select.value = Object.hasOwn(types, initial) ? initial : 'mod';
    let drawing, markers;

    function refreshLevel() {
      const level = Number(input.value);
      const [, , formula] = entries[select.selectedIndex];
      output.value = format(level);
      svg.setAttribute('aria-label', formula + ' и горизонталь y = ' + format(level) + ' на отрезке от −5 до 5');
      const type = types[select.value];
      // Keep the marked exclusion legible when the horizontal line hits it.
      svg.innerHTML = grid + drawing + line(xPixel(-limit), yPixel(level), xPixel(limit), yPixel(level), 'atlas-level') + markers;
      const solutions = type.count(level);
      count.textContent = 'На всей области определения число решений ' +
        (solutions === Infinity ? 'бесконечно.' : 'равно ' + solutions + '.');
    }

    function refreshFunction() {
      const [key, , formula, domain, range] = entries[select.selectedIndex];
      properties.innerHTML = '<p><strong>' + formula + '</strong></p><p>Допустимые x — ' + domain +
        '.</p><p>Значения y — ' + range + '.</p>';
      const type = types[key];
      drawing = curve(type);
      markers = (type.ends ?? []).map(([x, y, open]) => '<circle class="atlas-point' + (open ? ' atlas-open' : '') +
        '" cx="' + xPixel(x) + '" cy="' + yPixel(y) + '" r="4"/>').join('');
      disclosure.open = false;
      refreshLevel();
    }

    select.addEventListener('change', refreshFunction);
    input.addEventListener('input', () => {
      disclosure.open = false;
      refreshLevel();
    });
    refreshFunction();
  }

  globalThis.ProfileFunctionAtlas = { entries, count: (id, level) => types[id].count(level), mount };
})();

</script>
<script data-inline-source="/ege-profil/azbuka-metodov/parameter-plane.js">
(() => {
  'use strict';

  const xPixel = x => 212 + 118 * x;
  const yPixel = a => 194 - 118 * a;
  const plot = { left: xPixel(-1.5), right: xPixel(0.5), top: yPixel(1.5), bottom: yPixel(-0.5) };
  const format = value => String(value).replace('-', '−').replace('.', ',');
  const lower = x => x ** 2;
  const upper = x => 1 - (x + 1) ** 2;
  const point = (x, a) => `${xPixel(x)} ${yPixel(a)}`;

  function arc(f, from, to) {
    const mid = (from + to) / 2;
    const control = 2 * f(mid) - (f(from) + f(to)) / 2;
    return `Q${point(mid, control)} ${point(to, f(to))}`;
  }

  function sliceAt(a) {
    if (!Number.isFinite(a) || a < 0 || a > 1) return null;
    if (a === 0) return { left: 0, right: 0 };
    // Rationalize √(1 − a) − 1 to keep the right endpoint accurate near a = 0.
    return { left: -Math.sqrt(a), right: -a / (1 + Math.sqrt(1 - a)) };
  }

  function axes() {
    const { left, right, top, bottom } = plot;
    const line = (x1, y1, x2, y2, kind) =>
      `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="${kind}"/>`;
    const vertical = [-1.5, -1, -0.5, 0, 0.5].map(x => {
      const px = xPixel(x);
      return line(px, top, px, bottom, x === 0 ? 'atlas-axis' : 'atlas-grid') +
        (x ? `<text x="${px}" y="${bottom + 16}" text-anchor="middle">${format(x)}</text>` : '');
    }).join('');
    const horizontal = [-0.5, 0, 0.5, 1, 1.5].map(a => {
      const py = yPixel(a);
      return line(left, py, right, py, a === 0 ? 'atlas-axis' : 'atlas-grid') +
        `<text x="${left - 7}" y="${py + 4}" text-anchor="end">${format(a)}</text>`;
    }).join('');
    return vertical + horizontal + `<text x="${right + 9}" y="${yPixel(0) + 4}">x</text>` +
      `<text x="${xPixel(0) + 6}" y="${top - 4}">a</text>`;
  }

  function drawing() {
    const { left, right, top, bottom } = plot;
    return `<defs><clipPath id="parameter-plane-clip"><rect x="${left}" y="${top}" ` +
      `width="${right - left}" height="${bottom - top}"/></clipPath></defs>${axes()}` +
      '<g clip-path="url(#parameter-plane-clip)">' +
      `<path class="plane-area" d="M${point(-1, 1)} ${arc(lower, -1, 0)} ${arc(upper, 0, -1)} Z"/>` +
      `<path class="plane-lower" d="M${point(-1.5, lower(-1.5))} ${arc(lower, -1.5, 0.5)}"/>` +
      `<path class="plane-upper" d="M${point(-1.5, upper(-1.5))} ${arc(upper, -1.5, 0.5)}"/>` +
      `<line x1="${left}" x2="${right}" class="atlas-level" data-plane-level/>` +
      '<g data-plane-slice></g></g>' +
      `<text x="${xPixel(-1.12)}" y="${yPixel(lower(-1.12)) - 7}">1</text>` +
      `<text x="${xPixel(-1.25)}" y="${yPixel(upper(-1.25)) - 8}">2</text>`;
  }

  function mount(container) {
    container.innerHTML = '<div class="az-parameter-plane"><p>Заливка — общая область.</p>' +
      `<svg viewBox="0 0 290 280" role="img">${drawing()}</svg>` +
      '<p class="plane-legend"><span class="plane-lower">1. a ≥ x²</span><span class="plane-upper">2. a ≤ 1 − (x + 1)²</span></p>' +
      '<div class="az-plane-controls"><label for="az-plane-level">Уровень a = <output for="az-plane-level"></output></label>' +
      '<div class="az-plane-buttons"><button type="button" class="az-button secondary" data-plane-exact="0">a = 0</button>' +
      '<button type="button" class="az-button secondary" data-plane-exact="1">a = 1</button></div></div>' +
      '<input id="az-plane-level" type="range" min="-0.5" max="1.5" step="0.05" value="0.5">' +
      '<fieldset><legend>На этом уровне есть решение?</legend><div class="az-plane-buttons">' +
      '<button type="button" class="az-button secondary" aria-pressed="false" data-plane-predict="yes">Есть</button>' +
      '<button type="button" class="az-button secondary" aria-pressed="false" data-plane-predict="no">Нет</button></div></fieldset>' +
      '<p class="az-feedback" role="status" data-plane-feedback></p></div>';
    const svg = container.querySelector('svg');
    const input = container.querySelector('input');
    const output = container.querySelector('output');
    const levelLine = svg.querySelector('[data-plane-level]');
    const segment = svg.querySelector('[data-plane-slice]');
    const feedback = container.querySelector('[data-plane-feedback]');
    const choices = [...container.querySelectorAll('[data-plane-predict]')];
    let a;

    function moveLevel() {
      const next = input.valueAsNumber;
      if (next === a) return;
      a = next;
      const y = yPixel(a);
      output.value = format(a);
      svg.setAttribute('aria-label', `Плоскость (x, a). Две параболы, общая область и горизонталь a = ${format(a)}`);
      levelLine.setAttribute('y1', y);
      levelLine.setAttribute('y2', y);
      segment.replaceChildren();
      feedback.textContent = '';
      feedback.className = 'az-feedback';
      for (const button of choices) button.setAttribute('aria-pressed', 'false');
    }

    function check(button) {
      const slice = sliceAt(a);
      const correct = (button.dataset.planePredict === 'yes') === Boolean(slice);
      const result = !slice ? 'Горизонталь проходит мимо общей области.' : slice.left === slice.right ?
        `Общая точка одна. Подходит x = ${format(slice.left)}.` : 'Горизонталь пересекает общую область по отрезку. Все его x подходят.';
      for (const choice of choices) choice.setAttribute('aria-pressed', String(choice === button));
      feedback.className = 'az-feedback ' + (correct ? 'ok' : 'retry');
      feedback.textContent = (correct ? 'Верно. ' : 'Сверь с рисунком. ') + result;
      if (slice) {
        const left = xPixel(slice.left);
        const right = xPixel(slice.right);
        const y = yPixel(a);
        segment.innerHTML = left === right ? `<circle cx="${left}" cy="${y}" r="4"/>` :
          `<line x1="${left}" x2="${right}" y1="${y}" y2="${y}"/>`;
      }
    }

    input.addEventListener('input', moveLevel);
    for (const button of container.querySelectorAll('[data-plane-exact]')) {
      button.addEventListener('click', () => {
        input.value = button.dataset.planeExact;
        moveLevel();
      });
    }
    for (const button of choices) button.addEventListener('click', () => check(button));
    moveLevel();
  }

  globalThis.ProfileParameterPlane = { sliceAt, mount };
})();

</script>
<script data-inline-source="/ege-profil/azbuka-metodov/app.js">
(() => {
  'use strict';

  const catalog = globalThis.ProfileAlphabetCatalog;
  const lessons = globalThis.ProfileAlphabetLessons;
  const engine = globalThis.ProfileAlphabetEngine;
  const main = document.querySelector('#alphabet-main');
  const site = main.dataset.mathSite || '';
  const base = location.protocol === 'file:' ? new URL(location.pathname, location.href).href : location.pathname;
  let storage;
  try { storage = localStorage; } catch { /* The page can still be used for the current session. */ }
  const store = engine.create(storage);
  const params = new URLSearchParams(location.search);
  const context = catalog.readContext(params);
  const number = context.number;
  const contextLabel = context.kind !== 'legacy' && context.entry ? globalThis.ProfileExamMap.label(context.entry) : catalog.displayLabel(number);
  const back = catalog.safeBack(params.get('back'));
  const inCabinet = Boolean(site);
  const teacher = inCabinet && params.get('mode') === 'teacher';
  const keyFor = (alphabetId, skillId) => (teacher ? 'teacher/' : '') + alphabetId + '/' + skillId;
  const status = {
    new: 'Можно начать', started: 'В работе', supported: 'Нужна новая проверка',
    verified: 'Самостоятельно'
  };
  const escape = value => String(value ?? '').replace(/[&<>"']/g, letter =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[letter]);
  const linkTo = (id, skill) => {
    const url = new URL(catalog.href(id, skill, context, back, base), location.href);
    if (teacher) url.searchParams.set('mode', 'teacher');
    return url.protocol === 'file:' ? url.href : url.pathname + url.search + url.hash;
  };
  const examLink = n => site + catalog.examHref(n);
  const labels = { wrong: 'Ошибка', hint: 'Подсказка', correct: 'Верно', repeat: 'Начато повторение' };
  const date = new Intl.DateTimeFormat('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  const parameterGraphs = {
    plateau: {
      lesson: 'param-modules', title: 'Горизонтальный участок',
      prompt: 'Поставьте горизонталь ниже участка, на его уровне и выше. Каждый раз сначала назовите число решений, затем откройте проверку.',
      hints: ['Сравните уровень горизонтали с высотой участка. Включать ли саму границу?',
        'При совпадении горизонтали с участком проверьте, какие его точки удовлетворяют уравнению.']
    },
    hole: {
      lesson: 'param-hole', title: 'Выколотая точка',
      prompt: 'Переместите горизонталь через выколотую точку и чуть выше. Предскажите, сколько пересечений в каждом случае, затем откройте проверку.',
      hints: ['В своём условии выразите x через a и найдите, при каком уровне кандидат равен нулю.',
        'Возьмите запрещённый x из исходного знаменателя и найдите соответствующий уровень горизонтали.']
    }
  };

  function statusOf(alphabetId, skillId) {
    const lesson = lessons[alphabetId][skillId];
    return engine.progress(store.read(keyFor(alphabetId, skillId)), lesson);
  }

  function returnLinks(alphabet) {
    const selected = alphabet?.numbers.includes(number) ? number : null;
    const returnLink = back ? '<a class="az-button secondary" href="' + escape(site + back) + '">Вернуться к исходному заданию</a>' :
      selected ? '<a class="az-button secondary" href="' + examLink(selected) + '">Вернуться: ' + catalog.displayLabel(selected) + '</a>' : '';
    return '<nav class="az-navigation" aria-label="Навигация по теме">' +
      '<a href="' + escape(linkTo('')) + '">← К списку тем</a>' +
      (alphabet && location.hash.split('/').length === 3 ? '<a href="' + escape(linkTo(alphabet.id)) + '">К навыкам темы</a>' : '') +
      returnLink + '</nav>';
  }

  function modeLink(alphabet, id) {
    if (!inCabinet) return '';
    const query = new URLSearchParams(params);
    if (teacher) query.delete('mode');
    else query.set('mode', 'teacher');
    const href = base + (query.size ? '?' + query : '') + '#/' + alphabet.id + '/' + id;
    return '<a class="az-button secondary" href="' + escape(href) + '">' +
      (teacher ? 'Самостоятельно' : 'Разобрать с преподавателем') + '</a>';
  }

  function resources(alphabet) {
    return '<section class="az-panel az-resources"><h2>Подготовка к экзамену и дополнительные темы</h2><div class="az-numbers">' +
      alphabet.numbers.map(n => '<a href="' + examLink(n) + '">' + catalog.displayLabel(n) + '</a>').join('') +
      '</div><h2>Материалы MathExam</h2><ul>' +
      alphabet.refs.map(([label, url]) => '<li><a href="' + site + url + '">' + label + '</a></li>').join('') +
      '</ul></section>';
  }

  function routeStart(alphabet, ids) {
    const available = ids.map(id => {
      const record = store.read(keyFor(alphabet.id, id));
      return { id, record };
    }).filter(({ id, record }) => engine.question(record, lessons[alphabet.id][id]));
    return available.find(({ record }) => record.phase || record.attempts.length || record.draft || record.helped)?.id ??
      available.find(({ record }) => !record.independent)?.id ?? ids[0];
  }

  function routeContinuation(alphabet, current) {
    if (!alphabet.route) return '';
    const ids = Object.keys(alphabet.skills);
    const nextId = ids[ids.indexOf(current) + 1];
    const target = nextId ? linkTo(alphabet.id, nextId) : alphabet.next ?
      linkTo(alphabet.next) : examLink(alphabet.numbers[0]);
    const label = nextId ? 'Следующий шаг' : alphabet.next ? 'К методам решения задач с параметром' :
      'К подготовке: ' + catalog.displayLabel(alphabet.numbers[0]);
    return '<a class="az-button primary" href="' + escape(target) + '">' + label + '</a>';
  }

  function renderCatalog() {
    const selected = catalog.forNumber(number);
    const title = selected.length ? context.entry?.number == null ? 'Основы: ' + (context.entry?.title || contextLabel) : 'Основы для ' + contextLabel : 'Основы и методы';
    main.innerHTML = (selected.length ? '<nav class="az-navigation" aria-label="Навигация по теме"><a href="' +
      escape(base) + '">← Все темы</a><a class="az-button secondary" href="' + examLink(number) + '">К подготовке: ' +
      contextLabel + '</a></nav>' : '') + '<p class="az-kicker">ЕГЭ профиль · 2027</p><h1>' + title + '</h1>' +
      '<p class="az-lead">Разбери один приём, проверь себя на другом примере и переходи к задачам ЕГЭ.</p>' +
      '<div class="az-catalog">' + (selected.length ? selected : catalog.list).map(alphabet => {
        const total = Object.keys(alphabet.skills).length;
        const count = Object.keys(alphabet.skills).filter(id => statusOf(alphabet.id, id) === 'verified').length;
        return '<a class="az-panel az-card" href="' + escape(linkTo(alphabet.id)) + '"><span class="az-kicker">' +
          alphabet.numbers.map(catalog.displayLabel).join(' · ') + '</span><h2>' + alphabet.title + '</h2><p>' +
          alphabet.description + '</p><span class="az-count">Самостоятельно: ' + count + ' из ' + total + '</span></a>';
      }).join('') + '</div>';
  }

  function skillList(alphabet, current) {
    const entries = Object.entries(alphabet.skills);
    const relevant = entries.filter(([, skill]) => skill.numbers.includes(number));
    const items = [...relevant, ...entries.filter(entry => !entry[1].numbers.includes(number))];
    return '<section class="az-panel az-skill-list"><h2>Карта навыков</h2><ul>' +
      items.map(([id, skill]) => {
        const state = statusOf(alphabet.id, id);
        return '<li><a href="' + escape(linkTo(alphabet.id, id)) + '"' + (id === current ? ' aria-current="page"' : '') +
        '><strong>' + skill.title + '</strong><span class="az-status az-' + state + '">' + status[state] + '</span></a></li>';
      }).join('') + '</ul></section>';
  }

  function journal(record) {
    const entries = record.events.filter(event => Object.hasOwn(labels, event.type));
    if (!entries.length) return '';
    return '<details class="az-panel az-history"><summary>Журнал попыток</summary><ol>' +
      [...entries].reverse().map(event => {
        const time = new Date(event.at);
        return '<li><span>' + (Number.isFinite(+time) ? date.format(time) + ' · ' : '') + labels[event.type] +
          (event.answer ? ' · ' + escape(event.answer) : '') + (event.helped ? ' · с подсказкой' : '') + '</span></li>';
      }).join('') + '</ol></details>';
  }

  function exerciseMarkup(record, lesson, alphabet, id) {
    const current = engine.question(record, lesson);
    if (!current) {
      return '<section class="az-panel az-exercise"><h2>' +
        (record.independent ? 'Самостоятельная проверка пройдена' : 'Тренировка завершена') + '</h2><p>' +
        (record.independent ? 'Ключевой шаг получился на отдельном условии с первой попытки без подсказки.' :
          'В проверке были ошибки или подсказки. К навыку можно вернуться и потренироваться ещё.') +
        '</p><div class="az-actions">' + routeContinuation(alphabet, id) +
        '<button class="az-button secondary" type="button" data-restart>Повторить навык</button></div></section>';
    }
    const solved = record.attempts.at(-1) === true;
    const stage = record.phase ? (teacher ? 'Проверка после разбора' : 'Самопроверка') : (teacher ? 'Шаг для урока' : 'Учебный шаг');
    const diagram = current.diagram === 'parameter-plane' ?
      '<div data-parameter-plane><p>Общая область лежит между a ≥ x² и a ≤ 1 − (x + 1)².</p></div>' :
      globalThis.ProfileAlphabetDiagram(current.diagram);
    const support = !record.phase ? '<details class="az-support"><summary>Правило и пример</summary><p>' +
      lesson.rule + '</p><p>' + lesson.example + '</p></details>' : '';
    const message = solved ? 'Верно. ' + current.explanation : record.attempts.includes(false) ?
      'Пока не сходится. ' + (record.attempts.length >= 2 ? 'Можно открыть подсказку.' : 'Сверь запись с условием.') : '';
    return '<section class="az-panel az-exercise" aria-label="' + stage + '"><p class="az-kicker">' + stage + '</p>' +
      '<h2 id="az-question" tabindex="-1">' + current.prompt + '</h2>' + diagram +
      '<form id="az-form" novalidate><label for="az-answer">' + current.label + '</label>' +
      '<input id="az-answer" name="answer" type="text" maxlength="120" autocomplete="off" spellcheck="false" value="' +
      escape(record.draft) + '"' + (solved ? ' readonly' : '') + ' aria-describedby="az-feedback">' +
      '<p id="az-feedback" role="status" class="az-feedback ' + (solved ? 'ok' : message ? 'retry' : '') + '">' + message + '</p>' +
      (record.helped && !solved ? '<p class="az-hint">' + current.hint + '</p>' : '') +
      '<div class="az-actions">' + (solved ? '<button class="az-button primary" type="button" data-advance>' +
        (record.phase ? record.independent || record.phase === lesson.checks.length ? 'Завершить' : 'Решить другое условие' : 'Проверить себя на новом условии') +
        '</button>' : '<button class="az-button primary" type="submit">Проверить</button>' +
        (record.helped ? '' : '<button class="az-button secondary" type="button" data-hint>Подсказка</button>')) +
      '</div></form>' + support + '</section>';
  }

  function renderSkill(alphabet, id, previousPlane) {
    const lesson = lessons[alphabet.id][id];
    const key = keyFor(alphabet.id, id);
    const record = store.read(key);
    main.innerHTML = returnLinks(alphabet) + '<p class="az-kicker">' + alphabet.short + '</p><h1' +
      (lesson.reasoning ? ' class="az-skill-heading"' : '') + '>' +
      alphabet.skills[id].title + '</h1><div class="az-grid"><div class="az-work">' +
      exerciseMarkup(record, lesson, alphabet, id) + (teacher || alphabet.id === 'written-solution' || lesson.reasoning ?
        '<section class="az-panel az-notes"><h2>' + (lesson.reasoning ? 'Черновик обоснований' : 'Запиши обоснование') + '</h2><label for="az-note">' +
        (lesson.reasoning?.[Math.min(record.phase, lesson.checks.length)] ||
          'Запиши свой ход рассуждений. Затем сверь существенный шаг с разбором.') + '</label>' +
        '<textarea id="az-note" maxlength="4000">' + escape(record.note) + '</textarea><p>Запись сохраняется в браузере. Полное доказательство можно проверить с преподавателем.</p></section>' : '') +
      journal(record) + '</div><aside class="az-aside">' +
      modeLink(alphabet, id) + skillList(alphabet, id) + resources(alphabet) + '</aside></div>';
    const form = main.querySelector('#az-form');
    const input = main.querySelector('#az-answer');
    const planePlaceholder = main.querySelector('[data-parameter-plane]');
    const plane = planePlaceholder && (previousPlane || planePlaceholder);
    if (planePlaceholder && previousPlane) planePlaceholder.replaceWith(previousPlane);
    else if (plane) globalThis.ProfileParameterPlane?.mount(plane);

    function update(change, focus) {
      const latest = store.read(key);
      if (latest.phase === record.phase) {
        store.save(key, change(latest) ?? latest);
      }
      const open = main.querySelector('.az-support')?.open;
      renderSkill(alphabet, id, plane);
      const detail = main.querySelector('.az-support');
      if (detail && open) detail.open = true;
      main.querySelector(focus)?.focus({ preventScroll: true });
      updateStorageMessage();
    }

    input?.addEventListener('input', () => {
      const latest = store.read(key);
      if (latest.phase !== record.phase || latest.attempts.at(-1) === true) return;
      latest.draft = input.value;
      store.save(key, latest);
      updateStorageMessage();
    });
    main.querySelector('#az-note')?.addEventListener('input', event => {
      const latest = store.read(key);
      latest.note = event.target.value;
      store.save(key, latest);
      updateStorageMessage();
    });
    form?.addEventListener('submit', event => {
      event.preventDefault();
      const value = input.value.trim();
      if (!value) {
        const feedback = main.querySelector('#az-feedback');
        feedback.className = 'az-feedback retry';
        feedback.textContent = 'Введи ответ, чтобы проверить шаг.';
        input.focus();
        return;
      }
      const correct = engine.matches(value, engine.question(record, lesson).answers);
      update(latest => { engine.check(latest, lesson, value); }, correct ? '[data-advance]' : '#az-answer');
    });
    main.querySelector('[data-hint]')?.addEventListener('click', () => {
      update(latest => engine.hint(latest, lesson), '#az-answer');
    });
    main.querySelector('[data-advance]')?.addEventListener('click', () => {
      update(latest => engine.advance(latest, lesson), '#az-question, [data-restart]');
    });
    main.querySelector('[data-restart]')?.addEventListener('click', () => {
      update(engine.restart, '#az-question');
    });
  }

  function updateStorageMessage() {
    document.querySelector('#az-storage').hidden = store.available();
  }

  function renderParameterGraph() {
    const key = params.get('graph');
    if (inCabinet || number !== 19 || !back || !Object.hasOwn(parameterGraphs, key) || !globalThis.ProfileFunctionAtlas) return false;
    const graph = parameterGraphs[key];
    const target = new URL(back, location.href);
    if (!['/ege-profil/part-two/', '/ege-profil/part-two/index.html'].includes(target.pathname)) return false;
    const task = new RegExp('^#task/' + graph.lesson + '-[456]/independent$').test(target.hash);
    if (!task && target.hash !== '#lesson/' + graph.lesson) return false;
    const help = params.get('help');
    const assisted = task && ['1', '2', '12'].includes(help);
    const tips = assisted ? '<p class="az-hint">' + [...help].map(field => graph.hints[Number(field) - 1]).join(' ') + '</p>' : '';
    const label = assisted ? 'Вернуться к своему условию' : task ? 'К самостоятельному условию' : 'К условиям темы';
    main.innerHTML = '<nav class="az-navigation" aria-label="Навигация по теме"><a href="' + examLink(19) +
      '">← Задачи №18</a></nav><h1>' + graph.title + '</h1><p class="az-lead">' + graph.prompt + '</p>' +
      tips + '<div data-az-atlas></div><div class="az-actions"><a class="az-button primary" href="' + escape(back) +
      '">' + label + '</a><a href="' + escape(catalog.href('function-atlas', '', 19)) + '">Полный атлас функций</a></div>';
    globalThis.ProfileFunctionAtlas.mount(main.querySelector('[data-az-atlas]'), key);
    return true;
  }

  function renderRoute(alphabet) {
    if (alphabet.atlas && renderParameterGraph()) return;
    const nav = alphabet.route ? (() => {
      const ids = Object.keys(alphabet.skills);
      const done = ids.filter(id => statusOf(alphabet.id, id) === 'verified').length;
      const id = routeStart(alphabet, ids);
      const records = ids.map(skill => store.read(keyFor(alphabet.id, skill)));
      const inProgress = records.some(record => record.draft || record.attempts.length || record.helped);
      const label = done === ids.length && !inProgress ? 'Повторить маршрут' :
        ids.some(skill => statusOf(alphabet.id, skill) !== 'new') ? 'Продолжить маршрут' : 'Начать маршрут';
      return '<div class="az-actions"><a class="az-button primary" href="' + escape(linkTo(alphabet.id, id)) + '">' +
        label + '</a><span class="az-count">Самостоятельно: ' + done + ' из ' + ids.length + '</span></div>';
    })() : '';
    const atlas = alphabet.atlas ? '<div data-az-atlas></div>' : '';
    main.innerHTML = returnLinks(alphabet) + '<p class="az-kicker">ЕГЭ профиль · 2027</p><h1>' +
      alphabet.title + '</h1><p class="az-lead">' + alphabet.description + '</p>' + nav + atlas + '<div class="az-grid">' +
      skillList(alphabet) + resources(alphabet) + '</div>';
    if (alphabet.atlas) globalThis.ProfileFunctionAtlas?.mount(main.querySelector('[data-az-atlas]'));
  }

  function render() {
    const [id, skill] = location.hash.replace(/^#\/?/, '').split('/');
    const alphabet = Object.hasOwn(catalog.index, id) ? catalog.index[id] : null;
    if (!alphabet) renderCatalog();
    else if (Object.hasOwn(alphabet.skills, skill)) renderSkill(alphabet, skill);
    else renderRoute(alphabet);
    updateStorageMessage();
    document.title = main.querySelector('h1').textContent + ' · MathExam';
  }

  addEventListener('hashchange', () => {
    render();
    scrollTo(0, 0);
    main.focus({ preventScroll: true });
  });
  addEventListener('pageshow', event => { if (event.persisted) render(); });
  render();
})();

</script>
</body>
</html>
