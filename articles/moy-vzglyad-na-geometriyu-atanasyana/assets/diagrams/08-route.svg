<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 590" role="img" aria-labelledby="title desc"><title id="title">Маршрут по геометрии с возвратом к вычислениям</title><desc id="desc">Читаем чертёж, работаем с углами, сравниваем треугольники, изучаем равнобедренный треугольник. При затруднении возвращаемся к одному вычислительному навыку и затем к задаче.</desc><style>text{font-family:Arial,sans-serif;fill:#213f49;font-size:22px}.label{font-size:23px;font-style:italic}.small{font-size:18px;fill:#617579}.head{font-size:21px;font-weight:700}.line{fill:none;stroke:#213f49;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.teal{fill:none;stroke:#16746b;stroke-width:3;stroke-linecap:round}.red{fill:none;stroke:#bd654c;stroke-width:3;stroke-linecap:round}.gold{fill:none;stroke:#aa7623;stroke-width:3;stroke-linecap:round}.thin{fill:none;stroke:#617579;stroke-width:2}.dashed{stroke-dasharray:7 7}</style><rect width="900" height="590" rx="18" fill="#f5f6ef"/><path class="thin" d="M280 80 V510"/><rect x="45" y="35" width="475" height="78" rx="15" fill="#dfebe4"/><text class="head" x="70" y="69">1. Читаю чертёж</text><text class="small" x="70" y="98">точки · отрезки · обозначения</text><rect x="45" y="160" width="475" height="78" rx="15" fill="#dfebe4"/><text class="head" x="70" y="194">2. Работаю с углами</text><text class="small" x="70" y="223">части · биссектриса · смежные углы</text><rect x="45" y="285" width="475" height="78" rx="15" fill="#dfebe4"/><text class="head" x="70" y="319">3. Сравниваю треугольники</text><text class="small" x="70" y="348">соответствие · первый признак</text><rect x="45" y="410" width="475" height="90" rx="15" fill="#dfebe4"/><text class="head" x="70" y="446">4. Доказываю свойства</text><text class="small" x="70" y="479">равнобедренный треугольник</text><path class="gold dashed" d="M520 198 H620 V276 M620 345 V387 H548 V215 H520"/><rect x="583" y="260" width="277" height="95" rx="15" fill="#f2e6cf"/><text class="head" x="605" y="294">Нужна помощь?</text><text class="small" x="605" y="324">Один навык вычисления</text><text class="small" x="607" y="405">Затем — к той же задаче</text><text class="small" x="45" y="554">На каждом шаге: объяснение, действие, самостоятельная задача.</text></svg>