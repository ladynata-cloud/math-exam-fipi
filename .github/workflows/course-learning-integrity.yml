name: Course learning integrity
on:
  pull_request:
    paths:
      - 'courses/catalog.*'
      - 'courses/index.html'
      - 'school/alimov10-11/**'
      - 'school/nikolsky10/**'
      - 'tools/course-catalog.test.cjs'
      - 'tools/course-learning-integrity.browser.cjs'
      - '.github/workflows/course-learning-integrity.yml'
  push:
    branches: [main]
    paths:
      - 'courses/catalog.*'
      - 'courses/index.html'
      - 'school/alimov10-11/**'
      - 'school/nikolsky10/**'
      - 'tools/course-catalog.test.cjs'
      - 'tools/course-learning-integrity.browser.cjs'
      - '.github/workflows/course-learning-integrity.yml'
permissions:
  contents: read
jobs:
  catalogue-and-retained-answers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - name: Install pinned test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/course-integrity" --no-save --no-package-lock --ignore-scripts jsdom@26.1.0 playwright@1.62.1
          echo "NODE_PATH=$RUNNER_TEMP/course-integrity/node_modules" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/course-integrity/node_modules/.bin/playwright" install --with-deps chromium
      - name: Search and saved answer browser regressions
        run: |
          node --test tools/course-catalog.test.cjs
          node tools/course-learning-integrity.browser.cjs
          git diff --check
