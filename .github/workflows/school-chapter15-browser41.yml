name: Verify every newly included plane geometry exercise at both widths
on:
  push:
    branches: [work/school-chapter15-browser41-20261122]
    paths: ['.github/workflows/school-chapter15-browser41.yml']
permissions:
  contents: read
jobs:
  exact-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    strategy:
      fail-fast: false
      matrix:
        portion: [1, 2]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: bb71359949a076ef5d605db51c8a688ff39a532e
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install the browser and verify the exact release tree
        run: |
          test "$(git rev-parse HEAD)" = "bb71359949a076ef5d605db51c8a688ff39a532e"
          test "$(git rev-parse 'HEAD^{tree}')" = "92a1eb6fbceb156df163d3e39e369d17999d8978"
          npm install --prefix "$RUNNER_TEMP/plane-qa" --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/plane-qa/node_modules/.bin/playwright" install --with-deps chromium
      - name: Run the complete native lesson scenarios for all newly connected models
        env:
          NODE_PATH: ${{ runner.temp }}/plane-qa/node_modules
          AREA_SHARD_INDEX: ${{ matrix.portion }}
          AREA_SHARD_COUNT: 2
          AREA_COVERAGE_DIR: ${{ runner.temp }}/exercise-coverage
        run: |
          node --input-type=commonjs <<'JS'
          const fs=require('node:fs'),path=require('node:path'),assert=require('node:assert/strict'),Module=require('node:module');
          const filename=path.resolve('tools/geometry-textbook/area-lessons.browser.cjs');
          const targets=["1296","1297","1300","1302","1304","1305","1306","1308","1311-1","1311-2","1311-3","1311-4","1312-1","1312-2","1312-3","t133","t134","t135","1309-1","1309-2","1310-1","1310-2","1307-1","1307-2","1303-1","1303-2","1303-3","1303-4","1303-5","1303-6","1299-1","1299-2","1299-3","1301-1","1301-2","1301-3","t130","t131","t132","1298-1","1298-2"];
          assert.equal(new Set(targets).size,41);
          const text=fs.readFileSync(filename,'utf8'),declaration=' const lessons=Object.entries(',branch=" if(process.argv[2]==='--matrix'){";
          assert.equal(text.split(declaration).length,2);assert.equal(text.split(branch).length,2);
          const limit=" const targets=new Set("+JSON.stringify(targets)+"); const lessons=allLessons.filter(([key])=>targets.has(key)); assert.equal(allLessons.length,973); assert.equal(lessons.length,41);\n";
          const body=text.replace(declaration,' const allLessons=Object.entries(').replace(branch,limit+branch);
          const native=new Module(filename,module);native.filename=filename;native.paths=Module._nodeModulePaths(path.dirname(filename));native._compile(body,filename);
          JS
          node --input-type=commonjs <<'JS'
          const fs=require('node:fs'),path=require('node:path'),assert=require('node:assert/strict');
          const n=Number(process.env.AREA_SHARD_INDEX),expected=n===1?42:40;
          const report=JSON.parse(fs.readFileSync(path.join(process.env.AREA_COVERAGE_DIR,'practice-'+n+'.json')));
          assert.equal(report.count,2);assert.equal(report.shard,n);assert.equal(report.completed.length,expected);assert.equal(new Set(report.completed).size,expected);
          for(const width of [320,1280])assert.equal(report.completed.filter(key=>key.startsWith(width+'/')).length,expected/2);
          console.log('Completed '+expected+' native Chromium lesson/width checks, including both 320px and 1280px.');
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chapter15-learning-coverage-${{ matrix.portion }}
          path: ${{ runner.temp }}/exercise-coverage
          if-no-files-found: error
          retention-days: 14
  classrooms:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: bb71359949a076ef5d605db51c8a688ff39a532e
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Verify the integrated tree and install the locked local server and browser
        id: install
        run: |
          test "$(git rev-parse HEAD)" = "bb71359949a076ef5d605db51c8a688ff39a532e"
          test "$(git rev-parse 'HEAD^{tree}')" = "92a1eb6fbceb156df163d3e39e369d17999d8978"
          npm ci --prefix board-server --include=optional
          npm install --prefix "$RUNNER_TEMP/classroom-qa" --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.62.1 jsdom@26.1.0
          "$RUNNER_TEMP/classroom-qa/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/classroom-qa/node_modules" >> "$GITHUB_ENV"
      - name: Peterson numbered book and independent workshop with teacher and pupil
        run: node tools/peterson6-complete-board.browser.cjs
      - name: Both Vilenkin volumes with restored teacher and pupil sessions
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node school/test-vilenkin5-board.browser.cjs
