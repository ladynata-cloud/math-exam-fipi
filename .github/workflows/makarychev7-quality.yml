name: Makarychev 7 course quality
on:
  pull_request:
    paths:
      - 'school/makarychev7/**'
      - 'school/peterson6/math.js'
      - '.github/workflows/makarychev7-quality.yml'
  push:
    branches: [main]
    paths:
      - 'school/makarychev7/**'
      - 'school/peterson6/math.js'
permissions:
  contents: read
jobs:
  course:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build, syntax and mathematical contracts
        run: |
          node school/makarychev7/build.cjs
          git diff --exit-code -- school/makarychev7/data.js
          node --check school/makarychev7/app.js
          node --check school/makarychev7/check.js
          node --check school/makarychev7/models.js
          node school/makarychev7/test-course.cjs
          node school/makarychev7/test-models.cjs
          node school/makarychev7/test-state.cjs
          git diff --check
      - name: Isolated DOM test dependency
        run: npm install --prefix "$RUNNER_TEMP/makarychev-qa" --no-audit --no-fund --ignore-scripts jsdom@26.1.0
      - name: Every worked solution and saved-work journey
        run: |
          NODE_PATH="$RUNNER_TEMP/makarychev-qa/node_modules" node school/makarychev7/test-models.cjs --dom
          NODE_PATH="$RUNNER_TEMP/makarychev-qa/node_modules" node school/makarychev7/test-ui.cjs
          NODE_PATH="$RUNNER_TEMP/makarychev-qa/node_modules" node school/makarychev7/test-import.cjs
