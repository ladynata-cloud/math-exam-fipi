<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img"><title>Необходимое и достаточное</title><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#2B57C4"/></marker></defs><rect width="1200" height="700" fill="#FCFCF9"/><text x="60" y="58" text-anchor="start" style="font-size:36px;font-weight:700;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="60" dy="0">Необходимое и достаточное</tspan></text><text x="60" y="94" text-anchor="start" style="font-size:20px;font-weight:400;fill:#5A6B87;font-family:Arial,Segoe UI,sans-serif;"><tspan x="60" dy="0">Язык, который делает признаки и свойства симметричной системой</tspan></text><rect x="110" y="185" width="360" height="120" rx="18" fill="#DCE7FF" stroke="#2B57C4" stroke-width="3"/><text x="290" y="235" text-anchor="middle" style="font-size:35px;font-weight:700;fill:#2B57C4;font-family:Arial,Segoe UI,sans-serif;"><tspan x="290" dy="0">A</tspan></text><text x="290" y="275" text-anchor="middle" style="font-size:20px;font-weight:400;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="290" dy="0">фигура обладает свойством</tspan></text><rect x="730" y="185" width="360" height="120" rx="18" fill="#DDEFE5" stroke="#2E7D4F" stroke-width="3"/><text x="910" y="235" text-anchor="middle" style="font-size:35px;font-weight:700;fill:#2E7D4F;font-family:Arial,Segoe UI,sans-serif;"><tspan x="910" dy="0">B</tspan></text><text x="910" y="275" text-anchor="middle" style="font-size:20px;font-weight:400;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="910" dy="0">получаем заключение</tspan></text><line x1="480" y1="230" x2="720" y2="230" stroke="#2B57C4" stroke-width="5" marker-end="url(#arrow)"/><text x="600" y="210" text-anchor="middle" style="font-size:18px;font-weight:700;fill:#2B57C4;font-family:Arial,Segoe UI,sans-serif;"><tspan x="600" dy="0">прямая теорема</tspan></text><line x1="720" y1="280" x2="480" y2="280" stroke="#2E7D4F" stroke-width="5" marker-end="url(#arrow)"/><text x="600" y="315" text-anchor="middle" style="font-size:18px;font-weight:700;fill:#2E7D4F;font-family:Arial,Segoe UI,sans-serif;"><tspan x="600" dy="0">обратная теорема</tspan></text><rect x="230" y="400" width="740" height="125" rx="18" fill="#FFFFFF" stroke="#C24A4A" stroke-width="3"/><text x="600" y="445" text-anchor="middle" style="font-size:26px;font-weight:700;fill:#C24A4A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="600" dy="0">A необходимо и достаточно для B</tspan></text><text x="600" y="487" text-anchor="middle" style="font-size:20px;font-weight:400;fill:#22304A;font-family:Arial,Segoe UI,sans-serif;"><tspan x="600" dy="0">только когда доказаны оба направления: A → B и B → A</tspan></text><text x="1162" y="676" text-anchor="end" style="font-size:16px;font-weight:400;fill:#5A6B87;font-family:Arial,Segoe UI,sans-serif;"><tspan x="1162" dy="0">Схема: Н. М. Алябьева · MathExam</tspan></text></svg>