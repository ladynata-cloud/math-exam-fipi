    if(selectedRegion!==null&&markRoots.length===2){const ends=[min,markRoots[0],markRoots[1],max];svg.appendChild(svgEl('line',{x1:px(ends[selectedRegion]),x2:px(ends[selectedRegion+1]),y1:lineY,y2:lineY,stroke:'#cfe3cb','stroke-width':18,'data-active-region':selectedRegion}));}
    svg.appendChild(svgEl('line',{x1:18,y1:lineY,x2:304,y2:lineY,stroke:'#637369','stroke-width':2}));
    svg.appendChild(svgEl('line',{x1:px(x),x2:px(x),y1:lineY-12,y2:lineY+12,stroke:'#b26e20','stroke-width':3}));
    labels.forEach(({value,label,included})=>{if(value<min||value>max)return;if(included===undefined)svg.appendChild(svgEl('line',{x1:px(value),x2:px(value),y1:lineY-7,y2:lineY+7,stroke:'#637369','stroke-width':2,'data-boundary-value':value,'data-boundary-included':'unexplored'}));else svg.appendChild(svgEl('circle',{cx:px(value),cy:lineY,r:5,fill:included?'#216342':'#fff',stroke:'#637369','stroke-width':2,'data-boundary-value':value,'data-boundary-included':String(included)}));svgFraction(svg,px(value),266,label);});
    svg.dataset.axisY=axisY;svg.dataset.probeScreenY=py(sampleY);svg.dataset.probeScreenX=px(x);
  }
  function probeControls(box,range,getConfig,onChange) {
    const label=el('label',undefined,'t13-probe-label');label.appendChild(el('span','Двигай точку x по оси:'));
    const input=el('input');input.type='range';input.min='0';input.max='200';input.step='1';input.dataset.labAction='probe';input.setAttribute('aria-label','Положение точки x');
    const output=el('div',undefined,'t13-math');output.dataset.probeReadout='';label.append(input,output);box.appendChild(label);
    const svg=svgEl('svg',{viewBox:'0 0 320 300',class:'t13-plot',role:'img','aria-label':'Парабола и точка на числовой прямой','data-lab-plot':''});box.appendChild(svg);
    const fromPosition=p=>Number((range.min+(range.max-range.min)*Math.min(200,Math.max(0,p))/200).toFixed(3));
    input.addEventListener('input',()=>onChange(fromPosition(Number(input.value))));
    let drag=null;
    svg.ogeSetProbe=value=>onChange(value);svg.ogeProbeRange=[range.min,range.max];svg.ogeProbeRollback=true;
    const pointerChange=value=>{if(window.OgeCourseSharedMode&&!svg.dispatchEvent(new CustomEvent('oge13:probe',{bubbles:true,cancelable:true,detail:{value}})))return;onChange(value);};
    const pointerX=e=>{const r=svg.getBoundingClientRect();if(!r.width)return null;const px=(e.clientX-r.left)/r.width*320;return fromPosition((px-24)/272*200);};
    svg.addEventListener('pointerdown',e=>{if(e.button!==undefined&&e.button!==0)return;const v=pointerX(e);if(v===null)return;drag={id:e.pointerId,start:getConfig()};try{svg.setPointerCapture(e.pointerId);}catch{}pointerChange(v);e.preventDefault();});
    svg.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;const v=pointerX(e);if(v!==null)pointerChange(v);e.preventDefault();});
    svg.addEventListener('pointerup',e=>{if(!drag||drag.id!==e.pointerId)return;drag=null;try{svg.releasePointerCapture(e.pointerId);}catch{}});
    svg.addEventListener('pointercancel',e=>{if(!drag||drag.id!==e.pointerId)return;const old=drag.start;drag=null;onChange(old.x,old.label);});
    return {input,svg,output,update(x,labelText){input.value=String(Math.round((x-range.min)/(range.max-range.min)*200));input.setAttribute('aria-valuetext','x = '+String(labelText||number(x)));output.innerHTML='x = '+math(labelText||number(x));}};
  }
  return {el,svgEl,math,number,valueHTML,condition,signChar,parseCandidate,roots,evalPoly,graphMembership,root,button,details,status,plot,probeControls};
})();

function makeTask13QuadLab(t,index) {
  const C=T13C,box=C.root('quad');box.dataset.prototype=String(index);
  box.appendChild(C.el('p','Двигай точку по оси x. Следи: точка на параболе выше оси или ниже?'));
  const sides=t.e.split(/\s*[<>≤≥]\s*/),expression=sides[1]==='0'?sides[0]:sides[0]+' − '+sides[1];
  const expressionLine=C.el('p',undefined,'t13-math');expressionLine.innerHTML='Исследуем: '+C.math(expression)+'.';box.appendChild(expressionLine);
  const span=t.r2-t.r1,range={min:t.r1-span*.4,max:t.r2+span*.4};
  let x=(t.r1+t.r2)/2,xLabel=null,region=1;const signs=[null,null,null],includedRoots=[undefined,undefined];
  const fn=v=>t.a*(v-t.r1)*(v-t.r2);
  const controls=C.probeControls(box,range,()=>({x,label:xLabel}),setX);
  const regionRow=C.el('div',undefined,'t13-lab-row');
  ['Левее корней','Между корнями','Правее корней'].forEach((label,i)=>regionRow.appendChild(C.button(label,'region',()=>{region=i;setX(i===0?t.r1-span*.2:i===1?(t.r1+t.r2)/2:t.r2+span*.2);},{'data-region':i})));
  box.appendChild(regionRow);
  const status=C.status(box);
  const discovery=C.details('Как заполнить знаки на интервалах?','signs',box);
  discovery.appendChild(C.el('p','Выбери промежуток кнопкой выше. Какой знак у выражения здесь? Нажми «+» или «−».'));
  discovery.appendChild(C.el('p','Внутри каждого из трёх промежутков график не пересекает ось x, поэтому знак выражения не меняется.','t13-hint-small'));
  const slots=C.el('div',undefined,'t13-sign-slots');
  const slotNodes=[0,1,2].map(i=>{const n=C.el('div','?','t13-sign-slot');n.dataset.signSlot=String(i);n.setAttribute('aria-label',['Знак левее корней','Знак между корнями','Знак правее корней'][i]);slots.appendChild(n);return n;});discovery.appendChild(slots);
  const signRow=C.el('div',undefined,'t13-lab-row'),signFeedback=C.el('div',undefined,'t13-lab-feedback');signFeedback.setAttribute('role','status');
  for(const [label,s]of[['+','plus'],['−','minus']])signRow.appendChild(C.button(label,'sign',()=>{
    if(region===null){signFeedback.textContent='Сейчас точка в корне: значение равно нулю. Выбери один из трёх промежутков.';return;}
    const expected=fn(x)>0?'plus':'minus';
    if(s!==expected){signFeedback.textContent='Посмотри на точку параболы: она '+(fn(x)>0?'выше':'ниже')+' оси x. Попробуй другой знак.';return;}
    signs[region]=s;signFeedback.textContent=signs.every(Boolean)?'Знаки собраны. Теперь сопоставь их со знаком в задании и сам выбери нужные промежутки в ответе.':'Верно. Исследуй следующий промежуток.';paint();
  },{'data-sign':s,'aria-label':label==='+'?'Положительный знак':'Отрицательный знак'}));discovery.append(signRow,signFeedback);
  const boundary=C.details('Включать ли корни в ответ?','boundary',box);
  boundary.appendChild(C.el('p','Нажми на один из корней. Получится ноль. Разрешён ли ноль знаком в твоём неравенстве?'));
  const rootRow=C.el('div',undefined,'t13-lab-row');
  [t.r1,t.r2].forEach((r,i)=>rootRow.appendChild(C.button('x = '+(i?t.l2:t.l1),'root',()=>setX(r,i?t.l2:t.l1),{'data-root-index':i})));boundary.appendChild(rootRow);
  const boundaryRow=C.el('div',undefined,'t13-lab-row'),boundaryFeedback=C.el('div',undefined,'t13-lab-feedback');boundaryFeedback.setAttribute('role','status');
  for(const include of [true,false])boundaryRow.appendChild(C.button(include?'Включить корень':'Не включать корень','boundary',()=>{
    if(x!==t.r1&&x!==t.r2){boundaryFeedback.textContent='Сначала нажми на один из корней.';return;}
    const expected=C.condition(0,t.sign);
    boundaryFeedback.textContent=include===expected?(include?'Да: равенство разрешено. Корень входит, точка закрашена.':'Да: неравенство строгое. Корень не входит, точка пустая.'):'Проверь знак '+C.signChar(t.sign)+': '+(expected?'в нём разрешено равенство нулю.':'равенство нулю в нём не разрешено.');
    if(include===expected){includedRoots[x===t.r1?0:1]=include;boundaryFeedback.dataset.boundaryIncluded=String(include);paint();}
    else delete boundaryFeedback.dataset.boundaryIncluded;
  },{'data-included':include}));boundary.append(boundaryRow,boundaryFeedback);
  function setX(v,label){x=v;xLabel=label||null;region=x===t.r1||x===t.r2?null:x<t.r1?0:x<t.r2?1:2;boundaryFeedback.textContent='';delete boundaryFeedback.dataset.boundaryIncluded;paint();}
  function paint(){
    const y=fn(x);controls.update(x,xLabel);box.dataset.probeX=String(x);box.dataset.probeValue=String(y);box.dataset.probeTruth=String(C.condition(y,t.sign));box.dataset.pointPosition=y===0?'on':y>0?'above':'below';box.dataset.activeRegion=region===null?'root':String(region);
    C.plot(controls.svg,{fn,min:range.min,max:range.max,x,markRoots:[t.r1,t.r2],labels:[{value:t.r1,label:t.l1,included:includedRoots[0]},{value:t.r2,label:t.l2,included:includedRoots[1]}],selectedRegion:region});
    status.innerHTML='При x = '+C.math(xLabel||C.number(x))+': значение выражения '+(y===0?'равно 0. Точка лежит на оси x.':(y>0?'положительное':'отрицательное')+'. Точка '+(y>0?'выше':'ниже')+' оси x.');
    slotNodes.forEach((n,i)=>{n.textContent=signs[i]?(signs[i]==='plus'?'+':'−'):'?';n.setAttribute('aria-current',String(region===i));});
    regionRow.querySelectorAll('button').forEach((b,i)=>b.setAttribute('aria-pressed',String(region===i)));
  }
  paint();return box;
}

function makeTask13GraphLab(t,index) {
  const C=T13C,box=C.root('graph');box.dataset.prototype=String(index);
  box.appendChild(C.el('p','Выбери вариант для исследования. Двигай x и сравни: подходит ли эта точка неравенству и отмечена ли она на рисунке?'));
  const candidates=t.options.map(C.parseCandidate);let candidate=0,x=(t.roots[0]+t.roots[1])/2,xLabel=null;
  const allRoots=candidates.flatMap(C.roots),minRoot=Math.min(...t.roots,...allRoots),maxRoot=Math.max(...t.roots,...allRoots),span=Math.max(2,maxRoot-minRoot),range={min:minRoot-span*.3,max:maxRoot+span*.3};
  const choiceRow=C.el('div',undefined,'t13-candidate-row');
  candidates.forEach((p,i)=>choiceRow.appendChild(C.button((i+1)+') '+p.text,'candidate',()=>{candidate=i;paint();},{'data-candidate':i})));box.appendChild(choiceRow);
  const controls=C.probeControls(box,range,()=>({x,label:xLabel}),setX),status=C.status(box);
  const deeper=C.details('Где искать отличие?','boundary',box);deeper.appendChild(C.el('p','Проверь точки внутри и снаружи штриховки. Затем проверь обе границы: пустая точка исключена, закрашенная включена.'));
  const row=C.el('div',undefined,'t13-lab-row');
  t.roots.forEach((r,i)=>row.appendChild(C.button('x = '+t.labels[i],'root',()=>setX(r,t.labels[i]),{'data-root-index':i})));
  ['Левее границ','Между границами','Правее границ'].forEach((s,i)=>row.appendChild(C.button(s,'region',()=>setX(i===0?t.roots[0]-span*.15:i===1?(t.roots[0]+t.roots[1])/2:t.roots[1]+span*.15),{'data-region':i})));deeper.appendChild(row);
  deeper.appendChild(C.el('p','Одно несовпадение — уже контрпример. Одного совпадения недостаточно: сравни также остальные участки и границы.','t13-hint-small'));
  function setX(v,label){x=v;xLabel=label||null;paint();}
  function paint(){
    const p=candidates[candidate],y=C.evalPoly(p,x),truth=C.condition(y,p.sign),given=C.graphMembership(t,x);controls.update(x,xLabel);
    box.dataset.activeCandidate=String(candidate);box.dataset.probeX=String(x);box.dataset.probeValue=String(y);box.dataset.probeTruth=String(truth);box.dataset.givenMembership=String(given);box.dataset.pointPosition=y===0?'on':y>0?'above':'below';
    C.plot(controls.svg,{fn:v=>C.evalPoly(p,v),min:range.min,max:range.max,x,markRoots:C.roots(p),labels:t.roots.map((r,i)=>({value:r,label:t.labels[i]}))});
    status.innerHTML='При x = '+C.math(xLabel||C.number(x))+':<br>выбранное неравенство '+(truth?'выполняется':'не выполняется')+';<br>на исходном рисунке точка '+(given?'входит в отмеченное множество':'не входит в отмеченное множество')+'.<br>'+(truth===given?'В этой точке совпало. Проверь другую точку и границы.':'Нашёлся контрпример: в этой точке выбранный вариант расходится с рисунком.');
    choiceRow.querySelectorAll('button').forEach((b,i)=>b.setAttribute('aria-pressed',String(candidate===i)));
  }
  paint();return box;
}

function makeTask13SpecialLab(t,index) {
  const C=T13C,box=C.root('special');box.dataset.prototype=String(index);
  box.appendChild(C.el('p','Выбери неравенство для исследования. Меняй x и следи за квадратом числа и положением параболы.'));
  const candidates=t.options.map(C.parseCandidate);let candidate=0,x=0;
  const largest=Math.max(...candidates.map(p=>Math.abs(p.c))),limit=Math.max(4,Math.sqrt(largest)*1.4),range={min:-limit,max:limit};
  const row=C.el('div',undefined,'t13-candidate-row');candidates.forEach((p,i)=>row.appendChild(C.button((i+1)+') '+p.text,'candidate',()=>{candidate=i;paint();},{'data-candidate':i})));box.appendChild(row);
  const controls=C.probeControls(box,range,()=>({x}),v=>{x=v;paint();}),status=C.status(box);
  const probes=C.el('div',undefined,'t13-lab-row');probes.append(C.button('x = 0','zero',()=>{x=0;paint();}),C.button('Сравнить x и −x','opposite',()=>{x=-x;paint();}));box.appendChild(probes);
  const proof=C.details('Как понять для всех чисел?','minimum',box);
  proof.appendChild(C.el('p','Перебрать все числа нельзя. Найдём наименьшее значение: квадрат не бывает отрицательным, а при x = 0 он равен нулю.'));
  const proofResult=C.el('div',undefined,'t13-lab-feedback');proofResult.dataset.minimumReason='';proofResult.setAttribute('role','status');
  proof.appendChild(C.button('Проверить наименьшее значение','minimum',()=>{x=0;paint();showMinimum();}));proof.appendChild(proofResult);
  function showMinimum(){
    const p=candidates[candidate],min=p.c,atZero=C.condition(min,p.sign),positiveSign=p.sign==='gt'||p.sign==='gte';
    let conclusion;
    if(positiveSign&&(p.sign==='gte'?min>=0:min>0))conclusion='Даже наименьшее значение подходит этому знаку. Значит, неравенство верно при любом x.';
    else if(!positiveSign&&(p.sign==='lte'?min>0:min>=0))conclusion='Даже наименьшее значение не подходит этому знаку. Меньше него выражение не станет: решений нет.';
    else conclusion='Здесь одни значения x подходят, а другие — нет. Проверь x = 0 и точку подальше от нуля.';
    proofResult.innerHTML='x² ≥ 0 при любом x.<br>Поэтому x² '+(min<0?'− '+C.number(-min):'+ '+C.number(min))+' ≥ '+C.number(min)+'.<br>Равенство достигается при x = 0.<br>'+conclusion;
    proofResult.dataset.minimum=String(min);proofResult.dataset.atZero=String(atZero);proofResult.dataset.candidate=String(candidate);
  }
  function paint(){
    const p=candidates[candidate],square=x*x,y=C.evalPoly(p,x),truth=C.condition(y,p.sign);controls.update(x);
    box.dataset.activeCandidate=String(candidate);box.dataset.probeX=String(x);box.dataset.probeValue=String(y);box.dataset.probeTruth=String(truth);box.dataset.pointPosition=y===0?'on':y>0?'above':'below';
    C.plot(controls.svg,{fn:v=>C.evalPoly(p,v),min:range.min,max:range.max,x,markRoots:C.roots(p),labels:[{value:0,label:'0'}]});
    status.innerHTML='x² '+(Math.abs(square-Number(square.toFixed(3)))>1e-9?'≈':'=')+' '+C.number(square)+'.<br>Значение левой части '+C.valueHTML(y)+'.<br>При этом x выбранное неравенство '+(truth?'выполняется':'не выполняется')+'.<br><span class="t13-hint-small">Это проверка одного числа. Для вывода обо всех числах открой помощь ниже.</span>';
    row.querySelectorAll('button').forEach((b,i)=>b.setAttribute('aria-pressed',String(candidate===i)));
    if(proofResult.dataset.candidate!==undefined&&Number(proofResult.dataset.candidate)!==candidate){proofResult.replaceChildren();delete proofResult.dataset.candidate;delete proofResult.dataset.minimum;delete proofResult.dataset.atZero;}
  }
  paint();return box;
}

function makeTask13Lab(mod,t,index) {
  if(mod==='quad')return makeTask13QuadLab(t,index);
  if(mod==='graph')return makeTask13GraphLab(t,index);
  if(mod==='special')return makeTask13SpecialLab(t,index);
  return makeTask13LinearLab(mod,t,index);
}
