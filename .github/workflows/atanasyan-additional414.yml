name: Atanasyan additional 414–421 — source, mathematics and mobile
on:
  pull_request:
    paths:
      - 'stereo-course/textbook/**'
      - 'stereo-course/assets/**'
      - 'tools/stereo-textbook/**'
      - 'docs/reviews/ATANASYAN_ADDITIONAL_414_421_INDEPENDENT.json'
      - '.github/workflows/atanasyan-additional414.yml'
  push:
    branches: [main]
    paths:
      - 'stereo-course/textbook/**'
      - 'stereo-course/assets/**'
      - 'tools/stereo-textbook/**'
      - 'docs/reviews/ATANASYAN_ADDITIONAL_414_421_INDEPENDENT.json'
      - '.github/workflows/atanasyan-additional414.yml'
permissions:
  contents: read
jobs:
  additional-source-math:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --ignore-scripts jsdom@26.1.0 ajv@8.17.1 ajv-formats@3.0.1
      - name: Source contracts, unchanged 674, exact build and model geometry
        run: |
          python3 tools/stereo-textbook/build_textbook.py
          git diff --exit-code -- stereo-course/textbook/data/course.json
          git diff --check
          python3 tools/stereo-textbook/catalog.test.py
          node tools/stereo-textbook/schema.test.cjs
          node tools/stereo-textbook/model-geometry.test.cjs
          node tools/stereo-textbook/additional414-content.test.cjs
          node tools/stereo-textbook/inscribed-solids.test.cjs
          node tools/stereo-textbook/circumspheres.test.cjs
          node tools/stereo-textbook/round-bodies.test.cjs
          node tools/stereo-textbook/box-volumes.test.cjs
          node tools/stereo-textbook/prism-volumes.test.cjs
          node tools/stereo-textbook/cross-sections.test.cjs
          node tools/stereo-textbook/oblique-prisms.test.cjs
          node tools/stereo-textbook/pyramid-volumes.test.cjs
          node tools/stereo-textbook/pyramid-projections.test.cjs
          node tools/stereo-textbook/pyramid-frusta.test.cjs
          node tools/stereo-textbook/cone-volumes.test.cjs
          node tools/stereo-textbook/cone-nets-and-frusta.test.cjs
          node tools/stereo-textbook/sphere-measures.test.cjs
          node tools/stereo-textbook/sphere-applications.test.cjs
          node tools/stereo-textbook/volume-selfcheck.test.cjs
          node tools/stereo-textbook/prism-applications.test.cjs
          node tools/stereo-textbook/normal-prism-applications.test.cjs
          node tools/stereo-textbook/pyramid-angle-applications.test.cjs
          node tools/stereo-textbook/pyramid-comparison-applications.test.cjs
          node tools/stereo-textbook/cylinder-applications.test.cjs
          node tools/stereo-textbook/inscribed-volume-applications.test.cjs
          node tools/stereo-textbook/sphere-volume-angles.test.cjs
          node tools/stereo-textbook/volume-chapter-end.test.cjs
          node tools/stereo-textbook/vector-basics.test.cjs
          node tools/stereo-textbook/vector-pairs.test.cjs
          node tools/stereo-textbook/vector-properties.test.cjs
          node tools/stereo-textbook/spatial-vector-sums.test.cjs
          node tools/stereo-textbook/opposite-and-difference-vectors.test.cjs
          node tools/stereo-textbook/vector-origin-and-paths.test.cjs
          node tools/stereo-textbook/prism-diagonals-and-vector-paths.test.cjs
          node tools/stereo-textbook/signed-vector-combinations.test.cjs
          node tools/stereo-textbook/prism-vector-equations.test.cjs
          node tools/stereo-textbook/pyramid-vector-midpoints.test.cjs
          node tools/stereo-textbook/midlines-vector-coefficients.test.cjs
          node tools/stereo-textbook/collinearity-vector-conditions.test.cjs
          node tools/stereo-textbook/coplanar-vector-directions.test.cjs
          node tools/stereo-textbook/runtime.test.cjs
          node tools/stereo-textbook/browser-shards.test.cjs
  additional-mobile:
    needs: additional-source-math
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - name: Every new card and every state on two phones and desktop
        run: node tools/stereo-textbook/additional414.browser.cjs
      - name: Check inscribed-solids independent practice on two phones and desktop
        env:
          INSCRIBED_SOLIDS_ARTIFACTS: artifacts/inscribed-solids
        run: node tools/stereo-textbook/inscribed-solids.browser.cjs
      - name: Verify independent practice in volume problems and theoretical lessons
        env:
          TEXTBOOK_PRACTICE_GROUP: volume
          INSCRIBED_SOLIDS_ARTIFACTS: artifacts/box-volumes
        run: node tools/stereo-textbook/inscribed-solids.browser.cjs
      - name: Verify prisms and cylinders on phone and desktop
        env:
          TEXTBOOK_PRACTICE_GROUP: prism
          INSCRIBED_SOLIDS_ARTIFACTS: artifacts/prism-volumes
        run: node tools/stereo-textbook/inscribed-solids.browser.cjs
      - name: Verify square and disk cross sections on phone and desktop
        env:
          TEXTBOOK_PRACTICE_GROUP: cross
          INSCRIBED_SOLIDS_ARTIFACTS: artifacts/cross-sections
        run: node tools/stereo-textbook/inscribed-solids.browser.cjs
      - name: Verify volume theorems and oblique prisms on phone and desktop
        env:
          TEXTBOOK_PRACTICE_GROUP: oblique
          INSCRIBED_SOLIDS_ARTIFACTS: artifacts/oblique-prisms
        run: node tools/stereo-textbook/inscribed-solids.browser.cjs
      - name: Verify area, height, units and angles in pyramids
        env:
          TEXTBOOK_PRACTICE_GROUP: pyramids
          INSCRIBED_SOLIDS_ARTIFACTS: artifacts/pyramid-volumes
        run: node tools/stereo-textbook/inscribed-solids.browser.cjs
      - name: Verify pyramid projections and tangencies on phone and desktop
        env:
          TEXTBOOK_PRACTICE_GROUP: projections
          INSCRIBED_SOLIDS_ARTIFACTS: artifacts/pyramid-projections
        run: node tools/stereo-textbook/inscribed-solids.browser.cjs
      - name: Verify cut pyramids and diagonal sections on phone and desktop
        env:
          TEXTBOOK_PRACTICE_GROUP: frusta
          INSCRIBED_SOLIDS_ARTIFACTS: artifacts/pyramid-frusta
        run: node tools/stereo-textbook/inscribed-solids.browser.cjs
      - name: Verify right cones and both admissible axial triangles
        env:
          TEXTBOOK_PRACTICE_GROUP: cones
          INSCRIBED_SOLIDS_ARTIFACTS: artifacts/cone-volumes
        run: node tools/stereo-textbook/inscribed-solids.browser.cjs
      - name: Verify cone nets, axial trapezoids and disk volumes
        env:
          TEXTBOOK_PRACTICE_GROUP: sectors
          INSCRIBED_SOLIDS_ARTIFACTS: artifacts/cone-nets-and-frusta
        run: node tools/stereo-textbook/inscribed-solids.browser.cjs
      - name: Verify ball measurement, spherical caps, layers, sectors and water displacement
        env:
          TEXTBOOK_PRACTICE_GROUP: spheres
          INSCRIBED_SOLIDS_ARTIFACTS: artifacts/sphere-measures
        run: node tools/stereo-textbook/inscribed-solids.browser.cjs
      - name: Verify intersections, volume alternatives, sectors, surface area and the cone proof
        env:
          TEXTBOOK_PRACTICE_GROUP: sphereApplications
          INSCRIBED_SOLIDS_ARTIFACTS: artifacts/sphere-applications
        run: node tools/stereo-textbook/inscribed-solids.browser.cjs
      - name: Verify all printed chapter V volume review questions including subparts on phone, tablet and desktop
        env:
          TEXTBOOK_PRACTICE_GROUP: volumeSelfcheck
          INSCRIBED_SOLIDS_ARTIFACTS: artifacts/volume-selfcheck
        run: node tools/stereo-textbook/inscribed-solids.browser.cjs
      - name: Verify prism areas, perpendicular diagonals and reconstructed side lengths
        env:
          TEXTBOOK_PRACTICE_GROUP: prismApplications
          INSCRIBED_SOLIDS_ARTIFACTS: artifacts/prism-applications
        run: node tools/stereo-textbook/inscribed-solids.browser.cjs
      - name: Verify angle to a face, parallel-line shifts and normal sections of triangular prisms
        env:
          TEXTBOOK_PRACTICE_GROUP: normalPrismApplications
          INSCRIBED_SOLIDS_ARTIFACTS: artifacts/normal-prism-applications
        run: node tools/stereo-textbook/inscribed-solids.browser.cjs
      - name: Verify distances to a face, lateral dihedral angles and radius formulas for pyramids
        env:
          TEXTBOOK_PRACTICE_GROUP: pyramidAngleApplications
          INSCRIBED_SOLIDS_ARTIFACTS: artifacts/pyramid-angle-applications
        run: node tools/stereo-textbook/inscribed-solids.browser.cjs
      - name: Check pyramid diagonals, both pairs of equal tetrahedron edges and a midheight slice
        env:
          TEXTBOOK_PRACTICE_GROUP: pyramidComparisonApplications
          INSCRIBED_SOLIDS_ARTIFACTS: artifacts/pyramid-comparison-applications
        run: node tools/stereo-textbook/inscribed-solids.browser.cjs
      - name: Check cylinder areas, a constant lateral surface and litres in a conical tank
        env:
          TEXTBOOK_PRACTICE_GROUP: cylinderApplications
          INSCRIBED_SOLIDS_ARTIFACTS: artifacts/cylinder-applications
        run: node tools/stereo-textbook/inscribed-solids.browser.cjs
      - name: Check nested pyramids, cylinders, cones and spheres in six source applications
        env:
          TEXTBOOK_PRACTICE_GROUP: inscribedVolumeApplications
          INSCRIBED_SOLIDS_ARTIFACTS: artifacts/inscribed-volume-applications
        run: node tools/stereo-textbook/inscribed-solids.browser.cjs
      - name: Check sphere volumes, bisected dihedral angles and both axial rectangles for problem 550
        env:
          TEXTBOOK_PRACTICE_GROUP: sphereVolumeAngles
          INSCRIBED_SOLIDS_ARTIFACTS: artifacts/sphere-volume-angles
        run: node tools/stereo-textbook/inscribed-solids.browser.cjs
      - name: Check circumsphere centres, cap volumes, equal-area solids and both copper shells
        env:
          TEXTBOOK_PRACTICE_GROUP: volumeChapterEnd
          INSCRIBED_SOLIDS_ARTIFACTS: artifacts/volume-chapter-end
        run: node tools/stereo-textbook/inscribed-solids.browser.cjs
      - name: Check spatial vector arrows, their lengths, translations, and tetrahedron and box exercises
        env:
          TEXTBOOK_PRACTICE_GROUP: vectorBasics
          INSCRIBED_SOLIDS_ARTIFACTS: artifacts/vector-basics
        run: node tools/stereo-textbook/inscribed-solids.browser.cjs
      - name: Check same, opposite and equal arrows on two source solids and the square midpoint section
        env:
          TEXTBOOK_PRACTICE_GROUP: vectorPairs
          INSCRIBED_SOLIDS_ARTIFACTS: artifacts/vector-pairs
        run: node tools/stereo-textbook/inscribed-solids.browser.cjs
      - name: Check vector directions, relative positions of flats and five prescribed affine displacements
        env:
          TEXTBOOK_PRACTICE_GROUP: vectorProperties
          INSCRIBED_SOLIDS_ARTIFACTS: artifacts/vector-properties
        run: node tools/stereo-textbook/inscribed-solids.browser.cjs
      - name: Check polygon, scalar and parallelogram rules with all named sum vectors and three proofs in a tetrahedron
        env:
          TEXTBOOK_PRACTICE_GROUP: spatialVectorSums
          INSCRIBED_SOLIDS_ARTIFACTS: artifacts/spatial-vector-sums
        run: node tools/stereo-textbook/inscribed-solids.browser.cjs
      - name: Check source opposites, edge versus diagonal convention and every possible difference endpoint
        env:
          TEXTBOOK_PRACTICE_GROUP: oppositeDifference
          INSCRIBED_SOLIDS_ARTIFACTS: artifacts/opposite-and-difference-vectors
        run: node tools/stereo-textbook/inscribed-solids.browser.cjs
      - name: Check arbitrary origins, every valid marked-point difference and closed spatial vector paths
        env:
          TEXTBOOK_PRACTICE_GROUP: vectorOriginPaths
          INSCRIBED_SOLIDS_ARTIFACTS: artifacts/vector-origin-and-paths
        run: node tools/stereo-textbook/inscribed-solids.browser.cjs
      - name: Check magnitudes of reflected prism diagonals and the exact result of each spatial path
        env:
          TEXTBOOK_PRACTICE_GROUP: diagonalPaths
          INSCRIBED_SOLIDS_ARTIFACTS: artifacts/prism-diagonals-and-vector-paths
        run: node tools/stereo-textbook/inscribed-solids.browser.cjs
      - name: Check all sign assignments and equivalent sums for arbitrary source vertices
        env:
          TEXTBOOK_PRACTICE_GROUP: signedVectorCombinations
          INSCRIBED_SOLIDS_ARTIFACTS: artifacts/signed-vector-combinations
        run: node tools/stereo-textbook/inscribed-solids.browser.cjs
      - name: Check arbitrary origins and all vertex solutions to equations in a parallelepiped and a triangular prism
        env:
          TEXTBOOK_PRACTICE_GROUP: prismVectorEquations
          INSCRIBED_SOLIDS_ARTIFACTS: artifacts/prism-vector-equations
        run: node tools/stereo-textbook/inscribed-solids.browser.cjs
      - name: Check pairs of vectors in two pyramids, central symmetry and signed ratios in a cube
        env:
          TEXTBOOK_PRACTICE_GROUP: pyramidVectorMidpoints
          INSCRIBED_SOLIDS_ARTIFACTS: artifacts/pyramid-vector-midpoints
        run: node tools/stereo-textbook/inscribed-solids.browser.cjs
      - name: Check directed midpoint differences, ordered vector coefficients and the diagonal identity
        env:
          TEXTBOOK_PRACTICE_GROUP: midlinesVectorCoefficients
          INSCRIBED_SOLIDS_ARTIFACTS: artifacts/midlines-vector-coefficients
        run: node tools/stereo-textbook/inscribed-solids.browser.cjs
      - name: Check affine division, the counterexample to printed exercise 587, and collinearity arguments
        env:
          TEXTBOOK_PRACTICE_GROUP: collinearityVectorConditions
          INSCRIBED_SOLIDS_ARTIFACTS: artifacts/collinearity-vector-conditions
        run: node tools/stereo-textbook/inscribed-solids.browser.cjs
      - name: Check oblique vector bases, all four translated triples, midpoints and a changing parallelogram
        env:
          TEXTBOOK_PRACTICE_GROUP: coplanarVectorDirections
          INSCRIBED_SOLIDS_ARTIFACTS: artifacts/coplanar-vector-directions
        run: node tools/stereo-textbook/inscribed-solids.browser.cjs
      - name: Wait for exact published course bundle
        if: github.event_name == 'push'
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, time, urllib.request
          expected = hashlib.sha256(pathlib.Path('stereo-course/textbook/data/course.json').read_bytes()).hexdigest()
          deadline = time.monotonic() + 480
          while True:
              try:
                  request = urllib.request.Request('https://mathexam.space/stereo-course/textbook/data/course.json?verify=' + str(time.time_ns()), headers={'Cache-Control': 'no-cache'})
                  with urllib.request.urlopen(request, timeout=30) as response:
                      assert response.status == 200
                      actual = hashlib.sha256(response.read()).hexdigest()
                  if actual == expected:
                      print('ATANASYAN_ADDITIONAL414_PUBLISHED_BYTES_OK: ' + expected)
                      break
              except Exception as error:
                  print(type(error).__name__ + ': ' + str(error), flush=True)
              if time.monotonic() >= deadline:
                  raise RuntimeError('Published course bundle did not match this release')
              time.sleep(10)
          PY
      - name: Verify all fourteen published cards and saved steps
        if: github.event_name == 'push'
        env:
          ADDITIONAL414_LIVE_URL: https://mathexam.space/stereo-course/textbook/
          ADDITIONAL414_ARTIFACTS: artifacts/atanasyan-additional414-live
        run: node tools/stereo-textbook/additional414.browser.cjs
      - name: Preserve actual screenshots and persistence evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atanasyan-additional414
          path: |
            artifacts/atanasyan-additional414/
            artifacts/atanasyan-additional414-live/
            artifacts/inscribed-solids/
            artifacts/box-volumes/
            artifacts/prism-volumes/
            artifacts/cross-sections/
            artifacts/oblique-prisms/
            artifacts/pyramid-volumes/
            artifacts/pyramid-projections/
            artifacts/pyramid-frusta/
            artifacts/cone-volumes/
            artifacts/cone-nets-and-frusta/
            artifacts/sphere-measures/
            artifacts/sphere-applications/
            artifacts/volume-selfcheck/
            artifacts/prism-applications/
            artifacts/normal-prism-applications/
            artifacts/pyramid-angle-applications/
            artifacts/pyramid-comparison-applications/
            artifacts/cylinder-applications/
            artifacts/inscribed-volume-applications/
            artifacts/sphere-volume-angles/
            artifacts/volume-chapter-end/
            artifacts/vector-basics/
            artifacts/vector-pairs/
            artifacts/vector-properties/
            artifacts/spatial-vector-sums/
            artifacts/opposite-and-difference-vectors/
            artifacts/vector-origin-and-paths/
            artifacts/prism-diagonals-and-vector-paths/
            artifacts/signed-vector-combinations/
            artifacts/prism-vector-equations/
            artifacts/pyramid-vector-midpoints/
            artifacts/midlines-vector-coefficients/
            artifacts/collinearity-vector-conditions/
            artifacts/coplanar-vector-directions/
          retention-days: 14
          if-no-files-found: error
