function number(input){
 const source=String(input).trim().replace(/−/g,'-').replace(/,/g,'.').replace(/π/g,'pi').replace(/√/g,'sqrt');

 if(tokens.join('')!==source.replace(/\s/g,''))return NaN;
 let i=0,depth=0;
 function atom(){if(++depth>30)throw Error();let v,t=tokens[i++];if(t==='('){v=sum();if(tokens[i++]!==')')throw Error();}else if(t==='pi')v=Math.PI;else if(t==='sqrt')v=Math.sqrt(unary());else if(t&&/^(\d|\.)/.test(t))v=Number(t);else throw Error();depth--;return v;}
 function power(){let v=atom();if(tokens[i]==='^'){i++;const p=unary();if(Math.abs(p)>50)throw Error();v=Math.pow(v,p);}return v;}
 function unary(){if(tokens[i]==='+'){i++;return unary();}if(tokens[i]==='-'){i++;return -unary();}return power();}
 // Juxtaposition has the same precedence as multiplication: 3/4π = (3/4)*π.
 // A product in a denominator must be bracketed, e.g. 3/(4π).
 function implicit(){return tokens[i]==='pi'||tokens[i]==='sqrt'||tokens[i]==='('||((tokens[i-1]===')'||tokens[i-1]==='pi')&&/^(\d|\.)/.test(tokens[i]||''));}
 function product(){let v=unary();while(tokens[i]==='*'||tokens[i]==='/'||implicit()){const op=implicit()?'*':tokens[i++],b=unary();v=op==='*'?v*b:v/b;}return v;}
 function sum(){let v=product();while(tokens[i]==='+'||tokens[i]==='-'){const op=tokens[i++],b=product();v=op==='+'?v+b:v-b;}return v;}
 try{const v=sum();return i===tokens.length&&Number.isFinite(v)?v:NaN;}catch(_){return NaN;}
}
function check(expected,input,choices,options){
 if(String(input).trim()==='')return false;

(function(root){

  const lessons=[];
  const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);

  const step=(prompt,answer,hint,explanation)=>({prompt,answers:[answer],hint,explanation});
  const field=(label,answer)=>({label,answers:[answer]});
  const oldStereo=[{title:'Атанасян 10–11: теория и вращаемые модели',href:'/ege-profil/atanasyan-10-11/index.html'},{title:'Стереометрия первой части',href:'/ege-profil/start/#calm/3'},{title:'Прежняя подборка стереометрии (№14, 2026)',href:'/ege-profil/trainers/stereo-t14.html'}];
  const oldPlane=[{title:'Геометрия: восстановить основу',href:'/ege-profil/start/#calm/1'},{title:'Прежняя подборка с доказательствами (№17, 2026)',href:'/ege-profil/trainers/planimetry-t17.html'}];
  function add(id,exam,title,goal,theory,tasks){lessons.push({id,exam,title,goal,theory,prerequisites:exam===15?oldStereo:oldPlane,tasks});}
  function xml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));}
  function diagram(title,points,edges,accent=[],circles=[],notes=[]){
    // Coordinates are computed from each task's exact geometry. A 3-D diagram
    // is an affine projection, not a second independent set of dimensions.
    const values=Object.values(points);let minX=Math.min(...values.map(p=>p[0])),maxX=Math.max(...values.map(p=>p[0])),minY=Math.min(...values.map(p=>p[1])),maxY=Math.max(...values.map(p=>p[1]));
    for(const c of circles){minX=Math.min(minX,c[0]-c[2]);maxX=Math.max(maxX,c[0]+c[2]);minY=Math.min(minY,c[1]-c[2]);maxY=Math.max(maxY,c[1]+c[2]);}
    const scale=Math.min(290/(maxX-minX||1),185/(maxY-minY||1));
    const tr=p=>[35+(p[0]-minX)*scale,225-(p[1]-minY)*scale];
    const line=(pair,color)=>{const a=tr(points[pair[0]]),b=tr(points[pair[1]]);return '<line x1="'+a[0].toFixed(2)+'" y1="'+a[1].toFixed(2)+'" x2="'+b[0].toFixed(2)+'" y2="'+b[1].toFixed(2)+'" stroke="'+color+'" stroke-width="2"'+(pair[2]?' stroke-dasharray="6 5"':'')+'/>';};
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 '+(265+notes.length*20)+'" role="img" aria-label="'+xml(title)+'"><title>'+xml(title)+'</title><rect width="360" height="100%" fill="#fff"/>'+circles.map(c=>{const p=tr(c);return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+c[2]*scale+'" fill="none" stroke="#17695c" stroke-width="2"/>';}).join('')+edges.map(e=>line(e,'#38566b')).join('')+accent.map(e=>line(e,'#bc4e22')).join('')+Object.entries(points).map(([label,p])=>{const q=tr(p);return '<circle cx="'+q[0]+'" cy="'+q[1]+'" r="2.5" fill="#163e47"/><text x="'+(q[0]+5)+'" y="'+(q[1]-7)+'" font-size="15" fill="#163e47">'+xml(label)+'</text>';}).join('')+notes.map((n,i)=>'<text x="16" y="'+(260+i*20)+'" font-size="13" fill="#38566b">'+xml(n)+'</text>').join('')+'</svg>';
  }
  const project=p=>[p[0]+.38*p[1],p[2]+.25*p[1]];
  const view=points=>Object.fromEntries(Object.entries(points).map(([k,p])=>[k,project(p)]));
  const tetraEdges=[['A','B'],['B','C'],['C','A',true],['S','A'],['S','B'],['S','C']];
  function tetra(u,v,h,extra={},accent=[],notes=[]){return diagram('Тетраэдр SABC; SA перпендикулярна основанию ABC',view({A:[0,0,0],B:[u,0,0],C:[0,v,0],S:[0,0,h],...extra}),tetraEdges,accent,[],['Проекция; пунктир — скрытое ребро.',...notes]);}
  function box(u,v,h,accent=[],notes=[]){const p={A:[0,0,0],B:[u,0,0],C:[u,v,0],D:[0,v,0],'A₁':[0,0,h],'B₁':[u,0,h],'C₁':[u,v,h],'D₁':[0,v,h]};return diagram('Прямоугольный параллелепипед ABCDA₁B₁C₁D₁',view(p),[['A','B'],['B','C'],['C','D',true],['D','A',true],['A₁','B₁'],['B₁','C₁'],['C₁','D₁'],['D₁','A₁'],['A','A₁'],['B','B₁'],['C','C₁'],['D','D₁',true]],accent,[],['Проекция; пунктир — скрытые рёбра.',...notes]);}
  const pretty=s=>String(s).replace(/sqrt\((\d+)\)/g,'√($1)').replace(/\*√/g,'√');
  const make=(id,i,prompt,diagram,steps,final,solution,proof,meta)=>({id:id+'-'+(i+1),prompt,diagram,steps:steps.map(s=>({...s,prompt:pretty(s.prompt),hint:pretty(s.hint),explanation:pretty(s.explanation)})),final,solution:solution.map(pretty),proof,meta});

  add('p2-15-projection',15,'Перпендикуляр и его проекция','Доказать перпендикулярность с помощью проекции, затем выбрать прямоугольный треугольник.',[

  ],[[3,4,3],[5,12,4],[8,15,6],[6,8,7],[9,12,8],[7,24,5]].map(([u,v,h],i)=>{

      step('Найдите BC.',c,'Используйте теорему Пифагора в основании.',`BC²=${u*u}+${v*v}=${c*c}, поэтому BC=${c}.`),

    ],[field('Длина SK (sqrt означает квадратный корень)',answer)],[`SA ⟂ (ABC), значит проекция наклонной SK — AK. По условию AK ⟂ BC. По теореме о трёх перпендикулярах SK ⟂ BC.`,`BC=${c}; AK=AB·AC/BC=${ak}.`,`SA ⟂ AK, поэтому SK=√(SA²+AK²)=${answer}.`],{prompt:'Запишите доказательство пункта а), затем объясните выбор треугольников в пункте б).',criteria:['Названа проекция SK — отрезок AK.','Указаны AK ⟂ BC и применённая теорема.','Обоснованы оба применения теоремы Пифагора и формула высоты.']},{kind:'projection',u,v,h,k});
  }));

  add('p2-15-line-plane',15,'Угол прямой с плоскостью','Найти проекцию пространственной диагонали и вычислить синус угла.',[

  }));

  add('p2-15-dihedral',15,'Линейный угол двугранного угла','Построить два перпендикуляра к ребру, затем вычислить тангенс.',[

  add('p2-15-distance',15,'Расстояние от точки до плоскости','Составить уравнение плоскости по трём точкам и найти расстояние.',[

    'Умножение всех коэффициентов на одно ненулевое число не меняет расстояние. Уравнение нужно проверить на всех трёх точках.'

  add('p2-15-section-volume',15,'Параллельное сечение и объём','Обосновать параллельность сечения, различить квадраты и кубы коэффициента подобия.',[

    ],[field('Площадь сечения MNP',area),field('Объём оставшейся части',volume)],[`В гранях SAB и SAC из равенства отношений следует MN∥AB и MP∥AC (обратная теорема Фалеса). Две пересекающиеся прямые сечения параллельны двум пересекающимся прямым основания; плоскости параллельны.`,`Малый тетраэдр подобен большому с коэффициентом ${m}/${n}. S(MNP)=${S}·(${m}/${n})²=${area}.`,`V(SABC)=${V}, V(SMNP)=${V}·(${m}/${n})³; разность объёмов равна ${volume}.`],{prompt:'Докажите параллельность сечения и объясните, почему используются разные степени t.',criteria:['Применена обратная теорема Фалеса в двух гранях.','Указан признак параллельности двух плоскостей.','Площадь умножается на t², объём — на t³; найден объём именно оставшейся части.']},{kind:'section',u,v,h,m,n});
  }));

  add('p2-15-coordinate-angle',15,'Угол между скрещивающимися прямыми','Перенести направление в одну точку и применить скалярное произведение.',[

  add('p2-18-similarity',18,'Подобие и параллельная прямая','Выбрать соответствующие стороны и перейти от длин к площади.',[

    'Если известны AD и DB, полный отрезок AB равен AD+DB, а не DB.'
  ],[[3,5,6],[4,6,9],[5,7,8],[2,7,12],[7,5,10],[6,9,14]].map(([m,n,h],i)=>{
    const b=m+n,t=m/b,de=f(m*h,b),area=f(m*m*h,2*b),points={A:[0,0],B:[b,0],C:[b,h],D:[m,0],E:[m,t*h]};
    return make('p2-18-similarity',i,`В прямоугольном треугольнике ABC угол B прямой. D лежит на AB, AD=${m}, DB=${n}. Прямая через D, параллельная BC, пересекает AC в E. BC=${h}. а) Докажите подобие ADE и ABC. б) Найдите DE и площадь ADE.`,diagram('Треугольник ABC, D на AB, E на AC, DE параллельна BC',points,[['A','B'],['B','C'],['C','A']],[['D','E']],[],[`AD=${m}; DB=${n}; BC=${h}`]),[
      step('Найдите AB.',b,'D находится между A и B.',`AB=AD+DB=${b}.`),
      step('Найдите коэффициент подобия ADE к ABC.',f(m,b),'Сравните соответствующие стороны AD и AB.',`k=AD/AB=${f(m,b)}.`),
      step('Найдите площадь ABC.',b*h/2,'Угол B прямой.',`S(ABC)=AB·BC/2=${b*h/2}.`)
    ],[field('Длина DE',de),field('Площадь ADE',area)],[`∠DAE=∠BAC (общий угол), ∠ADE=∠ABC по параллельности DE и BC. Поэтому ADE∼ABC по двум углам.`,`DE/BC=AD/AB=${f(m,b)}, откуда DE=${de}.`,`S(ADE)=S(ABC)·k²=${area}; также S(ADE)=AD·DE/2.`],{prompt:'Укажите два равных угла и порядок соответствующих вершин. Обоснуйте расчёт площади.',criteria:['Названы общий угол A и пара углов при параллельных прямых.','Записано AD/AB=DE/BC.','Для площадей использован квадрат коэффициента либо верная высота.']},{kind:'similarity',m,n,h});
  }));

  add('p2-18-tangents',18,'Касательные, радиус и общая хорда','Выделить прямоугольный треугольник и обосновать перпендикулярность хорды касаний.',[
    'Радиус в точку касания перпендикулярен касательной. Поэтому PT²=OP²−R².',
    'Из одной внешней точки отрезки касательных равны. Точки O и P равноудалены от T и U, значит OP — серединный перпендикуляр к TU.',
    'Если H=OP∩TU, то высота TH в прямоугольном треугольнике OTP равна OT·PT/OP. Поэтому TU=2R·PT/OP.'
  ],[[3,5],[5,13],[8,17],[7,25],[9,15],[12,20]].map(([r,d],i)=>{
    const t=Math.sqrt(d*d-r*r),x=r*r/d,y=r*t/d,tu=f(2*r*t,d),pts={O:[0,0],P:[d,0],T:[x,y],U:[x,-y],H:[x,0]};
    return make('p2-18-tangents',i,`Из внешней точки P к окружности с центром O проведены касательные PT и PU. Радиус равен ${r}, OP=${d}. а) Докажите, что OP ⟂ TU и делит TU пополам. б) Найдите PT и TU.`,diagram('Окружность с двумя касательными из P; H — пересечение OP и TU',pts,[['P','T'],['P','U'],['O','T'],['O','U']],[['O','P'],['T','U']],[[0,0,r]],[`R=${r}; OP=${d}`]),[
      step('Чему равен угол OTP в градусах?',90,'Радиус проведён в точку касания.','OT ⟂ PT, поэтому угол OTP прямой.'),
      step('Найдите PT².',d*d-r*r,'Используйте теорему Пифагора в OTP.',`PT²=OP²−OT²=${d*d-r*r}.`),
      step('Найдите TH, высоту к гипотенузе OP.',f(r*t,d),'Площадь OTP равна OT·PT/2 и OP·TH/2.',`TH=OT·PT/OP=${f(r*t,d)}.`)
    ],[field('Длина касательной PT',t),field('Длина хорды TU',tu)],[`OT=OU как радиусы; PT=PU как касательные из одной точки. Следовательно, O и P лежат на серединном перпендикуляре к TU. Так как O≠P, прямая OP и есть этот перпендикуляр.`,`OT ⟂ PT; PT=√(${d}²−${r}²)=${t}.`,`В треугольнике OTP: TH=OT·PT/OP=${f(r*t,d)}. H — середина TU, поэтому TU=2TH=${tu}.`],{prompt:'Докажите свойство OP через геометрическое место точек и объясните нахождение TU.',criteria:['Использованы равенства OT=OU и PT=PU.','Сделан вывод о серединном перпендикуляре.','TH найдена через площадь прямоугольного треугольника; хорда равна 2TH.']},{kind:'tangents',r,d});
  }));

  add('p2-18-cyclic',18,'Вписанный четырёхугольник и высота','Доказать существование окружности и вычислить диагональ трапеции.',[
    'Четырёхугольник можно вписать в окружность, если сумма противоположных углов равна 180°.',
    'В равнобедренной трапеции углы при основании равны; из параллельности оснований соседние углы при боковой стороне в сумме дают 180°.',
    'Высота отсекает на большем основании отрезок (a−b)/2. Проекция диагонали на основание имеет длину (a+b)/2.'
  ],[[14,6,3],[18,8,12],[16,10,4],[20,6,24],[22,12,12],[18,10,3]].map(([a,b,h],i)=>{
    const p=(a-b)/2,l=Math.hypot(p,h),q=(a+b)/2,answer=radical(q*q+h*h),pts={A:[0,0],B:[a,0],C:[p+b,h],D:[p,h],H:[p,0]};
    return make('p2-18-cyclic',i,`Равнобедренная трапеция ABCD имеет основания AB=${a}, CD=${b} (AB ∥ CD) и боковые стороны AD=BC=${l}. а) Докажите, что около трапеции можно описать окружность. б) Найдите диагональ AC. H — основание высоты из D на AB.`,diagram('Равнобедренная трапеция ABCD с высотой DH и диагональю AC',pts,[['A','B'],['B','C'],['C','D'],['D','A']],[['D','H'],['A','C']],[],[`AB=${a}; CD=${b}; AD=BC=${l}`]),[
      step('Найдите AH.',p,'Разность оснований делится поровну на два крайних отрезка.',`AH=(AB−CD)/2=${p}.`),
      step('Найдите высоту DH.',h,'В прямоугольном ADH известны гипотенуза и катет.',`DH²=AD²−AH²=${h*h}, поэтому DH=${h}.`),
      step('Найдите длину проекции AC на AB.',q,'Проекция равна AH+CD.',`AH+CD=${p}+${b}=${q}.`)
    ],[field('Диагональ AC',answer)],[`В равнобедренной трапеции ∠A=∠B. Так как AB∥CD, ∠B+∠C=180°. Следовательно, ∠A+∠C=180°, и четырёхугольник вписанный.`,`AH=(AB−CD)/2=${p}; DH=√(${l}²−${p}²)=${h}.`,`Проекция AC на AB имеет длину ${q}. Поэтому AC=√(${q}²+${h}²)=${answer}.`],{prompt:'Проверьте признак вписанного четырёхугольника и объясните обе проекции.',criteria:['Равенство углов при основании связано с равнобедренностью.','Получена сумма противоположных углов 180°.','Различены (a−b)/2 для боковой стороны и (a+b)/2 для диагонали.']},{kind:'cyclic',a,b,h,l});
  }));

  add('p2-18-bisector',18,'Биссектриса: отношение и длина','Доказать отношение частей стороны через площади, затем найти биссектрису.',[
    'Для биссектрисы AD треугольника ABC: BD/DC=AB/AC. Это следует из отношения площадей ABD и ACD, выраженных через синус половины угла A.',
    'Если BC=a, CA=b, AB=c, то BD=ac/(b+c), DC=ab/(b+c).',
    'Длину AD можно получить из теоремы Стюарта: b²·BD+c²·DC=a(AD²+BD·DC). Отсюда AD²=bc−BD·DC.'
  ],[[15,14,13],[6,5,5],[10,8,6],[9,8,7],[13,13,10],[11,10,9]].map(([a,b,c],i)=>{
    const ax=(c*c-b*b+a*a)/(2*a),ay=Math.sqrt(c*c-ax*ax),bd=f(a*c,b+c),dc=f(a*b,b+c),num=b*c*((b+c)*(b+c)-a*a),ad=radical(num,b+c),pts={B:[0,0],C:[a,0],A:[ax,ay],D:[a*c/(b+c),0]};
    return make('p2-18-bisector',i,`В треугольнике ABC даны BC=${a}, CA=${b}, AB=${c}. AD — внутренняя биссектриса, D лежит на BC. а) Докажите BD/DC=AB/AC через площади. б) Найдите BD и AD.`,diagram('Треугольник ABC и внутренняя биссектриса AD',pts,[['A','B'],['B','C'],['C','A']],[['A','D']],[],[`BC=${a}; CA=${b}; AB=${c}`]),[
      step('Чему равно отношение BD/DC?',f(c,b),'Площади можно сравнить по общей высоте к BC и по синусу равных углов при A.',`BD/DC=AB/AC=${f(c,b)}.`),
      step('Найдите DC.',dc,'BD+DC=BC; отношение BD:DC=AB:AC.',`DC=BC·AC/(AB+AC)=${dc}.`),
      step('Найдите AD².',f(num,(b+c)*(b+c)),'Подставьте BD и DC в AD²=AB·AC−BD·DC.',`AD²=${b*c}−(${bd})·(${dc})=${f(num,(b+c)*(b+c))}.`)
    ],[field('Длина BD',bd),field('Длина биссектрисы AD',ad)],[`Треугольники ABD и ACD имеют общую высоту к BC, поэтому S(ABD)/S(ACD)=BD/DC. С другой стороны, это отношение равно (AB·AD·sin∠BAD)/(AC·AD·sin∠CAD)=AB/AC, так как ∠BAD=∠CAD.`,`BD=${bd}, DC=${dc}. По теореме Стюарта: AC²·BD+AB²·DC=BC(AD²+BD·DC).`,`После подстановки отношения частей получаем AD²=AB·AC−BD·DC=${f(num,(b+c)*(b+c))}, поэтому AD=${ad}.`],{prompt:'Докажите отношение площадей двумя способами и обоснуйте переход к длине AD.',criteria:['Использована общая высота к BC.','Сокращены равные синусы углов при биссектрисе.','Корректно записана теорема Стюарта; длина взята положительной.']},{kind:'bisector',a,b,c});
  }));

  add('p2-18-cevians',18,'Пересечение чевиан и отношения площадей','Найти отношение отрезков без измерения рисунка.',[
    'Если треугольники имеют общую высоту, их площади относятся как основания. Эта связь работает и для внутренних вспомогательных отрезков.',
    'Пусть E — середина AC, G лежит на BE, D=AG∩BC. Тогда площади ABG и CBG равны: расстояния A и C до BE равны.',
    'При BD:DC=m:n обозначьте S(ABG)=S(CBG)=x. Тогда S(BGD)=xm/(m+n), а S(ABD)=x(2m+n)/(m+n).'
  ],[[2,3,12,10],[3,2,15,8],[1,4,20,9],[4,3,14,12],[3,5,16,15],[5,2,21,10]].map(([m,n,b,h],i)=>{
    const t=(m+n)/(2*m+n),S=b*h/2,x=f(b*h*m,2*(2*m+n)),ratio=f(m+n,m),pts={A:[0,h],B:[0,0],C:[b,0],D:[b*m/(m+n),0],E:[b/2,h/2],G:[t*b*m/(m+n),h*(1-t)]};
    return make('p2-18-cevians',i,`В треугольнике ABC площадь равна ${S}. E — середина AC. Точка D лежит на BC, BD:DC=${m}:${n}. Отрезки AD и BE пересекаются в G. а) Докажите S(ABG)=S(CBG). б) Найдите отношение AG/GD и площадь ABG.`,diagram('Чевианы AD и BE пересекаются в G, E — середина AC',pts,[['A','B'],['B','C'],['C','A']],[['A','D'],['B','E']],[],[`S(ABC)=${S}; BD:DC=${m}:${n}`]),[
      step('Найдите S(ABD)/S(ABC).',f(m,m+n),'Высота из A к BC общая.',`S(ABD)/S(ABC)=BD/BC=${f(m,m+n)}.`),
      step('Если S(CBG)=x, чему равно S(BGD)/x?',f(m,m+n),'У BGD и CGD общая высота из G.',`S(BGD)/S(CBG)=BD/BC=${f(m,m+n)}.`),
      step('Чему равно S(ABG)/S(ABC)?',f(m,2*m+n),'Сложите площади ABG и BGD и приравняйте площади ABD.',`x+x·${f(m,m+n)}=S(ABC)·${f(m,m+n)}, поэтому x/S(ABC)=${f(m,2*m+n)}.`)
    ],[field('Отношение AG/GD',ratio),field('Площадь ABG',x)],[`Так как E — середина AC, расстояния A и C до прямой BE равны (можно рассмотреть подобные прямоугольные треугольники с вершиной E). Треугольники ABG и CBG имеют общее основание BG, поэтому их площади равны.`,`Обозначим обе площади через x. S(BGD)=x·${f(m,m+n)}. Поэтому S(ABD)=x(1+${f(m,m+n)})=${S}·${f(m,m+n)}, откуда x=${x}.`,`Треугольники ABG и BGD имеют общую высоту из B к AD, поэтому AG/GD=S(ABG)/S(BGD)=${ratio}.`],{prompt:'Запишите цепочку отношений площадей и объясните, как из неё получается отношение AG/GD.',criteria:['Равенство площадей ABG и CBG доказано через середину E и расстояния до BE.','Площадь BGD выражена через x и отношение BD/BC.','Для AG/GD использована общая высота из B к AD.']},{kind:'cevians',m,n,b,h});
  }));

  add('p2-18-altitude',18,'Вспомогательная высота и геометрическое среднее','Доказать метрические соотношения в прямоугольном треугольнике.',[
    'Высота AH к гипотенузе BC делит прямоугольный треугольник ABC на два треугольника, подобных исходному и друг другу.',
    'Из подобия ABH и CAH: AH²=BH·HC. Из подобия ABH и CBA: AB²=BH·BC.',
    'Площадь можно считать как BC·AH/2. Положение вершины A определяется условием прямого угла, а не произвольным рисунком.'
  ],[[4,9],[9,16],[3,12],[8,18],[5,20],[12,27]].map(([p,q],i)=>{
    const h=Math.sqrt(p*q),bc=p+q,ab=radical(p*bc),area=bc*h/2,pts={B:[0,0],C:[bc,0],H:[p,0],A:[p,h]};
    return make('p2-18-altitude',i,`В прямоугольном треугольнике ABC (∠A=90°) проведена высота AH к гипотенузе BC. BH=${p}, HC=${q}. а) Докажите AH²=BH·HC и AB²=BH·BC. б) Найдите AB и площадь ABC.`,diagram('Прямоугольный треугольник ABC; AH — высота к гипотенузе',pts,[['A','B'],['B','C'],['C','A']],[['A','H']],[],[`BH=${p}; HC=${q}; ∠A=90°`]),[
      step('Найдите BC.',bc,'H лежит между B и C.',`BC=BH+HC=${bc}.`),
      step('Найдите AH.',h,'AH²=BH·HC; выбираем положительную длину.',`AH=√(${p}·${q})=${h}.`),
      step('Найдите AB².',p*bc,'Квадрат катета равен произведению гипотенузы на его проекцию.',`AB²=BH·BC=${p*bc}.`)
    ],[field('Длина катета AB',ab),field('Площадь ABC',area)],[`Треугольники ABH и CAH прямоугольные и имеют равные острые углы, поэтому подобны. Соответствие даёт BH/AH=AH/HC, то есть AH²=BH·HC.`,`Треугольники ABH и CBA подобны по двум углам: ∠H=∠A=90°, угол B общий. Поэтому BH/AB=AB/BC, откуда AB²=BH·BC.`,`BC=${bc}, AH=${h}, AB=${ab}. S(ABC)=BC·AH/2=${area}.`],{prompt:'Укажите соответствие вершин в двух парах подобных треугольников и выведите обе формулы.',criteria:['Для ABH и CAH названы равные острые углы.','Получено BH/AH=AH/HC.','Для ABH и CBA получено BH/AB=AB/BC; площадь вычислена по высоте AH.']},{kind:'altitude',p,q});
  }));
  root.ProfilePartTwoLessons=(root.ProfilePartTwoLessons||[]).concat(lessons);
  if(typeof module!=='undefined'&&module.exports)module.exports=lessons;
})(typeof globalThis!=='undefined'?globalThis:this);

</script>
<script data-inline-source="/ege-profil/part-two/content-models.js">
(function(root){
'use strict';
// Original exercises. FIPI draft 2027 numbering; old trainer URLs retain their
// historical filenames. Numeric checks do not certify a written proof.
const lessons=[];
const N=n=>String(n).replace(/-/g,'−');
const step=(prompt,answer,hint,explanation)=>({prompt,answers:Array.isArray(answer)?answer:[answer],hint,explanation});
const field=(label,...answers)=>({label,answers});
const proof=(prompt,criteria)=>({prompt,criteria});
const prereq=(title,href)=>({title,href});
const links={analysis:prereq('Производная и экстремум: вспомнить основу','/ege-profil/start/#lesson/calc-extreme'),functions:prereq('Исследовать функции и графики','/ege-profil/trainers/functions-t1112.html'),parameters:prereq('Параметры: прежние модели и дополнительные задачи','/ege-profil/trainers/parameters-t18.html'),numbers:prereq('Числа: прежний практикум и разборы','/ege-profil/trainers/numbers-t19.html'),equations:prereq('Простые уравнения','/ege-profil/start/#exam/7')};
const add=(id,exam,title,goal,theory,prerequisites,make)=>lessons.push({id,exam,title,goal,theory,prerequisites,tasks:Array.from({length:6},(_,i)=>{const t=make(i);return {...t,id:id+'-'+(i+1)};})});
const svg=(label,inside)=>`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 210" role="img" aria-label="${label}" style="max-width:100%;height:auto"><title>${label}</title><rect width="360" height="210" fill="#f6faf8"/>${inside}</svg>`;
const fencePicture=L=>svg(`Прямоугольный участок у стены. Три стороны ограды суммарно ${L} метров.`,`<path d="M65 45H295" stroke="#667" stroke-width="8"/><path d="M65 45V165H295V45" fill="none" stroke="#187565" stroke-width="3"/><text x="130" y="28">стена</text><text x="35" y="110">x</text><text x="310" y="110">x</text><text x="175" y="190">y</text><text x="100" y="100">2x + y = ${L}</text>`);
const rectanglePicture=(p,c)=>svg(`Прямоугольник: x плюс y равно ${p}; ширина x не больше ${c}.`,`<rect x="60" y="45" width="240" height="110" fill="#def0e9" stroke="#187565" stroke-width="3"/><text x="30" y="105">x</text><text x="160" y="182">y = ${p} − x</text><text x="95" y="100">0 &lt; x ≤ ${c}</text>`);
const boxPicture=a=>{
 const side=6*a,scale=180/side,cut=side/5;
 const X=x=>90+scale*x,Y=y=>20+scale*y;
 const path=[[cut,0],[side-cut,0],[side-cut,cut],[side,cut],[side,side-cut],[side-cut,side-cut],[side-cut,side],[cut,side],[cut,side-cut],[0,side-cut],[0,cut],[cut,cut]].map(([x,y],i)=>(i?'L':'M')+X(x)+' '+Y(y)).join('')+'Z';
 return svg(`Развёртка коробки из квадратного листа со стороной ${side}. Угловые вырезы x на x показаны схематически.`,`<path class="box-net" d="${path}" fill="#def0e9" stroke="#187565" stroke-width="2"/><path d="M${X(cut)} ${Y(0)}V${Y(side)}M${X(side-cut)} ${Y(0)}V${Y(side)}M${X(0)} ${Y(cut)}H${X(side)}M${X(0)} ${Y(side-cut)}H${X(side)}" stroke="#6a827a" stroke-dasharray="5 4"/><text x="130" y="110">дно коробки</text><text x="145" y="192">${side} − 2x</text><text x="96" y="42">x</text><text x="280" y="107">${side}</text>`);
};
const modulePicture=h=>{
 const scale=35/h,X=x=>180+scale*x,Y=y=>180-scale*y;
 const f=x=>Math.abs(x-h)+Math.abs(x+h),xs=[-2.25*h,-h,h,2.25*h];
 const path=xs.map((x,i)=>(i?'L':'M')+X(x)+' '+Y(f(x))).join('');
 return svg(`График суммы расстояний |x−${h}|+|x+${h}|.`,`<path class="axes" d="M25 180H340M180 200V15" stroke="#667"/><path class="model-curve" d="${path}" fill="none" stroke="#187565" stroke-width="3"/><text x="137" y="201">−${h}</text><text x="210" y="201">${h}</text><text x="185" y="105">${2*h}</text><text x="330" y="171">x</text><text x="188" y="30">y</text>`);
};
const holePicture=h=>{
 const scale=40/h,X=x=>80+scale*x,Y=y=>175-scale*y;
 return svg(`Прямая y=x+${h} с исключённой точкой при x=${h}.`,`<path class="axes" d="M25 175H335M80 192V18" stroke="#667"/><path class="model-curve" d="M${X(-h)} ${Y(0)}L${X(3*h)} ${Y(4*h)}" stroke="#187565" stroke-width="3"/><circle class="excluded-point" cx="${X(h)}" cy="${Y(2*h)}" r="6" stroke="#b63d37" fill="#f6faf8" stroke-width="3"/><path d="M${X(h)} ${Y(2*h)+9}V175M80 ${Y(2*h)}H${X(h)-10}" stroke="#667" stroke-dasharray="4 4"/><text x="115" y="194">${h}</text><text x="40" y="91">${2*h}</text><text x="185" y="75">y = x + ${h}</text><text x="315" y="165">x</text>`);
};

add('model-fence',17,'Модель площади: три стороны ограды','Составить ограничение, выразить площадь одной переменной и доказать максимум.',[
'Сначала выберите переменную и допустимый промежуток. Ограда и площадь измеряются в разных единицах.',
'Для прямоугольника у стены: 2x + y = L, S(x) = x(L − 2x), 0 &lt; x &lt; L/2.',
'Условие S′(x) = 0 даёт кандидата. Знак производной или выделение квадрата доказывает, что это максимум.'
],[links.analysis],i=>{const L=[40,48,60,72,84,100][i],x=L/4,y=L/2,S=x*y;return {prompt:`Есть ${L} м ограды. Прямоугольный участок примыкает одной стороной к стене, вдоль стены ограда не нужна. Найдите ширину x (перпендикулярно стене), длину y и наибольшую площадь участка.`,diagram:fencePicture(L),meta:{family:'fence',L},steps:[step('Каков коэффициент при x в расходе ограды 2x + y?',2,'У участка две боковые стороны одинаковой ширины.','Условие: 2x + y = L.'),step(`Из S(x) = ${L}x − 2x² получаем S′(x) = ${L} − 4x. При каком x производная равна нулю?`,x,'Решите линейное уравнение L − 4x = 0.',`Кандидат x = ${x} лежит внутри допустимого промежутка.`),step('Найдите y по расходу всей ограды.',y,`Вычтите 2x из ${L}.`,`Длина y = ${y} м.`)],final:[field('Ширина x, м',x),field('Длина y, м',y),field('Наибольшая площадь, м²',S)],solution:[`2x + y = ${L}, поэтому y = ${L} − 2x и 0 &lt; x &lt; ${L/2}.`,`S(x) = ${L}x − 2x² = ${S} − 2(x − ${x})². Квадрат неотрицателен.`,`Максимум ${S} м² достигается при x = ${x} м, y = ${y} м; обе длины положительны.`],proof:proof('Обоснуйте, что выбранные размеры дают глобальный максимум.', ['Записано ограничение по ограде и положительность сторон.','Площадь выражена одной переменной.','Максимум доказан знаком производной или выделением квадрата.','Размеры подставлены в исходный расход ограды.'])};});

add('model-revenue',17,'Цена, спрос и прибыль','Отличать выручку от прибыли и учитывать область спроса.',[
'Если при цене p спрос q(p), то выручка равна p·q(p). При себестоимости c прибыль равна (p − c)·q(p).',
'Допустимы только цены, при которых q ≥ 0. Условие задачи может дополнительно ограничивать цену снизу или сверху.',
'После нахождения стационарной точки проверяют допустимость и края промежутка.'
],[links.analysis,prereq('Финансовые модели первой части','/ege-profil/start/#exam/13')],i=>{const k=[2,3,4,2,5,3][i],c=[10,12,8,15,6,10][i],d=[20,18,24,30,16,26][i],B=k*(c+d),p=c+d/2,q=k*d/2,P=k*d*d/4;return {prompt:`При цене p рублей фирма продаёт q = ${B} − ${k}p изделий в день. Себестоимость изделия ${c} рублей. Цена p ≥ ${c}, спрос должен быть неотрицательным. Найдите цену, ежедневное число продаж и наибольшую дневную прибыль. По условию количество q допускается считать непрерывным.`,meta:{family:'revenue',k,c,B},steps:[step('Какова наибольшая допустимая цена из условия q ≥ 0?',B/k,'Решите B − kp ≥ 0.',`Допустимо ${c} ≤ p ≤ ${B/k}.`),step(`В производной прибыли P′(p) = ${B+k*c} − ${2*k}p найдите нуль.`,p,'Себестоимость вычитается из цены до умножения на спрос.',`Кандидат p = ${p} лежит внутри промежутка.`),step('Сколько изделий будет продано при этой цене?',q,'Подставьте найденную цену в закон спроса.',`q = ${B} − ${k}·${p} = ${q}.`)],final:[field('Оптимальная цена, руб.',p),field('Продажи в день',q),field('Наибольшая прибыль в день, руб.',P)],solution:[`P(p) = (p − ${c})(${B} − ${k}p), p ∈ [${c}; ${B/k}].`,`P′(p) = ${B+k*c} − ${2*k}p; до p = ${p} производная положительна, после — отрицательна.`,`На концах прибыль нулевая. При p = ${p} получаем q = ${q} и P = (${p} − ${c})·${q} = ${P} руб.`],proof:proof('Объясните выбор функции прибыли и докажите максимум на допустимом промежутке.',['Выручка и прибыль различены.','Учтены p ≥ c и q ≥ 0.','Проверены знак производной и границы.','Ответ дан в рублях, не только как число продаж.'])};});

add('model-boundary',17,'Ограничение меняет оптимум','Сравнить стационарную точку с допустимой границей.',[
'Для фиксированного периметра прямоугольника площадь максимальна у квадрата, только если квадрат допустим.',
'Дополнительное условие x ≤ c может исключить стационарную точку. Тогда максимум ищут на границе.',
'Нельзя подставлять стационарную точку, не проверив ограничения исходной задачи.'
],[links.analysis],i=>{const p=[20,24,30,28,36,40][i],cap=[6,15,10,18,12,25][i],x=Math.min(p/2,cap),y=p-x,A=x*y;return {prompt:`Периметр прямоугольного участка ${2*p} м. Его ширина x не должна превышать ${cap} м. Длины сторон положительны. Найдите ширину и длину участка наибольшей площади и эту площадь.`,diagram:rectanglePicture(p,cap),meta:{family:'boundary',p,cap},steps:[step('Чему равно x + y?',p,'Периметр равен удвоенной сумме сторон.',`y = ${p} − x.`),step(`Найдите стационарную точку S(x) = x(${p} − x).`,p/2,'S′(x) = p − 2x.',`Без ограничения квадрат имеет x = ${p/2}.`),step('Какое допустимое x даёт максимум с учётом ограничения?',x,'Если стационарная точка правее разрешённого края, функция до края растёт.',`Выбираем x = ${x}, затем y = ${y}.`)],final:[field('Ширина, м',x),field('Длина, м',y),field('Максимальная площадь, м²',A)],solution:[`x + y = ${p}, S(x) = ${p}x − x², 0 &lt; x ≤ ${cap}.`,`Производная ${p} − 2x обращается в нуль при x = ${p/2}. ${cap<p/2?'Эта точка недопустима; на всём разрешённом промежутке производная положительна.':'Эта точка допустима; слева производная положительна, справа отрицательна.'}`,`Поэтому x = ${x}, y = ${y}, S = ${A}. Ограничение ширины выполнено.`],proof:proof('Обоснуйте, почему максимум достигается именно в выбранной точке.',['Введены переменная и ограничения.','Стационарная точка найдена отдельно от окончательного ответа.','Проверено, допускает ли её ограничение.','Доказан максимум на всём разрешённом промежутке.'])};});

add('model-discrete',17,'Целочисленный выбор после производной','Перейти от непрерывной модели к допустимому целому решению.',[
'Если число изделий целое, дробное стационарное значение не является ответом.',
'У вогнутой квадратичной функции проверяют ближайшие допустимые целые по обе стороны вершины и границы.',
'Обычное округление без сравнения значений не является доказательством оптимальности.'
],[links.analysis],i=>{const m=[5,7,9,6,8,10][i],a=2,b=4*m+1,C=[7,12,9,10,15,18][i],limit=2*m+2,profit=n=>-a*n*n+b*n-C,best=m;return {prompt:`Мастерская выбирает целое число n изделий в день, 0 ≤ n ≤ ${limit}. Прибыль в условных денежных единицах равна P(n) = −2n² + ${b}n − ${C}. Сколько изделий нужно выпускать и какой будет максимальная прибыль?`,meta:{family:'discrete',a,b,C,limit},steps:[step('Найдите стационарное значение непрерывной функции P(x).',b/4,'Производная равна −4x + b.',`Непрерывный максимум находится при x = ${b/4}.`),step('Найдите прибыль при ближайшем меньшем целом количестве.',profit(m),'Подставляйте целое n в исходную функцию, включая постоянные затраты.',`P(${m}) = ${profit(m)}.`),step('Найдите прибыль при ближайшем большем целом количестве.',profit(m+1),'Нужно сравнить обе стороны вершины.',`P(${m+1}) = ${profit(m+1)}.`)],final:[field('Оптимальное целое число изделий',best),field('Наибольшая прибыль',profit(best))],solution:[`Для непрерывной функции P′(x) = ${b} − 4x. Вершина имеет x = ${b/4}.`,`Парабола вогнута, поэтому среди целых достаточно сравнить ${m} и ${m+1}; они оба допустимы. P(${m}) = ${profit(m)}, P(${m+1}) = ${profit(m+1)}.`,`Дальше от вершины прибыль меньше; границы также не лучше. Ответ: ${best} изделий, прибыль ${profit(best)}.`],proof:proof('Докажите, что ни одно другое допустимое целое количество не выгоднее.',['Учтена целочисленность n.','Найдена непрерывная вершина.','Сравнены значения в соседних целых.','Объяснено, почему остальные целые дают меньшую прибыль.'])};});

add('model-box',17,'Объём коробки и физическая область','Исследовать кубическую модель и исключить вырожденное тело.',[
'При вырезании квадратов со стороной x из углов листа высота коробки равна x, а стороны дна уменьшаются на 2x.',
'Физическая область: x &gt; 0 и обе стороны дна положительны.',
'Корни производной на границе могут соответствовать вырожденному телу; их нельзя считать полноценной коробкой.'
],[links.analysis,prereq('Объёмы тел','/ege-profil/start/#exam/3')],i=>{const a=[2,3,4,5,6,7][i],L=6*a,V=16*a**3;return {prompt:`Из квадратного листа картона со стороной ${L} см вырезают по углам четыре одинаковых квадрата со стороной x и загибают края. Получается открытая коробка. Найдите x, при котором объём коробки максимален, сторону её дна и максимальный объём.`,diagram:boxPicture(a),meta:{family:'box',a,L},steps:[step('Какова верхняя граница x, не входящая в физическую область?',L/2,'Сторона дна L − 2x должна быть положительна.',`0 &lt; x &lt; ${L/2}.`),step(`Производная V′(x) = (${L} − 2x)(${L} − 6x). Найдите её корень внутри области.`,a,'Первый множитель обнуляется на недопустимой границе.',`Внутренний корень: x = ${a}.`),step('Найдите сторону квадратного дна.',4*a,`Вычтите 2x из ${L}.`,`Сторона дна ${4*a} см.`)],final:[field('Сторона вырезаемого квадрата x, см',a),field('Сторона дна, см',4*a),field('Максимальный объём, см³',V)],solution:[`V(x) = x(${L} − 2x)², 0 &lt; x &lt; ${L/2}.`,`V′(x) = (${L} − 2x)(${L} − 6x). Первый множитель положителен внутри области; второй меняет знак с плюса на минус при x = ${a}.`,`Значит, максимум достигается при x = ${a}. Дно имеет сторону ${4*a}, объём равен ${a}·${4*a}² = ${V} см³.`],proof:proof('Обоснуйте модель объёма, допустимость и глобальный максимум.',['На рисунке различены высота и сторона дна.','Записана открытая физическая область.','Вырожденная граница исключена.','Знак производной подтверждает максимум.'])};});

add('model-motion',17,'Наименьшее расстояние при движении','Минимизировать квадрат расстояния и проверить время наблюдения.',[
'При перпендикулярных направлениях расстояние находят по теореме Пифагора.',
'Минимумы d и d² достигаются одновременно, потому что квадратный корень возрастает на неотрицательных числах.',
'Время из уравнения производной должно принадлежать заданному промежутку наблюдения.'
],[links.analysis,prereq('Координаты и векторы','/ege-profil/start/#exam/2')],i=>{const a=[1,2,3,4,5,6][i],d=25*a,T=8*a,t=3*a,min=20*a;return {prompt:`В момент t = 0 первый робот находится в точке (${d}; 0) и едет к началу координат со скоростью 3 м/с, продолжая движение по той же прямой. Второй робот стартует из начала координат вдоль положительной оси y со скоростью 4 м/с. Наблюдение длится ${T} с. Через сколько секунд расстояние между ними минимально и чему оно равно?`,meta:{family:'motion',a,d,T},steps:[step('Каков коэффициент при t² в квадрате расстояния (d − 3t)² + (4t)²?',25,'Квадраты скоростей складываются: 3² + 4².',`D(t) = 25t² − ${6*d}t + ${d*d}.`),step(`Найдите нуль производной D′(t) = 50t − ${6*d}.`,t,'Решите линейное уравнение и проверьте время наблюдения.',`t = ${t} с, это внутри [0; ${T}].`),step('Найдите квадрат минимального расстояния.',min*min,'Подставьте найденное время в сумму квадратов координат.',`D(${t}) = ${min*min} м².`)],final:[field('Время после старта, с',t),field('Наименьшее расстояние, м',min)],solution:[`Координаты роботов: (${d} − 3t; 0) и (0; 4t). D(t) = (${d} − 3t)² + 16t².`,`D(t) = 25(t − ${t})² + ${min*min}; значит, глобальный минимум достигается при t = ${t}.`,`Это время принадлежит [0; ${T}], поэтому ограничение наблюдения его не исключает. d_min = √${min*min} = ${min} м.`],proof:proof('Почему можно минимизировать квадрат расстояния? Проверьте допустимость найденного времени.',['Координаты каждого робота записаны со знаком.','Использована теорема Пифагора.','Объяснена равносильность минимизации d и d².','Время находится внутри промежутка наблюдения.'])};});

add('param-linear',19,'Особое значение: когда делить нельзя','Разделить вырожденный и обычный случаи параметра.',[
'Прежде чем делить на выражение с параметром, отдельно рассмотрите, когда оно равно нулю.',
'Равенство 0·x = 0 даёт все действительные x, а 0·x = b при b ≠ 0 не даёт решений.',
'Требования к корню, например x &gt; 0, накладываются после решения каждого случая.'
],[links.equations,links.parameters],i=>{const r=[2,3,4,5,6,7][i];return {prompt:`Найдите все значения a, при которых уравнение (a − ${r})x = a² − ${r*r} имеет ровно одно положительное решение. В полном обосновании запишите множество a. Для проверки введите нижнюю границу этого множества и исключённую внутреннюю точку.`,meta:{family:'linear',r},steps:[step('При каком a коэффициент при x равен нулю?',r,'Нельзя делить на a − r, пока этот случай не разобран.',`При a = ${r} получается 0·x = 0; положительных решений бесконечно много.`),step(`При a ≠ ${r} получаем x = a + ${r}. Чему равна нижняя граница a из условия x > 0?`,-r,'Решите a + r > 0.',`Нужно a > ${N(-r)}.`),step('Какое значение внутри найденного промежутка надо исключить?',r,'Вернитесь к случаю с нулевым коэффициентом.',`a = ${r} не даёт ровно одного решения.`)],final:[field('Нижняя граница a, не включается',-r),field('Исключённое внутреннее значение a',r)],solution:[`При a = ${r}: 0·x = 0, положительных решений бесконечно много, значение не подходит.`,`При a ≠ ${r}: (a − ${r})x = (a − ${r})(a + ${r}), поэтому x = a + ${r}.`,`Этот единственный корень положителен тогда и только тогда, когда a > ${N(-r)}. Ответ: (${N(-r)}; ${r}) ∪ (${r}; +∞).`],proof:proof('Запишите полный ответ интервалами и докажите необходимость и достаточность.',['Вырожденное значение рассмотрено до деления.','В обычном случае корень выражен через a.','Учтена строгая положительность корня.','Исключение a = r сохранено в итоговом множестве.'])};});

add('param-positive-roots',19,'Дискриминант и положительные корни','Согласовать различность, существование и знак корней.',[
'Два различных действительных корня требуют D &gt; 0. Условие D ≥ 0 допускает совпавшие корни.',
'Два действительных корня положительны тогда и только тогда, когда их сумма и произведение положительны.',
'Все найденные ограничения на параметр пересекаются, а не объединяются.'
],[links.parameters],i=>{const m=[2,3,4,5,6,7][i],b=m*(m-1);return {prompt:`При каких a уравнение x² − 2ax + a + ${b} = 0 имеет два различных положительных корня? Запишите все ограничения и их пересечение.`,meta:{family:'positive-roots',m,b},steps:[step('Чему равна нижняя граница a из положительности суммы корней 2a?',0,'Сумма двух положительных чисел положительна.',`Требуется a > 0.`),step(`Дискриминант D = 4(a² − a − ${b}). Найдите больший корень выражения a² − a − ${b}.`,m,`Подберите числа с произведением −${b} и суммой 1.`,`a² − a − ${b} = (a − ${m})(a + ${m-1}).`),step('Какова окончательная строгая нижняя граница a?',m,'Пересеките D > 0, a > 0 и a + b > 0.',`Все три условия выполняются при a > ${m}.`)],final:[field('Строгая нижняя граница a',m),field('Полное множество a',`a>${m}`,`а>${m}`,`${m}<a`,`${m}<а`,`(${m};+∞)`,`(${m};∞)`,`a > ${m}`)],solution:[`D = 4(a − ${m})(a + ${m-1}); D > 0 при a < ${1-m} или a > ${m}.`,`По Виету x₁ + x₂ = 2a > 0 и x₁x₂ = a + ${b} > 0. При a > 0 второе условие выполнено.`,`Пересечение даёт a > ${m}. При a = ${m} корни совпадают, поэтому граница исключена.`],proof:proof('Докажите, что найдены именно два различных положительных корня, а не только действительные.',['Потребовано D > 0.','Записаны сумма и произведение корней.','Ограничения пересечены.','Равенство на границе исключено с объяснением.'])};});

add('param-modules',19,'Модули: полочка и число решений','Не потерять бесконечное множество корней на горизонтальном участке.',[
'Выражение |x − h| + |x + h| — сумма расстояний от x до двух точек.',
'На отрезке [−h; h] эта сумма постоянна и равна 2h. Вне отрезка она строго растёт при удалении от него.',
'Горизонтальный участок графика может дать бесконечно много решений при одном значении параметра.'
],[links.parameters,links.functions],i=>{const h=[2,3,4,5,6,7][i],c=2*h;return {prompt:`Найдите все a, при которых |x − ${h}| + |x + ${h}| = a имеет ровно два действительных решения. Отдельно укажите число решений при граничном значении параметра.`,diagram:modulePicture(h),meta:{family:'modules',h},steps:[step(`Чему равна сумма модулей при −${h} ≤ x ≤ ${h}?`,c,'Между двумя точками сумма расстояний равна расстоянию между ними.',`На всём отрезке значение равно ${c}.`),step(`Сколько решений при a = ${c}?`,['бесконечно много','бесконечность','∞'],'Подходит каждый x из целого отрезка.',`Все x ∈ [−${h}; ${h}] являются корнями.`),step(`Сколько решений при a = ${c+2}?`,2,'Горизонтальная прямая выше полочки пересекает две внешние ветви.',`Получается по одному корню с каждой стороны.`)],final:[field('Множество a для ровно двух решений',`a>${c}`,`а>${c}`,`${c}<a`,`${c}<а`,`(${c};+∞)`,`(${c};∞)`),field('Число решений на границе', 'бесконечно много','бесконечность','∞')],solution:[`При x < −${h} левая часть равна −2x; при −${h} ≤ x ≤ ${h} равна ${c}; при x > ${h} равна 2x.`,`Если a < ${c}, корней нет. Если a = ${c}, корнями является весь отрезок [−${h}; ${h}].`,`При a > ${c} корни x = −a/2 и x = a/2 лежат на разных внешних ветвях. Ответ: a > ${c}.`],proof:proof('Обоснуйте все три случая по a и запишите найденные корни в случае двух решений.',['Модули раскрыты на трёх промежутках.','Полочка рассмотрена отдельно.','Для двух корней проверена принадлежность ветвям.','Граница не включена в ответ.'])};});

add('param-hole',19,'Сокращение дроби и потерянное пересечение','Сохранить исключённую точку после алгебраического сокращения.',[
'Сокращать общий множитель можно только с сохранением исходного запрета знаменателя.',
'График сокращённого выражения без запрещённой точки отличается от полной прямой.',
'Условия на параметр должны учитывать и положение корня, и возможность попадания в дырку.'
],[links.parameters,prereq('Гипербола и область определения','/ege-profil/start/#lesson/fn-hyperbola')],i=>{const h=[2,3,4,5,6,7][i];return {prompt:`Найдите все значения a, при которых уравнение (x² − ${h*h})/(x − ${h}) = a имеет ровно одно положительное решение. Запишите множество параметров в обосновании. Для проверки укажите нижнюю границу и исключённое значение a.`,diagram:holePicture(h),meta:{family:'hole',h},steps:[step('Какое x запрещено исходным знаменателем?',h,'Делить на нуль нельзя независимо от числителя.',`ОДЗ: x ≠ ${h}.`),step(`После сокращения x + ${h} = a. При каком a кандидат x попадёт в запрещённую точку?`,2*h,`Подставьте x = ${h} в сокращённое уравнение.`,`При a = ${2*h} решений исходного уравнения нет.`),step('Какова строгая нижняя граница a для положительного кандидата x?',h,`Из x = a − ${h} требуется x > 0.`,`a > ${h}.`)],final:[field('Нижняя граница a, не включается',h),field('Исключённое значение a',2*h)],solution:[`ОДЗ: x ≠ ${h}. На этой области дробь равна x + ${h}.`,`Единственный кандидат x = a − ${h}. Он положителен при a > ${h} и допустим при a ≠ ${2*h}.`,`Ответ: (${h}; ${2*h}) ∪ (${2*h}; +∞). При a = ${h} корень нулевой; при a = ${2*h} кандидат запрещён.`],proof:proof('Докажите ответ, сохранив ОДЗ после сокращения.', ['Запрет знаменателя записан до сокращения.','Кандидат выражен через a.','Положительность и ОДЗ проверены раздельно.','Обе исключённые граничные ситуации объяснены.'])};});

add('param-tangent',19,'Точное касание прямой и окружности','Перевести единственность решения системы в равенство расстояния и радиуса.',[
'Прямая и окружность имеют одно общее решение при касании.',
'Расстояние от (0; 0) до Ax + By + C = 0 равно |C|/√(A² + B²).',
'На графике почти касающаяся прямая ещё не означает единственное решение: нужны точные значения.'
],[links.parameters,prereq('Векторы и координаты','/ege-profil/start/#exam/2')],i=>{const k=[2,3,4,5,6,7][i],R2=2*k*k;return {prompt:`При каких значениях a система x² + y² = ${R2}, x + y = a имеет ровно одно решение (x; y)? Укажите оба значения параметра и обоснуйте единственность.`,meta:{family:'tangent',k,R2},steps:[step('Чему равен квадрат радиуса окружности?',R2,'В уравнении x² + y² = R² справа записан квадрат радиуса.',`R² = ${R2}.`),step('Какое значение a² следует из условия касания a²/2 = R²?',2*R2,'Квадрат расстояния до прямой x + y − a = 0 равен a²/2.',`a² = ${2*R2}.`),step('Найдите положительное значение параметра.',2*k,'Из квадратного равенства получатся два противоположных значения.',`Положительное значение a = ${2*k}.`)],final:[field('Отрицательное значение a',-2*k),field('Положительное значение a',2*k)],solution:[`Радиус R = √${R2}. Расстояние от центра до прямой равно |a|/√2.`,`Единственное пересечение возможно тогда и только тогда, когда |a|/√2 = √${R2}, то есть a² = ${2*R2}.`,`Ответ: a = ${N(-2*k)} или a = ${2*k}. Точки касания соответственно (${N(-k)}; ${N(-k)}) и (${k}; ${k}). Они действительно удовлетворяют обеим частям системы.`],proof:proof('Докажите, что других значений a с единственным решением нет.', ['Установлена окружность и её центр.','Записано точное расстояние от центра до прямой.','Равенство расстояния радиусу связано с единственностью.','Найдены и проверены оба знака a.'])};});

add('param-system',19,'Система с |x|: считать точки, а не корни замены','Различать число неотрицательных корней замены и число решений исходной системы.',[
'После замены t = |x| нужно сохранить t ≥ 0.',
'Корень t &gt; 0 даёт два значения x: ±t. Корень t = 0 даёт только одно.',
'Для нечётного числа точек системы сначала проверьте возможность t = 0; затем считайте остальные допустимые корни.'
],[links.parameters,links.functions],i=>{const R=[3,4,5,6,7,8][i];return {prompt:`Найдите все a, при которых система x² + y² = ${R*R}, y = |x| + a имеет ровно три различных решения (x; y). Каково наибольшее возможное число её решений при любом a?`,meta:{family:'system',R},steps:[step('Сколько значений x даёт один корень t = |x| > 0?',2,'У положительного модуля два противоположных аргумента.',`Каждый положительный t даёт две точки системы.`),step(`При t = 0 необходимо a² = ${R*R}. Какое отрицательное значение a является кандидатом?`,-R,'Нечётное число решений требует точки с x = 0.',`Проверяем a = ${N(-R)} и a = ${R}.`),step(`При a = ${N(-R)} уравнение для t имеет вид 2t(t − ${R}) = 0. Найдите положительный t.`,R,'Не забывайте, что t = 0 даёт только одну точку.',`t = 0 даёт одну точку, t = ${R} — две: всего три.`)],final:[field('Единственное значение a для трёх решений',-R),field('Наибольшее число решений системы',4)],solution:[`Положим t = |x| ≥ 0. Тогда t² + (t + a)² = ${R*R}, то есть 2t² + 2at + a² − ${R*R} = 0.`,`Для трёх точек необходим t = 0, значит a = ±${R}. При a = ${R} вторым корнем будет −${R}, он недопустим; остаётся одна точка.`,`При a = ${N(-R)} корни t = 0 и t = ${R}. Получаем (0; ${N(-R)}), (${R}; 0), (${N(-R)}; 0): ровно три точки.`,`Квадратное уравнение даёт не более двух положительных t, то есть не более четырёх точек. При a = −6${R===1?'':`·${R}`}/5 оба корня положительны и различны: a² < 2R², a < 0, a² > R². Поэтому максимум четыре достижим.`],proof:proof('Докажите единственность параметра для трёх точек и достижимость максимума.', ['При замене сохранено t ≥ 0.','Для t = 0 и t > 0 правильно посчитаны значения x.','Оба кандидата a = ±R проверены.','Для максимума указаны верхняя оценка и допустимый пример параметра.'])};});

add('numbers-remainders',20,'Остатки: построить все решения','Найти первое число, затем описать весь класс и посчитать его элементы.',[
'Условие остатка r при делении на m записывается n = r + mk.',
'Подстановка в другое сравнение ограничивает k. Для соседних модулей m и m + 1 удобно m ≡ −1 (mod m + 1).',
'После нахождения одного решения докажите период всех решений, а не проверяйте только отдельные примеры.'
],[links.numbers],i=>{const m=[4,5,6,7,8,9][i],r=[1,2,3,2,5,4][i],s=[3,4,1,5,2,7][i],k=((r-s)%(m+1)+(m+1))%(m+1),M=m*(m+1),n=r+m*k,B=2*M+Math.floor(M/2),count=Math.floor((B-n)/M)+1;return {prompt:`Натуральное число n при делении на ${m} даёт остаток ${r}, а при делении на ${m+1} — остаток ${s}. Найдите наименьшее такое число и количество таких чисел, не превосходящих ${B}. Опишите все решения.`,meta:{family:'remainders',m,r,s,B},steps:[step(`Пусть n = ${r} + ${m}k. Найдите наименьший неотрицательный остаток k при делении на ${m+1}.`,k,`По модулю ${m+1} имеем ${m} ≡ −1, поэтому ${r} − k ≡ ${s}.`,`k ≡ ${k} (mod ${m+1}).`),step('Найдите наименьшее подходящее натуральное n.',n,'Подставьте наименьший допустимый k.',`Первое число n = ${n}.`),step('Каков шаг между соседними подходящими числами?',M,'Модули соседние, их наименьшее общее кратное равно произведению.',`Все решения: n = ${n} + ${M}t, t = 0, 1, 2, …`)],final:[field('Наименьшее число n',n),field(`Количество решений n ≤ ${B}`,count)],solution:[`n = ${r} + ${m}k. По модулю ${m+1}: ${r} − k ≡ ${s}, поэтому k = ${k} + ${m+1}t.`,`n = ${n} + ${M}t. Поскольку 0 < ${n} < ${M}, натуральным решениям соответствуют t ≥ 0.`,`Условие n ≤ ${B} даёт t ≤ ⌊(${B} − ${n})/${M}⌋ = ${count-1}. Чисел ${count}.`],proof:proof('Докажите, что ваша формула описывает все натуральные решения.', ['Оба остатка переведены в сравнения.','Получено условие на k.','Показана необходимость и достаточность общей формулы.','При подсчёте учтено первое значение t = 0.'])};});

add('numbers-digits',20,'Цифры: уравнения и допустимые границы','Перевести запись числа в алгебру и не потерять ограничения на цифры.',[
'Двузначное число с цифрами a и b равно 10a + b, где 1 ≤ a ≤ 9, 0 ≤ b ≤ 9.',
'После перестановки получается 10b + a; при b = 0 запись может стать однозначной, что нужно оговорить.',
'Уравнение для цифр решают вместе с целочисленностью и диапазонами.'
],[links.numbers],i=>{const A=[6,7,8,9,8,9][i],b=[2,3,5,4,6,7][i],s=A+b,d=A-b,Nn=10*A+b,count=s<=9?s:19-s;return {prompt:`У двузначного числа N сумма цифр равна ${s}. Если поменять цифры местами, исходное число уменьшится на ${9*d}. Найдите N. Сколько всего двузначных чисел имеют сумму цифр ${s} (без условия про перестановку)?`,meta:{family:'digits',A,b,s,d},steps:[step('Чему равна разность цифры десятков и цифры единиц?',d,'Разность 10a + b − (10b + a) равна 9(a − b).',`a − b = ${d}.`),step(`Из a + b = ${s} и a − b = ${d} найдите a.`,A,'Сложите два уравнения.',`a = ${A}, b = ${b}.`),step('Какова наименьшая допустимая цифра десятков для суммы цифр из условия?',Math.max(1,s-9),'Учитывайте b ≤ 9 и a ≥ 1.',`a начинается с ${Math.max(1,s-9)} и заканчивается на ${Math.min(9,s)}.`)],final:[field('Исходное число N',Nn),field('Всего двузначных чисел с указанной суммой цифр',count)],solution:[`N = 10a + b, a + b = ${s}, 9(a − b) = ${9*d}. Отсюда a = ${A}, b = ${b}, N = ${Nn}.`,`Обе цифры допустимы, при перестановке получается ${10*b+A}; разность действительно ${9*d}.`,`Для одной только суммы цифр a может принимать все целые значения от ${Math.max(1,s-9)} до ${Math.min(9,s)}, каждому соответствует единственная b = ${s} − a. Всего ${count}.`],proof:proof('Покажите единственность первого числа и полноту подсчёта во втором пункте.', ['Число записано как 10a + b.','Учтён порядок цифр при перестановке.','Проверены диапазоны и целочисленность цифр.','Каждому допустимому a сопоставлено ровно одно b.'])};});

add('numbers-extremum',20,'Оценка и достигающий её пример','Соединить верхнюю оценку с конструкцией целых чисел.',[
'В задаче на максимум недостаточно предъявить хороший пример: нужна оценка для всех допустимых наборов.',
'Для двух чисел с суммой S: 4xy = S² − (x − y)². Чем ближе числа, тем больше произведение.',
'У целых чисел чётность суммы ограничивает наименьшую возможную разность.'
],[links.numbers],i=>{const S=[15,18,21,24,27,30][i],x=Math.floor(S/2),y=Math.ceil(S/2),P=x*y;return {prompt:`Два положительных целых числа x ≤ y имеют сумму ${S}. Найдите наибольшее возможное произведение xy и пару, на которой оно достигается. Докажите, что большего произведения быть не может.`,meta:{family:'extremum',S},steps:[step('Какова наименьшая возможная неотрицательная разность y − x с учётом чётности суммы?',S%2,'Сумма и разность двух целых имеют одинаковую чётность.',`Наименьшая разность равна ${S%2}.`),step('Найдите меньшее число в паре с этой разностью.',x,'Решите систему на сумму и разность.',`x = ${x}, y = ${y}.`),step('Вычислите произведение найденной пары.',P,'Этого ещё мало: в доказательстве потребуется верхняя оценка.',`Произведение равно ${P}.`)],final:[field('Наибольшее произведение',P),field('Меньшее число x',x),field('Большее число y',y)],solution:[`4xy = (x + y)² − (y − x)² = ${S*S} − (y − x)².`,`Разность y − x неотрицательна и имеет ту же чётность, что ${S}; значит, (y − x)² ≥ ${S%2}. Поэтому xy ≤ ${P}.`,`Пара (${x}; ${y}) состоит из положительных целых, имеет сумму ${S} и произведение ${P}. Оценка достигнута, максимум доказан.`],proof:proof('Дайте верхнюю оценку для произвольной пары и отдельный пример достижения.', ['Оценка справедлива для всех пар, а не только для примеров.','Использована целочисленность или чётность.','Пара достижения удовлетворяет всем ограничениям.','Оценка и значение примера совпадают.'])};});

add('numbers-counterexample',20,'Контрпример: опровергнуть общее утверждение','Отличать проверку нескольких значений от доказательства для всех.',[
'Чтобы опровергнуть утверждение «для каждого n», достаточно одного допустимого контрпримера.',
'Чтобы доказать минимальность контрпримера по специальному свойству, нужно исключить все меньшие n.',
'Если простое q делит n(n + 1), то q делит хотя бы один из соседних множителей.'
],[links.numbers],i=>{const q=[3,5,7,11,13,17][i],n=q-1,value=q*q;return {prompt:`Ученик предположил, что n² + n + ${q} — простое число при каждом натуральном n. Число ${q} простое. Найдите наименьшее натуральное n, при котором выражение делится на ${q}, и используйте его как контрпример. Минимальность требуется именно для делимости на ${q}, а не для составности вообще.`,meta:{family:'counterexample',q},steps:[step(`Какой наименьший положительный остаток n даёт n + 1 ≡ 0 по модулю ${q}?`,n,'Один из соседних множителей n и n + 1 должен делиться на простое q.',`Подходит n = ${n}.`),step('Вычислите значение выражения при найденном n.',value,`Подставьте n = ${n}.`,`Получается ${q}² = ${value}.`),step('Назовите собственный делитель полученного числа, отличный от 1.',q,'Это квадрат простого числа.',`1 < ${q} < ${value}, поэтому число составное.`)],final:[field('Наименьшее n с делимостью на указанное простое',n),field('Значение выражения в контрпримере',value)],solution:[`По модулю ${q}: n² + n + ${q} ≡ n(n + 1). Так как ${q} простое, делимость равносильна n ≡ 0 или n ≡ −1 (mod ${q}).`,`Наименьшее натуральное n с этим свойством равно ${q} − 1 = ${n}. Для 1 ≤ n < ${n} ни n, ни n + 1 на ${q} не делятся.`,`При n = ${n} выражение равно ${value} = ${q}² и составно. Поэтому общее утверждение неверно. Более ранние составные значения, если есть, не влияют на заявленную минимальность по делимости.`],proof:proof('Опровергните утверждение и отдельно докажите указанную минимальность.', ['Контрпример использует натуральное n.','Указан собственный делитель значения.','Простота q использована корректно.','Минимальность по делимости не перепутана с минимальностью по составности.'])};});

add('numbers-invariant',20,'Инвариант: результат не зависит от порядка','Найти величину, изменение которой заранее известно.',[
'Если два числа заменяют одним, число записей уменьшается на один независимо от выбранной пары.',
'Проследите, как меняется сумма за одну операцию. Затем посчитайте число операций.',
'Это даёт доказательство для любого порядка действий; один разыгранный пример такого доказательства не заменяет.'

function create(storage,options={}){

 });

function parseEndpoint(raw,interval){

   if(rootList||points){
    for(const raw of (points?.[1]??term).split(';')){
     const point=parseEndpoint(raw,false);

    }

   }
   const interval=/^\s*([[(])([^;]+);([^;]+)([)\]])\s*$/.exec(term);

   if(lo===null||hi===null||lo===Infinity||hi===-Infinity||lo===-Infinity&&left||hi===Infinity&&right||compare(lo,hi)>0)return null;

  }
  spans.sort((a,b)=>compare(a.lo,b.lo)||Number(b.left)-Number(a.left));
  const joined=[];

   const last=joined.at(-1),overlap=last?compare(span.lo,last.hi):1;

 });

  ?'Одна из записанных точек обращает исходный знаменатель в нуль. Подставьте каждый кандидат в исходное уравнение.'

    14: { title: 'Отбор корней: сколько оборотов входит?', question: 'Сколько корней sin x = 1/2 попадёт в [0; 3π]?', choices: ['2','3','4'], answer: '4', initial: 1, min: 1, max: 4, step: 1, parameter: 'Правый конец интервала, в долях π', target: 'Поставьте правый конец 3π и пересчитайте отмеченные корни.', explanation: 'За один оборот есть два положения с sin x = 1/2. Важно отсчитывать угол, а не считать разные точки на окружности: одна точка может появиться после нового оборота.', transfer: 'Теперь sin x = √2/2. Сколько корней в [0; 2π]?', transferAnswers: [2], transferWhy: 'В одном полном обороте подходят π/4 и 3π/4: два корня.' },

  function parameter(exam, value) {

  function scene(exam, value) {

    if(exam===14){

      drawing+='<polyline points="'+[[-2.3,4.6],[-1,2],[1,2],[2.3,4.6]].map(([x,y])=>X(x)+','+Y(y)).join(' ')+'" fill="none" stroke="#087f6b" stroke-width="3"/>'+line(X(-3.3),Y(v.p),X(3.3),Y(v.p),'#b04431');

  function cleanRecord(value,lab){
    if(!value||typeof value!=='object'||Array.isArray(value)||value.version!==1)return null;
    const validAttempt=a=>a&&typeof a==='object'&&!Array.isArray(a)&&typeof a.value==='string'&&a.value.length<=120&&typeof a.correct==='boolean';

  }
  function createStore(exam,storage){
    const lab={...labs[exam],exam};if(!labs[exam])throw Error('Unknown exploration');
    const empty=()=>({version:1,p:lab.initial,changed:false,prediction:null,transferFirst:null,transferLast:null,draft:''});
    let record=empty(),warning='',blocked=false;

      let current=record;
      if(!blocked&&storage)try{current=read();}catch(_){blocked=true;warning='Запись исследования изменилась и не читается. Она сохранена без изменений.';}

(lab.transferWhy):'Пока не совпало. Проверьте, какая связь сохранилась в новом условии.'):'')+'</p><p data-lab-transfer-first class="small">'+(r.transferFirst?'Первая попытка переноса: '+esc(r.transferFirst.value)+(r.transferFirst.correct?' — верно.':' — потребовалось исправление.'):'')+'</p></form></div><p data-lab-warning role="status">'+esc(store.warning)+'</p></section>';

    }

    return()=>{active=false;root.removeEventListener?.('storage',storageChange);container.innerHTML='';};
  }
  const api={labs,evaluate,scene,createStore,mount};root.ProfilePartTwoLabs=api;if(typeof module!=='undefined'&&module.exports)module.exports=api;
