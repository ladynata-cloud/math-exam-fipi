</style></head><body><header class="topbar"><button id="home" class="brand">MathExam / Стереометрия</button><nav class="toplinks"><a href="../geometry-course/index.html">Геометрия 7–9</a><button id="export-progress">Скачать прогресс</button></nav></header><div class="container"><p id="storage-notice" class="warning" role="alert" hidden></p><main id="app"></main><footer>Авторские объяснения и задачи по темам учебника Атанасяна и др., 10–11 классы, 2024. Исследование модели помогает построить догадку; общее доказательство требует рассуждения. Сохраните файл прогресса для переноса на другое устройство.</footer></div><script>window.STEREO_COURSE={"edition": "Атанасян и др., Геометрия 10–11, базовый и углублённый уровни, 12-е издание, 2024", "chapters": ["Введение", "Параллельность", "Перпендикулярность", "Многогранники", "Цилиндр, конус и шар", "Объёмы тел", "Векторы", "Координаты и движения", "Планиметрия: углубление"], "units": [{"id": "space", "points": [1, 2, 3], "title": "Как устроено пространство", "kind": "box", "task": "incidence", "idea": "Через три точки, не лежащие на одной прямой, проходит единственная плоскость. Если две точки прямой принадлежат плоскости, то вся прямая принадлежит ей. Общая часть двух различных пересекающихся плоскостей — прямая.", "investigate": "Двигай ракурс куба. Выбери три вершины одной грани и задай плоскость. Затем выбери три вершины, которые задают диагональное сечение.", "pitfall": "Три точки на одной прямой не определяют единственную плоскость. Видимое пересечение линий на экране не обязательно является их пересечением в пространстве.", "source": [{"point": 1, "chapter": 0, "advanced": false, "title": "Предмет стереометрии", "page": 3}, {"point": 2, "chapter": 0, "advanced": false, "title": "Аксиомы стереометрии", "page": 4}, {"point": 3, "chapter": 0, "advanced": false, "title": "Некоторые следствия из аксиом", "page": 6}], "chapter": 0, "advanced": false}, {"id": "parallel", "points": [4, 5, 6], "title": "Прямая и плоскость: параллельно — чему?", "kind": "box", "task": "parallel", "idea": "Параллельные прямые лежат в одной плоскости и не пересекаются. Прямая параллельна плоскости, если общих точек нет. Признак: прямая вне плоскости параллельна некоторой прямой этой плоскости. Условие «вне» существенно: прямая может лежать в плоскости.", "investigate": "Сравни AB, A₁B₁ и плоскость ABC. Проведи отрезок A₁B₁ и плоскость ABC. Измени высоту параллелепипеда.", "pitfall": "Параллельность одной прямой в плоскости не исключает принадлежность самой плоскости. Сначала установи, есть ли общая точка.", "source": [{"point": 4, "chapter": 1, "advanced": false, "title": "Параллельные прямые в пространстве", "page": 9}, {"point": 5, "chapter": 1, "advanced": false, "title": "Параллельность трёх прямых", "page": 10}, {"point": 6, "chapter": 1, "advanced": false, "title": "Параллельность прямой и плоскости", "page": 11}], "chapter": 1, "advanced": false}, {"id": "skew", "points": [7, 8, 9], "title": "Скрещивающиеся прямые и настоящий угол", "kind": "box", "task": "skew", "idea": "Скрещивающиеся прямые не лежат в одной плоскости. Для угла между ними одну мысленно переносят параллельно самой себе до пересечения с другой. Угол между прямыми выбирают от 0° до 90°; угол между направленными векторами может быть тупым.", "investigate": "Исследуй AB и CC₁. Они не пересекаются и не параллельны. Выбери их четыре конца и нажми «Измерить углы и расстояние». Вращай тело: результат не меняется.", "pitfall": "Нельзя измерять угол скрещивающихся прямых транспортиром на перспективном рисунке. Положение линий на экране и пространственный угол различны.", "source": [{"point": 7, "chapter": 1, "advanced": false, "title": "Скрещивающиеся прямые", "page": 15}, {"point": 8, "chapter": 1, "advanced": false, "title": "Углы с сонаправленными сторонами", "page": 17}, {"point": 9, "chapter": 1, "advanced": false, "title": "Угол между прямыми", "page": 18}], "chapter": 1, "advanced": false}, {"id": "parallel-planes", "points": [10, 11], "title": "Две параллельные плоскости", "kind": "box", "task": "plane-parallel", "idea": "Если две пересекающиеся прямые одной плоскости соответственно параллельны двум пересекающимся прямым другой, то плоскости параллельны при их различии. Сечения двух параллельных плоскостей третьей дают параллельные линии.", "investigate": "Задай плоскость через A₁,B₁,C₁. Сравни её с ABC. Меняй высоту и исследуй параллельные рёбра.", "pitfall": "Одна пара параллельных прямых недостаточна: пересекающиеся плоскости тоже могут содержать такие прямые.", "source": [{"point": 10, "chapter": 1, "advanced": false, "title": "Параллельные плоскости", "page": 21}, {"point": 11, "chapter": 1, "advanced": false, "title": "Свойства параллельных плоскостей", "page": 22}], "chapter": 1, "advanced": false}, {"id": "polyhedra", "points": [12, 13], "title": "Тетраэдр и параллелепипед изнутри", "kind": "tetrahedron", "task": "euler", "idea": "У тетраэдра четыре треугольные грани, шесть рёбер и четыре вершины. Параллелепипед образован шестью параллелограммами; противоположные грани равны и параллельны, пространственные диагонали пересекаются и делятся пополам.", "investigate": "Поверни тетраэдр, найди каждое ребро. Создай точки на трёх рёбрах и задай секущую плоскость. Сколько сторон может иметь сечение?", "pitfall": "Тетраэдр не обязательно правильный. Равенство всех шести рёбер — дополнительное условие, которое нельзя считывать по виду картинки.", "source": [{"point": 12, "chapter": 1, "advanced": false, "title": "Тетраэдр", "page": 25}, {"point": 13, "chapter": 1, "advanced": false, "title": "Параллелепипед", "page": 26}], "chapter": 1, "advanced": false, "proof": "section"}, {"id": "sections", "points": [14], "title": "Построить сечение, а не угадать его", "kind": "box", "task": "section", "idea": "Каждая сторона сечения лежит одновременно в секущей плоскости и в грани тела. Две точки на одной грани можно соединить. На соседнюю грань переходят через её общее ребро; при необходимости продолжают прямые и используют параллельность.", "investigate": "Добавь M на AA₁, N на BB₁ и P на DD₁. Задай плоскость MNP. Контур сначала скрыт: соедини по граням точки X₁, X₂ и далее, замкни его и проверь.", "pitfall": "Соединение любых двух отмеченных точек может дать диагональ сечения, а не его сторону. Для каждой линии называй грань, на которой она лежит.", "source": [{"point": 14, "chapter": 1, "advanced": false, "title": "Задачи на построение сечений", "page": 28}], "chapter": 1, "advanced": false}, {"id": "perpendicular", "points": [15, 16, 17, 18], "title": "Почему двух направлений достаточно", "kind": "box", "task": "perpendicular", "idea": "Прямая перпендикулярна плоскости, если перпендикулярна любой прямой в ней. Для проверки достаточно двух пересекающихся прямых плоскости. Через данную точку проходит единственная прямая, перпендикулярная данной плоскости.", "investigate": "Задай плоскость ABC и опусти перпендикуляр из A₁. Проверь углы AA₁ с AB и AD. Увеличь a и b: вертикальное направление сохраняется.", "pitfall": "Перпендикулярности одной прямой недостаточно. Две проверяемые прямые должны пересекаться, а не быть параллельными.", "source": [{"point": 15, "chapter": 2, "advanced": false, "title": "Перпендикулярные прямые в пространстве", "page": 36}, {"point": 16, "chapter": 2, "advanced": false, "title": "Параллельные прямые, перпендикулярные к плоскости", "page": 36}, {"point": 17, "chapter": 2, "advanced": false, "title": "Признак перпендикулярности прямой и плоскости", "page": 38}, {"point": 18, "chapter": 2, "advanced": false, "title": "Теорема о прямой, перпендикулярной к плоскости", "page": 40}], "chapter": 2, "advanced": false}, {"id": "projection", "points": [19, 20, 21], "title": "Наклонная, проекция и три перпендикуляра", "kind": "box", "task": "projection", "idea": "Расстояние до плоскости — длина перпендикуляра. Наклонная, её проекция и перпендикуляр образуют прямоугольный треугольник. Прямая плоскости, перпендикулярная проекции наклонной, перпендикулярна и самой наклонной; верно обратное утверждение.", "investigate": "Задай плоскость ABC, опусти перпендикуляр из C₁ и проведи AC₁. Найди угол AC₁ с плоскостью. Назови его плоский треугольник.", "pitfall": "Угол наклонной с плоскостью строят с её проекцией, а не с произвольной линией основания. Для перпендикуляра угол с плоскостью равен 90°.", "source": [{"point": 19, "chapter": 2, "advanced": false, "title": "Расстояние от точки до плоскости", "page": 43}, {"point": 20, "chapter": 2, "advanced": false, "title": "Теорема о трёх перпендикулярах", "page": 44}, {"point": 21, "chapter": 2, "advanced": false, "title": "Угол между прямой и плоскостью", "page": 45}], "chapter": 2, "advanced": false}, {"id": "dihedral", "points": [22, 23], "title": "Двугранный угол: найти правильный разрез", "kind": "pyramid", "task": "dihedral", "idea": "Линейный угол двугранного угла образован двумя лучами в его гранях, перпендикулярными ребру и выходящими из одной точки ребра. Чтобы найти угол плоскостей, удобно рассечь их плоскостью, перпендикулярной общей прямой.", "investigate": "Для правильной пирамиды поставь M в середину AB. Соедини S с M. Высота SO и отрезок OM к середине основания образуют нужное нормальное сечение; O можно получить как середину диагонали основания в рассуждении.", "pitfall": "Угол между произвольно взятыми рёбрами граней не является линейным углом двугранного угла. Сначала докажи обе перпендикулярности к общему ребру.", "source": [{"point": 22, "chapter": 2, "advanced": false, "title": "Двугранный угол", "page": 50}, {"point": 23, "chapter": 2, "advanced": false, "title": "Признак перпендикулярности двух плоскостей", "page": 52}], "chapter": 2, "advanced": false}, {"id": "box", "points": [24], "title": "Диагональ пространства — два Пифагора", "kind": "box", "task": "box-diagonal", "idea": "В прямоугольном параллелепипеде квадрат диагонали равен сумме квадратов трёх измерений: d²=a²+b²+h². Сначала находят диагональ основания, затем используют прямоугольный треугольник с высотой.", "investigate": "Проведи AC и AC₁. Сравни их при разных высотах. Чем пространственная диагональ отличается от диагонали грани?", "pitfall": "Формула для прямоугольного параллелепипеда не переносится на произвольный наклонный параллелепипед без поправок на углы.", "source": [{"point": 24, "chapter": 2, "advanced": false, "title": "Прямоугольный параллелепипед", "page": 53}], "chapter": 2, "advanced": false, "proof": "box-diagonal"}, {"id": "solid-angle", "points": [25, 26], "title": "Трёхгранный и многогранный углы", "kind": "tetrahedron", "task": "solid-angle", "idea": "У трёхгранного угла три плоских угла между рёбрами и три двугранных угла между гранями. Каждый плоский угол меньше суммы двух других. Сумма плоских углов выпуклого многогранного угла меньше 360°.", "investigate": "Поверни тетраэдр вокруг одной вершины. Назови три плоских угла и отличи их от трёх двугранных.", "pitfall": "Нельзя применять сумму 180° ко всем углам пространственной вершины. Она относится к углам плоского треугольника.", "source": [{"point": 25, "chapter": 2, "advanced": true, "title": "Трёхгранный угол", "page": 55}, {"point": 26, "chapter": 2, "advanced": true, "title": "Многогранный угол", "page": 56}], "chapter": 2, "advanced": true}, {"id": "euler", "points": [27, 28, 29], "title": "Поверхность, тело и формула Эйлера", "kind": "octahedron", "task": "euler", "idea": "Многогранная поверхность отделяет внутреннюю область от внешней; вместе с внутренними точками она задаёт тело. Для выпуклого многогранника В−Р+Г=2. В формуле считают вершины, рёбра и грани всего тела, включая невидимые.", "investigate": "Пересчитай элементы октаэдра: 6 вершин, 12 рёбер и 8 граней. Вращение поможет не пропустить нижние грани.", "pitfall": "Формула Эйлера с правой частью 2 не универсальна для поверхностей с отверстиями. Условия о типе поверхности существенны.", "source": [{"point": 27, "chapter": 3, "advanced": false, "title": "Понятие многогранника", "page": 63}, {"point": 28, "chapter": 3, "advanced": true, "title": "Геометрическое тело", "page": 64}, {"point": 29, "chapter": 3, "advanced": true, "title": "Теорема Эйлера", "page": 65}], "chapter": 3, "advanced": false}, {"id": "prism", "points": [30, 31], "title": "Призма: высота и боковое ребро", "kind": "prism", "task": "prism", "idea": "Основания призмы — равные многоугольники в параллельных плоскостях; боковые грани — параллелограммы. У прямой призмы боковое ребро равно высоте, боковая поверхность равна периметру основания, умноженному на высоту. В пространственной теореме Пифагора для трёхгранного прямого угла сумма квадратов площадей трёх прямоугольных граней равна квадрату площади противоположной грани.", "investigate": "Построй сечение параллельно основаниям треугольной призмы. Сравни его при разных уровнях.", "pitfall": "Высота наклонной призмы — расстояние между основаниями, а не наклонное боковое ребро. Квадраты площадей нельзя путать с квадратами длин.", "source": [{"point": 30, "chapter": 3, "advanced": false, "title": "Призма", "page": 67}, {"point": 31, "chapter": 3, "advanced": true, "title": "Пространственная теорема Пифагора", "page": 68}], "chapter": 3, "advanced": false}, {"id": "pyramid", "points": [32, 33], "title": "Высота, ребро и апофема пирамиды", "kind": "pyramid", "task": "pyramid", "idea": "В правильной пирамиде основание правильное, а вершина проектируется в его центр. Высота идёт к центру, боковое ребро — к вершине основания, апофема — к середине стороны основания. Боковая площадь равна половине произведения периметра основания на апофему.", "investigate": "Поставь M в середину AB, проведи SM и SA. Меняй высоту: апофема и боковое ребро изменяются по-разному.", "pitfall": "В формуле боковой площади участвует апофема, не высота пирамиды. Прямоугольные треугольники для этих длин имеют разные вторые катеты.", "source": [{"point": 32, "chapter": 3, "advanced": false, "title": "Пирамида", "page": 72}, {"point": 33, "chapter": 3, "advanced": false, "title": "Правильная пирамида", "page": 73}], "chapter": 3, "advanced": false}, {"id": "pyramid-frustum", "points": [34], "title": "Усечённая пирамида и подобие", "kind": "frustum", "task": "frustum", "idea": "Плоскость, параллельная основанию пирамиды, отсекает подобную меньшую пирамиду. Коэффициент линейных размеров k равен отношению расстояний от вершины; площади меняются в k² раз, объёмы — в k³ раз. У правильной усечённой пирамиды Sбок=(P₁+P₂)l/2.", "investigate": "Исследуй усечённую четырёхугольную пирамиду. Меняй диаметры оснований a,b и высоту h. Восстанови мысленно исходную вершину.", "pitfall": "Верхнее и нижнее основания обязаны быть параллельными сечениями одной пирамиды. Две произвольные похожие фигуры не задают усечённую пирамиду.", "source": [{"point": 34, "chapter": 3, "advanced": false, "title": "Усечённая пирамида", "page": 74}], "chapter": 3, "advanced": false, "proof": "frustum"}, {"id": "symmetry", "points": [35, 36, 37], "title": "Правильные многогранники и симметрия", "kind": "octahedron", "task": "regular", "idea": "Правильный многогранник выпуклый, все его грани — равные правильные многоугольники, в каждой вершине сходится одно число граней. Существуют тетраэдр, куб, октаэдр, додекаэдр и икосаэдр. Симметрия может быть центральной, осевой или относительно плоскости.", "investigate": "У октаэдра найди плоскость симметрии через четыре вершины. Сравни фигуру с отражением, поворачивая ракурс.", "pitfall": "Равные рёбра сами по себе не определяют правильный многогранник. Нужны условия на грани и вершины. При произвольном изменении высоты модель октаэдра перестаёт быть правильной.", "source": [{"point": 35, "chapter": 3, "advanced": false, "title": "Симметрия в пространстве", "page": 78}, {"point": 36, "chapter": 3, "advanced": false, "title": "Понятие правильного многогранника", "page": 80}, {"point": 37, "chapter": 3, "advanced": false, "title": "Элементы симметрии правильных многогранников", "page": 83}], "chapter": 3, "advanced": false}, {"id": "cylinder", "points": [38, 39], "title": "Цилиндр: развёртка и поверхность", "kind": "cylinder", "task": "cylinder-area", "idea": "В прямом круговом цилиндре образующая равна высоте. Развёртка боковой поверхности — прямоугольник со сторонами 2πr и h. Поэтому Sбок=2πrh, Sполн=2πrh+2πr².", "investigate": "Изменяй диаметр a и высоту. Поставь секущую плоскость горизонтально, вертикально и наклонно. Различай круг, прямоугольное осевое сечение и криволинейное наклонное сечение.", "pitfall": "В боковую площадь не входят два основания. Диаметр a на модели вдвое больше радиуса r в формуле.", "source": [{"point": 38, "chapter": 4, "advanced": false, "title": "Понятие цилиндра", "page": 89}, {"point": 39, "chapter": 4, "advanced": false, "title": "Площадь поверхности цилиндра", "page": 91}], "chapter": 4, "advanced": false}, {"id": "cone", "points": [40, 41], "title": "Конус: три длины одного сечения", "kind": "cone", "task": "cone-area", "idea": "Осевое сечение прямого кругового конуса — равнобедренный треугольник. В его половине l²=h²+r². Боковая поверхность разворачивается в сектор радиуса l, длина дуги которого 2πr; Sбок=πrl.", "investigate": "Меняй h и диаметр a. Поставь плоскость через ось и проверь, где находятся высота, радиус и образующая.", "pitfall": "Образующая l не равна высоте h. При вычислении полной площади к боковой добавляется одно основание.", "source": [{"point": 40, "chapter": 4, "advanced": false, "title": "Понятие конуса", "page": 94}, {"point": 41, "chapter": 4, "advanced": false, "title": "Площадь поверхности конуса", "page": 95}], "chapter": 4, "advanced": false}, {"id": "cone-frustum", "points": [42], "title": "Два радиуса усечённого конуса", "kind": "cone-frustum", "task": "cone-frustum", "idea": "У усечённого конуса два параллельных круглых основания радиусов R,r. Образующая l удовлетворяет l²=h²+(R−r)². Боковая площадь равна π(R+r)l.", "investigate": "Меняй a,b,h и сравни разность радиусов с разностью диаметров. Найди вертикальный разрез через ось.", "pitfall": "В формуле для образующей участвует разность радиусов, не их сумма и не разность диаметров.", "source": [{"point": 42, "chapter": 4, "advanced": false, "title": "Усечённый конус", "page": 96}], "chapter": 4, "advanced": false}, {"id": "sphere", "points": [43, 44, 45, 46, 47], "title": "Сфера, шар и сечение плоскостью", "kind": "sphere", "task": "sphere-cut", "idea": "Сфера — поверхность точек на расстоянии R от центра; шар включает внутренние точки. Если расстояние d от центра до плоскости меньше R, сечение шара — круг радиуса ρ=√(R²−d²); при d=R плоскость касательная, при d>R общих точек нет. Аналогичная проверка расстояния от центра до прямой определяет её пересечения со сферой.", "investigate": "Перемещай секущую плоскость через шар. Найди большой круг, касание и положение без пересечения. Затем наклони плоскость.", "pitfall": "Площадь сферы 4πR² и площадь большого круга πR² различны. В сечении сферы получается окружность, в сечении шара — круг.", "source": [{"point": 43, "chapter": 4, "advanced": false, "title": "Сфера и шар", "page": 100}, {"point": 44, "chapter": 4, "advanced": false, "title": "Взаимное расположение сферы и плоскости", "page": 101}, {"point": 45, "chapter": 4, "advanced": false, "title": "Касательная плоскость к сфере", "page": 102}, {"point": 46, "chapter": 4, "advanced": false, "title": "Площадь сферы", "page": 103}, {"point": 47, "chapter": 4, "advanced": true, "title": "Взаимное расположение сферы и прямой", "page": 104}], "chapter": 4, "advanced": false, "proof": "sphere-cut"}, {"id": "inscribed-sphere", "points": [48, 49], "title": "Вписанная сфера: задача в осевом сечении", "kind": "cone", "task": "insphere", "idea": "Сфера внутри цилиндрической поверхности касается её, когда расстояние её центра до оси плюс радиус сферы равно радиусу цилиндра; для сферы с центром на оси радиусы совпадают. Для сферы, вписанной в прямой круговой конус и касающейся основания, центр лежит на оси. В осевом сечении задача сводится к вписанной окружности равнобедренного треугольника: rсф=Rh/(R+l).", "investigate": "Поверни конус, поставь вертикальное сечение через ось. Найди треугольник, к которому относится формула вписанной окружности.", "pitfall": "«Вписана в коническую поверхность» без касания основания и «вписана в конечный конус» — разные условия. Для последнего используются обе границы.", "source": [{"point": 48, "chapter": 4, "advanced": true, "title": "Сфера, вписанная в цилиндрическую поверхность", "page": 105}, {"point": 49, "chapter": 4, "advanced": true, "title": "Сфера, вписанная в коническую поверхность", "page": 106}], "chapter": 4, "advanced": true}, {"id": "conic-sections", "points": [50, 51], "title": "Почему появляются эллипс и гипербола", "kind": "cone", "task": "conic", "idea": "Наклонное сечение цилиндрической поверхности плоскостью, не параллельной её оси, является эллипсом. Для полной двойной конической поверхности характер сечения зависит от наклона: эллипс, парабола или гипербола; проход через вершину даёт вырожденные случаи.", "investigate": "Наклоняй плоскость на конечной модели конуса. Заметь, где кривая обрезается основанием. Мысленно продолжи образующие за вершину и основание.", "pitfall": "Конечный конус показывает лишь часть кривой. Нельзя по обрезанному контуру заключать, что гипербола является замкнутой фигурой.", "source": [{"point": 50, "chapter": 4, "advanced": true, "title": "Сечения цилиндрической поверхности", "page": 107}, {"point": 51, "chapter": 4, "advanced": true, "title": "Сечения конической поверхности", "page": 108}], "chapter": 4, "advanced": true}, {"id": "box-volume", "points": [52, 53], "title": "Объём как число кубических единиц", "kind": "box", "task": "box-volume", "idea": "Объём прямоугольного параллелепипеда V=abh. Формула продолжает подсчёт единичных кубиков на произвольные положительные длины. При увеличении всех размеров в k раз объём меняется в k³ раз.", "investigate": "Удвой по очереди один, два и три размера. Сравни изменение объёма с изменением площади поверхности.", "pitfall": "1 м³=1000000 см³. Коэффициент перевода длины возводится в третью степень, а не просто умножается на три.", "source": [{"point": 52, "chapter": 5, "advanced": false, "title": "Понятие объёма", "page": 116}, {"point": 53, "chapter": 5, "advanced": false, "title": "Объём прямоугольного параллелепипеда", "page": 118}], "chapter": 5, "advanced": false}, {"id": "prism-volume", "points": [54, 55], "title": "Объём призмы и цилиндра", "kind": "cylinder", "task": "cylinder-volume", "idea": "У прямой призмы и цилиндра все сечения параллельно основаниям равны основанию. Объём равен Sосн·h. Для цилиндра это πr²h.", "investigate": "Перемещай горизонтальную плоскость по цилиндру: площадь сечения постоянна. Измени высоту при неизменном радиусе.", "pitfall": "Формула использует площадь основания, не его периметр. Высота измеряется перпендикулярно основаниям.", "source": [{"point": 54, "chapter": 5, "advanced": false, "title": "Объём прямой призмы", "page": 121}, {"point": 55, "chapter": 5, "advanced": false, "title": "Объём цилиндра", "page": 122}], "chapter": 5, "advanced": false}, {"id": "slices", "points": [56, 57], "title": "Слои, интеграл и наклонная призма", "kind": "prism", "task": "cavalieri", "idea": "Если площадь поперечного сечения на высоте z равна A(z), то объём выражается интегралом A(z) по высоте. У наклонной призмы сечения, параллельные основанию, имеют постоянную площадь, поэтому V=Sосн·h. Наклон не меняет объём при прежних основании и высоте.", "investigate": "Перемещай горизонтальный уровень по прямой призме. Это модель постоянства площади сечений; для наклонной призмы обоснуй равенство сечений переносом.", "pitfall": "Боковое ребро наклонной призмы длиннее высоты. В формулу объёма нельзя подставлять его вместо расстояния между основаниями.", "source": [{"point": 56, "chapter": 5, "advanced": false, "title": "Вычисление объёмов тел с помощью определённого интеграла", "page": 125}, {"point": 57, "chapter": 5, "advanced": false, "title": "Объём наклонной призмы", "page": 126}], "chapter": 5, "advanced": false, "proof": "pyramid-volume"}, {"id": "pyramid-volume", "points": [58, 59], "title": "Откуда берётся одна треть", "kind": "pyramid", "task": "pyramid-volume", "idea": "Сечение пирамиды на расстоянии z от вершины подобно основанию с коэффициентом z/h. Его площадь A(z)=Sосн·z²/h². Интегрирование от 0 до h даёт V=Sосн·h/3. У конуса тот же закон площадей сечений.", "investigate": "Перемести плоскость на половину высоты: площадь сечения вчетверо меньше основания. Сравни это с линейным изменением высоты.", "pitfall": "Площади слоёв не уменьшаются линейно, поэтому множитель 1/3 нельзя заменить средним арифметическим верхней и нижней площадей.", "source": [{"point": 58, "chapter": 5, "advanced": false, "title": "Объём пирамиды", "page": 128}, {"point": 59, "chapter": 5, "advanced": false, "title": "Объём конуса", "page": 129}], "chapter": 5, "advanced": false}, {"id": "sphere-volume", "points": [60, 61, 62], "title": "Объём шара, сегмента и слоя", "kind": "sphere", "task": "sphere-volume", "idea": "На расстоянии z от центра шара A(z)=π(R²−z²). Интеграл от −R до R равен 4πR³/3. У шарового сегмента высоты h объём πh²(R−h/3); слой получают как разность сегментов. Объём сектора высоты h равен 2πR²h/3. Площадь сферы — 4πR².", "investigate": "Проследи, как меняется радиус горизонтального сечения. Почему одинаковые по высоте слои около центра и около полюса имеют разные объёмы?", "pitfall": "Высота сегмента отсчитывается от полюса шара, а z в формуле сечения — от центра. Это разные переменные.", "source": [{"point": 60, "chapter": 5, "advanced": false, "title": "Объём шара", "page": 133}, {"point": 61, "chapter": 5, "advanced": false, "title": "Объёмы шарового сегмента, шарового слоя и шарового сектора   134", "page": 134}, {"point": 62, "chapter": 5, "advanced": true, "title": "Площадь сферы", "page": 135}], "chapter": 5, "advanced": false}, {"id": "vectors", "points": [63, 64], "title": "Вектор можно перенести", "kind": "box", "task": "vectors", "idea": "Вектор задаёт направление и длину, а не закреплённую точку приложения. Равные векторы сонаправлены и имеют равные длины. В пространстве эти определения остаются такими же, как на плоскости.", "investigate": "Сравни векторы AB и D₁C₁ на параллелепипеде. Поверни ракурс: их равенство не зависит от положения на экране.", "pitfall": "Равные длины не дают равенства векторов при противоположном направлении. Нулевой вектор рассматривается отдельно.", "source": [{"point": 63, "chapter": 6, "advanced": false, "title": "Понятие вектора", "page": 142}, {"point": 64, "chapter": 6, "advanced": false, "title": "Равенство векторов", "page": 143}], "chapter": 6, "advanced": false}, {"id": "vector-operations", "points": [65, 66, 67], "title": "Сложение векторов как маршрут", "kind": "box", "task": "vector-sum", "idea": "AB+BC=AC: конец первого пути совпадает с началом второго. Разность заменяют сложением с противоположным вектором. При умножении на k длина меняется в модуль k раз, а отрицательный k меняет направление.", "investigate": "Проведи AB, BC и AC. Затем добавь CC₁: пространственная диагональ AC₁ равна сумме трёх рёбер из подходящего маршрута.", "pitfall": "Векторная сумма путей и сумма их длин — разные величины. Диагональ обычно короче ломаной.", "source": [{"point": 65, "chapter": 6, "advanced": false, "title": "Сложение и вычитание векторов", "page": 145}, {"point": 66, "chapter": 6, "advanced": false, "title": "Сумма нескольких векторов", "page": 146}, {"point": 67, "chapter": 6, "advanced": false, "title": "Умножение вектора на число", "page": 147}], "chapter": 6, "advanced": false}, {"id": "basis", "points": [68, 69, 70], "title": "Три независимых направления", "kind": "box", "task": "basis", "idea": "Три вектора компланарны, если после переноса к общему началу лежат в одной плоскости. Любой вектор раскладывается единственным образом по трём некомпланарным векторам. Диагональ параллелепипеда равна сумме трёх рёбер из одной вершины.", "investigate": "Используй направления AB, AD, AA₁. Объясни, почему AB, AD и AC не годятся как базис пространства.", "pitfall": "Три ненулевых вектора могут оказаться зависимыми. Различие направлений попарно не гарантирует некомпланарность.", "source": [{"point": 68, "chapter": 6, "advanced": false, "title": "Компланарные векторы", "page": 150}, {"point": 69, "chapter": 6, "advanced": false, "title": "Правило параллелепипеда", "page": 151}, {"point": 70, "chapter": 6, "advanced": false, "title": "Разложение вектора по трём некомпланарным векторам", "page": 152}], "chapter": 6, "advanced": false}, {"id": "coordinates", "points": [71, 72, 73, 74], "title": "Координаты превращают пространство в расчёт", "kind": "box", "task": "distance", "idea": "У точки три координаты. Координаты вектора AB равны координатам B минус координаты A. Середина имеет средние координаты концов. Квадрат расстояния — сумма квадратов трёх разностей координат.", "investigate": "Проведи пространственную диагональ и свяжи её с тремя взаимно перпендикулярными направлениями рёбер.", "pitfall": "Не забывай третью координату и не меняй местами начало и конец вектора. При вычислении длины отрицательные разности возводятся в квадрат.", "source": [{"point": 71, "chapter": 7, "advanced": false, "title": "Прямоугольная система координат в пространстве", "page": 160}, {"point": 72, "chapter": 7, "advanced": false, "title": "Координаты вектора", "page": 161}, {"point": 73, "chapter": 7, "advanced": false, "title": "Связь между координатами векторов и координатами точек", "page": 163}, {"point": 74, "chapter": 7, "advanced": false, "title": "Простейшие задачи в координатах", "page": 164}], "chapter": 7, "advanced": false, "proof": "box-diagonal"}, {"id": "sphere-equation", "points": [75], "title": "Уравнение сферы — условие расстояния", "kind": "sphere", "task": "sphere-equation", "idea": "Сфера с центром (a,b,c) и радиусом R>0 задаётся (x−a)²+(y−b)²+(z−c)²=R². В обе стороны это равносильно равенству расстояния до центра радиусу.", "investigate": "Проверь на модели, что все точки поверхности одинаково удалены от центра. Сечение плоскостью z=const уменьшает задачу до окружности.", "pitfall": "Справа записан квадрат радиуса. Знак в скобке противоположен знаку координаты центра.", "source": [{"point": 75, "chapter": 7, "advanced": false, "title": "Уравнение сферы", "page": 166}], "chapter": 7, "advanced": false, "proof": "sphere-cut"}, {"id": "dot", "points": [76, 77, 78], "title": "Угол через скалярное произведение", "kind": "box", "task": "dot", "idea": "u·v=uₓvₓ+uᵧvᵧ+u_zv_z=модуль(u)·модуль(v)·cosφ. Для угла между прямыми берут модуль произведения. Для угла прямой с плоскостью синус равен модулю отношения u·n к произведению длин, где n — нормаль. Для угла плоскостей используют угол нормалей.", "investigate": "Измерь угол AB с AC₁ и угол AC₁ с плоскостью ABC. Объясни, почему во второй формуле появляется синус.", "pitfall": "Угол с нормалью дополняет угол с плоскостью до 90°. Подстановка косинуса вместо синуса меняет ответ на дополнительный угол.", "source": [{"point": 76, "chapter": 7, "advanced": false, "title": "Угол между векторами", "page": 171}, {"point": 77, "chapter": 7, "advanced": false, "title": "Скалярное произведение векторов", "page": 171}, {"point": 78, "chapter": 7, "advanced": false, "title": "Вычисление углов между прямыми и плоскостями", "page": 173}], "chapter": 7, "advanced": false}, {"id": "plane-equation", "points": [79], "title": "Нормаль и уравнение плоскости", "kind": "box", "task": "plane-distance", "idea": "Плоскость ax+by+cz+d=0 имеет ненулевой вектор нормали (a,b,c). Расстояние точки (x₀,y₀,z₀) до неё равно |ax₀+by₀+cz₀+d|/√(a²+b²+c²). Умножение всех коэффициентов на одно ненулевое число не меняет плоскость.", "investigate": "Поверни секущую плоскость и сравни перпендикуляр к ней с наклонной. Нормаль задаёт направление кратчайшего пути.", "pitfall": "Если a=b=c=0, это не уравнение плоскости. Без деления на длину нормали выражение зависит от произ ости этого сечения.", "pitfall": "Произведения отрезков требуют общего круга и правильного положения точки. Нельзя переносить плоскую теорему на четыре произвольных пространственных отрезка.", "source": [{"point": 85, "chapter": 8, "advanced": true, "title": "Угол между касательной и хордой", "page": 194}, {"point": 86, "chapter": 8, "advanced": true, "title": "Две теоремы об отрезках, связанных с окружностью", "page": 195}, {"point": 87, "chapter": 8, "advanced": true, "title": "Углы с вершинами внутри и вне круга", "page": 196}, {"point": 88, "chapter": 8, "advanced": true, "title": "Вписанный четырёхугольник", "page": 198}, {"point": 89, "chapter": 8, "advanced": true, "title": "Описанный четырёхугольник", "page": 200}], "chapter": 8, "advanced": true}, {"id": "triangle-bridge", "points": [90, 91, 92, 93, 94], "title": "Медиана, биссектриса, площадь и центры", "kind": "pyramid", "task": "triangle-bridge", "idea": "Медиана к стороне a: m²=(2b²+2c²−a²)/4. Биссектриса делит противоположную сторону в отношении прилежащих сторон. Площадь можно находить как ah/2, bc·sinA/2, pr, abc/(4R) или по Герону. Для центров описанной и вписанной окружностей OI²=R(R−2r), откуда R≥2r.", "investigate": "Выбери треугольную грань пирамиды. Сначала установи, какой именно треугольник рассматривается, и только затем выбирай формулу.", "pitfall": "Высота и биссектриса обычно разные линии. Формулы с r,R относятся к вписанной и описанной окружностям одного и того же треугольника.", "source": [{"point": 90, "chapter": 8, "advanced": true, "title": "Теорема о медиане", "page": 202}, {"point": 91, "chapter": 8, "advanced": true, "title": "Теорема о биссектрисе треугольника", "page": 204}, {"point": 92, "chapter": 8, "advanced": true, "title": "Формулы площади треугольника", "page": 206}, {"point": 93, "chapter": 8, "advanced": true, "title": "Формула Герона", "page": 207}, {"point": 94, "chapter": 8, "advanced": true, "title": "Задача Эйлера", "page": 208}], "chapter": 8, "advanced": true}, {" if(stage===2){const p=proof();if(p){const count=record.proofDone.length;h+='<h2>'+E(p.title)+'</h2><div class="callout"><p><strong>Дано:</strong> '+E(p.given)+'</p><p><strong>Требуется:</strong> '+E(p.goal)+'</p></div><p>Обозначения относятся к этой отдельной задаче. Собери рассуждение, затем восстанови его без карточек.</p><ol class="proof-list">'+p.steps.slice(0,count).map(s=>'<li><strong>'+E(s.text)+'</strong><small>'+E(s.reason)+'</small></li>').join('')+'</ol>';if(count<p.steps.length){const choices=p.steps.map((s,i)=>({s,i})).slice(count,count+3).reverse();h+='<h3>Какой шаг можно сделать сейчас?</h3><div class="proof-options">'+choices.map(x=>'<button data-proof="'+x.i+'">'+E(x.s.text)+'</button>').join('')+'<button data-action="visual-trap">Это следует из того, как выглядит рисунок.</button></div><div id="reason"></div><p id="proof-feedback" class="feedback" role="status"></p>';}else h+='<div class="callout">Разбор с опорой завершён. Напиши собственное доказательство в разделе «Моя работа».</div><button data-action="reset-proof">Повторить без готовой цепочки</button>';}else h+='<h2>Обоснуй своё исследование</h2><p>'+E(unit.investigate)+'</p><div class="callout"><p>Назови используемые точки и плоскости. Запиши, что дано, что требуется получить и на какие определения или теоремы ты опираешься.</p><p>'+E(unit.pitfall)+'</p></div><p>Для этого узла готовая формальная цепочка не включена. Сохрани своё рассуждение в «Моей работе» и обсуди с учителем.</p>';}
if(stage===3){const t=task(),i=Math.min(record.taskStep,t.steps.length);h+='<h2>Разберём основной тип задачи</h2><p class="task-question">'+E(t.q)+'</p><ol class="proof-list">'+t.steps.slice(0,i).map(s=>'<li><strong>'+E(s.q)+' '+E(Answer.format(s.a))+'</strong><small>'+E(s.why)+'</small></li>').join('')+'</ol>';if(i<t.steps.length)h+='<div class="callout">Шаг '+(i+1)+'. '+E(t.steps[i].q)+'</div>'+answerForm('guided')+'<button data-action="hint">Объяснить шаг</button><div id="hint"></div>';else h+='<p class="good">Ответ: '+E(Answer.format(t.a))+'.</p><button class="primary" data-action="independent">Решить новый вариант</button>';}
if(stage===4){h+='<h2>Самостоятельная попытка</h2>'+(record.repeatedTask?'<p class="callout">Это условие уже открывалось. Можно повторить решение, но новый самостоятельный зачёт за него не начисляется.</p>':'')+'<p class="task-question">'+E(task().q)+'</p>'+answerForm('independent')+'<div class="row"><button data-action="solution">Открыть разбор</button><button data-action="new">Другой вариант</button></div><div id="hint"></div><p class="stage-status">Засчитано первых попыток на новых условиях: '+record.independent+'. Повтор одного ответа не увеличивает результат.</p>';}
if(stage===5){const p=proof();h+='<h2>Объяснение своими словами</h2><p>'+E(p?p.given+' '+p.goal:unit.investigate)+'</p><label>Моё рассуждение<textarea id="written" rows="9" placeholder="Условие… Построение… Его назначение… Основания переходов… Вывод…">'+E(record.written)+'</textarea></label><div class="rubric"><label><input type="checkbox"> Названы нужные объекты и условия.</label><label><input type="checkbox"> Объяснено, зачем проведена дополнительная линия или плоскость.</label><label><input type="checkbox"> У каждого перехода есть основание; нет ссылки только на вид рисунка.</label><label><input type="checkbox"> Отдельно проверены особые случаи.</label></div><p class="muted">Это самопроверка. Текст сохраняется для учителя и не получает автоматической отметки за верность доказательства.</p><button class="primary" data-action="finish">Сохранить итог занятия</button><div id="finish-result" role="status"></div>';}
h+='<div class="stage-footer">'+(stage?'<button data-stage="'+(stage-1)+'">← Назад</button>':'<button data-action="home">Карта курса</button>')+(stage<5?'<button class="primary" data-stage="'+(stage+1)+'">'+labels[stage+1]+' →</button>':'<button data-action="export">Скачать работу</button>')+'</div></section></div>';root.innerHTML=h;
if(stage===1)viewer=SpaceViewer.mount(document.getElementById('viewer'),{kind:unit.kind,mode:unit.id==='sections'?'section':'explore',saved:record.model},ev=>{record.model=ev.state;record.moved=true;if(ev.type==='solved-construction')record.construction=true;if(ev.type==='hint')record.hints++;later();});}
function changeStage(n){if(n===4&&stage!==4)nextTask();stage=n;save('step');render();window.scrollTo(0,0);}
root.addEventListener('input',e=>{if(e.target.id==='course-search'){const s=e.target.value.toLocaleLowerCase('ru');root.querySelectorAll('.card').forEach(c=>c.hidden=!c.textContent.toLocaleLowerCase('ru').includes(s));root.querySelectorAll('.chapter').forEach(c=>c.hidden=![...c.querySelectorAll('.card')].some(a=>!a.hidden));return;}if(!record)return;if(e.target.id==='answer')record.draft=e.target.value;if(e.target.id==='observation')record.observation=e.target.value;if(e.target.id==='written')record.written=e.target.value;later();});
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.unit){open(b.dataset.unit);return;}if(b.dataset.stage){changeStage(+b.dataset.stage);return;}const a=b.dataset.action;if(a==='home')return home();if(a==='export')return download();if(a==='reports')return reports();if(!unit)return;
if(b.dataset.proof){const i=+b.dataset.proof,f=document.getElementById('proof-feedback');if(i!==record.proofDone.length){f.textContent='Для этого перехода сначала нужно установить предыдущий факт. Найди недостающее основание.';f.className='feedback error';return;}pending=i;document.getElementById('reason').innerHTML='<div class="reason-panel"><strong>Выбери допустимое основание</strong><div class="proof-options"><button data-action="bad-reason">Вывод, который мы сейчас доказываем.</button><button data-action="good-reason">'+E(proof().steps[i].reason)+'</button><button data-action="bad-reason">Совпадение измерений на текущем изображении.</button></div></div>';}
if(a==='visual-trap'||a==='bad-reason'){document.getElementById('proof-feedback').textContent='Это наблюдение или круг в рассуждении. Нужен факт из условия, определение, аксиома или уже установленная теорема.';save('proof-error');}
if(a==='good-reason'&&pending!==null){record.proofDone.push('s'+pending);record.proof=record.proofDone.length===proof().steps.length;save('proof-step');render();}
if(a==='reset-proof'){record.proofDone=[];record.proof=false;save();render();}if(a==='independent')changeStage(4);if(a==='new'){nextTask();render();}
if(a==='hint'){record.hints++;record.assisted=true;document.getElementById('hint').innerHTML='<div class="callout">'+E(task().steps[record.taskStep].why)+'</div>';save('hint');}
if(a==='solution'){record.hints++;record.assisted=true;document.getElementById('hint').innerHTML='<ol class="proof-list">'+task().steps.map(s=>'<li><strong>'+E(s.q)+' '+E(Answer.format(s.a))+'</strong><small>'+E(s.why)+'</small></li>').join('')+'</ol>';save('hint');}
if(a==='finish'){record.complete=record.guided&&record.moved&&record.observation.trim().length>=10;save('finish');document.getElementById('finish-result').innerHTML='<div class="callout"><strong id="success">Итог занятия сохранён.</strong><p>Самостоятельных первых попыток: '+record.independent+'. '+(record.written.trim()?'Письменная работа сохранена для проверки учителем.':'Письменную работу можно дописать позже.')+'</p><p>Вернись к теме через день: реши новый вариант и восстанови объяснение без карточек.</p></div>';}
});
root.addEventListener('submit',e=>{if(e.target.id!=='answer-form')return;e.preventDefault();const mode=e.target.dataset.mode,t=task(),a=document.getElementById('answer').value.trim(),f=document.getElementById('feedback');if(!a)return;const expected=mode==='guided'?t.steps[record.taskStep].a:t.a,ok=Answer.equal(a,expected);if(mode==='guided'){if(ok){record.taskStep++;record.draft='';if(record.taskStep===t.steps.length)record.guided=true;save('solved');render();}else{f.textContent='Пока неверно. Проверь, какая именно величина нужна на этом шаге, единицы и знак. Можно открыть объяснение.';f.className='feedback error';}}else{const first=!record.checked;record.checked=true;if(first)record.attempts++;if(ok){if(first&&!record.assisted&&!record.repeatedTask)record.independent++;f.textContent=record.repeatedTask?'Верно. Это условие уже открывалось; повтор решён без нового самостоятельного зачёта.':first&&!record.assisted?'Верно с первой попытки без подсказки. Засчитан самостоятельный вариант.':'Верно после исправления или с опорой. Возьми другой вариант для самостоятельной проверки.';f.className='feedback good';}else{record.assisted=true;f.textContent='Пока неверно. Проверь радиус и диаметр, выбранный угол, единицы и основания для формулы. Можно открыть разбор.';f.className='feedback error';}save(ok?'solved':'attempt');}});
function download(){save();StereoStore.download(store.export(),'stereometry-progress.json');}
document.getElementById('export-progress').onclick=download;document.getElementById('home').onclick=home;
root.addEventListener('change',async e=>{if(e.target.id!=='import'&&e.target.id!=='reports-files')return;const report=e.target.id==='reports-files';for(const f of e.target.files){try{if(f.size>8e6)throw Error('Слишком большой файл');const raw=JSON.parse(await f.text());if(report)renderReport(StereoStore.validate(raw,C.units.map(u=>u.id)),f.name);else{store.import(raw);home();}}catch(err){notice.hidden=false;notice.textContent='Не удалось прочитать файл: '+err.message;}}});
function reports(){save();root.innerHTML='<div class="workspace"><button data-action="home">← Карта</button><h1>Работы учеников</h1><section class="panel"><p>Выберите файлы прогресса. Тексты и результаты читаются локально, без отправки на сервер.</p><label>Файлы работ<input id="reports-files" type="file" accept=".json,application/json" multiple></label><p>Разбор с опорой и самостоятельная первая попытка учитываются отдельно. Письменные доказательства проверьте по условиям, построениям, основаниям и полноте вывода.</p></section><div id="reports-output"></div></div>';renderReport(store.export(),'Этот браузер');}
function renderReport(d,name){const el=document.createElement('section');el.className='panel';el.style.marginTop='20px';el.innerHTML='<h2>'+E(name)+'</h2>'+Object.entries(d.units).map(([id,r])=>'<details><summary>'+E(C.units.find(u=>u.id===id).title)+' · самостоятельно '+r.independent+' / попыток '+r.attempts+'</summary><p>Разбор: '+(r.guided?'пройден':'не закончен')+'. Цепочка: '+(r.proof?'собрана':'не закончена или отсутствует в узле')+'.</p><h3>Наблюдение</h3><p class="report-note">'+E(r.observation||'Нет записи')+'</p><h3>Рассуждение</h3><p class="report-note">'+E(r.written||'Нет записи')+'</p></details>').join('');document.getElementById('reports-output').appendChild(el);}
const start=location.hash.slice(1);if(C.units.some(u=>u.id===start))open(start);else home();
})();
</script></body></html>
