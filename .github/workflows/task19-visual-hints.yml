name: Task 19 visual hints

on:
  pull_request:
    paths:
      - 'trainers/task19-*'
      - 'trainers/task19-reference/**'
      - 'trainers/geometry_statements_trainer_improved.html'
      - 'trainers/archive-5-weeks/task19-before-visual-hints-20261020.html'
      - 'trainers/archive-5-weeks/geometry-statements-trainer-improved-370628fb.html'
      - 'trainers/archive-5-weeks/geometry-statements-trainer-improved-updated-22181e31.html'
      - 'trainers/archive-5-weeks/preview-5-8bb7dd76.html'
      - 'downloads/trainers/task19-trainer/**'
      - 'downloads/trainers-manifest.json'
      - 'scripts/build-trainer-downloads.mjs'
      - 'tools/task19-*'
      - '.github/workflows/task19-visual-hints.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: task19-visual-hints-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-hints:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - name: Install isolated test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/task19-browser" --no-save --no-package-lock --ignore-scripts jsdom@26.1.0 playwright@1.62.1
          "$RUNNER_TEMP/task19-browser/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/task19-browser/node_modules" >> "$GITHUB_ENV"
      - name: Bank, geometry and learner-state contracts
        run: |
          node --check trainers/task19-visual-data.js
          node --check trainers/task19-visual-models.js
          node --check trainers/task19-visual-app.js
          node --test tools/task19-*.test.cjs
          git diff --check
      - name: Desktop, narrow screen and keyboard journeys
        env:
          TASK19_BROWSER_ARTIFACTS: artifacts/task19-visual-hints
        run: node tools/task19-visual-hints.browser.cjs
      - name: Owner feedback examples, linked pairs and authentic reference sheets
        env:
          TASK19_OWNER_BROWSER_ARTIFACTS: artifacts/task19-owner-feedback
        run: node tools/task19-owner-feedback.browser.cjs
      - name: Keep visual evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task19-visual-hints
          path: artifacts/task19-visual-hints
          if-no-files-found: ignore
          retention-days: 7
      - name: Keep owner feedback evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task19-owner-feedback
          path: artifacts/task19-owner-feedback
          if-no-files-found: ignore
          retention-days: 7
