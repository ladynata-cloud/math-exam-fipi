что дальше влево от нуля.","explanation":"−1,5 < −2/3 < 0 < 0,75. Число −2/3 находится между −1 и 0."},{"id":"n7-q-root","title":"Между соседними целыми","prompt":"Между какими соседними целыми числами находится √10?","type":"choice","skillId":"n7-bounds","options":[{"text":"Между 2 и 3","correct":false},{"text":"Между 3 и 4","correct":true},{"text":"Между 4 и 5","correct":false}],"hint":"Сравни 10 с квадратами соседних целых чисел.","explanation":"3² = 9 < 10 < 16 = 4², поэтому 3 < √10 < 4."},{"id":"n7-q-sign","title":"Знак без точных координат","prompt":"Известно: a < 0 < b и |a| > |b|. Какой знак у суммы a + b?","type":"choice","skillId":"n7-expression-sign","options":[{"text":"Отрицательный","correct":true},{"text":"Положительный","correct":false},{"text":"Сумма равна нулю","correct":false}],"hint":"У слагаемых разные знаки. После компенсации останется знак числа с большим модулем.","explanation":"Модуль отрицательного a больше модуля положительного b. После компенсации остаётся отрицательная величина: a + b < 0."},{"id":"exp-n7-calibration-entry","title":"Шаг не подписан","prompt":"Пять рисок расположены через одинаковые промежутки. Первая имеет координату −4, пятая — 4. Найди координату четвёртой риски.","type":"number","skillId":"n7-position","hint":"Между первой и пятой рисками четыре равных промежутка.","explanation":"Вся разность координат равна 8, один шаг — 8/4 = 2. Четвёртая риска: −4 + 3 × 2 = 2.","originAtlasId":"7.1","answer":2,"visual":{"kind":"calibration","ticks":[{"position":0,"label":"−4"},{"position":1,"label":null},{"position":2,"label":null},{"position":3,"label":null},{"position":4,"label":"4"}],"extent":[0,4],"ariaLabel":"Пять равноотстоящих рисок: первая −4, пятая 4. Требуется координата четвёртой."},"learningMode":"quick"},{"id":"exp-n7-calibration-exit","title":"Прочитай другую шкалу","prompt":"Шесть рисок расположены равномерно. Вторая имеет координату −4, пятая — 5. Найди координату шестой риски.","type":"number","skillId":"n7-position","hint":"От второй до пятой риски три одинаковых промежутка.","explanation":"Шаг равен (5 − (−4))/3 = 3. Следующая после пятой риска имеет координату 5 + 3 = 8.","originAtlasId":"7.1","answer":8,"visual":{"kind":"calibration","ticks":[{"position":0,"label":null},{"position":1,"label":"−4"},{"position":2,"label":null},{"position":3,"label":null},{"position":4,"label":"5"},{"position":5,"label":null}],"extent":[0,5],"ariaLabel":"Шесть равноотстоящих рисок: вторая −4, пятая 5. Требуется координата шестой."},"learningMode":"quick"},{"id":"exp-n7-bound-entry","title":"Сравнение без десяти знаков","prompt":"Сравни √10 и 3,2.","type":"choice","skillId":"n7-bounds","hint":"Оба числа неотрицательны. Сравни их квадраты.","explanation":"3,2² = 10,24, а 10 < 10,24. Поэтому √10 < 3,2.","originAtlasId":"7.2","options":[{"text":"√10 < 3,2","correct":true},{"text":"√10 = 3,2","correct":false},{"text":"√10 > 3,2","correct":false},{"text":"Без точного десятичного значения корня сравнить нельзя.","correct":false}],"learningMode":"quick"},{"id":"exp-n7-bound-exit","title":"Другой корень, другая граница","prompt":"Сравни √30 и 5,4.","type":"choice","skillId":"n7-bounds","hint":"Сравни 30 с квадратом положительного числа 5,4.","explanation":"5,4² = 29,16 < 30. Поэтому 5,4 < √30.","originAtlasId":"7.2","options":[{"text":"√30 < 5,4","correct":false},{"text":"√30 = 5,4","correct":false},{"text":"√30 > 5,4","correct":true},{"text":"Нужно обязательно вычислить корень до сотых.","correct":false}],"learningMode":"quick"}],"creative":[{"id":"n7-c-meeting","title":"Встреча посередине","prompt":"Один участник стоит в точке −5, другой — в точке 3. Отметь место встречи, одинаково удалённое от обоих.","type":"numberline","skillId":"n7-distance","min":-6,"max":4,"answer":-1,"hint":"Между точками восемь единиц. Отсчитай половину этого расстояния от любого конца.","explanation":"Середина — точка −1: от −5 до −1 четыре единицы, от −1 до 3 тоже четыре. Её координата равна (−5 + 3) ÷ 2 = −1."},{"id":"n7-c-order-root","title":"Закажи место корню","prompt":"Выбери целое число n так, чтобы √n находился строго между 4 и 5. Подходящих ответов несколько.","type":"build","skillId":"n7-bounds","fields":[{"name":"n","label":"Число под корнем","min":0,"max":36,"step":1,"initial":16}],"constants":{},"conditions":[{"left":"sqrt(n)","op":"gt","right":"4"},{"left":"sqrt(n)","op":"lt","right":"5"}],"exampleSolution":{"n":20},"hint":"Переведи условие в сравнение n с 4² и 5². Границы здесь не входят.","explanation":"Нужно 16 < n < 25. Подойдут целые числа 17, 18, 19, 20, 21, 22, 23 и 24. Например, √20 находится строго между 4 и 5."},{"id":"n7-c-radius","title":"Доступ в радиусе","prompt":"Центр находится в точке 2. Выбери все предложенные точки на расстоянии строго меньше 3 от центра.","type":"multi","skillId":"n7-distance","options":[{"text":"−1","correct":false},{"text":"0","correct":true},{"text":"2","correct":true},{"text":"4","correct":true},{"text":"5","correct":false}],"hint":"Проверь расстояние от каждой точки до 2. Слово «меньше» исключает расстояние ровно 3.","explanation":"Подходят 0, 2 и 4: расстояния равны 2, 0 и 2. Точки −1 и 5 отстоят от центра ровно на 3 и не входят. Все допустимые координаты удовлетворяют −1 < x < 5."},{"id":"exp-n7-calibration-workshop","title":"Восстанови числовую шкалу","prompt":"Риски расположены равномерно. На второй написано −2, на четвёртой — 4. Восстанови координату первой риски и шаг. Затем укажи, какую долю промежутка нужно пройти вправо от второй риски, чтобы попасть в ноль. Долю можно записать через /.","type":"build","skillId":"n7-position","hint":"Между второй и четвёртой рисками два промежутка. Сначала найди длину одного; затем сравни путь от −2 до нуля с этой длиной.","explanation":"Шаг: (4 − (−2))/2 = 3. Первая риска имеет координату −5. От второй риски до нуля нужно пройти 2 единицы, то есть 2/3 одного промежутка. Ноль не обязан совпадать с риской.","originAtlasId":"7.1","fields":[{"name":"first","label":"Координата первой риски","initial":""},{"name":"step","label":"Разность координат соседних отметок","initial":"","min":0},{"name":"zero","label":"Доля промежутка до нуля","initial":"","min":0,"max":1}],"constants":{},"conditions":[{"left":"step","op":"gt","right":"0"},{"left":"first+step","op":"eq","right":"-2"},{"left":"first+3*step","op":"eq","right":"4"},{"left":"-2+zero*step","op":"eq","right":"0"}],"exampleSolution":{"first":-5,"step":3,"zero":0.6666666666666666},"visual":{"kind":"calibration","ticks":[{"position":0,"label":null},{"position":1,"label":"−2"},{"position":2,"label":null},{"position":3,"label":"4"},{"position":4,"label":null}],"extent":[0,4],"dynamic":{"kind":"calibration","origin":"first","step":"step"},"ariaLabel":"Пять равноотстоящих рисок: вторая −2, четвёртая 4. Ноль и шаг не подписаны."},"learningMode":"creative"},{"id":"exp-n7-bound-workshop","title":"Сравни с помощью квадратов","prompt":"Докажи, что √20 < 4,5. Подбери положительную верхнюю границу b, не превосходящую 4,5, так чтобы b² было больше 20. Введи b и его квадрат. Подойдёт любая граница, выполняющая эти условия.","type":"build","skillId":"n7-bounds","hint":"Можно проверить саму границу сравнения. Более подробное приближение требуется не всегда.","explanation":"Например, b = 4,5 и b² = 20,25. Оба сравниваемых числа неотрицательны; из 20 < b² следует √20 < b ≤ 4,5. Подходит и b = 4,48: его квадрат 20,0704. Одного достаточного обоснования хватает.","originAtlasId":"7.2","fields":[{"name":"b","label":"Верхняя граница b","initial":"","min":0,"max":4.5},{"name":"square","label":"Квадрат выбранной границы","initial":""}],"constants":{},"conditions":[{"left":"b","op":"gt","right":"0"},{"left":"square","op":"eq","right":"b*b"},{"left":"b*b","op":"gt","right":"20"}],"exampleSolution":{"b":4.5,"square":20.25},"alternativeSolutions":[{"b":4.48,"square":20.0704},{"b":4.49,"square":20.1601}],"learningMode":"creative"}],"extensions":["Восстановить единичный отрезок по двум подписанным точкам и расположить остальные числа.","Сопоставить дробь, десятичную запись и место на одной прямой.","Уточнять оценку корней и переводить приближённое положение в доказанные границы.","Исследовать сумму, разность и произведение по положению a и b; искать случаи, когда данных недостаточно.","Перейти от расстояния к модулю и числовым промежуткам, сохраняя различие строгих и нестрогих границ."],"overviewTaskIds":["n7-q-point","n7-q-order","n7-q-root","n7-q-sign"]},{"id":"n8","title":"№8 · Степени и корни","goal":"Различать допустимые правила степеней и корней, связывать корень с квадратом и проверять преобразования. Короткий набор не охватывает все подтипы №8.","sourceHref":"/trainers/oge-task8-powers-roots.html","skills":[{"id":"n8-powers","label":"Вижу множители за степенью","requires":["base-products"],"evidence":"Применяет правило степени степени и частного степеней, сохраняя допустимость выражения."},{"id":"n8-root","label":"Связываю корень и квадрат","requires":["base-products"],"evidence":"Находит неотрицательный арифметический корень и проверяет его возведением в квадрат."},{"id":"n8-absolute","label":"Использую √(a²) = |a|","requires":["base-sign","n8-root"],"evidence":"Различает a и |a| в равенстве √(a²) = |a|, включая отрицательные значения a."},{"id":"n8-equivalent","label":"Узнаю равные выражения с корнями","requires":["n8-root"],"evidence":"Выносит квадратный множитель из-под корня и объединяет одинаковые радикалы."},{"id":"n8-counterexample","label":"Проверяю границы правила","requires":["n8-root","n8-absolute"],"evidence":"Находит допустимый контрпример ложному равенству и формулирует корректное правило."},{"id":"n8-difference-squares","label":"Преобразую разность квадратов","requires":["base-products","n8-powers"],"evidence":"Связывает разность площадей квадратов с произведением суммы и разности сторон и применяет тождество к вычислению."},{"id":"n8-square-form","label":"Использую квадрат двучлена","requires":["base-products","n8-powers"],"evidence":"Узнаёт полный квадрат, вычисляет значение и обосновывает нуль, симметричные значения и неотрицательность."}],"quick":[{"id":"n8-q-powers","title":"Степень степени","prompt":"Вычисли: (2³)² ÷ 2⁴.","type":"number","skillId":"n8-powers","answer":4,"hint":"Сначала выясни, сколько множителей 2 даёт (2³)².","explanation":"(2³)² = 2⁶. Тогда 2⁶ ÷ 2⁴ = 2² = 4. Основание 2 ненулевое, поэтому деление допустимо."},{"id":"n8-q-roots","title":"Проверь квадратом","prompt":"Вычисли: √144 − √49.","type":"number","skillId":"n8-root","answer":5,"hint":"Найди неотрицательные числа, квадраты которых равны 144 и 49.","explanation":"√144 = 12, √49 = 7. Разность равна 5. Арифметический квадратный корень по определению неотрицателен."},{"id":"n8-q-square-root","title":"Буква может быть отрицательной","prompt":"Какое выражение равно √(a²) при любом действительном a?","type":"choice","skillId":"n8-absolute","options":[{"text":"|a|","correct":true},{"text":"a","correct":false},{"text":"−a","correct":false},{"text":"a²","correct":false}],"hint":"Проверь сначала a = 3, затем a = −3. Значение квадратного корня не может быть отрицательным.","explanation":"√(a²) = |a|. Например, при a = −3 получаем √9 = 3, а не −3."},{"id":"n8-q-like-roots","title":"Одинаковые радикалы","prompt":"Упрости: 3√5 + 2√5 − √5.","type":"choice","skillId":"n8-equivalent","options":[{"text":"4√5","correct":true},{"text":"4√15","correct":false},{"text":"√20","correct":false},{"text":"6√5","correct":false}],"hint":"Посчитай, сколько одинаковых слагаемых √5 осталось.","explanation":"3√5 + 2√5 − √5 = (3 + 2 − 1)√5 = 4√5. Подкоренное число при сложении одинаковых радикалов не складывается."},{"id":"exp-n8-cut-entry","title":"Разность близких квадратов","prompt":"Вычисли: 36² − 34².","type":"number","skillId":"n8-difference-squares","hint":"Попробуй заменить разность квадратов произведением суммы и разности оснований.","explanation":"36² − 34² = (36 − 34)(36 + 34) = 2 × 70 = 140.","originAtlasId":"8.1","answer":140,"learningMode":"quick"},{"id":"exp-n8-cut-exit","title":"Разность квадратов в частном","prompt":"Вычисли: (51² − 49²)/2.","type":"number","skillId":"n8-difference-squares","hint":"Сначала преобразуй числитель.","explanation":"(51² − 49²)/2 = (51 − 49)(51 + 49)/2 = 2 × 100/2 = 100.","originAtlasId":"8.1","answer":100,"learningMode":"quick"},{"id":"exp-n8-square-entry","title":"Полный квадрат","prompt":"Найди значение x² − 10x + 25 при x = 13.","type":"number","skillId":"n8-square-form","hint":"Сумма похожа на квадрат разности.","explanation":"x² − 10x + 25 = (x − 5)². При x = 13 получаем 8² = 64. Прямое вычисление также допустимо.","originAtlasId":"8.2","answer":64,"learningMode":"quick"},{"id":"exp-n8-square-exit","title":"Узнай знакомую структуру","prompt":"Вычисли: 37² − 6 × 37 + 9.","type":"number","skillId":"n8-square-form","hint":"В выражении можно узнать квадрат разности.","explanation":"37² − 6 × 37 + 9 = 37² − 2 × 37 × 3 + 3² = (37 − 3)² = 34² = 1156.","originAtlasId":"8.2","answer":1156,"learningMode":"quick"}],"creative":[{"id":"n8-c-expose-rule","title":"Разоблачи правило","prompt":"Кто-то утверждает: «√(x²) всегда равно x». Найди число x, при котором две стороны дают разные значения.","type":"counterexample","skillId":"n8-counterexample","left":"sqrt(x^2)","right":"x","field":"x","exampleCounterexample":-3,"hint":"Положительное число не разоблачит это правило. Проверь, что происходит с отрицательным.","explanation":"При x = −3 левая сторона равна √9 = 3, правая — −3. Получен контрпример. Корректное равенство: √(x²) = |x|.","counterexampleWhen":[{"left":"x","op":"lt","right":"0"}],"comparisonLeft":"abs(x)","comparisonRight":"x","criterionExplanation":"При x < 0 арифметический квадратный корень неотрицателен и не может совпасть с отрицательным x."},{"id":"n8-c-equal-roots","title":"Одна величина, две записи","prompt":"Найди пары равных выражений. Ищи квадратный множитель под корнем.","type":"match","skillId":"n8-equivalent","pairs":[{"left":"√72","right":"6√2"},{"left":"√50","right":"5√2"},{"left":"√27","right":"3√3"},{"left":"2√12","right":"4√3"}],"hint":"Например, 72 можно записать как 36 × 2. Корень из 36 известен.","explanation":"√72 = √(36 × 2) = 6√2; √50 = 5√2; √27 = 3√3; 2√12 = 2 × 2√3 = 4√3. Все множители под корнями здесь неотрицательны."},{"id":"n8-c-order-square","title":"Корень на заказ","prompt":"Выбери целое число n строго между 50 и 100 и целый неотрицательный корень m так, чтобы √n = m. Есть несколько правильных ответов.","type":"build","skillId":"n8-root","fields":[{"name":"n","label":"Число под корнем","min":51,"max":99,"step":1,"initial":60},{"name":"m","label":"Значение корня","min":0,"max":10,"step":1,"initial":5}],"constants":{},"conditions":[{"left":"m*m","op":"eq","right":"n"},{"left":"n","op":"gt","right":"50"},{"left":"n","op":"lt","right":"100"}],"exampleSolution":{"n":64,"m":8},"hint":"Посмотри на квадраты целых чисел от 7 до 10.","explanation":"Подойдут n = 64, m = 8 или n = 81, m = 9. Числа 49 и 100 не входят в заданный интервал."},{"id":"exp-n8-cut-workshop","title":"Разность площадей квадратов","prompt":"Из угла квадрата со стороной 17 вырезан квадрат со стороной 13. Разрез отделяет нижнюю полосу от левой верхней части. Собери из двух оставшихся прямоугольников один длинный прямоугольник без новых разрезов: введи его стороны и площадь. Поворачивать всю собранную фигуру можно.","type":"build","skillId":"n8-difference-squares","hint":"Ширина обеих полос — разность сторон квадратов. Их длины можно поставить друг за другом.","explanation":"Оставшиеся прямоугольники имеют размеры 17 × 4 и 13 × 4. Их можно соединить в прямоугольник 30 × 4 (или повернуть: 4 × 30). Площадь равна (17 + 13)(17 − 13) = 120. Это те же 17² − 13².","originAtlasId":"8.1","fields":[{"name":"width","label":"Одна сторона","initial":"","min":1,"integer":true},{"name":"height","label":"Другая сторона","initial":"","min":1,"integer":true},{"name":"area","label":"Площадь","initial":""}],"constants":{},"conditions":[{"left":"width+height","op":"eq","right":"34"},{"left":"width*height","op":"eq","right":"120"},{"left":"area","op":"eq","right":"width*height"}],"exampleSolution":{"width":30,"height":4,"area":120},"alternativeSolutions":[{"width":4,"height":30,"area":120}],"visual":{"kind":"polygon","points":[[0,0],[17,0],[17,4],[4,4],[4,17],[0,17]],"labels":["","","","","",""],"grid":false,"segments":[{"from":[0,4],"to":[4,4],"label":"разрез","dashed":true}],"ariaLabel":"Г-образный остаток квадрата со стороной 17 после удаления верхнего правого квадрата со стороной 13. Горизонтальный разрез от левой внешней стороны до внутреннего угла разделяет остаток на нижнюю и левую верхнюю прямоугольные части."},"learningMode":"creative"},{"id":"exp-n8-square-workshop","title":"Три свойства одного выражения","prompt":"Даны две равные записи: F(x) = x² − 6x + 9 = (x − 3)². Подбери ответ к каждому вопросу. Попробуй использовать структуру квадрата вместо длинного вычисления.","type":"match","skillId":"n8-square-form","hint":"Квадрат равен нулю только при нулевом основании; основания −1 и 1 дают одинаковые квадраты.","explanation":"F(x) = 0 при x = 3. Для x = 2 и x = 4 основания равны −1 и 1, поэтому оба значения равны 1. При любом действительном x квадрат (x − 3)² неотрицателен.","originAtlasId":"8.2","pairs":[{"left":"При каком x значение F(x) равно нулю?","right":"Только при x = 3."},{"left":"Как соотносятся F(2) и F(4)?","right":"Оба значения равны 1."},{"left":"Может ли F(x) быть отрицательным при действительном x?","right":"Нет: квадрат любого действительного числа неотрицателен."}],"matchOptions":["Только при x = −3.","Оба значения равны 1.","Да: при любом x < 3.","Только при x = 3.","F(2) меньше F(4).","Нет: квадрат любого действительного числа неотрицателен."],"learningMode":"creative"}],"extensions":["Раскрыть смысл нулевого и отрицательного показателей, отдельно проверяя ненулевое основание.","Связать квадрат и корень через площадь квадрата и длину его стороны; сохранить неотрицательность длины.","Исследовать √(a²) при разных знаках a и перейти к буквенным выражениям с модулем.","Выносить множитель из-под знака корня и вносить под знак корня с проверкой знака и области допустимых значений.","Составлять контрпримеры к ложным правилам: корень из суммы, сумма степеней, неверное сокращение."],"overviewTaskIds":["n8-q-powers","n8-q-roots","n8-q-square-root","n8-q-like-roots"]},{"id":"n9","title":"№9 · Уравнения","goal":"Находить корень и проверять его, выбирать допустимые преобразования и замечать структуру уравнения. Четыре коротких задания — стартовый срез нескольких подтипов, а не весь №9.","sourceHref":"/trainers/oge-task9-equations.html","skills":[{"id":"n9-root","label":"Понимаю, что такое корень","requires":["base-check"],"evidence":"Подставляет значение и проверяет равенство обеих частей; умеет создать уравнение с заданным корнем."},{"id":"n9-equality","label":"Сохраняю равенство","requires":["base-sign","base-check"],"evidence":"Выбирает допустимое одинаковое действие с обеими частями и не делит на ноль."},{"id":"n9-linear","label":"Решаю линейное уравнение","requires":["n9-root","n9-equality"],"evidence":"Самостоятельно собирает цепочку решения, включая дробные коэффициенты, и проверяет найденный корень."},{"id":"n9-brackets","label":"Работаю со скобками","requires":["base-products","n9-equality"],"evidence":"Правильно раскрывает скобки или выбирает путь без их раскрытия, сохраняя равносильность."},{"id":"n9-quadratic","label":"Проверяю корни квадратного уравнения","requires":["n9-root","n8-powers"],"evidence":"Находит все корни рассматриваемого квадратного уравнения и выбирает нужный по условию."},{"id":"n9-domain","label":"Учитываю знаменатель","requires":["base-division","n9-linear"],"evidence":"Исключает нулевой знаменатель и проверяет, что найденное значение допустимо в исходном уравнении."},{"id":"n9-model","label":"Связываю условие с уравнением","requires":["n9-root","n9-brackets"],"evidence":"Объясняет смысл переменной и одинаковых групп, отличает прибавление к каждой группе от прибавления ко всему количеству и решает новую задачу."},{"id":"n9-solution-kind","label":"Различаю виды множества решений","requires":["n9-equality","n9-brackets"],"evidence":"Отличает тождество, противоречие и линейное уравнение с единственным корнем, не объявляя x = 0 ответом к 0 = 0."}],"quick":[{"id":"n9-q-linear","title":"Неизвестное в обеих частях","prompt":"Реши уравнение: 5x − 7 = 2x + 8.","type":"number","skillId":"n9-linear","answer":5,"hint":"Вычти 2x из обеих частей, затем прибавь 7 к обеим частям.","explanation":"3x − 7 = 8; 3x = 15; x = 5. Проверка: 25 − 7 = 10 + 8 = 18."},{"id":"n9-q-quadratic","title":"Выбери нужный корень","prompt":"Найди отрицательный корень уравнения: x² + x − 6 = 0.","type":"number","skillId":"n9-quadratic","answer":-3,"hint":"Ищи два числа с произведением −6 и суммой 1 для разложения на множители.","explanation":"x² + x − 6 = (x + 3)(x − 2). Корни −3 и 2. Отрицательный корень — −3; проверка: 9 − 3 − 6 = 0."},{"id":"n9-q-fraction","title":"Дробный ответ","prompt":"Реши уравнение: (x + 1)/3 = 5/2. Можно ввести дробь или десятичное число.","type":"number","skillId":"n9-linear","answer":6.5,"hint":"Умножь обе части на 3, затем вычти 1.","explanation":"x + 1 = 15/2, поэтому x = 15/2 − 2/2 = 13/2 = 6,5. Подстановка даёт 7,5 ÷ 3 = 2,5."},{"id":"n9-q-rational","title":"Не потеряй ограничение","prompt":"Реши уравнение: x/(x − 2) = 3. Значение x = 2 недопустимо.","type":"number","skillId":"n9-domain","answer":3,"hint":"Для допустимого x умножь обе части на x − 2. После решения проверь знаменатель.","explanation":"При x ≠ 2 получаем x = 3(x − 2), то есть x = 3x − 6 и x = 3. Это значение допустимо: 3/(3 − 2) = 3."},{"id":"exp-n9-story-entry","title":"Что повторяется в каждой коробке?","prompt":"В четырёх одинаковых коробках лежат карандаши: в каждой x синих и 3 красных. Всего 40 карандашей. Сколько синих карандашей в одной коробке?","type":"number","skillId":"n9-model","hint":"Сначала найди общее число карандашей в одной коробке.","explanation":"4(x  r. Подойдёт любой набор, выполняющий эти условия.","type":"build","skillId":"n9-solution-kind","hint":"После раскрытия слева 2x + 6. Сравни коэффициенты при x отдельно от свободных чисел.","explanation":"Нужны b = 6, любое разрешённое c ≠ 6 и любое разрешённое a ≠ 2. Для третьего уравнения (2 − a)r = 1, поэтому r = 1/(2 − a). Например, b = 6, c = 7, a = 3, r = −1. Равенство 0 = 0 не означает единственный корень x = 0.","originAtlasId":"9.2","fields":[{"name":"b","label":"b: любое действительное число — решение","initial":"","min":-12,"max":12,"integer":true},{"name":"c","label":"c: решений нет","initial":"","min":-12,"max":12,"integer":true},{"name":"a","label":"a: ровно одно решение","initial":"","min":-5,"max":5,"integer":true},{"name":"r","label":"Корень r третьего уравнения","initial":""}],"constants":{},"conditions":[{"left":"b","op":"eq","right":"6"},{"left":"abs(c-6)","op":"gt","right":"0"},{"left":"abs(a-2)","op":"gt","right":"0"},{"left":"2*(r+3)","op":"eq","right":"a*r+7"}],"exampleSolution":{"b":6,"c":7,"a":3,"r":-1},"alternativeSolutions":[{"b":6,"c":5,"a":-2,"r":0.25},{"b":6,"c":0,"a":5,"r":-0.3333333333333333}],"learningMode":"creative"}],"extensions":["Простой вход: смысл корня → подстановка → один допустимый шаг → короткое линейное уравнение. Остальные ветви открываются по необходимости.","Скобки и коэффициенты: сравнить несколько решений одного уравнения и выбрать удобное, не отвергая другие правильные пути.","Уравнения с дробными коэффициентами и дробными ответами: связать преобразования с общей меркой и обратной проверкой.","Квадратные уравнения: произведение, формула корней, число корней и проверка всех найденных значений.","Рациональные уравнения: область допустимых значений, общий знаменатель и возврат к исходной записи.","Пульт уравнения: изменять коэффициенты, получая один корень, отсутствие корней или равенство при любом x.","Составить уравнение по ситуации или по заданному корню; объяснить смысл неизвестного и проверить ответ в условии.","После паузы решить смешанный набор без названия способа. Отдельно зафиксировать самостоятельное решение и работу с помощью."],"overviewTaskIds":["n9-q-linear","n9-q-quadratic","n9-q-fraction","n9-q-rational"]},{"id":"n10","title":"№10. Вероятность","goal":"Короткий вход: найти вероятность в простой модели. Дополнительные задания помогают самому создавать условия и замечать, когда исходы неравновероятны.","sourceHref":"/trainers/oge-task10-probability.html","skills":[{"id":"n10-outcomes","label":"Перечислять возможные исходы","requires":[],"evidence":"Называет все исходы простого опыта и не считает невозможные события."},{"id":"n10-event","label":"Выделять подходящие исходы","requires":["n10-outcomes"],"evidence":"Отбирает все исходы заданного события без пропусков и повторного счёта."},{"id":"n10-ratio","label":"Находить долю подходящих исходов","requires":["n10-event"],"evidence":"Делит число благоприятных исходов на число всех равновероятных исходов."},{"id":"n10-complement","label":"Находить вероятность противоположного события","requires":["n10-ratio"],"evidence":"Использует 1 − p и объясняет, какие два события вместе охватывают весь опыт."},{"id":"n10-change","label":"Обновлять состав после извлечения","requires":["n10-ratio"],"evidence":"После извлечения без возвращения пересчитывает и подходящие предметы, и общее число."},{"id":"n10-construct","label":"Создавать опыт с заданной вероятностью","requires":["n10-ratio"],"evidence":"Подбирает целое число подходящих предметов под заданную вероятность."},{"id":"exp-n10-sequential","label":"Сравнивать два извлечения с возвращением и без него","requires":["n10-change","n10-ratio"],"evidence":"Для двух последовательных извлечений обновляет состав перед вторым шагом и перемножает вероятности вдоль нужной ветви."},{"id":"exp-n10-frequency","label":"Отличать относительную частоту события от его вероятности","requires":["n10-ratio"],"evidence":"Вычисляет долю успехов в наблюдаемой серии и отдельно использует явно заданную вероятность независимого следующего испытания."}],"quick":[{"id":"n10-q1","title":"Красный шар","prompt":"В мешке 3 красных и 2 синих одинаковых шара. Один шар выбирают случайно. Найди вероятность красного шара. Ответ запиши десятичной дробью.","type":"number","skillId":"n10-ratio","answer":0.6,"hint":"Посчитай отдельно красные шары и все шары.","explanation":"Красных 3, всего 5. Вероятность равна 3/5 = 0,6."},{"id":"n10-q2","title":"Больше четырёх","prompt":"Бросают обычный честный шестигранный кубик. Какова вероятность получить число больше 4?","type":"choice","skillId":"n10-event","options":[{"text":"1/6","correct":false},{"text":"1/3","correct":true},{"text":"1/2","correct":false},{"text":"2/3","correct":false}],"hint":"Какие именно грани подходят к словам «больше 4»?","explanation":"Подходят 5 и 6: два исхода из шести. 2/6 = 1/3."},{"id":"n10-q3","title":"Не прошёл проверку","prompt":"Вероятность того, что деталь пройдёт проверку, равна 0,84. Других вариантов, кроме «прошла» и «не прошла», нет. Найди вероятность того, что деталь не пройдёт проверку.","type":"number","skillId":"n10-complement","answer":0.16,"hint":"Вероятности двух противоположных событий в сумме дают 1.","explanation":"1 − 0,84 = 0,16."},{"id":"n10-q4","title":"Один шар уже вынули","prompt":"В мешке было 4 красных и 6 синих одинаковых шаров. Один синий вынули и не вернули. Какова вероятность теперь случайно вынуть красный шар?","type":"choice","skillId":"n10-change","options":[{"text":"4/10","correct":false},{"text":"3/9","correct":false},{"text":"4/9","correct":true},{"text":"5/9","correct":false}],"hint":"Красных стало меньше? А сколько всего шаров осталось?","explanation":"Красных осталось 4, а всего шаров теперь 9. Вероятность равна 4/9."},{"id":"exp-n10-return-entry","title":"Два красных подряд","type":"number","skillId":"exp-n10-sequential","prompt":"В мешке 2 красных и 3 синих одинаковых на ощупь шара. Шар достают наудачу, возвращают, перемешивают и достают снова. Найди вероятность двух красных шаров.","answer":0.16,"hint":"После возвращения состав тот же. Вероятность двух нужных исходов равна произведению вероятностей соответствующих шагов.","explanation":"На каждом шаге вероятность красного равна 2/5. Благодаря возвращению и перемешиванию второй выбор имеет ту же вероятность. Два красных: (2/5) · (2/5) = 4/25 = 0,16."},{"id":"exp-n10-return-exit","title":"Теперь без возвращения","type":"number","skillId":"exp-n10-sequential","prompt":"В мешке 4 красных и 1 синий шар. Дважды достают шар наудачу без возвращения. Какова вероятность, что оба шара окажутся красными?","answer":0.6,"hint":"Если первый шар красный, перед вторым извлечением уменьшаются и число красных, и общее число шаров.","explanation":"Первый красный имеет вероятность 4/5. После него остаются 3 красных из 4 шаров. Получаем (4/5) · (3/4) = 3/5 = 0,6. Не следует второй раз брать 4/5: состав изменился."},{"id":"exp-n10-frequency-entry","title":"Что получилось в серии","type":"number","skillId":"exp-n10-frequency","prompt":"Честную монету бросили 40 раз и получили 24 орла. Найди относительную частоту орла именно в этой серии.","answer":0.6,"hint":"Для частоты нужны наблюдавшиеся орлы и общее число бросков.","explanation":"Относительная частота равна 24/40 = 0,6. Честность монеты задаёт вероятность модели, но не требует ровно половины орлов в каждой конечной серии."},{"id":"exp-n10-frequency-exit","title":"Что известно о следующем броске","type":"number","skillId":"exp-n10-frequency","prompt":"Броски честной монеты независимы. В 30 прошедших бросках было 12 орлов. Какова вероятность орла в следующем броске?","answer":0.5,"hint":"Вопрос относится к следующему независимому броску. Какая вероятность задана моделью честной монеты?","explanation":"Вероятность следующего орла равна 1/2 = 0,5. Частота прошлой серии равна 12/30 = 0,4, но она не заменяет заданную вероятность независимого следующего броска."}],"creative":[{"id":"n10-c1","title":"Настрой барабан","prompt":"В барабане 12 одинаковых шаров. Настрой число красных так, чтобы вероятность красного шара была 1/3.","type":"probability","skillId":"n10-construct","total":12,"numerator":1,"denominator":3,"hint":"Найди треть от общего числа шаров.","explanation":"Нужно 4 красных шара из 12: 4/12 = 1/3. Остальные 8 шаров должны быть другого цвета."},{"id":"n10-c2","title":"Один исход — один пропуск","prompt":"На кубике подходят числа, которые чётные ИЛИ больше 4. Отметь все подходящие грани. Одну грань учитываем только один раз.","type":"multi","skillId":"n10-event","options":[{"text":"1","correct":false},{"text":"2","correct":true},{"text":"3","correct":false},{"text":"4","correct":true},{"text":"5","correct":true},{"text":"6","correct":true}],"hint":"Сначала найди чётные, затем добавь ещё не выбранные числа больше 4.","explanation":"Подходят 2, 4, 5 и 6. Число 6 удовлетворяет обоим условиям, но остаётся одним исходом. Всего 4 исхода из 6."},{"id":"n10-c3","title":"Ловушка трёх названий","prompt":"Две честные монеты бросают независимо. Кто-то назвал три варианта: «два орла», «один орёл», «ни одного орла» — и дал каждому вероятность 1/3. Какова на самом деле вероятность ровно одного орла?","type":"choice","skillId":"n10-outcomes","options":[{"text":"1/4","correct":false},{"text":"1/3","correct":false},{"text":"1/2","correct":true},{"text":"2/3","correct":false}],"hint":"Различай монеты: орёл на первой и орёл на второй — разные исходы.","explanation":"Четыре равновероятных исхода: ОО, ОР, РО, РР. Ровно один орёл есть в ОР и РО, поэтому вероятность 2/4 = 1/2. Три словесных названия не делают события равновероятными."},{"id":"exp-n10-return-creative","originAtlasId":"10.1","title":"С возвращением и без возвращения","type":"build","skillId":"exp-n10-sequential","prompt":"Из мешка с 3 красными и 1 синим шаром планируют два извлечения наудачу. Сравни два опыта: первый шар возвращают или оставляют снаружи. Для случая, когда первым выбран красный, укажи число красных перед вторым выбором. Затем найди вероятность двух красных до начала опыта в каждом варианте. Каждый доступный шар выбирается равновероятно.","fields":[{"name":"redBack","label":"Красных перед вторым выбором, если вернули","min":0,"max":4,"integer":true,"initial":0},{"name":"redAway","label":"Красных перед вторым выбором, если не вернули","min":0,"max":3,"integer":true,"initial":0},{"name":"pBack","label":"Вероятность двух красных с возвращением","min":0,"max":1,"initial":0},{"name":"pAway","label":"Вероятность двух красных без возвращения","min":0,"max":1,"initial":0}],"constants":{},"conditions":[{"left":"redBack","op":"eq","right":"3"},{"left":"redAway","op":"eq","right":"2"},{"left":"pBack","op":"eq","right":"3/4*redBack/4"},{"left":"pAway","op":"eq","right":"3/4*redAway/3"}],"exampleSolution":{"redBack":3,"redAway":2,"pBack":0.5625,"pAway":0.5},"hint":"При возвращении снова 4 шара, без возвращения — 3. Вероятности в последних двух полях считаются до обоих извлечений: учти и первый красный шар.","explanation":"Если красный вернули, перед вторым выбором 3 красных из 4, а вероятность двух красных равна (3/4) · (3/4) = 9/16. Если не вернули, осталось 2 красных из 3, а вероятность двух красных равна (3/4) · (2/3) = 1/2. Числа 3/4 и 2/3 описывают только второй шаг после уже известного красного; это другой вопрос."},{"id":"exp-n10-frequency-creative","originAtlasId":"10.2","title":"Частота и вероятность","type":"multi","skillId":"exp-n10-frequency","prompt":"Броски честной монеты независимы. В первой серии из 20 бросков было 14 орлов, во второй серии из 20 — 6. Отметь все выводы, которые следуют из этих условий.","options":[{"text":"Частота орла в первой серии равна 0,7.","correct":true},{"text":"Частота орла во второй серии равна 0,3.","correct":true},{"text":"Вероятность орла в следующем броске равна 0,5.","correct":true},{"text":"Вероятность орла стала 0,7 после первой серии и 0,3 после второй.","correct":false},{"text":"В следующих 200 бросках обязательно будет ровно 100 орлов.","correct":false},{"text":"После серии с 14 орлами следующий бросок обязан дать решку.","correct":false}],"hint":"Раздели два вопроса: что уже произошло в серии и что модель говорит об одном новом броске.","explanation":"Частоты равны 14/20 = 0,7 и 6/20 = 0,3. Для каждого независимого броска честной монеты вероятность орла равна 1/2. Конечная серия не обязана иметь ровно половину орлов; будущие броски не должны компенсировать уже полученные результаты. Честность здесь дана условием, а не доказана этими двумя сериями."}],"extensions":["Исследовать разницу между теоретической вероятностью и результатом короткой серии испытаний.","Составлять собственные задачи с равновероятными исходами и проверять, не учтён ли один исход дважды.","Вычислять вероятность цепочки нескольких случайных извлечений без возвращения."],"overviewTaskIds":["n10-q1","n10-q2","n10-q3","n10-q4"]},{"id":"n11","title":"№11. Функции и графики","goal":"Короткий вход: связать простые формулы с графиками и значениями. В дополнительных заданиях можно управлять прямой и восстанавливать зависимости по условиям.","sourceHref":"/trainers/oge-task11-graphs-trainer.html","skills":[{"id":"n11-coordinates","label":"Связывать точку и значение функции","requires":[],"evidence":"Проверяет принадлежность точки графику подстановкой её координат."},{"id":"n11-rate","label":"Находить угловой коэффициент прямой","requires":["n11-coordinates"],"evidence":"Определяет изменение y при изменении x и различает возрастание и убывание."},{"id":"n11-intercept","label":"Находить свободный член","requires":["n11-coordinates"],"evidence":"Связывает b в y = kx + b со значением при x = 0.","relatedTasks":["n11-c1","n11-c2"],"relatedFamilies":["func-line-builder","func-reverse-recovery"],"separateCheck":false},{"id":"n11-linear","label":"Восстанавливать линейную функцию","requires":["n11-rate","n11-intercept"],"evidence":"Находит k и b по двум разным значениям x и проверяет обе точки."},{"id":"n11-quadratic","label":"Связывать параболу с её условиями","requires":["n11-coordinates"],"evidence":"Проверяет нули и контрольную точку квадратичной функции."},{"id":"n11-inverse","label":"Узнавать постоянное произведение","requires":["n11-coordinates"],"evidence":"Для y = k/x использует xy = k, учитывает x ≠ 0 и знаки координат."},{"id":"exp-n11-model-choice","label":"Различать две формулы по значениям функции","requires":["n11-coordinates"],"evidence":"Подставляет одно значение аргумента в заданные формулы и выбирает ту, которая даёт полученное значение функции."},{"id":"exp-n11-piecewise","label":"Выбирать формулу для нужного участка","requires":["n11-coordinates","n11-linear"],"evidence":"Учитывает область действия каждого правила, начало отсчёта дополнительной величины и значение на границе участков."}],"quick":[{"id":"n11-q1","title":"Формула по графику","prompt":"Какая формула задаёт изображённую прямую?","type":"choice","skillId":"n11-linear","hint":"Точка с x = 0 сразу показывает b. Затем используй вторую точку.","explanation":"Из точки (0; −2) получаем b = −2. Затем 3k − 2 = 1, поэтому k = 1. Формула: y = x − 2.","visual":{"kind":"graph","k":1,"b":-2,"points":[]},"options":[{"text":"y = x − 2","correct":true},{"text":"y = −x − 2","correct":false},{"text":"y = x + 2","correct":false}]},{"id":"n11-q2","title":"Точка по формуле","prompt":"Функция задана формулой y = 3x − 2. Найди y при x = −1.","type":"number","skillId":"n11-coordinates","answer":-5,"hint":"Сначала вычисли 3 · (−1), затем вычти 2.","explanation":"y = 3 · (−1) − 2 = −3 − 2 = −5."},{"id":"n11-q3","title":"Где парабола пересекает ось","prompt":"При каких значениях x график y = x² − 4 пересекает ось абсцисс?","type":"choice","skillId":"n11-quadratic","options":[{"text":"Только при x = 2","correct":false},{"text":"При x = −2 и x = 2","correct":true},{"text":"При x = −4 и x = 4","correct":false},{"text":"Не пересекает ось x","correct":false}],"hint":"На оси x значение y равно нулю. Реши x² − 4 = 0.","explanation":"x² = 4, поэтому x = −2 или x = 2. Точки пересечения: (−2; 0) и (2; 0)."},{"id":"n11-q4","title":"Точка гиперболы","prompt":"График задан формулой y = 12/x. Найди y при x = −3.","type":"number","skillId":"n11-inverse","answer":-4,"hint":"Подставь −3 вместо x. Проверь знак частного.","explanation":"y = 12/(−3) = −4. Проверка: (−3) · (−4) = 12."},{"id":"exp-n11-probe-entry","title":"Точка различает формулы","type":"choice","skillId":"exp-n11-model-choice","prompt":"Известно, что функция задана одной из двух формул: y = 3x или y = x². При x = 2 значение функции равно 6. Какая формула подходит?","options":[{"text":"y = 3x","correct":true},{"text":"y = x²","correct":false},{"text":"Подходят обе формулы","correct":false}],"hint":"Подставь одну и ту же координату x = 2 в обе формулы.","explanation":"Первая формула даёт 3 · 2 = 6, вторая — 2² = 4. Точка (2; 6) подходит только y = 3x. Выбор делается среди двух заданных формул; одна точка не определяет произвольную функцию."},{"id":"exp-n11-probe-exit","title":"Проверь новые формулы","type":"choice","skillId":"exp-n11-model-choice","prompt":"Функция задана одной из двух формул: y = 4x или y = x². При x = −1 получили y = 1. Какая формула соответствует этим значениям?","options":[{"text":"y = 4x","correct":false},{"text":"y = x²","correct":true},{"text":"По этим значениям формулы не различить","correct":false}],"hint":"Не потеряй скобки при возведении отрицательного числа в квадрат.","explanation":"При x = −1 первая формула даёт −4, вторая — (−1)² = 1. Поэтому из двух заданных формул подходит y = x². Совпадение с точкой позволяет сделать выбор в пределах этого явно заданного списка."},{"id":"exp-n11-tariff-entry","title":"Оплачивается только добавка","type":"number","skillId":"exp-n11-piecewise","prompt":"Первые 3 км поездки включительно стоят 150 рублей. Каждый километр сверх 3 км стоит 25 рублей; неполный километр оплачивается пропорционально. Сколько стоит поездка на 5 км?","answer":200,"unit":"руб.","hint":"Сначала выясни, сколько километров вышло за включённые три.","explanation":"Дополнительно оплачиваются 5 − 3 = 2 км. Стоимость: 150 + 25 · 2 = 200 рублей. Прибавлять 25 · 5 нельзя: первые 3 км уже включены в 150 рублей."},{"id":"exp-n11-tariff-exit","title":"После границы тарифа","type":"number","skillId":"exp-n11-piecewise","prompt":"Поездка до 4 км включительно стоит 180 рублей. Расстояние сверх 4 км оплачивается пропорционально по 20 рублей за километр. Найди стоимость поездки на 7,5 км.","answer":250,"unit":"руб.","hint":"Формула дополнительной платы использует расстояние после четырёх километров.","explanation":"Сверх включённых 4 км проехали 7,5 − 4 = 3,5 км. Общая стоимость: 180 + 20 · 3,5 = 250 рублей. Пропорциональная оплата допускает неполный километр без округления вверх."}],"creative":[{"id":"n11-c1","title":"Построй прямую через две точки","prompt":"Подбери угловой коэффициент k и свободный член b в формуле y = kx + b, чтобы прямая прошла через точки (0; −1) и (2; 3).","type":"graph","skillId":"n11-linear","k":2,"b":-1,"points":[[0,-1],[2,3]],"hint":"При x = 0 значение y равно b. Затем сравни изменения координат между двумя точками.","explanation":"b = −1. При увеличении x на 2 значение y увеличилось на 4, поэтому k = 4/2 = 2. Получается y = 2x − 1."},{"id":"n11-c2","title":"Восстанови формулу линейной функции","prompt":"Известно, что f(x) = kx + b, f(0) = 3 и f(2) = −1. Найди коэффициенты k и b.","type":"build","skillId":"n11-linear","fields":[{"name":"k","label":"Коэффициент k","min":-5,"max":5,"step":1,"initial":0},{"name":"b","label":"Свободный член b","min":-6,"max":6,"step":1,"initial":0}],"constants":{},"conditions":[{"left":"k*0+b","op":"eq","right":"3"},{"left":"k*2+b","op":"eq","right":"-1"}],"exampleSolution":{"k":-2,"b":3},"hint":"Равенство f(0) = 3 определяет b. Затем используй значение функции при x = 2.","explanation":"Из f(0) = 3 следует b = 3. Затем 2k + 3 = −1, откуда k = −2. Восстановленная функция: f(x) = −2x + 3."},{"id":"n11-c3","title":"Парабола под заказ","prompt":"Настрой a, b и c в y = ax² + bx + c. Нули должны быть x = −1 и x = 3, а при x = 0 должно получаться y = −3.","type":"build","skillId":"n11-quadratic","fields":[{"name":"a","label":"Коэффициент a","min":-3,"max":3,"step":1,"initial":0},{"name":"b","label":"Коэффициент b","min":-6,"max":6,"step":1,"initial":0},{"name":"c","label":"Коэффициент c","min":-9,"max":9,"step":1,"initial":0}],"constants":{},"conditions":[{"left":"a-b+c","op":"eq","right":"0"},{"left":"9*a+3*b+c","op":"eq","right":"0"},{"left":"c","op":"eq","right":"-3"},{"left":"a","op":"gt","right":"0"}],"exampleSolution":{"a":1,"b":-2,"c":-3},"hint":"Значение при x = 0 определяет c. Подставь затем −1 и 3 в выражение ax² + bx + c.","explanation":"Получается a = 1, b = −2, c = −3. Формула y = x² − 2x − 3 = (x + 1)(x − 3) даёт оба заданных нуля и значение −3 при x = 0."},{"id":"n11-c4","title":"Точка с отрицательными координатами","prompt":"Найди точку графика y = 12/x, обе координаты которой отрицательны. Выбери x и y так, чтобы их произведение было равно 12.","type":"build","skillId":"n11-inverse","fields":[{"name":"x","label":"Координата x","min":-6,"max":-1,"step":1,"initial":-1},{"name":"y","label":"Координата y","min":-12,"max":-1,"step":1,"initial":-1}],"constants":{"product":12},"conditions":[{"left":"x*y","op":"eq","right":"product"},{"left":"x","op":"lt","right":"0"},{"left":"y","op":"lt","right":"0"}],"exampleSolution":{"x":-2,"y":-6},"hint":"Если x = −2, какое отрицательное число надо умножить на −2, чтобы получить 12?","explanation":"Например, подходит точка (−2; −6): (−2) · (−6) = 12. Подойдут и другие пары из доступного диапазона с тем же произведением. При x = 0 формула y = 12/x не определена."},{"id":"n11-c5","title":"Суд над графиком","prompt":"Для функции y = −2x + 3 отметь все верные утверждения. Каждое можно проверить подстановкой или направлением изменения.","type":"multi","skillId":"n11-coordinates","options":[{"text":"При x = 0 значение y равно 3","correct":true},{"text":"При увеличении x значение y увеличивается","correct":false},{"text":"Точка (−1; 5) лежит на графике","correct":true},{"text":"При x = 2 значение y положительно","correct":false},{"text":"Нуль функции равен 1,5","correct":true}],"hint":"Проверь спорные утверждения по одному. Чтобы найти нуль, приравняй −2x + 3 к нулю.","explanation":"Верны первое, третье и пятое утверждения. Коэффициент −2 означает убывание; при x = 2 получаем y = −1. Уравнение −2x + 3 = 0 даёт x = 1,5."},{"id":"exp-n11-probe-creative","originAtlasId":"11.1","title":"Выбери значение x для проверки","type":"experiment","skillId":"exp-n11-model-choice","prompt":"Функция задана одной из двух формул. Уже известны точки (0; 0) и (2; 4): они подходят обеим. Выбери значение аргумента x. Получи значение функции y. Определи, какая формула соответствует данным. Можно проверить несколько значений x.","variable":"x","models":[{"id":"linear","label":"y = 2x","expression":"2*x"},{"id":"quadratic","label":"y = x²","expression":"x^2"}],"known":[{"x":0,"y":0},{"x":2,"y":4}],"probeValues":[0,1,2],"secretModelId":"quadratic","requireDistinguishingProbe":true,"exampleSolution":{"probes":[1],"modelId":"quadratic"},"hint":"Подставь доступные значения x в обе формулы. Полезна проверка, при которой значения функций различаются.","explanation":"При x = 0 обе формулы дают 0, при x = 2 обе дают 4: эти значения не различают формулы. При x = 1 формула y = 2x даёт 2, а y = x² — 1. Полученное значение равно 1, поэтому из двух заданных формул подходит y = x². Одна точка не определяет произвольную неизвестную функцию: здесь выбор заранее ограничен двумя формулами."},{"id":"exp-n11-tariff-creative","originAtlasId":"11.2","title":"Стоимость поездки по участкам","type":"build","skillId":"exp-n11-piecewise","prompt":"До 2 км включительно поездка стоит 120 рублей. Дальнейшее расстояние оплачивается пропорционально по 30 рублей за километр. Для участка x > 2 собери формулу цены y = kx + b. Стыковка при x = 2 должна давать те же 120 рублей.","fields":[{"name":"k","label":"Коэффициент k, руб./км","min":0,"max":60,"initial":0},{"name":"b","label":"Свободный член b, руб.","min":-60,"max":180,"initial":0}],"constants":{},"conditions":[{"left":"k","op":"eq","right":"30"},{"left":"2*k+b","op":"eq","right":"120"}],"exampleSolution":{"k":30,"b":60},"visual":{"kind":"piecewise","segments":[{"from":0,"to":2,"leftClosed":true,"rightClosed":true,"expression":"120"},{"from":2,"to":7,"leftClosed":false,"rightClosed":true,"expression":"k*x+b"}],"dynamic":{"kind":"formula","fields":["k","b"]},"xDomain":[0,7],"yDomain":[-100,650],"xLabel":"Расстояние, км","yLabel":"Цена, руб.","ariaLabel":"Текущий график тарифа: до двух километров цена постоянна, затем действует введённая линейная формула."},"hint":"За каждый дополнительный километр цена возрастает на 30. Учти, что дополнительный путь начинается после 2 км.","explanation":"При x > 2 стоимость равна 120 + 30(x − 2) = 30x + 60. Поэтому k = 30, b = 60. В точке 2 обе записи дают 120; при 5 км цена 210. Выражение 120 + 30x начислило бы дополнительную плату и за уже включённые километры."}],"extensions":["После короткой практики можно построить прямую по двум точкам, восстановить формулу линейной функции или исследовать параболу и гиперболу.","Углубление: объяснить, почему одной точки недостаточно для восстановления прямой.","Связать наклон с изменением координаты во времени, различая координату и пройденный путь.","Проверить знакомую идею на новых числах после перерыва."],"overviewTaskIds":["n11-q1","n11-q2","n11-q3","n11-q4"]},{"id":"n12","title":"№12. Вычисления по формулам","goal":"Короткий вход: подставить значения и найти нужную величину. Дополнительно можно восстанавливать формулы и подбирать параметры под ограничения.","sourceHref":"/trainers/oge-task12-formulas-trainer.html","skills":[{"id":"n12-symbols","label":"Понимать обозначения и единицы","requires":[],"evidence":"Различает величины в условии и не смешивает несовместимые единицы.","relatedTasks":["n12-c2"],"relatedFamilies":["exam-formula-resistance"],"separateCheck":true},{"id":"n12-substitute","label":"Подставлять значения в формулу","requires":["n12-symbols"],"evidence":"Заменяет каждую букву её значением, сохраняя порядок действий."},{"id":"n12-operations","label":"Считать степени и корни в формуле","requires":["n12-substitute"],"evidence":"Отдельно выполняет действия в скобках, степени и корни, затем остальные операции."},{"id":"n12-isolate","label":"Выражать нужную величину","requires":["n12-substitute"],"evidence":"Преобразует равенство и проверяет полученную формулу обратной подстановкой."},{"id":"n12-constraints","label":"Учитывать ограничения параметров","requires":["n12-substitute"],"evidence":"Подбирает значения, которые одновременно удовлетворяют формуле и условиям задачи."}],"quick":[{"id":"n12-q1","title":"Площадь по двум данным","prompt":"Площадь треугольника вычисляется по формуле S = ah/2. Основание a = 10 см, высота h = 7 см. Найди S.","type":"number","skillId":"n12-substitute","answer":35,"unit":"см²","hint":"Подставь обе длины, перемножь их и раздели результат на 2.","explanation":"S = 10 · 7 / 2 = 35 см²."},{"id":"n12-q2","title":"Скорость","prompt":"При равномерном движении v = s/t. Пройдено s = 150 км за t = 2,5 ч. Найди скорость.","type":"number","skillId":"n12-substitute","answer":60,"unit":"км/ч","hint":"Делим расстояние на время: 150 : 2,5.","explanation":"v = 150 / 2,5 = 60 км/ч."},{"id":"n12-q3","title":"Диагональ","prompt":"Диагональ прямоугольника находят по формуле d = √(a² + b²). Стороны a = 6 см и b = 8 см. Найди d.","type":"number","skillId":"n12-operations","answer":10,"unit":"см","hint":"Сначала вычисли оба квадрата, затем их сумму, затем корень.","explanation":"d = √(36 + 64) = √100 = 10 см."},{"id":"n12-q4","title":"Формула для времени","prompt":"Из формулы s = v · t вырази t. Считай, что v ≠ 0.","type":"choice","skillId":"n12-isolate","options":[{"text":"t = s · v","correct":false},{"text":"t = v/s","correct":false},{"text":"t = s/v","correct":true},{"text":"t = s − v","correct":false}],"hint":"Как отменить умножение неизвестного t на v?","explanation":"Делим обе части равенства на ненулевое v и получаем t = s/v."},{"id":"exp-n12-units-entry","title":"Минуты в формуле пути","type":"number","skillId":"n12-symbols","prompt":"Автомобиль едет со скоростью 48 км/ч в течение 15 минут. По формуле s = vt найди пройденное расстояние в километрах.","answer":12,"unit":"км","hint":"Время должно быть выражено в часах, если скорость дана в километрах в час.","explanation":"15 минут = 15/60 = 1/4 часа. Поэтому s = 48 · 1/4 = 12 км. Произведение 48 · 15 без согласования единиц не является расстоянием в километрах."},{"id":"exp-n12-units-exit","title":"Новая скорость и новое время","type":"number","skillId":"n12-symbols","prompt":"Поезд движется равномерно со скоростью 60 км/ч. Какое расстояние он пройдёт за 18 минут? Ответ дай в километрах.","answer":18,"unit":"км","hint":"Переведи 18 минут в долю часа или сначала найди путь за одну минуту.","explanation":"18 минут = 18/60 = 0,3 часа. Путь равен 60 · 0,3 = 18 км. Другой путь: 60 км за 60 минут означает 1 км за минуту; за 18 минут получится 18 км."},{"id":"exp-n12-secrets-entry","title":"Сумма и произведение уже известны","type":"number","skillId":"n12-substitute","prompt":"Вычисли F = 2ab/(a + b), если a + b = 8, ab = 15, a > 0 и b > 0.","answer":3.75,"hint":"В формуле встречаются готовые блоки ab и a + b. Подставь их значения целиком.","explanation":"F = (2 · 15)/8 = 30/8 = 3,75. Отдельные a и b искать не требуется. Данные согласованы: например, a = 3, b = 5."},{"id":"exp-n12-secrets-exit","title":"Подставь нужные блоки","type":"number","skillId":"n12-substitute","prompt":"Дано a + b = 15, ab = 54, a > 0 и b > 0. Найди значение 2ab/(a + b).","answer":7.2,"hint":"Числитель равен удвоенному произведению, знаменатель — известной сумме.","explanation":"Получаем 2 · 54 / 15 = 108/15 = 7,2. Например, числа 6 и 9 удовлетворяют обоим данным; восстанавливать их для вычисления не обязательно."}],"creative":[{"id":"n12-c1","title":"Одна площадь — разные треугольники","prompt":"Выбери основание a и высоту h так, чтобы площадь треугольника S = ah/2 была равна 24. Подойдёт любая подходящая пара.","type":"build","skillId":"n12-constraints","fields":[{"name":"a","label":"Основание a","min":1,"max":16,"step":1,"initial":1},{"name":"h","label":"Высота h","min":1,"max":16,"step":1,"initial":1}],"constants":{"area":24},"conditions":[{"left":"a*h/2","op":"eq","right":"area"}],"exampleSolution":{"a":6,"h":8},"hint":"Произведение основания и высоты должно быть вдвое больше площади.","explanation":"Нужно a · h = 48. Например, a = 6 и h = 8 дают 6 · 8 / 2 = 24. Другие допустимые пары с тем же произведением тоже верны."},{"id":"n12-c2","title":"Верни формуле нужную букву","prompt":"Соедини исходную формулу с верно выраженной величиной. Условия о ненулевых делителях уже указаны.","type":"match","skillId":"n12-isolate","pairs":[{"left":"s = v · t, v ≠ 0; найти t","right":"t = s/v"},{"left":"A = x · y, y ≠ 0; найти x","right":"x = A/y"},{"left":"P = 2(a + b); найти b","right":"b = P/2 − a"},{"left":"F = k · x, x ≠ 0; найти k","right":"k = F/x"}],"hint":"Отменяй действия в обратном порядке. Для P = 2(a + b) сначала раздели на 2.","explanation":"При выражении неизвестного выполняем одинаковые допустимые действия с обеими частями равенства. В формуле периметра после деления на 2 нужно ещё вычесть a."},{"id":"n12-c3","title":"Успеть без превышения","prompt":"Нужно проехать 150 км с постоянной скоростью. Выбери скорость v не больше 60 км/ч и время t не больше 3 ч так, чтобы выполнялось s = v · t.","type":"build","skillId":"n12-constraints","fields":[{"name":"v","label":"Скорость v, км/ч","min":30,"max":90,"step":5,"initial":30},{"name":"t","label":"Время t, ч","min":0.5,"max":5,"step":0.5,"initial":1}],"constants":{"distance":150},"conditions":[{"left":"v*t","op":"eq","right":"distance"},{"left":"v","op":"lte","right":"60"},{"left":"t","op":"lte","right":"3"}],"exampleSolution":{"v":50,"t":3},"hint":"Одного равенства v · t = 150 мало: проверь ещё ограничения скорости и времени.","explanation":"Например, v = 50 и t = 3 дают 150 км и удовлетворяют обоим ограничениям. Также подходит v = 60 и t = 2,5. Принимается любая доступная пара, выполняющая все условия."},{"id":"exp-n12-units-creative","originAtlasId":"12.1","title":"Согласуй единицы измерения","type":"build","skillId":"n12-symbols","prompt":"Один путь описан двумя способами: движение со скоростью 72 км/ч длится 30 минут. Собери согласованные расчёты через часы и километры, затем через секунды и метры. Во втором расчёте время уже переведено: 1800 секунд.","fields":[{"name":"hours","label":"Время в часах","min":0,"max":2,"initial":0},{"name":"mps","label":"Скорость в метрах в секунду","min":0,"max":100,"initial":0},{"name":"km","label":"Расстояние в километрах","min":0,"max":150,"initial":0},{"name":"metres","label":"То же расстояние в метрах","min":0,"max":150000,"initial":0}],"constants":{},"conditions":[{"left":"60*hours","op":"eq","right":"30"},{"left":"3600*mps","op":"eq","right":"72000"},{"left":"km","op":"eq","right":"72*hours"},{"left":"metres","op":"eq","right":"1800*mps"},{"left":"1000*km","op":"eq","right":"metres"}],"exampleSolution":{"hours":0.5,"mps":20,"km":36,"metres":36000},"hint":"В часе 60 минут и 3600 секунд, в километре 1000 метров. Оба расчёта должны описывать один и тот же путь.","explanation":"30 минут = 0,5 часа; 72 км/ч = 72000 м / 3600 с = 20 м/с. Первый расчёт: 72 · 0,5 = 36 км. Второй: 20 · 1800 = 36000 м. Величина расстояния одинакова: 36 км = 36000 м."},{"id":"exp-n12-secrets-creative","originAtlasId":"12.2","title":"Каких данных достаточно?","type":"multi","skillId":"n12-substitute","prompt":"Для положительных a и b нужно найти F = 2ab/(a + b). Какие наборы сведений позволяют однозначно вычислить F? Каждый набор рассматривай отдельно. Отметь все достаточные наборы.","options":[{"text":"a + b = 10 и ab = 21","correct":true},{"text":"Только a − b = 4","correct":false},{"text":"a = 3 и b = 7","correct":true},{"text":"Только a + b = 10","correct":false},{"text":"Только a/b = 3","correct":false}],"hint":"Проверь, известны ли нужные числитель и знаменатель. Чтобы опровергнуть достаточность, найди два допустимых набора a, b с разными F.","explanation":"Достаточны первый и третий наборы: оба дают F = 42/10 = 4,2. Одна разность, сумма или отношение значения не фиксируют. Например, при сумме 10 пары (1; 9) и (5; 5) дают F = 1,8 и 5; при отношении 3 пары (3; 1) и (6; 2) дают 1,5 и 3; при разности 4 пары (5; 1) и (6; 2) дают 5/3 и 3. Все эти числа положительны."}],"extensions":["Отдельно потренировать единицы измерения, если затруднение возникает ещё до подстановки.","Составлять собственные заказы с несколькими ограничениями и проверять, существует ли решение.","Разбирать, какие значения нельзя подставлять в знаменатель или под квадратный корень."],"overviewTaskIds":["n12-q1","n12-q2","n12-q3","n12-q4"]},{"id":"n13","title":"№13. Неравенства","goal":"Короткий вход: решить несколько характерных неравенств и записать границы. Дополнительные задания помогают увидеть смену порядка и пересечение условий.","sourceHref":"/trainers/oge13-inequalities-series.html","skills":[{"id":"n13-order","label":"Сравнивать числа на прямой","requires":[],"evidence":"Различает больше и меньше, в том числе для отрицательных чисел.","relatedTasks":["n13-c1"],"relatedFamilies":["exam-inequality-picture"],"separateCheck":false},{"id":"n13-add","label":"Добавлять одно число к обеим частям","requires":["n13-order"],"evidence":"Переносит слагаемое через одинаковое действие с обеими частями неравенства.","relatedTasks":["n13-c3"],"relatedFamilies":["exam-inequality-picture"],"separateCheck":false},{"id":"n13-scale","label":"Менять знак неравенства при умножении на отрицательное число","requires":["n13-order"],"evidence":"При умножении или делении обеих частей на отрицательное число меняет направление неравенства."},{"id":"n13-boundaries","label":"Различать строгие и нестрогие границы","requires":["n13-add","n13-scale"],"evidence":"Проверяет граничное значение подстановкой и выбирает нужную скобку."},{"id":"n13-intersection","label":"Выполнять несколько условий сразу","requires":["n13-boundaries"],"evidence":"Находит пересечение множеств решений, а не объединяет все подходящие отдельным условиям числа."},{"id":"n13-square","label":"Решать простое неравенство с квадратом","requires":["n13-boundaries"],"evidence":"Учитывает обе стороны от нуля в неравенствах вида x² < a²."}],"quick":[{"id":"n13-q1","title":"Деление на отрицательное","prompt":"Выбери решение неравенства −3x > 12.","type":"choice","skillId":"n13-scale","options":[{"text":"x > −4","correct":false},{"text":"x < −4","correct":true},{"text":"x > 4","correct":false},{"text":"x < 4","correct":false}],"hint":"При делении обеих частей на −3 направление неравенства меняется.","explanation":"Делим на −3: x < −4. Например, x = −5 даёт 15 > 12, а x = −4 даёт равенство и не подходит."},{"id":"n13-q2","title":"Правая граница","prompt":"Реши 2x + 3 ≤ 11. Отметь на прямой правую границу множества решений.","type":"numberline","skillId":"n13-boundaries","min":-2,"max":8,"answer":4,"hint":"Вычти 3 из обеих частей и раздели на 2.","explanation":"2x ≤ 8, поэтому x ≤ 4. Правая граница равна 4; само число 4 входит в решение."},{"id":"n13-q3","title":"Оба условия","prompt":"Число должно одновременно удовлетворять x > 2 и x ≤ 5. Какой промежуток подходит?","type":"choice","skillId":"n13-intersection","options":[{"text":"[2; 5]","correct":false},{"text":"(2; 5]","correct":true},{"text":"(2; 5)","correct":false},{"text":"(−∞; 5]","correct":false}],"hint":"Проверь отдельно числа 2 и 5: какое из них допускается?","explanation":"Число 2 исключено строгим условием x > 2, а число 5 разрешено. Получается (2; 5]."},{"id":"n13-q4","title":"Квадрат меньше девяти","prompt":"Выбери все решения неравенства x² < 9 одним промежутком.","type":"choice","skillId":"n13-square","options":[{"text":"(−∞; 3)","correct":false},{"text":"(0; 3)","correct":false},{"text":"(−3; 3)","correct":true},{"text":"[−3; 3]","correct":false}],"hint":"И положительные, и отрицательные числа могут иметь квадрат меньше 9. Что происходит на границах −3 и 3?","explanation":"x² < 9 означает |x| < 3, поэтому −3 < x < 3. Границы не входят: их квадраты равны 9."},{"id":"exp-n13-strict-entry","title":"Встреча двух границ","type":"choice","skillId":"n13-boundaries","prompt":"Реши систему x ≥ −2 и x ≤ −2. Каково множество её решений?","options":[{"text":"Только число −2","correct":true},{"text":"Решений нет","correct":false},{"text":"Все числа меньше −2","correct":false},{"text":"Все действительные числа","correct":false}],"hint":"Нужно выполнить оба условия одновременно. Проверь саму границу и числа по обе стороны.","explanation":"Число −2 проходит обе нестрогие проверки. Числа левее не проходят x ≥ −2, а числа правее не проходят x ≤ −2. Решение — единственная точка −2."},{"id":"exp-n13-strict-exit","title":"После деления на отрицательное","type":"choice","skillId":"n13-boundaries","prompt":"Реши систему −2x < −6 и x ≤ 3.","options":[{"text":"Только число 3","correct":false},{"text":"Решений нет","correct":true},{"text":"Все x ≥ 3","correct":false},{"text":"Все x ≤ 3","correct":false}],"hint":"При делении первого неравенства на −2 меняется направление знака. Затем найди общую часть.","explanation":"Первое неравенство даёт x > 3, второе требует x ≤ 3. Они несовместимы. Число 3 не подходит строгому первому условию: получится −6 < −6."},{"id":"exp-n13-redundant-entry","title":"Три условия, одна общая часть","type":"number","skillId":"n13-intersection","prompt":"Число должно удовлетворять сразу трём условиям: x ≥ −1, x > −3, x < 4. Найди наименьшее целое решение.","answer":-1,"hint":"Сравни два нижних ограничения. Какое из них сильнее?","explanation":"Из x ≥ −1 уже следует x > −3, поэтому среднее условие ничего не добавляет. Общее решение [−1; 4). Наименьшее целое решение равно −1."},{"id":"exp-n13-redundant-exit","title":"Сократи систему и найди число","type":"number","skillId":"n13-intersection","prompt":"Реши систему 2x − 4 ≥ 0, −3x > −18, x ≥ 0. Укажи наибольшее целое решение.","answer":5,"hint":"Преобразуй первые два условия. Проверь, добавляет ли третье новое ограничение.","explanation":"Получаем x ≥ 2, x < 6 и x ≥ 0. Последнее условие уже следует из x ≥ 2. Общее решение [2; 6); наибольшее целое в нём — 5. Число 6 не подходит строгому второму условию."}],"creative":[{"id":"n13-c1","title":"Два числа в зеркале","prompt":"Подбери x и y так, чтобы одновременно выполнялись x < y и −x > −y. Сравни порядок исходных и противоположных чисел.","type":"build","skillId":"n13-scale","fields":[{"name":"x","label":"Первое число x","min":-6,"max":6,"step":1,"initial":0},{"name":"y","label":"Второе число y","min":-6,"max":6,"step":1,"initial":0}],"constants":{},"conditions":[{"left":"x","op":"lt","right":"y"},{"left":"-x","op":"gt","right":"-y"}],"exampleSolution":{"x":-3,"y":2},"hint":"Попробуй расположить x левее y. Где окажутся противоположные числа после отражения?","explanation":"Например, −3 < 2, но 3 > −2. Умножение на −1 отражает прямую относительно нуля и меняет порядок чисел."},{"id":"n13-c2","title":"Пограничный контроль","prompt":"Дано x = −2. Отметь все неравенства, которым удовлетворяет это значение x.","type":"multi","skillId":"n13-boundaries","options":[{"text":"x ≥ −2","correct":true},{"text":"x > −2","correct":false},{"text":"3x ≤ −6","correct":true},{"text":"−x < 2","correct":false}],"hint":"Подставь −2 в каждое условие. Строгий знак не допускает равенства.","explanation":"Верны x ≥ −2 и 3x ≤ −6: в обоих случаях на границе получается допустимое равенство. Для x > −2 и −x < 2 получается равенство при строгом знаке, поэтому они не выполнены."},{"id":"n13-c3","title":"Двойной пропуск","prompt":"Выбери x, который проходит две проверки сразу: 2x + 1 > 5 и 3x ≤ 15. Подойдёт любое число из их общего решения.","type":"build","skillId":"n13-intersection","fields":[{"name":"x","label":"Число x","min":0,"max":7,"initial":0}],"constants":{},"conditions":[{"left":"2*x+1","op":"gt","right":"5"},{"left":"3*x","op":"lte","right":"15"}],"exampleSolution":{"x":3},"hint":"Сначала найди границу для каждого условия, затем участок, где они выполнены вместе.","explanation":"Первое условие даёт x > 2, второе — x ≤ 5. Подходит любое доступное число из (2; 5], например 3. Число 2 не проходит первую проверку, а 5 проходит обе."},{"id":"exp-n13-strict-creative","originAtlasId":"13.1","title":"Строгое или нестрогое условие","type":"match","skillId":"n13-boundaries","prompt":"Сопоставь каждую систему с полным множеством решений. Проследи, когда единственная граничная точка исчезает и когда появляются другие подходящие числа. Учитывай все действительные числа.","pairs":[{"left":"x ≥ 3 и x ≤ 3","right":"Только точка 3"},{"left":"x > 3 и x ≤ 3","right":"Пустое множество"},{"left":"x ≥ 3 и x < 3","right":"Пустое множество"},{"left":"x > 3 и x ≤ 4","right":"Промежуток (3; 4]"}],"hint":"Сначала проверь точку 3. Если она исчезла, проверь, остались ли числа правее или левее, которые проходят оба условия.","explanation":"В первой системе остаётся ровно 3. Во второй и третьей замена одного знака на строгий исключает единственную общую точку: решений нет. Если верхнюю границу сдвинуть к 4, появляется целый промежуток (3; 4], например 3,5. Изменение строгости и изменение положения границы — разные действия.","matchOptions":["Промежуток (3; 4]","Только точка 3","Пустое множество","Промежуток [3; 4]"]},{"id":"exp-n13-redundant-creative","originAtlasId":"13.2","title":"Какое условие лишнее?","type":"build","skillId":"n13-intersection","prompt":"Система: 1) 2x + 1 > 5; 2) −x ≤ 0; 3) x + 3 ≤ 8. Укажи номер лишнего условия. Затем докажи, что первое и третье нужны: для удаления каждого придумай число, которое пройдёт два оставшихся условия, но нарушит удалённое.","fields":[{"name":"omit","label":"Номер лишнего условия","min":1,"max":3,"integer":true,"initial":1},{"name":"withoutFirst","label":"Если удалить условие 1, добавится число","min":-10,"max":10,"initial":0},{"name":"withoutThird","label":"Если удалить условие 3, добавится число","min":-10,"max":10,"initial":0}],"constants":{},"conditions":[{"left":"omit","op":"eq","right":"2"},{"left":"-withoutFirst","op":"lte","right":"0"},{"left":"withoutFirst+3","op":"lte","right":"8"},{"left":"2*withoutFirst+1","op":"lte","right":"5"},{"left":"2*withoutThird+1","op":"gt","right":"5"},{"left":"-withoutThird","op":"lte","right":"0"},{"left":"withoutThird+3","op":"gt","right":"8"}],"exampleSolution":{"omit":2,"withoutFirst":1,"withoutThird":6},"hint":"После преобразования условия имеют вид x > 2, x ≥ 0, x ≤ 5. Для обязательного условия найди число, которое именно оно отсеивает.","explanation":"Условие 2 лишнее: из x > 2 уже следует x ≥ 0. Если удалить первое, добавятся числа из [0; 2], например 1. Если удалить третье, добавятся числа больше 5, например 6. Поэтому первое и третье нужны, а удаление второго сохраняет общее решение (2; 5]. Принимаются все подходящие примеры в указанном диапазоне."}],"extensions":["Рассматривать ошибки со знаком через конкретное числовое значение, а не только запоминать правило.","Проверять границы подстановкой в исходное неравенство.","По желанию перейти к более сложным квадратным и дробным неравенствам в отдельной ветке."],"overviewTaskIds":["n13-q1","n13-q2","n13-q3","n13-q4"]},{"id":"n14","title":"№14. Последовательности и прогрессии","goal":"Короткий вход: распознать изменение, найти член прогрессии и простую сумму. Дополнительно можно восстанавливать правило по двум несоседним членам.","sourceHref":"/trainers/oge-task14-progressions.html","skills":[{"id":"n14-pattern","label":"Читать последовательность по порядку","requires":[],"evidence":"Различает номер члена и его значение.","relatedTasks":["n14-c1","n14-c3"],"relatedFamilies":["exam-geometric-time"],"separateCheck":false},{"id":"n14-difference","label":"Находить постоянную разность","requires":["n14-pattern"],"evidence":"Проверяет одинаковое изменение между соседними членами арифметической прогрессии."},{"id":"n14-index","label":"Находить член по его номеру","requires":["n14-difference"],"evidence":"Использует n − 1 переходов от первого члена к n-му."},{"id":"n14-sum","label":"Находить сумму арифметической прогрессии","requires":["n14-index"],"evidence":"Находит крайние члены и учитывает количество слагаемых."},{"id":"n14-ratio","label":"Находить постоянный множитель","requires":["n14-pattern"],"evidence":"Различает умножение на одно число и прибавление одного числа.","relatedTasks":["n14-c3"],"relatedFamilies":["exam-geometric-time"],"separateCheck":false},{"id":"n14-distinguish","label":"Выбирать правило роста","requires":["n14-difference","n14-ratio"],"evidence":"Сопоставляет последовательность с постоянной разностью или постоянным отношением."},{"id":"n14-time-steps","label":"Переводить длительность в число переходов","requires":["n14-pattern"],"evidence":"Различает начальный момент и первый переход; находит число полных промежутков изменения.","relatedTasks":[],"relatedFamilies":["exam-geometric-time"],"separateCheck":false},{"id":"n14-geometric-term","label":"Находить член геометрической прогрессии","requires":["n14-ratio","n8-powers"],"evidence":"Выбирает множитель и число его применений; проверяет случаи роста, убывания и нулевого числа переходов."}],"quick":[{"id":"n14-q1","title":"Пятый член","prompt":"В арифметической прогрессии первый член равен 3, разность равна 4. Найди пятый член.","type":"number","skillId":"n14-index","answer":19,"hint":"От первого до пятого члена нужно сделать четыре перехода.","explanation":"a₅ = 3 + (5 − 1) · 4 = 3 + 16 = 19."},{"id":"n14-q2","title":"Каждый раз вдвое","prompt":"Первый член геометрической прогрессии равен 3. Каждый следующий в 2 раза больше предыдущего. Найди пятый член.","type":"number","skillId":"n14-geometric-term","answer":48,"hint":"Запиши первые члены: 3, 6, … Сосчитай именно пять членов.","explanation":"Последовательность начинается так: 3, 6, 12, 24, 48. Пятый член равен 3 · 2⁴ = 48."},{"id":"n14-q3","title":"Места в зале","prompt":"В первом ряду 12 мест, в каждом следующем на 2 места больше. Всего 8 рядов. Сколько мест во всех рядах?","type":"number","skillId":"n14-sum","answer":152,"unit":"места","hint":"В восьмом ряду 12 + 7 · 2 мест. Используй первый и последний ряд.","explanation":"Восьмой ряд содержит 26 мест. Сумма равна (12 + 26) · 8 / 2 = 152."},{"id":"n14-q4","title":"Убывающий ряд","prompt":"В арифметической прогрессии a₁ = 20, d = −3. Найди a₆.","type":"number","skillId":"n14-index","answer":5,"hint":"От первого до шестого члена пять раз прибавляют −3.","explanation":"a₆ = 20 + (6 − 1) · (−3) = 20 − 15 = 5."},{"id":"exp-n14-diary-entry","title":"Сколько переходов до четвёртого?","type":"number","skillId":"n14-index","prompt":"В арифметической прогрессии a₁ = −2 и d = 5. Найди a₄.","answer":13,"hint":"От первого члена до четвёртого три перехода.","explanation":"a₄ = a₁ + 3d = −2 + 3 · 5 = 13. Последовательность начинается −2, 3, 8, 13. Четыре члена содержат три перехода между соседями."},{"id":"exp-n14-diary-exit","title":"Шестой член","type":"number","skillId":"n14-index","prompt":"Первый член арифметической прогрессии равен 7, разность равна 4. Найди шестой член.","answer":27,"hint":"Начальное значение уже является первым членом. Сколько прибавлений нужно до шестого?","explanation":"a₆ = 7 + (6 − 1) · 4 = 7 + 20 = 27. Пять переходов дают шестое значение; прибавление шести разностей привело бы к седьмому."},{"id":"exp-n14-pairs-entry","title":"Шесть слагаемых","type":"number","skillId":"n14-sum","prompt":"Найди сумму первых шести членов арифметической прогрессии: 2, 6, 10, 14, 18, 22.","answer":72,"hint":"Сравни суммы первого и последнего, второго и предпоследнего членов.","explanation":"Пары (2; 22), (6; 18), (10; 14) дают по 24. Три пары дают 3 · 24 = 72. То же выражает формула 6 · (2 + 22)/2."},{"id":"exp-n14-pairs-exit","title":"Сумма по краям и количеству","type":"number","skillId":"n14-sum","prompt":"В арифметической прогрессии восемь членов. Первый равен 3, последний — 17. Найди сумму всех восьми членов.","answer":80,"hint":"Крайние члены образуют пару с суммой 20. Сколько непересекающихся пар получится из восьми членов?","explanation":"Четыре пары крайних членов имеют сумму 3 + 17 = 20 каждая. Общая сумма равна 4 · 20 = 80. По формуле: 8 · (3 + 17)/2 = 80. Разность здесь равна (17 − 3)/7 = 2, данные согласованы."}],"creative":[{"id":"n14-c1","title":"Две станции неизвестного ряда","prompt":"У арифметической прогрессии a₃ = 8 и a₇ = 20. Настрой первый член a и разность d так, чтобы выполнялись оба заданных равенства.","type":"build","skillId":"n14-index","fields":[{"name":"a","label":"Первый член a","min":-10,"max":20,"step":1,"initial":0},{"name":"d","label":"Разность d","min":-6,"max":6,"step":1,"initial":0}],"constants":{},"conditions":[{"left":"a+2*d","op":"eq","right":"8"},{"left":"a+6*d","op":"eq","right":"20"}],"exampleSolution":{"a":2,"d":3},"hint":"Между третьим и седьмым членами четыре одинаковых перехода. Их общая прибавка равна 20 − 8.","explanation":"4d = 12, поэтому d = 3. Из a + 2 · 3 = 8 получаем a = 2. Проверка: 2 + 6 · 3 = 20."},{"id":"n14-c2","title":"Собери убывающий маршрут","prompt":"Расставь карточки: начинаем с 12 и на каждом шаге вычитаем 3.","type":"order","skillId":"n14-difference","items":["6","0","12","3","9"],"answer":["12","9","6","3","0"],"hint":"У каждой следующей карточки значение на 3 меньше предыдущей.","explanation":"Верный маршрут: 12, 9, 6, 3, 0. Разность соседних членов равна −3."},{"id":"n14-c3","title":"Узнай механизм роста","prompt":"Соедини каждую последовательность с правилом перехода к следующему члену.","type":"match","skillId":"n14-distinguish","pairs":[{"left":"2; 5; 8; 11; …","right":"Прибавлять 3"},{"left":"2; 6; 18; 54; …","right":"Умножать на 3"},{"left":"20; 16; 12; 8; …","right":"Вычитать 4"},{"left":"32; 16; 8; 4; …","right":"Делить на 2"}],"hint":"Проверь правило на двух соседних переходах, а не только на первом.","explanation":"Постоянная разность задаёт арифметическую прогрессию, постоянный ненулевой множитель — геометрическую. Проверка нескольких переходов помогает различить эти правила."},{"id":"exp-n14-diary-creative","originAtlasId":"14.1","title":"Нумерация с нуля и с единицы","type":"match","skillId":"n14-index","prompt":"Один ряд 10, 13, 16, 19, 22, … записали двумя способами. В первом нумерация начинается с a₁ = 10, во втором — с b₀ = 10. Соедини обозначения, которые относятся к одному и тому же значению.","pairs":[{"left":"a₁","right":"b₀ = 10"},{"left":"a₃","right":"b₂ = 16"},{"left":"a₄","right":"b₃ = 19"},{"left":"a₅","right":"b₄ = 22"}],"hint":"Начальное значение одинаково, но его номера различаются на один. Считай переходы от значения 10.","explanation":"После n − 1 переходов в первой записи получаем aₙ, во второй — bₙ₋₁. Поэтому a₁ = b₀ = 10, a₃ = b₂ = 16, a₄ = b₃ = 19, a₅ = b₄ = 22. Индекс сообщает место в принятой нумерации, а не саму величину."},{"id":"exp-n14-pairs-creative","originAtlasId":"14.2","title":"Сумма пар крайних членов","type":"build","skillId":"n14-sum","prompt":"Даны семь членов арифметической прогрессии: 1, 4, 7, 10, 13, 16, 19. Соединяй первый с последним, второй с предпоследним и так далее, не используя число дважды. Собери расчёт суммы; средний непарный член учитывай отдельно.","fields":[{"name":"pairs","label":"Сколько полных пар","min":0,"max":7,"integer":true,"initial":0},{"name":"pairSum","label":"Сумма в каждой паре","min":0,"max":40,"initial":0},{"name":"middle","label":"Значение непарного среднего члена","min":0,"max":20,"initial":0},{"name":"total","label":"Общая сумма","min":0,"max":150,"initial":0}],"constants":{},"conditions":[{"left":"2*pairs+1","op":"eq","right":"7"},{"left":"pairSum","op":"eq","right":"1+19"},{"left":"middle","op":"eq","right":"10"},{"left":"total","op":"eq","right":"pairs*pairSum+middle"}],"exampleSolution":{"pairs":3,"pairSum":20,"middle":10,"total":70},"hint":"Суммы 1 + 19, 4 + 16 и 7 + 13 одинаковы. Средний член не образует пару сам с собой.","explanation":"Получаются три пары с суммой 20 и отдельный средний член 10. Итого 3 · 20 + 10 = 70. Формула 7 · (1 + 19)/2 даёт тот же результат. Число 7/2 в формуле не означает, что в исходном ряду есть три с половиной непересекающиеся пары."}],"extensions":["Сравнивать постоянную прибавку и постоянный множитель на одинаковом начальном значении.","Самостоятельно задавать первый член и правило, затем предлагать другому ученику восстановить их.","Отдельно разбирать суммы и прикладные задачи; четыре коротких задания не охватывают все экзаменационные прототипы."],"overviewTaskIds":["n14-q1","n14-q2","n14-q3","n14-q4"]},{"id":"n15","title":"№15 · Треугольники","goal":"Потренировать несколько основных связей в треугольнике: углы, стороны, высоту и площадь. Этот маршрут не охватывает все подтипы задания №15.","sourceHref":"/trainers/oge-task15-triangles.html","skills":[{"id":"n15-angles","label":"Находить угол по сумме углов треугольника","requires":[],"evidence":"Находит неизвестный угол по двум данным и проверяет, что все три угла положительны и дают в сумме 180°."},{"id":"n15-sides","label":"Проверять, существует ли треугольник с данными сторонами","requires":[],"evidence":"Для третьей стороны использует строгие границы: больше разности большей и меньшей сторон и меньше их суммы."},{"id":"n15-right","label":"Находить сторону прямоугольного треугольника","requires":[],"evidence":"Различает катеты и гипотенузу, составляет равенство квадратов сторон и получает положительную длину."},{"id":"n15-area","label":"Выбирать высоту к основанию и считать площадь","requires":[],"evidence":"Использует перпендикулярную высоту, в том числе расположенную вне треугольника, и делит произведение основания на высоту пополам."},{"id":"n15-conditions","label":"Отличать данное в условии от впечатления по рисунку","requires":[],"evidence":"Из равенства двух сторон выводит равенство противоположных углов, но не приписывает треугольнику лишних свойств."},{"id":"n15-area-ratio","label":"Сравнивать площади при общей высоте","requires":["n15-area"],"evidence":"Использует отношение оснований для сравнения площадей треугольников с общей высотой и распределяет заданную общую площадь."}],"quick":[{"id":"n15-q-angle","title":"Третий угол","prompt":"В треугольнике два угла равны 47° и 68°. Найди третий угол.","type":"number","skillId":"n15-angles","answer":65,"unit":"°","hint":"Сложи известные углы и сравни их сумму с 180°.","explanation":"Сумма углов треугольника равна 180°. Третий угол: 180 − 47 − 68 = 65°."},{"id":"n15-q-pythagoras","title":"Какая сторона напротив прямого угла?","prompt":"В треугольнике ABC угол C прямой, AC = 6 см, BC = 8 см. Найди длину AB.","type":"choice","skillId":"n15-right","options":[{"text":"9 см","correct":false},{"text":"10 см","correct":true},{"text":"12 см","correct":false},{"text":"14 см","correct":false}],"visual":{"kind":"polygon","points":[[0,0],[6,0],[0,8]],"labels":["C","A","B"],"grid":false},"hint":"AB лежит напротив прямого угла. Квадрат этой стороны равен сумме квадратов двух остальных.","explanation":"AB — гипотенуза. AB² = 6² + 8² = 36 + 64 = 100, поэтому AB = 10 см."},{"id":"n15-q-area-match","title":"Основание встретилось со своей высотой","prompt":"Сопоставь условия с площадями треугольников. Все длины указаны в сантиметрах, каждая высота проведена именно к указанному основанию.","type":"match","skillId":"n15-area","pairs":[{"left":"Основание 8, высота 3","right":"12 см²"},{"left":"Основание 5, высота 6","right":"15 см²"},{"left":"Основание 10, высота 4","right":"20 см²"}],"hint":"Площадь треугольника — половина произведения основания на высоту к нему.","explanation":"Получаем 8 · 3 / 2 = 12, 5 · 6 / 2 = 15 и 10 · 4 / 2 = 20 см²."},{"id":"n15-q-isosceles","title":"Что известно наверняка?","prompt":"В треугольнике ABC дано только AB = AC. Рисунок служит схемой. Выбери все утверждения, которые обязательно следуют из условия
