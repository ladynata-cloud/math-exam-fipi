name: Atanasyan textbook — source, proof and interactive course
on:
  pull_request:
    paths: ['stereo-course/textbook/**', 'stereo-course/assets/**', 'geometry-merzlyak/assets/viewer.js', 'geometry-pogorelov/assets/viewer.js', 'tools/stereo-textbook/**', '.github/workflows/atanasyan-textbook.yml']
permissions:
  contents: read
jobs:
  source-model:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.62.1 jsdom@26.1.0 ajv@8.17.1 ajv-formats@3.0.1
      - run: python3 -m pip install numpy==2.2.6
      - name: Exact reviewed surface profiles and shared offline visibility core
        run: |
          node tools/stereo-textbook/build_visibility_profiles.cjs --check
          node tools/stereo/sync_canvas_visibility.cjs --check
          node tools/stereo/canvas-visibility.test.cjs
          VISIBILITY_CHECK_ONLY=1 node tools/stereo-textbook/visibility.browser.cjs
          VISIBILITY_CANVAS_CHECK_ONLY=1 node tools/stereo/canvas-visibility.browser.cjs
      - name: Source catalogue and reproducible build
        run: |
          python3 tools/stereo-textbook/build_textbook.py
          git diff --exit-code -- stereo-course/textbook/data/course.json
          python3 tools/stereo-textbook/catalog.test.py
          node tools/stereo-textbook/schema.test.cjs
          node tools/stereo-textbook/companion-migration.test.cjs
          node tools/stereo-textbook/visibility-migration.test.cjs
          node tools/stereo-textbook/companion-labels.test.cjs
          node tools/stereo-textbook/content.test.cjs
          node tools/stereo-textbook/parallel-content.test.cjs
          node tools/stereo-textbook/model-geometry.test.cjs
          python3 tools/stereo-textbook/regular-polyhedra-math.test.py
          python3 tools/stereo-textbook/polyhedra-symmetry-math.test.py
          python3 tools/stereo-textbook/polyhedra-selfcheck-math.test.py
          python3 tools/stereo-textbook/polyhedra-practical-math.test.py
          python3 tools/stereo-textbook/additional288-math.test.py
          python3 tools/stereo-textbook/additional294-math.test.py
          python3 tools/stereo-textbook/additional299-math.test.py
          python3 tools/stereo-textbook/additional310-math.test.py
          python3 tools/stereo-textbook/cylinder-math.test.py
      - name: Retained work, nested theory and publication boundaries
        run: node tools/stereo-textbook/runtime.test.cjs
      - name: Exact partitions, collector failures and browser-free preflight
        run: |
          node tools/stereo-textbook/browser-shards.test.cjs
          TEXTBOOK_CHECK_ONLY=1 node tools/stereo-textbook/browser.cjs
          for i in 0 1 2 3; do
            TEXTBOOK_CHECK_ONLY=1 TEXTBOOK_SHARD_COUNT=4 TEXTBOOK_SHARD_INDEX=$i node tools/stereo-textbook/browser.cjs
          done
      - run: git diff --check
  visibility-math:
    needs: source-model
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        course: [textbook, merzlyak-10-base, shestakov-yaschenko-10-11]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --ignore-scripts jsdom@26.1.0
      - name: Independently verify hidden and visible intervals at multiple camera angles
        env:
          VISIBILITY_BUNDLE: stereo-course/${{ matrix.course }}/data/course.json
        run: node tools/stereo-textbook/visibility-math.test.cjs
  visibility-browser:
    needs: source-model
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - name: Actual reported figure, source surfaces, rotations and dash pixels
        env:
          VISIBILITY_ARTIFACTS: artifacts/visibility
        run: node tools/stereo-textbook/visibility.browser.cjs
      - name: Actual workshop and atlas canvases, manual lines and sphere sections
        if: ${{ !cancelled() }}
        env:
          VISIBILITY_CANVAS_ARTIFACTS: artifacts/visibility-canvas
        run: node tools/stereo/canvas-visibility.browser.cjs
      - name: Preserve focused visibility evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stereometry-visibility-focused
          path: artifacts/visibility/
          retention-days: 7
          if-no-files-found: error
      - name: Preserve actual canvas visibility screenshots and source identity
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stereometry-visibility-canvas
          path: artifacts/visibility-canvas/
          retention-days: 7
          if-no-files-found: error
  shared-consumers:
    needs: source-model
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - tools: merzlyak-10-base
            course: merzlyak-10-base
          - tools: shestakov-yaschenko
            course: shestakov-yaschenko-10-11
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.62.1 jsdom@26.1.0 ajv@8.17.1 ajv-formats@3.0.1
      - run: npx playwright install --with-deps chromium
      - name: Preserve Merzlyak source and retained-work contracts
        if: matrix.tools == 'merzlyak-10-base'
        run: |
          node tools/merzlyak-10-base/schema-runtime.test.cjs
          node tools/merzlyak-10-base/reviewer-runtime-wrapper-checks.cjs
      - name: Preserve Shestakov source and retained-work contracts
        if: matrix.tools == 'shestakov-yaschenko'
        run: |
          python3 tools/shestakov-yaschenko/build.py --check
          node tools/shestakov-yaschenko/check.cjs
          node tools/shestakov-yaschenko/runtime-browser.cjs
          node tools/shestakov-yaschenko/ch1-completion-browser.cjs
      - name: Check every shared consumer model and its authored views
        run: |
          node tools/stereo-textbook/model-geometry.test.cjs stereo-course/${{ matrix.course }}/data/course.json
          node tools/${{ matrix.tools }}/model-browser.cjs
      - name: Preserve shared-renderer consumer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: visibility-shared-${{ matrix.tools }}
          path: artifacts/
          retention-days: 7
          if-no-files-found: error
  canvas-consumers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        course: [merzlyak, pogorelov]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - name: Preserve source mathematics and stored work in existing canvas courses
        run: node tools/${{ matrix.course }}/check.cjs
      - name: Complete existing canvas lessons, mobile and offline journeys
        run: node tools/${{ matrix.course }}/browser.cjs
  browser-shard:
    needs: source-model
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.62.1 jsdom@26.1.0 ajv@8.17.1 ajv-formats@3.0.1
      - run: npx playwright install --with-deps chromium
      - name: Complete assigned lessons at both widths, retained work and models
        env:
          TEXTBOOK_ARTIFACTS: artifacts/textbook
          TEXTBOOK_SHARD_COUNT: '4'
          TEXTBOOK_SHARD_INDEX: ${{ matrix.shard }}
        run: node tools/stereo-textbook/browser.cjs
      - name: Collect focused additional-task images
        if: always()
        run: |
          python3 - <<'PYCODE'
          import shutil
          from pathlib import Path
          source = Path('artifacts/textbook')
          output = Path('artifacts/additional-288-293')
          output.mkdir(parents=True, exist_ok=True)
          for image in source.glob('additional-*.png'):
              shutil.copy2(image, output / image.name)
          evidence = source / 'browser-evidence.json'
          if evidence.is_file():
              shutil.copy2(evidence, output / evidence.name)
          PYCODE
      - name: Preserve focused additional-task evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atanasyan-288-293-shard-${{ matrix.shard }}
          path: artifacts/additional-288-293/
          retention-days: 7
          if-no-files-found: ignore
      - name: Collect focused prism continuation images
        if: always()
        run: |
          python3 - <<'PYCODE'
          import shutil
          from pathlib import Path
          source = Path('artifacts/textbook')
          output = Path('artifacts/additional-294-298')
          output.mkdir(parents=True, exist_ok=True)
          for image in source.glob('prisms-29[4-8]-*.png'):
              shutil.copy2(image, output / image.name)
          evidence = source / 'browser-evidence.json'
          if evidence.is_file():
              shutil.copy2(evidence, output / evidence.name)
          PYCODE
      - name: Preserve focused prism continuation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atanasyan-294-298-shard-${{ matrix.shard }}
          path: artifacts/additional-294-298/
          retention-days: 7
          if-no-files-found: ignore
      - name: Collect focused pyramid continuation images
        if: always()
        run: |
          python3 - <<'PYCODE'
          import shutil
          from pathlib import Path
          source = Path('artifacts/textbook')
          output = Path('artifacts/additional-299-309')
          output.mkdir(parents=True, exist_ok=True)
          for image in source.glob('pyramids-*.png'):
              shutil.copy2(image, output / image.name)
          evidence = source / 'browser-evidence.json'
          if evidence.is_file():
              shutil.copy2(evidence, output / evidence.name)
          PYCODE
      - name: Preserve focused pyramid continuation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atanasyan-299-309-shard-${{ matrix.shard }}
          path: artifacts/additional-299-309/
          retention-days: 7
          if-no-files-found: ignore
      - name: Collect focused chapter III final images
        if: always()
        run: |
          python3 - <<'PYCODE'
          import shutil
          from pathlib import Path
          source = Path('artifacts/textbook')
          output = Path('artifacts/additional-310-319')
          output.mkdir(parents=True, exist_ok=True)
          for image in source.glob('chapter3-final-*.png'):
              shutil.copy2(image, output / image.name)
          evidence = source / 'browser-evidence.json'
          if evidence.is_file():
              shutil.copy2(evidence, output / evidence.name)
          PYCODE
      - name: Preserve focused chapter III final evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atanasyan-310-319-shard-${{ matrix.shard }}
          path: artifacts/additional-310-319/
          retention-days: 7
          if-no-files-found: ignore
      - name: Collect focused cylinder images
        if: always()
        run: |
          python3 - <<'PYCODE'
          import shutil
          from pathlib import Path
          source = Path('artifacts/textbook')
          output = Path('artifacts/cylinder-320-345')
          output.mkdir(parents=True, exist_ok=True)
          for image in source.glob('cylinder-*.png'):
              shutil.copy2(image, output / image.name)
          evidence = source / 'browser-evidence.json'
          if evidence.is_file():
              shutil.copy2(evidence, output / evidence.name)
          PYCODE
      - name: Preserve focused cylinder evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atanasyan-cylinder-320-345-shard-${{ matrix.shard }}
          path: artifacts/cylinder-320-345/
          retention-days: 7
          if-no-files-found: ignore
      - name: Preserve each shard including failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atanasyan-textbook-shard-${{ matrix.shard }}
          path: artifacts/textbook/
          retention-days: 7
          if-no-files-found: error
  collect-browser:
    needs: [source-model, browser-shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require every preceding job to succeed
        env:
          SOURCE_RESULT: ${{ needs.source-model.result }}
          BROWSER_RESULT: ${{ needs.browser-shard.result }}
        run: test "$SOURCE_RESULT" = success && test "$BROWSER_RESULT" = success
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      # Official v8.0.2 pin: https://github.com/actions/download-artifact/tree/9000827ccba6bdab643e8b6fd33ac0654aef8333
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: atanasyan-textbook-shard-*
          path: artifacts/shards
          merge-multiple: false
      - name: Verify exact union and provenance, then build flat evidence artifact
        env:
          TEXTBOOK_SHARD_INPUT: artifacts/shards
          TEXTBOOK_ARTIFACTS: artifacts/textbook
          TEXTBOOK_SHARD_COUNT: '4'
        run: node tools/stereo-textbook/browser-collect.cjs
      - name: Preserve combined actual browser evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atanasyan-textbook-visuals
          path: artifacts/textbook/
          retention-days: 7
          if-no-files-found: error
